<script>
/* ===================== MOTORUL FOTOMETRIC =====================
   Totul într-o singură funcție, ca să ruleze identic în pagină și în Web Worker
   (workerul primește textul ei). Unități: metri, lumeni, candele, lucși.
   Convenții: γ=0 = nadir (în jos), C=0 = axa x locală a corpului ("fața"), C crește trigonometric.
   Orientarea corpului: rotire (yaw) în jurul verticalei, apoi înclinare (tilt) a axei optice spre C=0. */
function ENGINE(){
'use strict';
const D=Math.PI/180;
const num=s=>{const v=parseFloat(String(s==null?'':s).trim().replace(',','.'));return isFinite(v)?v:0;};
const r2=v=>Math.round(v*100)/100;

/* ---------- interpolare pe tabelul brut (unghiuri C oarecare, γ oarecare) ---------- */
function gInt(row,G,g){const n=G.length;if(n===1)return row[0];if(g<=G[0])return row[0];
 if(g>=G[n-1])return (g>G[n-1]+1e-9&&G[n-1]<180)?0:row[n-1];
 let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(G[m]<=g)lo=m;else hi=m;}
 const t=(g-G[lo])/((G[hi]-G[lo])||1);return row[lo]+(row[hi]-row[lo])*t;}
function interpRaw(f,c,g){const C=f.C,n=C.length;if(n===1)return gInt(f.I[0],f.G,g);c=((c%360)+360)%360;
 let k0,k1,t;
 if(c>=C[n-1]||c<C[0]){k0=n-1;k1=0;const span=C[0]+360-C[n-1];const dc=c>=C[n-1]?c-C[n-1]:c+360-C[n-1];t=span>0?dc/span:0;}
 else{let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(C[m]<=c)lo=m;else hi=m;}k0=lo;k1=hi;t=(c-C[lo])/((C[hi]-C[lo])||1);}
 const a=gInt(f.I[k0],f.G,g),b=gInt(f.I[k1],f.G,g);return a+(b-a)*t;}
/* fluxul total al unui tabel de intensități: Φ = ∬ I(C,γ)·sinγ dγ dC */
function integ(f){const asym=f.C.length>1;const nC=asym?72:1,dC=asym?5*D:2*Math.PI;let s=0;
 for(let i=0;i<nC;i++){const c=i*5;for(let j=0;j<360;j++){const g=(j+0.5)*0.5;s+=Math.max(0,interpRaw(f,c,g))*Math.sin(g*D)*(0.5*D);}}return s*dC;}
/* aduce tabelul la cd / 1000 lm ieșiți din corp; întoarce fluxul tabelului inițial */
function normalize(f){const F=integ(f);if(!(F>0))throw new Error('Distribuția are flux zero.');const k=1000/F;f.I=f.I.map(r=>r.map(v=>r2(Math.max(0,v)*k)));return F;}

/* ---------- EULUMDAT (.ldt) ---------- */
function parseLDT(txt){
 const L=String(txt).replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n');let i=0;
 const s=()=>(L[i++]||'').trim(),n=()=>num(s());
 const r={firma:s()};r.ityp=Math.round(n());r.isym=Math.round(n());r.Mc=Math.round(n());r.Dc=n();r.Ng=Math.round(n());r.Dg=n();
 r.raport=s();r.nume=s();r.numar=s();r.fisier=s();r.data=s();
 r.L=n();r.B=n();r.H=n();r.La=n();r.Ba=n();for(let k=0;k<4;k++)n();
 r.dff=n();r.lor=n();r.conv=n()||1;r.tiltMas=n();const ns=Math.max(0,Math.min(20,Math.round(n())));r.lampi=[];
 for(let k=0;k<ns;k++)r.lampi.push({nr:n(),tip:s(),flux:n(),cct:s(),cri:s(),w:n()});
 const rest=[];for(;i<L.length;i++)for(const t of L[i].trim().split(/\s+/)){if(!t)continue;const v=parseFloat(t.replace(',','.'));if(isFinite(v))rest.push(v);}
 if(!(r.Mc>=1)||!(r.Ng>=2)||r.isym<0||r.isym>4)throw new Error('Antet .ldt nevalid (Mc='+r.Mc+', Ng='+r.Ng+', Isym='+r.isym+').');
 let p=10;const C=rest.slice(p,p+r.Mc);p+=r.Mc;const G=rest.slice(p,p+r.Ng);p+=r.Ng;
 const nPl=r.isym===1?1:(r.isym===2||r.isym===3)?Math.floor(r.Mc/2)+1:r.isym===4?Math.floor(r.Mc/4)+1:r.Mc;
 const pl=[];for(let k=0;k<nPl;k++){pl.push(rest.slice(p,p+r.Ng).map(v=>v*r.conv));p+=r.Ng;}
 if(C.length<r.Mc||G.length<r.Ng||pl[nPl-1].length<r.Ng)throw new Error('Fișierul .ldt e incomplet: lipsesc valori de intensitate.');
 const Dc=r.Dc>0?r.Dc:(r.Mc>1?(C[1]-C[0]):360);
 let Cf,If;
 if(r.isym===1){Cf=[0];If=[pl[0]];}
 else{Cf=C.slice();If=Cf.map(c=>{let k;
  if(r.isym===0)k=Cf.indexOf(c);
  else if(r.isym===2){const c2=c<=180?c:360-c;k=Math.round(c2/Dc);}
  else if(r.isym===3){let c2=c;if(c>90&&c<270)c2=((180-c)%360+360)%360;k=Math.round((((c2-270)%360)+360)%360/Dc);}
  else{let c2=c;if(c>90&&c<=180)c2=180-c;else if(c>180&&c<=270)c2=c-180;else if(c>270)c2=360-c;k=Math.round(c2/Dc);}
  return pl[Math.max(0,Math.min(pl.length-1,k))];});}
 const f={C:Cf,G:G.slice(),I:If.map(x=>x.slice())};
 if(f.G[f.G.length-1]<180){const gl=f.G[f.G.length-1];f.G.push(Math.min(180,gl+0.5));f.I.forEach(row=>row.push(0));if(gl+0.5<180){f.G.push(180);f.I.forEach(row=>row.push(0));}}
 const F=normalize(f);const fl=r.lampi.reduce((a,b)=>a+b.flux,0);const w=r.lampi.reduce((a,b)=>a+b.w,0);
 const flux=fl>0?fl*F/1000:F;
 return Object.assign(f,{sursa:'ldt',flux:Math.round(flux*10)/10,fluxLampi:fl,putere:w,nume:r.nume,firma:r.firma,numar:r.numar,lor:r.lor,cct:(r.lampi[0]||{}).cct||'',cri:(r.lampi[0]||{}).cri||'',dim:{L:r.L,B:r.B,H:r.H},isym:r.isym,
  nota:'EULUMDAT, Isym '+r.isym+', '+r.Mc+' planuri C × '+r.Ng+' unghiuri γ'});}

/* ---------- IES LM-63 (1995/2002/2019) ---------- */
function parseIES(txt){
 const lines=String(txt).replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n');const meta={};let k=0;
 for(;k<lines.length;k++){const ln=lines[k].trim();const m=ln.match(/^\[(\w+)\]\s*(.*)$/);if(m)meta[m[1].toUpperCase()]=m[2];if(/^TILT\s*=/i.test(ln))break;}
 if(k>=lines.length)throw new Error('Fișierul .ies nu are linia „TILT=".');
 const tilt=lines[k].split('=').slice(1).join('=').trim().toUpperCase();
 const tok=lines.slice(k+1).join(' ').trim().split(/[\s,]+/).filter(Boolean).map(Number);let p=0;
 if(tilt==='INCLUDE'){p++;const na=tok[p++]|0;p+=2*na;}
 const nl=tok[p++],lmL=tok[p++],mult=tok[p++]||1,nV=tok[p++]|0,nH=tok[p++]|0,ptype=tok[p++]|0;p++;/*unități*/const w=tok[p++],l=tok[p++],h=tok[p++];
 const bf=tok[p++]||1;p++;const watts=tok[p++]||0;
 if(!(nV>=2)||!(nH>=1))throw new Error('Antet .ies nevalid (unghiuri verticale='+nV+', orizontale='+nH+').');
 const V=tok.slice(p,p+nV);p+=nV;const H=tok.slice(p,p+nH);p+=nH;
 const cand=[];for(let j=0;j<nH;j++){const row=tok.slice(p,p+nV).map(v=>v*mult*bf);p+=nV;cand.push(row);}
 if(cand.length<nH||cand[nH-1].length<nV||cand[nH-1].some(v=>!isFinite(v)))throw new Error('Fișierul .ies e incomplet: lipsesc valori de candele.');
 const av=[];if(ptype!==1)av.push('Fotometrie de tip '+(ptype===2?'B':'A')+' — tratată ca tip C (aproximativ).');
 let G=V.slice(),rows=cand.map(r=>r.slice());
 if(G[0]>0){const g0=G[0];G=[0,Math.max(0,g0-0.5)].concat(G);rows=rows.map(r=>[0,0].concat(r));if(g0-0.5<=0){G.splice(1,1);rows=rows.map(r=>{r.splice(1,1);return r;});}}
 if(G[G.length-1]<180){const gl=G[G.length-1];G.push(Math.min(180,gl+0.5));rows.forEach(r=>r.push(0));if(gl+0.5<180){G.push(180);rows.forEach(r=>r.push(0));}}
 const last=H[nH-1],first=H[0];let Cf,map;
 const find=c=>{let bi=0,bd=1e9;H.forEach((x,i)=>{const d=Math.abs(x-c);if(d<bd){bd=d;bi=i;}});return rows[bi];};
 if(nH===1){Cf=[0];map=()=>rows[0];}
 else if(Math.abs(last-90)<1e-6&&Math.abs(first)<1e-6){const s=new Set();H.forEach(x=>{s.add(x);s.add(180-x);s.add(180+x);s.add((360-x)%360);});Cf=[...s].filter(x=>x<360).sort((a,b)=>a-b);
  map=c=>find(c<=90?c:c<=180?180-c:c<=270?c-180:360-c);}
 else if(Math.abs(last-180)<1e-6&&Math.abs(first)<1e-6){const s=new Set();H.forEach(x=>{s.add(x);s.add((360-x)%360);});Cf=[...s].sort((a,b)=>a-b);map=c=>find(c<=180?c:360-c);}
 else if(Math.abs(first-90)<1e-6&&Math.abs(last-270)<1e-6){const s=new Set();H.forEach(x=>{s.add(x);s.add(((180-x)%360+360)%360);});Cf=[...s].sort((a,b)=>a-b);map=c=>find(c>=90&&c<=270?c:((180-c)%360+360)%360);}
 else{Cf=H.filter(x=>x<360-1e-6);map=c=>find(c);}
 const f={C:Cf,G,I:Cf.map(c=>map(c).slice())};
 const F=normalize(f);
 return Object.assign(f,{sursa:'ies',flux:Math.round(F*10)/10,fluxLampi:lmL>0?nl*lmL:null,putere:watts,nume:meta.LUMINAIRE||meta.LUMCAT||'',firma:meta.MANUFAC||'',numar:meta.LUMCAT||'',dim:{L:l,B:w,H:h},avert:av,
  nota:'IES LM-63, '+nH+' planuri orizontale × '+nV+' unghiuri verticale'+(lmL<0?' (fotometrie absolută)':'')});}

/* ---------- modele aproximative (fără fișier fotometric) ---------- */
function approx(opt,unghi){const G=[];for(let g=0;g<=180;g+=2.5)G.push(g);let C=[0],fn;
 const ex=b=>{const h=Math.max(2,Math.min(80,(b||60)/2))*D;return Math.log(0.5)/Math.log(Math.cos(h));};
 if(opt==='spot'||opt==='proiector'||opt==='flood'){const e=ex(unghi||(opt==='flood'?90:30));fn=(c,g)=>g<90?Math.pow(Math.cos(g*D),e):0;}
 else if(opt==='asim360'){fn=(c,g)=>g<=90?Math.exp(-Math.pow((g-68)/14,2))*Math.max(0,Math.min(1,(90-g)/4)):0;}
 else if(opt==='asim180'){C=[];for(let c=0;c<360;c+=5)C.push(c);
  fn=(c,g)=>{const cd=Math.abs(((c+180)%360)-180);const fc=cd<=70?1:cd>=100?0:0.5+0.5*Math.cos((cd-70)/30*Math.PI);return g<=90?fc*Math.exp(-Math.pow((g-62)/16,2))*Math.max(0,Math.min(1,(90-g)/4)):0;};}
 else if(opt==='larg'){fn=(c,g)=>g<88?(0.55*Math.cos(g*D)+0.6*Math.exp(-Math.pow((g-58)/16,2))):0;}
 else fn=(c,g)=>g<90?Math.cos(g*D):0; /* lambertian */
 const f={C,G,I:C.map(c=>G.map(g=>Math.max(0,fn(c,g)))),sursa:'aprox'};normalize(f);return f;}

/* ---------- tabel uniform (5° în C, 1° în γ) pentru calcul rapid ---------- */
function prep(f){const nc=f.C.length===1?1:72,ng=181,T=new Float32Array(nc*ng);let mx=0;
 for(let i=0;i<nc;i++)for(let j=0;j<ng;j++){const v=Math.max(0,interpRaw(f,i*5,j));T[i*ng+j]=v;if(v>mx)mx=v;}const o={nc,ng,T,max:mx};if(nc===1){const Tc=new Float32Array(4001);for(let i=0;i<=4000;i++)Tc[i]=look(o,0,Math.acos(i/2000-1)/D);o.Tc=Tc;}return o;}
function look(p,c,g){const ng=p.ng,T=p.T;let gj=g<0?0:g>180?180:g;const j0=Math.min(179,Math.floor(gj)),j1=j0+1,tg=gj-j0;
 if(p.nc===1)return T[j0]+(T[j1]-T[j0])*tg;
 let cc=c/5;cc=((cc%72)+72)%72;const i0=Math.floor(cc)%72,i1=(i0+1)%72,tc=cc-Math.floor(cc);
 const a=T[i0*ng+j0]+(T[i0*ng+j1]-T[i0*ng+j0])*tg,b=T[i1*ng+j0]+(T[i1*ng+j1]-T[i1*ng+j0])*tg;return a+(b-a)*tc;}

/* intensitatea (cd) a unui corp spre punctul (px,py,pz); l are x,y,z,yaw,tilt,k(=Φ/1000),p(tabel) */
function orient(l){l.cy=Math.cos(l.yaw*D);l.sy=Math.sin(l.yaw*D);l.ct=Math.cos(l.tilt*D);l.st=Math.sin(l.tilt*D);return l;}
function intensSpre(l,dx,dy,dz){const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-9;
 const x1=dx*l.cy+dy*l.sy,y1=-dx*l.sy+dy*l.cy,z1=dz;const x2=x1*l.ct+z1*l.st,z2=-x1*l.st+z1*l.ct;
 let cg=-z2/d;if(cg>1)cg=1;if(cg<-1)cg=-1;const g=Math.acos(cg)/D;const c=Math.atan2(y1,x2)/D;return look(l.p,c,g)*l.k;}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<p.length;i+=2){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1];}return [a,b,c,d];}
function inPoly(x,y,p){let c=false;for(let i=0,n=p.length/2,j=n-1;i<n;j=i++){const xi=p[2*i],yi=p[2*i+1],xj=p[2*j],yj=p[2*j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-12)+xi))c=!c;}return c;}
/* umbră: raza punct→corp traversează un volum (clădire, jardinieră, zid) sub înălțimea lui? */
function blocked(px,py,pz,l){const ex=l.x-px,ey=l.y-py;const len=Math.sqrt(ex*ex+ey*ey);if(len<1e-6)return false;const tMax=1-0.04/len;
 for(const o of l.obs){if(pz>=o.h&&l.z>=o.h)continue;const bb=o.bb;
  if((px>l.x?px:l.x)<bb[0]||(px<l.x?px:l.x)>bb[2]||(py>l.y?py:l.y)<bb[1]||(py<l.y?py:l.y)>bb[3])continue;
  const p=o.p,n=p.length/2,ne=o.inchis?n:n-1;
  for(let k=0;k<ne;k++){const ax=p[2*k],ay=p[2*k+1],k2=(k+1)%n,bx=p[2*k2],by=p[2*k2+1];const fx=bx-ax,fy=by-ay;const den=ex*fy-ey*fx;if(den>-1e-12&&den<1e-12)continue;
   const qx=ax-px,qy=ay-py;const t=(qx*fy-qy*fx)/den,u=(qx*ey-qy*ex)/den;
   if(t>1e-4&&t<tMax&&u>=0&&u<=1){const zt=pz+t*(l.z-pz);if(zt<o.h)return true;}}}
 return false;}

/* ---------- calculul: suma pe puncte, inversul pătratului × cos(incidență), cu umbre ---------- */
function calc(job){const tabs=job.tabs;const umbre=job.umbre!==false;
 const obs=(job.obs||[]).map(o=>Object.assign({},o,{bb:bbox(o.p)}));
 const L=(job.lum||[]).filter(l=>l.phi>0&&tabs[l.t]).map(l0=>{const l=orient(Object.assign({},l0));l.p=tabs[l.t];l.k=l.phi/1000;l.rapid=!!(l.p.Tc&&Math.abs(l.tilt||0)<1e-9);l.cut=Math.sqrt(Math.max(1e-9,l.p.max*l.k/(job.prag||0.002)));l.cut2=l.cut*l.cut;
  l.obs=umbre?obs.filter(o=>o.bb[0]-l.cut<l.x&&o.bb[2]+l.cut>l.x&&o.bb[1]-l.cut<l.y&&o.bb[3]+l.cut>l.y):[];return l;});
 function E(px,py,pz,rgb){let e=0;for(let q=0;q<L.length;q++){const l=L[q];const dx=px-l.x,dy=py-l.y,dz=pz-l.z;if(dz>=-1e-6)continue;const d2=dx*dx+dy*dy+dz*dz;if(d2>l.cut2)continue;
   const d=Math.sqrt(d2);let I;if(l.rapid){const q=(-dz/d+1)*2000;const i0=q|0;I=(i0>=4000?l.p.Tc[4000]:l.p.Tc[i0]+(l.p.Tc[i0+1]-l.p.Tc[i0])*(q-i0))*l.k;}else I=intensSpre(l,dx,dy,dz);if(I<=0)continue;const v=I*(-dz/d)/d2;if(v<1e-5)continue;
   if(l.obs.length&&blocked(px,py,pz,l))continue;e+=v;if(rgb){rgb[0]+=v*l.r;rgb[1]+=v*l.g;rgb[2]+=v*l.b;}}return e;}
 const out={};
 if(job.ras){const r=job.ras,n=r.nx*r.ny,Eo=new Float32Array(n),R=new Float32Array(n),Gc=new Float32Array(n),B=new Float32Array(n),rgb=[0,0,0];const add=r.add||0;
  for(let iy=0;iy<r.ny;iy++)for(let ix=0;ix<r.nx;ix++){const k=iy*r.nx+ix;if(r.mask&&r.mask[k]){Eo[k]=-1;continue;}rgb[0]=rgb[1]=rgb[2]=0;
   const e=E(r.x0+ix*r.dx,r.y0+iy*r.dy,r.z||0,rgb)+add;Eo[k]=e;R[k]=rgb[0]+add;Gc[k]=rgb[1]+add;B[k]=rgb[2]+add;}
  out.ras={E:Eo,R,G:Gc,B};}
 out.zone=(job.zone||[]).map(z=>{const n=z.pts.length/2,e=new Float32Array(n);for(let i=0;i<n;i++)e[i]=E(z.pts[2*i],z.pts[2*i+1],z.z||0,null)+(z.add||0);return Object.assign({id:z.id,E:e},stats(e));});
 return out;}
function stats(e){let s=0,mn=Infinity,mx=0,n=0;for(let i=0;i<e.length;i++){const v=e[i];if(v<0)continue;s+=v;n++;if(v<mn)mn=v;if(v>mx)mx=v;}
 if(!n)return {Em:0,Emin:0,Emax:0,U0:0,Ud:0,n:0};const Em=s/n;return {Em,Emin:mn,Emax:mx,U0:Em>0?mn/Em:0,Ud:mx>0?mn/mx:0,n};}

/* ---------- „Propune-mi tu": greedy pe candidați + eliminare + ajustare ---------- */
function propune(job){const pts=job.pts,n=pts.length/2,z=job.z||0,tg=job.tinta||{};
 const one=lums=>calc({tabs:job.tabs,lum:lums,obs:job.obs,umbre:job.umbre,zone:[{id:'x',pts,z,add:0}]}).zone[0].E;
 const base=new Float64Array(n);if(job.lum&&job.lum.length){const b=one(job.lum);for(let i=0;i<n;i++)base[i]=b[i];}
 const M=job.cand.map(c=>one([c]));
 const T=Math.max((tg.Em||0)*1.3,(tg.Emin||0)*2.5,0.5);
 const ok=E=>{const s=stats(E);return s.Em>=(tg.Em||0)&&s.U0>=(tg.U0||0)&&s.Emin>=(tg.Emin||0);};
 const E=Float64Array.from(base),ales=[],used=new Uint8Array(M.length),dmin2=Math.pow(job.minDist||1.5,2),maxN=job.maxN||60;
 const departe=(c,lista)=>{const a=job.cand[c];for(const b of lista){const o=job.cand[b];if((o.x-a.x)*(o.x-a.x)+(o.y-a.y)*(o.y-a.y)<dmin2)return false;}return true;};
 while(ales.length<maxN&&!ok(E)){let best=-1,bs=0;
  for(let c=0;c<M.length;c++){if(used[c]||!departe(c,ales))continue;const m=M[c];let sc=0;const lo=T*0.3;
   for(let i=0;i<n;i++){const e0=E[i],e1=e0+m[i];sc+=Math.min(e1,T)-Math.min(e0,T);if(e0<lo)sc+=2*(Math.min(e1,lo)-e0);}
   if(sc>bs){bs=sc;best=c;}}
  if(best<0||bs<1e-6)break;used[best]=1;ales.push(best);const m=M[best];for(let i=0;i<n;i++)E[i]+=m[i];}
 if(ok(E))for(let k=ales.length-1;k>=0;k--){const m=M[ales[k]];const E2=E.map((v,i)=>v-m[i]);if(ok(E2)){used[ales[k]]=0;ales.splice(k,1);E.set(E2);}}
 /* ajustare: încerc să mut fiecare corp pe un candidat vecin, dacă urcă minimul */
 for(let pass=0;pass<2;pass++)for(let k=0;k<ales.length;k++){const a=ales[k],ca=job.cand[a];let bestE=null,bestC=-1,bestMin=stats(E).Emin;
  for(let c=0;c<M.length;c++){if(used[c])continue;const cc=job.cand[c];if((cc.x-ca.x)*(cc.x-ca.x)+(cc.y-ca.y)*(cc.y-ca.y)>16)continue;
   const rest=ales.filter((_,i)=>i!==k);if(!departe(c,rest))continue;const E2=E.map((v,i)=>v-M[a][i]+M[c][i]);const s=stats(E2);
   if(s.Emin>bestMin*1.02&&(ok(E2)||!ok(E))){bestMin=s.Emin;bestE=E2;bestC=c;}}
  if(bestC>=0){used[a]=0;used[bestC]=1;ales[k]=bestC;E.set(bestE);}}
 return Object.assign({ales,indeplinit:ok(E)},stats(E));}

return {parseLDT,parseIES,approx,normalize,integ,prep,look,interpRaw,calc,propune,stats,intensSpre,orient,inPoly,bbox};
}

/* culoarea luminii după temperatura de culoare (aproximare Tanner Helland), 0..1 */
function cctRGB(K){const t=clamp(K||3000,1000,12000)/100;let r,g,b;

 else{r=329.698727446*Math.pow(t-60,-0.1332047592);g=288.1221695283*Math.pow(t-60,-0.0755148492);b=255;}

/* ===================== CONSTANTE ===================== */

 cladire:{n:'Clădire',ico:'🏢',fel:'poli',h:7,cul:'#b7b0a6',obs:true,mask:true},

function eroareRetea(r,d){if(r.status===401)return Object.assign(new Error('Sesiunea a expirat. Intră din nou în aplicația firmei.'),{status:401});
 if(r.status===403)return Object.assign(new Error(d.error||'Nu ai drept pentru asta (doar Managerul).'),{status:403});
 if(r.status>=500)return Object.assign(new Error('Serverul are o problemă ('+r.status+')'+(d.error?': '+d.error:'')+'. Încearcă mai târziu; nimic nu s-a pierdut.'),{status:r.status});
 return Object.assign(new Error(d.error||('Serverul a răspuns '+r.status)),{status:r.status});}
async function capi(key,val){if(!CLOUD)throw new Error('Fără sesiune: deschide modulul din aplicația firmei.');
 const o={headers:{Authorization:'Bearer '+CLOUD.tok}};const w=val!==undefined;if(w){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify({key,value:val});}
 let r;try{r=await fetch('/api/data'+(w?'':'?key='+encodeURIComponent(key)),o);}catch(e){throw Object.assign(new Error('Nu am legătură cu serverul (offline?). Lucrez local și sincronizez când revine internetul.'),{offline:true});}
 const d=await r.json().catch(()=>({}));if(!r.ok||(w&&d.ok===false))throw eroareRetea(r,d);return w?d:d.value;}
function aiDeCe(){if(!CLOUD)return 'AI-ul merge doar din aplicația firmei, când ești logat.';if(navigator.onLine===false)return 'Nu ai internet acum — AI-ul are nevoie de server.';return '';}
async function aiPost(body,ms){const de=aiDeCe();if(de)throw new Error(de);const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),ms||120000);let r;
 try{r=await fetch('/api/ai',{method:'POST',headers:{Authorization:'Bearer '+CLOUD.tok,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});}
 catch(e){throw new Error(e&&e.name==='AbortError'?'AI-ul n-a răspuns la timp (2 minute). Încearcă din nou.':'Nu am putut ajunge la server. Verifică internetul.');}finally{clearTimeout(tm);}
 const d=await r.json().catch(()=>({}));if(r.status===403)throw new Error('Analiza AI e doar pentru Manager.');if(!r.ok)throw eroareRetea(r,d);return d;}

 async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction('f','readonly');const q=t.objectStore('f').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}catch(e){return null;}},

function varDe(lib,c){const V=lib.variante||{},v=(c&&c.var)||{};const pick=(arr,k)=>arr&&arr.length?(arr.find(x=>x.k===k)||alegeVar(arr,null,arr===V.fin?'fin':arr===V.cct?'cct':'')):null;
 return {fin:pick(V.fin,v.fin),cct:pick(V.cct,v.cct),opt:pick(V.opt,v.opt),alim:pick(V.alim,v.alim)};}
function codComplet(lib,vv){if(!lib)return '';if(!lib.variante)return lib.cod||'';const key=[vv.fin&&vv.fin.k,vv.cct&&vv.cct.k,vv.opt&&vv.opt.k,vv.alim&&vv.alim.k].filter(Boolean).join('|');
 if(lib.codFormat==='concat'){if(vv.fin&&vv.fin.comanda)return (lib.cod||'')+'…'+(vv.cct?vv.cct.k:'')+(vv.opt?vv.opt.k:'')+' · '+vv.fin.n;return (lib.cod||'')+(vv.fin?vv.fin.k:'')+(vv.cct?vv.cct.k:'')+(vv.opt?vv.opt.k:'');}
 if(vv.fin&&vv.fin.comanda){const k2=key.replace(/^CT\|?/,'');return (lib.cod?lib.cod+' ':'')+'['+k2.replace(/\|/g,'/')+'] · '+vv.fin.n;}
 if(lib.coduri&&lib.coduri[key])return lib.coduri[key];return (lib.cod?lib.cod+' ':'')+'['+key.replace(/\|/g,'/')+']'+(lib.codDeConfirmat?' (de confirmat)':'');}
function corpInfo(c){const lib=libGet(c.lib)||{denumire:'(corp lipsă din bibliotecă)',putere:0,fluxLivrat:0,optica:'lambert',cct:3000};const vv=varDe(lib,c);
 const fot=(lib.fotOpt&&vv.opt&&lib.fotOpt[vv.opt.k])||lib.fot||null;
 let flux=(vv.opt&&vv.opt.fl!=null)?vv.opt.fl:(vv.cct&&vv.cct.fl!=null)?vv.cct.fl:(lib.fluxLivrat!=null?lib.fluxLivrat:(fot?fot.flux:0));
 const K=(vv.cct&&vv.cct.K)||lib.cct||(fot&&parseInt(fot.cct))||3000;const optica=(vv.opt&&vv.opt.optica)||lib.optica||'lambert';
 const P=(vv.alim&&vv.alim.P)||lib.putere||(fot&&fot.putere)||0;
 const dimDef=!!((vv.alim&&vv.alim.dim)||lib.dimabil);const dimabil=c.dim&&c.dim.on!=null?!!c.dim.on:dimDef;const dimTip=(c.dim&&c.dim.tip)||(vv.alim&&vv.alim.dim)||lib.dimTip||'DALI';
 const liniar=optica==='liniar'||!!lib.liniar;let len=0;if(liniar&&c.pts){for(let i=1;i<c.pts.length;i++)len+=Math.hypot(c.pts[i][0]-c.pts[i-1][0],c.pts[i][1]-c.pts[i-1][1]);}
 if(liniar)flux=(fot&&lib.liniar&&!lib.liniar.lmPerM)?fot.flux:((lib.liniar&&lib.liniar.lmPerM)||flux||0)*len;
 const Ptot=liniar?((lib.liniar&&lib.liniar.wPerM)||P)*len:P;
 const nivel=dimabil?clamp(c.nivel==null?100:c.nivel,0,100):((c.nivel==null?100:c.nivel)>0?100:0);
 const finG=!lib.variante&&c.finisaj?c.finisaj:'';let cod=codComplet(lib,vv);if(finG)cod+=' · '+finNume(finG);
 const finK=(vv.fin&&vv.fin.k)||finG||'';
 return {lib,vv,cod,finK,denumire:lib.denumire+(vv.cct?' '+vv.cct.K+'K':'')+(vv.opt?' '+vv.opt.k:'')+(vv.fin?' '+(vv.fin.comanda?vv.fin.n:vv.fin.k):'')+(finG?' · finisaj '+finNume(finG):''),
  flux,K,optica,unghi:lib.unghi||(optica==='spot'?20:optica==='flood'?60:optica==='proiector'?30:null),P:Ptot,Pnom:P,fot,aprox:!fot,dimabil,dimTip,liniar,len,nivel,rgb:cctRGB(K)};}
const nivelEf=(c,inf)=>inf.dimabil?inf.nivel/100:(inf.nivel>0?1:0);

 plan:null,obiecte:[],corpuri:[],biblioteca:[],grupuri:[],scenariu:{trepte:[{de:'apus',pana:'23:00',niv:{_:100}},{de:'23:00',pana:'05:00',niv:{_:40}},{de:'05:00',pana:'rasarit',niv:{_:0}}]},
 setari:{mf:0.8,pretKwh:1.3,umbre:true,zileAn:tip==='interior'?250:365,rho:0.5},nivelulMeu:'modifica',_dirty:true};}
const poateModifica=p=>!!p&&(p.nivelulMeu||'modifica')==='modifica';
const eProprietar=p=>!!p&&String(p.proprietarId)===String(EU.id);
function stareSync(tip,msg){const t=!CLOUD?'💾 doar pe acest dispozitiv (fără sesiune)':tip==='offline'?'📴 offline — salvez local':tip==='err'?'⚠ nesincronizat':tip==='lucru'?'☁ se salvează…':tip==='astept'?'☁ modificări în așteptare…':'☁ sincronizat';
 const a=$('#stCloud'),b=$('#stSalv');if(a){a.textContent=t;a.title=msg||'';}if(b){b.textContent=t.replace(' (fără sesiune)','');b.title=msg||'';}}
const SY={timer:null,busy:false,again:false};
function salvLocal(){lsSet('proiecte',S.lista);}
function programSync(ms){if(!CLOUD)return;clearTimeout(SY.timer);stareSync('astept');SY.timer=setTimeout(()=>{SY.timer=null;sync();},ms==null?3000:ms);}
function curataPtServer(p){const c=JSON.parse(JSON.stringify(p,function(kk,vv){return (kk==='ents'&&this&&this.mare)?undefined:vv;}));delete c._dirty;delete c._srv;delete c._srvAt;delete c.nivelulMeu;delete c._trimisLa;if(c.plan&&c.plan.fundal)delete c.plan.fundal.local;return c;}
function imbina(srv){const ids=new Set();
 for(const s of srv){if(!s||s.id==null)continue;const id=String(s.id);ids.add(id);const i=S.lista.findIndex(p=>String(p.id)===id);
  if(i<0){S.lista.push(Object.assign(s,{_srv:true,_dirty:false}));continue;}
  const l=S.lista[i];
  if(!l._dirty||(s.nivelulMeu&&s.nivelulMeu!=='modifica')||(s.updatedAt||'')>(l.updatedAt||'')){if(l._dirty&&poateModifica(s))toast('„'+(s.nume||'')+'”: pe server era o versiune mai nouă'+(s.autor?' (de la '+s.autor+')':'')+' — am păstrat-o pe aceea.');
   const deschis=S.p&&String(S.p.id)===id;const cur=S.p;
   if(deschis&&(s.updatedAt||'')===(cur.updatedAt||'')&&s.nivelulMeu===cur.nivelulMeu){Object.assign(cur,{acces:s.acces,proprietarId:s.proprietarId,proprietarNume:s.proprietarNume,_srv:true,_dirty:false});S.lista[i]=cur;}
   else{S.lista[i]=Object.assign(s,{_srv:true,_dirty:false});if(deschis)reincarcaDeschis(S.lista[i]);}}
  else{if(!eMgr())l.acces=s.acces;l.proprietarId=s.proprietarId;l.proprietarNume=s.proprietarNume;l.nivelulMeu=s.nivelulMeu||l.nivelulMeu;l._srv=true;}}
 S.lista=S.lista.filter(p=>{if(ids.has(String(p.id)))return true;if(p._srv&&!p._dirty){if(S.p&&S.p.id===p.id)toast('Proiectul deschis nu mai e pe server (șters sau ți s-a retras accesul). Rămâne doar pe ecran.','err');return false;}if(p._srv&&p._dirty)p._srv=false;return true;});}
async function sync(){if(!CLOUD)return;if(SY.busy){SY.again=true;return;}if(navigator.onLine===false){stareSync('offline');return;}SY.busy=true;stareSync('lucru');
 try{let srv=await capi(CHEIE);if(!Array.isArray(srv))srv=[];imbina(srv);
  const sterse=lsGet('sterse',[]);const deTrimis=S.lista.filter(p=>p._dirty&&poateModifica(p));
  const prea=deTrimis.filter(p=>JSON.stringify(curataPtServer(p)).length>1500000);if(prea.length)toast('„'+prea[0].nume+'” e prea mare pentru server (>1,5 MB) — rămâne doar local. Scoate din straturile DXF.','err');
  const ok=deTrimis.filter(p=>!prea.includes(p));
  if(ok.length||sterse.length){const trimis=new Map(ok.map(p=>[p.id,p.updatedAt]));
   await capi(CHEIE,ok.map(curataPtServer).concat(sterse.map(id=>({id,_sterge:true}))));
   for(const p of S.lista)if(trimis.has(p.id)&&trimis.get(p.id)===p.updatedAt){p._dirty=false;p._srv=true;}
   lsSet('sterse',lsGet('sterse',[]).filter(id=>!sterse.includes(id)));
   srv=await capi(CHEIE);if(Array.isArray(srv))imbina(srv);}
  salvLocal();stareSync('ok');if(!S.p)randLista();
  urcaFundaluri().catch(()=>{});
 }catch(e){stareSync(e.offline?'offline':'err',e.message);if(e.status===401||e.status>=500||e.status===400||e.status===409)toast(e.message,'err');}
 finally{SY.busy=false;if(SY.again){SY.again=false;programSync(400);}}}

/* ---------- fișiere mari în Vercel Blob (dosarul proiecte/ — îl pot citi și colegii) ---------- */
async function urcaInBlob(file,nume){if(!CLOUD)throw new Error('Fără sesiune — fișierul rămâne doar pe acest dispozitiv.');
 const {upload}=await import('https://cdn.jsdelivr.net/npm/@vercel/blob@2.6.1/client/+esm');
 const pathname='proiecte/iluminat/'+S.p.id+'/'+Date.now()+'-'+String(nume||'plan').replace(/[^a-zA-Z0-9.\-_]/g,'_');
 const b=await upload(pathname,file,{access:'private',handleUploadUrl:'/api/blob-upload?token='+encodeURIComponent(CLOUD.tok),contentType:file.type});return {pathname:b.pathname||pathname,url:b.url};}
async function citesteDinBlob(pathname){const r=await fetch('/api/files?pathname='+encodeURIComponent(pathname)+'&token='+encodeURIComponent(CLOUD.tok));if(!r.ok)throw new Error(r.status===403?'Nu ai voie să deschizi fișierul planului.':'Nu am putut descărca planul ('+r.status+').');return await r.blob();}
async function urcaFundaluri(){if(!CLOUD||navigator.onLine===false)return;for(const p of S.lista){const f=p.plan&&p.plan.fundal;if(!f||f.pathname||!poateModifica(p))continue;
  const bl=await IDB.get('fundal:'+p.id);if(!bl)continue;try{const r=await urcaInBlob(new File([bl],'fundal.jpg',{type:bl.type||'image/jpeg'}),'fundal.jpg');
   const cur=S.p&&S.p.id===p.id?S.p:p;cur.plan.fundal.pathname=r.pathname;cur.updatedAt=nowIso();cur._dirty=true;salvLocal();programSync(1500);}catch(e){toast('Planul nu s-a urcat pe server încă: '+e.message,'err');return;}}}

/* ---------- deschiderea / închiderea unui proiect, istoricul (Anulează/Refă) ---------- */
const CHEI_ISTORIC=['nume','obiecte','corpuri','biblioteca','grupuri','scenariu','setari','client'];
function ser(){const o={};for(const k of CHEI_ISTORIC)o[k]=S.p[k];o.planMeta=S.p.plan?Object.assign({},S.p.plan,{dxf:S.p.plan.dxf?{straturi:S.p.plan.dxf.straturi,unit:S.p.plan.dxf.unit}:null}):null;return JSON.stringify(o);}

function parseDXF(txt){const L=String(txt).replace(/\r\n?/g,'\n').split('\n');const P=[];for(let i=0;i+1<L.length;i+=2){const c=parseInt(L[i].trim(),10);if(isNaN(c))continue;P.push([c,L[i+1].replace(/\s+$/,'')]);}

  if(c===2&&v==='ENTITIES'&&P[i-1]&&P[i-1][1]==='SECTION'){const r=raw(i+1,['ENDSEC']);ents=r.ents;i=r.i+1;continue;}
  i++;}
 function num(g,c){const x=g.find(q=>q[0]===c);return x?parseFloat(x[1]):0;}
 const out={ents:[],texts:[],puncte:[],layers:[],ins};const li=new Map();const lay=n=>{n=n||'0';if(!li.has(n)){li.set(n,out.layers.length);out.layers.push(n);}return li.get(n);};
 const arc=(cx,cy,r,a0,a1,tr,acc)=>{let da=a1-a0;while(da<=0)da+=Math.PI*2;const n=Math.max(8,Math.ceil(da/(Math.PI/24)));for(let k=0;k<=n;k++){const a=a0+da*k/n;acc.push(tr(cx+r*Math.cos(a),cy+r*Math.sin(a)));}};
 const bulgeSeg=(p0,p1,b,acc,tr)=>{if(!b){acc.push(tr(p1[0],p1[1]));return;}const th=4*Math.atan(b),dx=p1[0]-p0[0],dy=p1[1]-p0[1],c=Math.hypot(dx,dy);if(c<1e-12){acc.push(tr(p1[0],p1[1]));return;}
  const R=Math.abs(c/(2*Math.sin(th/2))),dd=c*(1-b*b)/(4*b);const cx=(p0[0]+p1[0])/2-dy/c*dd,cy=(p0[1]+p1[1])/2+dx/c*dd;const a0=Math.atan2(p0[1]-cy,p0[0]-cx);const n=Math.max(4,Math.ceil(Math.abs(th)/(Math.PI/24)));

 function interp(list,tr,depth,layerOver){for(let k=0;k<list.length;k++){const e=list[k],g=e.g;const gv=c=>{const x=g.find(q=>q[0]===c);return x?x[1]:null;};const gn=c=>{const x=gv(c);return x==null?0:parseFloat(x);};
   let ly=gv(8)||'0';if(ly==='0'&&layerOver)ly=layerOver;const l=lay(ly);
   if(e.t==='LINE')emit(l,[tr(gn(10),gn(20)),tr(gn(11),gn(21))],false);
   else if(e.t==='LWPOLYLINE'){const fl=gn(70);const vs=[];let cur=null;for(const [c,v] of g){if(c===10){cur={x:parseFloat(v),y:0,b:0};vs.push(cur);}else if(c===20&&cur)cur.y=parseFloat(v);else if(c===42&&cur)cur.b=parseFloat(v);}

    const t2=(x,y)=>{const u=(x-b.bx)*sx,v=(y-b.by)*sy;return tr(ix+u*cr-v*sr,iy+u*sr+v*cr);};const c0=tr(ix,iy);out.puncte.push({l,x:c0[0],y:c0[1],r:0,bloc:gv(2)});interp(b.ents,t2,depth+1,ly);}}}

/* banda LED sub buza jardinierei: conturul decalat 3 cm în afară, la 3 cm sub buză */
function bandaPeJardiniera(o){const lib=(libGet(S.libSel)&&(libGet(S.libSel).optica==='liniar'||libGet(S.libSel).liniar))?libGet(S.libSel):libGet('gen-banda');libInProiect(lib);
 const pts=o.pts,n=pts.length;let s=0;for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];s+=(b[0]-a[0])*(b[1]+a[1]);}const cw=s>0;
 const off=pts.map((q,i)=>{const a=pts[(i-1+n)%n],b=pts[(i+1)%n];const n1=norm([q[0]-a[0],q[1]-a[1]]),n2=norm([b[0]-q[0],b[1]-q[1]]);const o1=cw?[-n1[1],n1[0]]:[n1[1],-n1[0]],o2=cw?[-n2[1],n2[0]]:[n2[1],-n2[0]];const m=norm([o1[0]+o2[0],o1[1]+o2[1]]);const c=Math.max(0.3,m[0]*o1[0]+m[1]*o1[1]);return [r3(q[0]+m[0]*0.03/c),r3(q[1]+m[1]*0.03/c)];});
 off.push(off[0].slice());const k={id:uid('c'),lib:lib.id,pts:off,z:Math.max(0.05,(o.h||0.45)-0.03),yaw:0,tilt:0,nivel:100,pe:o.id};S.p.corpuri.push(k);S.sel=[{k:'c',id:k.id}];commit('banda');S.tab='corpuri';randPanou();deseneaza();
 toast('Bandă LED de '+fmt(perimetru(off,false),1)+' m pusă sub buza jardinierei.','ok');}
const norm=v=>{const l=Math.hypot(v[0],v[1])||1;return [v[0]/l,v[1]/l];};

const TABC=new Map();

function lumPentruCalc(nivFn,pasLin,filtru){const lum=[],tabs=[],idx=new Map();const mf=S.p.setari.mf||0.8;let aprox=false;
 for(const k of S.p.corpuri){if(filtru&&!filtru(k))continue;const inf=corpInfo(k);const niv=nivFn?nivFn(k,inf):nivelEf(k,inf);if(!(niv>0))continue;const t=tabPentru(inf);if(inf.aprox)aprox=true;

const MATS=['_sol','gazon','parcare','pavaj','alee','camera','zona','jardiniera','cladire'];

/* grila rasterului (pentru hărți) — cache pe geometrie și rezoluție */

function gridRaster(fin){const p=S.p;const obs=p.obiecte;let bb;const area=obs.filter(o=>o.pts&&TIPO[o.tip]&&TIPO[o.tip].fel==='poli');
 if(area.length){bb=[1e9,1e9,-1e9,-1e9];area.forEach(o=>o.pts.forEach(q=>{bb[0]=Math.min(bb[0],q[0]);bb[1]=Math.min(bb[1],q[1]);bb[2]=Math.max(bb[2],q[0]);bb[3]=Math.max(bb[3],q[1]);}));const m=eInterior()?0.2:3;bb=[bb[0]-m,bb[1]-m,bb[2]+m,bb[3]+m];}
 else bb=bboxProiect(p,true).map((v,i)=>v+(i<2?-6:6));
 const N=fin?140:60;const W=bb[2]-bb[0],H=bb[3]-bb[1];const d=Math.max(0.08,Math.max(W,H)/N);const nx=Math.max(2,Math.ceil(W/d)+1),ny=Math.max(2,Math.ceil(H/d)+1);

 const interior=eInterior();const mask=new Uint8Array(nx*ny),mat=new Uint8Array(nx*ny);const cam=obs.filter(o=>o.tip==='camera').map(o=>flat(o.pts));

 for(let iy=0;iy<ny;iy++)for(let ix=0;ix<nx;ix++){const k=iy*nx+ix,x=bb[0]+ix*d,y=bb[1]+iy*d;let m=0,ms=0;

function puncteZona(o,fin,maxN){const f=flat(o.pts),bb=ENG.bbox(f);let p=pasZona(o,fin);const masti=S.p.obiecte.filter(x=>x!==o&&TIPO[x.tip]&&TIPO[x.tip].mask&&x.pts).map(x=>flat(x.pts));
 for(let it=0;it<6;it++){const pts=[];for(let y=bb[1]+p/2;y<bb[3];y+=p)for(let x=bb[0]+p/2;x<bb[2];x+=p){if(!ENG.inPoly(x,y,f))continue;if(o.tip!=='camera'&&masti.some(m=>ENG.inPoly(x,y,m)))continue;pts.push(x,y);}

/* componenta indirectă estimată la interior (flux reflectat, ρ mediu) */
function indirectCamera(o,lum){const f=flat(o.pts);let fl=0;for(const l of lum)if(ENG.inPoly(l.x,l.y,f))fl+=l.phi;const A=arie(o.pts),P=perimetru(o.pts,true),H=o.h||3,rho=S.p.setari.rho||0.5;const St=2*A+P*H;return St>0?fl*rho/(St*(1-rho)):0;}
/* UGR simplificat: observator la mijlocul primului perete, ochi la 1,2 m, privind spre centrul încăperii */
function ugrCamera(o,Eind){const pts=o.pts;if(pts.length<3)return null;const a=pts[0],b=pts[1];const ob=[(a[0]+b[0])/2,(a[1]+b[1])/2];const c=centru(pts);const fx=c[0]-ob[0],fy=c[1]-ob[1],fl=Math.hypot(fx,fy)||1;const ux=fx/fl,uy=fy/fl;
 const Lb=Math.max(1,Eind/Math.PI);let s=0,n=0;const f=flat(pts);const mf=S.p.setari.mf||0.8;
 for(const k of S.p.corpuri){if(k.pts||!ENG.inPoly(k.x,k.y,f))continue;const inf=corpInfo(k);const niv=nivelEf(k,inf);if(!(niv>0))continue;const t=tabPentru(inf);

async function propune(){const p=S.p;const o=p.obiecte.find(x=>x.id===S.prZ);const lib=libGet($('#pr_m').value);if(!o||!lib)return;const c=cerinta($('#pr_c').value)||cerinta(o.cerinta)||{Em:5,U0:0.25};
 const tinta={Em:c.Lm?c.Lm/0.07:(c.Em||3),U0:c.U0||0,Emin:c.Emin||0};const minD=numIn($('#pr_d').value,1.5),maxN=parseInt($('#pr_n').value)||40;const pastrez=$('#pr_k').checked;
 libInProiect(lib);const vr={};if(lib.variante)for(const n of ['fin','cct','opt','alim'])if(lib.variante[n])vr[n]=alegeVar(lib.variante[n],S.varSel[n],n).k;
 const proba={lib:lib.id,var:vr,x:0,y:0,z:lib.z!=null?lib.z:0.5,yaw:0,tilt:lib.tilt||0,nivel:100};const inf=corpInfo(proba);const t=tabPentru(inf);const mf=p.setari.mf||0.8;
 const masti=p.obiecte.filter(x=>TIPO[x.tip]&&TIPO[x.tip].mask&&x.pts&&x!==o).map(x=>flat(x.pts));const cand=[];const f=flat(o.pts);
 if(o.tip==='camera'||lib.montaj==='tavan'){const A=arie(o.pts);const s=Math.max(0.9,Math.sqrt(A/150));const bb=ENG.bbox(f);for(let y=bb[1]+s/2;y<bb[3];y+=s)for(let x=bb[0]+s/2;x<bb[2];x+=s)if(ENG.inPoly(x,y,f))cand.push({x,y,z:o.tip==='camera'?(o.h||3)-0.02:(lib.z||2.8),yaw:0,tilt:0});}
 else{const per=perimetru(o.pts,true);const pas=Math.max(0.6,per/160);const n=o.pts.length;let s2=0;for(let i=0;i<n;i++){const a=o.pts[i],b=o.pts[(i+1)%n];s2+=(b[0]-a[0])*(b[1]+a[1]);}const cw=s2>0;
  for(let i=0;i<n;i++){const a=o.pts[i],b=o.pts[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<0.3)continue;const u=[(b[0]-a[0])/L,(b[1]-a[1])/L];const out=cw?[-u[1],u[0]]:[u[1],-u[0]];
   for(let s=pas/2;s<L;s+=pas)for(const off of [lib.montaj==='stalp'?0.6:0.3,-0.25]){const x=a[0]+u[0]*s+out[0]*off,y=a[1]+u[1]*s+out[1]*off;if(masti.some(m=>ENG.inPoly(x,y,m)))continue;cand.push({x,y,z:proba.z,yaw:Math.atan2(-out[1],-out[0])*180/Math.PI,tilt:proba.tilt});}}}
 if(!cand.length){toast('Nu am găsit poziții candidate pe marginea zonei.','err');return;}
 const lumC=cand.map(q=>({x:q.x,y:q.y,z:q.z,yaw:q.yaw,tilt:q.tilt,phi:inf.flux*mf,t:0,r:1,g:1,b:1}));
 const pts=puncteZona(o,true,1500).pts;let baza=[],tabs=[t.p];if(pastrez){const L=lumPentruCalc(null,0.4);baza=L.lum.map(l=>Object.assign({},l,{t:l.t+1}));tabs=[t.p].concat(L.tabs);}

 try{const r=await ruleaza('propune',{tabs,cand:lumC,lum:baza,obs:obstacole(),umbre:p.setari.umbre!==false,pts:new Float64Array(pts),z,tinta:{Em:Math.max(0,tinta.Em-add),U0:tinta.U0,Emin:tinta.Emin},minDist:minD,maxN});
  const N=r.ales.length;const W=N*inf.Pnom;const kwh=W*oreAnScenariu()/1000;
  $('#pr_rez').innerHTML=`<div class="box" style="background:var(--panel)"><b>${N} × ${esc(inf.denumire)}</b><br>Em ${fmt(r.Em+add,1)} lx · U0 ${fmt(r.U0,2)} · Emin ${fmt(r.Emin+add,2)} lx<br>${fmt(W,0)} W total · ≈ ${fmt(kwh,0)} kWh/an la 100% <span class="aprox">orientativ</span><br>${r.indeplinit?'<span class="ok">✓ cerința e atinsă</span>':'<span class="bad">✗ nu se atinge cu '+maxN+' corpuri — încearcă alt model sau distanță mai mică</span>'}

/* răsăritul și apusul (București ~44,4° N, 26,1° E), ora României cu ora de vară */
function soare(N){const lat=44.43*Math.PI/180,lon=26.1;const B=2*Math.PI*(N-81)/365;const decl=23.44*Math.PI/180*Math.sin(B);const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
 const cw=(Math.sin(-0.833*Math.PI/180)-Math.sin(lat)*Math.sin(decl))/(Math.cos(lat)*Math.cos(decl));const w0=Math.acos(clamp(cw,-1,1))*180/Math.PI;const noon=12-lon/15-eot/60;const tz=(N>=88&&N<298)?3:2;return {rasarit:noon-w0/15+tz,apus:noon+w0/15+tz};}
const oraH=s=>{if(s==='apus'||s==='rasarit')return s;const m=String(s||'').match(/(\d{1,2})[:.](\d{2})/);return m?(+m[1]+ +m[2]/60):0;};
function orePas(pas){const p=S.p;const a0=oraH(pas.de),b0=oraH(pas.pana);if(p.tip==='interior'){const a=a0==='apus'?18:a0==='rasarit'?7:a0,b=b0==='apus'?18:b0==='rasarit'?7:b0;let d=b-a;if(d<0)d+=24;return d*(p.setari.zileAn||250);}
 let h=0;for(let N=1;N<=365;N++){const s=soare(N),s2=soare(N%365+1);const S0=s.apus,R1=s2.rasarit+24;const map=x=>x==='apus'?S0:x==='rasarit'?R1:(x<12?x+24:x);let a=map(a0),b=map(b0);if(b<a)b+=24;h+=Math.max(0,Math.min(b,R1)-Math.max(a,S0));}return h;}

function energie(){const p=S.p;const tr=(p.scenariu&&p.scenariu.trepte)||[];const pret=p.setari.pretKwh||1.3;const rows=[];let tot=0;

 for(const o of sortat()){const t=TIPO[o.tip];if(!t||t.fel!=='poli'||!t.cul||o.tip==='cladire'||o.tip==='jardiniera')continue;x.beginPath();o.pts.forEach((q,i)=>{const a=w2(q[0],q[1]);i?x.lineTo(a[0],a[1]):x.moveTo(a[0],a[1]);});x.closePath();x.fillStyle=t.cul;x.fill();

 const tgt=T3.ctl.target;const list=S.p.corpuri.map(k=>({k,inf:corpInfo(k)})).filter(o=>o.inf.nivel>0&&!o.inf.liniar).sort((a,b)=>Math.hypot(a.k.x-tgt.x,a.k.y+tgt.z)-Math.hypot(b.k.x-tgt.x,b.k.y+tgt.z));

function materiale(){const m=new Map();for(const k of S.p.corpuri){const inf=corpInfo(k);const cod=inf.cod||inf.lib.denumire;let r=m.get(cod);
  if(!r){r={cod,denumire:(inf.lib.producator&&inf.lib.producator!=='generic'?inf.lib.producator+' ':'')+inf.denumire,um:inf.liniar?'m':'buc',cantitate:0,P:inf.liniar?((inf.lib.liniar&&inf.lib.liniar.wPerM)||inf.Pnom):inf.Pnom,aprox:inf.aprox,libCod:inf.lib.cod||'',codDeConfirmat:!!inf.lib.codDeConfirmat};m.set(cod,r);}
  r.cantitate+=inf.liniar?inf.len:1;
  const sursaInclusa=!!(inf.lib.dimabil||(inf.vv.alim&&inf.vv.alim.dim));if(inf.dimabil&&!sursaInclusa){const kk='SURSA|'+inf.dimTip+'|'+cod;let s=m.get(kk);
   if(!s){s={cod:'SURSA-'+String(inf.dimTip).replace(/[^A-Za-z0-9]/g,'').toUpperCase(),denumire:'Sursă de alimentare dimabilă '+inf.dimTip+' pentru '+cod+(inf.liniar?' (bandă LED, '+fmt((inf.lib.liniar&&inf.lib.liniar.wPerM)||0,1)+' W/m)':''),um:'buc',cantitate:0,P:0,sursa:true};m.set(kk,s);}s.cantitate+=1;}}
 return [...m.values()].map(r=>Object.assign(r,{cantitate:r.um==='m'?Math.ceil(r.cantitate*10)/10:r.cantitate}));}

  ${M.map((r,i)=>`<tr><td>${esc(r.cod)}${r.codDeConfirmat?' <span class="warnc" title="cod de confirmat">?</span>':''}</td><td>${esc(r.denumire)}${r.aprox?' <span class="aprox">fotometrie aprox.</span>':''}</td><td class="n">${fmt(r.cantitate,r.um==='m'?1:0)} ${r.um}</td><td class="n">${r.P?fmt(r.P,1):''}</td>
   ${mgr?`<td class="n"><input class="inp" style="width:80px;text-align:right" data-pr="${i}" inputmode="decimal" value="${pretPentru(r)!=null?pretPentru(r):''}"></td><td class="n">${pretPentru(r)!=null?fmt(pretPentru(r)*r.cantitate,2):''}</td>`:''}</tr>`).join('')}
  ${mgr?`<tr><th colspan="5">Total fără TVA</th><th class="n">${fmt(tot,2)}</th></tr>`:''}</table></div>${mgr?`<button class="btn" id="rp_sp">💾 Salvează prețurile</button><p class="muted small">Prețurile stau în „iluminatPreturi” — le vede doar Managerul.${S.preturi===null?' <span class="warnc">Nu am putut citi prețurile.</span>':''}</p>`:''}`:'<p class="muted small">Niciun corp pus încă.</p>'}`;

 for(const r of M){const pr=pretPentru(r);s+=`${r.cod};"${r.denumire.replace(/"/g,'""')}";${r.um};${String(r.cantitate).replace('.',',')};${String(r.P||'').replace('.',',')}${mgr?';'+(pr!=null?String(pr).replace('.',','):'')+';'+(pr!=null?String(Math.round(pr*r.cantitate*100)/100).replace('.',','):''):''}\n`;}

/* ===================== TESTE ALE MOTORULUI (apelabile din consolă: ILUM.testeMotor()) ===================== */
async function testeMotor(){const out={};const one=(f,lum,pts,umbre,obs)=>{const p=ENG.prep(f);const r=ENG.calc({tabs:[p],lum:lum.map(l=>Object.assign({yaw:0,tilt:0,t:0,r:1,g:1,b:1},l)),obs:obs||[],umbre:!!umbre,zone:[{id:'t',pts,z:0}]});return Array.from(r.zone[0].E);};
 const lam=ENG.approx('lambert');const e1=one(lam,[{x:0,y:0,z:5,phi:1000}],[0,0,5,0]);const I0=1000/Math.PI;
 out.lambert={E_sub:e1[0],asteptat_sub:I0/25,E_lateral5m:e1[1],asteptat_lateral:I0*Math.cos(Math.PI/4)*Math.cos(Math.PI/4)/50,flux_tabel:ENG.integ(lam)};
 const umb=one(lam,[{x:0,y:0,z:5,phi:1000}],[6,0],true,[{p:[2,-2,4,-2,4,2,2,2],h:6,inchis:true}]);const fara=one(lam,[{x:0,y:0,z:5,phi:1000}],[6,0],false);out.umbra={cu_cladire:umb[0],fara_cladire:fara[0]};
 const a360=ENG.approx('asim360'),a180=ENG.approx('asim180');const up=f=>{let s=0;for(let c=0;c<360;c+=5)for(let g=90.5;g<180;g+=1)s+=ENG.interpRaw(f,c,g);return s;};
 out.stalpisor={sus_360:up(a360),sus_180:up(a180),spate_180:ENG.interpRaw(a180,180,68),fata_180:ENG.interpRaw(a180,0,62),
  E_la_1m:one(a360,[{x:0,y:0,z:0.372,phi:159*0.8}],[1,0,2,0,3,0,0,1]).map(v=>Math.round(v*100)/100)};
 try{const t=await (await fetch('exemple/test-lambert.ldt')).text();const f=ENG.parseLDT(t);const e=one(f,[{x:0,y:0,z:5,phi:f.flux}],[0,0,5,0]);out.ldt={flux:f.flux,E_sub:e[0],E_lateral5m:e[1],nota:f.nota};}catch(e){out.ldt={eroare:e.message};}
 try{const t=await (await fetch('exemple/test-asimetric.ies')).text();const f=ENG.parseIES(t);const e=one(f,[{x:0,y:0,z:4,phi:f.flux}],[3,0,-3,0,0,3,0,-3]);const e2=one(f,[{x:0,y:0,z:4,phi:f.flux,yaw:90}],[0,3,3,0]);
  out.ies={flux:f.flux,asteptat_flux:500*Math.PI,E_C0:e[0],ast_C0:19.2,E_C180:e[1],ast_C180:6.4,E_C90:e[2],ast_C90:12.8,E_C270:e[3],ast_C270:12.8,rotit90_E_0_3:e2[0],ast_rotit:19.2,rotit90_E_3_0:e2[1],ast_rotit_3_0:12.8,nota:f.nota};}catch(e){out.ies={eroare:e.message};}
 console.log('TESTE MOTOR',JSON.stringify(out,null,1));return out;}
