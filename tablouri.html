<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#ECEEEB;--surface:#fff;--surface2:#F4F5F2;--ink:#1F2B33;--muted:#5E6B73;--line:#D6DBD8;--accent:#E3A008;--accent-soft:#FFF3D1;--err:#C62828;--warn:#A86400;--ok:#2E7D32;
--f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 336px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand b{font:700 19px/1 var(--fc);letter-spacing:.01em;display:block}
.brand small{font:500 12.5px/1.2 var(--f);color:var(--muted)}
#pname{font:600 15px var(--f);border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;width:220px;color:var(--ink)}
#pname:hover,#pname:focus{border-color:var(--line);background:#fff}
.spacer{flex:1}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font:600 15px var(--fc);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(31,43,51,.18)}
.btn{font:600 14px var(--f);border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9c1bd}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px}
#live[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:#5a3e00}
#live .dot{width:9px;height:9px;border-radius:50%;background:#aab1b5}
#live[aria-pressed=true] .dot{background:#E3A008;box-shadow:0 0 0 3px rgba(227,160,8,.25)}
.menu{position:absolute;right:14px;top:54px;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(31,43,51,.18);padding:6px;display:none;z-index:60;min-width:250px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font:500 14px var(--f);cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#lib{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px 12px 30px}
#lib input{width:100%}
.grp h3{font:600 14px var(--fc);color:var(--muted);margin:16px 4px 4px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:7px;cursor:pointer;font:500 13.5px/1.25 var(--f)}
.li:hover{background:var(--surface2);border-color:var(--line)}
.li .th{width:60px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.li .th svg{max-width:60px;max-height:38px}
.li small{margin-left:auto;color:var(--muted);font:500 12.5px var(--fc);white-space:nowrap;padding-left:6px}
#stage{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
#cv{width:100%;height:100%;display:block;touch-action:none;background-color:var(--bg);background-image:radial-gradient(#cdd3cf 1px,transparent 1px);background-size:18px 18px;user-select:none;-webkit-user-select:none}
#cv .lbl{font:600 15px var(--fc);fill:#5E6B73}
#cv .comp{cursor:grab}
#cv.sim .comp.act{cursor:pointer}
#cv .term{cursor:crosshair}

#cv .wire path{fill:none;stroke-linejoin:round;stroke-linecap:round}

#ghost{pointer-events:none}
#ghost.ok{fill:rgba(227,160,8,.18);stroke:#E3A008;stroke-width:2;stroke-dasharray:5 4}

.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font:500 13.5px var(--f);max-width:calc(100% - 130px);text-align:center;pointer-events:none;box-shadow:0 4px 14px rgba(31,43,51,.2)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}

.zoom button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 18px var(--f);cursor:pointer}
#v3d{position:absolute;inset:0}

.tools3d{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}

.empty3d{padding:40px;color:var(--muted)}
#viewbom,#viewleg{overflow:auto;padding:22px}
.leg{max-width:1100px}

.leghead .num{background:var(--ink);color:#fff;font:700 14px var(--fc);min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.legname{width:200px!important;font-weight:600!important}
.legt td{font-size:13.5px}
.legt td:nth-child(1){width:70px}.legt td:nth-child(2){width:110px}.legt td:nth-child(4){width:150px}.legt td:nth-child(5){width:210px}

.chk{display:inline-flex;align-items:center;gap:7px;margin-right:16px;cursor:pointer}
@media (max-width:700px){.legt thead{display:none}.legt tr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;border-top:1px solid var(--line);padding:6px 0}.legt td{border:0;padding:2px 0;width:auto!important}.legt td:nth-child(n+3){grid-column:2}}
.bom{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 24px 26px}
.bom h2{font:700 26px var(--fc);margin:0}
.bom h3{font:600 17px var(--fc);margin:22px 0 6px}
.bomt{width:100%;border-collapse:collapse;font-size:14px}
.bomt td,.bomt th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.bomt th{font:600 13px var(--fc);color:var(--muted);border-top:0}
.bomt td.q{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:110px}
.bomhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bomhead p{margin:4px 0 0;color:var(--muted)}
#insp{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px}

#insp h3{font:600 16px var(--fc);margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.field{display:grid;gap:4px;margin:0 0 11px}
.field>span{font:600 13px var(--fc);color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input:not([type]),input[type=search]{font:500 14px var(--f);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px}
.chips{display:flex;gap:6px;margin:-4px 0 12px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.state{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.state b{font-weight:600}
table.conn{width:100%;border-collapse:collapse;font-size:13.5px}
table.conn td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.conn td:first-child{width:70px}
.k{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--fc)}
.k::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.muted{color:var(--muted)}
.lnk{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:#b9c1bd;text-underline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 4px 5px;font:500 13px var(--f);cursor:pointer}
.swatches button span{width:15px;height:15px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

.checks ul{list-style:none;margin:0;padding:0}
.checks li{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.checks li::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c)}
.checks li.err{--c:var(--err)}.checks li.warn{--c:#E08A00}.checks li.info{--c:#8a979e}
.issue{all:unset;cursor:pointer;flex:1;font-size:13.5px}
.fix{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font:600 12.5px var(--f);cursor:pointer;white-space:nowrap}
.pill{font:600 13px var(--fc);padding:2px 9px;border-radius:10px;background:#E8F3E9;color:var(--ok)}
.pill.err{background:#FBE9E9;color:var(--err)}.pill.warn{background:#FFF1DB;color:var(--warn)}
ol.steps{padding-left:20px;margin:6px 0 0}ol.steps li{margin:0 0 8px}
.stats{display:flex;gap:18px;margin:10px 0 4px}
.stats div b{display:block;font:700 26px/1 var(--fc)}
.stats div span{color:var(--muted);font-size:13px}
.handle{display:none}
.exadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.exadd select{flex:1;min-width:220px;width:auto}.exadd input{width:auto}
.tlab{display:block;margin-top:3px;width:100%!important;padding:3px 6px!important;font-size:12px!important}
.wtag,.ptag{display:inline-block;background:#fffbe6;border:1px solid #d9b84a;border-radius:4px;padding:0 5px;font:700 12px var(--fc);color:#1f2a30}
.ptag{background:#e8f1fb;border-color:#9dbadf;color:#123a63}
.nbk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbc{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font:inherit}
.nbc:hover{border-color:#b9c1bd}
.nbc[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--surface2)}
.nbc svg{flex:none}.nbc b{display:block;font:700 17px/1.15 var(--fc);margin-bottom:3px}.nbc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
@media (max-width:600px){.nbk{grid-template-columns:1fr}.nbc{padding:10px}}
.rackview{position:absolute;left:12px;top:12px;display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;box-shadow:0 2px 8px rgba(31,43,51,.12)}.rackview button{border:0;background:none;padding:7px 14px;border-radius:7px;font:600 14px var(--fc);cursor:pointer;color:var(--muted)}.rackview button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg2{display:flex;gap:6px;flex-wrap:wrap}.seg2 .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.crimp{position:fixed;inset:0;background:rgba(20,26,30,.55);display:none;align-items:center;justify-content:center;z-index:95;padding:12px}.crimp.open{display:flex}
.crimp-box{background:#fff;border-radius:14px;width:min(920px,100%);height:min(680px,100%);display:flex;flex-direction:column;overflow:hidden}
.crimp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.crimp-head b{font:700 20px var(--fc);display:block}.crimp-head small{color:var(--muted)}
#cr_v{flex:1;min-height:200px;position:relative}#cr_v canvas{display:block;touch-action:none}
.crimp-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}.crimp-foot p{margin:0 0 8px;min-height:40px}
.crimp-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}.crimp-legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.menu3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:4px}.menu .menu3 button{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 6px}.menu3 b{font:700 14px var(--fc)}.menu3 small{color:var(--muted);font-size:11.5px}
.seg3{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:3px}
#focus3d[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.tools3d{right:12px;max-width:calc(100% - 24px)}
@media (max-width:900px){.tools3d .btn{padding:6px 9px;font-size:13px}.rules3d{left:12px;right:12px;width:auto;top:110px}}
.rules3d{position:absolute;right:12px;top:60px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(31,43,51,.18);padding:12px 14px}.rules3d .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rules3d .rhead b{font:700 17px var(--fc)}
.rules{list-style:none;margin:0;padding:0}.rules li{padding:7px 0;border-top:1px solid var(--line);display:grid;gap:2px}.rules li b{font:600 14px var(--fc)}.rules li span{font-size:13px;color:var(--muted)}.rules li.ok b{color:var(--ok)}.rules li.warn b{color:var(--warn)}
[hidden]{display:none!important}
@media (max-width:900px){.hint3d{display:none}}
#cv [data-duct]{cursor:grab}
.montaj{margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}.montaj summary{cursor:pointer;font:600 15px var(--fc)}.montaj .mh{font:700 13px var(--fc);color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}.montaj .mr{padding:5px 0;border-top:1px solid #eef0ee;font-size:13px;line-height:1.4}.montaj .mr b{display:block;font-weight:700}.montaj .mr span{color:#34424b}
.wire.dim{opacity:.13}
.kitbox{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.kitbox summary{cursor:pointer;font:600 15px var(--fc)}.kitrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #eef0ee;font-size:13.5px}.kitrow span{flex:1}.kitrow input[type=number]{width:64px}
.circlist{display:grid;gap:6px;max-height:46vh;overflow:auto;padding:2px}.circrow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(110px,1.4fr) auto auto auto;gap:6px;align-items:center}.circrow .cnum{display:flex;align-items:center;gap:4px}.circrow .cnum input{width:56px}.circrow small{font-size:12px}@media (max-width:640px){.circrow{grid-template-columns:1fr 1fr;}}
.sugg{list-style:none;margin:8px 0 0;padding:0}.sugg li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
@keyframes flashp{0%,100%{opacity:1}50%{opacity:.35}}.flash{animation:flashp .6s ease-in-out infinite}
.ihelp{width:100%;margin:4px 0 2px;font-size:13px;color:#34424b}.ihelp summary{cursor:pointer;font-weight:600;color:#1f5fa8}.ihelp p{margin:4px 0}.ihelp ol{margin:2px 0 4px 18px;padding:0}.checks .ihelp li{display:list-item;margin:2px 0;padding:0;border:0;gap:0}.checks .ihelp li::before{display:none;content:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.logoprev{max-height:48px;max-width:180px;display:block;margin:4px 0}
.mob{display:none!important}
#scrim{position:fixed;inset:0;background:rgba(31,43,51,.3);z-index:44;display:none}
@media (max-width:900px){
 #app{grid-template-columns:minmax(0,1fr)}
 #pname{width:150px}
 .brand small{display:none}
 #lib{position:fixed;left:0;top:0;bottom:0;width:min(88vw,340px);z-index:46;transform:translateX(-103%);transition:transform .2s;box-shadow:6px 0 24px rgba(31,43,51,.2);padding-top:calc(12px + env(safe-area-inset-top,0px))}
 #lib.open{transform:none}
 #scrim.open{display:block}
 #insp{position:fixed;left:0;right:0;bottom:0;max-height:55%;z-index:45;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 22px rgba(31,43,51,.16);transform:translateY(calc(100% - 50px - env(safe-area-inset-bottom,0px)));transition:transform .2s;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
 #insp.open{transform:none}
 .handle{display:flex;position:sticky;top:0;background:#fff;width:calc(100% + 32px);margin:0 -16px 8px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);font:600 15px var(--fc);align-items:center;gap:8px;cursor:pointer;z-index:2}
 .mob{display:inline-flex!important}
 .hint{bottom:64px;max-width:calc(100% - 30px);font-size:13px}
 .zoom{bottom:64px}
 .hint3d{bottom:62px}
 .desk{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(()=>{
'use strict';
const U=9,MH=90,PITCH=170,PADX=40;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtN=n=>String(n).replace('.',',');
const KIND_COLOR={L:'#7a4a2b',L1:'#7a4a2b',L2:'#262626',L3:'#8c9196',N:'#2166c4',PE:'#3d9a3a',CTRL:'#4a4f54',LV:'#7d5ba6',DALI:'#e67e22',SIG:'#e0e0da',BUS:'#c0392b','DC+':'#d42a2a','DC-':'#1d1d1d',SENS:'#9aa0a6',DATA:'#3b82c4',COAX:'#b5ad8a',FO:'#e0b400'};
const KIND_NAME={L:'fază',L1:'fază L1',L2:'fază L2',L3:'fază L3',N:'nul',PE:'PE',CTRL:'comandă 230 V',LV:'joasă tensiune c.a.',DALI:'magistrală DALI',SIG:'semnal / contact',BUS:'magistrală 2 fire','DC+':'plus c.c.','DC-':'minus c.c.',SENS:'senzor',DATA:'date RJ45',COAX:'coaxial TV',FO:'fibră optică'};
const FAM={L:'ac',L1:'ac',L2:'ac',L3:'ac',N:'ac',CTRL:'ac',LV:'lv',DALI:'dali',SIG:'sig',BUS:'bus',PE:'pe','DC+':'dc','DC-':'dc',SENS:'sens',DATA:'data',COAX:'coax',FO:'fo'};
const WC={maro:{n:'maro',c:'#7a4a2b'},albastru:{n:'albastru',c:'#2166c4'},'galben-verde':{n:'galben-verde',c:'#3d9a3a',pe:1},negru:{n:'negru',c:'#262626'},gri:{n:'gri',c:'#8c9196'},rosu:{n:'roșu',c:'#d42a2a'},violet:{n:'violet',c:'#7d5ba6'},alb:{n:'alb',c:'#f4f4f0',light:1},utp:{n:'UTP Cat6',c:'#3b82c4',data:1},'pc-albastru':{n:'patch albastru',c:'#2f7fd1',data:1,pc:1},'pc-gri':{n:'patch gri',c:'#9aa3aa',data:1,pc:1},'pc-galben':{n:'patch galben',c:'#f2c500',data:1,pc:1},'pc-rosu':{n:'patch roșu',c:'#d83a3a',data:1,pc:1},'pc-verde':{n:'patch verde',c:'#35a853',data:1,pc:1},'pc-negru':{n:'patch negru',c:'#2a2a2a',data:1,pc:1},'pc-alb':{n:'patch alb',c:'#f4f4f0',data:1,pc:1,light:1},'pc-portocaliu':{n:'patch portocaliu',c:'#f08a24',data:1,pc:1},'pc-violet':{n:'patch violet',c:'#8e5bc7',data:1,pc:1},coax:{n:'coaxial',c:'#f4f4f0',light:1,data:1},fibra:{n:'fibră optică',c:'#e8c21a',data:1}};
const SECS=[0.75,1,1.5,2.5,4,6,10,16,25];
const SW={0.75:1.8,1:2,1.5:2.3,2.5:2.8,4:3.2,6:3.6,10:4.2,16:4.8,25:5.4};
const minSec=R=>R<=10?1.5:R<=16?2.5:R<=25?4:R<=32?6:R<=40?10:R<=63?16:25;
const T=(id,label,kind,side='top',dy=0,fx,extra)=>Object.assign({id,label,kind,side,dy,fx},extra||{});
const on=c=>c.state.on!==false;
const isPh=s=>s.has('L1')||s.has('L2')||s.has('L3');
const acPow=(a,b)=>(isPh(a)&&b.has('N'))||(isPh(b)&&a.has('N'));
const dcOf=(pp,mm)=>{for(const v of [12,24,48]) if(pp.has('DC+@'+v)&&mm.has('DC-@'+v)) return v; return 0;};

/* ---------- desen fețe aparate (SVG) ---------- */
const FONT='Barlow Condensed, Arial Narrow, Arial, sans-serif';
const tx=(x,y,s,sz=7,fill='#1f2a30',wt=600,anchor='middle')=>`<text x="${x}" y="${y}" font-size="${sz}" fill="${fill}" font-weight="${wt}" text-anchor="${anchor}" font-family="${FONT}">${esc(s)}</text>`;
const body=(W,fill='#f8f8f4',stroke='#8f989e',Hh=MH)=>`<rect x=".5" y=".5" width="${W-1}" height="${Hh-1}" rx="3" fill="${fill}" stroke="${stroke}"/><rect x="2" y="2" width="${W-4}" height="19" rx="2" fill="rgba(0,0,0,.07)"/><rect x="2" y="${Hh-21}" width="${W-4}" height="19" rx="2" fill="rgba(0,0,0,.07)"/>`;
function lever(W,o,trip){const w=W-6;return `<rect x="3" y="36" width="${w}" height="22" rx="2" fill="#dcdfd9" stroke="#b5bab4"/><rect x="5" y="${o?37.5:47}" width="${w-4}" height="9.5" rx="1.5" fill="#2f3b44"/><rect x="${W/2-2.5}" y="${o?39:48.5}" width="5" height="2.4" fill="${o?'#d64541':'#3aa35a'}"/>`+(trip?`<rect x="2" y="60" width="${W-4}" height="8" rx="1.5" fill="#f5b800"/>${tx(W/2,66.3,'!',7,'#1f2a30',700)}`:'');}
const tag=(W,l,y=60.5)=>l?`<rect x="2" y="${y}" width="${W-4}" height="8" rx="1.5" fill="#fff" stroke="#c9ced0"/>${tx(W/2,y+6.3,l,W<20?5.4:6.3,'#1f2a30',700)}`:'';
const led=(x,y,o,col='#3fbf5f')=>`<circle cx="${x}" cy="${y}" r="2.3" fill="${o?col:'#aab1b5'}"${o?' filter="url(#glow)"':''}/>`;
const FB=W=>`<rect x="1" y="2" width="${W-2}" height="18" rx="2" fill="#e3e5e2" stroke="#b3b8b5"/>`;
const PL=(W,y=25)=>`<rect x="2" y="${y}" width="${W-4}" height="${MH-y-2}" rx="5" fill="#e9dfc8" stroke="#b7a987"/>`;
const FL=(W,s,y=84)=>s?tx(W/2,y,s,6.2,'#33414a',700):'';
const faceMcb=(c,W)=>body(W)+tx(W/2,31,(c.p.curve||'')+c.p.rating,W<20?7:8,'#1f2a30',700)+lever(W,on(c),c.state.tripped)+(c.state.tripped?'':tag(W,c.label));
const faceRcd=(c,W,top)=>body(W)+tx(4,28,top,7,'#1f2a30',700,'start')+tx(4,34.5,`${c.p.sens}mA tip ${c.p.tip}`,5.4,'#44515a',600,'start')+`<circle cx="${W-7}" cy="29" r="3.8" fill="#2d6fd1"/>`+tx(W-7,31.3,'T',5.4,'#fff',700)+lever(W,on(c),c.state.tripped)+(c.state.tripped?'':tag(W,c.label));
function clampLv(c){if(c.p.lv==='+/− (c.c.)')return [['P','DC+',0,'+'],['M','DC-',12,'−']];if(c.p.lv==='+/−/semnal')return [['P','DC+',0,'+'],['M','DC-',10,'−'],['S','SIG',20,'S']];return c.p.lv==='L/N/PE'?[['L','L',0,'L'],['N','N',10,'N'],['PE','PE',20,'PE']]:c.p.lv==='Un nivel'?[['X','CTRL',0,'1']]:[['L','L',0,'L'],['N','N',12,'N']];}
const MODE_AB={'Monocolor':'MONO','CCT (alb reglabil)':'CCT','RGB':'RGB','RGBW':'RGBW','RGBWW (RGB + CCT)':'RGBWW'};
const CH={'Monocolor':[['CH1','−']],'CCT (alb reglabil)':[['WW','WW−'],['CW','CW−']],'RGB':[['R','R−'],['G','G−'],['B','B−']],'RGBW':[['R','R−'],['G','G−'],['B','B−'],['W','W−']],'RGBWW (RGB + CCT)':[['R','R−'],['G','G−'],['B','B−'],['WW','WW−'],['CW','CW−']]};
const MODES=Object.keys(CH);
function stripColor(c,e){const m=c.p.mode;if(c.p.hex&&m==='Monocolor')return c.p.hex;if(m==='Monocolor')return '#ffd9a0';if(m==='CCT (alb reglabil)')return '#fff0cf';return e.col||'#ffffff';}
function hexCh(hex){const n=parseInt(String(hex||'#ffffff').slice(1),16);return {R:(n>>16)&255,G:(n>>8)&255,B:n&255};}

const P_RATING={label:'Curent nominal (A)',opts:[6,10,13,16,20,25,32,40,50,63],def:16,num:1};
const P_CURVE={label:'Curbă de declanșare',opts:['B','C','D'],def:'C'};
const brk=(extra)=>Object.assign({prot:c=>+c.p.rating,trip:'mcb',act:c=>{if(c.state.tripped){c.state.tripped=false;c.state.on=true;}else c.state.on=!on(c);},actLabel:c=>c.state.tripped?'Rearmează':on(c)?'Oprește':'Pornește',status:c=>c.state.tripped?'Declanșată':on(c)?'Pornită':'Oprită',st:{on:true}},extra);

const DEFS={
/* ---- alimentare (în teren) ---- */
src230:{name:'Alimentare rețea 230 V',short:'Rețea 230 V',group:'Alimentare',zone:'field',w:()=>8,
 terms:()=>[T('L','L','L'),T('N','N','N'),T('PE','PE','PE')],
 inject:()=>[['L','L1'],['N','N'],['PE','PE']],
 face:(c,W)=>FB(W)+`<rect x="1" y="24" width="${W-2}" height="${MH-25}" rx="4" fill="#fff5d6" stroke="#caa94a"/><path d="M${W/2+3} 30 L${W/2-7} 50 H${W/2} L${W/2-4} 66 L${W/2+8} 44 H${W/2+1} Z" fill="#f2b705" stroke="#8a6500" stroke-width=".8"/>`+tx(W/2,76,'REȚEA 230 V',7,'#5a4300',700)+tx(W/2,84,c.label||'branșament',5.4,'#7a6a3a',500),
 bom:()=>'Alimentare din rețea 230 V (branșament existent)'},
src400:{name:'Alimentare rețea 400 V',short:'Rețea 400 V',group:'Alimentare',zone:'field',w:()=>10,
 terms:()=>[T('L1','L1','L1'),T('L2','L2','L2'),T('L3','L3','L3'),T('N','N','N'),T('PE','PE','PE')],
 inject:()=>[['L1','L1'],['L2','L2'],['L3','L3'],['N','N'],['PE','PE']],
 face:(c,W)=>FB(W)+`<rect x="1" y="24" width="${W-2}" height="${MH-25}" rx="4" fill="#fff5d6" stroke="#caa94a"/><path d="M${W/2+3} 30 L${W/2-7} 50 H${W/2} L${W/2-4} 66 L${W/2+8} 44 H${W/2+1} Z" fill="#f2b705" stroke="#8a6500" stroke-width=".8"/>`+tx(W/2,76,'REȚEA 400 V',7,'#5a4300',700)+tx(W/2,84,c.label||'branșament trifazic',5.4,'#7a6a3a',500),
 bom:()=>'Alimentare din rețea 400 V (branșament existent)'},
/* ---- protecție ---- */
mcb1:brk({name:'Siguranță automată 1P',short:'Siguranță',group:'Protecție',zone:'panel',w:()=>2,props:{rating:P_RATING,curve:P_CURVE},
 terms:()=>[T('i','L','L'),T('o','L','L','bot')],links:c=>on(c)?[['i','o']]:[],outs:['o'],face:faceMcb,
 bom:c=>`Siguranță automată 1P, curba ${c.p.curve}, ${c.p.rating} A`}),
mcb1n:brk({name:'Siguranță automată 1P+N',short:'Siguranță 1P+N',group:'Protecție',zone:'panel',w:c=>c&&c.p&&/^1/.test(c.p.mod||'')?2:4,props:{rating:P_RATING,curve:P_CURVE,mod:{label:'Lățime',opts:['2 module (36 mm)','1 modul (18 mm)'],def:'2 module (36 mm)'}},
 terms:()=>[T('Li','L','L'),T('Ni','N','N'),T('Lo','L','L','bot'),T('No','N','N','bot')],links:c=>on(c)?[['Li','Lo'],['Ni','No']]:[],outs:['Lo'],face:faceMcb,
 bom:c=>`Siguranță automată 1P+N, curba ${c.p.curve}, ${c.p.rating} A`}),
mcb3:brk({name:'Siguranță automată 3P',short:'Siguranță 3P',group:'Protecție',zone:'panel',w:()=>6,props:{rating:Object.assign({},P_RATING,{def:25}),curve:P_CURVE},
 terms:()=>[T('1i','L1','L1'),T('2i','L2','L2'),T('3i','L3','L3'),T('1o','L1','L1','bot'),T('2o','L2','L2','bot'),T('3o','L3','L3','bot')],
 links:c=>on(c)?[['1i','1o'],['2i','2o'],['3i','3o']]:[],outs:['1o','2o','3o'],face:faceMcb,

let dlP=null;
async function saveFile(name,data,mime){try{if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);const dl=await dlP;if(dl){await dl.save({filename:name,data});toast('Fișier salvat: '+name);return;}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'){toast('Fișierul nu s-a putut salva ('+e.code+')','err');return;}}
 const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const slug=s=>(s||'tablou').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'tablou';

 else if(t.sfp)g=`<rect x="${lx-7}" y="${ly-4.5}" width="14" height="9" rx="1" fill="#a3abb2" stroke="#5f676e" stroke-width=".6"/><rect x="${lx-5}" y="${ly-2.6}" width="10" height="5.2" fill="#1b1f22"/>`;

 else if(t.pin)g=`<rect x="${lx-1.3}" y="${ly-2.6}" width="2.6" height="5.2" rx=".6" fill="#c9a54a"/>`;
 else if(t.small&&(t.kind==='DATA'||t.kind==='FO'))g=`<rect x="${lx-2.2}" y="${ly-1.6}" width="4.4" height="3.2" rx=".6" fill="#59626a"/>`;
 else if(t.kind==='DATA')g=`<rect x="${lx-4}" y="${ly-3.6}" width="8" height="7.2" rx="1" fill="#2f3a42"/><rect x="${lx-2.4}" y="${ly-1.4}" width="4.8" height="3" fill="#8fa0ab"/>`;
 else if(t.kind==='COAX')g=`<circle cx="${lx}" cy="${ly}" r="4.2" fill="#d8d0ae" stroke="#8a8466"/><circle cx="${lx}" cy="${ly}" r="1.2" fill="#6b6445"/>`;
 else if(t.kind==='FO')g=`<rect x="${lx-3.6}" y="${ly-3.6}" width="7.2" height="7.2" rx="1" fill="#e8c21a" stroke="#9c8110"/>`;
 else if(hasPhoto(c)){const r=t.small?3:3.6;g=`<circle cx="${lx}" cy="${ly}" r="${r}" fill="none" stroke="${KIND_COLOR[t.kind]}" stroke-width="1.1" opacity=".85"/>`;}
 else{const r=t.small?3.3:3.9;const B_=B(c);const mk_=(B_==='clamp1'||B_==='clamps')?String(t.label||'').replace(/^\d+/,''):'';if(mk_&&mk_.length<=2){const col=KIND_COLOR[t.kind]||'#4d5a62';g=`<circle cx="${lx}" cy="${ly}" r="${r+.3}" fill="#fff" stroke="${col}" stroke-width="1.3"/><text x="${lx}" y="${ly+1.6}" font-size="${mk_.length>1?3.3:4.6}" text-anchor="middle" fill="${col}" font-family="${FONT}" font-weight="800">${esc(mk_)}</text>`;}else g=`<circle cx="${lx}" cy="${ly}" r="${r}" fill="#d9dcde" stroke="${KIND_COLOR[t.kind]}" stroke-width="1.7"/><line x1="${lx-r*.5}" y1="${ly+r*.35}" x2="${lx+r*.5}" y2="${ly-r*.35}" stroke="#7d868c" stroke-width=".9"/>`;}
 if(!t.nolabel&&t.label&&!hasPhoto(c))g+=`<text x="${lx}" y="${t.side==='top'?ly+10.2:ly-6.4}" font-size="5.6" text-anchor="middle" fill="${isDark(c)?'#c9d1d6':'#4d5a62'}" font-family="${FONT}" font-weight="600">${esc(t.label)}</text>`;
 if(hit)g=`<g class="term" data-t="${k}">${g}<circle cx="${lx}" cy="${ly}" r="${t.port||t.lc||t.sfp?6:t.pin?3.5:t.small?5:7.5}" fill="transparent"/></g>`;s+=g;}return s;}

 {const ka=$('#kitadd');if(ka)ka.onclick=()=>{const l=kitLoad(kitKind());if(!l.length){toast('Nu ai încă o listă standard pentru acest tip.','warn');return;}commit(()=>{model.extras=model.extras||[];for(const x of l){const ex=model.extras.find(y=>y.name===x.name);if(ex)ex.q=+ex.q+ +x.q;else model.extras.push({id:uid(),name:x.name,u:x.u,q:x.q,pr:''});}});renderBom();toast('Am adăugat lista standard.');};const ks=$('#kitsave');if(ks)ks.onclick=()=>{kitSave(kitKind(),(model.extras||[]).map(x=>({name:x.name,u:x.u,q:+x.q||1})));toast('Lista standard pentru '+KIT_NAME[kitKind()]+' a fost salvată. O primești la fiecare proiect nou de acest tip.');};}

function posNums(){const bi=c=>c.zone==='panel'?model.bands.findIndex(b=>b.id===c.band):c.row;const a=model.comps.slice().sort((p,q)=>(p.zone===q.zone?0:p.zone==='panel'?-1:1)||bi(p)-bi(q)||p.x-q.x);return new Map(a.map((c,i)=>[c.id,i+1]));}
function sortedComps(){const N=posNums();return model.comps.slice().sort((a,b)=>N.get(a.id)-N.get(b.id));}
function legendRows(){const N=posNums(),rows=[];for(const c of sortedComps()){const d=DEFS[c.t];const bb=bandOf(c);const place=c.zone==='panel'&&bb&&bb.type==='rack'?`rack, U${c.x+1}${DEFS[c.t].w(c)>1?'–U'+(c.x+DEFS[c.t].w(c)):''}`:c.zone==='panel'&&bb?(DEFS[c.t].mount==='din'?`${bandName(bb).toLowerCase()}, de la modulul ${fmtN((c.x-(segs(bb).din||[0])[0])/2+1)}`:`${bandName(bb).toLowerCase()}, la ${Math.round(c.x*U)} mm de la stânga`):c.zone==='door'?'pe ușa tabloului':c.row<0?'în teren, intrare pe sus':'în teren';const ts=termLayout(c).map(x=>x.t);
 for(const t of ts){const k=tk(c,t.id);const ws=model.wires.filter(w=>!w.jmp&&(w.a===k||w.b===k));const dir=c.zone==='field'?'spre tablou':t.side==='top'?'intrare (sus)':'ieșire (jos)';
  const to=ws.map(w=>{const o=term(w.a===k?w.b:w.a);if(!o)return null;return {txt:`${N.get(o.c.id)}. ${compName(o.c)}, borna ${tLab(o.c,o.t)}${B(o.c)==='clamp1'?(o.t.side==='top'?' sus':' jos'):''}`,cond:`${WC[w.color].n}${w.sec?' '+fmtN(w.sec)+' mm²':''}${w.label?', '+w.label:''}`};}).filter(Boolean);
  rows.push({c,d,n:N.get(c.id),place,t,k,dir,to,note:(c.notes||{})[t.id]||'',tl:(c.tl||{})[t.id]||''});}}return rows;}
let legFree=false;
function renderLegend(){const rows=legendRows();let h=`<div class="bom leg"><div class="bomhead"><div><h2>Legendă conexiuni</h2><p>Ce intră și ce iese din fiecare aparat. Numele aparatelor și notele de la borne le poți scrie direct aici.</p></div><div class="spacer"></div><button class="btn primary" id="legcsv">Salvează legenda (.csv)</button></div>
 <div class="row" style="margin:12px 0 4px"><label class="chk"><input type="checkbox" id="legnums"${model.cfg.showNums?' checked':''}> Arată numerele aparatelor pe schemă</label><label class="chk"><input type="checkbox" id="legfree"${legFree?' checked':''}> Arată și bornele libere</label></div>`;
 let cur=null;
 for(const r of rows){if(!legFree&&!r.to.length&&!r.note)continue;
  if(cur!==r.c.id){if(cur)h+='</tbody></table>';cur=r.c.id;h+=`<div class="leghead"><span class="num">${r.n}</span><input type="text" class="legname" data-lname="${r.c.id}" value="${esc(r.c.label)}" placeholder="Denumește (ex. Bucătărie)" maxlength="18" aria-label="Numele aparatului ${r.n}"><span class="muted">${esc(r.d.name)}, ${esc(r.place)}</span></div><table class="bomt legt"><thead><tr><th>Bornă</th><th>Sens</th><th>Legată la</th><th>Conductor</th><th>Notă</th></tr></thead><tbody>`;}
  h+=`<tr><td><span class="k" style="--k:${KIND_COLOR[r.t.kind]}">${esc(r.t.label)}</span>${r.tl?`<br><span class="ptag">${esc(r.tl)}</span>`:''}</td><td class="muted">${r.dir}</td><td>${r.to.length?r.to.map(x=>esc(x.txt)).join('<br>'):'<span class="muted">liberă</span>'}</td><td>${r.to.map(x=>esc(x.cond)).join('<br>')}</td><td><input type="text" class="legnote" data-lnote="${r.k}" value="${esc(r.note)}" placeholder="scrie o notă" maxlength="40"></td></tr>`;}
 if(cur)h+='</tbody></table>';else h+='<p class="muted">Nu există încă legături. Trage fire între aparate și apar aici.</p>';

function inspBand(id){const b=model.bands.find(x=>x.id===id);if(!b)return inspNone();if(isFree()&&b.type==='din'){const L=layout(),bl=L.bands.find(x=>x.id===id),n=model.comps.filter(c=>c.zone==='panel'&&c.band===id).length;return `<h2>${esc(bandName(b,L))}</h2><p class="sub">Șină DIN ${Math.round(bl.railLen)} mm, ${n} aparate</p><div class="grid2"><label class="field"><span>Începe la (din stânga, mm)</span><input type="number" data-rfk="fx" value="${Math.round(b.fx)}"></label><label class="field"><span>Axa șinei (de sus, mm)</span><input type="number" data-rfk="fy" value="${Math.round(b.fy)}"></label><label class="field"><span>Lungime (mm)</span><input type="number" data-rfk="len" value="${Math.round(bl.railLen)}"></label></div><p class="muted" style="font-size:12.5px">Trage șina de corp oriunde; de capetele galbene o scurtezi sau o lungești.</p><div class="row"><button class="btn sm danger" data-del${n?' disabled title="Mută sau șterge întâi aparatele de pe ea"':''}>Șterge șina</button></div>`;}const L=layout(),bl=L.bands.find(x=>x.id===id),items=model.comps.filter(c=>c.zone==='panel'&&c.band===id);const i=model.bands.indexOf(b);const metal=L.metal;

 ${metal&&b.type!=='duct'?`<label class="field"><span>Tipul rândului</span><select data-btype>${[['din','Șină DIN pe toată lățimea'],['dual','Rând dublu: stânga curenți tari, dreapta curenți slabi'],['plate','Zonă pe placă (fără șină)'],['mix','Mixt: șină scurtă și placă alături']].map(([v,n])=>`<option value="${v}"${b.type===v?' selected':''}>${n}</option>`).join('')}</select></label>`:''}
 ${b.type==='dual'?`<div class="grid3"><label class="field"><span>Module stânga (curenți tari)</span><input type="number" min="2" max="36" data-dualL value="${+b.modsL||12}"></label><label class="field"><span>Module dreapta (curenți slabi)</span><input type="number" min="2" max="36" data-dualR value="${+b.modsR||12}"></label><label class="field"><span>Spațiu între ele (mm)</span><input type="number" min="0" max="200" step="9" data-dualG value="${(b.gap!=null&&b.gap!==''?+b.gap:2)*U}"></label></div>`:''}${b.type==='din'||b.type==='plate'||b.type==='mix'?`<label class="field"><span>Rândul este pentru</span><select data-bzl><option value=""${b.zl!=='slabi'?' selected':''}>Curenți tari (230/400 V)</option><option value="slabi"${b.zl==='slabi'?' selected':''}>Curenți slabi (date, media, 12/24 V)</option></select></label>`:''}
 ${(()=>{const ax=b.type!=='plate'&&b.type!=='duct';const t=Math.round(bl.gt+(ax?bl.h/2:0)),u=Math.round(bl.gb+(ax?bl.h/2:0));return `<div class="grid2"><label class="field"><span>${ax?'Jgheab sus → axa șinei (mm)':'Spațiu sub jgheabul de sus (mm)'}</span><input type="number" min="2" step="1" data-bgap="top" value="${t}"></label><label class="field"><span>${ax?'Axa șinei → jgheab jos (mm)':'Spațiu deasupra jgheabului de jos (mm)'}</span><input type="number" min="2" step="1" data-bgap="bot" value="${u}"></label></div><label class="field"><span>Deplasare de la stânga (mm)</span><input type="number" min="0" step="1" data-boff value="${Math.round(bl.off||0)}"></label>${b.type==='din'&&metal?`<label class="field"><span>Lungime șină (mm)${bl.full?', până în jgheab':''}</span><input type="number" min="18" step="1" data-blen value="${Math.round(bl.railLen)}"></label><div class="row" style="margin-top:-4px"><button class="btn sm" data-railfull${bl.full&&!bl.off?' disabled':''}>Șina între jgheaburi, pe toată lățimea</button></div><p class="muted" style="margin:0 0 8px;font-size:12.5px">Poți trage și direct pe schemă: capetele galbene schimbă lungimea, șina o muți trăgând de ea sau de numele ei.</p>`:''}`;})()}

function inspDuct(k){const L=layout();const isSide=k==='L'||k==='R'||k==='V';const d=ductOf(k,L);if(!d)return inspNone();const a=L.area[k]||0,n=(L.lists[k]||[]).length,cap=d.w*d.d;const pct=Math.round(a/cap*100);const ov=model.ducts[k]||'auto';

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function photoRawFromFile(f){const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});const im=await loadImg(url);

async function processPhoto(raw,opt){const im=await loadImg(raw);const s=Math.min(1,480/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(im,0,0,w,h);

  const t=Math.max(6,(opt.tol||40)*.5);const isObj=k=>transp?p[k+3]>40:Math.hypot(p[k]-r,p[k+1]-g,p[k+2]-b)>t;
  const rows=new Uint32Array(h),cols=new Uint32Array(w);for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(isObj(at(i,j))){rows[j]++;cols[i]++;}
  const mr=Math.max(2,Math.round(w*.015)),mc=Math.max(2,Math.round(h*.015));

  if(bb-a>h*.1&&d-c>w*.1){x0=c;y0=a;x1=d;y1=bb;}}

 {const X=-L.bx-262;const ord=[{y:0,t:'0'}];for(const d of L.ducts)if(d.w>0)ord.push({y:d.cy-d.w/2},{y:d.cy+d.w/2});for(const b of L.bands){if(b.type==='plate'||b.type==='duct')ord.push({y:b.top},{y:b.top+b.h});else ord.push({y:b.cy,axis:1});}ord.push({y:L.PH});

function xid(c){let i=1;const ids=new Set(DEFS[c.t].terms(Object.assign({},c,{hide:[]})).map(t=>t.id));while(ids.has('x'+i))i++;return 'x'+i;}
function xNum(c,base){let n=1;const labs=new Set((c.xt||[]).map(t=>t.label));while(labs.has(n+String(base)))n++;return n;}
function xAdd(c,kind){c.xt=c.xt||[];c.xl=c.xl||[];const side=DEFS[c.t].zone==='field'?'top':'bot';
 const add=(label,k,sd)=>{const id=xid(c);c.xt.push({id,label,kind:k,side:sd});return id;};
 if(kind==='term')add('T'+(c.xt.length+1),'CTRL','top');
 else if(kind==='no'){const n=xNum(c,3);const a=add(n+'3','CTRL','top'),b=add(n+'4','CTRL',side);c.xl.push({a,b,mode:'on'});}
 else if(kind==='nc'){const n=xNum(c,1);const a=add(n+'1','CTRL','top'),b=add(n+'2','CTRL',side);c.xl.push({a,b,mode:'off'});}
 else if(kind==='co'){const n=xNum(c,1);const cm=add(n+'1','CTRL','top'),nc=add(n+'2','CTRL',side),no=add(n+'4','CTRL',side);c.xl.push({a:cm,b:no,mode:'on'},{a:cm,b:nc,mode:'off'});}
 else if(kind==='dali'){add('DA+','DALI',side);add('DA−','DALI',side);}}

function ductExtra(k){if(model.cfg.box==='rack')return '';const L=layout();const isV=k==='L'||k==='R'||k==='V';const dObj=L.side[k]||L.ducts.find(x=>x.k===k)||Object.values(L.dd||{}).find(x=>x.k===k);const extH=dObj?`<div class="grid2"><label class="field"><span>${isV?'Începe de sus la (mm)':'Începe din stânga la (mm)'}</span><input type="number" min="0" data-dext="${k}:a" value="${Math.round(isV?(dObj.top??L.sTop):(dObj.x1??L.hx1))}"></label><label class="field"><span>${isV?'Se termină jos la (mm)':'Se termină în dreapta la (mm)'}</span><input type="number" min="0" data-dext="${k}:b" value="${Math.round(isV?(dObj.bot??L.sBot):(dObj.x2??L.hx2))}"></label></div><p class="muted" style="font-size:12.5px;margin:-4px 0 6px">Sau trage de pătratele galbene de la capetele jgheabului ca să-l scurtezi sau să-l lungești.</p>${dObj.cut?`<button class="btn sm" data-dextreset="${k}">Lungimea automată</button>`:''}`:'';return ductExtra1(k,L,isV)+extH+(k[0]==='g'||k==='L'||k==='R'?`<h3>Ștergere</h3><button class="btn sm danger" data-ductdel="${k}">Șterge acest jgheab</button><p class="muted" style="font-size:12px;margin:4px 0 0">Îl pui la loc din cardul cutiei: „Pune la loc jgheaburile șterse”.</p>`:k==='V'?'':'');}
function ductExtra1(k,L,isV){const DF=model.ductFull||{};const nb=model.bands.length;const L0=layout();const dk_=L0.ducts.find(d=>d.k===k)||(L0.dd&&Object.values(L0.dd).find(d=>d.k===k));const on_=isV?!(L0.ducts[0].full||L0.ducts[nb].full):!!(dk_&&dk_.full);const adp=`<h3>Lungime</h3><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm${on_?' on':''}" data-ductfull="${k}">${isV?'Adaptează la cutie: de sus până jos':'Adaptează la cutie: de la un capăt la altul'}</button>${!isV&&dk_&&dk_.full?`<button class="btn sm" data-ductfull0="${k}">Doar între jgheaburile laterale</button>`:''}</div><p class="muted" style="font-size:12.5px;margin:4px 0 8px">${isV?'Jgheabul lateral merge pe toată înălțimea, iar cele de sus și de jos se opresc în el.':'Jgheabul merge pe toată lățimea cutiei, peste jgheaburile laterale, care se opresc în el.'}</p>`;if(model.cfg.box!=='metal')return adp;const cvb=adp+`<h3>Capac</h3><div class="row"><button class="btn" data-cover="${k}">${coverOn(k)?'Scoate capacul de pe acest jgheab':model.cfg.covers2d?'Pune capacul la loc':'Pune capacul doar pe acesta'}</button></div>`;return cvb+ductExtra0(k,L);}
function ductExtra0(k,L){if(k==='V')return `<h3>Jgheab curenți slabi</h3><div class="row"><button class="btn" data-lvside="${model.cfg.lvSide==='L'?'R':'L'}">Mută-l pe partea ${model.cfg.lvSide==='L'?'dreaptă':'stângă'}</button><button class="btn danger" data-lvside="none">Scoate-l</button></div>`;

 if(k[0]==='g'){const i=+k.slice(1);if(i>0&&i<model.bands.length)return `<h3>Poziție</h3><p class="muted" style="font-size:12.5px;margin:0 0 6px">Trage jgheabul în sus sau în jos cu degetul. Acum: ${Math.round(L.bands[i-1].gb)} mm până la rândul de deasupra, ${Math.round(L.bands[i].gt)} mm până la cel de dedesubt.</p>`;return `<h3>Poziție</h3><label class="field"><span>Distanță de la marginea ${i===0?'de sus':'de jos'} a plăcii (mm)</span><input type="number" min="0" data-ductoff="${i===0?'T':'B'}" value="${i===0?(+model.cfg.ductTopOff||0):(+model.cfg.ductBotOff||0)}"></label><p class="muted" style="font-size:12.5px;margin:0">Sau trage-l cu degetul (de mâner sau de jgheab). 0 = lipit de cutie.</p>`;}return '';}

function montajRows(L){L=L||layout();if(L.rack)return [];if(L.free){const r=v=>Math.round(v);const out=[{head:'Reper'},[`Cotele sunt de la marginea de sus și din stânga a plăcii de montaj (placa ${r(L.PW)} × ${r(L.PH)} mm, la ${boxM()} mm de pereții cutiei).`,'']];out.push({head:'Jgheaburi'});(L.freeD||[]).forEach((d,i)=>out.push([`Jgheab ${d.dir==='h'?'orizontal':'vertical'} ${i+1} (${d.w} × ${d.d} mm)`,d.dir==='h'?`axa la ${r(d.y)} mm de sus; de la ${r(Math.min(d.x1,d.x2))} la ${r(Math.max(d.x1,d.x2))} mm pe lățime`:`axa la ${r(d.x)} mm din stânga; de la ${r(Math.min(d.y1,d.y2))} la ${r(Math.max(d.y1,d.y2))} mm pe înălțime`]));out.push({head:'Șine DIN'});L.bands.filter(b=>b.type==='din').forEach((b,i)=>{out.push([`Șina DIN ${i+1}: axa la ${r(b.cy)} mm`,`lungime ${r(b.railLen)} mm, de la ${r(b.off)} la ${r(b.off+b.railLen)} mm pe lățime`]);});return out;}const out=[];const r=v=>Math.round(v);
 const ref=L.metal?`Toate cotele sunt de la marginea de sus și din stânga a plăcii de montaj (placa ${r(L.PW)} × ${r(L.PH)} mm${L.box?`, la ${boxM()} mm de pereții cutiei`:''}).`:`Cotele sunt de la marginea de sus și din stânga a spațiului de montaj (${r(L.PW)} × ${r(L.PH)} mm).`;
 out.push({head:'Reper'},[ref,'']);
 out.push({head:'Jgheaburi verticale'});for(const k of sideKeys(L)){const d=L.side[k];out.push([`Jgheab vertical ${k==='L'?'stânga':k==='R'?'dreapta':'curenți slabi'} ${d.w} × ${d.d} mm`,`de la ${r(d.cx-d.w/2)} la ${r(d.cx+d.w/2)} mm pe lățime${d.ins?` (la ${d.ins} mm de marginea plăcii)`:', lipit de margine'}, pe toată înălțimea`]);}
 out.push({head:'De sus în jos'});let lastAxis=null,nD=0,nR=0;const x1=r(L.hx1),x2=r(L.hx2);
 const items=[];L.ducts.forEach((d,i)=>{if(d.w>0)items.push({y:d.cy-d.w/2,t:'d',d,i});});L.bands.forEach(b=>items.push({y:b.top,t:'b',b}));items.sort((a,b)=>a.y-b.y);
 for(const it of items){if(it.t==='d'){nD++;const d=it.d;const a1=r(d.x1??L.hx1),a2=r(d.x2??L.hx2);out.push([`Jgheab orizontal ${nD} (${d.w} × ${d.d} mm)${d.full?', de la un capăt la altul':''}`,`marginea de sus la ${r(d.cy-d.w/2)} mm, marginea de jos la ${r(d.cy+d.w/2)} mm; lungime ${a2-a1} mm (de la ${a1} la ${a2} mm)`]);continue;}
  const b=it.b,mb=model.bands.find(x=>x.id===b.id);const nm=bandName(mb);
  if(b.type==='duct'){const dd=L.dd[b.i];out.push([`${nm} (${dd.w} × ${dd.d} mm)`,`marginea de sus la ${r(b.top)} mm, de jos la ${r(b.top+b.h)} mm`]);continue;}
  if(b.type==='plate'){out.push([nm,`de la ${r(b.top)} la ${r(b.top+b.h)} mm (înălțime ${r(b.h)} mm)`]);continue;}
  const S=segs(mb);const xa=L.x0+(b.off||0)+(S.din?S.din[0]*U:0);const len=b.type==='din'?b.railLen:(S.din?(S.din[1]-S.din[0])*U:0);
  const up=L.ducts[b.i],dn=L.ducts[b.i+1];const dUp=up?r(b.cy-(up.cy+up.w/2)):null,dDn=dn?r((dn.cy-dn.w/2)-b.cy):null;
  out.push([`${nm}: axa la ${r(b.cy)} mm`,`lungime șină ${r(len)} mm, de la ${r(xa)} la ${r(xa+len)} mm pe lățime${dUp!=null?`; de la axă la jgheabul de sus ${dUp} mm`:''}${dDn!=null?`, la cel de jos ${dDn} mm`:''}${lastAxis!=null?`; față de șina anterioară ${r(b.cy-lastAxis)} mm`:''}`]);lastAxis=b.cy;{const its=model.comps.filter(c=>c.zone==='panel'&&c.band===b.id).sort((p,q)=>p.x-q.x);if(its.length){let prev=xa;const parts=[];for(const c of its){const o=compOrigin(c,L),W=WPX(c);if(o.x-prev>0.9)parts.push(`spațiu ${r(o.x-prev)}`);parts.push(`${c.label||DEFS[c.t].short} ${r(o.x-xa)}–${r(o.x-xa+W)}`);prev=Math.max(prev,o.x+W);}if(xa+len-prev>0.9)parts.push(`liber ${r(xa+len-prev)}`);out.push(['   aparate pe șină (mm de la capătul din stânga al șinei)',parts.join(' · ')]);}}}
 return out;}

function doorDevices3D(pivot,L,S,M,dw,dh){const ds=model.comps.filter(c=>c.zone==='door');if(!ds.length||!L.doorX)return;

function schemaSVGString(){const L=layout(),[vx,vy,bw,bh]=viewBounds(L);return {w:bw,h:bh,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${bw} ${bh}" width="${Math.round(bw*2)}" height="${Math.round(bh*2)}"><style>.wire path{fill:none;stroke-linejoin:round;stroke-linecap:round}.wire.dead{opacity:.2}</style>${$('#cv defs').outerHTML}<rect x="${vx}" y="${vy}" width="${bw}" height="${bh}" fill="#ffffff"/>${worldSVG(solve()).replace(/<circle class="pulse"[^>]*\/>|<line id="pline"[^>]*\/>/g,'')}</svg>`};}
function svgToCanvas(svg,w,h,maxW){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(3,maxW/w);const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);res(cv);};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
async function schemaPNG(){const {svg,w,h}=schemaSVGString();const cv=await svgToCanvas(svg,w,h,2400);return new Promise(r=>cv.toBlob(r,'image/png'));}
async function snap3d(view){const r=init3d();if(!r)return null;const S=solve();const prevTab=tab;tab='3d';const host=$('#v3d');const hidden=$('#view3d').hidden;$('#view3d').hidden=false;

  const W=1600,Hh=1200;const oldSz=new THREE.Vector2();r.renderer.getSize(oldSz);const oldA=r.cam.aspect;r.renderer.setSize(W,Hh,false);r.cam.aspect=W/Hh;r.cam.updateProjectionMatrix();r.ctl.update();r.renderer.render(r.scene,r.cam);const url=r.renderer.domElement.toDataURL('image/jpeg',.9);
  r.renderer.setSize(oldSz.x||host.clientWidth,oldSz.y||host.clientHeight);r.cam.aspect=oldA;r.cam.updateProjectionMatrix();return url;}

function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf);return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>window.jspdf?res(window.jspdf):rej(new Error('jspdf'));s.onerror=rej;document.head.appendChild(s);});}
function textPages(title,rows,cols){const W=1240,H=1754,M=70,pages=[];let cv,x,y;const co=model.company;
 const newPage=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#1F2B33';x.font='700 30px Barlow Condensed, Arial Narrow, Arial';x.fillText(title,M,M+20);x.font='500 17px Barlow, Arial';x.fillStyle='#5E6B73';x.fillText(`${model.name||''}${model.client?' · '+model.client:''}`,M,M+48);
  x.textAlign='right';x.fillText(`${co.name||'Smart Electroconect SRL'} · ${co.phone||''} · ${co.email||''}`,W-M,M+20);x.fillText('Autorizație nr. '+(co.auth||''),W-M,M+44);x.textAlign='left';x.strokeStyle='#D6DBD8';x.beginPath();x.moveTo(M,M+64);x.lineTo(W-M,M+64);x.stroke();y=M+100;
  x.font='700 16px Barlow, Arial';x.fillStyle='#5E6B73';let cx=M;for(const [h,w] of cols){x.fillText(h,cx,y);cx+=w;}y+=12;x.beginPath();x.moveTo(M,y);x.lineTo(W-M,y);x.stroke();y+=26;pages.push(cv);};
 newPage();const wrap=(t,w)=>{const words=String(t).split(' ');const lines=[];let l='';x.font='500 16px Barlow, Arial';for(const wd of words){const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>w-12&&l){lines.push(l);l=wd;}else l=tt;}lines.push(l);return lines;};
 for(const r of rows){if(r.head){if(y>H-120)newPage();x.font='700 20px Barlow Condensed, Arial Narrow, Arial';x.fillStyle='#1F2B33';x.fillText(r.head,M,y+4);y+=34;continue;}
  const cells=r.map((v,i)=>wrap(v,cols[i][1]));const lh=22*Math.max(...cells.map(c=>c.length));if(y+lh>H-60)newPage();let cx=M;x.fillStyle='#1F2B33';x.font='500 16px Barlow, Arial';cells.forEach((ls,i)=>{ls.forEach((l,j)=>x.fillText(l,cx,y+j*22));cx+=cols[i][1];});y+=lh+6;x.strokeStyle='#EEF0EE';x.beginPath();x.moveTo(M,y-14);x.lineTo(W-M,y-14);x.stroke();}
 return pages;}
async function buildPDF(){toast('Pregătesc PDF-ul…');const {jsPDF}=await loadJsPDF();const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const PW=210,PH=297;let first=true;

 addCanvasPages(textPages('Listă de materiale',rows,[['Denumire',820],['Cantitate',280]]));
 {const mr=montajRows(L);if(mr.length)addCanvasPages(textPages('Cote de montaj (execuție)',mr,[['Element',420],['Cote',680]]));}

 if(lr.length)addCanvasPages(textPages('Legendă conexiuni',lr,[['Bornă',150],['Legată la',470],['Conductor',260],['Notă',220]]));
 const chk=L.rack?rackRules():execChecks();if(chk.length)addCanvasPages(textPages('Reguli de execuție',chk.map(([lv,t,d])=>[(lv==='ok'?'✔ ':lv==='warn'?'⚠ ':'• ')+t,d]),[['Regula',380],['Detalii',720]]));
 return pdf.output('blob');}

 $('#logoIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width,300/im.height),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);commit(()=>{model.logo=cv.toDataURL('image/png');});loadLogo();openSettings();toast('Logo încărcat; apare pe ușa tabloului în 3D');};im.src=rd.result;};rd.readAsDataURL(f);e.target.value='';};
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){draft=null;closeModal();}});
 $('#libIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const list=Array.isArray(j)?j:j.products;if(!Array.isArray(list))throw 0;if(j&&j.photos)mergePhotos(j.photos);const n=mergeProducts(list);renderLib();toast(n?`Am adăugat ${n} produse în biblioteca ta`:'Toate produsele din fișier erau deja în bibliotecă');}catch(err){toast('Fișierul nu conține produse valide','err');}};rd.readAsText(f);e.target.value='';};
 $('#newBox').onclick=openNewBox;
 $('#shareBtn').onclick=openShare;
 $('#photoIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!photoFor)return;try{const t=photoFor;const raw=await photoRawFromFile(f);const prev=[PHOTOS[t],PRAW[t]];PRAW[t]=raw;POPT[t]={bg:true,tol:40};PHOTOS[t]=await processPhoto(raw,POPT[t]);if(!savePhotos()){PHOTOS[t]=prev[0];PRAW[t]=prev[1];if(!prev[0])delete PHOTOS[t];return;}touch();render();toast('Poza a fost pusă și decupată pe marginile aparatului. Dacă a tăiat prea mult sau prea puțin, reglează din dreapta.');}catch(err){toast('Imaginea nu s-a putut citi','err');}};
 $('#zin').onclick=()=>{const r=$('#cv').getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);};$('#zout').onclick=()=>{const r=$('#cv').getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.8);};$('#zfit').onclick=fit;
 $('#rackview').addEventListener('click',e=>{const b=e.target.closest('[data-rv]');if(!b)return;model.cfg.rackView=b.dataset.rv;touch();save();render();requestAnimationFrame(fit);});
 $('#zdims').onclick=()=>{model.cfg.showDims=model.cfg.showDims===false;save();render();};
 $('#zaxis').onclick=()=>{AXLOCK=!AXLOCK;try{localStorage.setItem('se-axlock',AXLOCK?'1':'0');}catch(_){}$('#zaxis').setAttribute('aria-pressed',AXLOCK);$('#zaxis').textContent=AXLOCK?'↔ | ↕':'↔↕ liber';toast(AXLOCK?'Muți pe o singură direcție: ori stânga-dreapta, ori sus-jos (după cum începi să tragi).':'Muți în orice direcție, și pe diagonală.');};{const z=$('#zaxis');if(z){z.setAttribute('aria-pressed',AXLOCK);z.textContent=AXLOCK?'↔ | ↕':'↔↕ liber';}}
 $('#zfree').onclick=()=>{if(model.cfg.box!=='metal'){toast('Mutarea liberă e la cutia metalică.','warn');return;}if(!isFree()){commit(()=>{toFree();});toast('Mutare liberă pornită: trage orice șină, jgheab sau aparat unde vrei.');}else{if(!confirm('Revii la aranjarea automată? Se pierd mutările libere.'))return;commit(()=>{fromFree();});}requestAnimationFrame(fit);};
 $('#zcovers').onclick=()=>{model.cfg.covers2d=!model.cfg.covers2d;model.coverOff={};save();render();toast(model.cfg.covers2d?'Capacele sunt puse. Atinge un aparat sau un fir ca să-i vezi traseul.':'Capacele sunt scoase: vezi toate firele din jgheaburi.');};
 $('#zlabels').onclick=()=>{model.cfg.showLabels=model.cfg.showLabels===false;save();render();};
 $('#door').onclick=toggleDoor;
 $('#lids').onclick=()=>{model.cfg.covers2d=!model.cfg.covers2d;model.coverOff={};save();render();};
 $('#focus3d').onclick=()=>{if(!R3)return;R3.focus=!R3.focus;$('#focus3d').setAttribute('aria-pressed',R3.focus);if(R3.focus&&!sel)toast('Selectează un aparat sau un fir; restul firelor se estompează.');render();};
 $('#field3d').onclick=()=>{if(!R3)return;R3.showField=!R3.showField;$('#field3d').setAttribute('aria-pressed',R3.showField);render();};
 $('#rulesBtn').onclick=()=>{const p=$('#rules3d');p.hidden=!p.hidden;if(!p.hidden)p.querySelector('.rbody').innerHTML=rulesHTML();};
 document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>cam3d(b.dataset.cam));$('#recenter').onclick=recenter3d;
 document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}else if(e.key==='Escape'){pending=null;reconn=null;draft=null;closeModal();render();}else if((e.key==='Delete'||e.key==='Backspace')&&sel&&tab==='2d'){e.preventDefault();delSel();}});
 new ResizeObserver(()=>{if(tab==='2d'&&!init.fitted){fit();}}).observe($('#stage'));
 render();requestAnimationFrame(()=>{fit();init.fitted=true;});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderLib();render();});}
/* ---------- tragere șină: mutare și lungime ---------- */
let railRaf=0;
function railDrag(g,ddx,ddy){const id=g.rl||g.re.split(':')[0];const b=model.bands.find(x=>x.id===id);if(!b)return;
 if(isFree()){if(!g.init){const L=layout(),bl=L.bands.find(x=>x.id===id);g.init={snap:JSON.stringify(model),fx:+b.fx,fy:+b.fy,len:bl.railLen,items:model.comps.filter(c=>c.zone==='panel'&&c.band===id).map(c=>({c,x:c.x,w:DEFS[c.t].w(c)}))};}const I=g.init;const maxEnd=I.items.reduce((m,o)=>Math.max(m,(o.x+o.w)*U),0);
  if(g.type==='rl'){b.fx=Math.round(I.fx+ddx);b.fy=Math.round(I.fy+ddy);}else{const side=g.re.split(':')[1];if(side==='R')b.len=Math.max(Math.round(I.len+ddx),maxEnd,U*2);else{let dU=Math.round(ddx/U);const minX=I.items.reduce((m,o)=>Math.min(m,o.x),1e9);if(I.items.length)dU=Math.min(dU,minX);dU=Math.min(dU,Math.floor((I.len-Math.max(maxEnd,U*2))/U));b.fx=Math.round(I.fx+dU*U);b.len=Math.round(I.len-dU*U);for(const o of I.items)o.c.x=o.x-dU;}}
  touch();if(!railRaf)railRaf=requestAnimationFrame(()=>{railRaf=0;render2d(solve());});return;}
 if(!g.init){const L=layout(),bl=L.bands.find(x=>x.id===id);g.init={snap:JSON.stringify(model),off:bl.off||0,gt:bl.gt,len:bl.railLen,innerW:L.innerW,items:model.comps.filter(c=>c.zone==='panel'&&c.band===id).map(c=>({c,x:c.x,w:DEFS[c.t].w(c)}))};}
 const I=g.init,maxEnd=I.items.reduce((m,o)=>Math.max(m,(o.x+o.w)*U),0),minX=I.items.reduce((m,o)=>Math.min(m,o.x),1e9);
 if(g.type==='rl'){const nOff=Math.max(0,Math.round(I.off+ddx));const room=I.innerW-Math.max(b.type==='din'&&+b.len>0?+b.len:maxEnd,maxEnd);if(Math.abs(ddx)>=4)b.off=Math.min(nOff,Math.max(0,Math.floor(room)));if(Math.abs(ddy)>=4)b.gapTop=Math.max(2,Math.round(I.gt+ddy));}
 else{const side=g.re.split(':')[1];if(side==='R'){let len=Math.round(I.len+ddx);len=Math.max(len,maxEnd,U*2);if(len>=I.innerW-I.off-4)b.len=null;else b.len=len;}
  else{let dU=Math.round(ddx/U);dU=Math.max(dU,-Math.floor(I.off/U));if(I.items.length)dU=Math.min(dU,minX);dU=Math.min(dU,Math.floor((I.len-Math.max(maxEnd,U*2))/U));b.off=Math.max(0,Math.round(I.off+dU*U));b.len=Math.max(U*2,Math.round(I.len-dU*U));for(const o of I.items)o.c.x=o.x-dU;}}
 touch();if(!railRaf)railRaf=requestAnimationFrame(()=>{railRaf=0;render2d(solve());});}
function ductDrag(g,ddx,ddy){const k=g.dk;const L=layout();const nb=model.bands.length;if(!g.init){g.init={snap:JSON.stringify(model)};if(k==='L'||k==='R')g.init.v=L.side[k].ins||0;else if(k==='g0')g.init.v=+model.cfg.ductTopOff||0;else if(k==='g'+nb)g.init.v=+model.cfg.ductBotOff||0;else{const i=+k.slice(1);g.init.gb=L.bands[i-1].gb;g.init.gt=L.bands[i].gt;}}
 if(k==='g0'||k==='g'+nb){if(k==='g0')model.cfg.ductTopOff=Math.max(0,Math.round(g.init.v+ddy));else model.cfg.ductBotOff=Math.max(0,Math.round(g.init.v-ddy));touch();render();return;}
 if(k==='L'||k==='R'){model.cfg[k==='L'?'sideInL':'sideInR']=Math.max(0,Math.round(g.init.v+(k==='L'?ddx:-ddx)));}
 else{const i=+k.slice(1);const minG=Math.max(2,+model.cfg.devGap||2);const gb=Math.max(minG,Math.round(g.init.gb+ddy));model.bands[i-1].gapBot=gb;model.bands[i].gapTop=Math.round(g.init.gt);}
 touch();render();}
function ductDragEnd(g){if(!g.init)return;undoStack.push(g.init.snap);if(undoStack.length>60)undoStack.shift();touch();save();render();const k=g.dk;if(k==='g0'){toast(`Jgheabul de sus e la ${model.cfg.ductTopOff||0} mm de marginea plăcii`);return;}if(k==='g'+model.bands.length){toast(`Jgheabul de jos e la ${model.cfg.ductBotOff||0} mm de marginea plăcii`);return;}if(k==='L'||k==='R')toast(`Jgheabul ${k==='L'?'din stânga':'din dreapta'} e la ${model.cfg[k==='L'?'sideInL':'sideInR']||0} mm de perete`);else{const i=+k.slice(1);toast(`Jgheab mutat: ${model.bands[i-1].gapBot} mm deasupra, ${model.bands[i].gapTop} mm dedesubt`);}}
function railDragEnd(g){if(!g.init)return;undoStack.push(g.init.snap);if(undoStack.length>60)undoStack.shift();touch();save();render();if(isFree()){const b=model.bands.find(x=>x.id===(g.rl||g.re.split(':')[0]));if(b)toast(`Șina: axa la ${Math.round(b.fy)} mm de sus, începe la ${Math.round(b.fx)} mm din stânga, ${Math.round(+b.len||0)} mm lungime.`);return;}const bl=layout().bands.find(x=>x.id===(g.rl||g.re.split(':')[0]));if(bl&&bl.type==='din')toast(g.type==='re'?`Șina are acum ${Math.round(bl.railLen)} mm${bl.full?', până în jgheab':''}`:`Șina e la ${Math.round(bl.gt+bl.h/2)} mm de jgheabul de sus și ${Math.round(bl.off)} mm de la stânga`);}
init();cloudInit();
})();
