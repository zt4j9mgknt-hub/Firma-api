<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#ECEEEB;--surface:#fff;--surface2:#F4F5F2;--ink:#1F2B33;--muted:#5E6B73;--line:#D6DBD8;--accent:#E3A008;--accent-soft:#FFF3D1;--err:#C62828;--warn:#A86400;--ok:#2E7D32;
--f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 336px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand b{font:700 19px/1 var(--fc);letter-spacing:.01em;display:block}
.brand small{font:500 12.5px/1.2 var(--f);color:var(--muted)}
#pname{font:600 15px var(--f);border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;width:220px;color:var(--ink)}
#pname:hover,#pname:focus{border-color:var(--line);background:#fff}
.spacer{flex:1}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font:600 15px var(--fc);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(31,43,51,.18)}
.btn{font:600 14px var(--f);border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9c1bd}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px}
#live[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:#5a3e00}
#live .dot{width:9px;height:9px;border-radius:50%;background:#aab1b5}
#live[aria-pressed=true] .dot{background:#E3A008;box-shadow:0 0 0 3px rgba(227,160,8,.25)}
.menu{position:absolute;right:14px;top:54px;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(31,43,51,.18);padding:6px;display:none;z-index:60;min-width:250px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font:500 14px var(--f);cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#lib{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px 12px 30px}
#lib input{width:100%}
.grp h3{font:600 14px var(--fc);color:var(--muted);margin:16px 4px 4px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:7px;cursor:pointer;font:500 13.5px/1.25 var(--f)}
.li:hover{background:var(--surface2);border-color:var(--line)}
.li .th{width:60px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.li .th svg{max-width:60px;max-height:38px}
.li small{margin-left:auto;color:var(--muted);font:500 12.5px var(--fc);white-space:nowrap;padding-left:6px}
#stage{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
#cv{width:100%;height:100%;display:block;touch-action:none;background-color:var(--bg);background-image:radial-gradient(#cdd3cf 1px,transparent 1px);background-size:18px 18px;user-select:none;-webkit-user-select:none}
#cv .lbl{font:600 15px var(--fc);fill:#5E6B73}
#cv .comp{cursor:grab}
#cv.sim .comp.act{cursor:pointer}
#cv .term{cursor:crosshair}
#cv .term:hover circle:first-child{stroke-width:2.6}
#cv .wire{cursor:pointer}
#cv .wire path{fill:none;stroke-linejoin:round;stroke-linecap:round}

#ghost{pointer-events:none}
#ghost.ok{fill:rgba(227,160,8,.18);stroke:#E3A008;stroke-width:2;stroke-dasharray:5 4}

.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font:500 13.5px var(--f);max-width:calc(100% - 130px);text-align:center;pointer-events:none;box-shadow:0 4px 14px rgba(31,43,51,.2)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}

.zoom #zlabels,.zoom #zdims,.zoom #zcovers,.zoom #zfree,.zoom #zaxis,.zoom #zsel{width:auto;min-width:38px;padding:0 6px}
.zoom button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 18px var(--f);cursor:pointer}
#v3d{position:absolute;inset:0}

.tools3d{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}

.empty3d{padding:40px;color:var(--muted)}
#viewbom,#viewleg{overflow:auto;padding:22px}
.leg{max-width:1100px}
.leghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
.leghead .num{background:var(--ink);color:#fff;font:700 14px var(--fc);min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.legname{width:200px!important;font-weight:600!important}
.legt td{font-size:13.5px}
.legt td:nth-child(1){width:70px}.legt td:nth-child(2){width:110px}.legt td:nth-child(4){width:150px}.legt td:nth-child(5){width:210px}

@media (max-width:700px){.legt thead{display:none}.legt tr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;border-top:1px solid var(--line);padding:6px 0}.legt td{border:0;padding:2px 0;width:auto!important}.legt td:nth-child(n+3){grid-column:2}}
.bom{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 24px 26px}
.bom h2{font:700 26px var(--fc);margin:0}
.bom h3{font:600 17px var(--fc);margin:22px 0 6px}
.bomt{width:100%;border-collapse:collapse;font-size:14px}
.bomt td,.bomt th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.bomt th{font:600 13px var(--fc);color:var(--muted);border-top:0}
.bomt td.q{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:110px}
.bomhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bomhead p{margin:4px 0 0;color:var(--muted)}
#insp{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px}

#insp h3{font:600 16px var(--fc);margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.field{display:grid;gap:4px;margin:0 0 11px}
.field>span{font:600 13px var(--fc);color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input:not([type]),input[type=search]{font:500 14px var(--f);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px}
.chips{display:flex;gap:6px;margin:-4px 0 12px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.state{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.state b{font-weight:600}
table.conn{width:100%;border-collapse:collapse;font-size:13.5px}
table.conn td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.conn td:first-child{width:70px}
.k{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--fc)}
.k::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.muted{color:var(--muted)}
.lnk{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:#b9c1bd;text-underline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 4px 5px;font:500 13px var(--f);cursor:pointer}
.swatches button span{width:15px;height:15px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

.checks ul{list-style:none;margin:0;padding:0}
.checks li{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.checks li::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c)}
.checks li.err{--c:var(--err)}.checks li.warn{--c:#E08A00}.checks li.info{--c:#8a979e}
.issue{all:unset;cursor:pointer;flex:1;font-size:13.5px}
.fix{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font:600 12.5px var(--f);cursor:pointer;white-space:nowrap}
.pill{font:600 13px var(--fc);padding:2px 9px;border-radius:10px;background:#E8F3E9;color:var(--ok)}
.pill.err{background:#FBE9E9;color:var(--err)}.pill.warn{background:#FFF1DB;color:var(--warn)}
ol.steps{padding-left:20px;margin:6px 0 0}ol.steps li{margin:0 0 8px}
.stats{display:flex;gap:18px;margin:10px 0 4px}
.stats div b{display:block;font:700 26px/1 var(--fc)}
.stats div span{color:var(--muted);font-size:13px}
.handle{display:none}
.exadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.exadd select{flex:1;min-width:220px;width:auto}.exadd input{width:auto}
.tlab{display:block;margin-top:3px;width:100%!important;padding:3px 6px!important;font-size:12px!important}
.wtag,.ptag{display:inline-block;background:#fffbe6;border:1px solid #d9b84a;border-radius:4px;padding:0 5px;font:700 12px var(--fc);color:#1f2a30}
.ptag{background:#e8f1fb;border-color:#9dbadf;color:#123a63}
.nbk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbc{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font:inherit}
.nbc:hover{border-color:#b9c1bd}
.nbc[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--surface2)}
.nbc svg{flex:none}.nbc b{display:block;font:700 17px/1.15 var(--fc);margin-bottom:3px}.nbc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
@media (max-width:600px){.nbk{grid-template-columns:1fr}.nbc{padding:10px}}
.rackview{position:absolute;left:12px;top:12px;display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;box-shadow:0 2px 8px rgba(31,43,51,.12)}.rackview button{border:0;background:none;padding:7px 14px;border-radius:7px;font:600 14px var(--fc);cursor:pointer;color:var(--muted)}.rackview button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg2{display:flex;gap:6px;flex-wrap:wrap}.seg2 .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.crimp{position:fixed;inset:0;background:rgba(20,26,30,.55);display:none;align-items:center;justify-content:center;z-index:95;padding:12px}.crimp.open{display:flex}
.crimp-box{background:#fff;border-radius:14px;width:min(920px,100%);height:min(680px,100%);display:flex;flex-direction:column;overflow:hidden}
.crimp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.crimp-head b{font:700 20px var(--fc);display:block}.crimp-head small{color:var(--muted)}
#cr_v{flex:1;min-height:200px;position:relative}#cr_v canvas{display:block;touch-action:none}
.crimp-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}.crimp-foot p{margin:0 0 8px;min-height:40px}
.crimp-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}.crimp-legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.menu3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:4px}.menu .menu3 button{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 6px}.menu3 b{font:700 14px var(--fc)}.menu3 small{color:var(--muted);font-size:11.5px}
.seg3{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:3px}
#focus3d[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.tools3d{right:12px;max-width:calc(100% - 24px)}
@media (max-width:900px){.tools3d .btn{padding:6px 9px;font-size:13px}.rules3d{left:12px;right:12px;width:auto;top:110px}}
.rules3d{position:absolute;right:12px;top:60px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(31,43,51,.18);padding:12px 14px}.rules3d .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rules3d .rhead b{font:700 17px var(--fc)}
.rules{list-style:none;margin:0;padding:0}.rules li{padding:7px 0;border-top:1px solid var(--line);display:grid;gap:2px}.rules li b{font:600 14px var(--fc)}.rules li span{font-size:13px;color:var(--muted)}.rules li.ok b{color:var(--ok)}.rules li.warn b{color:var(--warn)}
[hidden]{display:none!important}
@media (max-width:900px){.hint3d{display:none}}
#cv [data-duct]{cursor:grab}
.montaj{margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}.montaj summary{cursor:pointer;font:600 15px var(--fc)}.montaj .mh{font:700 13px var(--fc);color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}.montaj .mr{padding:5px 0;border-top:1px solid #eef0ee;font-size:13px;line-height:1.4}.montaj .mr b{display:block;font-weight:700}.montaj .mr span{color:#34424b}
.wire.dim{opacity:.13}
.kitbox{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.kitbox summary{cursor:pointer;font:600 15px var(--fc)}.kitrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #eef0ee;font-size:13.5px}.kitrow span{flex:1}.kitrow input[type=number]{width:64px}
.circlist{display:grid;gap:6px;max-height:46vh;overflow:auto;padding:2px}.circrow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(110px,1.4fr) auto auto auto;gap:6px;align-items:center}.circrow .cnum{display:flex;align-items:center;gap:4px}.circrow .cnum input{width:56px}.circrow small{font-size:12px}@media (max-width:640px){.circrow{grid-template-columns:1fr 1fr;}}
.sugg{list-style:none;margin:8px 0 0;padding:0}.sugg li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
@keyframes flashp{0%,100%{opacity:1}50%{opacity:.35}}.flash{animation:flashp .6s ease-in-out infinite}
.ihelp{width:100%;margin:4px 0 2px;font-size:13px;color:#34424b}.ihelp summary{cursor:pointer;font-weight:600;color:#1f5fa8}.ihelp p{margin:4px 0}.ihelp ol{margin:2px 0 4px 18px;padding:0}.checks .ihelp li{display:list-item;margin:2px 0;padding:0;border:0;gap:0}.checks .ihelp li::before{display:none;content:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

  uf=new UF();for(const w of model.wires)uf.u(w.a,w.b);
  for(const c of model.comps){const d=DEFS[c.t];if(!d.links||c.id===opt.exclude||(opt.noProt&&d.prot))continue;for(const [a,b] of d.links(c,ev[c.id]||{}))uf.u(tk(c,a),tk(c,b));}

 const DGm=model.cfg.box==='metal'&&!model.cfg.free?(+model.cfg.devGap||0):0;const cp=bandCap(b);const mL=DGm&&(b.type==='plate'||seg[0]===0)?DGm/U:0,mR=DGm&&seg[1]>=cp?DGm/U:0;
 if(x<seg[0]+mL-1e-6||x+w>seg[1]-mR+1e-6)return {ok:false,why:DGm?`prea aproape de jgheabul lateral (minim ${DGm} mm)`:'iese din zona pe placă'};
 if(DGm){const L0=layout();const bl0=L0.bands.find(y=>y.id===slot);if(bl0&&py<DGm-bl0.gt-0.5)return {ok:false,why:`prea aproape de jgheabul de deasupra (minim ${DGm} mm)`};}
 for(const o of model.comps){if(o.id===c.id||o.zone!=='panel'||o.band!==slot||DEFS[o.t].mount!=='plate')continue;const ow=DEFS[o.t].w(o),oh=H(o);const L=layout();const bl=L.bands.find(y=>y.id===slot);const oy=compOrigin(o,L).y-bl.top;
  if(x<o.x+ow-1e-6&&o.x<x+w-1e-6&&py<oy+oh-.5&&oy<py+h-.5){if(model.cfg.free)return {ok:true,warn:'se suprapune cu '+compName(o)};return {ok:false,why:'se suprapune cu '+compName(o)};}}
 return {ok:true};}

let toastT=null;
function toast(msg,level){const t=$('#toast');t.textContent=msg;t.className='show '+(level||'');clearTimeout(toastT);toastT=setTimeout(()=>{t.className=(level||'');},3400);}
function save(){try{syncBusbars();}catch(e){}syncModelProducts();try{const ph=model.photos;delete model.photos;localStorage.setItem(KEY,JSON.stringify(model));if(ph)model.photos=ph;}catch(e){}if(typeof libSched==='function')libSched();if(typeof CLOUD!=='undefined'&&CLOUD){if(CLOUD.skip)CLOUD.skip=false;else cloudSched();}}
function commit(fn){undoStack.push(JSON.stringify(model));REDO.length=0;if(undoStack.length>60)undoStack.shift();fn();touch();save();render();}
let REDO=[];
function undo(){const s_=undoStack.pop();if(!s_){toast('Nu mai ai ce anula');return;}REDO.push(JSON.stringify(model));if(REDO.length>60)REDO.shift();model=JSON.parse(s_);touch();sel=null;pending=null;loadLogo();save();render();toast('Înapoi un pas. „Refă” îl aduce înapoi.');}
function redo(){const s_=REDO.pop();if(!s_){toast('Nu ai ce reface');return;}undoStack.push(JSON.stringify(model));model=JSON.parse(s_);touch();sel=null;pending=null;loadLogo();save();render();toast('Am refăcut pasul.');}
function setModel(m,msg){try{if(typeof libPut==='function')libPut();}catch(e){}undoStack.push(JSON.stringify(model));if(R3)R3.placed=false;model=normalize(m);if(typeof CLOUD!=='undefined'&&CLOUD&&CLOUD.newFor){const sid=CLOUD.newFor;CLOUD.newFor=null;delete model.cloudId;setTimeout(()=>cloudAttach(sid),0);}sel=null;pending=null;loadLogo();save();render();requestAnimationFrame(fit);if(msg)toast(msg);}

async function saveFile(name,data,mime){try{if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);const dl=await dlP;if(dl){await dl.save({filename:name,data});toast('Fișier salvat: '+name);return;}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'){toast('Fișierul nu s-a putut salva ('+e.code+')','err');return;}}
 const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

 {const X=-L.bx-262;const ord=[{y:0,t:'0'}];for(const d of L.ducts)if(d.w>0)ord.push({y:d.cy-d.w/2},{y:d.cy+d.w/2});for(const b of L.bands){if(b.type==='plate'||b.type==='duct')ord.push({y:b.top},{y:b.top+b.h});else ord.push({y:b.cy,axis:1});}ord.push({y:L.PH});

 s+=`<text x="${-L.bx-190}" y="-6" text-anchor="middle" font-family="${FONT}" font-size="8" font-weight="600" fill="#b0471f">mm</text>`;
 const hx=[{x:0},{x:L.side.L.cx-L.side.L.w/2},{x:L.hx1},{x:L.hx2},{x:L.side.R.cx+L.side.R.w/2},{x:L.PW}];
 const fb=L.bands.find(b=>b.type==='din'||b.type==='mix'||b.type==='dual');if(fb){const S=segs(model.bands.find(x=>x.id===fb.id));const a=L.x0+(fb.off||0)+S.din[0]*U;hx.push({x:a},{x:a+(fb.type==='din'?fb.railLen:(S.din[1]-S.din[0])*U)});}

 for(const b of L.bands){const mb=model.bands.find(x=>x.id===b.id);if(!mb||mb.type==='duct'||mb.type==='rack')continue;const S=segs(mb);const off=L.x0+(b.off||0);const segL=[];

 if(!confirm('Ștergi definitiv tabloul „'+e.nume+'” de pe server?'))return;try{const ix=((await capi('tablouri'))||[]).filter(x=>x.id!==id);await capi('tablouri',ix);await capi('tablou_'+id,null);CLOUD.index=ix;if(model.cloudId===id){delete model.cloudId;save();}toast('Șters');openCloud();}catch(er){toast(er.message,'err');}}

  <div class="row" style="margin-top:12px;justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="row" style="gap:6px">${cur?`<button class="btn primary" id="cl_new">+ Tablou nou pe acest șantier</button>${model.comps.length&&model.santierId!==cur?`<button class="btn" id="cl_att">Pune tabloul deschis aici</button>`:''}`:'<span class="muted" style="font-size:13px">Alege un șantier ca să adaugi un tablou.</span>'}</span><span class="row" style="gap:6px">${CLOUD.inFrame?'<button class="btn" id="cl_back">← Înapoi în aplicație</button>':''}<button class="btn" id="cl_x">Închide</button></span></div>`;
  $('#cl_s').onchange=e=>{cur=e.target.value;CLOUD.filter=cur;draw();};

 const {upload}=await import('https://esm.sh/@vercel/blob@2.6.1/client');const pathname=`santiere/${model.santierId}/planse/${Date.now()}-${name.replace(/[^a-zA-Z0-9.\-_]/g,'_')}`;
 const b=await upload(pathname,file,{access:'private',handleUploadUrl:'/api/blob-upload?token='+encodeURIComponent(CLOUD.tok)});
 const d=new Date(),p=x=>String(x).padStart(2,'0');const pl=(await capi('planseSantier'))||[];pl.push({id:Math.random().toString(36).slice(2,10),santierId:model.santierId,nume:(model.name||'Tablou')+'.pdf',url:b.url,pathname:b.pathname,data:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),incarcatDe:CLOUD.user.nume||''});

 const list=libLoad();const body=JSON.parse(JSON.stringify(model));delete body.photos;const e={id:model.localId,name:model.name||'Tablou',updated:Date.now(),box:model.cfg.box,type:model.cfg.type,n:model.comps.length,santier:model.santierId&&typeof CLOUD!=='undefined'&&CLOUD?santNume(model.santierId):'',data:body};
 const i=list.findIndex(x=>x.id===e.id);if(i>=0)list[i]=e;else list.unshift(e);list.sort((a,b)=>b.updated-a.updated);while(list.length>40)list.pop();if(!libSave(list)){list.splice(15);libSave(list);}}

 <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="lb_x">Închide</button></div>`;$('#modal').classList.add('open');$('#lb_x').onclick=closeModal;

const MODK='se-modificate-v1';
function modLoad(){try{return JSON.parse(localStorage.getItem(MODK)||'[]');}catch(e){return [];}}
function modSave(l){try{localStorage.setItem(MODK,JSON.stringify(l));}catch(e){}}
function modCapture(){const list=modLoad();let ch=false;for(const c of model.comps){const d=DEFS[c.t];if(!d)continue;const custom=(c.dim&&Object.keys(c.dim).some(k=>+c.dim[k]>0))||(c.xt&&c.xt.length)||(c.hide&&c.hide.length)||(c.xl&&c.xl.length);if(!custom)continue;
 const e={t:c.t,p:c.p||{},dim:c.dim||null,xt:c.xt||null,xl:c.xl||null,hide:c.hide||null};const sig=JSON.stringify(e);if(list.some(x=>x.sig===sig))continue;list.unshift(Object.assign({sig,at:Date.now()},e));ch=true;}
 if(ch){list.splice(30);modSave(list);try{renderLib();}catch(e){}}}
function modDesc(e){const d=DEFS[e.t];if(!d)return '';const bits=[];if(e.p){if(e.p.curve&&e.p.rating)bits.push(e.p.curve+e.p.rating);else if(e.p.rating)bits.push(e.p.rating+' A');if(e.p.mod&&/^1/.test(e.p.mod))bits.push('1 modul');}if(e.dim){const w=+e.dim.w,h=+e.dim.h;if(w||h)bits.push(`${w||'–'} × ${h||'–'} mm`);}if(e.xt&&e.xt.length)bits.push(`+${e.xt.length} borne`);if(e.hide&&e.hide.length)bits.push(`${e.hide.length} borne ascunse`);return bits.join(', ');}
function modGroupHTML(q){const list=modLoad().filter(e=>DEFS[e.t]&&(!q||(DEFS[e.t].name+' '+modDesc(e)).toLowerCase().includes(q)));if(!list.length)return '';
 let h=`<div class="grp"><h3>Aparatele tale modificate</h3>`;list.forEach(e=>{const i=modLoad().findIndex(x=>x.sig===e.sig);const c=mk(e.t);c.p=Object.assign({},c.p,e.p||{});if(e.dim)c.dim=Object.assign({},e.dim);if(e.xt)c.xt=e.xt;if(e.hide)c.hide=e.hide;let W=20;try{W=WPX(c);}catch(_){}
  h+=`<div class="li" style="position:relative"><button class="li" data-addmod="${i}" style="flex:1;border:0;background:none;padding:0;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer"><span class="th"><svg viewBox="-1 -1 ${W+2} ${H(c)+2}" width="${Math.min(60,W*.42)}" height="38">${faceOf(c,W,{})}${termsSVG(c,false)}</svg></span><span>${esc(DEFS[e.t].short)}<br><span class="muted" style="font-size:12px">${esc(modDesc(e))}</span></span></button><button class="btn sm" data-delmod="${i}" aria-label="Scoate din listă" style="flex:none">✕</button></div>`;});
 return h+'</div>';}
function addMod(i){const e=modLoad()[i];if(!e||!DEFS[e.t])return;addComp(e.t);const c=byId(sel);if(!c||c.t!==e.t)return;
 commit(()=>{c.p=Object.assign({},c.p,e.p||{});if(e.dim)c.dim=Object.assign({},e.dim);if(e.xt)c.xt=JSON.parse(JSON.stringify(e.xt));if(e.xl)c.xl=JSON.parse(JSON.stringify(e.xl));if(e.hide)c.hide=e.hide.slice();touch();
  const d=DEFS[c.t],w=d.w(c);if(!fits(c.zone,slotOf(c),c.x,w,c.id,d.mount)){const r2=insertRoom(c.zone,slotOf(c),c.x,w,c.id,d.mount);if(r2)c.x=r2.x;else{const sp=ensureSpot(d,w,c.id).sp;if(sp)place(c,sp);}}});}

 if(byT.IL)for(let i=0;i<byT.IL.length;i+=6)rows.unshift({k:'IL',nume:'Iluminat '+(i/6+1),n:Math.min(6,byT.IL.length-i)});if(byT.CP)for(let i=0;i<byT.CP.length;i+=6)rows.push({k:'CP',nume:'Prize '+(i/6+1),n:Math.min(6,byT.CP.length-i)});

function openCircuits(fromField){CIRC=(fromField&&circFromField())||CIRC||circDefault();const draw=()=>{$('#sheet').className='sheet wide';

 <div class="circlist">${CIRC.rows.map((r,i)=>{const t=ctOf(r.k);return `<div class="circrow"><select data-ck="${i}">${CIRC_TYPES.map(x=>`<option value="${x.k}"${x.k===r.k?' selected':''}>${x.n}</option>`).join('')}</select><input type="text" data-cn="${i}" value="${esc(r.nume||'')}" placeholder="Unde / ce (ex. Living)"><label class="cnum"><input type="number" min="1" max="20" data-cc="${i}" value="${r.n||1}"><small>${t.dev==='bulb'?'lămpi':t.dev==='socket'?'prize':'buc.'}</small></label><small class="muted">${t.tri?'3P ':''}C${t.r} · ${fmtN(t.sec)} mm²</small><button class="btn sm" data-cdel="${i}" aria-label="Șterge circuitul">✕</button></div>`;}).join('')}</div>
 <div class="row" style="margin:8px 0;gap:6px;flex-wrap:wrap">${['IL','CP','PB','PL','CU','BO','AC','MS','EV'].map(k=>`<button class="btn sm" data-cadd="${k}">+ ${ctOf(k).n}</button>`).join('')}<button class="btn sm" data-cadd="RZ">+ Alimentare în așteptare</button><button class="btn sm" data-cadd="AL">+ Alt circuit</button></div>
 <p class="muted" style="font-size:12.5px;margin:4px 0 0">Siguranțele și secțiunile se aleg singure după tipul circuitului; le poți schimba după aceea pe fiecare aparat. Circuitele monofazate se împart pe diferențiale (maximum 6 pe diferențial)${CIRC.tri?' și se echilibrează pe cele trei faze':''}.</p>

 const sync=()=>{CIRC.tri=$('#ci_tri').value==='1';CIRC.spd=$('#ci_spd').checked;document.querySelectorAll('#sheet [data-ck]').forEach(e=>{CIRC.rows[+e.dataset.ck].k=e.value;});document.querySelectorAll('#sheet [data-cn]').forEach(e=>{CIRC.rows[+e.dataset.cn].nume=e.value;});document.querySelectorAll('#sheet [data-cc]').forEach(e=>{CIRC.rows[+e.dataset.cc].n=Math.max(1,Math.min(20,+e.value||1));});};
 $('#sheet').querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{sync();CIRC.rows.splice(+b.dataset.cdel,1);draw();});

 $('#sheet').querySelectorAll('[data-ck],#ci_tri').forEach(e=>e.onchange=()=>{sync();draw();});
 $('#ci_x').onclick=closeModal;$('#ci_go').onclick=()=>{sync();if(!CIRC.rows.length){toast('Adaugă cel puțin un circuit.','err');return;}if(CIRC.rows.some(r=>ctOf(r.k).tri)&&!CIRC.tri){CIRC.tri=true;toast('Ai circuite trifazate, așa că am pus alimentare trifazată.');}
  const m=proposePanel(CIRC);closeModal();setModel(m,'Am propus tabloul și cablajul din circuitele tale. „↶ Înapoi” readuce ce aveai.');try{autoLabelWires();touch();save();render();}catch(e){}renderLib();requestAnimationFrame(fit);};};
 draw();$('#modal').classList.add('open');}
function proposePanel(ci){const old=model;const box=old.cfg.box==='rack'?'metal':old.cfg.box;const cfg=Object.assign({},old.cfg,{type:'electric',box,showNums:true,showLabels:true});if(box==='modular')cfg.modAuto=true;
 const m=blank(old.name||'Tablou',cfg);m.client=old.client||'';m.extras=(old.extras||[]).slice();m.company=old.company;m.santierId=old.santierId;m.cloudId=old.cloudId;m.localId=old.localId;
 const prev=model;model=m;touch();
 const add=(t,p,label,zone)=>{const d=DEFS[t];const c=mk(t,zone||(d.mount==='field'?'field':'panel'),null,0,p||{},label||'');m.comps.push(c);const r=ensureSpot(d,d.w(c),c.id);if(r&&r.sp)place(c,r.sp);touch();return c;};
 const W=(a,ta,b,tb,sec)=>{if(!a||!b)return null;const w=newWire(tk(a,ta),tk(b,tb));if(sec&&!WC[w.color].data)w.sec=sec;m.wires.push(w);return w;};
 const rows=ci.rows.map(r=>Object.assign({},r,{t:ctOf(r.k)}));const tri=!!ci.tri;
 // câte rânduri în teren
 let fu=0;for(const r of rows)fu+=(r.t.sw?5:0)+(DEFS[r.t.dev].w(mk(r.t.dev))+1)*r.n;m.cfg.fieldRows=Math.min(8,Math.max(2,Math.ceil(fu/150)));
 const src=add(tri?'src400':'src230',{}, 'Rețea');
 const main=add(tri?'isol4':'isol',{rating:63},'Q0');
 if(tri){W(src,'L1',main,'1i',10);W(src,'L2',main,'2i',10);W(src,'L3',main,'3i',10);W(src,'N',main,'Ni',10);}else{W(src,'L',main,'Li',10);W(src,'N',main,'Ni',10);}
 const pe=add('pebar',{n:rows.length+4>10?14:10},'PE');W(src,'PE',pe,'t1',10);
 let spdC=null;if(ci.spd){const s=add(tri?'spd3':'spd',{},'F0');spdC=s;if(tri){W(main,'1o',s,'L1',6);W(main,'2o',s,'L2',6);W(main,'3o',s,'L3',6);W(main,'No',s,'N',6);}else{W(main,'Lo',s,'Li',6);W(main,'No',s,'Ni',6);}W(s,'pe',pe,'t2',6);}
 let peFree=ci.spd?3:2;const peT=()=>{const n=+pe.p.n;if(peFree>n)return null;return 't'+(peFree++);};
 const cnt={};const code=k=>{cnt[k]=(cnt[k]||0)+1;return k+cnt[k];};
 const mono=rows.filter(r=>!r.t.tri),triR=rows.filter(r=>r.t.tri);
 // grupe de diferențiale (max 6 circuite)
 const groups=[];let cur=null;for(const r of mono){if(!cur||cur.list.length>=6){cur={list:[],ph:0,kw:0};groups.push(cur);}cur.list.push(r);cur.kw+=(r.t.kw||(r.t.dev==='socket'?2:0.5));}
 if(tri){const load=[0,0,0];groups.sort((a,b)=>b.kw-a.kw).forEach(g=>{const i=load.indexOf(Math.min(...load));g.ph=i;load[i]+=g.kw;});}
 const phOut=i=>tri?['1o','2o','3o'][i]:'Lo';let prevFeed={L:null,N:null};
 const feedL=(c,t)=>{if(prevFeed.L)W(prevFeed.L[0],prevFeed.L[1],c,t,10);};
 let gi=0;const lastOnPhase={};
 for(const g of groups){gi++;const rcd=add('rcd2',{rating:40,sens:30,tip:'A'},'ID'+gi);
  const pk=tri?'ph'+g.ph:'m';const lp=lastOnPhase[pk];if(lp){W(lp[0],lp[1],rcd,'Li',10);}else if(spdC)W(spdC,tri?['L1','L2','L3'][g.ph]:'Li',rcd,'Li',10);else W(main,phOut(g.ph),rcd,'Li',10);lastOnPhase[pk]=[rcd,'Li'];
  const lpn=lastOnPhase.N;if(lpn)W(lpn[0],lpn[1],rcd,'Ni',10);else if(spdC)W(spdC,tri?'N':'Ni',rcd,'Ni',10);else W(main,'No',rcd,'Ni',10);lastOnPhase.N=[rcd,'Ni'];
  const nb=add('nbar',{n:g.list.reduce((s,r)=>s+1,0)+1>6?10:6},'N'+gi);W(rcd,'No',nb,'t1',10);let nFree=2;
  let prevM=null;for(const r of g.list){const t=r.t;const lab=code(t.k);const mcb=add('mcb1',{rating:t.r,curve:t.k==='IL'||t.k==='CT'||t.k==='PO'?'B':'C'},lab);if(prevM)W(prevM,'i',mcb,'i',10);else W(rcd,'Lo',mcb,'i',10);prevM=mcb;
   const n=r.n||1;let firstL=null,prevDev=null;const sw=t.sw?add('sw1',{},r.nume||lab,'field'):null;if(sw){W(mcb,'o',sw,'a',t.sec);}
   for(let j=0;j<n;j++){const p=t.dev==='load230'?{tip:t.tip,kw:t.kw}:{};const dv=add(t.dev,p,(r.nume||lab)+(n>1?' '+(j+1):''),'field');
    if(j===0){if(sw)W(sw,'b',dv,'L',t.sec);else W(mcb,'o',dv,'L',t.sec);const nt='t'+nFree;if(nFree<=+nb.p.n){W(nb,nt,dv,'N',t.sec);nFree++;}const pt=peT();if(pt)W(pe,pt,dv,'PE',t.sec);}
    else{W(prevDev,'L',dv,'L',t.sec);W(prevDev,'N',dv,'N',t.sec);W(prevDev,'PE',dv,'PE',t.sec);}prevDev=dv;}}}
 if(triR.length){const r4=add('rcd4',{rating:40,sens:30,tip:'A'},'ID'+(++gi));W(main,'1o',r4,'1i',10);W(main,'2o',r4,'2i',10);W(main,'3o',r4,'3i',10);W(main,'No',r4,'Ni',10);
  const nb=add('nbar',{n:6},'N'+gi);W(r4,'No',nb,'t1',10);let nFree=2,prevM=null;
  for(const r of triR){const t=r.t;const lab=code(t.k);const mcb=add('mcb3',{rating:t.r,curve:'C'},lab);if(prevM){W(prevM,'1i',mcb,'1i',10);W(prevM,'2i',mcb,'2i',10);W(prevM,'3i',mcb,'3i',10);}else{W(r4,'1o',mcb,'1i',10);W(r4,'2o',mcb,'2i',10);W(r4,'3o',mcb,'3i',10);}prevM=mcb;
   const dv=add('load400',{tip:t.tip,kw:t.kw},r.nume||lab,'field');W(mcb,'1o',dv,'L1',t.sec);W(mcb,'2o',dv,'L2',t.sec);W(mcb,'3o',dv,'L3',t.sec);if(nFree<=6){W(nb,'t'+nFree,dv,'N',t.sec);nFree++;}const pt=peT();if(pt)W(pe,pt,dv,'PE',t.sec);}}
 model=prev;return m;}

/* ---------- propunere de cablaj pentru aparatele puse de mână ---------- */
function autoWire(){const free=k=>!model.wires.some(w=>w.a===k||w.b===k);const n0=model.wires.length;
 const panel=model.comps.filter(c=>c.zone==='panel').sort((a,b)=>{const bi=x=>model.bands.findIndex(y=>y.id===x.band);return bi(a)-bi(b)||a.x-b.x;});
 const is=(c,...ks)=>ks.includes(B(c));const W=(a,ta,b,tb)=>{if(!a||!b)return;const ka=tk(a,ta),kb=tk(b,tb);if(!DEFS[a.t].terms(a).some(t=>t.id===ta)||!DEFS[b.t].terms(b).some(t=>t.id===tb))return;const w=newWire(ka,kb);model.wires.push(w);};
 const src=model.comps.find(c=>is(c,'src230','src400'));const main=panel.find(c=>is(c,'isol','isol4'))||panel.find(c=>is(c,'rcd2','rcd4','mcb1n','mcb3'));const pe=panel.find(c=>is(c,'pebar'));
 const tri=src&&is(src,'src400');
 if(src&&main){if(tri&&is(main,'isol4','rcd4')){[['L1','1i'],['L2','2i'],['L3','3i'],['N','Ni']].forEach(([a,b])=>{if(free(tk(main,b)))W(src,a,main,b);});}else{const li=DEFS[main.t].terms(main).find(t=>t.kind==='L'&&t.side==='top'),ni=DEFS[main.t].terms(main).find(t=>t.kind==='N'&&t.side==='top');if(li&&free(tk(main,li.id)))W(src,tri?'L1':'L',main,li.id);if(ni&&free(tk(main,ni.id)))W(src,'N',main,ni.id);}}
 const peFree=()=>{if(!pe)return null;const t=DEFS[pe.t].terms(pe).find(t=>free(tk(pe,t.id)));return t&&t.id;};
 if(src&&pe&&free(tk(src,'PE'))){const t=peFree();if(t)W(src,'PE',pe,t);}
 const mOut=main?DEFS[main.t].terms(main).filter(t=>t.side==='bot'):[];const mL=mOut.find(t=>t.kind==='L'||/^L/.test(t.kind)),mN=mOut.find(t=>t.kind==='N');
 const rcds=panel.filter(c=>is(c,'rcd2')&&c!==main);let prevR=null;for(const r of rcds){if(free(tk(r,'Li'))){if(prevR)W(prevR,'Li',r,'Li');else if(mL)W(main,mL.id,r,'Li');}if(free(tk(r,'Ni'))){if(prevR)W(prevR,'Ni',r,'Ni');else if(mN)W(main,mN.id,r,'Ni');}prevR=r;}
 const nbars=panel.filter(c=>is(c,'nbar'));rcds.forEach((r,i)=>{const nb=nbars[i];if(nb&&free(tk(r,'No'))&&free(tk(nb,'t1')))W(r,'No',nb,'t1');});
 const mcbs=panel.filter(c=>is(c,'mcb1'));const upOf=mc=>{let best=null;for(const r of rcds){const bi=x=>model.bands.findIndex(y=>y.id===x.band);if(bi(r)<bi(mc)||(bi(r)===bi(mc)&&r.x<mc.x))best=r;}return best;};
 let prevMc=null,prevUp=null;for(const mc of mcbs){const up=upOf(mc);if(free(tk(mc,'i'))){if(prevMc&&prevUp===up)W(prevMc,'i',mc,'i');else if(up)W(up,'Lo',mc,'i');else if(mL)W(main,mL.id,mc,'i');}prevMc=mc;prevUp=up;}
 const loads=model.comps.filter(c=>c.zone==='field'&&is(c,'bulb','socket','load230','heat'));const freeM=mcbs.filter(mc=>free(tk(mc,'o')));
 for(const ld of loads){if(!free(tk(ld,'L')))continue;let mc=freeM.find(x=>x.label&&ld.label&&ld.label.toLowerCase().startsWith(x.label.toLowerCase()))||freeM[0];if(!mc)break;freeM.splice(freeM.indexOf(mc),1);W(mc,'o',ld,'L');
  const up=upOf(mc);const nb=up?nbars[rcds.indexOf(up)]:nbars[0];if(nb&&free(tk(ld,'N'))){const t=DEFS[nb.t].terms(nb).find(t=>t.id!=='t1'&&free(tk(nb,t.id)));if(t)W(nb,t.id,ld,'N');}if(pe&&free(tk(ld,'PE'))){const t=peFree();if(t)W(pe,t,ld,'PE');}}
 return model.wires.length-n0;}
function panelSuggestions(){const out=[];const has=(...ks)=>model.comps.some(c=>ks.includes(B(c)));const tri=has('src400','load400','mcb3','rcd4');
 if(!has('src230','src400'))out.push({t:tri?'src400':'src230',why:'Lipsește alimentarea de la rețea.'});
 if(!has('isol','isol4'))out.push({t:tri?'isol4':'isol',why:'Nu ai întrerupător general (separator) la intrare.'});
 if(!has('spd','spd3'))out.push({t:tri?'spd3':'spd',why:'Nu ai descărcător de supratensiune.'});
 const mc=model.comps.filter(c=>B(c)==='mcb1').length,rc=model.comps.filter(c=>B(c)==='rcd2').length;if(mc&&!rc&&!has('rcbo'))out.push({t:'rcd2',why:'Siguranțele nu sunt protejate de un diferențial de 30 mA.'});else if(rc&&mc>rc*6)out.push({t:'rcd2',why:`Ai ${mc} siguranțe pe ${rc} ${rc===1?'diferențial':'diferențiale'}; recomandat maximum 6 pe diferențial.`});
 if(!has('nbar'))out.push({t:'nbar',why:'Lipsește bara de nul.'});if(!has('pebar'))out.push({t:'pebar',why:'Lipsește bara de împământare (PE).'});
 const loads=model.comps.filter(c=>c.zone==='field'&&['bulb','socket','load230','heat'].includes(B(c))).length;const circ=Math.max(0,Math.ceil(loads/4)-mc);if(circ>0)out.push({t:'mcb1',why:`Ai ${loads} consumatori în teren și doar ${mc} siguranțe.`,q:circ});
 return out;}
function suggestionsHTML(){if(model.cfg.box==='rack'||model.cfg.type==='media')return '';const s=panelSuggestions();
 return `<h3>Propuneri</h3><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn primary" data-circ>Scriu circuitele, propune tabloul</button><button class="btn" data-circf>Propune tabloul din consumatorii puși</button><button class="btn" data-autowire>Propune cablajul</button></div>${s.length?`<ul class="sugg">${s.map((x,i)=>`<li><span>${esc(x.why)}</span><button class="btn sm" data-sugg="${i}">Adaugă ${esc(DEFS[x.t].short)}${x.q>1?' × '+x.q:''}</button></li>`).join('')}</ul>`:'<p class="muted" style="font-size:12.5px;margin:6px 0 0">Tabloul are aparatele de bază.</p>'}`;}
/* ---------- mărimi tablouri modulare: standard, combinate, personalizate ---------- */
const MOD_STD=(()=>{const a=[[1,2],[1,4],[1,6],[1,8]];for(let r=1;r<=7;r++)for(const m of [12,13,14,18])if(!(r===7&&m!==18))a.push([r,m]);return a;})();
const MOD_DUAL=(()=>{const a=[];for(let r=1;r<=6;r++)for(const [l,rr] of [[12,12],[13,13],[14,14],[18,12],[18,18],[12,6]])a.push([r,l,rr]);return a;})();
const MOD_VERT=(()=>{const a=[];for(const m of [12,13,14,18])for(let p=1;p<=5;p++)for(let s=1;s<=2;s++)if(p+s<=7)a.push([p,s,m]);return a;})();
function modLabel(k){if(!k||k==='auto')return 'Automat, se adaptează singur';let m;
 if((m=/^(\d+)x(\d+)$/.exec(k)))return `${m[1]*m[2]} module (${m[1]} × ${m[2]})`;
 if((m=/^d(\d+)x(\d+)x(\d+)$/.exec(k)))return `Combinat orizontal: ${m[1]} × (${m[2]} tari + ${m[3]} slabi) = ${m[1]*(+m[2]+ +m[3])} module`;
 if((m=/^v(\d+)\+(\d+)x(\d+)$/.exec(k)))return `Combinat vertical: ${m[1]} ${m[1]==1?'rând':'rânduri'} curenți tari + ${m[2]} curenți slabi, ${m[3]} module/rând`;
 return k;}
function modOptionsHTML(cur,type){const o=(k)=>`<option value="${k}"${cur===k?' selected':''}>${esc(modLabel(k))}</option>`;
 return `${o('auto')}<optgroup label="Standard (un singur tip)">${MOD_STD.map(([r,m])=>o(r+'x'+m)).join('')}</optgroup><optgroup label="Combinat pe orizontală: stânga curenți tari, dreapta slabi">${MOD_DUAL.map(([r,l,rr])=>o(`d${r}x${l}x${rr}`)).join('')}</optgroup><optgroup label="Combinat pe verticală: sus curenți tari, jos slabi">${MOD_VERT.map(([p,s,m])=>o(`v${p}+${s}x${m}`)).join('')}</optgroup><option value="custom"${cur==='custom'?' selected':''}>Personalizat, scriu eu rândurile și modulele…</option>`;}
function modCustomHTML(pre){return `<div class="grid3" id="${pre}_cust" style="display:none"><label class="field"><span>Rânduri</span><input type="number" min="1" max="10" id="${pre}_cr" value="3"></label><label class="field"><span>Module pe rând (stânga)</span><input type="number" min="2" max="36" id="${pre}_cm" value="12"></label><label class="field"><span>Module dreapta (0 = fără)</span><input type="number" min="0" max="36" id="${pre}_cmr" value="0"></label></div>`;}
function customKey(pre){const r=Math.max(1,Math.min(10,+$('#'+pre+'_cr').value||1)),m=Math.max(2,Math.min(36,+$('#'+pre+'_cm').value||12)),rr=Math.max(0,Math.min(36,+$('#'+pre+'_cmr').value||0));return rr?`d${r}x${m}x${rr}`:`${r}x${m}`;}
function setModBox(v){if(v==='auto'){model.cfg.modAuto=true;delete model.cfg.modKey;model.bands.forEach(b=>{if(b.type==='dual'){b.type='din';delete b.modsL;delete b.modsR;}delete b.zl;});touch();return true;}
 let spec=[],mods=12,m;
 if((m=/^(\d+)x(\d+)$/.exec(v))){mods=+m[2];for(let i=0;i<+m[1];i++)spec.push({type:'din'});}
 else if((m=/^d(\d+)x(\d+)x(\d+)$/.exec(v))){const l=+m[2],rr=+m[3];mods=l+rr+1;for(let i=0;i<+m[1];i++)spec.push({type:'dual',modsL:l,modsR:rr,gap:2});}
 else if((m=/^v(\d+)\+(\d+)x(\d+)$/.exec(v))){mods=+m[3];for(let i=0;i<+m[1];i++)spec.push({type:'din'});for(let i=0;i<+m[2];i++)spec.push({type:'din',zl:'slabi'});}

 const exitPt=(T)=>{const up=T.side==='top';let y=T.y+(up?-10:10);if(T.c&&T.c.zone==='panel'){const oo=compOrigin(T.c,L),hh=H(T.c);y=up?Math.min(y,oo.y-12):Math.max(y,oo.y+hh+12);}return [T.x,y+(up?-1:1)*Math.abs(o)];};
 const a1=exitPt(A),b1=exitPt(B);
 if(!FD.length){const my=(a1[1]+b1[1])/2;return [[A.x,A.y],a1,[a1[0],my],[b1[0],my],b1,[B.x,B.y]];}
 if(A.c.zone==='panel'&&B.c.zone==='panel'){const xl=Math.min(A.x,B.x)-10,xh=Math.max(A.x,B.x)+10,yl=Math.min(a1[1],b1[1]),yh=Math.max(a1[1],b1[1]);
  const ductBtw=FD.some(d=>{if(d.dir==='h'){const x1=Math.min(d.x1,d.x2),x2=Math.max(d.x1,d.x2);return d.y>yl-2&&d.y<yh+2&&x2>xl&&x1<xh&&yh-yl>4;}const y1=Math.min(d.y1,d.y2),y2=Math.max(d.y1,d.y2);return d.x>xl+10&&d.x<xh-10&&y2>yl&&y1<yh;});
  if(!ductBtw){const rects=model.comps.filter(x=>x.zone==='panel').map(x=>{const oo=compOrigin(x,L);return [oo.x+1,oo.y+1,oo.x+WPX(x)-1,oo.y+H(x)-1];});
   const hitSeg=(p,q)=>rects.some(r=>{const x1=Math.min(p[0],q[0]),x2=Math.max(p[0],q[0]),y1=Math.min(p[1],q[1]),y2=Math.max(p[1],q[1]);return x1<r[2]&&x2>r[0]&&y1<r[3]&&y2>r[1];});
   const same=A.side===B.side;const cands=same?[A.side==='top'?Math.min(a1[1],b1[1]):Math.max(a1[1],b1[1])]:[(a1[1]+b1[1])/2];
   for(const my0 of cands){const my=my0+(same?(A.side==='top'?-1:1)*Math.abs(o):o);const P=[[A.x,A.y],a1,[a1[0],my],[b1[0],my],b1,[B.x,B.y]];let bad=false;for(let k=1;k<P.length-2;k++)if(hitSeg(P[k],P[k+1])){bad=true;break;}if(!bad)return P;}}}
 const seg=d=>d.dir==='h'?{h:1,x1:Math.min(d.x1,d.x2),x2:Math.max(d.x1,d.x2),y:d.y,d}:{h:0,y1:Math.min(d.y1,d.y2),y2:Math.max(d.y1,d.y2),x:d.x,d};const S=FD.map(seg);
 const proj=(p,s)=>s.h?[Math.max(s.x1,Math.min(s.x2,p[0])),s.y]:[s.x,Math.max(s.y1,Math.min(s.y2,p[1]))];const dist=(p,q)=>Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1]);
 const near=(p,up)=>{let best=null;S.forEach((s,i)=>{const q=proj(p,s);let dd=dist(p,q);if(up&&q[1]>p[1]+4)dd+=600;if(!up&&q[1]<p[1]-4)dd+=600;if(!s.h)dd+=40;if(!best||dd<best.dd)best={i,q,dd};});return best;};
 const nA=near(a1,A.side==='top'),nB=near(b1,B.side==='top');const nodes=[];const nid=(p)=>{let i=nodes.findIndex(n=>Math.abs(n[0]-p[0])<.5&&Math.abs(n[1]-p[1])<.5);if(i<0){nodes.push(p);i=nodes.length-1;}return i;};
 const onSeg=S.map(()=>[]);S.forEach((s,i)=>{onSeg[i].push(nid(s.h?[s.x1,s.y]:[s.x,s.y1]),nid(s.h?[s.x2,s.y]:[s.x,s.y2]));});
 const iA=nid(nA.q),iB=nid(nB.q);onSeg[nA.i].push(iA);onSeg[nB.i].push(iB);
 const E=new Map();const addE=(a,b,c)=>{if(a===b)return;(E.get(a)||E.set(a,[]).get(a)).push([b,c]);(E.get(b)||E.set(b,[]).get(b)).push([a,c]);};
 for(let i=0;i<S.length;i++)for(let j=0;j<S.length;j++){if(i===j)continue;const s=S[i],t=S[j];if(s.h&&!t.h){const tol=Math.max(s.d.w,t.d.w)/2+8;if(t.x>=s.x1-tol&&t.x<=s.x2+tol&&s.y>=t.y1-tol&&s.y<=t.y2+tol){const pi=nid([Math.max(s.x1,Math.min(s.x2,t.x)),s.y]),pj=nid([t.x,Math.max(t.y1,Math.min(t.y2,s.y))]);onSeg[i].push(pi);onSeg[j].push(pj);addE(pi,pj,dist(nodes[pi],nodes[pj]));}}
  else if(s.h===t.h&&i<j){const ends=[0,1].map(k=>onSeg[i][k]),ends2=[0,1].map(k=>onSeg[j][k]);for(const a of ends)for(const b of ends2){if(dist(nodes[a],nodes[b])<Math.max(s.d.w,t.d.w)+12)addE(a,b,dist(nodes[a],nodes[b]));}}}
 S.forEach((s,i)=>{const arr=[...new Set(onSeg[i])].sort((a,b)=>s.h?nodes[a][0]-nodes[b][0]:nodes[a][1]-nodes[b][1]);for(let k=1;k<arr.length;k++)addE(arr[k-1],arr[k],dist(nodes[arr[k-1]],nodes[arr[k]]));});
 const D=new Map([[iA,0]]),P=new Map(),Q=new Set([iA]);const seen=new Set();while(Q.size){let u=null,du=1e18;for(const q of Q){const v=D.get(q);if(v<du){du=v;u=q;}}Q.delete(u);if(u===iB)break;seen.add(u);for(const [v,c] of E.get(u)||[]){if(seen.has(v))continue;const nd=du+c;if(nd<(D.get(v)??1e18)){D.set(v,nd);P.set(v,u);Q.add(v);}}}
 let path=[];if(D.has(iB)){let u=iB;while(u!=null){path.unshift(nodes[u]);u=P.get(u);}}else{const my=(a1[1]+b1[1])/2;return [[A.x,A.y],a1,[a1[0],my],[b1[0],my],b1,[B.x,B.y]];}
 const T=path.map(p=>[p[0]+o,p[1]+o]);const out=[[A.x,A.y],a1];const f=T[0];if(Math.abs(a1[0]-f[0])>.5&&Math.abs(a1[1]-f[1])>.5){out.push(S[nA.i].h?[a1[0],f[1]]:[f[0],a1[1]]);}
 for(let k=0;k<T.length;k++){const p=T[k],q=out[out.length-1];if(Math.abs(p[0]-q[0])>.5&&Math.abs(p[1]-q[1])>.5)out.push([q[0],p[1]]);out.push(p);}
 const l=T[T.length-1];if(Math.abs(b1[0]-l[0])>.5&&Math.abs(b1[1]-l[1])>.5)out.push(S[nB.i].h?[b1[0],l[1]]:[l[0],b1[1]]);out.push(b1,[B.x,B.y]);return out;}

/* legare rapidă clemă ↔ consumator și sugestii automate */
function kindFam(k){return (k==='L'||k==='L1'||k==='L2'||k==='L3'||k==='CTRL')?'L':k;}
function clampSlots(c){const b=B(c),T=DEFS[c.t].terms(c),byT=wiresAt(),w=id=>(byT.get(tk(c,id))||[]).length>0;const out=[];
 if(b==='clamp1'){for(const side of ['b','t']){const o=side==='b'?'t':'b';const ts=T.filter(t=>t.id.endsWith(side));if(!ts.length)continue;const map={};for(const t of ts)map[kindFam(t.kind)]=t.id;out.push({c,map,fed:T.filter(t=>t.id.endsWith(o)).some(t=>w(t.id)),free:ts.every(t=>!w(t.id)),key:c.id+side});}}
 else if(b==='clamps'){for(let i=0;i<+c.p.poz;i++)for(const side of ['b','t']){const o=side==='b'?'t':'b';const L_=['L','N','PE'];out.push({c,map:{L:i+'L'+side,N:i+'N'+side,PE:i+'PE'+side},fed:L_.some(l=>w(i+l+o)),free:L_.every(l=>!w(i+l+side)),key:c.id+i+side,pos:i+1});}}
 return out;}
function freeByFam(c,pref){const T=DEFS[c.t].terms(c).filter(t=>!t.spare),byT=wiresAt();const m={};const ord=T.slice().sort((a,b)=>(a.side===pref?0:1)-(b.side===pref?0:1));for(const t of ord){if((byT.get(tk(c,t.id))||[]).length)continue;const f=kindFam(t.kind);(m[f]=m[f]||[]).push(t.id);}return m;}
function needOf(x){const T=DEFS[x.t].terms(x).filter(t=>!t.spare),byT=wiresAt();if(!T.length||T.some(t=>(byT.get(tk(x,t.id))||[]).length))return null;const m={};for(const t of T){const f=kindFam(t.kind);(m[f]=m[f]||[]).push(t.id);}if(m['DC+']&&m['DC-'])return {fam:'dc',m};if(m.L&&m.N)return {fam:'ac',m};return null;}
const slotFits=(sl,need)=>need.fam==='dc'?!!(sl.map['DC+']&&sl.map['DC-']):!!(sl.map.L&&sl.map.N);
function connectSlot(sl,x,m){const made=[];for(const f in m){const s=sl.map[f];if(!s)continue;model.wires.push(newWire(tk(sl.c,s),tk(x,m[f][0])));made.push(f==='DC+'?'+':f==='DC-'?'−':f);}return made;}
let QC=null,SUGX='';
function quickTo(x){const a=byId(QC&&QC.from);QC=null;qcHint();if(!a||!x||a.id===x.id){render();return;}
 let P=a,Q=x;if(P.zone==='field'&&Q.zone!=='field'){P=x;Q=a;}
 const need=freeByFam(Q,'top');if(!Object.keys(need).length){toast(`${compName(Q)} n-are borne libere.`,'warn');render();return;}
 let src;if(['clamp1','clamps'].includes(B(P))){const dc=!!need['DC+'];const sls=clampSlots(P).filter(s=>s.free&&(dc?s.map['DC+']:s.map.L));const sl=sls.find(s=>s.fed)||sls[0];if(!sl){toast(`${compName(P)} nu mai are loc liber potrivit (${dc?'+/−':'L/N'}).`,'warn');render();return;}src={};for(const f in sl.map)src[f]=[sl.map[f]];}
 else src=freeByFam(P,'bot');
 const made=[];let r=null;commit(()=>{for(const f in need){if(!src[f]||!src[f].length)continue;model.wires.push(newWire(tk(P,src[f].shift()),tk(Q,need[f][0])));made.push(f==='DC+'?'+':f==='DC-'?'−':f);}if(made.length&&P.zone==='panel'){const v=fieldSrcLabel(Q);if(v&&(!Q.label||Q.lblAuto)){Q.label=v.slice(0,18);Q.lblAuto='cl';}}});
 toast(made.length?`Am legat ${compName(P)} → ${compName(Q)}: ${made.join(', ')}. Dacă e ceva special, schimbi firele din „Borne și legături”.`:'N-am găsit borne libere potrivite între ele.',made.length?'':'warn');if(r)autoLabelToast(r);}
function qcHint(){const b=$('#qcbar');if(!b)return;b.hidden=!QC;if(QC){const a=byId(QC.from);b.querySelector('span').textContent=`Legare rapidă de la ${a?compName(a):''}: atinge acum consumatorul (bandă LED, bec, priză…).`;}}
function suggestPairs(){if(sim)return [];const cons=model.comps.filter(c=>c.zone==='field').map(x=>({x,need:needOf(x)})).filter(q=>q.need).sort((a,b)=>(a.x.row-b.x.row)||(a.x.x-b.x.x));if(!cons.length)return [];
 const sls=[];for(const c of model.comps)if(c.zone==='panel'&&['clamp1','clamps'].includes(B(c)))for(const s of clampSlots(c))if(s.fed&&s.free)sls.push(s);
 sls.sort((a,b)=>{const ca=compOrigin(a.c),cb=compOrigin(b.c);return (ca.y-cb.y)||((ca.x+(a.pos||0)*U)-(cb.x+(b.pos||0)*U));});
 const used=new Set(),pairs=[];for(const q of cons){const s=sls.find(s=>!used.has(s.key)&&!used.has(s.c.id+'#'+(s.pos||''))&&slotFits(s,q.need));if(!s)continue;used.add(s.key);used.add(s.c.id+'#'+(s.pos||''));pairs.push({s,x:q.x,need:q.need});}return pairs;}
function sugUpdate(){const b=$('#sugbar');if(!b)return;const P=tab==='2d'&&!QC?suggestPairs():[];const sig=P.map(p=>p.s.key+'>'+p.x.id).join('|');if(!P.length||sig===SUGX){b.hidden=true;return;}
 const kinds=[...new Set(P.map(p=>DEFS[p.x.t].short.toLowerCase()))].slice(0,3).join(', ');
 b.querySelector('span').textContent=`💡 Pot lega automat ${P.length} ${P.length===1?'consumator':'consumatori'} (${kinds}) la clemele libere alimentate, în ordine.`;b.hidden=false;b._p=P;b._sig=sig;}
function sugShow(P){const G=$('#guides');if(!G)return;const L=layout();G.innerHTML=P.map(p=>{const a=compOrigin(p.s.c,L),b=compOrigin(p.x,L);const ax=a.x+((p.s.pos?p.s.pos-.5:WPX(p.s.c)/U/2))*U,ay=a.y+H(p.s.c),bx=b.x+WPX(p.x)/2,by=b.y;return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#1e9e57" stroke-width="2" stroke-dasharray="6 4"/><circle cx="${ax}" cy="${ay}" r="4" fill="#1e9e57"/><circle cx="${bx}" cy="${by}" r="4" fill="#1e9e57"/>`;}).join('');setTimeout(()=>{if(G)G.innerHTML='';},8000);}

const MSEL=new Set();let SHIFT=false,SELMODE=false;
addEventListener('keydown',e=>{if(e.key==='Shift')SHIFT=true;});addEventListener('keyup',e=>{if(e.key==='Shift')SHIFT=false;});addEventListener('blur',()=>{SHIFT=false;});
function mselToggle(c){if(!MSEL.size&&sel&&byId(sel)&&sel!==c.id)MSEL.add(sel);if(MSEL.has(c.id))MSEL.delete(c.id);else MSEL.add(c.id);sel=c.id;render();}
function mselClear(){if(MSEL.size){MSEL.clear();}}
function selRect(g,e){const a=toSvg(g.sx,g.sy),b=toSvg(e.clientX,e.clientY);g.rect=[Math.min(a.x,b.x),Math.min(a.y,b.y),Math.max(a.x,b.x),Math.max(a.y,b.y)];const G=$('#guides');if(G)G.innerHTML=`<rect x="${g.rect[0]}" y="${g.rect[1]}" width="${g.rect[2]-g.rect[0]}" height="${g.rect[3]-g.rect[1]}" fill="rgba(33,102,196,.08)" stroke="#2166c4" stroke-width="1.5" stroke-dasharray="6 3"/>`;}
function finishRect(g){const R=g.rect,L=layout();$('#guides').innerHTML='';if(!R)return;MSEL.clear();for(const c of model.comps){if(c.zone==='door')continue;const o=compOrigin(c,L);if(o.x<R[2]&&o.x+WPX(c)>R[0]&&o.y<R[3]&&o.y+H(c)>R[1])MSEL.add(c.id);}sel=[...MSEL][0]||null;render();toast(MSEL.size?`Am selectat ${MSEL.size} aparate. Trage de oricare ca să le muți pe toate, sau folosește bara de jos.`:'Nicio aparat în dreptunghi.');}
function fdyOf(c,L){if(c.fdy!=null)return +c.fdy;const f=frowOf(c.row,L);return f?Math.round(compOrigin(c,L).y-f.top):0;}
function moveComp(c,dxmm,dymm,L){const d=DEFS[c.t];if(c.zone==='field'){c.x=Math.max(0,Math.round(c.x+dxmm/U));c.fdy=Math.round(fdyOf(c,L)+dymm);}else if(c.zone==='panel'){if(d.mount==='plate'&&c.py!=null){c.x=Math.max(0,c.x+dxmm/U);c.py=Math.round(+c.py+dymm);}else if(d.mount==='din'){c.x=Math.max(0,Math.round(c.x+dxmm/U));}}else if(c.zone==='door'&&c.fx!=null){c.fx=Math.round(+c.fx+dxmm);c.fy=Math.round(+c.fy+dymm);}}
function overlapsField(){const L=layout();const R=model.comps.filter(c=>c.zone==='field').map(c=>{const o=compOrigin(c,L);return [c,o.x,o.y,o.x+WPX(c),o.y+H(c)];});const bad=new Set();for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const p=R[i],q=R[j];if(p[1]<q[3]&&p[3]>q[1]&&p[2]<q[4]&&p[4]>q[2]){bad.add(p[0].id);bad.add(q[0].id);}}return bad;}
function multiDrop(c,g){const s0=toSvg(g.sx,g.sy);if(!g.lp)return;const dx=g.lp.x-s0.x,dy=g.lp.y-s0.y;const L=layout();const tgt=new Map([...MSEL].map(id=>{const x=byId(id);return [id,x?compOrigin(x,L).y+dy:0];}));commit(()=>{for(const id of MSEL){const x=byId(id);if(x)moveComp(x,dx,dy,L);}for(let k=0;k<4;k++){touch();const L2=layout();for(const id of MSEL){const x=byId(id);if(!x||x.zone!=='field')continue;const df=tgt.get(id)-compOrigin(x,L2).y;if(Math.abs(df)>.5)x.fdy=Math.round(+x.fdy+df);}}sel=c.id;});const ov=overlapsField();toast(`Am mutat ${MSEL.size} aparate împreună${ov.size?` · atenție: ${ov.size} aparate se suprapun acum (le vezi în Verificare)`:''}.`,ov.size?'warn':'');}
function mAlign(kind){const L=layout();const cs=[...MSEL].map(byId).filter(c=>c&&(c.zone==='field'||(c.zone==='panel'&&DEFS[c.t].mount==='plate'&&c.py!=null)));if(cs.length<2){toast('Pentru aliniere selectează aparate din teren sau de pe placă.','warn');return;}
 commit(()=>{const O=new Map(cs.map(c=>[c.id,compOrigin(c,L)]));if(kind==='top'){const y=Math.min(...cs.map(c=>O.get(c.id).y));for(const c of cs)moveComp(c,0,y-O.get(c.id).y,L);}
  else if(kind==='left'){const x=Math.min(...cs.map(c=>O.get(c.id).x));for(const c of cs)moveComp(c,x-O.get(c.id).x,0,L);}
  else if(kind==='dist'){const srt=cs.slice().sort((a,b)=>O.get(a.id).x-O.get(b.id).x);const x0=O.get(srt[0].id).x,x1=O.get(srt[srt.length-1].id).x+WPX(srt[srt.length-1]);const tot=srt.reduce((s,c)=>s+WPX(c),0);const gap=Math.max(6,(x1-x0-tot)/(srt.length-1));let x=x0;for(const c of srt){moveComp(c,x-O.get(c.id).x,0,L);x+=WPX(c)+gap;}}});
 toast(kind==='top'?'Aliniate sus.':kind==='left'?'Aliniate la stânga.':'Distanțate egal.');}
function mSeries(){const cs=[...MSEL].map(byId).filter(Boolean);if(!cs.length)return;const base=prompt('Textul de bază pentru etichete (ex. Arhi). Devin „Arhi 1”, „Arhi 2”…',cs[0].label?cs[0].label.replace(/\s*\d+$/,''):'');if(base==null)return;const st=+prompt('Încep numerotarea de la:', '1')||1;const L=layout();
 const srt=cs.slice().sort((a,b)=>{const oa=compOrigin(a,L),ob=compOrigin(b,L);return (Math.round(oa.y/40)-Math.round(ob.y/40))||(oa.x-ob.x);});let n=0;
 commit(()=>{srt.forEach((c,i)=>{c.label=(base.trim()+' '+(st+i)).trim().slice(0,18);if(c.zone==='field')delete c.lblAuto;else{try{autoLabelFrom(c);}catch(_){}}n++;});for(const c of model.comps)if(c.zone==='field'&&(!c.label||c.lblAuto)){const v=fieldSrcLabel(c);if(v){c.label=v.slice(0,18);c.lblAuto='cl';}}});
 toast(`Am etichetat ${n} aparate: ${base.trim()} ${st} … ${base.trim()} ${st+n-1}. Aparatele din teren legate la ele și copexurile au preluat etichetele.`);}
const BLK='se-blocuri-v1';const blkLoad=()=>{try{return JSON.parse(localStorage.getItem(BLK)||'[]');}catch(_){return [];}};const blkSave=l=>{try{localStorage.setItem(BLK,JSON.stringify(l));return true;}catch(_){return false;}};
function mSaveBlock(){const ids=new Set(MSEL);if(!ids.size)return;const nm=prompt('Numele blocului (ex. Sursă + controler + 6 cleme + 6 benzi):','Bloc '+(blkLoad().length+1));if(!nm)return;const comps=[...ids].map(byId).filter(Boolean).map(c=>JSON.parse(JSON.stringify(c)));const wires=model.wires.filter(w=>ids.has(w.a.split(':')[0])&&ids.has(w.b.split(':')[0])).map(w=>JSON.parse(JSON.stringify(w)));const l=blkLoad();l.unshift({id:uid(),name:nm,comps,wires,at:Date.now()});blkSave(l);syncModelProducts&&syncModelProducts();toast(`Am salvat blocul „${nm}” (${comps.length} aparate, ${wires.length} fire). Îl pui în orice tablou din Meniu → Blocurile mele.`);}
function insertBlock(b){const map=new Map();let placed=0,miss=0;commit(()=>{const srt=b.comps.slice().sort((a,c)=>(a.zone==='panel'?0:1)-(c.zone==='panel'?0:1)||(a.x-c.x));for(const o of srt){if(!DEFS[o.t]){miss++;continue;}const n=JSON.parse(JSON.stringify(o));n.id=uid();delete n.band;delete n.row;delete n.py;delete n.fdy;const d=DEFS[n.t];const sp=ensureSpot(d,d.w(n)).sp;if(!sp){miss++;continue;}place(n,sp);model.comps.push(n);map.set(o.id,n.id);placed++;}

function lensMM(c){const v=String((c.p&&c.p.lens)||'2,8 mm').replace(',','.');return parseFloat(v)||2.8;}
function camHFOV(c){const mm=lensMM(c),b=DEFS[c.t];if(b.camType==='ptz')return 58;if(/panoramic/i.test(b.name||''))return 180;const T={2.8:103,4:84,6:54,8:40,12:27};let best=103,bd=1e9;for(const k in T){const dd=Math.abs(k-mm);if(dd<bd){bd=dd;best=T[k];}}return best;}
function camTech(c){const n=(DEFS[c.t].name||'')+' '+(DEFS[c.t].short||'');return {colorvu:/ColorVu|CV3|LiveGuard/i.test(n),acusense:/AcuSense|Smart Hybrid|ColorVu 3|G3|LiveGuard/i.test(n),mp:(n.match(/(\d+)\s?MP/i)||[])[1]||'4'};}
let CAMV=null;
function closeCamView(){if(!CAMV)return;cancelAnimationFrame(CAMV.raf);try{R3.scene.remove(CAMV.props);CAMV.props.traverse(o=>{if(o.geometry)o.geometry.dispose();});CAMV.ren.dispose();}catch(_){}CAMV=null;const m=$('#camview');if(m)m.remove();}
function openCamView(cid){const c=byId(cid);if(!c)return;if(tab!=='3d'){setTab('3d');}setTimeout(()=>openCamView2(c),tab==='3d'&&R3&&R3.root?0:250);}
function openCamView2(c){if(!R3||!R3.root){toast('Deschide întâi vederea 3D.','warn');return;}closeCamView();
 let grp=null;R3.root.traverse(o=>{if(!grp&&o.isGroup&&o.userData&&o.userData.cid===c.id)grp=o;});const b=R3.roomBox;
 const eye=new THREE.Vector3();if(grp){new THREE.Box3().setFromObject(grp).getCenter(eye);}else{eye.set(0,(b?b.floorY:0)+2400,0);}const floorY=b?b.floorY:eye.y-2400;if(eye.y<floorY+2200)eye.y=floorY+2400;eye.z+=60;
 const hf=camHFOV(c),tech=camTech(c);const aspect=16/9;const vf=Math.min(120,2*Math.atan(Math.tan(hf*Math.PI/360)/aspect)*180/Math.PI);
 const wrap=document.createElement('div');wrap.id='camview';wrap.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(10,12,14,.82);display:flex;align-items:center;justify-content:center;padding:12px';
 wrap.innerHTML=`<div style="background:#111418;border-radius:14px;max-width:960px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden;color:#e8ecef;font:500 13px var(--f)"><div style="position:relative;width:100%;aspect-ratio:16/9;background:#000"><canvas id="cv_c" style="width:100%;height:100%;display:block"></canvas><canvas id="cv_o" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
 <div id="cv_osd" style="position:absolute;left:10px;top:8px;font:600 14px 'Courier New',monospace;color:#fff;text-shadow:0 0 3px #000"></div><div style="position:absolute;right:10px;bottom:8px;font:600 13px 'Courier New',monospace;color:#fff;text-shadow:0 0 3px #000">${esc(compName(c))}</div></div>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px"><button class="btn sm" id="cv_day">☀ Zi</button><button class="btn sm" id="cv_night">🌙 Noapte</button><span style="flex:1;min-width:160px;color:#aab3ba">${esc(DEFS[c.t].code||'')} · obiectiv ${fmtN(lensMM(c))} mm (~${hf}°) · ${tech.colorvu?'ColorVu: color și noaptea':'IR: alb-negru noaptea'}${tech.acusense?' · AcuSense: detectează persoane și vehicule':''}</span><button class="btn sm primary" id="cv_x">Închide</button></div>
 <p style="margin:0;padding:0 12px 10px;color:#7f8a92;font-size:12px">Simulare în scena 3D a proiectului, cu o persoană și o mașină de probă. Arată unghiul și cum arată ziua și noaptea, nu imaginea reală a camerei.</p></div>`;
 document.body.appendChild(wrap);const cv=$('#cv_c'),ov=$('#cv_o');const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.outputEncoding=THREE.sRGBEncoding;ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
 const cam=new THREE.PerspectiveCamera(vf,aspect,20,80000);cam.position.copy(eye);const tgt=eye.clone().add(new THREE.Vector3(0,-.32,1).normalize().multiplyScalar(6000));cam.lookAt(tgt);
 const props=new THREE.Group();props.name='camprops';const mk_=(geo,col)=>{const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.7}));return m;};
 const gnd=mk_(new THREE.PlaneGeometry(60000,60000),'#6f7a66');gnd.rotation.x=-Math.PI/2;gnd.position.set(eye.x,floorY-2,eye.z+20000);props.add(gnd);
 const path=mk_(new THREE.PlaneGeometry(2600,40000),'#9a948a');path.rotation.x=-Math.PI/2;path.position.set(eye.x+900,floorY-1,eye.z+18000);props.add(path);
 const person=new THREE.Group();const body=mk_(new THREE.CylinderGeometry(190,170,1150,16),'#2f4a6b');body.position.y=floorY+900;const legs=mk_(new THREE.CylinderGeometry(150,120,780,12),'#2b2f33');legs.position.y=floorY+390;const head=mk_(new THREE.SphereGeometry(115,16,12),'#d8b89a');head.position.y=floorY+1600;person.add(body,legs,head);props.add(person);

 R3.scene.add(props);
 CAMV={ren,cam,props,raf:0,night:false,t0:performance.now(),person,car,spot,tech,wrap};
 $('#cv_x').onclick=closeCamView;wrap.addEventListener('click',e=>{if(e.target===wrap)closeCamView();});
 const setMode=n=>{CAMV.night=n;$('#cv_day').className='btn sm'+(n?'':' primary');$('#cv_night').className='btn sm'+(n?' primary':'');cv.style.filter=n?(tech.colorvu?'saturate(.9) contrast(1.08) brightness(1.05)':'grayscale(1) contrast(1.3) brightness(1.2)'):'none';};$('#cv_day').onclick=()=>setMode(false);$('#cv_night').onclick=()=>setMode(true);setMode(false);
 const fit=()=>{const w=cv.clientWidth,h=cv.clientHeight;ren.setSize(w,h,false);ov.width=w*(window.devicePixelRatio||1);ov.height=h*(window.devicePixelRatio||1);};fit();window.addEventListener('resize',fit,{once:true});

  const saved=lights.map(l=>l.intensity);const bg=R3.scene.background;if(CAMV.night){lights.forEach(l=>l.intensity*=.05);spot.intensity=tech.colorvu?2.2:2.6;R3.scene.background=new THREE.Color(tech.colorvu?'#0b1016':'#050607');}else{spot.intensity=0;R3.scene.background=new THREE.Color('#b9d3e6');}
  try{ren.render(R3.scene,cam);}finally{lights.forEach((l,i)=>l.intensity=saved[i]);R3.scene.background=bg;spot.intensity=0;}
  const x=ov.getContext('2d');x.clearRect(0,0,ov.width,ov.height);const k=ov.width/cv.clientWidth;
  if(CAMV.night){const n=tech.colorvu?900:1600;x.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<n;i++)x.fillRect(Math.random()*ov.width,Math.random()*ov.height,1.2*k,1.2*k);}
  if(tech.acusense){const box=(obj,hh,ww,lab,col)=>{const p=obj.position.clone();const top=new THREE.Vector3(p.x,floorY+hh,p.z).project(cam),bot=new THREE.Vector3(p.x,floorY,p.z).project(cam);if(top.z>1||bot.z>1)return;const cx=(top.x+1)/2*ov.width,y1=(1-top.y)/2*ov.height,y2=(1-bot.y)/2*ov.height;const hw=Math.abs(y2-y1)*ww;if(cx<-50||cx>ov.width+50)return;x.strokeStyle=col;x.lineWidth=2*k;x.strokeRect(cx-hw/2,y1,hw,y2-y1);x.fillStyle=col;x.font=`700 ${12*k}px Arial`;x.fillText(lab,cx-hw/2,y1-4*k);};box(person,1750,.42,'Persoană','#2bd96b');box(car,1650,1.35,'Vehicul','#3aa0ff');}
  const d=new Date();$('#cv_osd').textContent=d.toLocaleDateString('ro-RO')+' '+d.toLocaleTimeString('ro-RO')+'  '+tech.mp+'MP'+(CAMV.night?(tech.colorvu?'  COLOR':'  IR'):'');
  CAMV.raf=requestAnimationFrame(loop);};loop();}

document.addEventListener('change',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.camcable){const v=el.value;commit(()=>{const w=model.wires.find(x=>x.id===el.dataset.camcable);if(w)w.cable=v;model.cfg.camCable=v;});toast(`Cablu ${v}. Camerele noi se leagă tot cu ${v}.`);}});
