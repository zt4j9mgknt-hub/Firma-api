<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configurator tablouri electrice și media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<style>
:root{--bg:#ECEEEB;--surface:#fff;--surface2:#F4F5F2;--ink:#1F2B33;--muted:#5E6B73;--line:#D6DBD8;--accent:#E3A008;--accent-soft:#FFF3D1;--err:#C62828;--warn:#A86400;--ok:#2E7D32;
--f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 336px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand b{font:700 19px/1 var(--fc);letter-spacing:.01em;display:block}
.brand small{font:500 12.5px/1.2 var(--f);color:var(--muted)}
#pname{font:600 15px var(--f);border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;width:220px;color:var(--ink)}
#pname:hover,#pname:focus{border-color:var(--line);background:#fff}
.spacer{flex:1}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font:600 15px var(--fc);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(31,43,51,.18)}
.btn{font:600 14px var(--f);border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9c1bd}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px}
#live[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:#5a3e00}
#live .dot{width:9px;height:9px;border-radius:50%;background:#aab1b5}
#live[aria-pressed=true] .dot{background:#E3A008;box-shadow:0 0 0 3px rgba(227,160,8,.25)}
.menu{position:absolute;right:14px;top:54px;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(31,43,51,.18);padding:6px;display:none;z-index:60;min-width:250px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font:500 14px var(--f);cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#lib{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px 12px 30px}
#lib input{width:100%}
.grp h3{font:600 14px var(--fc);color:var(--muted);margin:16px 4px 4px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:7px;cursor:pointer;font:500 13.5px/1.25 var(--f)}
.li:hover{background:var(--surface2);border-color:var(--line)}
.li .th{width:60px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.li .th svg{max-width:60px;max-height:38px}
.li small{margin-left:auto;color:var(--muted);font:500 12.5px var(--fc);white-space:nowrap;padding-left:6px}
#stage{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
#cv{width:100%;height:100%;display:block;touch-action:none;background-color:var(--bg);background-image:radial-gradient(#cdd3cf 1px,transparent 1px);background-size:18px 18px;user-select:none;-webkit-user-select:none}
#cv .lbl{font:600 15px var(--fc);fill:#5E6B73}
#cv .comp{cursor:grab}
#cv.sim .comp.act{cursor:pointer}
#cv .term{cursor:crosshair}
#cv .term:hover circle:first-child{stroke-width:2.6}
#cv .wire{cursor:pointer}
#cv .wire path{fill:none;stroke-linejoin:round;stroke-linecap:round}
#cv .wire.dead{opacity:.2}
#ghost{pointer-events:none}
#ghost.ok{fill:rgba(227,160,8,.18);stroke:#E3A008;stroke-width:2;stroke-dasharray:5 4}
#ghost.bad{fill:rgba(198,40,40,.12);stroke:#C62828;stroke-width:2;stroke-dasharray:5 4}
.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font:500 13.5px var(--f);max-width:calc(100% - 130px);text-align:center;pointer-events:none;box-shadow:0 4px 14px rgba(31,43,51,.2)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button[aria-pressed=true]{background:#fbe7de;border-color:#b0471f;color:#b0471f}
.zoom #zlabels,.zoom #zdims,.zoom #zcovers{width:auto;min-width:38px;padding:0 6px}
.zoom button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 18px var(--f);cursor:pointer}
#v3d{position:absolute;inset:0}
#v3d canvas{display:block;touch-action:none}
.tools3d{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hint3d{position:absolute;left:12px;bottom:12px;max-width:430px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0;font-size:13px;color:var(--muted)}
.empty3d{padding:40px;color:var(--muted)}
#viewbom,#viewleg{overflow:auto;padding:22px}
.leg{max-width:1100px}
.leghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
.leghead .num{background:var(--ink);color:#fff;font:700 14px var(--fc);min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.legname{width:200px!important;font-weight:600!important}
.legt td{font-size:13.5px}
.legt td:nth-child(1){width:70px}.legt td:nth-child(2){width:110px}.legt td:nth-child(4){width:150px}.legt td:nth-child(5){width:210px}
.legnote{padding:5px 8px!important;font-size:13px!important}
.chk{display:inline-flex;align-items:center;gap:7px;margin-right:16px;cursor:pointer}
@media (max-width:700px){.legt thead{display:none}.legt tr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;border-top:1px solid var(--line);padding:6px 0}.legt td{border:0;padding:2px 0;width:auto!important}.legt td:nth-child(n+3){grid-column:2}}
.bom{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 24px 26px}
.bom h2{font:700 26px var(--fc);margin:0}
.bom h3{font:600 17px var(--fc);margin:22px 0 6px}
.bomt{width:100%;border-collapse:collapse;font-size:14px}
.bomt td,.bomt th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.bomt th{font:600 13px var(--fc);color:var(--muted);border-top:0}
.bomt td.q{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:110px}
.bomhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bomhead p{margin:4px 0 0;color:var(--muted)}
#insp{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px}
#insp h2{font:700 22px/1.1 var(--fc);margin:2px 0 3px}
#insp .sub{color:var(--muted);margin:0 0 14px}
#insp h3{font:600 16px var(--fc);margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.field{display:grid;gap:4px;margin:0 0 11px}
.field>span{font:600 13px var(--fc);color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input:not([type]),input[type=search]{font:500 14px var(--f);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px}
.chips{display:flex;gap:6px;margin:-4px 0 12px}
.chips button{border:1px dashed #b9c1bd;background:#fff;border-radius:14px;padding:3px 11px;font:600 13px var(--fc);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.state{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.state b{font-weight:600}
table.conn{width:100%;border-collapse:collapse;font-size:13.5px}
table.conn td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.conn td:first-child{width:70px}
.k{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--fc)}
.k::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.muted{color:var(--muted)}
.lnk{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:#b9c1bd;text-underline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 4px 5px;font:500 13px var(--f);cursor:pointer}
.swatches button span{width:15px;height:15px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.swatches button.pe span{background:repeating-linear-gradient(45deg,#3d9a3a 0 4px,#f2c500 4px 8px)}
.swatches button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.checks ul{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.checks li::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c)}
.checks li.err{--c:var(--err)}.checks li.warn{--c:#E08A00}.checks li.info{--c:#8a979e}
.issue{all:unset;cursor:pointer;flex:1;font-size:13.5px}
.fix{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font:600 12.5px var(--f);cursor:pointer;white-space:nowrap}
.pill{font:600 13px var(--fc);padding:2px 9px;border-radius:10px;background:#E8F3E9;color:var(--ok)}
.pill.err{background:#FBE9E9;color:var(--err)}.pill.warn{background:#FFF1DB;color:var(--warn)}
ol.steps{padding-left:20px;margin:6px 0 0}ol.steps li{margin:0 0 8px}
.stats{display:flex;gap:18px;margin:10px 0 4px}
.stats div b{display:block;font:700 26px/1 var(--fc)}
.stats div span{color:var(--muted);font-size:13px}
.handle{display:none}
.exadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.exadd select{flex:1;min-width:220px;width:auto}.exadd input{width:auto}
.tlab{display:block;margin-top:3px;width:100%!important;padding:3px 6px!important;font-size:12px!important}
.wtag,.ptag{display:inline-block;background:#fffbe6;border:1px solid #d9b84a;border-radius:4px;padding:0 5px;font:700 12px var(--fc);color:#1f2a30}
.ptag{background:#e8f1fb;border-color:#9dbadf;color:#123a63}
.nbk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbc{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font:inherit}
.nbc:hover{border-color:#b9c1bd}
.nbc[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--surface2)}
.nbc svg{flex:none}.nbc b{display:block;font:700 17px/1.15 var(--fc);margin-bottom:3px}.nbc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
@media (max-width:600px){.nbk{grid-template-columns:1fr}.nbc{padding:10px}}
.rackview{position:absolute;left:12px;top:12px;display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;box-shadow:0 2px 8px rgba(31,43,51,.12)}.rackview button{border:0;background:none;padding:7px 14px;border-radius:7px;font:600 14px var(--fc);cursor:pointer;color:var(--muted)}.rackview button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg2{display:flex;gap:6px;flex-wrap:wrap}.seg2 .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.crimp{position:fixed;inset:0;background:rgba(20,26,30,.55);display:none;align-items:center;justify-content:center;z-index:95;padding:12px}.crimp.open{display:flex}
.crimp-box{background:#fff;border-radius:14px;width:min(920px,100%);height:min(680px,100%);display:flex;flex-direction:column;overflow:hidden}
.crimp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.crimp-head b{font:700 20px var(--fc);display:block}.crimp-head small{color:var(--muted)}
#cr_v{flex:1;min-height:200px;position:relative}#cr_v canvas{display:block;touch-action:none}
.crimp-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}.crimp-foot p{margin:0 0 8px;min-height:40px}
.crimp-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}.crimp-legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.menu3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:4px}.menu .menu3 button{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 6px}.menu3 b{font:700 14px var(--fc)}.menu3 small{color:var(--muted);font-size:11.5px}
.seg3{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:3px}
#focus3d[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.tools3d{right:12px;max-width:calc(100% - 24px)}
@media (max-width:900px){.tools3d .btn{padding:6px 9px;font-size:13px}.rules3d{left:12px;right:12px;width:auto;top:110px}}
.rules3d{position:absolute;right:12px;top:60px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(31,43,51,.18);padding:12px 14px}.rules3d .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rules3d .rhead b{font:700 17px var(--fc)}
.rules{list-style:none;margin:0;padding:0}.rules li{padding:7px 0;border-top:1px solid var(--line);display:grid;gap:2px}.rules li b{font:600 14px var(--fc)}.rules li span{font-size:13px;color:var(--muted)}.rules li.ok b{color:var(--ok)}.rules li.warn b{color:var(--warn)}
[hidden]{display:none!important}
@media (max-width:900px){.hint3d{display:none}}
#cv [data-duct]{cursor:grab}
.montaj{margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}.montaj summary{cursor:pointer;font:600 15px var(--fc)}.montaj .mh{font:700 13px var(--fc);color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}.montaj .mr{padding:5px 0;border-top:1px solid #eef0ee;font-size:13px;line-height:1.4}.montaj .mr b{display:block;font-weight:700}.montaj .mr span{color:#34424b}
.wire.dim{opacity:.13}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.boxrec{background:var(--accent-soft);border:1px solid #f0cf7a;border-radius:9px;padding:10px 12px;margin:4px 0 10px;display:grid;gap:2px}
.boxrec span{font:600 13px var(--fc);color:#7a5600}.boxrec b{font:700 24px/1.1 var(--fc)}.boxrec small{color:#6b5a2e;font-size:12.5px}
.photoprev{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:8px;display:flex;justify-content:center;background-color:#fff;background-image:linear-gradient(45deg,#eef0ee 25%,transparent 25%,transparent 75%,#eef0ee 75%),linear-gradient(45deg,#eef0ee 25%,transparent 25%,transparent 75%,#eef0ee 75%);background-size:14px 14px;background-position:0 0,7px 7px}
.photoprev img{max-width:100%;max-height:150px;display:block}
input[type=range]{width:100%;accent-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sheet.wide{max-width:820px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}

.pbox{background:var(--bg);background-image:radial-gradient(#cdd3cf 1px,transparent 1px);background-size:14px 14px;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:center;min-height:200px;align-items:center}
.ph{font:600 17px var(--fc);margin:18px 0 6px}
.plist{display:grid;gap:6px;margin:0 0 8px}
.prow{display:flex;gap:6px;align-items:center}

 #pname{width:150px}

const tag=(W,l,y=60.5)=>l?`<rect x="2" y="${y}" width="${W-4}" height="8" rx="1.5" fill="#fff" stroke="#c9ced0"/>${tx(W/2,y+6.3,l,W<20?5.4:6.3,'#1f2a30',700)}`:'';

function bomData(){const L=layout(),g={ap:new Map(),cond:new Map(),acc:new Map()};const inc=(m,k,q,u,pr)=>{const o=m.get(k)||{q:0,u:u||'buc.',pr:pr||0};o.q+=q==null?1:q;m.set(k,o);};
 if(L.rack)inc(g.acc,`Rack 19" ${L.box.U}U, ${L.box.w} × ${L.box.d} mm, ${L.box.floor?'de podea':'de perete'}, cu ușă de sticlă`);else inc(g.acc,(model.cfg.boxName?model.cfg.boxName+', ':'')+(L.metal?`Cutie metalică ${L.box.h} × ${L.box.w} × ${L.box.d} mm, cu placă de montaj și ușă`:`Tablou modular ${model.cfg.type==='media'?'media':'electric'} ${L.nb*L.dinU/2} module (${L.nb} × ${L.dinU/2}), montaj ${(model.cfg.modMount||'aparent')==='ingropat'?'îngropat':'aparent'}, cu ușă`));
 if(L.rack)for(const a of rackAcc(L))inc(g.acc,a[0],a[1],a[2]);
 if(!L.rack){ const railMM=model.bands.reduce((s,b)=>s+(b.type==='din'?((L.bands.find(x=>x.id===b.id)||{}).railLen||0):b.type==='mix'?railMods(b)*2*U+16:0),0);if(railMM)inc(g.acc,'Șină DIN 35 mm',railMM/1000,'m');const hx=L.side.R.cx-L.side.R.w/2-(L.side.L.cx+L.side.L.w/2),vy=(L.ducts[L.nb].cy+L.ducts[L.nb].w/2)-(L.ducts[0].cy-L.ducts[0].w/2);for(const d of L.ducts)inc(g.acc,`Jgheab PVC perforat ${d.w} × ${d.d} mm, cu capac`,hx/1000,'m');for(const i in L.dd){const d=L.dd[i];inc(g.acc,`Jgheab PVC perforat ${d.w} × ${d.d} mm, cu capac (separat, ${d.use==='jt'?'date':'general'})`,hx/1000,'m');}for(const k of ['L','R'])inc(g.acc,`Jgheab PVC perforat ${L.side[k].w} × ${L.side[k].d} mm, cu capac`,vy/1000,'m');}
 for(const c of model.comps){const d=DEFS[c.t];const q=d.bomQ?d.bomQ(c):null;inc(g.ap,d.bom?d.bom(c):d.name,q?q[0]:1,q?q[1]:'buc.',d.price||0);}
 model.wires.forEach((w,i)=>{const A=termAbs(w.a,L),B=termAbs(w.b,L);if(!A||!B)return;const wc=WC[w.color];
  if(wc.pc){const est=polyLen(route(w,i,L))/1000*1.2+0.1;const len=+w.len||PC_LEN.find(v=>v>=est)||10;inc(g.cond,`Patch cord Cat6 ${wc.n.replace('patch ','')} ${fmtN(len)} m`,1,'buc.');}
  else if(A.panel&&B.panel){const len=polyLen(route(w,i,L))/1000*1.1+0.1;inc(g.cond,wc.data?`Cablu ${wc.n} (în tablou, cordon)`:`Conductor flexibil ${fmtN(w.sec)} mm² ${wc.n} (în tablou)`,len,'m');}
  else inc(g.cond,wc.data?`Cablu ${wc.n} către teren`:`Conductor ${fmtN(w.sec)} mm² ${wc.n} către teren`,1,'× (lungime de măsurat)');
  if(!wc.data&&w.sec){const n=(A.panel?1:0)+(B.panel?1:0);if(n)inc(g.acc,`Tub terminal (ferulă) ${fmtN(w.sec)} mm²`,n);}
  if(w.color==='utp'&&A.panel&&B.panel)inc(g.acc,'Mufă RJ45 Cat6',2);});
 if(!L.rack){const lab_=model.wires.length;if(lab_)inc(g.acc,'Etichete conductoare (inele cu cifre), 2 la fiecare fir',lab_*2);
  const fieldW=model.wires.filter(w=>{const A=termAbs(w.a,L),B=termAbs(w.b,L);return A&&B&&(A.panel!==B.panel);});const cables=new Set(fieldW.map(w=>{const A=termAbs(w.a,L),B=termAbs(w.b,L);const f=A.panel?B:A;return f.c.id;})).size;
  if(cables&&L.metal){inc(g.acc,'Presetupă M20 cu contrapiuliță (una pe cablu)',cables);}
  if(cables)inc(g.acc,'Coliere și bride pentru prinderea cablurilor la intrare',cables*2);
  let freeMods=0;for(const b of L.bands){if(b.type!=='din')continue;const used=model.comps.filter(c=>c.zone==='panel'&&c.band===b.id&&DEFS[c.t].mount==='din').reduce((a,c)=>a+DEFS[c.t].w(c),0);freeMods+=Math.max(0,Math.floor(((L.cap[b.id]||0)-used)/2));}
  if(freeMods)inc(g.acc,'Capac pentru module libere (bandă ruptibilă), module',freeMods,'mod.');
  const rails=L.bands.filter(b=>b.type==='din'||b.type==='mix').length;if(rails)inc(g.acc,'Opritor capăt de șină',rails*2);
  const brk=L.bands.map(b=>model.comps.filter(c=>c.zone==='panel'&&c.band===b.id&&/^(mcb|rcbo)/.test(B(c))).length).filter(n=>n>=2).length;if(brk)inc(g.acc,'Pieptene de alimentare (tăiat la lungime), rânduri',brk,'buc.');
  inc(g.acc,'Șuruburi autofiletante pentru șine și jgheaburi',1,'set');
  if(L.metal){inc(g.acc,'Cablu flexibil împământare ușă (galben-verde)',1);inc(g.acc,'Plăcuță avertizare „Pericol de electrocutare”',1);inc(g.acc,'Etichetă firmă (nr. autorizație, data montajului)',1);inc(g.acc,'Schemă monofilară plastifiată + buzunar documente ușă',1);}
  if(hasDoorComps()){inc(g.acc,'Tub spiralat de protecție pentru firele spre ușă',0.6,'m');}}

 <div class="exadd"><select id="exsel" aria-label="Alege material">${MATERIALS.map(([gname,items])=>`<optgroup label="${esc(gname)}">${items.map(([n,u])=>`<option value="${esc(n)}|${u}">${esc(n)} (${u})</option>`).join('')}</optgroup>`).join('')}<option value="__custom">Altceva, scriu eu…</option></select><input type="text" id="exname" placeholder="Denumire" style="display:none"><input type="number" id="exq" min="0" step="0.5" value="1" aria-label="Cantitate" style="width:90px"><button class="btn" id="exadd">Adaugă</button></div>`;

function posNums(){const bi=c=>c.zone==='panel'?model.bands.findIndex(b=>b.id===c.band):c.row;const a=model.comps.slice().sort((p,q)=>(p.zone===q.zone?0:p.zone==='panel'?-1:1)||bi(p)-bi(q)||p.x-q.x);return new Map(a.map((c,i)=>[c.id,i+1]));}
function sortedComps(){const N=posNums();return model.comps.slice().sort((a,b)=>N.get(a.id)-N.get(b.id));}
function legendRows(){const N=posNums(),rows=[];for(const c of sortedComps()){const d=DEFS[c.t];const bb=bandOf(c);const place=c.zone==='panel'&&bb&&bb.type==='rack'?`rack, U${c.x+1}${DEFS[c.t].w(c)>1?'–U'+(c.x+DEFS[c.t].w(c)):''}`:c.zone==='panel'&&bb?(DEFS[c.t].mount==='din'?`${bandName(bb).toLowerCase()}, de la modulul ${fmtN((c.x-(segs(bb).din||[0])[0])/2+1)}`:`${bandName(bb).toLowerCase()}, la ${Math.round(c.x*U)} mm de la stânga`):c.zone==='door'?'pe ușa tabloului':c.row<0?'în teren, intrare pe sus':'în teren';const ts=termLayout(c).map(x=>x.t);
 for(const t of ts){const k=tk(c,t.id);const ws=model.wires.filter(w=>w.a===k||w.b===k);const dir=c.zone==='field'?'spre tablou':t.side==='top'?'intrare (sus)':'ieșire (jos)';
  const to=ws.map(w=>{const o=term(w.a===k?w.b:w.a);if(!o)return null;return {txt:`${N.get(o.c.id)}. ${compName(o.c)}, borna ${tLab(o.c,o.t)}${B(o.c)==='clamp1'?(o.t.side==='top'?' sus':' jos'):''}`,cond:`${WC[w.color].n}${w.sec?' '+fmtN(w.sec)+' mm²':''}${w.label?', '+w.label:''}`};}).filter(Boolean);
  rows.push({c,d,n:N.get(c.id),place,t,k,dir,to,note:(c.notes||{})[t.id]||'',tl:(c.tl||{})[t.id]||''});}}return rows;}

 <label class="field"><span>Cutie</span><select id="s_boxt"><option value="metal"${m.cfg.box!=='modular'?' selected':''}>Cutie metalică (se mărește singură)</option><option value="modular"${m.cfg.box==='modular'?' selected':''}>Tablou modular (mărime fixă)</option><option value="rack"${m.cfg.box==='rack'?' selected':''}>Rack 19" (în U)</option></select></label></div>
 <div class="grid2"><label class="field"><span>Module pe o șină</span><input type="number" id="s_mod" min="4" max="48" value="${m.cfg.modules}"></label><label class="field"><span>Rânduri de șină (doar la modular)</span><input type="number" id="s_rows" min="1" max="10" value="${m.bands.filter(b=>b.type==='din').length}"></label></div>
 <div class="grid2">
 <label class="field"><span>Rânduri în teren (sub tablou)</span><input type="number" id="s_frows" min="1" max="8" value="${m.cfg.fieldRows}"></label></div>
 <label class="field"><span>Rânduri în teren deasupra tabloului (intrare pe sus)</span><input type="number" id="s_ftop" min="0" max="4" value="${m.cfg.fieldTopRows||0}"></label>
 <label class="field"><span>Cutia (pentru lista de materiale)</span><input type="text" id="s_box" value="${esc(m.cfg.boxName||'')}" placeholder="ex. Hager Volta 3×18"></label>
 <h3 style="font:600 17px var(--fc);margin:10px 0 8px">Pe ușa tabloului</h3>
 <div class="field"><span>Logo firmă</span>${m.logo?`<img class="logoprev" src="${m.logo}" alt="Logo încărcat">`:'<span class="muted">Fără logo încărcat; se scrie numele firmei.</span>'}<div class="row"><button class="btn sm" id="s_logo">${m.logo?'Schimbă logo':'Încarcă logo'}</button>${m.logo?'<button class="btn sm" id="s_nologo">Scoate logo</button>':''}</div></div>
 <div class="grid2"><label class="field"><span>E-mail</span><input type="text" id="s_mail" value="${esc(co.email)}"></label><label class="field"><span>Telefon</span><input type="text" id="s_tel" value="${esc(co.phone)}"></label></div>
 <label class="field"><span>Număr autorizație</span><input type="text" id="s_auth" value="${esc(co.auth)}"></label>
 <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="s_cancel">Renunță</button><button class="btn primary" id="s_ok">Salvează setările</button></div>`;
 $('#modal').classList.add('open');
 $('#s_cancel').onclick=()=>$('#modal').classList.remove('open');
 $('#s_logo').onclick=()=>$('#logoIn').click();if($('#s_nologo'))$('#s_nologo').onclick=()=>{commit(()=>{model.logo=null;});loadLogo();openSettings();};
 $('#s_ok').onclick=()=>{const cl=(v,a,b)=>Math.min(b,Math.max(a,Math.round(+v||a)));const rows=cl($('#s_rows').value,1,10),mods=cl($('#s_mod').value,4,48),fr=cl($('#s_frows').value,1,4),bt=$('#s_boxt').value;
  const ft=cl($('#s_ftop').value,0,4);if(model.comps.some(c=>c.zone==='field'&&c.row<-ft)){toast('Mută întâi aparatele din rândurile de sus pe care le scoți.','err');return;}const tooWide=model.comps.some(c=>c.zone==='panel'&&bandOf(c)&&bandOf(c).type==='din'&&c.x+DEFS[c.t].w(c)>mods*2),tooField=model.comps.some(c=>c.zone==='field'&&c.row>=fr);
  if(tooWide){toast('Unele aparate ies de pe șină la lungimea nouă. Mută-le întâi.','err');return;}if(tooField){toast('Mută întâi aparatele din rândurile de teren pe care le scoți.','err');return;}
  if(bt==='rack'&&model.cfg.box!=='rack'&&model.comps.some(c=>c.zone==='panel')){toast('Ca să treci pe rack, scoate întâi aparatele din cutie (sau fă un tablou nou).','err');return;}
  if(bt!=='rack'&&model.cfg.box==='rack'&&model.comps.some(c=>c.zone==='panel')){toast('Scoate întâi echipamentele din rack.','err');return;}
  if(bt==='modular'){if(model.bands.some(b=>b.type==='plate'&&model.comps.some(c=>c.band===b.id))){toast('Tabloul modular nu are placă de montaj: mută întâi echipamentele de pe placă.','err');return;}
   const dins=model.bands.filter(b=>b.type==='din');const extra=dins.slice(rows);if(extra.some(b=>model.comps.some(c=>c.band===b.id))){toast('Șinele pe care le scoți nu sunt goale.','err');return;}}
  commit(()=>{model.name=$('#s_name').value.trim()||'Tablou';model.client=$('#s_client').value.trim();model.date=$('#s_date').value;model.cfg=Object.assign({},model.cfg,{fieldTopRows:ft,type:$('#s_type').value,box:bt,modules:mods,fieldRows:fr,rows,boxName:$('#s_box').value.trim()});
   if(bt==='rack'){if(!model.bands.some(b=>b.type==='rack'))model.bands=[{id:uid(),type:'rack'}];}else if(model.bands.some(b=>b.type==='rack'))model.bands=[{id:uid(),type:'din'}];
   if(bt==='modular'){model.bands=model.bands.filter(b=>b.type==='din');while(model.bands.length>rows)model.bands.pop();while(model.bands.length<rows)model.bands.push({id:uid(),type:'din'});}
   model.company=Object.assign({},model.company,{email:$('#s_mail').value.trim(),phone:$('#s_tel').value.trim(),auth:$('#s_auth').value.trim()});});
  $('#modal').classList.remove('open');renderLib();requestAnimationFrame(fit);if(R3)R3.placed=false;toast('Setări salvate');};}

/* ---------- pornire ---------- */
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===t));$('#view2d').hidden=t!=='2d';$('#view3d').hidden=t!=='3d';$('#viewbom').hidden=t!=='bom';$('#viewleg').hidden=t!=='leg';render();if(t==='2d')requestAnimationFrame(fit);}
function init(){const saved=(()=>{try{const s=localStorage.getItem(KEY);if(s){const m=JSON.parse(s);if(m&&Array.isArray(m.comps)&&Array.isArray(m.wires)&&m.cfg)return m;}}catch(e){}return null;})();
 loadPhotos();loadProducts();prodEvents();legendEvents();bomEvents();model=normalize(saved||demoHouse());loadLogo();renderLib();inspEvents();canvasEvents();
 $('#lib').addEventListener('click',e=>{const ed=e.target.closest('[data-editprod]');if(ed){closeLib();openProduct(ed.dataset.editprod);return;}if(e.target.closest('[data-newprod]')){closeLib();openProduct(null);return;}if(e.target.closest('[data-newbox]')){closeLib();openNewBox();return;}const ab=e.target.closest('[data-addband]');if(ab){addBand(ab.dataset.addband);return;}const b=e.target.closest('[data-add]');if(b)addComp(b.dataset.add);});
 $('#lib').addEventListener('input',e=>{if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;renderLib();const q=$('#libq');q.focus();q.setSelectionRange(pos,pos);}});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
 $('#live').onclick=()=>{sim=!sim;pending=null;if(sim){if(!model.comps.some(c=>B(c)==='src230'||B(c)==='src400'))toast('Nu există alimentare de rețea în proiect: adaug-o din grupa Alimentare','warn');else toast('Tabloul e sub tensiune');simSettle();}save();render();};
 $('#undo').onclick=undo;
 $('#pname').onchange=e=>commit(()=>{model.name=e.target.value.trim()||'Tablou';});
 $('#openLib').onclick=()=>{$('#lib').classList.add('open');$('#scrim').classList.add('open');};$('#scrim').onclick=closeLib;
 const mb=$('#menuBtn'),mn=$('#menu');mb.onclick=e=>{e.stopPropagation();const o=!mn.classList.contains('open');mn.classList.toggle('open',o);mb.setAttribute('aria-expanded',o);};document.addEventListener('click',e=>{if(!mn.contains(e.target)&&e.target!==mb){mn.classList.remove('open');mb.setAttribute('aria-expanded','false');}});
 mn.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mn.classList.remove('open');const m=b.dataset.m;sim=false;
  if(m==='house')setModel(demoHouse(),'Exemplu încărcat. „Anulează” readuce proiectul anterior.');
  else if(m==='media')setModel(demoMedia(),'Exemplu încărcat. „Anulează” readuce proiectul anterior.');
  else if(m==='blankE')setModel(blank('Tablou nou',{type:'electric',rows:3,modules:18}),'Tablou gol. Începe cu o alimentare de rețea.');
  else if(m==='blankM')setModel(blank('Tablou media nou',{type:'media',rows:3,modules:18}),'Tablou media gol.');
  else if(m==='settings')openSettings();
  else if(m==='newbox')openNewBox();
  else if(m==='share')openShare();
  else if(m==='mylib')openLib();
  else if(m==='new-electric')openNewBox('metal');else if(m==='new-media')openNewBox('media');else if(m==='new-rack')openNewBox('rack');
  else if(m==='newprod')openProduct(null);
  else if(m==='libexp'){if(!PRODUCTS.length){toast('Biblioteca ta e goală deocamdată');}else saveFile('produsele-mele.json',JSON.stringify({products:PRODUCTS,photos:usedPhotos(PRODUCTS.map(p=>'x_'+p.id))},null,1),'application/json');}
  else if(m==='libimp')$('#libIn').click();
  else if(m==='import')$('#fileIn').click();
  else if(m==='export'){syncModelProducts();model.photos=usedPhotos([...new Set(model.comps.map(c=>c.t))]);}if(m==='export')saveFile(slug(model.name)+'.json',JSON.stringify(model,null,1),'application/json');
  else if(m==='svg'){const L=layout(),[vx,vy,bw,bh]=viewBounds(L);const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} ${vy} ${bw} ${bh}" width="${Math.round(bw*2)}" height="${Math.round(bh*2)}"><style>.wire path{fill:none;stroke-linejoin:round;stroke-linecap:round}.wire.dead{opacity:.2}</style>${$('#cv defs').outerHTML}<rect x="${vx}" y="${vy}" width="${bw}" height="${bh}" fill="#ffffff"/>${worldSVG(solve()).replace(/<circle class="pulse"[^>]*\/>|<line id="pline"[^>]*\/>/g,'')}<text x="${vx+10}" y="${vy+bh-8}" font-family="Arial" font-size="11" fill="#5E6B73">${esc(model.company.name||'')}, ${esc(model.company.email)}, ${esc(model.company.phone)}, autorizație nr. ${esc(model.company.auth)}</text></svg>`;saveFile(slug(model.name)+'-schema.svg',svg,'image/svg+xml');}
  render();});
 $('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const m=JSON.parse(rd.result);if(!m||!Array.isArray(m.comps)||!Array.isArray(m.wires)||!m.cfg)throw 0;setModel(m,'Proiect deschis: '+(m.name||f.name));}catch(err){toast('Fișierul nu e un proiect de tablou valid','err');}};rd.readAsText(f);e.target.value='';};
 $('#logoIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width,300/im.height),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);commit(()=>{model.logo=cv.toDataURL('image/png');});loadLogo();openSettings();toast('Logo încărcat; apare pe ușa tabloului în 3D');};im.src=rd.result;};rd.readAsDataURL(f);e.target.value='';};
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){draft=null;closeModal();}});
 $('#libIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const list=Array.isArray(j)?j:j.products;if(!Array.isArray(list))throw 0;if(j&&j.photos)mergePhotos(j.photos);const n=mergeProducts(list);renderLib();toast(n?`Am adăugat ${n} produse în biblioteca ta`:'Toate produsele din fișier erau deja în bibliotecă');}catch(err){toast('Fișierul nu conține produse valide','err');}};rd.readAsText(f);e.target.value='';};
 $('#newBox').onclick=openNewBox;
 $('#shareBtn').onclick=openShare;
 $('#photoIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!photoFor)return;try{const t=photoFor;const raw=await photoRawFromFile(f);const prev=[PHOTOS[t],PRAW[t]];PRAW[t]=raw;POPT[t]={bg:true,tol:40};PHOTOS[t]=await processPhoto(raw,POPT[t]);if(!savePhotos()){PHOTOS[t]=prev[0];PRAW[t]=prev[1];if(!prev[0])delete PHOTOS[t];return;}touch();render();toast('Poza a fost pusă și decupată pe marginile aparatului. Dacă a tăiat prea mult sau prea puțin, reglează din dreapta.');}catch(err){toast('Imaginea nu s-a putut citi','err');}};
 $('#zin').onclick=()=>{const r=$('#cv').getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);};$('#zout').onclick=()=>{const r=$('#cv').getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.8);};$('#zfit').onclick=fit;
 $('#rackview').addEventListener('click',e=>{const b=e.target.closest('[data-rv]');if(!b)return;model.cfg.rackView=b.dataset.rv;touch();save();render();requestAnimationFrame(fit);});
 $('#zdims').onclick=()=>{model.cfg.showDims=model.cfg.showDims===false;save();render();};
 $('#zcovers').onclick=()=>{model.cfg.covers2d=!model.cfg.covers2d;save();render();toast(model.cfg.covers2d?'Capacele sunt puse. Atinge un aparat sau un fir ca să-i vezi traseul.':'Capacele sunt scoase: vezi toate firele din jgheaburi.');};
 $('#zlabels').onclick=()=>{model.cfg.showLabels=model.cfg.showLabels===false;save();render();};
 $('#door').onclick=toggleDoor;
 $('#lids').onclick=()=>{if(!R3)return;R3.lids=!R3.lids;$('#lids').textContent=R3.lids?'Scoate capacele':'Pune capacele';render();};
 $('#focus3d').onclick=()=>{if(!R3)return;R3.focus=!R3.focus;$('#focus3d').setAttribute('aria-pressed',R3.focus);if(R3.focus&&!sel)toast('Selectează un aparat sau un fir; restul firelor se estompează.');render();};
 $('#field3d').onclick=()=>{if(!R3)return;R3.showField=!R3.showField;$('#field3d').setAttribute('aria-pressed',R3.showField);render();};
 $('#rulesBtn').onclick=()=>{const p=$('#rules3d');p.hidden=!p.hidden;if(!p.hidden)p.querySelector('.rbody').innerHTML=rulesHTML();};
 document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>cam3d(b.dataset.cam));$('#recenter').onclick=recenter3d;
 document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}else if(e.key==='Escape'){pending=null;reconn=null;draft=null;closeModal();render();}else if((e.key==='Delete'||e.key==='Backspace')&&sel&&tab==='2d'){e.preventDefault();delSel();}});
 new ResizeObserver(()=>{if(tab==='2d'&&!init.fitted){fit();}}).observe($('#stage'));
 render();requestAnimationFrame(()=>{fit();init.fitted=true;});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderLib();render();});}
/* ---------- tragere șină: mutare și lungime ---------- */
let railRaf=0;
function railDrag(g,ddx,ddy){const id=g.rl||g.re.split(':')[0];const b=model.bands.find(x=>x.id===id);if(!b)return;
 if(!g.init){const L=layout(),bl=L.bands.find(x=>x.id===id);g.init={snap:JSON.stringify(model),off:bl.off||0,gt:bl.gt,len:bl.railLen,innerW:L.innerW,items:model.comps.filter(c=>c.zone==='panel'&&c.band===id).map(c=>({c,x:c.x,w:DEFS[c.t].w(c)}))};}
 const I=g.init,maxEnd=I.items.reduce((m,o)=>Math.max(m,(o.x+o.w)*U),0),minX=I.items.reduce((m,o)=>Math.min(m,o.x),1e9);
 if(g.type==='rl'){const nOff=Math.max(0,Math.round(I.off+ddx));const room=I.innerW-Math.max(b.type==='din'&&+b.len>0?+b.len:maxEnd,maxEnd);if(Math.abs(ddx)>=4)b.off=Math.min(nOff,Math.max(0,Math.floor(room)));if(Math.abs(ddy)>=4)b.gapTop=Math.max(2,Math.round(I.gt+ddy));}
 else{const side=g.re.split(':')[1];if(side==='R'){let len=Math.round(I.len+ddx);len=Math.max(len,maxEnd,U*2);if(len>=I.innerW-I.off-4)b.len=null;else b.len=len;}
  else{let dU=Math.round(ddx/U);dU=Math.max(dU,-Math.floor(I.off/U));if(I.items.length)dU=Math.min(dU,minX);dU=Math.min(dU,Math.floor((I.len-Math.max(maxEnd,U*2))/U));b.off=Math.max(0,Math.round(I.off+dU*U));b.len=Math.max(U*2,Math.round(I.len-dU*U));for(const o of I.items)o.c.x=o.x-dU;}}
 touch();if(!railRaf)railRaf=requestAnimationFrame(()=>{railRaf=0;render2d(solve());});}
function ductDrag(g,ddx,ddy){const k=g.dk;const L=layout();if(!g.init){g.init={snap:JSON.stringify(model)};if(k==='L'||k==='R')g.init.v=L.side[k].ins||0;else{const i=+k.slice(1);g.init.gb=L.bands[i-1].gb;g.init.gt=L.bands[i].gt;}}
 if(k==='L'||k==='R'){model.cfg[k==='L'?'sideInL':'sideInR']=Math.max(0,Math.round(g.init.v+(k==='L'?ddx:-ddx)));}
 else{const i=+k.slice(1);const tot=g.init.gb+g.init.gt;const gb=Math.min(tot-2,Math.max(2,Math.round(g.init.gb+ddy)));model.bands[i-1].gapBot=gb;model.bands[i].gapTop=Math.round(tot-gb);}
 touch();render();}
function ductDragEnd(g){if(!g.init)return;undoStack.push(g.init.snap);if(undoStack.length>60)undoStack.shift();touch();save();render();const k=g.dk;if(k==='L'||k==='R')toast(`Jgheabul ${k==='L'?'din stânga':'din dreapta'} e la ${model.cfg[k==='L'?'sideInL':'sideInR']||0} mm de perete`);else{const i=+k.slice(1);toast(`Jgheab mutat: ${model.bands[i-1].gapBot} mm deasupra, ${model.bands[i].gapTop} mm dedesubt`);}}
function railDragEnd(g){if(!g.init)return;undoStack.push(g.init.snap);if(undoStack.length>60)undoStack.shift();touch();save();render();const bl=layout().bands.find(x=>x.id===(g.rl||g.re.split(':')[0]));if(bl&&bl.type==='din')toast(g.type==='re'?`Șina are acum ${Math.round(bl.railLen)} mm${bl.full?', până în jgheab':''}`:`Șina e la ${Math.round(bl.gt+bl.h/2)} mm de jgheabul de sus și ${Math.round(bl.off)} mm de la stânga`);}
init();cloudInit();
})();
</script>
