  // dedupe case-insensitive păstrând prima formă
  const uniqStr = (arr) => { const seen=new Set(); const out=[]; (arr||[]).forEach((s)=>{ const t=String(s||'').trim(); const k=t.toLowerCase(); if(t && !seen.has(k)){ seen.add(k); out.push(t); } }); return out; };

  // --- Sugestii SCULE: de pe acest șantier (tab Scule) + de pe toate șantierele + din șablon + folosite în alte checklist-uri ---
  const sugScule = uniqStr([
    ...((sculeSantier||[]).filter((s)=>s.santierId===santierId).map((s)=>s.denumire)),
    ...((sculeSantier||[]).map((s)=>s.denumire)),
    ...((sablon.scule)||[]),
    ...((checklistSantier||[]).filter((i)=>i.tip==='scula').map((i)=>i.text)),
  ]);
  // --- Sugestii MATERIALE: lista șantierului (importată) dacă există; altfel istoricul general (gestiune + folosite oriunde) ---
  const matSite = uniqStr((materialeLista||[]).map((m)=>m.denumire).filter(Boolean));
  const matGeneral = uniqStr([
    ...((materials||[]).filter((m)=>!m.arhivat).map((m)=>m.denumire)),
    ...((checklistSantier||[]).filter((i)=>i.tip==='material' || i.tip==='manual').map((i)=>i.text)),
    ...((rapoarte||[]).flatMap((r)=>(r.materialeFolosite||[]).map((m)=>m.denumire))),
    ...((cereri||[]).map((c)=>c.denumire)),
  ].filter(Boolean));
  const sugMateriale = matSite.length ? uniqStr([...matSite, ...matGeneral]) : matGeneral;
  const filtreaza = (arr, f) => !f.trim() ? arr : arr.filter((x)=> seCauta(x, f));
  const setObligatoriu = (id, val) => saveItems((checklistSantier||[]).map((i)=> i.id===id ? { ...i, obligatoriu: val } : i));
  const delItem = (id) => saveItems((checklistSantier||[]).filter((i)=>i.id!==id));

  const genDinDeviz = () => {
    const surse = [];
    (materialeLista||[]).forEach((m)=>{ if (m.denumire) surse.push(`${m.denumire}${(Number(m.cantitate)||0)>0?` — ${m.cantitate} ${m.um||''}`.trimEnd():''}`); });
    (cereri||[]).forEach((c)=>{ if (c.denumire) surse.push(`${c.denumire}${(Number(c.cantitate)||0)>0?` — ${c.cantitate} ${c.um||''}`.trimEnd():''}`); });
    (pozitii||[]).forEach((p)=>{ if (p.denumire) surse.push(p.denumire); });
    if (surse.length===0) { alert('Nu am găsit materiale în deviz/poziții/cereri pentru acest șantier. Le poți adăuga manual mai jos.'); return; }
    addMulte('start', 'material', surse);
  };

  // Progres
  const pct = (arr) => arr.length ? Math.round(arr.filter((i)=>i.bifat).length / arr.length * 100) : 0;
  const startPct = pct(startItems);
  const finalPct = pct(finalItems);

  const obligFinal = finalItems.filter((i)=>i.obligatoriu);
  const obligBifate = obligFinal.length===0 || obligFinal.every((i)=>i.bifat);
  const totiConfirmat = echipaActivi.length===0 || echipaActivi.every((e)=>confirmari.some((c)=>c.userId===e.userId));
  const potFinaliza = obligBifate && totiConfirmat;
  const esteFinalizat = santier?.status==='Finalizat';

  const confirmMembru = (userId) => {
    if (confirmari.some((c)=>c.userId===userId)) return;
    saveConfirmari([...(checklistConfirmari||[]), { id: uid(), santierId, userId, nume: numeUser(userId), data: azi() }]);
    if (userId === currentUser?.id) notifica('manageri', { title:'Checklist confirmat', body:`${currentUser?.nume || 'Un coleg'} a confirmat checklist-ul de final la ${santier?.nume || 'șantier'}.`, tag:'checklist-'+santierId }, currentUser?.id);
  };
  const scoateConfirmare = (userId) => saveConfirmari((checklistConfirmari||[]).filter((c)=>!(c.santierId===santierId && c.userId===userId)));

  const barStyle = (p, col) => ({ height:'6px', borderRadius:'4px', background:'var(--panel2)', overflow:'hidden', marginTop:'4px' });
  const Bar = ({ p, col }) => (
    <div style={barStyle(p)}><div style={{ height:'100%', width:`${p}%`, background: col, transition:'width .2s' }} /></div>
  );

  const ItemRow = ({ it }) => (
    <div className="flex items-start gap-2 px-2.5 py-2 rounded-lg" style={{ background:'var(--panel2)' }}>
      <button onClick={()=>toggleBifat(it.id)} className="shrink-0 mt-0.5" style={{ width:20, height:20, borderRadius:6, border:'1px solid '+(it.bifat?'#4CAF7D':'#3A424C'), background: it.bifat?'#4CAF7D':'transparent', color:'#14181C', fontSize:13, fontWeight:800, lineHeight:'18px', textAlign:'center' }}>{it.bifat?'✓':''}</button>
      <div className="flex-1 min-w-0">
        <div className="text-xs" style={{ color: it.bifat?'var(--muted)':'var(--text)', textDecoration: it.bifat?'line-through':'none' }}>
          {it.text}{it.obligatoriu && <span className="ml-1" style={{ color:'#E9A23B' }} title="Obligatoriu">*</span>}
        </div>
        {it.bifat && it.bifatNume && <div className="text-[10px]" style={{ color:'var(--muted2)' }}>✓ {it.bifatNume} · {fmtData ? fmtData(it.bifatData) : it.bifatData}</div>}
      </div>
      <div className="flex items-center gap-1 shrink-0">
        {isManager && it.faza==='final' && (
          <button onClick={()=>setObligatoriu(it.id, !it.obligatoriu)} className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: it.obligatoriu?'#14181C':'var(--muted)', background: it.obligatoriu?'#E9A23B':'var(--panel)' }}>{it.obligatoriu?'oblig.':'opțional'}</button>
        )}
        <button onClick={()=>delItem(it.id)} style={{ color:'#E05252', opacity:0.75, fontSize:12 }}>🗑</button>
      </div>
    </div>
  );

  // Rând pentru elementele de la ÎNCEPUT — bifă clară „Am" (verde) / „Lipsă" (roșu).
  const StartRow = ({ it }) => {
    const stare = it.bifat ? 'am' : it.lipsa ? 'lipsa' : 'gol';
    return (
      <div className="flex items-center gap-2 px-2.5 py-2 rounded-lg" style={{ background:'var(--panel2)', border: stare==='lipsa' ? '1px solid #E0525255' : '1px solid transparent' }}>
        <div className="flex-1 min-w-0">
          <div className="text-sm" style={{ color: stare==='am'?'var(--muted)':'var(--text)', textDecoration: stare==='am'?'line-through':'none' }}>{it.text}</div>
          {stare==='am' && it.bifatNume && <div className="text-[10px]" style={{ color:'var(--muted2)' }}>✓ {it.bifatNume}</div>}
          {stare==='lipsa' && <div className="text-[10px]" style={{ color:'#E05252' }}>lipsește</div>}
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={()=>setStareItem(it.id, stare==='am'?'gol':'am')} className="text-xs px-2.5 py-1 rounded-lg font-semibold" style={{ color: stare==='am'?'#14181C':'#4CAF7D', background: stare==='am'?'#4CAF7D':'var(--panel)', border:'1px solid #4CAF7D66' }}>✓ Am</button>
          <button onClick={()=>setStareItem(it.id, stare==='lipsa'?'gol':'lipsa')} className="text-xs px-2.5 py-1 rounded-lg font-semibold" style={{ color: stare==='lipsa'?'#14181C':'#E05252', background: stare==='lipsa'?'#E05252':'var(--panel)', border:'1px solid #E0525266' }}>✗ Lipsă</button>
          <button onClick={()=>delItem(it.id)} style={{ color:'var(--muted2)', opacity:0.75, fontSize:12 }}>🗑</button>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-3">
      {/* Șablon standard (Manager) */}
      {isManager && (
        <div className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <button onClick={()=>setSablonOpen(!sablonOpen)} className="w-full flex items-center justify-between">
            <span className="text-sm font-semibold" style={{ color:'var(--text)' }}>⚙️ Verificări finale standard</span>
            <span style={{ color:'var(--muted)', fontSize:11 }}>{sablonOpen?'▲':'▼'}</span>
          </button>
          {sablonOpen && (
            <div className="mt-3 space-y-3">
              <div className="text-[11px]" style={{ color:'var(--muted)' }}>Lista de verificări de la final; o adaugi la orice șantier cu un buton. (Sculele și materialele se pun la „La început".)</div>
              {/* Verificări */}
              <div>
                <div className="text-xs font-semibold mb-1" style={{ color:'#4CAF7D' }}>✅ Verificări finale <span style={{ color:'var(--muted)', fontWeight:400 }}>(apasă „oblig." ca să fie obligatorii)</span></div>
                <div className="space-y-1">
                  {sablon.verificari.map((v,idx)=>(
                    <div key={idx} className="flex items-center justify-between text-xs px-2 py-1 rounded" style={{ background:'var(--panel2)', color:'var(--text)' }}>
                      <span>{v.text}</span>
                      <div className="flex items-center gap-1">
                        <button onClick={()=>saveSablon({...sablon, verificari: sablon.verificari.map((x,i)=>i===idx?{...x, obligatoriu:!x.obligatoriu}:x)})} className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: v.obligatoriu?'#14181C':'var(--muted)', background: v.obligatoriu?'#E9A23B':'var(--panel)' }}>{v.obligatoriu?'oblig.':'opțional'}</button>
                        <button onClick={()=>saveSablon({...sablon, verificari: sablon.verificari.filter((_,i)=>i!==idx)})} style={{ color:'#E05252' }}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-1 mt-1">
                  <input value={nouVerif} onChange={(e)=>setNouVerif(e.target.value)} placeholder="Adaugă verificare în șablon" className="flex-1 rounded px-2 py-1 text-xs outline-none" style={inputStyle} />
                  <button onClick={()=>{ if(nouVerif.trim()){ saveSablon({...sablon, verificari:[...sablon.verificari, { text:nouVerif.trim(), obligatoriu:false }]}); setNouVerif(''); } }} className="text-xs px-2 py-1 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>+</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ÎNCEPUT */}
      <div className="rounded-xl" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <button onClick={()=>setOpenStart(!openStart)} className="w-full flex items-center gap-2 px-3 py-2.5">
          <span style={{ fontSize:10, color:'var(--muted)', display:'inline-block', transform: openStart?'rotate(90deg)':'none', transition:'transform .15s' }}>▶</span>
          <span className="text-sm font-semibold flex-1 text-left" style={{ color:'var(--text)' }}>🚀 La început</span>
          <span className="text-xs" style={{ color: startPct===100 && startItems.length ? '#4CAF7D' : 'var(--muted)' }}>{startItems.filter((i)=>i.bifat).length}/{startItems.length}</span>
        </button>
        {openStart && (
        <div className="px-3 pb-3">
        <Bar p={startPct} col="#2E8BD1" />
        <div className="text-[11px] mt-2 mb-2" style={{ color:'var(--muted2)' }}>La fiecare rând bifează <span style={{ color:'#4CAF7D', fontWeight:700 }}>✓ Am</span> sau <span style={{ color:'#E05252', fontWeight:700 }}>✗ Lipsă</span>.</div>

        {/* RUBRICA SCULE */}
        <div className="mb-3">
          <div className="text-xs font-semibold mb-1" style={{ color:'#2E8BD1' }}>🔧 Scule</div>
          <div className="space-y-1">
            {startScule.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Nicio sculă adăugată.</div> : startScule.map((it)=><StartRow key={it.id} it={it} />)}
          </div>
          <button onClick={()=>setPickerSculeOpen(!pickerSculeOpen)} className="w-full mt-1.5 text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>{pickerSculeOpen ? 'Închide' : '➕ Adaugă scule'}</button>
          {pickerSculeOpen && (
            <div className="rounded-lg p-2 mt-1.5" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
              <div className="flex gap-1 mb-2">
                <input value={manualScula} onChange={(e)=>setManualScula(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter'){ addItem('start','scula',manualScula); setManualScula(''); } }} placeholder="Scrie o sculă (ex: Rotopercutor)" className="flex-1 rounded-lg px-3 py-1.5 text-xs outline-none" style={inputStyle} />
                <button onClick={()=>{ addItem('start','scula',manualScula); setManualScula(''); }} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă</button>
              </div>
              {sugScule.length>0 && (<>
                <div className="text-[11px] mb-1" style={{ color:'var(--muted)' }}>Sugestii (din tab-ul Scule și de pe alte șantiere):</div>
                <input value={filtruScule} onChange={(e)=>setFiltruScule(e.target.value)} placeholder="🔍 Caută..." className="w-full rounded-lg px-3 py-1.5 text-xs outline-none mb-1.5" style={inputStyle} />
                <div className="space-y-1" style={{ maxHeight:200, overflowY:'auto' }}>
                  {filtreaza(sugScule, filtruScule).slice(0,60).map((t,idx)=>{ const on=peLista(t,'scula'); return (
                    <button key={idx} onClick={()=>toggleItem(t,'scula')} className="w-full flex items-center gap-2 text-left text-xs px-2 py-1.5 rounded-lg" style={{ background: on?'#2E8BD122':'var(--panel)', border:'1px solid '+(on?'#2E8BD1':'var(--border)') }}>
                      <span className="shrink-0" style={{ width:18, height:18, borderRadius:5, border:'1px solid '+(on?'#2E8BD1':'#3A424C'), background: on?'#2E8BD1':'transparent', color:'#14181C', fontSize:12, fontWeight:800, lineHeight:'16px', textAlign:'center' }}>{on?'✓':''}</span>
                      <span style={{ color:'var(--text)' }}>{t}</span>
                    </button>
                  ); })}
                </div>
              </>)}
            </div>
          )}
        </div>

        {/* RUBRICA MATERIALE */}
        <div>
          <div className="text-xs font-semibold mb-1" style={{ color:'#4CAF7D' }}>📦 Materiale</div>
          <div className="space-y-1">
            {startMateriale.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun material adăugat.</div> : startMateriale.map((it)=><StartRow key={it.id} it={it} />)}
          </div>
          <button onClick={()=>setPickerMatOpen(!pickerMatOpen)} className="w-full mt-1.5 text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>{pickerMatOpen ? 'Închide' : '➕ Adaugă materiale'}</button>
          {pickerMatOpen && (
            <div className="rounded-lg p-2 mt-1.5" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
              <div className="flex gap-1 mb-2">
                <input value={manualMat} onChange={(e)=>setManualMat(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter'){ addItem('start','material',manualMat); setManualMat(''); } }} placeholder="Scrie un material (ex: Cablu CYY-F 3x2.5)" className="flex-1 rounded-lg px-3 py-1.5 text-xs outline-none" style={inputStyle} />
                <button onClick={()=>{ addItem('start','material',manualMat); setManualMat(''); }} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă</button>
              </div>
              {sugMateriale.length>0 ? (<>
                <div className="text-[11px] mb-1" style={{ color:'var(--muted)' }}>{matSite.length ? 'Din lista de materiale a șantierului:' : 'Din istoricul general de materiale:'}</div>
                <input value={filtruMat} onChange={(e)=>setFiltruMat(e.target.value)} placeholder="🔍 Caută..." className="w-full rounded-lg px-3 py-1.5 text-xs outline-none mb-1.5" style={inputStyle} />
                <div className="space-y-1" style={{ maxHeight:200, overflowY:'auto' }}>
                  {filtreaza(sugMateriale, filtruMat).slice(0,80).map((t,idx)=>{ const on=peLista(t,'material'); return (
                    <button key={idx} onClick={()=>toggleItem(t,'material')} className="w-full flex items-center gap-2 text-left text-xs px-2 py-1.5 rounded-lg" style={{ background: on?'#4CAF7D22':'var(--panel)', border:'1px solid '+(on?'#4CAF7D':'var(--border)') }}>
                      <span className="shrink-0" style={{ width:18, height:18, borderRadius:5, border:'1px solid '+(on?'#4CAF7D':'#3A424C'), background: on?'#4CAF7D':'transparent', color:'#14181C', fontSize:12, fontWeight:800, lineHeight:'16px', textAlign:'center' }}>{on?'✓':''}</span>
                      <span style={{ color:'var(--text)' }}>{t}</span>
                    </button>
                  ); })}
                </div>
              </>) : <div className="text-[11px]" style={{ color:'var(--muted2)' }}>Nu există încă materiale în listă sau istoric. Scrie manual mai sus.</div>}
            </div>
          )}
        </div>
        </div>
        )}
      </div>

      {/* FINAL */}
      <div className="rounded-xl" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <button onClick={()=>setOpenFinal(!openFinal)} className="w-full flex items-center gap-2 px-3 py-2.5">
          <span style={{ fontSize:10, color:'var(--muted)', display:'inline-block', transform: openFinal?'rotate(90deg)':'none', transition:'transform .15s' }}>▶</span>
          <span className="text-sm font-semibold flex-1 text-left" style={{ color:'var(--text)' }}>🏁 La final</span>
          {!esteFinalizat && potFinaliza && <span className="text-xs mr-1" style={{ color:'#4CAF7D' }}>✓ gata</span>}
          <span className="text-xs" style={{ color: finalPct===100 && finalItems.length ? '#4CAF7D' : 'var(--muted)' }}>{finalItems.filter((i)=>i.bifat).length}/{finalItems.length}</span>
        </button>
        {openFinal && (
        <div className="px-3 pb-3">
        <Bar p={finalPct} col="#4CAF7D" />
        <div className="flex flex-wrap gap-1.5 mt-2">
          <button onClick={()=>addMulte('final','verificare', sablon.verificari)} className="text-xs px-2.5 py-1 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✅ Adaugă verificările standard</button>
        </div>
        <div className="space-y-1 mt-2">
          {finalItems.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun element încă. Apasă „Adaugă verificările standard" sau adaugă manual.</div>
            : finalItems.map((it)=><ItemRow key={it.id} it={it} />)}
        </div>
        <div className="flex gap-1 mt-2">
          <input value={manualFinal} onChange={(e)=>setManualFinal(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter'){ addItem('final','verificare',manualFinal); setManualFinal(''); } }} placeholder="Adaugă verificare manuală" className="flex-1 rounded-lg px-3 py-1.5 text-xs outline-none" style={inputStyle} />
          <button onClick={()=>{ addItem('final','verificare',manualFinal); setManualFinal(''); }} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă</button>
        </div>

        {/* Confirmări echipă */}
        <div className="mt-3 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          <div className="text-xs font-semibold mb-1" style={{ color:'var(--text)' }}>✍️ Confirmare echipă (membrii activi)</div>
          {echipaActivi.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun membru activ pe șantier. Asignează echipa la tab-ul „Echipă".</div> : (
            <div className="space-y-1">
              {echipaActivi.map((e)=>{
                const conf = confirmari.find((c)=>c.userId===e.userId);
                const potConfirma = isManager || e.userId===currentUser?.id;
                return (
                  <div key={e.userId} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                    <span style={{ color:'var(--text)' }}>👷 {numeUser(e.userId)}{e.userId===currentUser?.id && <span style={{ color:'var(--muted2)' }}> (tu)</span>}</span>
                    {conf ? (
                      <div className="flex items-center gap-2">
                        <span style={{ color:'#4CAF7D' }}>✓ confirmat {fmtData ? fmtData(conf.data) : conf.data}</span>
                        {potConfirma && <button onClick={()=>scoateConfirmare(e.userId)} style={{ color:'var(--muted)' }}>anulează</button>}
                      </div>
                    ) : (
                      potConfirma
                        ? <button onClick={()=>confirmMembru(e.userId)} className="px-2.5 py-1 rounded-lg font-semibold" style={{ color:'#14181C', background:'#E9A23B' }}>Confirm</button>
                        : <span style={{ color:'var(--muted)' }}>așteaptă confirmarea lui</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Stare finalizare */}
        <div className="mt-3 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          {esteFinalizat ? (
            <div className="text-sm font-semibold text-center py-2 rounded-lg" style={{ color:'#4CAF7D', background:'rgba(76,175,125,.16)' }}>✅ Șantier finalizat</div>
          ) : (
            <>
              <div className="text-xs mb-2" style={{ color: potFinaliza?'#4CAF7D':'#E9A23B' }}>
                {potFinaliza ? '✓ Toate condițiile îndeplinite — poți finaliza.' : `⏳ Mai lipsește: ${[!obligBifate?'verificări obligatorii (*) nebifate':null, !totiConfirmat?'confirmarea tuturor membrilor activi':null].filter(Boolean).join(' + ')}.`}
              </div>
              {isManager && (
                <button onClick={()=>{ if(potFinaliza && window.confirm('Marchezi șantierul ca finalizat?')) onFinalizeSantier(santierId); }} disabled={!potFinaliza}
                  className="w-full text-sm px-4 py-2 rounded-lg font-semibold" style={{ color: potFinaliza?'#14181C':'var(--muted2)', background: potFinaliza?'#4CAF7D':'#232a33', cursor: potFinaliza?'pointer':'not-allowed' }}>
                  🏁 Finalizează șantierul
                </button>
              )}
            </>
          )}
        </div>
        </div>
        )}
      </div>
    </div>
  );
}

function SiteMaterialsTab({ santierId, santierNume, company, materials, cereriSantier, setCereriSantier, miscariSantier, setMiscariSantier, persist, onExportToDeviz, onCerereMaterial, currentUser }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };

  // --- Cerere materiale ---
  const [cerereForm, setCerereForm] = useState({ denumire:'', cantitate:1, um:'buc' });
  const [cerereDraft, setCerereDraft] = useState([]); // lista de materiale ce vor fi trimise împreună (o singură cerere)
  const [cerereFilter, setCerereFilter] = useState('');
  const [cerereDataFiltru, setCerereDataFiltru] = useState('');
  const [cerereShowAll, setCerereShowAll] = useState(false);
  const normalizeSearchLocal = (s) => String(s || '').toLowerCase().replace(/[\s,.\-]/g, '');
  const cereriAici = cereriSantier.filter((c)=>c.santierId===santierId);
  // adaugă rândul curent în lista (draft), fără a trimite încă.
  // Dacă același material a fost deja cerut AZI pe ACEST șantier (în listă sau deja trimis, încă în așteptare),
  // întreabă: linie nouă separată SAU adună cantitatea la linia existentă.
  const adaugaInLista = () => {
    if (!cerereForm.denumire.trim()) return;
    const den = cerereForm.denumire.trim();
    const cant = Number(cerereForm.cantitate)||0;
    const um = (cerereForm.um||'buc').trim();
    const aziL = new Date().toISOString().slice(0,10);
    const laFel = (a,b) => normalizeSearchLocal(a)===normalizeSearchLocal(b);
    const inDraft = cerereDraft.find((x)=> laFel(x.denumire, den) && (x.um||'')===um);
    const inTrimise = !inDraft ? cereriAici.find((c)=> c.data===aziL && c.status==='Cerută' && laFel(c.denumire, den) && (c.um||'')===um) : null;
    const existent = inDraft || inTrimise;
    if (existent) {
      const unde = inDraft ? 'pe lista de trimis' : 'cerut azi';
      const linieNoua = window.confirm(`„${den}" e deja ${unde} pe acest șantier (${existent.cantitate} ${existent.um}).\n\n• OK = adaugă o LINIE NOUĂ separată (${cant} ${um})\n• Anulează = ADUNĂ ${cant} ${um} la linia existentă (total ${(Number(existent.cantitate)||0)+cant} ${um})`);
      if (linieNoua) {
        setCerereDraft((prev)=>[...prev, { key: uid(), denumire: den, cantitate: cant, um }]);
      } else if (inDraft) {
        setCerereDraft((prev)=>prev.map((x)=> x.key===inDraft.key ? {...x, cantitate:(Number(x.cantitate)||0)+cant} : x));
      } else {
        const next = cereriSantier.map((c)=> c.id===inTrimise.id ? {...c, cantitate:(Number(c.cantitate)||0)+cant} : c);
        setCereriSantier(next); persist('cereriSantier', next);
      }
      setCerereForm({ denumire:'', cantitate:1, um:'buc' });
      return;
    }
    setCerereDraft((prev)=>[...prev, { key: uid(), denumire: den, cantitate: cant, um }]);
    setCerereForm({ denumire:'', cantitate:1, um:'buc' });
  };
  const scoateDinLista = (key) => setCerereDraft((prev)=>prev.filter((x)=>x.key!==key));
  // trimite toată lista ca O SINGURĂ cerere (un grup) → o singură notificare
  const trimiteCerere = () => {
    // dacă a scris ceva în câmp fără să apese „Adaugă", îl includem — cu aceeași verificare de duplicat
    let lista = cerereDraft.slice();
    if (cerereForm.denumire.trim()) {
      const den = cerereForm.denumire.trim();
      const cant = Number(cerereForm.cantitate)||0;
      const um = (cerereForm.um||'buc').trim();
      const laFel = (a,b)=>normalizeSearchLocal(a)===normalizeSearchLocal(b);
      const idx = lista.findIndex((x)=> laFel(x.denumire, den) && (x.um||'')===um);
      if (idx >= 0) {
        const linieNoua = window.confirm(`„${den}" e deja pe lista de trimis (${lista[idx].cantitate} ${lista[idx].um}).\n\n• OK = linie nouă separată\n• Anulează = adună ${cant} ${um} la linia existentă`);
        if (linieNoua) lista = [...lista, { key: uid(), denumire: den, cantitate: cant, um }];
        else lista = lista.map((x,i)=> i===idx ? {...x, cantitate:(Number(x.cantitate)||0)+cant} : x);
      } else {
        lista = [...lista, { key: uid(), denumire: den, cantitate: cant, um }];
      }
    }
    if (!lista.length) return;
    const grupId = uid();
    const data = new Date().toISOString().slice(0,10);
    const noi = lista.map((d)=>({ id: uid(), grupId, santierId, denumire: d.denumire, cantitate: d.cantitate, um: d.um, data, status:'Cerută', cerutDe: currentUser?.nume || '', cerutId: currentUser?.id || '' }));
    const next = [...cereriSantier, ...noi];
    setCereriSantier(next); persist('cereriSantier', next);
    setCerereDraft([]); setCerereForm({ denumire:'', cantitate:1, um:'buc' });
    noi.forEach((d)=>{ if (onCerereMaterial) onCerereMaterial(d.denumire, d.um, d.cantitate, santierNume); });
    const rezumat = noi.length===1
      ? `${noi[0].cantitate} ${noi[0].um} ${noi[0].denumire}`
      : `${noi.length} materiale: ` + noi.slice(0,3).map((x)=>`${x.denumire} (${x.cantitate} ${x.um})`).join(', ') + (noi.length>3?` +${noi.length-3}`:'');
    notifica('manageri', { title: noi.length===1 ? 'Cerere de material' : 'Cerere de materiale', body:`${rezumat} — ${santierNume || 'șantier'} (${currentUser?.nume || ''}).`, tag:'cerere-'+grupId }, currentUser?.id);
  };
  const delCerere = (id) => { if (!window.confirm('Ștergi definitiv această cerere de materiale?')) return; const next = cereriSantier.filter((c)=>c.id!==id); setCereriSantier(next); persist('cereriSantier', next); };
  const setCerereStatus = (id, status) => {
    const c = cereriSantier.find((x)=>x.id===id);
    const next = cereriSantier.map((x)=>x.id===id?{...x, status}:x);
    setCereriSantier(next); persist('cereriSantier', next);
    // anunță solicitantul (dacă îl știm) că materialul a fost aprobat/respins
    if (c && c.cerutId && (status==='Aprobată' || status==='Respinsă')) {
      notifica(c.cerutId, { title: status==='Aprobată' ? 'Material aprobat ✓' : 'Material respins', body:`${c.denumire} (${c.cantitate} ${c.um}) — ${santierNume || 'șantier'}: ${status.toLowerCase()}.`, tag:'cerere-raspuns' }, currentUser?.id);
    }
  };
  // acțiune pe tot grupul (aprobă/respinge toate materialele rămase în așteptare)
  const setGrupStatus = (items, status) => {
    const ids = new Set(items.filter((c)=>c.status==='Cerută').map((c)=>c.id));
    if (!ids.size) return;
    const next = cereriSantier.map((c)=> ids.has(c.id) ? {...c, status} : c);
    setCereriSantier(next); persist('cereriSantier', next);
    const prima = items.find((c)=>c.cerutId);
    if (prima && prima.cerutId && (status==='Aprobată' || status==='Respinsă')) {
      notifica(prima.cerutId, { title: status==='Aprobată' ? 'Cerere aprobată ✓' : 'Cerere respinsă', body:`${ids.size} ${ids.size===1?'material':'materiale'} — ${santierNume || 'șantier'}: ${status.toLowerCase()}.`, tag:'cerere-raspuns' }, currentUser?.id);
    }
  };
  const marcheazaLivrata = (cerere) => {
    const next = cereriSantier.map((c)=>c.id===cerere.id?{...c, status:'Livrată'}:c);
    setCereriSantier(next); persist('cereriSantier', next);
    const miscare = { id: uid(), santierId, denumire: cerere.denumire, um: cerere.um, tip:'intrare', cantitate: cerere.cantitate, data: new Date().toISOString().slice(0,10), nota:'Din cerere livrată' };
    const nextMiscari = [miscare, ...miscariSantier];
    setMiscariSantier(nextMiscari); persist('miscariSantier', nextMiscari);
  };

  const azi = new Date();
  const extrasLa = `${String(azi.getDate()).padStart(2,'0')}/${String(azi.getMonth()+1).padStart(2,'0')}/${azi.getFullYear()}`;

  const exportCereriExcel = () => {
    const rows = cereriAici.map((c)=>({ 'Data': c.data, 'Material': c.denumire, 'Cantitate': c.cantitate, 'U.M.': c.um, 'Status': c.status }));
    const sheetRows = rows.length ? rows : [{ 'Data':'', 'Material':'Nicio cerere înregistrată.', 'Cantitate':'', 'U.M.':'', 'Status':'' }];
    const headerRows = [
      [company?.nume || 'Firma mea'],
      [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],
      [],
      [`Cerere materiale — ${santierNume}`],
      [`Extras la: ${extrasLa}`],
      [],
    ];
    const ws = XLSX.utils.aoa_to_sheet(headerRows);
    XLSX.utils.sheet_add_json(ws, sheetRows, { origin: -1 });
    ws['!cols'] = [{wch:12},{wch:35},{wch:11},{wch:8},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Cerere materiale');
    XLSX.writeFile(wb, `cerere_materiale_${santierNume.replace(/\s+/g,'_')}.xlsx`);
  };

  const exportCererePDF = () => {
    const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const rows = cereriAici.map((c,i)=>`
      <tr><td>${i+1}</td><td style="text-align:left">${esc(c.denumire)}</td><td>${esc(c.cantitate)}</td><td>${esc(c.um)}</td><td>${esc(c.data)}</td><td>${esc(c.status)}</td></tr>`).join('');
    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Cerere materiale</title><style>
      * { box-sizing:border-box; } body { margin:0; font-family:Arial, sans-serif; color:#1a1a1a; }
      .page { width:190mm; margin:0 auto; padding:14mm; }
      .header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8mm; }
      .logo { height:30px; }
      .title-block { text-align:right; }
      .title { font-size:18px; font-weight:700; }
      table { width:100%; border-collapse:collapse; font-size:11px; margin-top:6mm; }
      th { text-align:center; border:1px solid #999; padding:2mm; font-size:10px; text-transform:uppercase; background:#f2f2f2; }
      td { text-align:center; border:1px solid #ccc; padding:2mm; }
      .sign { display:flex; justify-content:space-between; margin-top:20mm; font-size:11px; }
      .sign-line { margin-top:14mm; border-top:1px solid #999; width:70%; }
    </style></head><body>${PRINT_TOOLBAR}
      <div class="page">
        <div class="header-row">
          <img class="logo" src="${window.location.origin}/logo.png" alt="Logo" />
          <div class="title-block">
            <div class="title">CERERE MATERIALE</div>
            <div style="font-size:11px;color:#555;margin-top:2mm;">Șantier: ${esc(santierNume)}</div>
            <div style="font-size:11px;color:#555;">Data: ${esc(extrasLa)}</div>
          </div>
        </div>
        <table>
          <thead><tr><th>Nr.</th><th style="text-align:left">Material</th><th>Cantitate</th><th>U.M.</th><th>Data cerere</th><th>Status</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">Nicio cerere înregistrată.</td></tr>'}</tbody>
        </table>
        <div class="sign">
          <div>Solicitat de:<div class="sign-line"></div></div>
          <div>Aprobat de (manager):<div class="sign-line"></div></div>
        </div>
      </div>
    </body></html>`;
    const w = window.open('', '_blank');
    if (!w) { window.alert('Browserul a blocat fereastra nouă. Permite pop-up-urile și încearcă din nou.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.focus();
  };

  // --- Stoc materiale la șantier (calculat din mișcări) + consum ---
  const miscariAici = miscariSantier.filter((m)=>m.santierId===santierId);
  const stocPeMaterial = {};
  miscariAici.forEach((m)=>{
    if (!stocPeMaterial[m.denumire]) stocPeMaterial[m.denumire] = { denumire:m.denumire, um:m.um, stoc:0 };
    stocPeMaterial[m.denumire].stoc += (m.tip==='intrare' ? 1 : -1) * (Number(m.cantitate)||0);
  });
  const stocList = Object.values(stocPeMaterial);
  const [stocShowAllSantier, setStocShowAllSantier] = useState(false);
  const [editStocState, setEditStocState] = useState(null);
  const [editStocValue, setEditStocValue] = useState('');
  const [consumState, setConsumState] = useState(null);
  const confirmEditStoc = (m) => {
    const nou = Number(editStocValue) || 0;
    const diff = nou - m.stoc;
    setEditStocState(null);
    if (diff === 0) return;
    const miscare = { id: uid(), santierId, denumire: m.denumire, um: m.um, tip: diff > 0 ? 'intrare' : 'iesire', cantitate: Math.abs(diff), data: new Date().toISOString().slice(0,10), nota:'Corecție manuală' };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next);
  };
  const confirmConsum = (denumire, um, cantitate) => {
    const miscare = { id: uid(), santierId, denumire, um, tip:'iesire', cantitate: Number(cantitate)||0, data: new Date().toISOString().slice(0,10), nota:'Consum șantier' };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next); setConsumState(null);
    notifica('manageri', { title:'Consum material', body:`${currentUser?.nume || 'Un coleg'} a consumat ${Number(cantitate)||0} ${um} ${denumire} la ${santierNume || 'șantier'}.`, tag:'stoc-'+santierId }, currentUser?.id);
  };
  const [returnMatState, setReturnMatState] = useState(null);
  const [returnMatQty, setReturnMatQty] = useState('');
  const confirmReturnMat = (m, dest) => {
    const cant = Number(returnMatQty) || 0;
    if (cant <= 0) { setReturnMatState(null); return; }
    const miscare = { id: uid(), santierId, denumire: m.denumire, um: m.um, tip:'iesire', cantitate: cant, data: new Date().toISOString().slice(0,10), nota:`Trimis la ${dest}` };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next); setReturnMatState(null); setReturnMatQty('');
    notifica('manageri', { title:'Material trimis', body:`${currentUser?.nume || 'Un coleg'} a trimis ${cant} ${m.um} ${m.denumire} la ${dest} (de la ${santierNume || 'șantier'}).`, tag:'stoc-'+santierId }, currentUser?.id);
  };

  const consumPeMaterial = {};
  miscariAici.filter((m)=>m.tip==='iesire' && !String(m.nota||'').startsWith('Trimis la')).forEach((m)=>{
    if (!consumPeMaterial[m.denumire]) consumPeMaterial[m.denumire] = { denumire:m.denumire, um:m.um, cantitate:0 };
    consumPeMaterial[m.denumire].cantitate += Number(m.cantitate)||0;
  });
  const consumList = Object.values(consumPeMaterial);
  const trimiteConsumInDeviz = () => {
    if (consumList.length === 0) return;
    onExportToDeviz(consumList, santierNume);
  };

  const cerereSearching = cerereFilter.trim() !== '' || cerereDataFiltru !== '';
  const cereriFiltrate = cereriAici.filter((c) => {
    if (cerereDataFiltru && c.data !== cerereDataFiltru) return false;
    if (cerereFilter.trim() && !seCauta(`${c.denumire||''} ${c.cantitate||''} ${c.um||''} ${c.status||''} ${c.cerutNume||''} ${c.data||''}`, cerereFilter)) return false;
    return true;
  });
  const cereriPeZi = {};
  cereriFiltrate.forEach((c) => {
    if (!cereriPeZi[c.data]) cereriPeZi[c.data] = [];
    cereriPeZi[c.data].push(c);
  });
  const ziledisponibile = Object.keys(cereriPeZi).sort((a,b)=> b.localeCompare(a));
  const cereriShow = cerereSearching || cerereShowAll;
  // grupează cererile dintr-o zi după grupId (cererile mai vechi, fără grupId, rămân individuale)
  const grupeazaCereri = (items) => {
    const map = {}; const ordine = [];
    items.forEach((c)=>{ const g = c.grupId || c.id; if(!map[g]){ map[g]=[]; ordine.push(g); } map[g].push(c); });
    return ordine.map((g)=>({ grupId:g, items:map[g] }));
  };
  const culoareStatus = (s) => s==='Livrată'?'#4CAF7D':s==='Aprobată'?'#2E8BD1':s==='Respinsă'?'#E05252':'#E9A23B';

  return (
    <div className="space-y-4">
      <div className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="flex items-center justify-between mb-2">
          <div className="text-sm font-medium" style={{ color:'var(--text)' }}>📥 Cerere materiale</div>
          {currentUser?.rol === 'Manager' && (
          <div className="flex gap-1.5">
            <button onClick={exportCereriExcel} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>📊 Excel</button>
            <button onClick={exportCererePDF} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>🖨 PDF</button>
          </div>
          )}
        </div>
        <div className="mb-3">
          <input list="materiale-catalog-santier" placeholder="Material (ex: Cablu CYY-F 3x2.5)" value={cerereForm.denumire} onChange={(e)=>setCerereForm({...cerereForm, denumire:e.target.value})} onKeyDown={(e)=>{ if(e.key==='Enter') adaugaInLista(); }} className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
          <datalist id="materiale-catalog-santier">{materials.filter((m)=>!m.arhivat).map((m)=><option key={m.id} value={m.denumire} />)}</datalist>
          <div className="flex gap-2">
            <input type="number" value={cerereForm.cantitate} onChange={(e)=>setCerereForm({...cerereForm, cantitate:e.target.value})} className="w-20 rounded-lg px-3 py-2 text-sm outline-none text-center" style={inputStyle} />
            <input placeholder="UM" value={cerereForm.um} onChange={(e)=>setCerereForm({...cerereForm, um:e.target.value})} className="w-20 rounded-lg px-3 py-2 text-sm outline-none text-center" style={inputStyle} />
            <button onClick={adaugaInLista} className="flex-1 text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid var(--border)' }}>➕ Adaugă în listă</button>
          </div>
          {cerereDraft.length > 0 && (
            <div className="mt-2 rounded-lg p-2" style={{ background:'var(--panel2)', border:'1px dashed var(--border)' }}>
              <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'var(--muted2)' }}>De trimis ({cerereDraft.length})</div>
              <div className="space-y-1">
                {cerereDraft.map((d)=>(
                  <div key={d.key} className="flex items-center justify-between text-xs px-2 py-1 rounded" style={{ background:'var(--panel)' }}>
                    <span style={{ color:'var(--text)' }}>{d.denumire} — {d.cantitate} {d.um}</span>
                    <button onClick={()=>scoateDinLista(d.key)} style={{ color:'#E05252' }}><Icon size={12}>✕</Icon></button>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={trimiteCerere} disabled={cerereDraft.length===0 && !cerereForm.denumire.trim()} className="w-full mt-2 text-sm px-4 py-2 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>📤 Trimite cererea{cerereDraft.length>0 ? ` (${cerereDraft.length})` : ''}</button>
        </div>

        <div className="flex items-center gap-1.5 mb-2 flex-wrap">
          <input placeholder="🔍 Caută (ex: cablu 3x1,5)" value={cerereFilter} onChange={(e)=>setCerereFilter(e.target.value)} className="rounded-lg px-2.5 py-1.5 text-xs outline-none flex-1 min-w-[100px]" style={inputStyle} />
          <RoCalendarPicker value={cerereDataFiltru} onChange={setCerereDataFiltru} />
          {!cerereSearching && (
            <button onClick={()=>setCerereShowAll(!cerereShowAll)} className="text-xs px-2.5 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>{cerereShowAll ? 'Ascunde' : 'Vezi toate materialele'}</button>
          )}
        </div>

        {cereriAici.length===0 ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Nicio cerere.</div>
        ) : !cereriShow ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Caută un material sau o dată, sau apasă „Vezi toate materialele".</div>
        ) : ziledisponibile.length === 0 ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun rezultat.</div>
        ) : (
          <div className="space-y-3">
            {ziledisponibile.map((zi)=>(
              <div key={zi}>
                <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'var(--muted2)' }}>{zi} ({cereriPeZi[zi].length})</div>
                <div className="space-y-2">
                  {grupeazaCereri(cereriPeZi[zi]).map((grup)=>{
                    const items = grup.items;
                    const single = items.length===1;
                    const auInAsteptare = items.some((c)=>c.status==='Cerută');
                    const cerutDe = (items.find((c)=>c.cerutDe)||{}).cerutDe;
                    const isMgr = currentUser?.rol === 'Manager';
                    const linie = (c)=>(
                      <div key={c.id} className="flex items-center justify-between text-xs px-2 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                        <span style={{ color:'var(--text)' }}>{c.denumire} — {c.cantitate} {c.um}</span>
                        <div className="flex items-center gap-2">
                          <span style={{ color: culoareStatus(c.status) }}>{c.status}</span>
                          {c.status==='Cerută' && isMgr && (
                            <>
                              <button onClick={()=>setCerereStatus(c.id,'Aprobată')} className="px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#2E8BD1' }}>✓ Aprobă</button>
                              <button onClick={()=>setCerereStatus(c.id,'Respinsă')} className="px-2 py-0.5 rounded" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid #E0525266' }}>✕ Respinge</button>
                            </>
                          )}
                          {c.status==='Cerută' && !isMgr && (
                            <span className="text-xs" style={{ color:'var(--muted2)' }}>Așteaptă aprobare</span>
                          )}
                          {c.status==='Aprobată' && <button onClick={()=>marcheazaLivrata(c)} className="px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#4CAF7D' }}>📦 Livrată</button>}
                          <button onClick={()=>delCerere(c.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                        </div>
                      </div>
                    );
                    if (single) return <div key={grup.grupId}>{linie(items[0])}</div>;
                    return (
                      <div key={grup.grupId} className="rounded-lg p-2" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[11px] font-semibold" style={{ color:'var(--muted)' }}>📋 Cerere · {items.length} materiale{cerutDe ? ` · ${cerutDe}` : ''}</span>
                          {isMgr && auInAsteptare && (
                            <div className="flex gap-1.5">
                              <button onClick={()=>setGrupStatus(items,'Aprobată')} className="text-[11px] px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#2E8BD1' }}>✓ Aprobă toate</button>
                              <button onClick={()=>setGrupStatus(items,'Respinsă')} className="text-[11px] px-2 py-0.5 rounded" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid #E0525266' }}>✕ Respinge toate</button>
                            </div>
                          )}
                        </div>
                        <div className="space-y-1">{items.map((c)=>linie(c))}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="text-sm font-medium" style={{ color:'var(--text)' }}>📦 Stoc materiale la șantier</div>
          <div className="flex items-center gap-1.5">
            {currentUser?.rol === 'Manager' && consumList.length > 0 && <button onClick={trimiteConsumInDeviz} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#14181C', background:'#2E8BD1' }}>🧾 Exportă consum în Deviz</button>}
            {stocList.length > 0 && <button onClick={()=>setStocShowAllSantier(!stocShowAllSantier)} className="text-xs px-2.5 py-1 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>{stocShowAllSantier ? 'Ascunde' : '👁 Vezi tot stocul'}</button>}
          </div>
        </div>
        {stocList.length===0 ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun material adus încă la șantier.</div>
        ) : !stocShowAllSantier ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Apasă „Vezi tot stocul" ca să vezi lista.</div>
        ) : (
          <div className="space-y-1">
            {stocList.map((m)=>(
              <div key={m.denumire} className="text-xs px-2 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                <div className="flex items-center justify-between gap-2">
                  <span style={{ color:'var(--text)' }}>{m.denumire} <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{m.stoc} {m.um}</span></span>
                  {editStocState===m.denumire ? (
                    <div className="flex items-center gap-1">
                      <input type="number" value={editStocValue} onChange={(e)=>setEditStocValue(e.target.value)} className="w-16 rounded-lg px-2 py-1 text-xs outline-none" style={inputStyle} />
                      <button onClick={()=>confirmEditStoc(m)} className="px-2 py-1 rounded-lg" style={{ color:'#14181C', background:'#4CAF7D' }}>✓</button>
                      <button onClick={()=>setEditStocState(null)} className="px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)' }}>✕</button>
                    </div>
                  ) : consumState===m.denumire ? (
                    <MoveInput tip="iesire" onConfirm={(cant)=>confirmConsum(m.denumire, m.um, cant)} onCancel={()=>setConsumState(null)} />
                  ) : returnMatState!==m.denumire ? (
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={()=>{ setEditStocState(m.denumire); setEditStocValue(m.stoc); }} className="px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)' }}>✎</button>
                      <button onClick={()=>setConsumState(m.denumire)} className="px-2 py-1 rounded-lg" style={{ color:'#E05252', background:'var(--panel)' }}>− Consum</button>
                      <button onClick={()=>{ setReturnMatState(m.denumire); setReturnMatQty(m.stoc); }} className="px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)' }}>↩ Trimite</button>
                    </div>
                  ) : null}
                </div>
                {returnMatState===m.denumire && (
                  <div className="flex items-center gap-1 flex-wrap mt-2 pt-2" style={{ borderTop:'1px solid var(--border)' }}>
                    <span className="text-[10px]" style={{ color:'var(--muted)' }}>Trimite</span>
                    <input type="number" value={returnMatQty} onChange={(e)=>setReturnMatQty(e.target.value)} className="w-14 rounded-lg px-2 py-1 text-xs outline-none text-center" style={inputStyle} />
                    <span className="text-[10px]" style={{ color:'var(--muted)' }}>{m.um} la:</span>
                    <button onClick={()=>confirmReturnMat(m,'Depozit')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏠 Depozit</button>
                    <button onClick={()=>confirmReturnMat(m,'Alt șantier')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Alt șantier</button>
                    <button onClick={()=>confirmReturnMat(m,'Furnizor')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#E9A23B' }}>🏭 Furnizor</button>
                    <button onClick={()=>setReturnMatState(null)} className="px-2 py-1" style={{ color:'var(--muted)' }}>Anulează</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function SantierForm({ initial, onCancel, onSave, clients, structuraSantier, setStructuraSantier, persist }) {
  const _maine = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const _azi = new Date().toISOString().slice(0,10);
  const [form, setForm] = useState(initial || { id: uid(), nume:'', adresa:'', status:'Activ', echipa:[], modFacturare:'orar', tipFacturare:'orar', tarifOrar:75, materialeSursa:'noastre', benefNume:'', benefInfo:'', benefSemnatar:'', contract:'', obiectiv:'', lucrare:'Instalații electrice interioare', descriereLucrari:'', dataCreare: _azi, raportDeLa: _maine });
  const setMod = (m) => {
    const patch = { modFacturare: m };
    if (m==='orar' || m==='orar_lucrari' || m==='lucrare_mica') patch.tipFacturare = 'orar';
    else { patch.tipFacturare = 'pozitie'; patch.materialeSursa = (m==='pozitie_client' || m==='real_executat') ? 'client' : 'noastre'; }
    setForm({ ...form, ...patch });
  };
  const modCurent = form.modFacturare || (form.tipFacturare==='pozitie' ? (form.materialeSursa==='client'?'pozitie_client':'pozitie_propriu') : 'orar');
  const [showDeviz, setShowDeviz] = useState(false);
  const [showStructura, setShowStructura] = useState(false);
  const [users, setUsers] = useState([]);
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };

  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setUsers((data.users || []).filter((u)=>u.rol==='Electrician'))).catch(()=>setUsers([]));
  }, []);

  const echipa = echipaNormalizata(form.echipa);
  const echipaIds = echipa.map((e)=>e.userId);
  const toggleEchipa = (userId) => {
    const next = echipaIds.includes(userId) ? echipa.filter((e)=>e.userId!==userId) : [...echipa, { userId, status:'activ' }];
    setForm({...form, echipa: next});
  };
  const setEchipaStatus = (userId, status) => {
    const next = echipa.map((e)=> e.userId===userId ? {...e, status, dataModificare: new Date().toISOString().slice(0,10)} : e);
    setForm({...form, echipa: next});
  };

  return (
    <div className="rounded-xl p-4 mb-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
      <div className="space-y-2 mb-2">
        <input placeholder="Denumire șantier (ex: Bloc Florești, Str. Traian)" value={form.nume} onChange={(e)=>setForm({...form, nume:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <input placeholder="Adresă (opțional)" value={form.adresa} onChange={(e)=>setForm({...form, adresa:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <div className="flex gap-2">
          {SANTIER_STATUSES.map((s)=>(
            <button key={s} onClick={()=>setForm({...form, status:s, statusSchimbatLa: new Date().toISOString().slice(0,10)})} className="text-xs px-2.5 py-1.5 rounded-lg"
              style={{ color: form.status===s?'#14181C':'var(--muted)', background: form.status===s?'#2E8BD1':'var(--panel2)' }}>{s}</button>
          ))}
        </div>

        <div className="rounded-lg p-2.5" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
          <div className="text-xs mb-1.5" style={{ color:'var(--muted)' }}>📋 Raport zilnic cerut începând de:</div>
          <div className="flex items-center gap-2 flex-wrap">
            <button type="button" onClick={()=>setForm({...form, raportDeLa:_azi})} className="text-xs px-3 py-1.5 rounded-lg" style={{ color: form.raportDeLa===_azi?'#14181C':'var(--muted)', background: form.raportDeLa===_azi?'#2E8BD1':'var(--panel)' }}>Azi</button>
            <button type="button" onClick={()=>setForm({...form, raportDeLa:_maine})} className="text-xs px-3 py-1.5 rounded-lg" style={{ color: form.raportDeLa===_maine?'#14181C':'var(--muted)', background: form.raportDeLa===_maine?'#2E8BD1':'var(--panel)' }}>De mâine</button>
            <span className="text-[11px]" style={{ color:'var(--muted2)' }}>sau o dată:</span>
            <RoCalendarPicker value={form.raportDeLa||''} onChange={(v)=>setForm({...form, raportDeLa:v})} />
          </div>
          <div className="text-[11px] mt-1" style={{ color:'var(--muted2)' }}>Până la data asta, echipa NU primește memento de raport. Implicit: de mâine (a doua zi de la înființare).</div>
        </div>

        <div>
          <div className="text-xs mb-1.5" style={{ color:'var(--muted)' }}>📝 Descrierea lucrărilor de efectuat (o vede echipa pe șantier):</div>
          <textarea placeholder={"Ex: Tras cabluri și montat prize la parter, verificat tablou, montat corpuri de iluminat pe hol."} value={form.descriereLucrari||''} onChange={(e)=>setForm({...form, descriereLucrari:e.target.value})} rows={3} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        </div>
        <div>
          <div className="text-xs mb-1.5" style={{ color:'var(--muted)' }}>Echipă asignată (doar aceștia pot accesa șantierul; Activ/Pauză controlează dacă lucrează acolo mâine):</div>
          {users.length === 0 ? (
            <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun electrician înregistrat încă.</div>
          ) : (
            <>
              {echipa.length > 0 && (
                <div className="space-y-1 mb-2">
                  {echipa.map((e)=>{
                    const u = users.find((x)=>x.id===e.userId);
                    return (
                      <div key={e.userId} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                        <span style={{ color:'var(--text)' }}>👷 {u?.nume || '(cont șters)'}</span>
                        <div className="flex items-center gap-1">
                          <button onClick={()=>setEchipaStatus(e.userId,'activ')} className="px-2 py-0.5 rounded" style={{ color: e.status==='activ'?'#14181C':'var(--muted)', background: e.status==='activ'?'#4CAF7D':'var(--panel)' }}>Activ</button>

function PersonHoursEditor({ persoane, setPersoane, defaultInceput, defaultSfarsit, echipaPermisa, concedii, data }) {
  const [users, setUsers] = useState([]);

  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setUsers(data.users || [])).catch(()=>setUsers([]));
  }, []);

  const update = (id, f, v) => setPersoane(persoane.map((p)=> p.id===id ? {...p, [f]:v} : p));
  const remove = (id) => setPersoane(persoane.filter((p)=>p.id!==id));

  const numeDejaAdaugate = new Set(persoane.map((p)=>p.nume));
  const iconFor = (rol) => ROLES.find((r)=>r.id===rol)?.icon || '👤';
  const usersEchipa = (echipaPermisa && echipaPermisa.length > 0) ? users.filter((u)=>echipaPermisa.includes(u.id)) : [];
  const peConcediu = (u) => concediuActiv(concedii, { userId: u.id, nume: u.nume }, data);
  const disponibili = usersEchipa.filter((u)=>!numeDejaAdaugate.has(u.nume) && !peConcediu(u));
  const inConcediu = usersEchipa.filter((u)=>!numeDejaAdaugate.has(u.nume) && peConcediu(u));

  const addPerson = (u) => {
    if (peConcediu(u)) { window.alert(`${u.nume} este în concediu aprobat în ziua asta și nu poate fi pontat.`); return; }
    setPersoane([...persoane, { id: uid(), nume: u.nume, oraInceput: defaultInceput || '08:00', oraSfarsit: defaultSfarsit || '17:00' }]);
  };

  return (
    <div className="space-y-2">
      {persoane.length > 0 && (
      <div className="space-y-1.5">
      {persoane.map((p)=>{
        const mins = personMinutes(p);
        return (
          <div key={p.id} className="rounded-lg px-2.5 py-2" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
            <div className="flex items-center justify-between gap-2 mb-1.5">
              <input value={p.nume} onChange={(e)=>update(p.id,'nume',e.target.value)} placeholder="Nume persoană" className="bg-transparent outline-none text-sm font-medium flex-1 min-w-0" style={{ color:'var(--text)' }} />
              <span className="text-sm shrink-0" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(mins)} h</span>
              <button onClick={()=>remove(p.id)} className="shrink-0 opacity-60" style={{ color:'#E05252' }}><Icon>🗑</Icon></button>
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              <span className="text-[11px] flex items-center gap-1.5" style={{ color:'var(--muted)' }}>Început <RoTimePicker value={p.oraInceput || defaultInceput || '08:00'} onChange={(v)=>update(p.id,'oraInceput',v)} /></span>
              <span className="text-[11px] flex items-center gap-1.5" style={{ color:'var(--muted)' }}>Sfârșit <RoTimePicker value={p.oraSfarsit || defaultSfarsit || '17:00'} onChange={(v)=>update(p.id,'oraSfarsit',v)} /></span>
            </div>
            {concediuActiv(concedii, { nume: p.nume }, data) && <div className="text-[11px] mt-1.5" style={{ color:'#E9A23B' }}>🏖 {p.nume} este în concediu aprobat în această zi — nu ar trebui pontat(ă). Scoate-l din raport cu 🗑.</div>}
          </div>
        );
      })}
      </div>
      )}

      <div>
        <div className="text-xs mb-1.5" style={{ color:'var(--muted)' }}>Apasă pe nume ca să adaugi persoana la raport:</div>
        {usersEchipa.length === 0 ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Niciun electrician asignat la acest șantier — cere unui Manager să asigneze echipa.</div>
        ) : (disponibili.length === 0 && inConcediu.length === 0) ? (
          <div className="text-xs" style={{ color:'var(--muted2)' }}>Toți cei asignați sunt deja adăugați.</div>
        ) : (
          <div className="flex flex-wrap gap-1.5">
            {disponibili.map((u)=>(
              <button key={u.id} onClick={()=>addPerson(u)} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid var(--border)' }}>
                <Icon>+</Icon> {iconFor(u.rol)} {u.nume}
              </button>
            ))}
            {inConcediu.map((u)=>(
              <span key={u.id} title="În concediu aprobat — nu poate fi pontat" className="text-xs px-2.5 py-1.5 rounded-lg" style={{ color:'#E9A23B', background:'var(--panel)', border:'1px dashed #E9A23B66' }}>🏖 {u.nume} · concediu</span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// Câmp cu autocomplete: tastezi orice bucată din text și îți arată sugestii care conțin ce ai scris (nu doar început).
function AutocompleteInput({ value, onChange, onPick, options, placeholder, minWidth }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [open, setOpen] = useState(false);
  const norm = (s)=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const q = norm(value);
  const matches = q ? (options||[]).filter((o)=>norm(o.label).includes(q)).slice(0,10) : [];
  return (
    <div style={{ position:'relative', flex:1, minWidth: minWidth||'120px' }}>
      <input value={value} onChange={(e)=>{ onChange(e.target.value); setOpen(true); }} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)} placeholder={placeholder} className="w-full rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
      {open && matches.length>0 && (
        <div style={{ position:'absolute', zIndex:60, left:0, right:0, top:'100%', marginTop:2, background:'var(--panel)', border:'1px solid var(--border)', borderRadius:8, maxHeight:200, overflowY:'auto', boxShadow:'0 6px 18px rgba(0,0,0,.45)' }}>
          {matches.map((o)=>(
            <div key={o.key} onMouseDown={(e)=>{ e.preventDefault(); onPick(o); setOpen(false); }} style={{ padding:'8px 10px', fontSize:12, cursor:'pointer', color:'var(--text)', borderBottom:'1px solid var(--border)' }}>
              {o.label}{o.um?<span style={{ color:'var(--muted2)' }}> · {o.um}</span>:null}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MaterialeFolositeEditor({ materialeFolosite, setMaterialeFolosite, materials, materialeLista, materialClient, isManager, pretDinLista }) {
  const clientMat = materialClient || pretDinLista;
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const activeMaterials = (materials || []).filter((m)=>!m.arhivat);
  const norm = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const optiuni = (()=>{
    const seen = new Set(); const out = [];
    (materialeLista || []).forEach((m)=>{ const k=norm(m.denumire); if(m.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'l'+m.id, label:m.denumire, um:m.um }); } });
    activeMaterials.forEach((m)=>{ const k=norm(m.denumire); if(m.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'c'+m.id, label:m.denumire, um:m.um }); } });
    return out;
  })();
  const update = (id, f, v) => setMaterialeFolosite(materialeFolosite.map((m)=> m.id===id ? {...m, [f]:v} : m));
  const pick = (id, o) => setMaterialeFolosite(materialeFolosite.map((m)=> m.id===id ? {...m, denumire:o.label, um:o.um||m.um} : m));
  const remove = (id) => setMaterialeFolosite(materialeFolosite.filter((m)=>m.id!==id));
  const add = () => setMaterialeFolosite([...materialeFolosite, { id: uid(), denumire:'', cantitate:1, um:'buc', sursa: clientMat?'client':'proprie', pret:'' }]);

  return (
    <div>
      <div className="text-sm font-medium mb-1.5" style={{ color:'var(--text)' }}>🧰 Materiale folosite</div>
      <p className="text-xs mb-2" style={{ color:'var(--muted2)' }}>{pretDinLista ? 'Materialul clientului — trece doar cantitatea folosită. Prețul de manoperă îl știe managerul din lista importată.' : materialClient ? (isManager ? 'Materialele clientului — trece cantitatea și prețul unitar convenit.' : 'Materialele clientului — trece doar cantitatea folosită.') : 'Tastează și alege din listă (sugestii din lista importată + gestiune).'}</p>
      {materialeFolosite.length > 0 && (
        <div className="space-y-1 mb-2">
          {materialeFolosite.map((m)=>(
            <div key={m.id} className="flex items-center gap-1.5 flex-wrap rounded-lg px-2 py-1.5" style={{ background:'var(--panel2)' }}>
              <AutocompleteInput value={m.denumire} onChange={(v)=>update(m.id,'denumire',v)} onPick={(o)=>pick(m.id,o)} options={optiuni} placeholder="Material" minWidth="140px" />
              <input type="number" value={m.cantitate} onChange={(e)=>update(m.id,'cantitate',e.target.value)} placeholder="Cant." className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-16" style={inputStyle} />
              <input value={m.um} onChange={(e)=>update(m.id,'um',e.target.value)} placeholder="UM" className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-14" style={inputStyle} />
              {materialClient && !pretDinLista && isManager && <input type="number" value={m.pret||''} onChange={(e)=>update(m.id,'pret',e.target.value)} placeholder="Preț" className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-16" style={inputStyle} />}
              {!clientMat && (
                <button onClick={()=>update(m.id,'sursa', m.sursa==='proprie'?'client':'proprie')} className="text-[11px] px-2 py-1 rounded-lg font-medium"
                  style={{ color:'#14181C', background: m.sursa==='proprie'?'#2E8BD1':'#E9A23B' }}>
                  {m.sursa==='proprie' ? 'Proprii' : 'Client'}
                </button>
              )}
              <button onClick={()=>remove(m.id)} className="opacity-50 hover:opacity-100" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
            </div>
          ))}
        </div>
      )}
      <button onClick={add} className="flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-lg" style={{ color:'#2E8BD1', background:'var(--panel2)' }}><Icon>+</Icon> Adaugă material folosit</button>
    </div>
  );
}

          {pozitiiExecutate.map((x)=>{
            const poz = pozitii.find((p)=>p.id===x.pozitieId);
            const optiuni = (pozitii||[]).map((p)=>({ key:p.id, label:(p.nrCrt?p.nrCrt+'. ':'')+String(p.denumire), um:p.um, id:p.id }));
            const displayVal = x.cautaText != null ? x.cautaText : (poz ? poz.denumire : '');
            return (
              <div key={x.id} className="flex items-center gap-1.5 flex-wrap rounded-lg px-2 py-1.5" style={{ background:'var(--panel2)' }}>
                <AutocompleteInput value={displayVal} onChange={(v)=>update(x.id,'cautaText',v)} onPick={(o)=>setPozitiiExecutate(pozitiiExecutate.map((y)=> y.id===x.id ? {...y, pozitieId:o.id, cautaText:o.label} : y))} options={optiuni} placeholder="Caută poziția..." minWidth="150px" />
                <input type="number" inputMode="decimal" placeholder="Cant." value={x.cantitate} onChange={(e)=>update(x.id,'cantitate',e.target.value)} className="w-20 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                <span className="text-[11px]" style={{ color:'var(--muted)' }}>{poz?.um || ''}</span>
                <button onClick={()=>remove(x.id)} className="opacity-60" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            );
          })}
        </div>
      )}
      <button onClick={add} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă poziție</button>
    </div>
  );
}

function TipuriLucrariEditor({ tipuriLucrari, setTipuriLucrari }) {
  const update = (id, v) => setTipuriLucrari(tipuriLucrari.map((t)=> t.id===id ? {...t, denumire:v} : t));
  const remove = (id) => setTipuriLucrari(tipuriLucrari.filter((t)=>t.id!==id));
  const add = () => setTipuriLucrari([...tipuriLucrari, { id: uid(), denumire:'' }]);
  return (
    <div>
      <div className="text-sm font-medium mb-1.5" style={{ color:'var(--text)' }}>🔨 Tipuri de lucrări executate</div>
      <p className="text-xs mb-2" style={{ color:'var(--muted2)' }}>Ce lucrări s-au făcut (ex: tras cablu, montaj doze, pozare tub). Adaugă câte rânduri vrei; le poți modifica sau șterge.</p>
      {tipuriLucrari.length > 0 && (
        <div className="space-y-1 mb-2">
          {tipuriLucrari.map((t)=>(
            <div key={t.id} className="flex items-center gap-1.5 rounded-lg px-2 py-1.5" style={{ background:'var(--panel2)' }}>
              <input value={t.denumire} onChange={(e)=>update(t.id, e.target.value)} placeholder="Tip lucrare (ex: tras cablu)" className="flex-1 bg-transparent outline-none text-sm py-1" style={{ color:'var(--text)' }} />
              <button onClick={()=>remove(t.id)} className="opacity-60" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
