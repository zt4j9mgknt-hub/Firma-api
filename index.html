  1. LOGICA ÎNAINTE DE TOATE. Dacă o informație se repetă, se grupează sub un singur titlu.
     Ex.: lucrările apar sub numele omului, o singură dată — nu numele la fiecare rând.
  2. COMPACT. Tot ce ține de o zi și un șantier stă într-un singur loc (un raport pe zi),

  3. SIMPLU ȘI INTUITIV. Fără termeni tehnici. Textele se scriu ca pentru cineva care

  4. FIECARE VEDE CE ÎL PRIVEȘTE. Managerul vede TOT; angajatul doar ce ține de el.
  5. NIMIC NU SE PIERDE. Orice greșeală se poate edita sau șterge; nimic nu se blochează.
  6. DACĂ NU E CLAR — SE ÎNTREABĂ ÎNAINTE, nu se ghicește și nu se reface de zece ori.

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  html, body, #root { height: 100%; }
  /* ===== Temă Zi/Noapte prin variabile. Noapte = implicit; Zi = body[data-theme="zi"]. ===== */
  :root {
    --appbg:#0B0E14; --panel:#1B2127; --panel2:#171C21; --panelA:#20272e; --border:#2A323B;
    --text:#E9E7E2; --muted:#8B93A0; --muted2:#5C6570; --muted1:#B8BFC9;
  }
  body[data-theme="zi"] {
    --appbg:#EEF2F8; --panel:#FFFFFF; --panel2:#F1F4FA; --panelA:#E6EDF8; --border:#DCE3EE;
    --text:#1A2230; --muted:#5B6675; --muted2:#8A94A2; --muted1:#3A4655;
  }
  body { margin:0; background:var(--appbg); font-family:'Inter', sans-serif; transition:background .45s ease; }
  input::placeholder { color:var(--muted2); }
  select { color-scheme: dark; }
  body[data-theme="zi"] select { color-scheme: light; }
  /* ---- Fundal premium pentru toată aplicația: același stil ca la login —
     degrade închis + aură albastră difuză + două linii fine + vinietă. Pe tema Zi, aceeași
     compoziție dar luminoasă, ca textul negru să rămână citibil. ---- */
  .aurora { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:linear-gradient(165deg, #070B12 0%, #0B1522 42%, #0A1928 100%); }
  body[data-theme="zi"] .aurora { background:linear-gradient(165deg, #F4F7FB 0%, #E8EFF7 45%, #DFE9F4 100%); }
  .aurora .b { position:absolute; border-radius:50%; will-change:transform; }
  /* Aura principală — sus-centru, ca să nu spele conținutul din mijloc */
  .aurora .b1 { width:min(150vw, 1100px); height:min(150vw, 1100px); left:50%; top:-6%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(46,139,209,.30) 0%, rgba(46,139,209,.12) 34%, rgba(46,139,209,0) 70%);
    animation:auHalo 9s ease-in-out infinite alternate; }
  body[data-theme="zi"] .aurora .b1 { background:radial-gradient(circle, rgba(46,139,209,.20) 0%, rgba(46,139,209,.08) 36%, rgba(46,139,209,0) 70%); }
  /* Lumină secundară, jos-dreapta, cu verdele din logo */
  .aurora .b2 { width:min(120vw, 820px); height:min(120vw, 820px); right:-24%; bottom:-30%;
    background:radial-gradient(circle, rgba(76,175,125,.14) 0%, rgba(76,175,125,.05) 40%, rgba(76,175,125,0) 70%);
    animation:auHalo2 12s ease-in-out infinite alternate; }
  body[data-theme="zi"] .aurora .b2 { background:radial-gradient(circle, rgba(76,175,125,.14) 0%, rgba(76,175,125,.05) 42%, rgba(76,175,125,0) 70%); }
  .aurora .b3, .aurora .b4 { display:none; }
  /* Vinietă: întunecă discret marginile, ca să iasă conținutul în față */
  .aurora .rim { position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 38%, rgba(0,0,0,0) 42%, rgba(0,0,0,.50) 100%); }
  body[data-theme="zi"] .aurora .rim { background:radial-gradient(120% 90% at 50% 38%, rgba(0,0,0,0) 48%, rgba(70,100,140,.14) 100%); }
  /* Două linii orizontale foarte fine, în culorile logo-ului */
  .aurora .grid { position:absolute; inset:0;
    background-image:linear-gradient(90deg, transparent, rgba(46,139,209,.26), transparent), linear-gradient(90deg, transparent, rgba(76,175,125,.18), transparent);
    background-size:100% 1px, 100% 1px; background-position:0 22%, 0 78%; background-repeat:no-repeat; }
  body[data-theme="zi"] .aurora .grid {
    background-image:linear-gradient(90deg, transparent, rgba(46,139,209,.28), transparent), linear-gradient(90deg, transparent, rgba(76,175,125,.20), transparent); }
  @keyframes auHalo { from { opacity:.7; } to { opacity:1; } }
  @keyframes auHalo2 { from { opacity:.6; transform:scale(.97); } to { opacity:1; transform:scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { .aurora .b { animation:none; } }

  /* ---- Ecran de login: fundal ÎNCHIS premium, cu accent albastru difuz în spatele cardului.
     Rămâne închis indiferent de tema Zi/Noapte, ca logo-ul și cardul să iasă în față. ---- */
  .login-bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:linear-gradient(165deg, #070B12 0%, #0B1522 40%, #0A1928 100%); }
  .login-bg .halo { position:absolute; left:50%; top:44%; width:min(150vw, 980px); height:min(150vw, 980px); transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(46,139,209,.42) 0%, rgba(46,139,209,.17) 32%, rgba(30,90,140,.06) 55%, rgba(46,139,209,0) 72%);
    animation:lgHalo 6s ease-in-out infinite alternate; }
  .login-bg .streak { position:absolute; left:-10%; right:-10%; height:1px; background:linear-gradient(90deg, transparent, rgba(46,139,209,.35), transparent); }
  .login-bg .s1 { top:26%; }
  .login-bg .s2 { top:74%; background:linear-gradient(90deg, transparent, rgba(76,175,125,.24), transparent); }
  .login-bg .vig { position:absolute; inset:0; background:radial-gradient(110% 80% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
  @keyframes lgHalo { from { opacity:.55; transform:translate(-50%,-50%) scale(.96); } to { opacity:1; transform:translate(-50%,-50%) scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .login-bg .halo { animation:none; } }
  /* Pe login, cardul și textele stau pe fundal închis — le ținem deschise chiar și pe tema de Zi */
  .login-card { background:rgba(23,30,39,.92) !important; border:1px solid rgba(255,255,255,.10) !important;
    box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(46,139,209,.14), 0 0 60px rgba(46,139,209,.10) !important;
    backdrop-filter:blur(10px); }
  .login-card .lg-ring::after { background:#171E27; }
  .login-card .lg-title { color:#EDEFF3; }
  .login-card input { background:rgba(255,255,255,.05) !important; border:1px solid rgba(255,255,255,.12) !important; color:#EDEFF3 !important; }
  .login-card input::placeholder { color:#7C8797; }
  @keyframes fl1 { to { transform:translate(8%,6%) scale(1.06); } }
  @keyframes fl2 { to { transform:translate(-7%,-5%) scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .aurora .b { animation:none; } }

  /* ---- Ecran de login: logo cu inel rotitor + puls, ca la aparatura tehnica ---- */
  .lg-wrap { position:relative; width:132px; height:132px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .lg-ring { position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, transparent 0deg, rgba(46,139,209,0) 200deg, #2E8BD1 300deg, #4CAF7D 340deg, transparent 360deg); animation:lgSpin 2.8s linear infinite; }
  .lg-ring::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--panel); }
  .lg-ring2 { position:absolute; inset:10px; border-radius:50%; border:1px solid rgba(46,139,209,.28); animation:lgPulse 2.6s ease-in-out infinite; }
  .lg-glow { position:absolute; inset:-16px; border-radius:50%; background:radial-gradient(circle, rgba(46,139,209,.30) 0%, rgba(46,139,209,0) 68%); animation:lgBreath 3.4s ease-in-out infinite alternate; }
  .lg-logo { position:relative; z-index:2; height:66px; width:auto; filter:drop-shadow(0 3px 10px rgba(0,0,0,.45)); }
  .lg-scan { position:absolute; left:12%; right:12%; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #4CAF7D, transparent); opacity:.75; animation:lgScan 3.2s ease-in-out infinite; z-index:3; }
  .lg-dots { display:flex; gap:5px; justify-content:center; margin-top:2px; }
  .lg-dots i { width:5px; height:5px; border-radius:50%; background:#2E8BD1; opacity:.35; animation:lgDot 1.4s ease-in-out infinite; }
  .lg-dots i:nth-child(2) { animation-delay:.18s; }
  .lg-dots i:nth-child(3) { animation-delay:.36s; }
  .lg-title { font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:2.4px; font-size:14px; color:var(--text); text-align:center; }
  .lg-sub { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#2E8BD1; text-align:center; margin-top:3px; }
  @keyframes lgSpin { to { transform:rotate(360deg); } }
  @keyframes lgPulse { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.06); opacity:1; } }
  @keyframes lgBreath { from { opacity:.45; } to { opacity:1; } }
  @keyframes lgScan { 0% { top:22%; opacity:0; } 20% { opacity:.8; } 50% { top:76%; opacity:.8; } 80% { opacity:0; } 100% { top:22%; opacity:0; } }
  @keyframes lgDot { 0%,100% { opacity:.25; transform:translateY(0); } 50% { opacity:1; transform:translateY(-3px); } }
  /* Bară de încărcare subțire, sub logo */
  .lg-bar { position:relative; width:186px; height:3px; border-radius:3px; margin-top:16px; overflow:hidden; background:rgba(140,170,205,.16); }
  .lg-bar span { position:absolute; top:0; bottom:0; width:42%; border-radius:3px; background:linear-gradient(90deg, rgba(46,139,209,0), #2E8BD1 45%, #4CAF7D 100%); animation:lgBar 1.35s ease-in-out infinite; }
  @keyframes lgBar { 0% { left:-45%; } 100% { left:100%; } }
  @media (prefers-reduced-motion: reduce) { .lg-bar span { animation:none; left:0; width:100%; opacity:.6; } }
  @media (prefers-reduced-motion: reduce) { .lg-ring, .lg-ring2, .lg-glow, .lg-scan, .lg-dots i { animation:none; } }
</style>

// Link către hartă — preferă coordonate GPS exacte (pin precis), altfel caută adresa text.
const mapsUrl = (santier) => {
  if (santier?.lat && santier?.lng) return `https://www.google.com/maps?q=${santier.lat},${santier.lng}`;
  if (santier?.adresa) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(santier.adresa)}`;
  return null;
};
const pretFinal = (it) => (Number(it.pretUnitar) || 0) * (1 + (Number(it.adaos) || 0) / 100);

// Calculează orele lucrate dintr-un interval oră-început/oră-sfârșit, scăzând 1 oră de pauză (program normal).
function calcOreDinInterval(inceput, sfarsit) {
  if (!inceput || !sfarsit) return null;
  const [h1, m1] = inceput.split(':').map(Number);
  const [h2, m2] = sfarsit.split(':').map(Number);
  let minute = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (minute <= 0) minute += 24 * 60;
  minute -= 60; // pauza de masă
  return Math.max(0, minute); // în minute
}
// Acceptă fie un text "8:45", fie un număr vechi (decimal) — și îl transformă în minute întregi.
function oreToMinutes(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return Math.round(v * 60);
  const s = String(v).trim();
  if (s.includes(':')) {
    const [h, m] = s.split(':');
    return (Number(h) || 0) * 60 + (Number(m) || 0);
  }
  const n = Number(s);
  return isNaN(n) ? 0 : Math.round(n * 60);
}
function minutesToHM(total) {
  const t = Math.max(0, Math.round(total || 0));
  const h = Math.floor(t / 60);
  const m = t % 60;
  return `${h}:${String(m).padStart(2, '0')}`;
}
// Minutele lucrate de o persoană: preferă intervalul individual (oră început/sfârșit),
// altfel cade pe câmpul vechi "ore" (compatibilitate cu rapoartele mai vechi).
function personMinutes(p) {
  if (p.oraInceput && p.oraSfarsit) {
    return calcOreDinInterval(p.oraInceput, p.oraSfarsit) || 0;
  }
  return oreToMinutes(p.ore);
}
const calcSubtotal = (items) => items.reduce((s, it) => s + (Number(it.cantitate) || 0) * pretFinal(it), 0);

// Un rând din „Lucrări pe apartamente" poate avea o listă de lucrări (model nou, nested)
// sau o singură lucrare scrisă direct în rând (model vechi). Întoarce mereu o listă uniformă.
function lucrariDinRand(l) {
  if (l && Array.isArray(l.lucrari) && l.lucrari.length) return l.lucrari;
  if (l && (String(l.tipLucrare||'').trim() || (Number(l.cantitate)||0))) return [{ denumire: l.tipLucrare||'', cantitate: l.cantitate||'', um: l.um||'buc' }];
  return [];
}
// ---- CĂUTARE INTELIGENTĂ, folosită peste tot în aplicație ----
// Fără diacritice, virgula = punct, spațiile nu contează, iar mai multe cuvinte înseamnă
// „toate trebuie să apară" (în orice ordine). Așa „cablu 3x1,5" găsește și „3 x 1.5 cablu".
const cautNorm = (x) => String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/,/g,'.').replace(/\s+/g,' ').trim();
function seCauta(text, q) {
  const termeni = cautNorm(q).split(' ').filter(Boolean);
  if (!termeni.length) return true;
  const t = cautNorm(text);
  const c = t.replace(/\s/g,'');
  return termeni.every((w)=> t.includes(w) || c.includes(w.replace(/\s/g,'')));
}

// Contopește două rapoarte din ACEEAȘI ZI, de pe același șantier, într-unul singur.
// Persoanele NU se dublează: dacă apare de două ori, se ia intervalul cel mai larg (nu se adună orele).
function contopesteRapoarte(a, b) {
  const cheiaP = (p)=> String(p && p.nume || '').toLowerCase().trim();
  const pers = new Map();
  [...(a.persoane||[]), ...(b.persoane||[])].forEach((p)=>{
    const k = cheiaP(p); if (!k) return;
    const ex = pers.get(k);
    if (!ex) { pers.set(k, { ...p }); return; }
    const min = (x,y)=> (String(x||'99:99') < String(y||'99:99') ? x : y);
    const max = (x,y)=> (String(x||'00:00') > String(y||'00:00') ? x : y);
    pers.set(k, { ...ex, oraInceput: min(ex.oraInceput, p.oraInceput), oraSfarsit: max(ex.oraSfarsit, p.oraSfarsit) });
  });
  const uneste = (arr1, arr2, cheie) => {
    const out = [], vaz = new Set();
    [...(arr1||[]), ...(arr2||[])].forEach((x)=>{
      const k = cheie(x); if (!k || vaz.has(k)) return;
      vaz.add(k); out.push(x);
    });
    return out;
  };
  // Materialele cu aceeași denumire și unitate se adună la cantitate.
  const mat = [];
  [...(a.materialeFolosite||[]), ...(b.materialeFolosite||[])].forEach((m)=>{
    const k = String(m.denumire||'').toLowerCase().trim() + '|' + String(m.um||'').toLowerCase().trim();
    const ex = mat.find((x)=> String(x.denumire||'').toLowerCase().trim() + '|' + String(x.um||'').toLowerCase().trim() === k);
    if (ex) { ex.cantitate = (Number(ex.cantitate)||0) + (Number(m.cantitate)||0); }
    else mat.push({ ...m, id: m.id || uid() });
  });
  const expl = [a.explicatii, b.explicatii].map((x)=>String(x||'').trim()).filter(Boolean);
  return {
    ...a,
    oraInceput: (String(a.oraInceput||'99:99') < String(b.oraInceput||'99:99')) ? a.oraInceput : b.oraInceput,
    oraSfarsit: (String(a.oraSfarsit||'00:00') > String(b.oraSfarsit||'00:00')) ? a.oraSfarsit : b.oraSfarsit,
    etapaId: a.etapaId || b.etapaId,
    persoane: Array.from(pers.values()),
    tipuriLucrari: uneste(a.tipuriLucrari, b.tipuriLucrari, (t)=>String(t.denumire||'').toLowerCase().trim()),
    materialeFolosite: mat,
    pozitiiExecutate: [...(a.pozitiiExecutate||[]), ...(b.pozitiiExecutate||[])],
    lucrariApartamente: [...(a.lucrariApartamente||[]), ...(b.lucrariApartamente||[])],
    explicatii: [...new Set(expl)].join('\n'),
  };
}

// Normalizează rapoartele vechi (o lucrare per rând) la modelul nou (listă de lucrări per rând).
function normalizeLucrariApart(arr) {
  return (arr || []).map((g) => {

// Concediu APROBAT care acoperă o anumită dată (potrivire după userId sau după nume). Întoarce cererea sau null.

// De la ce dată se cere raport zilnic pe un șantier.
// Prioritate: raportDeLa (ales de manager) → altfel a doua zi de la înființare (dataCreare + 1) → altfel fără restricție (șantiere vechi).
function raportStartPentru(s){
  if (s && s.raportDeLa) return s.raportDeLa;
  if (s && s.dataCreare) { try { const d = new Date(s.dataCreare + 'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); } catch(_) { return null; } }
  return null;
}
// Se cere raport în ziua `azi`? Nu, dacă șantierul e prea nou (înainte de data de start).
function seCereRaport(s, azi){
  const st = raportStartPentru(s);
  if (st && azi < st) return false;
  // Șantier trecut pe „Activ" CHIAR AZI (venea din Pauză) → l-ai pregătit pentru mâine,
  // nu s-a lucrat azi acolo, deci NU se cere raport azi și NU se trimite memento.
  if (s && s.status === 'Activ' && s.statusSchimbatLa === azi) return false;
  return true;
}

// --- Potrivire întrebări (Q&A): găsește un răspuns dat în trecut la o întrebare similară ca formă/conținut. ---
const STOPWORDS_QA = new Set(['si','sa','la','de','pe','un','o','in','cu','ce','sau','este','sunt','are','am','ai','nu','da','se','ca','al','ale','a','pt','pentru','din','pana','pot','poate','cum','care','pai','mai','ma','mi','te','ti','ne','va','lor','lui','ei','el','ea','asta','asa','fi','fie','daca','dar','ar','trebuie','face','facem','fac']);
function normalizaQA(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function tokeniQA(s){ return normalizaQA(s).split(' ').filter((w)=> w.length>=3 && !STOPWORDS_QA.has(w)); }
// Scor Dice între 0 și 1 (2×comune / total). 1 = practic identice.
function similaritateQA(a, b){
  const A = new Set(tokeniQA(a)), B = new Set(tokeniQA(b));
  if (!A.size || !B.size) return 0;
  let comune = 0; A.forEach((w)=>{ if (B.has(w)) comune++; });
  return (2*comune) / (A.size + B.size);
}
// Cel mai bun răspuns cunoscut pentru o întrebare nouă, dintr-o listă de Q&A rezolvate.
function gasesteRaspunsCunoscut(intrebare, baza, pragul){
  let best = null, bestScor = 0;
  for (const q of baza){
    if (!q || !q.raspuns || !String(q.raspuns).trim()) continue;
    const sc = similaritateQA(intrebare, q.intrebare);
    if (sc > bestScor){ bestScor = sc; best = q; }
  }
  if (best && bestScor >= (pragul!=null?pragul:0.5)) return { sursa: best, scor: bestScor };
  return null;
}
// O întrebare poate avea mai multe răspunsuri (oricine poate răspunde). Doar cele marcate „corect" de manager se memorează.
function raspunsuriQA(q){
  if (q && Array.isArray(q.raspunsuri)) return q.raspunsuri;
  if (q && q.raspuns) return [{ id:'legacy', text:q.raspuns, autorNume:q.raspunsDe||'manager', autorId:'', data:q.raspunsData||q.data, corect:true }];
  return [];
}
function raspunsCorectQA(q){ const r = raspunsuriQA(q).find((x)=>x && x.corect); return r ? r.text : null; }
// Baza de cunoștințe = DOAR întrebările cu un răspuns marcat corect. (Folosită la sugestii și la AI.)
function bazaCunostinteQA(probleme){
  return (probleme||[]).map((q)=>{ const rc = raspunsCorectQA(q); return rc ? { id:q.id, intrebare:q.intrebare, raspuns:rc, santierId:q.santierId, raspunsDe:(raspunsuriQA(q).find((x)=>x.corect)||{}).autorNume||'manager' } : null; }).filter(Boolean);
}

// --- Token de sesiune (bilet de acces) — trimis la fiecare cerere către server,
// ca sa nu mai poata fi cerute datele direct, fara sa fii logat. ---
let AUTH_TOKEN = null;
try { AUTH_TOKEN = localStorage.getItem('authToken') || null; } catch {}
function setAuthToken(t) {
  AUTH_TOKEN = t;
  try { if (t) localStorage.setItem('authToken', t); else localStorage.removeItem('authToken'); } catch {}

function authFetch(url, options = {}) {

// ---- Amprentă / FaceID: deblocare LOCALĂ pe acest dispozitiv (WebAuthn platform authenticator).
// Nu e verificare pe server (nu putem modifica serverul) — biometricul deblochează sesiunea salvată
// local. Parola rămâne mereu disponibilă ca rezervă. Totul e defensiv: dacă biometricul nu merge,
// nu blochează nimic. ----
const bufToB64u = (buf)=>{ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64uToBuf = (str)=>{ str=String(str).replace(/-/g,'+').replace(/_/g,'/'); const pad='='.repeat((4-str.length%4)%4); const bin=atob(str+pad); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; };
function bioSuportat(){ try { return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); } catch { return false; } }
function bioInrolat(){ try { return !!localStorage.getItem('bioCredId'); } catch { return false; } }
async function bioInroleaza(user, token){
  if (!bioSuportat()) throw new Error('Dispozitivul nu suportă amprentă/FaceID (sau nu ești pe HTTPS).');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({ publicKey: {
    challenge,
    rp: { name: 'SMART ELECTROCONECT' },
    user: { id: userId, name: String(user?.username||user?.nume||'user'), displayName: String(user?.nume||'user') },
    pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
    authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
    timeout: 60000,
  }});
  if (!cred) throw new Error('Înrolare anulată.');
  localStorage.setItem('bioCredId', bufToB64u(cred.rawId));
  localStorage.setItem('bioSession', JSON.stringify({ user, token }));
}
function bioActualizeazaSesiune(user, token){ try { if (bioInrolat()) localStorage.setItem('bioSession', JSON.stringify({ user, token })); } catch {} }
function bioSterge(){ try { localStorage.removeItem('bioCredId'); localStorage.removeItem('bioSession'); } catch {} }
async function bioDeblocheaza(){
  if (!bioSuportat() || !bioInrolat()) throw new Error('Amprenta nu e activată pe acest dispozitiv.');
  const credId = localStorage.getItem('bioCredId');
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const asrt = await navigator.credentials.get({ publicKey: {
    challenge,
    allowCredentials: [{ id: b64uToBuf(credId), type:'public-key' }],
    userVerification:'required',
    timeout: 60000,
  }});
  if (!asrt) throw new Error('Deblocare anulată.');
  const raw = localStorage.getItem('bioSession');
  if (!raw) throw new Error('Nu există o sesiune salvată. Intră o dată cu parola.');
  return JSON.parse(raw); // { user, token }
}

// ---- OFFLINE: cache local + coadă de trimitere. Aplicația merge fără net; se sincronizează când revine. ----
const CACHE_PREFIX = 'cache_';
function cacheGet(key){ try{ const r=localStorage.getItem(CACHE_PREFIX+key); return r!=null?JSON.parse(r):undefined; }catch{ return undefined; } }
function cacheSet(key,val){ try{ localStorage.setItem(CACHE_PREFIX+key, JSON.stringify(val)); }catch{} }
const PENDING_KEY = 'pendingWrites';
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch{ return []; } }
function setPending(q){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(q)); }catch{} try{ window.dispatchEvent(new CustomEvent('offline-queue-change')); }catch{} }
function enqueueWrite(key, value){ const q=getPending().filter((x)=>x.key!==key); q.push({ key, value }); setPending(q); }
// Combină pe id: pornește de la ce e pe server (păstrează ce-au adăugat alții) și aplică deasupra înregistrările tale.
function mergeById(serverVal, clientVal){
  if(!Array.isArray(serverVal)||!Array.isArray(clientVal)) return clientVal;
  const ok=(arr)=>arr.every((x)=>x&&typeof x==='object'&&x.id!=null);
  if(!ok(serverVal)||!ok(clientVal)) return clientVal;
  const map=new Map(); serverVal.forEach((x)=>map.set(x.id,x)); clientVal.forEach((x)=>map.set(x.id,x));
  return Array.from(map.values());
}

async function loadKey(key, fallback) {
  // Dacă avem o scriere nesincronizată pentru cheia asta, ea e mai nouă decât serverul
  // → o păstrăm (combinată cu ce e pe server), ca să NU pierdem date create offline.
  const pending = getPending().find((x)=>x.key===key);
  const cached = cacheGet(key);
  try {
    const r = await authFetch(`/api/data?key=${encodeURIComponent(key)}`);
    const data = await r.json();
    let val = data.value ?? fallback;
    if (pending !== undefined) val = mergeById(val, pending.value);
    // PLASĂ DE SIGURANȚĂ: serverul întoarce GOL dar avem date locale → probabil pierdere pe server.
    // Nu ștergem — păstrăm datele locale și le re-trimitem pe server.
    if (Array.isArray(val) && val.length === 0 && Array.isArray(cached) && cached.length > 0) {
      enqueueWrite(key, cached);
      try { syncQueue(); } catch {}
      return cached;
    }
    cacheSet(key, val);
    return val;
  } catch {
    if (cached !== undefined) return pending !== undefined ? mergeById(cached, pending.value) : cached;
    return pending !== undefined ? pending.value : fallback;
  }
}
async function saveKey(key, value) {
  cacheSet(key, value); // salvează local imediat (optimist)
  let res;
  try {
    res = await authFetch('/api/data', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key, value }) });
  } catch (e) {
    enqueueWrite(key, value); // fără net → în coadă, se trimite când revine netul
    return;
  }
  let data = {};
  try { data = await res.json(); } catch {}
  if (!data.ok) throw new Error(data.error || 'Salvarea a eșuat.');
}

const VAPID_PUBLIC = 'BL2zeAif4sj-0ix4-_AoDmfXo3QnXC5YAh1aplsoTFX0TiiQC99gzO_vXSJZ9o53XtB218YlvzfkWYfb6ISbSyI';
function urlB64ToUint8Array(b64){ const pad='='.repeat((4-(b64.length%4))%4); const base=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(base); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
// Citește lista de abonați DIRECT de pe server (nu din cache-ul local, care poate fi vechi).
async function citestePushSubs(){
  try{
    const r = await authFetch(`/api/data?key=pushSubs`);
    const d = await r.json();
    if (Array.isArray(d.value)) { cacheSet('pushSubs', d.value); return d.value; }
  }catch{}
  return cacheGet('pushSubs') || [];
}
async function pushInroleaza(user){
  try{
    if(!user || !('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification==='undefined') return 'nesuportat';
    if(Notification.permission==='denied') return 'refuzat';
    let perm=Notification.permission;
    if(perm==='default') perm=await Notification.requestPermission();
    if(perm!=='granted') return 'refuzat';
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){ sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC) }); }
    const subJson=JSON.parse(JSON.stringify(sub));
    // IMPORTANT: pornim de la lista de pe SERVER (nu de la cache), ca să NU ștergem abonații
    // celorlalte telefoane. Doar adăugăm/înlocuim abonamentul acestui dispozitiv.
    const server = await citestePushSubs();
    const list = server.filter((x)=> x && x.sub && x.sub.endpoint!==subJson.endpoint);
    list.push({ id:subJson.endpoint, userId:user.id, nume:user.nume, rol:user.rol, sub:subJson, data:new Date().toISOString() });
    cacheSet('pushSubs', list);
    try{ await saveKey('pushSubs', list); }catch{}
    return 'ok';
  }catch(e){ return 'eroare'; }
}
// Trimite o notificare către: 'manageri' | 'toti' | un userId | [userId,...]. exceptUserId = nu te notifica pe tine.
// Dacă o notificare nu poate pleca (fără semnal), o punem la coadă și o retrimitem singură când revine netul.
const PUSH_QUEUE_KEY = 'pushQueue';
function pushQueueGet(){ try{ return JSON.parse(localStorage.getItem(PUSH_QUEUE_KEY) || '[]'); }catch{ return []; } }
function pushQueueSet(q){ try{ localStorage.setItem(PUSH_QUEUE_KEY, JSON.stringify(q.slice(-20))); }catch{} }
async function pushQueueFlush(){
  const q = pushQueueGet();
  if (!q.length || (typeof navigator !== 'undefined' && !navigator.onLine)) return;
  pushQueueSet([]);
  for (const item of q) {
    const r = await notifica(item.audience, item.msg, item.exceptUserId, true);
    if (!r || !r.ok) { const cur = pushQueueGet(); cur.push(item); pushQueueSet(cur); }
  }
}
async function notifica(audience, msg, exceptUserId, faraCoada){
  try{
    let list = await citestePushSubs(); // mereu lista proaspătă de pe server
    if(exceptUserId) list=list.filter((x)=>x.userId!==exceptUserId);
    let sel;
    if(audience==='manageri') sel=list.filter((x)=>x.rol==='Manager');
    else if(audience==='toti') sel=list;
    else if(Array.isArray(audience)) sel=list.filter((x)=>audience.includes(x.userId));
    else sel=list.filter((x)=>x.userId===audience);
    const subs=sel.map((x)=>x.sub).filter(Boolean);
    if(!subs.length) return { ok:false, reason:'fara-abonati' };
    // keepalive: cererea pleacă până la capăt chiar dacă angajatul închide aplicația imediat după ce salvează.
    const r = await authFetch(`/api/push-send?token=${encodeURIComponent(AUTH_TOKEN||'')}`, { method:'POST', keepalive:true, headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subscriptions:subs, title:msg.title, body:msg.body, url:msg.url||'/', tag:msg.tag }) });
    let data={}; try{ data=await r.json(); }catch{}
    if(!r.ok && !faraCoada){ const q=pushQueueGet(); q.push({ audience, msg, exceptUserId }); pushQueueSet(q); }
    return { ok:r.ok, status:r.status, data };
  }catch(e){
    // Fără net → o punem la coadă; pleacă singură când revine semnalul.
    if(!faraCoada){ const q=pushQueueGet(); q.push({ audience, msg, exceptUserId }); pushQueueSet(q); }
    return { ok:false, error: (e&&e.message)||'eroare' };
  }
}

let syncingQueue = false;
async function syncQueue() {
  if (syncingQueue || (typeof navigator!=='undefined' && !navigator.onLine)) return;
  if (!getPending().length) return;
  syncingQueue = true;
  try {
    for (const item of getPending().slice()) {
      let toPost = item.value;
      try {
        const r = await authFetch(`/api/data?key=${encodeURIComponent(item.key)}`);
        const d = await r.json();
        toPost = mergeById(d.value, item.value);
      } catch {}
      let rr;
      try {
        rr = await authFetch('/api/data', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key:item.key, value: toPost }) });
      } catch { break; }
      let dd = {}; try { dd = await rr.json(); } catch {}
      if (!dd.ok) break;
      cacheSet(item.key, toPost);
      setPending(getPending().filter((x)=>x.key!==item.key));
    }
  } finally { syncingQueue = false; }
}
if (typeof window !== 'undefined') {
  window.addEventListener('online', ()=>{ syncQueue(); });
  setInterval(()=>{ if (navigator.onLine && getPending().length) syncQueue(); }, 15000);
  setTimeout(()=>{ syncQueue(); }, 3000);
}

const STATUS_COLOR = { 'Ciornă':'var(--muted)','Trimisă':'#2E8BD1','Acceptată':'#4CAF7D','Respinsă':'#E05252','De încasat':'#2E8BD1','Neplătită':'#2E8BD1','Încasată':'#4CAF7D','Plătită':'#4CAF7D','Restantă':'#E05252','Emis':'#2E8BD1','Semnat':'#4CAF7D' };
const Icon = ({ children, size = 14 }) => <span style={{ fontSize:size, lineHeight:1, display:'inline-block' }}>{children}</span>;

function StatusSwitch({ status, onChange, options }) {
  const on = status === 'Acceptată' || status === 'Plătită' || status === 'Încasată' || status === 'Semnat';
  const color = STATUS_COLOR[status] || 'var(--muted)';
  return (
    <div className="inline-flex items-center gap-2">
      <span style={{ width:28, height:16, borderRadius:8, background:'var(--panel)', border:`1px solid ${color}66`, position:'relative', display:'inline-block', boxShadow: on ? `0 0 8px ${color}77` : 'none' }}>
        <span style={{ position:'absolute', top:2, left: on ? 14 : 2, width:10, height:10, borderRadius:'50%', background:color }} />
      </span>
      <select value={status} onChange={(e)=>onChange(e.target.value)} className="bg-transparent text-xs outline-none cursor-pointer" style={{ color, fontFamily:"'JetBrains Mono', monospace" }}>
        {options.map((s) => <option key={s} value={s} style={{ background:'var(--panel)', color:'var(--text)' }}>{s}</option>)}
      </select>
    </div>
  );
}

function LineItemsEditor({ items, setItems, materials }) {
  const update = (id, f, v) => setItems(items.map((it) => it.id === id ? { ...it, [f]: v } : it));
  const remove = (id) => setItems(items.filter((it) => it.id !== id));
  const add = () => setItems([...items, { id: uid(), denumire:'', um:'buc', cantitate:1, pretUnitar:0, adaos:0 }]);
  const pickMaterial = (id, denumire) => {
    const m = (materials || []).find((mm) => mm.denumire === denumire && !mm.arhivat);
    if (m) {
      setItems(items.map((it) => it.id === id ? { ...it, denumire: m.denumire, um: m.um, pretUnitar: m.pret } : it));
    } else {
      update(id, 'denumire', denumire);
    }
  };
  return (
    <div className="space-y-2">
      <datalist id="materiale-catalog">
        {(materials || []).filter((m)=>!m.arhivat).map((m) => <option key={m.id} value={m.denumire} />)}
      </datalist>
      <div className="overflow-x-auto">
      <div style={{ minWidth: 560 }}>
      <div className="grid gap-2 text-[11px] uppercase tracking-wider px-2" style={{ gridTemplateColumns:'28px 1fr 50px 60px 85px 65px 85px 90px 28px', color:'var(--muted)' }}>
        <span>Nr.</span><span>Denumire</span><span>U.M</span><span>Cant.</span><span>Preț cost</span><span>Adaos %</span><span>Preț final</span><span>Total</span><span/>
      </div>
      {items.map((it, i) => (
        <div key={it.id} className="grid gap-2 items-center rounded-lg px-2 py-1.5 mt-2" style={{ gridTemplateColumns:'28px 1fr 50px 60px 85px 65px 85px 90px 28px', background:'var(--panel2)' }}>
          <span className="text-xs text-center" style={{ color:'var(--muted2)', fontFamily:"'JetBrains Mono', monospace" }}>{i+1}</span>
          <input list="materiale-catalog" value={it.denumire} onChange={(e)=>pickMaterial(it.id, e.target.value)} placeholder="ex: Cablu N2XH 3x2,5 mmp — caută din catalog" className="bg-transparent outline-none text-sm py-1" style={{ color:'var(--text)' }} />
          <input value={it.um} onChange={(e)=>update(it.id,'um',e.target.value)} className="bg-transparent outline-none text-sm py-1" style={{ color:'var(--text)' }} />
          <input type="number" value={it.cantitate} onChange={(e)=>update(it.id,'cantitate',e.target.value)} className="bg-transparent outline-none text-sm py-1" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }} />
          <input type="number" value={it.pretUnitar} onChange={(e)=>update(it.id,'pretUnitar',e.target.value)} className="bg-transparent outline-none text-sm py-1" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }} />
          <input type="number" value={it.adaos ?? 0} onChange={(e)=>update(it.id,'adaos',e.target.value)} className="bg-transparent outline-none text-sm py-1" style={{ color:'#E9A23B', fontFamily:"'JetBrains Mono', monospace" }} />
          <span className="text-sm" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{money(pretFinal(it))}</span>
          <span className="text-sm" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money((Number(it.cantitate)||0)*pretFinal(it))}</span>
          <button onClick={()=>remove(it.id)} className="opacity-50 hover:opacity-100" style={{ color:'#E05252' }}><Icon>🗑</Icon></button>
        </div>
      ))}
      </div>
      </div>
      <button onClick={add} className="flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-lg" style={{ color:'#2E8BD1', background:'var(--panel2)' }}><Icon>+</Icon> Adaugă articol</button>
    </div>
  );
}

function DocForm({ kind, clients, materials, initial, onCancel, onSave }) {
  const [clientId, setClientId] = useState(initial?.clientId || clients[0]?.id || '');
  const [items, setItems] = useState(initial?.items || [{ id: uid(), denumire:'', um:'buc', cantitate:1, pretUnitar:0, adaos:0 }]);
  const [tva, setTva] = useState(initial?.tva ?? 19);
  // Scadența (termenul de plată) — doar la facturi. Implicit 30 de zile de la data facturii.
  const _dataDoc = initial?.data || new Date().toISOString().slice(0,10);
  const _scadentaImplicita = (()=>{ try { const d=new Date(_dataDoc+'T00:00:00'); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); } catch(_) { return ''; } })();
  const [scadenta, setScadenta] = useState(initial?.scadenta || _scadentaImplicita);
  const subtotal = calcSubtotal(items);
  const total = subtotal * (1 + tva/100);
  return (
    <div className="rounded-xl p-4 mb-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-medium" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>{initial?.id ? `Editare ${kind}` : `${kind} nouă`}</h3>
        <button onClick={onCancel} style={{ color:'var(--muted)' }}><Icon>✕</Icon></button>
      </div>
      {clients.length === 0 ? (
        <p className="text-sm" style={{ color:'var(--muted)' }}>Adaugă mai întâi un client în tab-ul „Clienți".</p>
      ) : (
        <>
          <div className="flex gap-3 mb-3">
            <select value={clientId} onChange={(e)=>setClientId(e.target.value)} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }}>
              {clients.map((c)=><option key={c.id} value={c.id} style={{ background:'var(--panel)' }}>{c.nume}</option>)}
            </select>
            <div className="flex items-center gap-2 rounded-lg px-3" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
              <span className="text-xs" style={{ color:'var(--muted)' }}>TVA</span>
              <input type="number" value={tva} onChange={(e)=>setTva(e.target.value)} className="w-12 bg-transparent outline-none text-sm py-2" style={{ color:'var(--text)' }} />
              <span className="text-xs" style={{ color:'var(--muted)' }}>%</span>
            </div>
          </div>
          {kind === 'Factură' && (
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              <span className="text-xs" style={{ color:'var(--muted)' }}>Scadență (termen de plată):</span>
              <RoCalendarPicker value={scadenta} onChange={setScadenta} />
              <span className="text-[11px]" style={{ color:'var(--muted2)' }}>După data asta, factura devine automat „Restantă" și te anunță aplicația.</span>
            </div>
          )}
          <LineItemsEditor items={items} setItems={setItems} materials={materials} />
          <div className="flex justify-end gap-6 mt-3 px-2 text-sm">
            <span style={{ color:'var(--muted)' }}>Subtotal: <span style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{money(subtotal)}</span></span>
            <span style={{ color:'var(--muted)' }}>Total (TVA inclus): <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(total)}</span></span>
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={onCancel} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={()=>onSave({ id: initial?.id || uid(), numar: initial?.numar, data: initial?.data || new Date().toISOString().slice(0,10), scadenta: kind==='Factură' ? scadenta : undefined, clientId, items, tva:Number(tva), status: initial?.status || (kind==='Ofertă'?'Ciornă':'De încasat'), offerId: initial?.offerId })}
              className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </>
      )}
    </div>
  );
}

function DocTable({ kind, docs, clients, statuses, onEdit, onDelete, onStatusChange, onConvert, onPrint, onSmartBill }) {
  const [sbState, setSbState] = useState({});
  const clientName = (id) => clients.find((c)=>c.id===id)?.nume || '—';
  if (docs.length === 0) return <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Nicio {kind.toLowerCase()} încă. Apasă „Adaugă" pentru a crea prima.</div>;

  const sendToSmartBill = async (d) => {
    setSbState((s)=>({ ...s, [d.id]: { status:'loading', message:'' } }));
    try {
      const result = await onSmartBill(d);
      setSbState((s)=>({ ...s, [d.id]: { status:'done', message: `Trimisă (${result.series || ''}${result.number || ''})` } }));
    } catch (e) {
      setSbState((s)=>({ ...s, [d.id]: { status:'error', message: e.message || 'Eroare la trimitere.' } }));
    }
  };

  return (
    <div className="space-y-2">
      {docs.slice().sort((a,b)=>a.numar<b.numar?1:-1).map((d)=>{
        const total = calcSubtotal(d.items) * (1 + d.tva/100);
        const sb = sbState[d.id];
        return (
          <div key={d.id} className="rounded-xl px-4 py-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
            <div className="flex items-center justify-between gap-4">
              <div className="flex flex-col gap-0.5 min-w-0">
                <span className="text-sm font-medium truncate" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{d.numar}</span>
                <span className="text-xs truncate" style={{ color:'var(--muted)' }}>{clientName(d.clientId)} · {d.data}</span>
              </div>
              <span className="text-sm shrink-0" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(total)}</span>
              <div className="shrink-0"><StatusSwitch status={d.status} options={statuses} onChange={(s)=>onStatusChange(d.id,s)} /></div>
              <div className="flex items-center gap-2 shrink-0">
                {onConvert && <button onClick={()=>onConvert(d)} className="text-xs flex items-center gap-1 px-2 py-1 rounded-lg" style={{ color:'#4CAF7D', background:'var(--panel2)' }}><Icon>→</Icon> Facturează</button>}
                {onSmartBill && (
                  <button onClick={()=>sendToSmartBill(d)} disabled={sb?.status==='loading'} className="text-xs px-2 py-1 rounded-lg flex items-center gap-1 disabled:opacity-40" style={{ color:'#4CAF7D', background:'var(--panel2)' }}>
                    <Icon>☁</Icon> {sb?.status==='loading' ? '...' : 'SmartBill'}
                  </button>
                )}
                <button onClick={()=>onPrint(d)} className="text-xs px-2 py-1 rounded-lg flex items-center gap-1" style={{ color:'var(--muted)', background:'var(--panel2)' }}><Icon>🖨</Icon> PDF</button>
                <button onClick={()=>onEdit(d)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                <button onClick={()=>onDelete(d.id)} style={{ color:'#E05252' }}><Icon>🗑</Icon></button>
              </div>
            </div>
            {sb?.message && (
              <div className="text-xs mt-2" style={{ color: sb.status==='error' ? '#E05252' : '#4CAF7D' }}>{sb.message}</div>
            )}
            {d.stocMesaj && (
              <div className="text-xs mt-2" style={{ color: d.stocMesaj.startsWith('Nepotrivite') ? '#E9A23B' : '#4CAF7D' }}>{d.stocMesaj}</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ClientsTab({ clients, setClients, persist }) {
  const [form, setForm] = useState(null);
  const [lookup, setLookup] = useState({ status:'idle', message:'' });
  const [filter, setFilter] = useState('');
  const [showAll, setShowAll] = useState(false);

  const save = (c) => {
    const next = clients.some((x)=>x.id===c.id) ? clients.map((x)=>x.id===c.id?c:x) : [...clients, c];
    setClients(next); persist('clients', next); setForm(null);
  };
  const del = (id) => { if (!window.confirm('Ștergi definitiv acest client?')) return; const next = clients.filter((c)=>c.id!==id); setClients(next); persist('clients', next); };
  const openForm = () => { setLookup({status:'idle',message:''}); setForm({ id: uid(), tip:'juridica', nume:'', cui:'', adresa:'', contact:'' }); };
  const cuiSearchUrl = (cui) => `https://www.google.com/search?q=${encodeURIComponent(`CUI ${cui} ANAF firma denumire adresa`)}`;

  const runAutoLookup = async () => {
    const clean = String(form.cui).replace(/\D/g,'');
    if (!clean) return;
    setLookup({status:'loading',message:''});
    try {
      const res = await authFetch(`/api/cui?cui=${clean}`);
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `Eroare ${res.status}`);
      if (!data.denumire) throw new Error('Răspunsul nu conține denumirea firmei.');
      setForm((f)=>({ ...f, nume: data.denumire, adresa: data.adresa || f.adresa }));
      setLookup({status:'done', message:'Date preluate automat de la ANAF.'});
    } catch (e) {
      setLookup({status:'error', message:`Preluarea automată a eșuat (${e.message}).`});
    }
  };

  const [importMsg, setImportMsg] = useState('');
  const importSmartBillClients = () => {
    const existing = new Set(clients.map((c)=>c.cui));
    const toAdd = CLIENT_IMPORT_SEED
      .filter(([, , cui]) => !existing.has(cui))
      .map(([nume, tip, cui, adresa, administrator, contact]) => ({ id: uid(), nume, tip, cui, adresa, administrator, contact }));
    if (toAdd.length === 0) { setImportMsg('Toți clienții din export sunt deja în listă.'); return; }
    const next = [...clients, ...toAdd];
    setClients(next);
    persist('clients', next);
    setImportMsg(`Am adăugat ${toAdd.length} clienți din exportul SmartBill.`);
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4 gap-3">
        <h2 className="text-lg shrink-0" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Clienți</h2>
        <input placeholder="Caută după nume sau CUI..." value={filter} onChange={(e)=>setFilter(e.target.value)} className="rounded-lg px-3 py-1.5 text-sm outline-none flex-1 max-w-xs" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
        <div className="flex items-center gap-2 shrink-0">
          {!showAll && !filter.trim() && <button onClick={()=>setShowAll(true)} className="text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>👥 Arată toți clienții</button>}
          {showAll && !filter.trim() && <button onClick={()=>setShowAll(false)} className="text-xs px-3 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>Ascunde</button>}
          <button onClick={importSmartBillClients} className="text-sm px-3 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>📥 Importă din SmartBill ({CLIENT_IMPORT_SEED.length})</button>
          <button onClick={openForm} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Adaugă client</button>
        </div>
      </div>
      {importMsg && <p className="text-xs mb-3" style={{ color:'#4CAF7D' }}>{importMsg}</p>}
      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <div className="flex gap-2 mb-1">
            {[['juridica','Persoană juridică'],['fizica','Persoană fizică']].map(([val,label])=>(
              <button key={val} onClick={()=>setForm({...form, tip:val})} className="text-xs px-2.5 py-1.5 rounded-lg"
                style={{ color: form.tip===val?'#14181C':'var(--muted)', background: form.tip===val?'#2E8BD1':'var(--panel2)', fontWeight: form.tip===val?600:400 }}>{label}</button>
            ))}
          </div>
          {form.tip === 'juridica' && (
            <div>
              <div className="flex gap-2">
                <input placeholder="CUI (ex: 14399840)" value={form.cui} onChange={(e)=>setForm({...form, cui:e.target.value})} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
                <button onClick={runAutoLookup} disabled={!form.cui || lookup.status==='loading'} className="text-xs px-3 py-2 rounded-lg font-medium disabled:opacity-40 whitespace-nowrap" style={{ color:'#14181C', background:'#2E8BD1' }}>Preia automat</button>
                <a href={form.cui ? cuiSearchUrl(form.cui) : undefined} target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-2 rounded-lg font-medium whitespace-nowrap" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid var(--border)', pointerEvents: form.cui?'auto':'none' }}>↗ Caută manual</a>
              </div>
              {lookup.message && <p className="text-xs mt-1 px-1" style={{ color: lookup.status==='error'?'#E05252':'#4CAF7D' }}>{lookup.message}</p>}
            </div>
          )}
          {['nume','adresa','administrator','contact'].map((f)=>(
            <input key={f} placeholder={{nume: form.tip==='juridica'?'Denumire firmă':'Nume persoană', adresa:'Adresă', administrator:'Reprezentant / cine semnează (nume)', contact:'Telefon / email'}[f]}
              value={form[f]||''} onChange={(e)=>setForm({...form, [f]:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
          ))}
          {form.tip === 'fizica' && <input placeholder="CNP (opțional)" value={form.cui} onChange={(e)=>setForm({...form, cui:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />}
          <div className="flex justify-end gap-2 pt-2">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={()=>save(form)} disabled={!form.nume} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </div>
      )}
      {clients.length === 0 && !form ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Niciun client încă.</div>
      ) : !showAll && !filter.trim() ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Caută un client, sau apasă „Arată toți clienții".</div>
      ) : (
        <div className="space-y-2">
          {clients.filter((c)=> seCauta(`${c.nume||''} ${c.cui||''} ${c.adresa||''} ${c.contact||''}`, filter)).map((c)=>(
            <div key={c.id} className="rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
              <div>
                <div className="text-sm" style={{ color:'var(--text)' }}>{c.nume}</div>
                <div className="text-xs" style={{ color:'var(--muted)' }}>{[c.cui,c.adresa,c.contact].filter(Boolean).join(' · ')}</div>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={()=>setForm(c)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                <button onClick={()=>del(c.id)} style={{ color:'#E05252' }}><Icon>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const LUNI_RO = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];

function RoDatePicker({ value, onChange }) {
  const initParts = value ? value.split('-').map(Number) : [null, null, null];
  const [ly, setLy] = useState(initParts[0]);
  const [lm, setLm] = useState(initParts[1]);
  const [ld, setLd] = useState(initParts[2]);

  useEffect(() => {
    if (!value) { setLy(null); setLm(null); setLd(null); }
  }, [value]);

  const now = new Date();
  const years = [];
  for (let yy = now.getFullYear() - 5; yy <= now.getFullYear() + 1; yy++) years.push(yy);
  const daysInMonth = (yy, mm) => (yy && mm) ? new Date(yy, mm, 0).getDate() : 31;
  const days = Array.from({ length: daysInMonth(ly, lm) }, (_, i) => i + 1);

  const update = (ny, nm, nd) => {
    setLy(ny); setLm(nm); setLd(nd);
    if (ny && nm && nd) {
      const clampedDay = Math.min(nd, daysInMonth(ny, nm));
      onChange(`${ny}-${String(nm).padStart(2,'0')}-${String(clampedDay).padStart(2,'0')}`);
    } else {
      onChange('');
    }
  };

  const selStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  return (
    <div className="flex items-center gap-1">
      <select value={ld||''} onChange={(e)=>update(ly, lm, Number(e.target.value)||null)} className="rounded-lg px-1.5 py-1.5 text-xs outline-none" style={selStyle}>
        <option value="">Zi</option>
        {days.map((dd)=><option key={dd} value={dd} style={{ background:'var(--panel)' }}>{dd}</option>)}
      </select>
      <select value={lm||''} onChange={(e)=>update(ly, Number(e.target.value)||null, ld)} className="rounded-lg px-1.5 py-1.5 text-xs outline-none" style={selStyle}>
        <option value="">Lună</option>
        {LUNI_RO.map((lu,i)=><option key={lu} value={i+1} style={{ background:'var(--panel)' }}>{lu}</option>)}
      </select>
      <select value={ly||''} onChange={(e)=>update(Number(e.target.value)||null, lm, ld)} className="rounded-lg px-1.5 py-1.5 text-xs outline-none" style={selStyle}>
        <option value="">An</option>
        {years.map((yy)=><option key={yy} value={yy} style={{ background:'var(--panel)' }}>{yy}</option>)}
      </select>
      {value && <button onClick={()=>update(null,null,null)} className="text-xs px-1.5" style={{ color:'var(--muted2)' }}><Icon size={12}>✕</Icon></button>}
    </div>
  );
}

const ZILE_RO = ['Lu','Ma','Mi','Jo','Vi','Sâ','Du'];

function RoCalendarPicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const base = value ? new Date(value + 'T00:00:00') : new Date();
  const [viewYear, setViewYear] = useState(base.getFullYear());
  const [viewMonth, setViewMonth] = useState(base.getMonth());
  const todayStr = new Date().toISOString().slice(0,10);

  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const firstDayIdx = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < firstDayIdx; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const fmtDisplay = (v) => { if (!v) return 'Alege data'; const [y,m,d] = v.split('-'); return `${d}/${m}/${y}`; };
  const cellDate = (d) => `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const selectDay = (d) => { onChange(cellDate(d)); setOpen(false); };
  const prevMonth = () => { if (viewMonth===0) { setViewMonth(11); setViewYear(viewYear-1); } else setViewMonth(viewMonth-1); };
  const nextMonth = () => { if (viewMonth===11) { setViewMonth(0); setViewYear(viewYear+1); } else setViewMonth(viewMonth+1); };

  return (
    <div style={{ position:'relative', display:'inline-block' }}>
      <button onClick={()=>setOpen(!open)} className="rounded-lg px-3 py-1.5 text-sm outline-none flex items-center gap-1.5" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }}>
        📅 {fmtDisplay(value)}
      </button>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{ position:'fixed', inset:0, zIndex:40 }} />
          <div style={{ position:'absolute', top:'110%', left:0, zIndex:50, width:230, background:'var(--panel)', border:'1px solid var(--border)' }} className="rounded-xl p-3">
            <div className="flex items-center justify-between mb-2">
              <button onClick={prevMonth} style={{ color:'var(--muted)' }}>‹</button>
              <span className="text-sm" style={{ color:'var(--text)' }}>{LUNI_RO[viewMonth]} {viewYear}</span>
              <button onClick={nextMonth} style={{ color:'var(--muted)' }}>›</button>
            </div>
            <div className="grid grid-cols-7 gap-1 mb-1">
              {ZILE_RO.map((z)=><div key={z} className="text-center text-[10px]" style={{ color:'var(--muted2)' }}>{z}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d,i)=> d ? (
                <button key={i} onClick={()=>selectDay(d)} className="text-xs rounded py-1"
                  style={{
                    color: value === cellDate(d) ? '#14181C' : 'var(--text)',
                    background: value === cellDate(d) ? '#2E8BD1' : 'transparent',
                    border: todayStr === cellDate(d) ? '1px solid #2E8BD1' : '1px solid transparent',
                    fontWeight: todayStr === cellDate(d) ? 700 : 400,
                  }}>{d}</button>
              ) : <div key={i} />)}
            </div>
            {value && <button onClick={()=>{ onChange(''); setOpen(false); }} className="text-xs mt-2 w-full text-center" style={{ color:'var(--muted2)' }}>Șterge data</button>}
          </div>
        </>
      )}
    </div>
  );
}

function RoTimePicker({ value, onChange }) {
  const [h, m] = (value || '08:00').split(':');
  const hours = Array.from({ length:24 }, (_,i)=>String(i).padStart(2,'0'));
  const minutes = Array.from({ length:60 }, (_, i) => String(i).padStart(2,'0'));
  const selStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  return (
    <div className="flex items-center gap-1">
      <select value={h} onChange={(e)=>onChange(`${e.target.value}:${m}`)} className="rounded-lg px-2 py-2 text-sm outline-none" style={selStyle}>
        {hours.map((hh)=><option key={hh} value={hh} style={{ background:'var(--panel)' }}>{hh}</option>)}
      </select>
      <span style={{ color:'var(--muted)' }}>:</span>
      <select value={m} onChange={(e)=>onChange(`${h}:${e.target.value}`)} className="rounded-lg px-2 py-2 text-sm outline-none" style={selStyle}>
        {minutes.map((mm)=><option key={mm} value={mm} style={{ background:'var(--panel)' }}>{mm}</option>)}
      </select>
    </div>
  );
}

  );
}

function MaterialsTab({ materials, setMaterials, stockMoves, setStockMoves, persist, company, subTab }) {
  const [form, setForm] = useState(null);
  const [moveState, setMoveState] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [exportFrom, setExportFrom] = useState('');
  const [exportTo, setExportTo] = useState('');
  const [exportGestiuni, setExportGestiuni] = useState(new Set());
  const [filter, setFilter] = useState('');
  const [arataVechi, setArataVechi] = useState(false);

  const materialeActive = materials.filter((m)=>!m.arhivat);
  const materialeVechi = materials.filter((m)=>m.arhivat);
  const arhiveazaGestiune = () => {
    if (!window.confirm(`Sigur arhivezi toate cele ${materialeActive.length} materiale active ca „Gestiune veche"? Rămân vizibile la nevoie, dar nu mai apar în Stocuri sau la scăderea automată din devize. Poți adăuga apoi materiale noi, cu cantități reale.`)) return;
    const next = materials.map((m)=> m.arhivat ? m : {...m, arhivat:true});
    setMaterials(next); persist('materials', next);
  };

  const saveMaterial = (m) => {
    const next = materials.some((x)=>x.id===m.id) ? materials.map((x)=>x.id===m.id?m:x) : [...materials, m];
    setMaterials(next); persist('materials', next); setForm(null);
  };
  const deleteMaterial = (id) => { if (!window.confirm('Ștergi definitiv acest material din gestiune?')) return; const next = materials.filter((m)=>m.id!==id); setMaterials(next); persist('materials', next); };
  const confirmMove = (material, tip, cantitate, nota, pret) => {
    let nextMaterials;
    if (tip === 'intrare' && pret > 0) {
      const stocVechi = Number(material.stoc) || 0;
      const pretVechi = Number(material.pret) || 0;
      const stocNouTotal = stocVechi + cantitate;
      const pretMediuNou = stocNouTotal > 0 ? ((stocVechi * pretVechi) + (cantitate * pret)) / stocNouTotal : pret;
      nextMaterials = materials.map((m)=>m.id===material.id ? { ...m, stoc: stocNouTotal, pret: Math.round(pretMediuNou*100)/100 } : m);
    } else {
      const delta = tip==='intrare' ? cantitate : -cantitate;
      nextMaterials = materials.map((m)=>m.id===material.id ? {...m, stoc:(Number(m.stoc)||0)+delta} : m);
    }
    setMaterials(nextMaterials); persist('materials', nextMaterials);
    const move = { id: uid(), materialId: material.id, tip, cantitate, nota, pret: tip==='intrare' ? pret : undefined, data: new Date().toISOString().slice(0,10) };
    const nextMoves = [move, ...stockMoves];
    setStockMoves(nextMoves); persist('stockMoves', nextMoves);
    setMoveState(null);
  };
  const normalizeSearch = (s) => String(s || '').toLowerCase().replace(/[\s,.\-]/g, '');
  const baseList = arataVechi ? materialeVechi : materialeActive;
  const filtered = baseList.filter((m)=> seCauta(`${m.denumire||''} ${m.categorie||''} ${m.um||''}`, filter));
  const filteredStocuri = materialeActive.filter((m)=> !filter || normalizeSearch(m.denumire).includes(normalizeSearch(filter)) || normalizeSearch(m.categorie).includes(normalizeSearch(filter)));

  const importCatalog = () => {
    const existing = new Set(materials.map((m)=>m.denumire));
    const toAdd = MATERIAL_CATALOG_SEED
      .filter(([denumire]) => !existing.has(denumire))
      .map(([denumire, categorie, um, pret]) => ({ id: uid(), denumire, categorie, um, stoc: 0, stocMinim: 0, pret }));
    if (toAdd.length === 0) return;
    const next = [...materials, ...toAdd];
    setMaterials(next);
    persist('materials', next);
  };

  const [sbImportMsg, setSbImportMsg] = useState('');
  const importSmartBillStock = () => {
    const existing = new Set(materials.map((m)=>m.denumire));
    const toAdd = MATERIAL_IMPORT_SEED
      .filter(([denumire]) => !existing.has(denumire))
      .map(([denumire, categorie, um, stoc, pret]) => ({ id: uid(), denumire, categorie, um, stoc, stocMinim: 0, pret }));
    if (toAdd.length === 0) { setSbImportMsg('Toate materialele din gestiune sunt deja în listă.'); return; }
    const next = [...materials, ...toAdd];
    setMaterials(next);
    persist('materials', next);
    setSbImportMsg(`Am adăugat ${toAdd.length} materiale din gestiunea SmartBill.`);
  };

  const exportExcel = () => {
    const filteredMaterials = exportGestiuni.size === 0
      ? materials
      : materials.filter((m) => exportGestiuni.has(m.categorie));

    const rows = filteredMaterials.map((m) => {
      const movesForMaterial = stockMoves.filter((mv) => mv.materialId === m.id);

      // Mișcări de după perioadă — le "dăm înapoi" ca să aflăm stocul de la finalul perioadei.
      const after = exportTo ? movesForMaterial.filter((mv) => mv.data > exportTo) : [];
      const netAfter = after.reduce((s, mv) => s + (mv.tip === 'intrare' ? mv.cantitate : -mv.cantitate), 0);
      const stocFinal = (Number(m.stoc) || 0) - netAfter;

      const inPeriod = movesForMaterial.filter((mv) =>
        (!exportFrom || mv.data >= exportFrom) && (!exportTo || mv.data <= exportTo)
      );
      const intrariMoves = inPeriod.filter((mv) => mv.tip === 'intrare');
      const iesiriMoves = inPeriod.filter((mv) => mv.tip === 'iesire');
      const intrari = intrariMoves.reduce((s, mv) => s + (Number(mv.cantitate) || 0), 0);
      const iesiri = iesiriMoves.reduce((s, mv) => s + (Number(mv.cantitate) || 0), 0);
      const stocInitial = stocFinal - intrari + iesiri;
      const pret = Number(m.pret) || 0;
      // Valoarea intrărilor se calculează cu costul real înregistrat la fiecare intrare
      // (dacă o mișcare mai veche nu are cost înregistrat, se folosește prețul curent al materialului).
      const valoareIntrari = intrariMoves.reduce((s, mv) => s + (Number(mv.cantitate)||0) * (mv.pret != null && mv.pret !== '' ? Number(mv.pret) : pret), 0);

      return {
        'Gestiune': m.categorie || '',
        'Produs': m.denumire,
        'U.M.': m.um,
        'Stoc inițial': stocInitial,
        'Intrări': intrari,
        'Ieșiri': iesiri,
        'Stoc final': stocFinal,
        'Sold inițial': Math.round(stocInitial * pret * 100) / 100,
        'Valoare intrări': Math.round(valoareIntrari * 100) / 100,
        'Valoare ieșiri': Math.round(iesiri * pret * 100) / 100,
        'Sold final': Math.round(stocFinal * pret * 100) / 100,
      };
    });

    const totalRow = {
      'Gestiune': 'TOTAL', 'Produs': '', 'U.M.': '',
      'Stoc inițial': '', 'Intrări': '', 'Ieșiri': '', 'Stoc final': '',
      'Sold inițial': Math.round(rows.reduce((s,r)=>s+(Number(r['Sold inițial'])||0),0)*100)/100,
      'Valoare intrări': Math.round(rows.reduce((s,r)=>s+(Number(r['Valoare intrări'])||0),0)*100)/100,
      'Valoare ieșiri': Math.round(rows.reduce((s,r)=>s+(Number(r['Valoare ieșiri'])||0),0)*100)/100,
      'Sold final': Math.round(rows.reduce((s,r)=>s+(Number(r['Sold final'])||0),0)*100)/100,
    };
    const sheetRows = rows.length
      ? [...rows, totalRow]
      : [{
          'Gestiune': '', 'Produs': 'Niciun material în gestiunile selectate.', 'U.M.': '',
          'Stoc inițial': '', 'Intrări': '', 'Ieșiri': '', 'Stoc final': '',
          'Sold inițial': '', 'Valoare intrări': '', 'Valoare ieșiri': '', 'Sold final': '',
        }];

    const fmtRo = (d) => { if (!d) return ''; const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; };
    const gestiuniLabel = exportGestiuni.size === 0 ? 'Toate' : [...exportGestiuni].join(', ');
    const azi = new Date();
    const extrasLa = `${String(azi.getDate()).padStart(2,'0')}/${String(azi.getMonth()+1).padStart(2,'0')}/${azi.getFullYear()}`;

    const headerRows = [
      [company?.nume || 'Firma mea'],
      [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],
      [],
      ['Balanța stocului'],
      [`Data început perioadă: ${fmtRo(exportFrom) || '(nespecificată)'}`],
      [`Data sfârșit perioadă: ${fmtRo(exportTo) || '(nespecificată)'}`],
      [`Extras la: ${extrasLa}`],
      [],
    ];

    const ws = XLSX.utils.aoa_to_sheet(headerRows);
    XLSX.utils.sheet_add_json(ws, sheetRows, { origin: -1 });
    ws['!cols'] = [{wch:16},{wch:40},{wch:8},{wch:11},{wch:9},{wch:9},{wch:11},{wch:12},{wch:13},{wch:13},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Balanta stocului');
    const label = `${exportFrom || 'inceput'}_${exportTo || 'azi'}`;
    XLSX.writeFile(wb, `balanta_stocului_${label}.xlsx`);
  };

  const gestiuni = [...new Set(baseList.map((m)=>m.categorie).filter(Boolean))].sort();
  const [stocShowAll, setStocShowAll] = useState(false);
  const [gestShowAll, setGestShowAll] = useState(false);
  const [gestFlatAll, setGestFlatAll] = useState(false);
  const [gestGroup, setGestGroup] = useState(null);
  const searchingGestiune = filter.trim() !== '';

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>{subTab === 'gestiune' ? 'Materiale — Gestiune' : 'Materiale — Stocuri'}</h2>
      <p className="text-xs mb-3" style={{ color:'var(--muted2)' }}>Gestiune — lista de materiale (adaugă, editează, importă). Stocuri — cantități curente și mișcări de intrare/ieșire.</p>

      {subTab === 'gestiune' && (
        <div>
          <div className="flex justify-between items-center mb-2 gap-3 flex-wrap">
            <input placeholder="Caută gestiune sau material..." value={filter} onChange={(e)=>setFilter(e.target.value)} className="rounded-lg px-3 py-1.5 text-sm outline-none flex-1 max-w-xs" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
            {!searchingGestiune && !gestShowAll && <button onClick={()=>setGestShowAll(true)} className="text-sm px-3 py-1.5 rounded-lg font-medium shrink-0" style={{ color:'#14181C', background:'#2E8BD1' }}>🗂 Afișează toate gestiunile</button>}
            {!searchingGestiune && gestShowAll && <button onClick={()=>{ setGestShowAll(false); setGestGroup(null); setGestFlatAll(false); }} className="text-xs px-3 py-1.5 rounded-lg shrink-0" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>Ascunde</button>}
            <button onClick={importSmartBillStock} className="text-xs px-2.5 py-1.5 rounded-lg shrink-0" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>📥 SmartBill</button>
            <button onClick={importCatalog} className="text-xs px-2.5 py-1.5 rounded-lg shrink-0" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>📥 Catalog</button>
            {!form && <button onClick={()=>{ setForm({}); setAddMode('manual'); }} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium shrink-0" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Adaugă material</button>}
          </div>

          <div className="flex items-center gap-2 mb-3 flex-wrap">
            <button onClick={()=>setArataVechi(!arataVechi)} className="text-xs px-2.5 py-1.5 rounded-lg font-medium" style={{ color: arataVechi?'#14181C':'var(--muted)', background: arataVechi?'#E9A23B':'var(--panel2)', border:'1px solid var(--border)' }}>
              {arataVechi ? `🗄 Gestiune veche (${materialeVechi.length})` : `🗄 Arată gestiunea veche (${materialeVechi.length})`}
            </button>
            {!arataVechi && materialeActive.length > 0 && (
              <button onClick={arhiveazaGestiune} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ color:'#E05252', background:'var(--panel2)', border:'1px solid #E0525266' }}>📦 Arhivează gestiunea curentă (fă loc uneia noi)</button>
            )}
          </div>
          {arataVechi && (
            <p className="text-xs mb-3" style={{ color:'#E9A23B' }}>Aceasta e gestiunea veche, din SmartBill — cifrele nu mai corespund cu stocul fizic real. E doar de referință; nu apare în Stocuri și nu se scade automat la devize.</p>
          )}

          <details className="mb-3">
            <summary className="text-xs cursor-pointer select-none" style={{ color:'var(--muted2)' }}>📊 Export balanță stoc</summary>
            <div className="flex items-center gap-1.5 mt-2 flex-wrap">
              <RoCalendarPicker value={exportFrom} onChange={setExportFrom} />
              <span className="text-xs" style={{ color:'var(--muted2)' }}>—</span>
              <RoCalendarPicker value={exportTo} onChange={setExportTo} />
              <button onClick={exportExcel} className="text-xs px-2.5 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Exportă Excel</button>
            </div>
            {gestiuni.length > 0 && (
              <div className="flex items-center gap-1 mt-1.5 flex-wrap">
                <span className="text-[11px] mr-1" style={{ color:'var(--muted2)' }}>Gestiuni (nimic bifat = toate):</span>
                <button onClick={()=>setExportGestiuni(new Set(gestiuni))} className="text-[11px] px-2 py-0.5 rounded-lg" style={{ color:'#2E8BD1', background:'var(--panel2)', border:'1px solid #2E8BD166' }}>Selectează toate</button>
                {exportGestiuni.size > 0 && (
                  <button onClick={()=>setExportGestiuni(new Set())} className="text-[11px] px-2 py-0.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Deselectează</button>
                )}
                {gestiuni.map((g)=>{
                  const active = exportGestiuni.has(g);
                  return (
                    <button key={g} onClick={()=>{
                        const next = new Set(exportGestiuni);
                        active ? next.delete(g) : next.add(g);
                        setExportGestiuni(next);
                      }}
                      className="text-[11px] px-2 py-0.5 rounded-lg"
                      style={{ color: active?'#14181C':'var(--muted)', background: active?'#2E8BD1':'var(--panel2)' }}>{g}</button>
                  );
                })}
              </div>
            )}
          </details>

          {sbImportMsg && <p className="text-xs mb-3" style={{ color:'#4CAF7D' }}>{sbImportMsg}</p>}
          {form && !form.id && <MaterialForm initial={null} onCancel={()=>setForm(null)} onSave={saveMaterial} />}
          {form && form.id && <MaterialForm initial={form} onCancel={()=>setForm(null)} onSave={saveMaterial} />}

          {baseList.length===0 && !form ? (
            <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Niciun material încă.</div>
          ) : (searchingGestiune || gestFlatAll) ? (
            <>
              {gestFlatAll && !searchingGestiune && (
                <button onClick={()=>setGestFlatAll(false)} className="text-xs mb-2" style={{ color:'var(--muted2)' }}>← Înapoi la gestiuni</button>
              )}
              <div className="flex justify-end mb-2 text-sm" style={{ color:'var(--muted)' }}>
                Valoare totală ({filtered.length} produse): <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(filtered.reduce((s,m)=>s+(Number(m.stoc)||0)*(Number(m.pret)||0),0))}</span>
              </div>
              <div className="space-y-2">
                {filtered.map((m)=>(

            <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Caută un material, sau apasă „Afișează stoc integral".</div>
          ) : (
              <div className="space-y-2">
              {filteredStocuri.map((m)=>{
                const low = Number(m.stoc) < Number(m.stocMinim);
                const moves = stockMoves.filter((mv)=>mv.materialId===m.id).slice(0,8);

                  <div key={m.id} className="rounded-xl px-4 py-3" style={{ background:'var(--panel)', border:`1px solid ${low?'#E0525266':'var(--border)'}` }}>

                      </div>
                      <div className="flex items-center gap-4 shrink-0">
                        <div className="text-right">
                          <div className="text-sm font-medium" style={{ color: low?'#E05252':'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{m.stoc} {m.um}</div>
                          <div className="text-[11px]" style={{ color:'var(--muted2)' }}>min {m.stocMinim}</div>
                        </div>
                        {moveState?.materialId===m.id ? (
                          <MoveInput tip={moveState.tip} defaultPret={m.pret} onConfirm={(c,n,p)=>confirmMove(m, moveState.tip, c, n, p)} onCancel={()=>setMoveState(null)} />
                        ) : (
                          <div className="flex items-center gap-1.5">
                            <button onClick={()=>setMoveState({materialId:m.id, tip:'intrare'})} className="text-xs px-2 py-1 rounded-lg font-medium" style={{ color:'#4CAF7D', background:'var(--panel2)' }}>+ Intrare</button>
                            <button onClick={()=>setMoveState({materialId:m.id, tip:'iesire'})} className="text-xs px-2 py-1 rounded-lg font-medium" style={{ color:'#E05252', background:'var(--panel2)' }}>− Ieșire</button>
                          </div>
                        )}
                      </div>
                    </div>
                    {expanded===m.id && moves.length>0 && (
                      <div className="mt-2 space-y-1">
                        {moves.map((mv)=>(

                            <span style={{ color:'var(--muted)' }}>{mv.data} {mv.nota && `· ${mv.nota}`}</span>

                              {mv.tip==='intrare'?'+':'−'}{mv.cantitate}{mv.tip==='intrare' && mv.pret ? ` @ ${money(mv.pret)}` : ''}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
              </div>
          )}
        </div>
      )}
    </div>
  );
}
