function LucrariApartamenteEditor({ lucrari, setLucrari, structura, persoane, echipaNume, pozitii, materialeLista }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const normL = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const optiuniLucrare = (()=>{
    const seen = new Set(), out = [];
    (pozitii||[]).forEach((p)=>{ const k=normL(p.denumire); if(p.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'p'+p.id, label:p.denumire, um:p.um }); } });
    (materialeLista||[]).forEach((m)=>{ const k=normL(m.denumire); if(m.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'m'+m.id, label:m.denumire, um:m.um }); } });
    return out;
  })();
  const [totiElectricieni, setTotiElectricieni] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setTotiElectricieni((data.users||[]).filter((u)=>u.rol==='Electrician').map((u)=>u.nume).filter(Boolean))).catch(()=>setTotiElectricieni([]));
  }, []);
  const numDin = (s)=>{ const m=String(s||'').match(/-?\d+/); return m?parseInt(m[0],10):null; };
  const cmp = (a,b)=>{ const na=numDin(a?.nume),nb=numDin(b?.nume); if(na==null&&nb==null) return String(a?.nume||'').localeCompare(String(b?.nume||''),'ro'); if(na==null)return -1; if(nb==null)return 1; return na-nb; };
  const etaje = (structura||[]).slice().sort(cmp);
  const bazaEchipa = Array.from(new Set([ ...(echipaNume||[]), ...(persoane||[]).map((p)=>p.nume) ].filter((n)=>n&&String(n).trim())));
  // Dacă șantierul n-are echipă asignată și n-ai adăugat încă persoane la raport,
  // arătăm toți electricienii ca să poți selecta oricând cine a lucrat.
  const numePersoane = bazaEchipa.length ? bazaEchipa : totiElectricieni;
  const grupuri = (lucrari||[]).map((g)=> Array.isArray(g.lucrari) ? g : normalizeLucrariApart([g])[0]);
  const updateGrup = (id,f,v)=>setLucrari(grupuri.map((x)=>x.id===id?{...x,[f]:v}:x));
  const removeGrup = (id)=>setLucrari(grupuri.filter((x)=>x.id!==id));
  const toggleAp = (g,apId)=>{ const cur=g.apartamenteIds||[]; updateGrup(g.id,'apartamenteIds', cur.includes(apId)? cur.filter((i)=>i!==apId):[...cur,apId]); };
  const setWorks = (gid, works)=>setLucrari(grupuri.map((g)=>g.id===gid?{...g, lucrari:works}:g));
  const addWork = (g)=>setWorks(g.id, [...(g.lucrari||[]), { id:uid(), denumire:'', cantitate:'', um:'buc' }]);
  const updateWork = (g,wid,f,v)=>setWorks(g.id, (g.lucrari||[]).map((w)=>w.id===wid?{...w,[f]:v}:w));
  const pickWork = (g,wid,o)=>{
    // Nu vrem același material de două ori la aceeași persoană/apartament → oferim să completeze rândul existent.
    const dup = (g.lucrari||[]).find((w)=>w.id!==wid && normL(w.denumire)===normL(o.label));
    if (dup && window.confirm(`„${o.label}" există deja aici pentru ${g.persoanaNume||'această persoană'}. Completează cantitatea la rândul existent în loc de un rând nou?`)) {
      const rest = (g.lucrari||[]).filter((w)=>w.id!==wid);
      setWorks(g.id, rest.length?rest:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }]);
      return;
    }
    setWorks(g.id, (g.lucrari||[]).map((w)=>w.id===wid?{...w,denumire:o.label,um:o.um||w.um}:w));
  };
  const removeWork = (g,wid)=>{ const rest=(g.lucrari||[]).filter((w)=>w.id!==wid); setWorks(g.id, rest.length?rest:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }]); };
  const add = ()=>{ const ultimul = grupuri[grupuri.length-1]; setLucrari([...grupuri, { id:uid(), persoanaNume:(ultimul?.persoanaNume)||numePersoane[0]||'', etajId:(ultimul?.etajId)||etaje[0]?.id||'', apartamenteIds:[], ore:'', lucrari:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }] }]); };
  return (
    <div>
      <p className="text-xs mb-2" style={{ color:'var(--muted2)' }}>Alegi persoana și apartamentul, apoi treci lucrările una sub alta (1, 2, 3...). Când persoana se mută în alt apartament, apeși „+ Adaugă" jos și pornești o listă nouă.</p>
      {grupuri.map((g)=>{
        const etaj = etaje.find((e)=>e.id===g.etajId);
        const aps = (etaj?.apartamente||[]).slice().sort(cmp);
        return (
          <div key={g.id} className="rounded-lg p-2 mb-1.5" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
            <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
              <select value={g.persoanaNume} onChange={(e)=>updateGrup(g.id,'persoanaNume',e.target.value)} className="rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle}>
                <option value="" style={{ background:'var(--panel)' }}>Persoană...</option>
                {numePersoane.map((n)=><option key={n} value={n} style={{ background:'var(--panel)' }}>{n}</option>)}
              </select>
              <select value={g.etajId} onChange={(e)=>updateGrup(g.id,'etajId',e.target.value)} className="rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle}>
                <option value="" style={{ background:'var(--panel)' }}>Etaj...</option>
                {etaje.map((e)=><option key={e.id} value={e.id} style={{ background:'var(--panel)' }}>{e.nume}</option>)}
              </select>
              <span className="flex items-center gap-1 text-[11px]" style={{ color:'var(--muted)' }}>⏱<input type="number" inputMode="decimal" value={g.ore} onChange={(e)=>updateGrup(g.id,'ore',e.target.value)} placeholder="ore" className="w-14 rounded-lg px-1.5 py-1 text-xs outline-none text-center" style={inputStyle}/></span>
              <button onClick={()=>removeGrup(g.id)} className="ml-auto opacity-60" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
            </div>
            {etaj && (
              <div className="flex flex-wrap gap-1 mb-1.5">
                {aps.length===0 && <span className="text-[11px]" style={{ color:'var(--muted2)' }}>Etajul n-are apartamente în structură.</span>}
                {aps.map((a)=>{ const on=(g.apartamenteIds||[]).includes(a.id); return (
                  <button key={a.id} onClick={()=>toggleAp(g,a.id)} className="text-[11px] px-2 py-1 rounded-lg" style={{ color:on?'#14181C':'var(--muted)', background:on?'#2E8BD1':'var(--panel)', border:'1px solid var(--border)' }}>{a.nume}</button>
                ); })}
              </div>
            )}
            <div className="space-y-1">
              {(g.lucrari||[]).map((w,i)=>(
                <div key={w.id} className="flex items-center gap-1.5">
                  <span className="text-[11px] w-4 text-center shrink-0" style={{ color:'var(--muted2)' }}>{i+1}</span>
                  <AutocompleteInput value={w.denumire} onChange={(v)=>updateWork(g,w.id,'denumire',v)} onPick={(o)=>pickWork(g,w.id,o)} options={optiuniLucrare} placeholder="Ce a lucrat (caută în poziții/materiale sau scrie liber)" minWidth="130px" />
                  <input type="number" inputMode="decimal" value={w.cantitate||''} onChange={(e)=>updateWork(g,w.id,'cantitate',e.target.value)} placeholder="Cant." className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <input value={w.um||''} onChange={(e)=>updateWork(g,w.id,'um',e.target.value)} placeholder="UM" className="w-12 rounded-lg px-1.5 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <button onClick={()=>removeWork(g,w.id)} className="shrink-0 opacity-60" style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                </div>
              ))}
            </div>
            <button onClick={()=>addWork(g)} className="mt-1.5 text-[11px] px-2.5 py-1 rounded-lg font-medium" style={{ color:'#2E8BD1', background:'var(--panel)', border:'1px solid #2E8BD166' }}>➕ Adaugă lucrare{g.persoanaNume?' pentru '+g.persoanaNume:''}</button>
          </div>
        );
      })}
      <button onClick={add} disabled={etaje.length===0} className="text-xs px-3 py-1.5 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă persoană / apartament</button>
      {etaje.length===0 && <span className="text-[11px] ml-2" style={{ color:'var(--muted2)' }}>Adaugă întâi etaje/apartamente la „🏢 Structură".</span>}
    </div>
  );
}

// 🎤 Completare raport cu AI: electricianul spune ce a făcut, AI-ul desprinde lucrările,
// materialele și orele, iar apoi TU confirmi ce se pune în raport. Nu scrie nimic fără confirmare.
function AIRaportPanel({ echipaNume, materialeSugestii, onAplica }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [deschis, setDeschis] = useState(false);
  const [text, setText] = useState('');
  const [asc, setAsc] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [rez, setRez] = useState(null);   // ce a înțeles AI-ul
  const [bif, setBif] = useState({ lucrari:true, materiale:true, persoane:true, explicatii:true });
  const recRef = useRef(null);
  const speechOK = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const dicteaza = () => {
    if (asc && recRef.current) { try { recRef.current.stop(); } catch {} return; }
    if (!speechOK) { setErr('Dictarea nu merge în acest browser. Poți folosi microfonul de pe tastatura telefonului (lângă bara de spațiu) și să scrii în căsuță.'); return; }
    try {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new R();
      rec.lang = 'ro-RO'; rec.interimResults = true; rec.continuous = true;
      let final = text ? text.trim() + ' ' : '';
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const tr = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += tr + ' '; else interim += tr;
        }
        setText((final + interim).trim());
      };
      rec.onerror = () => setAsc(false);
      rec.onend = () => { setAsc(false); recRef.current = null; };
      recRef.current = rec; setErr(''); setAsc(true); rec.start();
    } catch (_) { setErr('Nu am putut porni dictarea.'); setAsc(false); }
  };

  const analizeaza = async () => {
    if (!text.trim()) return;
    setBusy(true); setErr(''); setRez(null);
    const instr =
      'Ești asistentul unei firme de instalații electrice din România. Din descrierea de mai jos, spusă de un electrician la finalul zilei, extrage datele pentru raportul zilnic.\n' +
      'Răspunde DOAR cu JSON valid, fără explicații și fără marcaje de cod. Structura exactă:\n' +
      '{"lucrari":["..."],"materiale":[{"denumire":"...","cantitate":0,"um":"buc"}],"persoane":[{"nume":"...","ore":0}],"explicatii":"...","intrebari":["..."]}\n' +
      'Reguli: NU inventa nimic. Dacă o informație nu e spusă, las-o pe lista goală. Cantitățile doar dacă sunt spuse clar. ' +
      'La „um" folosește unitatea potrivită (buc, m, ml, kg, set). La „persoane.nume" folosește exact numele din lista echipei, dacă se potrivește. ' +
      'La „explicatii" pune un rezumat scurt, de o frază, al zilei. La „intrebari" pune întrebări scurte pentru ce lipsește (de ex. orele lucrate), maximum 3.\n' +
      (echipaNume && echipaNume.length ? ('Echipa șantierului: ' + echipaNume.join(', ') + '.\n') : '') +
      (materialeSugestii && materialeSugestii.length ? ('Materiale folosite de obicei: ' + materialeSugestii.slice(0,40).join(', ') + '.\n') : '') +
      '\nDescriere: ' + text.trim();
    try {
      const r = await authFetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ intrebare: instr, context: [] }) });
      let d = {}; try { d = await r.json(); } catch {}
      if (!r.ok || !d || !d.raspuns) {
        if (r.status === 404) setErr('AI-ul nu e activat pe server (lipsește ruta /api/ai).');
        else if (r.status === 500) setErr('AI-ul nu e configurat: lipsește cheia GEMINI_API_KEY în Vercel.');
        else setErr((d && d.error) ? d.error : 'AI indisponibil momentan.');
        setBusy(false); return;
      }
      let brut = String(d.raspuns).trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
      const i1 = brut.indexOf('{'), i2 = brut.lastIndexOf('}');
      if (i1 >= 0 && i2 > i1) brut = brut.slice(i1, i2 + 1);
      let obj = null;
      try { obj = JSON.parse(brut); } catch (_) {}
      if (!obj) { setErr('AI-ul a răspuns, dar nu am putut citi datele. Încearcă să spui mai simplu.'); setBusy(false); return; }
      setRez({
        lucrari: Array.isArray(obj.lucrari) ? obj.lucrari.filter((x)=>String(x||'').trim()) : [],
        materiale: Array.isArray(obj.materiale) ? obj.materiale.filter((m)=>m && String(m.denumire||'').trim()) : [],
        persoane: Array.isArray(obj.persoane) ? obj.persoane.filter((p)=>p && String(p.nume||'').trim()) : [],
        explicatii: String(obj.explicatii || '').trim(),
        intrebari: Array.isArray(obj.intrebari) ? obj.intrebari.filter((x)=>String(x||'').trim()).slice(0,3) : [],
      });
    } catch (_) { setErr('Fără conexiune la AI.'); }
    setBusy(false);
  };

  const aplica = () => {
    if (!rez) return;
    onAplica({
      lucrari: bif.lucrari ? rez.lucrari : [],
      materiale: bif.materiale ? rez.materiale : [],
      persoane: bif.persoane ? rez.persoane : [],
      explicatii: bif.explicatii ? rez.explicatii : '',
    });
    setRez(null); setText(''); setDeschis(false);
  };

  if (!deschis) {
    return (
      <button onClick={()=>setDeschis(true)} className="text-xs px-3 py-2 rounded-lg font-semibold mb-3" style={{ color:'#14181C', background:'#C08CE0' }}>
        🎤 Completează cu AI (spune ce ai făcut)
      </button>
    );
  }

  return (
    <div className="rounded-xl p-3 mb-3" style={{ background:'var(--panel2)', border:'1px solid #C08CE066' }}>
      <div className="flex items-center justify-between mb-1.5 gap-2">
        <span className="text-sm font-semibold" style={{ color:'#C08CE0' }}>🎤 Completează cu AI</span>
        <button onClick={()=>{ setDeschis(false); setRez(null); setErr(''); }} style={{ color:'var(--muted2)' }}>✕</button>
      </div>
      <p className="text-[11px] mb-2" style={{ color:'var(--muted)' }}>Apeși „Vorbește" și spui pe scurt ce ați făcut azi: lucrările, materialele și cine a lucrat, cu orele. Apoi AI-ul completează raportul, iar tu confirmi.</p>

      <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={3} placeholder="Ex: azi am tras cabluri la prize în bucătărie și am montat 6 doze, am fost eu cu Nicu 8 ore fiecare, am folosit 40 de metri de cablu 3x2.5" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />

      <div className="flex flex-wrap gap-2">
        <button onClick={dicteaza} className="text-xs px-3 py-2 rounded-lg font-semibold" style={{ color: asc?'#fff':'var(--text)', background: asc?'#E05252':'var(--panel)', border:'1px solid var(--border)' }}>{asc ? '⏹ Gata, am terminat' : '🎤 Vorbește'}</button>
        <button onClick={analizeaza} disabled={busy || !text.trim()} className="text-xs px-3 py-2 rounded-lg font-semibold disabled:opacity-50" style={{ color:'#14181C', background:'#C08CE0' }}>{busy ? 'Se citește…' : '✨ Completează raportul'}</button>
        {text && <button onClick={()=>{ setText(''); setRez(null); }} className="text-xs px-3 py-2 rounded-lg" style={{ color:'var(--muted)' }}>Șterge</button>}
      </div>
      {asc && <div className="text-[11px] mt-1.5" style={{ color:'#E05252' }}>🔴 Te ascult… vorbește normal, apoi apeși „Gata".</div>}
      {err && <div className="text-[11px] mt-2 px-2.5 py-2 rounded-lg" style={{ color:'#E05252', background:'#E0525215' }}>{err}</div>}

      {rez && (
        <div className="mt-3 rounded-lg p-2.5" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <div className="text-xs font-semibold mb-1.5" style={{ color:'var(--text)' }}>Asta am înțeles — bifează ce să pun în raport:</div>

          {rez.lucrari.length > 0 && (
            <label className="flex items-start gap-2 mb-1.5 cursor-pointer">
              <input type="checkbox" checked={bif.lucrari} onChange={(e)=>setBif({ ...bif, lucrari:e.target.checked })} className="mt-0.5" />
              <span className="text-[11px]" style={{ color:'var(--text)' }}><b>Lucrări:</b> {rez.lucrari.join(' · ')}</span>
            </label>
          )}
          {rez.materiale.length > 0 && (
            <label className="flex items-start gap-2 mb-1.5 cursor-pointer">
              <input type="checkbox" checked={bif.materiale} onChange={(e)=>setBif({ ...bif, materiale:e.target.checked })} className="mt-0.5" />
              <span className="text-[11px]" style={{ color:'var(--text)' }}><b>Materiale:</b> {rez.materiale.map((m)=>`${m.denumire}${m.cantitate?` ${m.cantitate} ${m.um||''}`:''}`).join(' · ')}</span>
            </label>
          )}
          {rez.persoane.length > 0 && (
            <label className="flex items-start gap-2 mb-1.5 cursor-pointer">
              <input type="checkbox" checked={bif.persoane} onChange={(e)=>setBif({ ...bif, persoane:e.target.checked })} className="mt-0.5" />
              <span className="text-[11px]" style={{ color:'var(--text)' }}><b>Cine a lucrat:</b> {rez.persoane.map((p)=>`${p.nume}${p.ore?` ${p.ore}h`:''}`).join(' · ')}</span>
            </label>
          )}
          {rez.explicatii && (
            <label className="flex items-start gap-2 mb-1.5 cursor-pointer">
              <input type="checkbox" checked={bif.explicatii} onChange={(e)=>setBif({ ...bif, explicatii:e.target.checked })} className="mt-0.5" />
              <span className="text-[11px]" style={{ color:'var(--text)' }}><b>Rezumat:</b> {rez.explicatii}</span>
            </label>
          )}
          {rez.lucrari.length === 0 && rez.materiale.length === 0 && rez.persoane.length === 0 && !rez.explicatii && (
            <div className="text-[11px]" style={{ color:'var(--muted2)' }}>Nu am înțeles date concrete. Spune mai clar ce ați lucrat, ce materiale ați pus și câte ore.</div>
          )}

          {rez.intrebari.length > 0 && (
            <div className="mt-2 px-2.5 py-2 rounded-lg" style={{ background:'#E9A23B15', border:'1px solid #E9A23B40' }}>
              <div className="text-[11px] font-semibold mb-0.5" style={{ color:'#E9A23B' }}>❓ Mai am nevoie să știu:</div>
              {rez.intrebari.map((q,i)=><div key={i} className="text-[11px]" style={{ color:'var(--text)' }}>• {q}</div>)}
              <div className="text-[10px] mt-1" style={{ color:'var(--muted2)' }}>Poți răspunde în căsuța de sus și apăsa din nou „Completează raportul", sau completezi manual după.</div>
            </div>
          )}

          <div className="flex gap-2 mt-2">
            <button onClick={aplica} className="text-xs px-3 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✓ Pune în raport</button>
            <button onClick={()=>setRez(null)} className="text-xs px-3 py-2 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
          </div>
          <div className="text-[10px] mt-1.5" style={{ color:'var(--muted2)' }}>Verifică datele înainte de a salva raportul — AI-ul poate greși.</div>
        </div>
      )}
    </div>
  );
}

function RaportForm({ initial, etape, echipaPermisa, echipaNume, materials, materialeLista, pozitii, structura, structuraSantier, setStructuraSantier, persist, santierId, mod, isManager, concedii, onCancel, onSave }) {
  const modR = mod || 'orar';
  const arePozitii = modR==='pozitie_propriu' || modR==='pozitie_client';
  const areMateriale = modR==='pozitie_propriu' || modR==='real_executat';
  // Dacă șantierul are structură (etaje/apartamente), materialele și pozițiile se trec
  // individual la „Lucrări pe apartamente" — nu mai dublăm cu rubrici separate.
  const areStructura = !!(structura && structura.length > 0);
  const [showStructEdit, setShowStructEdit] = useState(false);
  const [data, setData] = useState(initial?.data || new Date().toISOString().slice(0,10));
  const [oraInceput, setOraInceput] = useState(initial?.oraInceput || '08:00');
  const [oraSfarsit, setOraSfarsit] = useState(initial?.oraSfarsit || '17:00');
  const [etapaId, setEtapaId] = useState(initial?.etapaId || '');
  const [persoane, setPersoane] = useState(initial?.persoane || []);
  const [explicatii, setExplicatii] = useState(initial?.explicatii || '');
  const [materialeFolosite, setMaterialeFolosite] = useState(initial?.materialeFolosite || []);
  const [pozitiiExecutate, setPozitiiExecutate] = useState(initial?.pozitiiExecutate || []);
  const [tipuriLucrari, setTipuriLucrari] = useState(initial?.tipuriLucrari || []);
  const [lucrariApartamente, setLucrariApartamente] = useState(()=>normalizeLucrariApart(initial?.lucrariApartamente || []));
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const totalOreMin = persoane.reduce((s,p)=>s+personMinutes(p),0);

  // Ce a înțeles AI-ul din vorbele electricianului se toarnă în câmpurile raportului.
  const aplicaAI = ({ lucrari, materiale, persoane: pers, explicatii: expl }) => {
    if (lucrari && lucrari.length) {
      const exist = new Set(tipuriLucrari.map((t)=>String(t.denumire||'').toLowerCase().trim()));
      const noi = lucrari.filter((l)=>!exist.has(String(l).toLowerCase().trim())).map((l)=>({ id: uid(), denumire: String(l) }));
      if (noi.length) setTipuriLucrari([...tipuriLucrari, ...noi]);
    }
    if (materiale && materiale.length) {
      const noiM = materiale.map((m)=>({ id: uid(), denumire: String(m.denumire||''), cantitate: Number(m.cantitate) || '', um: String(m.um || 'buc') }));
      setMaterialeFolosite([...materialeFolosite, ...noiM]);
    }
    if (pers && pers.length) {
      const exist = new Set(persoane.map((p)=>String(p.nume||'').toLowerCase().trim()));
      const noiP = [];
      pers.forEach((p)=>{
        const nume = String(p.nume||'').trim();
        if (!nume || exist.has(nume.toLowerCase())) return;
        const ore = Number(p.ore) || 0;
        let sf = oraSfarsit;
        if (ore > 0) { // orele spuse → oră de sfârșit calculată din ora de început (+1h pauză peste 6h)
          const [h, mi] = String(oraInceput || '08:00').split(':').map(Number);
          const total = h * 60 + (mi || 0) + Math.round(ore * 60) + (ore > 6 ? 60 : 0);
          sf = `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
        }
        noiP.push({ id: uid(), nume, oraInceput: oraInceput || '08:00', oraSfarsit: sf });
      });
      if (noiP.length) setPersoane([...persoane, ...noiP]);
    }
    if (expl) setExplicatii(explicatii ? (explicatii + '\n' + expl) : expl);
  };

  return (
    <div className="rounded-xl p-4 mb-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
      <AIRaportPanel echipaNume={echipaNume} materialeSugestii={(materials||[]).map((m)=>m.denumire).filter(Boolean)} onAplica={aplicaAI} />
      <div className="flex gap-3 mb-2 flex-wrap items-end">
        <div className="text-xs flex flex-col gap-1" style={{ color:'var(--muted)' }}>Data
          <RoCalendarPicker value={data} onChange={setData} />
        </div>
        <div className="text-xs flex flex-col gap-1" style={{ color:'var(--muted)' }}>Ora implicită început
          <RoTimePicker value={oraInceput} onChange={setOraInceput} />
        </div>
        <div className="text-xs flex flex-col gap-1" style={{ color:'var(--muted)' }}>Ora implicită sfârșit
          <RoTimePicker value={oraSfarsit} onChange={setOraSfarsit} />
        </div>
        {etape && etape.length > 0 && (
          <div className="text-xs flex flex-col gap-1" style={{ color:'var(--muted)' }}>Etapă
            <select value={etapaId} onChange={(e)=>setEtapaId(e.target.value)} className="rounded-lg px-3 py-2 text-sm outline-none w-40" style={inputStyle}>
              <option value="">(fără etapă)</option>
              {etape.map((e)=><option key={e.id} value={e.id} style={{ background:'var(--panel)' }}>{e.nume}</option>)}
            </select>
          </div>
        )}
      </div>
      <p className="text-xs mb-2" style={{ color:'var(--muted2)' }}>Orele implicite se aplică persoanelor noi adăugate; fiecare persoană își poate ajusta apoi propriul interval.</p>
      <PersonHoursEditor persoane={persoane} setPersoane={setPersoane} defaultInceput={oraInceput} defaultSfarsit={oraSfarsit} echipaPermisa={echipaPermisa} concedii={concedii} data={data} />
      {arePozitii && !areStructura && pozitii && pozitii.length > 0 && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          <PozitiiExecutateEditor pozitiiExecutate={pozitiiExecutate} setPozitiiExecutate={setPozitiiExecutate} pozitii={pozitii} />
        </div>
      )}
      {areMateriale && !areStructura && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          <MaterialeFolositeEditor materialeFolosite={materialeFolosite} setMaterialeFolosite={setMaterialeFolosite} materials={materials} materialeLista={materialeLista} materialClient={false} pretDinLista={modR==='real_executat'} isManager={isManager} />
        </div>
      )}
      {modR==='orar_lucrari' && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          <TipuriLucrariEditor tipuriLucrari={tipuriLucrari} setTipuriLucrari={setTipuriLucrari} />
        </div>
      )}
      {setStructuraSantier && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="text-sm font-medium" style={{ color:'var(--text)' }}>🏢 Lucrări pe apartamente</div>
            <button type="button" onClick={()=>setShowStructEdit(!showStructEdit)} className="text-xs px-2.5 py-1 rounded-lg" style={{ color:'#2E8BD1', background:'var(--panel2)', border:'1px solid #2E8BD166' }}>{showStructEdit ? 'Ascunde etaje/apart.' : '✎ Etaje / apartamente'}</button>
          </div>
          {areStructura && (areMateriale || arePozitii) && <p className="text-[11px] mb-1.5" style={{ color:'#4CAF7D' }}>ℹ️ Aici treci tot: cine, ce material/poziție, cantitatea și în care apartament. Devizul se face din aceste rânduri — nu mai e nevoie de rubrică separată de materiale/poziții.</p>}
          {showStructEdit && (
            <div className="rounded-lg p-2 mb-2" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
              <SiteStructuraTab santierId={santierId} structuraSantier={structuraSantier} setStructuraSantier={setStructuraSantier} persist={persist} materials={materials} materialeLista={materialeLista} />
            </div>
          )}
          {structura && structura.length > 0 ? (
            <LucrariApartamenteEditor lucrari={lucrariApartamente} setLucrari={setLucrariApartamente} structura={structura} persoane={persoane} echipaNume={echipaNume} pozitii={pozitii} materialeLista={materialeLista} />
          ) : (
            <p className="text-xs" style={{ color:'var(--muted2)' }}>Adaugă etaje/apartamente cu butonul „✎ Etaje / apartamente" de sus, apoi poți nota cine a lucrat unde.</p>
          )}
        </div>
      )}
      <textarea placeholder="Alte observații (opțional)..." value={explicatii} onChange={(e)=>setExplicatii(e.target.value)} rows={2} className="w-full rounded-lg px-3 py-2 text-sm outline-none mt-3" style={inputStyle} />
      <div className="flex justify-between items-center mt-3">
        <span className="text-sm" style={{ color:'var(--muted)' }}>Total ore: <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(totalOreMin)}</span></span>
        <div className="flex gap-2">
          <button onClick={onCancel} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
          <button onClick={()=>onSave({ id: initial?.id || uid(), data, oraInceput, oraSfarsit, etapaId, persoane, materialeFolosite, pozitiiExecutate, tipuriLucrari, lucrariApartamente, explicatii })} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
        </div>
      </div>
    </div>
  );
}

function SiteStructuraTab({ santierId, structuraSantier, setStructuraSantier, persist, onBack, rapoarte, materials, materialeLista }) {
  const normM = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const optiuniMat = (()=>{
    const seen = new Set(), out = [];
    const push = (key, denumire, um)=>{ const k=normM(denumire); if(denumire && !seen.has(k)){ seen.add(k); out.push({ key, label:denumire, um }); } };
    (materialeLista||[]).forEach((m)=>push('l'+m.id, m.denumire, m.um));
    (materials||[]).filter((m)=>!m.arhivat).forEach((m)=>push('c'+m.id, m.denumire, m.um));
    // materiale deja introduse în structura acestui șantier → devin sugestii chiar fără import
    (structuraSantier||[]).filter((e)=>e.santierId===santierId).forEach((e)=>{
      (e.apartamente||[]).forEach((a)=>{ (a.materiale||[]).forEach((m)=>push('s'+m.id, m.denumire, m.um)); });
    });
    return out;
  })();
  const lucrariApart = (apId) => {
    const out = [];
    (rapoarte || []).filter((r)=>r.santierId===santierId).forEach((r)=>{
      (r.lucrariApartamente || []).forEach((l)=>{
        if (!(l.apartamenteIds || []).includes(apId)) return;
        const works = lucrariDinRand(l);
        if (!works.length && l.persoanaNume) { out.push({ data:r.data, persoanaNume:l.persoanaNume, tipLucrare:'', cantitate:'', um:'', ore:l.ore }); return; }
        works.forEach((w,idx)=> out.push({ data:r.data, persoanaNume:l.persoanaNume, tipLucrare:w.denumire, cantitate:w.cantitate, um:w.um, ore: idx===0?l.ore:'' }));
      });
    });
    return out.sort((a,b)=> a.data<b.data?1:-1);
  };
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  // Sortare după NUMĂRUL din nume, indiferent cum e scris prefixul ("Et.2", "Etaj 2", "et2" → toate = 2).
  // Fără număr (Parter, Subsol, Demisol) → înaintea etajelor numerotate. Ordinea iese 1,2,3...10 corect.
  const numDin = (s) => { const m = String(s||'').match(/-?\d+/); return m ? parseInt(m[0], 10) : null; };
  const cmpNume = (a, b) => {
    const na = numDin(a?.nume), nb = numDin(b?.nume);
    if (na === null && nb === null) return String(a?.nume||'').localeCompare(String(b?.nume||''), 'ro', { sensitivity:'base' });
    if (na === null) return -1;
    if (nb === null) return 1;
    if (na !== nb) return na - nb;
    return String(a?.nume||'').localeCompare(String(b?.nume||''), 'ro', { sensitivity:'base' });
  };
  const etaje = structuraSantier.filter((e)=>e.santierId===santierId).slice().sort(cmpNume);
  const [etajNou, setEtajNou] = useState('');
  const [apartNou, setApartNou] = useState({});
  const [openEtaj, setOpenEtaj] = useState({});
  const [selEtaj, setSelEtaj] = useState(null);
  const [showEtaje, setShowEtaje] = useState(false);
  const [matForm, setMatForm] = useState({});
  const [editMatId, setEditMatId] = useState({});
  const [cautare, setCautare] = useState('');
  const norm = (s) => String(s||'').toLowerCase().replace(/[\s.]/g,'');
  // Căutare deșteaptă pe tokeni: "etaj 1" → tot etajul 1; "ap1 etaj 2" → apartamentul 1 de la etajul 2; "ap1" → toate ap. 1.
  const parseCautare = (text) => {
    const floorNums = [], apNums = [], genericNums = [], textTerms = [];
    let pending = null; // ultimul cuvânt-cheie ("etaj" / "ap") așteaptă un număr
    String(text||'').toLowerCase().trim().split(/\s+/).filter(Boolean).forEach((tokRaw)=>{
      const tok = tokRaw.replace(/\./g,'');
      let m;
      if ((m = tok.match(/^(?:ap|apartament|apt)(\d+)$/))) { apNums.push(parseInt(m[1],10)); pending=null; }
      else if ((m = tok.match(/^(?:etaj|et|e)(\d+)$/))) { floorNums.push(parseInt(m[1],10)); pending=null; }
      else if (['etaj','et'].includes(tok)) { pending='floor'; }
      else if (['ap','apartament','apt'].includes(tok)) { pending='ap'; }
      else if (/^\d+$/.test(tok)) {
        const n = parseInt(tok,10);
        if (pending==='floor') floorNums.push(n);
        else if (pending==='ap') apNums.push(n);
        else genericNums.push(n); // număr liber (ex: „401") → caută peste tot, ca subșir
        pending=null;
      }
      else if (tok==='e') { pending='floor'; }
      else { textTerms.push(tok); pending=null; }
    });
    return { floorNums, apNums, genericNums, textTerms };
  };
  const cauta = parseCautare(cautare);
  const areCautare = cauta.floorNums.length>0 || cauta.apNums.length>0 || cauta.genericNums.length>0 || cauta.textTerms.length>0;
  const save = (next) => { setStructuraSantier(next); persist('structuraSantier', next); };
  const getForm = (apId) => matForm[apId] || { denumire:'', cantitate:1, um:'buc', descriere:'' };
  const setApartOre = (etajId, apId, ore) => { save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, ore} : a)} : e)); };

  const addEtaj = () => {
    if (!etajNou.trim()) return;
    save([...structuraSantier, { id: uid(), santierId, nume: etajNou.trim(), apartamente: [] }]);
    setEtajNou('');
  };
  const delEtaj = (id) => { if (!window.confirm('Ștergi acest etaj cu tot ce conține?')) return; save(structuraSantier.filter((e)=>e.id!==id)); };
  const renEtaj = (id, numeVechi) => {
    const nume = window.prompt('Redenumește etajul:', numeVechi);
    if (nume === null || !nume.trim()) return;
    save(structuraSantier.map((e)=> e.id===id ? {...e, nume: nume.trim()} : e));
  };
  const addApart = (etajId) => {
    const nume = (apartNou[etajId]||'').trim();
    if (!nume) return;
    save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:[...(e.apartamente||[]), { id: uid(), nume, materiale: [] }]} : e));
    setApartNou({...apartNou, [etajId]:''});
  };
  const delApart = (etajId, apId) => { if (!window.confirm('Ștergi acest apartament?')) return; save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).filter((a)=>a.id!==apId)} : e)); };
  const renApart = (etajId, apId, numeVechi) => {
    const nume = window.prompt('Redenumește apartamentul:', numeVechi);
    if (nume === null || !nume.trim()) return;
    save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, nume: nume.trim()} : a)} : e));
  };
  const addMat = (etajId, apId) => {
    const f = getForm(apId);
    if (!(f.denumire||'').trim()) return;
    const editing = editMatId[apId];
    if (editing) {
      save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:(a.materiale||[]).map((m)=> m.id===editing ? {...m, denumire:f.denumire.trim(), cantitate:Number(f.cantitate)||0, um:f.um||'buc', descriere:(f.descriere||'').trim()} : m)} : a)} : e));
      setEditMatId({...editMatId, [apId]: null});
    } else {
      const mat = { id: uid(), denumire: f.denumire.trim(), cantitate: Number(f.cantitate)||0, um: f.um||'buc', descriere:(f.descriere||'').trim() };
      save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:[...(a.materiale||[]), mat]} : a)} : e));
    }
    setMatForm({...matForm, [apId]: { denumire:'', cantitate:1, um:'buc', descriere:'' }});
  };
  const startEditMat = (apId, m) => { setMatForm({...matForm, [apId]: { denumire:m.denumire, cantitate:m.cantitate, um:m.um, descriere:m.descriere||'' }}); setEditMatId({...editMatId, [apId]: m.id}); };
  const cancelEditMat = (apId) => { setEditMatId({...editMatId, [apId]: null}); setMatForm({...matForm, [apId]: { denumire:'', cantitate:1, um:'buc', descriere:'' }}); };
  const delMat = (etajId, apId, matId) => { if (!window.confirm('Ștergi acest material?')) return; save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:(a.materiale||[]).filter((m)=>m.id!==matId)} : a)} : e)); };

  const etajeVizibile = etaje.map((e)=>{
    const aps = (e.apartamente || []).slice().sort(cmpNume);
    if (!areCautare) return { e, aps, isOpen: !!openEtaj[e.id], show: true };
    const fnum = numDin(e.nume);
    const floorText = norm(e.nume);
    // filtru explicit pe numărul etajului ("etaj N")
    if (cauta.floorNums.length && (fnum === null || !cauta.floorNums.includes(fnum))) return { e, aps: [], isOpen: true, show: false };
    // etajul însuși se potrivește? (număr liber egal cu nr. etajului sau subșir în nume, ori text liber)
    const floorHit =
      cauta.genericNums.some((n)=> fnum===n || floorText.includes(String(n))) ||
      (cauta.textTerms.length>0 && cauta.textTerms.every((t)=>floorText.includes(t)));
    // predicat pe apartament: numărul liber („401") se potrivește dacă e egal cu nr. ap. SAU apare ca subșir în nume
    const apOut = aps.filter((a)=>{
      const anum = numDin(a.nume), at = norm(a.nume);
      if (cauta.apNums.length && (anum===null || !cauta.apNums.includes(anum))) return false;
      if (cauta.genericNums.length && !cauta.genericNums.some((n)=> anum===n || at.includes(String(n)))) return false;
      if (cauta.textTerms.length && !cauta.textTerms.every((t)=> at.includes(t) || floorText.includes(t))) return false;
      return true;
    });
    // doar „etaj N", fără altă constrângere → arată tot etajul
    if (cauta.floorNums.length && !cauta.apNums.length && !cauta.genericNums.length && !cauta.textTerms.length) return { e, aps, isOpen: true, show: true };
    // etajul se potrivește ca întreg (și nu s-a cerut un apartament anume) → arată tot etajul
    if (floorHit && !cauta.apNums.length) return { e, aps, isOpen: true, show: true };
    return { e, aps: apOut, isOpen: true, show: apOut.length > 0 };
  }).filter((x)=>x.show);

  const activeEtaj = etajeVizibile.find((x)=>x.e.id===selEtaj) || (areCautare ? etajeVizibile[0] : null);

  return (
    <div className="space-y-2">
      {onBack && <button onClick={onBack} className="text-xs" style={{ color:'var(--muted2)' }}>← Înapoi</button>}

      {/* Rând: căutare (stânga) · categoria „Etaje" (dreapta) */}
      <div className="flex items-center gap-2">
        <input placeholder="🔍 Caută" value={cautare} onChange={(e)=>setCautare(e.target.value)} className="rounded-lg px-2.5 py-1.5 text-sm outline-none" style={{ ...inputStyle, width:'110px' }} />
        <button onClick={()=>setShowEtaje(!showEtaje)} className="ml-auto flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-semibold" style={{ color:'var(--text)', background:'var(--panel)', border:'1px solid var(--border)' }}>
          🏢 Etaje <span className="text-xs" style={{ color:'var(--muted2)' }}>({etaje.length})</span>

                  <button onClick={()=>renApart(e.id, a.id, a.nume)} title="Editează" style={{ color:'var(--muted)' }}><Icon size={12}>✎</Icon></button>
                  <button onClick={()=>delApart(e.id, a.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>

              <div className="space-y-1 mb-1.5">

                      <span style={{ color:'var(--text)' }}>{m.denumire} <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{m.cantitate} {m.um}</span></span>

                        <button onClick={()=>startEditMat(a.id, m)} title="Editează" style={{ color:'var(--muted)' }}><Icon size={11}>✎</Icon></button>

                    {m.descriere && <div className="mt-0.5" style={{ color:'var(--muted)' }}>{m.descriere}</div>}

              </div>
              <div className="space-y-1.5">
                <div className="flex gap-1.5">
                  <AutocompleteInput value={f.denumire} onChange={(v)=>setMatForm({...matForm, [a.id]:{...f, denumire:v}})} onPick={(o)=>setMatForm({...matForm, [a.id]:{...f, denumire:o.label, um:o.um||f.um}})} options={optiuniMat} placeholder="Material (caută: doze, tablou, intek...)" minWidth="110px" />
                  <input type="number" value={f.cantitate} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, cantitate:ev.target.value}})} className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <input placeholder="UM" value={f.um} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, um:ev.target.value}})} className="w-12 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                </div>
                <div className="flex gap-1.5">
                  <input placeholder="Descriere (opțional, ex: montaj îngropat)" value={f.descriere} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, descriere:ev.target.value}})} className="flex-1 rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
                  <button onClick={()=>addMat(e.id, a.id)} disabled={!(f.denumire||'').trim()} className="text-xs px-3 py-1.5 rounded-lg font-semibold whitespace-nowrap disabled:opacity-40" style={{ color:'#14181C', background: editMatId[a.id] ? '#E9A23B' : '#4CAF7D' }}>{editMatId[a.id] ? 'Salvează' : 'Adaugă'}</button>
                  {editMatId[a.id] && <button onClick={()=>cancelEditMat(a.id)} className="text-xs px-2 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)' }}>✕</button>}
                </div>
              </div>
              {(()=>{ const ll = lucrariApart(a.id); return ll.length > 0 ? (
                <div className="mt-2 pt-1.5" style={{ borderTop:'1px solid var(--border)' }}>
                  <div className="text-[11px] mb-1" style={{ color:'var(--muted)' }}>👷 Cine a lucrat aici:</div>
                  <div className="space-y-0.5">
                    {ll.map((l,i)=>(
                      <div key={i} className="text-[11px] flex items-center justify-between gap-2">
                        <span style={{ color:'#C08CE0' }}><b style={{ color:'var(--text)' }}>{l.persoanaNume||'?'}</b>{l.tipLucrare?' — '+l.tipLucrare:''}{(Number(l.cantitate)||0)>0?` — ${l.cantitate} ${l.um||''}`.trimEnd():''}</span>
                        <span className="shrink-0" style={{ color:'var(--muted)' }}>{l.ore?l.ore+'h · ':''}{fmtData(l.data)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : null; })()}
            </div>
            );
          })}
        </div>
        );
      })()}
    </div>
  );
}

// Parsează rândurile dintr-un Excel de deviz (Poziții sau Listă cantități).
// Caută rândul de antet (care conține „Denumire") și mapează coloanele; ignoră rândurile TOTAL/TVA.
function parseDevizRows(rows) {
  const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/\s+/g,' ').trim();
  // Acceptă numere din Excel (deja numerice) și text cu format românesc (1.234,56) sau englez (1234.56).
  const num = (v) => {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = String(v == null ? '' : v).trim().replace(/[^\d.,-]/g, '');
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(',', '.');
    const n = Number(s);
    return isFinite(n) ? n : 0;
  };
  const round4 = (n) => Math.round((Number(n)||0) * 10000) / 10000;

  // FORMAT F3 („Listă cu cantități de lucrări"): fiecare articol are prețul pe rânduri separate
  // (material: / manopera: / utilaj:), sub coloana „Cantitatea". Luăm prețul de manoperă.
  const flatCells = rows.flat().map(norm);
  if (flatCells.includes('manopera:') && flatCells.includes('material:')) {
    const hIdx = rows.findIndex((r)=> Array.isArray(r) && r.some((c)=>norm(c).includes('cantit')) && r.some((c)=>norm(c).includes('pret')||norm(c).includes('preț')));
    const hh = hIdx >= 0 ? rows[hIdx].map(norm) : [];
    const fc = (kw) => hh.findIndex((c)=> c && kw.some((k)=>c.includes(k)));
    let umColF = fc(['u.m','u/m','unitate']); if (umColF < 0) umColF = hh.findIndex((c)=> c === 'um');
    const cantColF = fc(['cantit']);
    const pretColF = fc(['pret unitar','preț unitar','pretul unitar','pret','preț']);
    const scorText = (v)=>{ const m = String(v).match(/[a-zăâîșț]/g); return m ? m.length : 0; };
    const denOf = (r)=>{ let best='', bs=-1; const lim = umColF > 0 ? umColF : r.length; for (let c=1;c<lim;c++){ const v=r[c]; if (typeof v!=='string' || !v.trim()) continue; const sc=scorText(v); if (sc>bs || (sc===bs && v.trim().length>best.length)) { bs=sc; best=v.trim(); } } return best; };
    const items = []; let cur = null;
    rows.forEach((r,i)=>{
      if (!Array.isArray(r) || i <= hIdx) return;
      const umv = String(r[umColF]==null?'':r[umColF]).trim();
      const den = denOf(r);
      const lbl = norm(r[cantColF]);
      if (umv && den && den.length > 3) {
        if (cur) items.push(cur);
        cur = { nrCrt:String(r[0]==null?'':r[0]).trim(), denumire:den.replace(/\s+/g,' '), um:umv, cantitate:0, pretUnitar:0, valoare:0, _mat:0 };
      } else if (cur) {
        if (lbl==='manopera:' || lbl==='manopera') cur.pretUnitar = round4(num(r[pretColF]));
        else if (lbl==='material:' || lbl==='material') cur._mat = round4(num(r[pretColF]));
      }
    });
    if (cur) items.push(cur);
    items.forEach((o)=>{ if (!(o.pretUnitar>0) && o._mat>0) o.pretUnitar = o._mat; delete o._mat; });
    return items;
  }

  // 1) Găsim rândul de antet: rândul cu cel puțin 2 cuvinte-cheie de coloană
  //    (unele Excel-uri au titluri/antet firmă deasupra, iar coloana „Denumire" poate fi fără titlu).
  const headerKw = ['denumire','descriere','articol','unitate','u.m','u/m','cantit','pret','preț','p.u','valoare','total','nr.'];
  let headerIdx = rows.findIndex((r)=> Array.isArray(r) && r.filter((c)=>{ const n = norm(c); return n && headerKw.some((k)=>n.includes(k)); }).length >= 2);
  const h = headerIdx >= 0 ? rows[headerIdx].map(norm) : [];
  const findCol = (kw) => h.findIndex((c)=> c && kw.some((k)=>c.includes(k)));
  let den = findCol(['denumire','descriere','articol']);
  let um = (()=>{ let i = findCol(['unitate','u.m','u/m']); if (i < 0) i = h.findIndex((c)=> c === 'um' || c === 'u m'); return i; })();
  let pret = findCol(['pret unitar','preț unitar','pret','preț','p.u','unitar','manoper']);
  let nr = findCol(['nr']);
  const idxCant = findCol(['cantit']);
  const idxTotal = findCol(['total']);
  const idxVal = findCol(['valoare']);
  const dataStart = (headerIdx >= 0 ? headerIdx : -1) + 1;
  const sample = rows.slice(dataStart, dataStart + 15).filter(Array.isArray);
  // Dacă „Denumire" n-are titlu, o găsim ca fiind coloana cu cel mai lung text din primele rânduri.
  if (den < 0) {
    let best = -1, bestLen = 0; const ncols = Math.max(0, ...sample.map((r)=>r.length));
    for (let c = 0; c < ncols; c++) {
      if (c === um || c === pret) continue;
      let len = 0, cnt = 0;
      sample.forEach((r)=>{ const v = r[c]; if (typeof v === 'string' && v.trim()) { len += v.trim().length; cnt++; } });
      const avg = cnt ? len / cnt : 0;
      if (avg > bestLen) { bestLen = avg; best = c; }
    }
    den = best >= 0 ? best : 1;
  }
  if (um < 0) um = den + 1;
  if (nr < 0) nr = 0;
  if (pret < 0) pret = (idxVal >= 0 && idxVal !== idxTotal) ? idxVal : -1;
  // Dacă nu există coloană U.M. reală și „um" a nimerit peste coloana de preț → n-o folosim (default „buc").
  if (um >= 0 && (um === pret || um === idxCant)) um = -1;
  const cantCol = idxCant; // dacă nu există coloană „cantitate" (ex: cantități pe etaje) → 0, se completează din rapoarte
  const valCol = idxTotal >= 0 ? idxTotal : (idxVal >= 0 ? idxVal : -1);
  const out = [];
  rows.slice(dataStart).forEach((r)=>{
    if (!Array.isArray(r)) return;
    const den0 = r[den];
    if (!den0 || !String(den0).trim()) return;
    const denStr = String(den0).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
    if (/^(total|tva|subtotal|total cu tva)/i.test(denStr)) return;
    const umStr = String(r[um] == null ? '' : r[um]).trim();
    const pretV = pret >= 0 ? num(r[pret]) : 0;
    // Rând de secțiune (ex: „1.TABLOURI ELECTRICE"): fără U.M. și fără preț → îl sărim.
    if (!umStr && !(pretV > 0)) return;
    const cantV = cantCol >= 0 ? num(r[cantCol]) : 0;
    out.push({
      nrCrt: String(r[nr] == null ? '' : r[nr]).trim(),
      denumire: denStr,
      um: umStr || 'buc',
      cantitate: round4(cantV),
      pretUnitar: round4(pretV),
      valoare: round4(valCol >= 0 ? num(r[valCol]) : (cantV * pretV)),
    });
  });
  return out;
}

function SiteDevizPozTab({ santierId, pozitiiSantier, setPozitiiSantier, materialeListaSantier, setMaterialeListaSantier, persist, isManager }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [innerTab, setInnerTab] = useState('pozitii');
  const [editId, setEditId] = useState(null);
  const [editRow, setEditRow] = useState({});
  const [addRow, setAddRow] = useState({ denumire:'', um:'buc', cantitate:'', pretUnitar:'' });
  const [sheetPick, setSheetPick] = useState(null);
  const isPoz = innerTab === 'pozitii';
  const lista = isPoz ? (pozitiiSantier || []) : (materialeListaSantier || []);
  const setLista = isPoz ? setPozitiiSantier : setMaterialeListaSantier;
  const cheie = isPoz ? 'pozitiiSantier' : 'materialeListaSantier';
  const items = lista.filter((x)=>x.santierId===santierId);
  const [cautaLista, setCautaLista] = useState('');
  const [showAllLista, setShowAllLista] = useState(false);
  const LIM_LISTA = 8;
  const qLista = cautaLista.trim().toLowerCase();
  const filtrate = qLista ? items.filter((x)=> String(x.denumire||'').toLowerCase().includes(qLista) || String(x.um||'').toLowerCase().includes(qLista)) : items;
  const vizibile = (qLista || showAllLista) ? filtrate : filtrate.slice(0, LIM_LISTA);
  const gridCols = isManager ? '24px 1fr 42px 52px 64px 70px 44px' : '24px 1fr 42px 52px 44px';
  const save = (nextAll) => { setLista(nextAll); persist(cheie, nextAll); };
  const totalVal = items.reduce((s,x)=> s + ((Number(x.cantitate)||0) * (Number(x.pretUnitar)||0)), 0);

  const importaFoaia = (wb, sheetName) => {
    try {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
      const parsed = parseDevizRows(rows);
      if (!parsed.length) { window.alert(`Foaia „${sheetName}" nu are rânduri valide (denumire + preț). Alege altă foaie.`); return; }
      const flatC = rows.flat().map((c)=>String(c==null?'':c).toLowerCase().replace(/\s+/g,' ').trim());
      const esteF3 = flatC.includes('manopera:') && flatC.includes('material:');
      const cuPret = parsed.filter((p)=>Number(p.pretUnitar)>0).length;
      const info = `Foaia „${sheetName}" · format ${esteF3?'F3 (manoperă pe rânduri)':'simplu'}\n${parsed.length} rânduri · ${cuPret} cu preț · cantitatea rămâne goală (se completează din rapoarte).`;
      if (items.length && !window.confirm(`${info}\n\nÎnlocuiești lista curentă (${items.length} rânduri) cu cele ${parsed.length} din Excel?`)) return;
      const rest = lista.filter((x)=>x.santierId!==santierId);
      save([...rest, ...parsed.map((p)=>({ ...p, id: uid(), santierId }))]);
      setSheetPick(null);
      if (!items.length) window.alert(info);
    } catch (err) { window.alert('Nu am putut citi foaia. Verifică formatul (.xlsx).'); }
  };
  const importExcel = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });
        if (wb.SheetNames.length > 1) { setSheetPick({ wb, names: wb.SheetNames }); return; }
        importaFoaia(wb, wb.SheetNames[0]);
      } catch (err) { window.alert('Nu am putut citi fișierul Excel. Verifică formatul (.xlsx).'); }
    };
    reader.readAsArrayBuffer(file);
  };
  const startEdit = (x) => { setEditId(x.id); setEditRow({ denumire:x.denumire, um:x.um, cantitate:x.cantitate, pretUnitar:x.pretUnitar, nrCrt:x.nrCrt }); };
  const saveEdit = () => { save(lista.map((x)=> x.id===editId ? { ...x, ...editRow, cantitate:Number(editRow.cantitate)||0, pretUnitar:Number(editRow.pretUnitar)||0 } : x)); setEditId(null); };
  const delRow = (id) => { if (!window.confirm('Ștergi acest rând?')) return; save(lista.filter((x)=>x.id!==id)); };
  const addNew = () => {
    if (!addRow.denumire.trim()) return;
    const nou = { id: uid(), santierId, nrCrt: String(items.length+1), denumire: addRow.denumire.trim(), um: addRow.um||'buc', cantitate:Number(addRow.cantitate)||0, pretUnitar:Number(addRow.pretUnitar)||0 };
    save([...lista, nou]);
    setAddRow({ denumire:'', um:'buc', cantitate:'', pretUnitar:'' });
  };
  const golesteTot = () => { if (!window.confirm('Ștergi toată lista de la acest șantier?')) return; save(lista.filter((x)=>x.santierId!==santierId)); };

  return (
    <div className="space-y-2">
      <div className="grid grid-cols-2 gap-2">
        <button onClick={()=>setInnerTab('pozitii')} className="text-sm px-3 py-2 rounded-lg font-semibold" style={{ color: isPoz?'#14181C':'var(--muted1)', background: isPoz?'#2E8BD1':'var(--panel2)', border:'1px solid var(--border)' }}>📋 Poziții</button>
        <button onClick={()=>setInnerTab('materiale')} className="text-sm px-3 py-2 rounded-lg font-semibold" style={{ color: !isPoz?'#14181C':'var(--muted1)', background: !isPoz?'#2E8BD1':'var(--panel2)', border:'1px solid var(--border)' }}>🧱 Listă cantități (materiale)</button>
      </div>

      {isManager && (
      <div className="rounded-lg p-2.5 flex items-center gap-2 flex-wrap" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <label className="text-xs px-3 py-2 rounded-lg font-semibold cursor-pointer" style={{ color:'#14181C', background:'#4CAF7D' }}>
          📥 Importă din Excel
          <input type="file" accept=".xlsx,.xls" onChange={(e)=>{ importExcel(e.target.files[0]); e.target.value=''; }} style={{ display:'none' }} />
        </label>
        {items.length > 0 && <button onClick={golesteTot} className="text-xs px-3 py-2 rounded-lg" style={{ color:'#E05252', background:'var(--panel2)' }}>🗑 Golește lista</button>}
        <span className="text-[11px] w-full" style={{ color:'var(--muted2)' }}>Coloane așteptate: Nr. crt · Denumire · U.M. · Cantitate · Preț unitar · Valoare. Importul înlocuiește lista curentă a acestui șantier.</span>
        {sheetPick && (
          <div className="w-full rounded-lg p-2.5 mt-1" style={{ background:'var(--panel2)', border:'1px solid #E9A23B66' }}>
            <div className="text-xs mb-2" style={{ color:'var(--text)' }}>📑 Fișierul are mai multe foi. Alege foaia de importat:</div>
            <div className="flex flex-wrap gap-2">
              {sheetPick.names.map((n)=>(
                <button key={n} onClick={()=>importaFoaia(sheetPick.wb, n)} className="text-xs px-3 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>📄 {n}</button>
              ))}
              <button onClick={()=>setSheetPick(null)} className="text-xs px-3 py-2 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)' }}>Renunță</button>
            </div>
          </div>
        )}
      </div>
      )}

      {items.length > 0 && (
        <div className="flex items-center gap-2 flex-wrap">
          <input value={cautaLista} onChange={(e)=>setCautaLista(e.target.value)} placeholder={`🔍 Caută în ${isPoz?'poziții':'materiale'} (ex: doze, cablu...)`} className="flex-1 min-w-[160px] rounded-lg px-2.5 py-1.5 text-sm outline-none" style={inputStyle} />
          <span className="text-[11px]" style={{ color:'var(--muted2)' }}>{qLista ? `${filtrate.length} din ${items.length}` : `${items.length} rânduri`}</span>
        </div>
      )}

      {items.length === 0 ? (
        <div className="text-center py-8 text-sm" style={{ color:'var(--muted)' }}>{isManager ? `Nicio ${isPoz?'poziție':'listă de materiale'} încă. Importă din Excel sau adaugă manual mai jos.` : 'Nimic adăugat încă la acest șantier.'}</div>
      ) : filtrate.length === 0 ? (
        <div className="text-center py-6 text-sm" style={{ color:'var(--muted)' }}>Niciun rezultat pentru „{cautaLista}".</div>
      ) : (
        <div className="rounded-lg overflow-hidden" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <div className="grid gap-1 px-2 py-1.5 text-[10px] uppercase tracking-wide" style={{ gridTemplateColumns:gridCols, color:'var(--muted)', background:'var(--panelA)' }}>
            <span>Nr</span><span>Denumire</span><span>U.M.</span><span>Cant.</span>{isManager && <span>Preț</span>}{isManager && <span>Valoare</span>}<span></span>
          </div>
          {vizibile.map((x, i)=> editId===x.id ? (
            <div key={x.id} className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1px solid var(--border)', background:'var(--panelA)' }}>
              <span className="text-[11px]" style={{ color:'var(--muted2)' }}>{i+1}</span>
              <input value={editRow.denumire} onChange={(e)=>setEditRow({...editRow, denumire:e.target.value})} className="rounded px-1.5 py-1 text-xs outline-none" style={inputStyle} />
              <input value={editRow.um} onChange={(e)=>setEditRow({...editRow, um:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />
              <input type="number" value={editRow.cantitate} onChange={(e)=>setEditRow({...editRow, cantitate:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />
              {isManager && <input type="number" value={editRow.pretUnitar} onChange={(e)=>setEditRow({...editRow, pretUnitar:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />}
              {isManager && <span className="text-xs text-right" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money((Number(editRow.cantitate)||0)*(Number(editRow.pretUnitar)||0))}</span>}
              <div className="flex items-center gap-1.5 justify-end">
                <button onClick={saveEdit} style={{ color:'#4CAF7D' }}>✓</button>
                <button onClick={()=>setEditId(null)} style={{ color:'var(--muted)' }}>✕</button>
              </div>
            </div>
          ) : (
            <div key={x.id} className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1px solid var(--border)' }}>
              <span className="text-[11px]" style={{ color:'var(--muted2)' }}>{i+1}</span>
              <span className="text-xs truncate" style={{ color:'var(--text)' }}>{x.denumire}</span>
              <span className="text-[11px] text-center" style={{ color:'var(--muted)' }}>{x.um}</span>
              <span className="text-xs text-center" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{x.cantitate}</span>
              {isManager && <span className="text-xs text-center" style={{ color:'var(--muted)', fontFamily:"'JetBrains Mono', monospace" }}>{x.pretUnitar}</span>}
              {isManager && <span className="text-xs text-right" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money((Number(x.cantitate)||0)*(Number(x.pretUnitar)||0))}</span>}
              <div className="flex items-center gap-1.5 justify-end shrink-0">
                <button onClick={()=>startEdit(x)} title="Editează" style={{ color:'var(--muted)' }}><Icon size={11}>✎</Icon></button>
                <button onClick={()=>delRow(x.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={11}>🗑</Icon></button>
              </div>
            </div>
          ))}
          {isManager && (
          <div className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1.5px solid var(--border)', background:'var(--panelA)' }}>
            <span></span><span className="text-xs font-semibold" style={{ color:'var(--text)' }}>TOTAL (fără TVA)</span><span></span><span></span><span></span>
            <span className="text-xs text-right font-semibold" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(totalVal)}</span><span></span>
          </div>
          )}
          {!qLista && filtrate.length > LIM_LISTA && (
            <button onClick={()=>setShowAllLista(!showAllLista)} className="w-full text-xs py-2 font-medium" style={{ color:'#2E8BD1', background:'var(--panelA)', borderTop:'1px solid var(--border)' }}>
              {showAllLista ? '▲ Restrânge' : `▼ Arată toate (${filtrate.length})`}
            </button>
          )}
        </div>
      )}

      <div className="rounded-lg p-2.5" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="text-xs mb-1.5" style={{ color:'var(--muted)' }}>Adaugă manual un rând:</div>
        <div className="flex gap-1.5 flex-wrap">
          <input placeholder={isPoz?'Denumire poziție':'Denumire material'} value={addRow.denumire} onChange={(e)=>setAddRow({...addRow, denumire:e.target.value})} className="flex-1 min-w-[140px] rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
          <input placeholder="U.M." value={addRow.um} onChange={(e)=>setAddRow({...addRow, um:e.target.value})} className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
          <input type="number" placeholder="Cant." value={addRow.cantitate} onChange={(e)=>setAddRow({...addRow, cantitate:e.target.value})} className="w-16 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
          {isManager && <input type="number" placeholder="Preț" value={addRow.pretUnitar} onChange={(e)=>setAddRow({...addRow, pretUnitar:e.target.value})} className="w-16 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />}
          <button onClick={addNew} disabled={!addRow.denumire.trim()} className="text-xs px-3 py-1.5 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă</button>
        </div>
      </div>
    </div>
  );
}

function SantiereTab({ santiere, setSantiere, rapoarte, setRapoarte, etape, setEtape, persist, company, materials, clients, concedii, cereriAlocare, setCereriAlocare, sculeSantier, setSculeSantier, cereriSantier, setCereriSantier, miscariSantier, setMiscariSantier, problemeSantier, setProblemeSantier, planseSantier, setPlanseSantier, mediaSantier, setMediaSantier, structuraSantier, setStructuraSantier, pozitiiSantier, setPozitiiSantier, materialeListaSantier, setMaterialeListaSantier, checklistSantier, setChecklistSantier, checklistConfirmari, setChecklistConfirmari, checklistSablon, setChecklistSablon, onExportToDeviz, onExportMaterialeFolosite, onCerereMaterial, currentUser, pendingSiteNav, setPendingSiteNav }) {
  const [form, setForm] = useState(null);
  const [selected, setSelected] = useState(null);
  const [quickForm, setQuickForm] = useState(null); // angajat: creare rapidă șantier (doar nume + adresă)
  const [reportForm, setReportForm] = useState(null);
  const [exportFrom, setExportFrom] = useState('');
  const [exportTo, setExportTo] = useState('');
  const [etapaTab, setEtapaTab] = useState('toate');
  const [etapaNoua, setEtapaNoua] = useState('');
  const [siteSearch, setSiteSearch] = useState('');
  const [siteView, setSiteView] = useState('__closed__');
  // Istoric de navigare între sub-taburi (Materiale, Structură, Scule...) pentru back pas cu pas.
  const [viewHistory, setViewHistory] = useState([]);
  const [viewForward, setViewForward] = useState([]);
  const navTo = (v) => { if (v !== siteView) { setViewHistory((h)=>[...h, siteView]); setViewForward([]); } setSiteView(v); };
  const goBack = () => {
    if (viewHistory.length) { const prev = viewHistory[viewHistory.length-1]; setViewHistory(viewHistory.slice(0,-1)); setViewForward((f)=>[siteView, ...f]); setSiteView(prev); }
    else { setSelected(null); }
  };
  const goForward = () => {
    if (viewForward.length) { const nx = viewForward[0]; setViewForward(viewForward.slice(1)); setViewHistory((h)=>[...h, siteView]); setSiteView(nx); }
  };
  const [allUsers, setAllUsers] = useState([]);
  const [teamPickerOpen, setTeamPickerOpen] = useState(false);
  const [echipaVizibila, setEchipaVizibila] = useState(false);
  const [pinPanelOpen, setPinPanelOpen] = useState(false);
  const [pinManual, setPinManual] = useState('');
  const [pinStatus, setPinStatus] = useState('');
  const [pinCoords, setPinCoords] = useState(null);
  const [pinLoading, setPinLoading] = useState(false);
  const [rapSearch, setRapSearch] = useState('');
  const [rapDeschise, setRapDeschise] = useState({});
  const [luniDeschise, setLuniDeschise] = useState({});
  const [devizNr, setDevizNr] = useState('');
  const [devizData, setDevizData] = useState(new Date().toISOString().slice(0,10));
  const _aziD = new Date();
  const [devizFrom, setDevizFrom] = useState(new Date(_aziD.getFullYear(), _aziD.getMonth(), 1).toISOString().slice(0,10));
  const [devizTo, setDevizTo] = useState(new Date(_aziD.getFullYear(), _aziD.getMonth()+1, 0).toISOString().slice(0,10));

  // Cand un Manager/Electrician apasă pe o alertă din Dashboard, sare direct
  // la șantierul și sub-tab-ul relevant (Materiale, Scule etc.), nu doar la listă.
  useEffect(() => {
    if (!pendingSiteNav) return;
    setSelected(pendingSiteNav.santierId);
    setSiteView(pendingSiteNav.siteView || '__closed__');
    setViewHistory([]); setViewForward([]);
    setPendingSiteNav(null);
  }, [pendingSiteNav]);

  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setAllUsers((data.users || []).filter((u)=>u.rol==='Electrician'))).catch(()=>setAllUsers([]));
  }, []);

  const updateEchipa = (santierId, echipa) => {
    const next = santiere.map((s)=>s.id===santierId ? {...s, echipa} : s);
    setSantiere(next); persist('santiere', next);
  };
  const finalizeSantier = (santierId) => {
    const s0 = santiere.find((s)=>s.id===santierId);
    const next = santiere.map((s)=>s.id===santierId ? {...s, status:'Finalizat'} : s);
    setSantiere(next); persist('santiere', next);
    notifica('manageri', { title:'Șantier finalizat', body:`${currentUser?.nume || 'Un coleg'} a marcat „${s0?.nume || 'un șantier'}" ca finalizat.`, tag:'finalizat' }, currentUser?.id);
  };
  const addToEchipa = (santierId, userId) => {
    const s = santiere.find((x)=>x.id===santierId);
    const echipa = echipaNormalizata(s.echipa);
    if (!echipa.some((e)=>e.userId===userId)) {
      updateEchipa(santierId, [...echipa, { userId, status:'activ' }]);
      notifica(userId, { title:'Ai fost asignat pe un șantier', body:`${s?.nume || 'Șantier'} — deschide aplicația pentru detalii.`, tag:'asignare' }, currentUser?.id);
    }
  };
  const removeFromEchipa = (santierId, userId) => {
    const s = santiere.find((x)=>x.id===santierId);
    updateEchipa(santierId, echipaNormalizata(s.echipa).filter((e)=>e.userId!==userId));
  };
  const setEchipaMemberStatus = (santierId, userId, status) => {
    const s = santiere.find((x)=>x.id===santierId);
    updateEchipa(santierId, echipaNormalizata(s.echipa).map((e)=> e.userId===userId ? {...e, status, dataModificare: new Date().toISOString().slice(0,10)} : e));
  };

  const saveSantier = (s) => {
    // Când managerul salvează, șantierul e considerat completat (dispare eticheta „De completat").
    const s2 = { ...s, necesitaCompletare: false };
    const next = santiere.some((x)=>x.id===s2.id) ? santiere.map((x)=>x.id===s2.id?s2:x) : [...santiere, s2];
    setSantiere(next); persist('santiere', next); setForm(null);
  };
  // Angajatul creează rapid un șantier: doar nume + adresă. Restul le completează managerul.
  const creeazaSantierRapid = () => {
    const nume = String(quickForm?.nume || '').trim();
    if (!nume) return;
    const azi = new Date().toISOString().slice(0,10);
    const s = {
      id: uid(), nume, adresa: String(quickForm?.adresa || '').trim(),
      status:'Activ', echipa:[{ userId: currentUser.id, status:'activ', dataModificare: azi }],
      modFacturare:'orar', tipFacturare:'orar', tarifOrar:75, materialeSursa:'noastre',
      benefNume:'', benefInfo:'', benefSemnatar:'', contract:'', obiectiv:'',
      lucrare:'Instalații electrice interioare', descriereLucrari:'',
      dataCreare: azi, raportDeLa: azi,
      creatDeAngajat: true, necesitaCompletare: true, creatId: currentUser.id, creatNume: currentUser.nume,
    };
    const next = [...santiere, s];
    setSantiere(next); persist('santiere', next);
    notifica('manageri', { title:'🏗 Șantier nou (de la un coleg)', body:`${currentUser.nume} a creat șantierul „${nume}". Completează detaliile când poți.`, tag:'santier-nou' }, currentUser?.id);
    setQuickForm(null); setSelected(s.id); setSiteView('__closed__');
  };
  // Auto-alocare: angajatul CERE să lucreze pe un șantier existent; managerul aprobă și DOAR apoi intră pe șantier.
  const ceriAlocare = (santierId) => {
    const s = santiere.find((x)=>x.id===santierId); if (!s) return;
    if ((cereriAlocare||[]).some((c)=>c.santierId===santierId && c.userId===currentUser.id && c.status==='Cerut')) return;
    const c = { id: uid(), santierId, userId: currentUser.id, nume: currentUser.nume, data: new Date().toISOString().slice(0,10), status:'Cerut' };
    const next = [c, ...(cereriAlocare||[])];
    setCereriAlocare(next); persist('cereriAlocare', next);
    notifica('manageri', { title:'🏗 Cerere de alocare', body:`${currentUser.nume} cere să lucreze pe „${s.nume}". Aprobă sau respinge.`, tag:'aloc-'+santierId }, currentUser?.id);
  };
  const aprobaAlocare = (cerere) => {
    const s = santiere.find((x)=>x.id===cerere.santierId);
    if (s) {
      const echipa = echipaNormalizata(s.echipa);
      if (!echipa.some((e)=>e.userId===cerere.userId)) {
        const azi = new Date().toISOString().slice(0,10);
        const nextS = santiere.map((x)=> x.id===cerere.santierId ? { ...x, echipa: [...echipa, { userId: cerere.userId, status:'activ', dataModificare: azi }] } : x);
        setSantiere(nextS); persist('santiere', nextS);
      }
    }
    const nextC = (cereriAlocare||[]).map((c)=> c.id===cerere.id ? { ...c, status:'Aprobat' } : c);
    setCereriAlocare(nextC); persist('cereriAlocare', nextC);
    notifica(cerere.userId, { title:'✅ Alocare aprobată', body:`Poți lucra pe „${s?.nume || 'șantier'}".`, tag:'aloc-raspuns' }, currentUser?.id);
  };
  const respingeAlocare = (cerere) => {
    const s = santiere.find((x)=>x.id===cerere.santierId);
    const nextC = (cereriAlocare||[]).map((c)=> c.id===cerere.id ? { ...c, status:'Respins' } : c);
    setCereriAlocare(nextC); persist('cereriAlocare', nextC);
    notifica(cerere.userId, { title:'⛔ Alocare respinsă', body:`Cererea pentru „${s?.nume || 'șantier'}" a fost respinsă.`, tag:'aloc-raspuns' }, currentUser?.id);
  };
  const setSantierLocatie = (id, lat, lng) => {
    const next = santiere.map((s)=>s.id===id ? {...s, lat, lng} : s);
    setSantiere(next); persist('santiere', next);
  };
  const delSantier = (id) => {
    if (!window.confirm('Ștergi definitiv acest șantier? (Rapoartele și orele rămân în Pontaj, dar șantierul dispare din listă.)')) return;
    setSantiere((prev)=>{ const next = prev.filter((s)=>s.id!==id); persist('santiere', next); return next; });
    // Rapoartele NU se șterg — orele lucrate rămân în Pontaj, chiar dacă șantierul e șters ulterior.
    setEtape((prev)=>{ const next = prev.filter((e)=>e.santierId!==id); persist('etape', next); return next; });
    if (selected === id) setSelected(null);
  };
  const saveReport = (r) => {
    const esteNou = !rapoarte.some((x)=>x.id===r.id);
    const withSite = { ...r, santierId: selected };
    let next;
    // Dacă rândul editat era contopit din mai multe rapoarte vechi ale aceleiași zile,
    // le înlocuim pe toate cu unul singur, curat.
    if (!esteNou && Array.isArray(r._idUnite) && r._idUnite.length > 1) {
      const curat = { ...withSite }; delete curat._idUnite;
      const fara = rapoarte.filter((x)=> !r._idUnite.includes(x.id));
      next = [...fara, curat];
      setRapoarte(next); persist('rapoarte', next); setReportForm(null);
      notifica('manageri', { title:'Raport modificat', body:`${currentUser?.nume || 'Un coleg'} a modificat raportul la ${santier?.nume || 'un șantier'}${r.data ? ` (${r.data})` : ''}.`, tag:'raport' }, currentUser?.id);
      return;
    }
    // UN SINGUR RAPORT PE ZI, PE ȘANTIER: dacă mai există deja un raport în aceeași zi,
    // ce s-a scris acum se adaugă în el, nu se face un raport nou. Așa rămâne totul compact.
    const existent = esteNou ? rapoarte.find((x)=> x.santierId === selected && x.data === withSite.data) : null;
    if (existent) {
      next = rapoarte.map((x)=> x.id === existent.id ? contopesteRapoarte(existent, withSite) : x);
    } else {
      next = esteNou ? [...rapoarte, withSite] : rapoarte.map((x)=>x.id===r.id?withSite:x);
    }
    setRapoarte(next); persist('rapoarte', next); setReportForm(null);
    notifica('manageri', { title: esteNou ? 'Raport zilnic nou' : 'Raport modificat', body:`${currentUser?.nume || 'Un coleg'} ${esteNou ? 'a trimis raport' : 'a modificat raportul'} la ${santier?.nume || 'un șantier'}${r.data ? ` (${r.data})` : ''}.`, tag:'raport' }, currentUser?.id);
  };
  const delReport = (id) => {
    const ids = Array.isArray(id) ? id : [id];
    if (!window.confirm('Ștergi definitiv raportul acestei zile? Orele din el vor dispărea din Pontaj.')) return;
    const rap = rapoarte.find((r)=>r.id===ids[0]);
    const next = rapoarte.filter((r)=>!ids.includes(r.id)); setRapoarte(next); persist('rapoarte', next);
    notifica('manageri', { title:'Raport șters', body:`${currentUser?.nume || 'Un coleg'} a șters un raport de la ${santier?.nume || 'un șantier'}${rap?.data ? ` (${rap.data})` : ''}.`, tag:'raport' }, currentUser?.id);
  };

  const addEtapa = () => {
    if (!etapaNoua.trim()) return;
    const next = [...etape, { id: uid(), santierId: selected, nume: etapaNoua.trim() }];
    setEtape(next); persist('etape', next); setEtapaNoua('');
  };
  const delEtapa = (id) => {
    const next = etape.filter((e)=>e.id!==id);
    setEtape(next); persist('etape', next);
    if (etapaTab === id) setEtapaTab('toate');
  };

  const exportExcel = (santierId, listaRapoarte, etapeSantier) => {
    const etapaNume = (id) => etapeSantier.find((e)=>e.id===id)?.nume || '';
    const inRange = listaRapoarte.filter((r) => (!exportFrom || r.data >= exportFrom) && (!exportTo || r.data <= exportTo));
    const rows = inRange.slice().sort((a,b)=> a.data<b.data?-1:1).map((r)=>{
      const totalOreMinRow = r.persoane.reduce((s,p)=>s+personMinutes(p),0);
      return {
        'Data': r.data,
        'Etapă': etapaNume(r.etapaId),
        'Ora început': r.oraInceput || '',
        'Ora sfârșit': r.oraSfarsit || '',
        'Nr. persoane': r.persoane.filter((p)=>p.nume.trim()).length,
        'Persoane': r.persoane.filter((p)=>p.nume.trim()).map((p)=>`${p.nume} (${minutesToHM(personMinutes(p))})`).join(', '),
        'Total ore': minutesToHM(totalOreMinRow),
        'Ce s-a făcut': r.explicatii || '',
      };
    });
    const totalOreGeneralMin = inRange.reduce((s,r)=>s+r.persoane.reduce((s2,p)=>s2+personMinutes(p),0),0);
    const totalPersoane = inRange.reduce((s,r)=>s+r.persoane.filter((p)=>p.nume.trim()).length,0);
    const totalRow = { 'Data':'TOTAL', 'Etapă':'', 'Ora început':'', 'Ora sfârșit':'', 'Nr. persoane': totalPersoane, 'Persoane':'', 'Total ore': minutesToHM(totalOreGeneralMin), 'Ce s-a făcut':'' };

                <div className="min-w-0">
                  <div className="text-sm" style={{ color:'var(--text)' }}>{!areAcces && '🔒 '}{s.nume} <span className="text-xs ml-2" style={{ color: s.status==='Activ'?'#4CAF7D':s.status==='Pauză'?'#E9A23B':'var(--muted)' }}>{s.status}</span>{s.necesitaCompletare && currentUser?.rol === 'Manager' && <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded" style={{ background:'#E9A23B', color:'#14181C', fontWeight:700 }}>⚠ De completat</span>}</div>
                  <div className="text-xs" style={{ color:'var(--muted)' }}>{s.adresa} · {nrRapoarte} rapoarte{s.creatDeAngajat && s.creatNume ? ` · creat de ${s.creatNume}` : ''}{!areAcces && ' · Nu ești asignat aici'}</div>
                </div>
                {currentUser?.rol === 'Manager' ? (
                  <div className="flex items-center gap-2 shrink-0" onClick={(e)=>e.stopPropagation()}>

                  </div>
                ) : !areAcces ? (
                  <div className="shrink-0" onClick={(e)=>e.stopPropagation()}>
                    {(cereriAlocare||[]).some((c)=>c.santierId===s.id && c.userId===currentUser?.id && c.status==='Cerut')
                      ? <span className="text-xs px-2.5 py-1 rounded-lg" style={{ color:'#E9A23B', background:'var(--panel2)', border:'1px dashed #E9A23B66' }}>⏳ Cerere trimisă</span>
                      : <button onClick={()=>ceriAlocare(s.id)} className="text-xs px-2.5 py-1 rounded-lg font-medium" style={{ color:'#14181C', background:'#E9A23B' }} title="Ceri să lucrezi pe acest șantier — managerul aprobă">➕ Cere alocare</button>}
                  </div>
                ) : null}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
