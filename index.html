    setSculeSantier(next); persist('sculeSantier', next); setSculaNoua(''); setSculaAdusaDe('');
  };
  const delScula = (id) => { if (!window.confirm('Ștergi această sculă din lista șantierului?')) return; const next = sculeSantier.filter((s)=>s.id!==id); setSculeSantier(next); persist('sculeSantier', next); };
  const [trimiteSculaId, setTrimiteSculaId] = useState(null);
  const trimiteScula = (s, dest) => {
    if (!window.confirm(`Trimiți „${s.denumire}" la ${dest}? Va fi scoasă din lista șantierului.`)) return;
    const next = sculeSantier.filter((x)=>x.id!==s.id);
    setSculeSantier(next); persist('sculeSantier', next); setTrimiteSculaId(null);
  };

  return (
    <div className="rounded-xl p-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
      <div className="text-sm font-medium mb-2" style={{ color:'#E9E7E2' }}>🔧 Scule la șantier</div>
      <div className="flex flex-col sm:flex-row gap-2 mb-3">
        <input placeholder="Sculă (ex: Bormașină Bosch)" value={sculaNoua} onChange={(e)=>setSculaNoua(e.target.value)} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <input placeholder="Adusă de" value={sculaAdusaDe} onChange={(e)=>setSculaAdusaDe(e.target.value)} className="sm:w-40 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <button onClick={addScula} className="text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă</button>
      </div>
      {sculeAici.length===0 ? <div className="text-xs" style={{ color:'#5C6570' }}>Nicio sculă adăugată.</div> : (
        <div className="space-y-1">
          {sculeAici.map((s)=>(
            <div key={s.id} className="text-xs px-2 py-1.5 rounded-lg" style={{ background:'#171C21' }}>
              <div className="flex items-center justify-between gap-2">
                <span style={{ color:'#E9E7E2' }}>{s.denumire}{s.adusaDe && <span style={{ color:'#8B93A0' }}> · {s.adusaDe}</span>}</span>
                {trimiteSculaId!==s.id && (
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={()=>setTrimiteSculaId(s.id)} className="px-2 py-0.5 rounded" style={{ color:'#8B93A0', background:'#1B2127' }}>↩ Trimite</button>
                    <button onClick={()=>delScula(s.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                  </div>
                )}
              </div>
              {trimiteSculaId===s.id && (
                <div className="flex items-center gap-1 flex-wrap mt-2 pt-2" style={{ borderTop:'1px solid #2A323B' }}>
                  <span className="text-[10px]" style={{ color:'#8B93A0' }}>Trimite la:</span>
                  <button onClick={()=>trimiteScula(s,'Depozit')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏠 Depozit</button>
                  <button onClick={()=>trimiteScula(s,'Alt șantier')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Alt șantier</button>
                  <button onClick={()=>trimiteScula(s,'Service')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#E9A23B' }}>🔧 Service</button>
                  <button onClick={()=>setTrimiteSculaId(null)} className="px-2 py-1" style={{ color:'#8B93A0' }}>Anulează</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SiteMaterialsTab({ santierId, santierNume, company, materials, cereriSantier, setCereriSantier, miscariSantier, setMiscariSantier, persist, onExportToDeviz, onCerereMaterial, currentUser }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };

  // --- Cerere materiale ---
  const [cerereForm, setCerereForm] = useState({ denumire:'', cantitate:1, um:'buc' });
  const [cerereFilter, setCerereFilter] = useState('');
  const [cerereDataFiltru, setCerereDataFiltru] = useState('');
  const [cerereShowAll, setCerereShowAll] = useState(false);
  const normalizeSearchLocal = (s) => String(s || '').toLowerCase().replace(/[\s,.\-]/g, '');
  const cereriAici = cereriSantier.filter((c)=>c.santierId===santierId);
  const addCerere = () => {
    if (!cerereForm.denumire.trim()) return;
    const denumireFinala = cerereForm.denumire.trim();
    const cantitateFinala = Number(cerereForm.cantitate)||0;
    const next = [...cereriSantier, { id: uid(), santierId, denumire: denumireFinala, cantitate: cantitateFinala, um: cerereForm.um, data: new Date().toISOString().slice(0,10), status:'Cerută' }];
    setCereriSantier(next); persist('cereriSantier', next); setCerereForm({ denumire:'', cantitate:1, um:'buc' });
    if (onCerereMaterial) onCerereMaterial(denumireFinala, cerereForm.um, cantitateFinala, santierNume);
  };
  const delCerere = (id) => { if (!window.confirm('Ștergi definitiv această cerere de materiale?')) return; const next = cereriSantier.filter((c)=>c.id!==id); setCereriSantier(next); persist('cereriSantier', next); };
  const setCerereStatus = (id, status) => {
    const next = cereriSantier.map((c)=>c.id===id?{...c, status}:c);
    setCereriSantier(next); persist('cereriSantier', next);
  };
  const marcheazaLivrata = (cerere) => {
    const next = cereriSantier.map((c)=>c.id===cerere.id?{...c, status:'Livrată'}:c);
    setCereriSantier(next); persist('cereriSantier', next);
    const miscare = { id: uid(), santierId, denumire: cerere.denumire, um: cerere.um, tip:'intrare', cantitate: cerere.cantitate, data: new Date().toISOString().slice(0,10), nota:'Din cerere livrată' };
    const nextMiscari = [miscare, ...miscariSantier];
    setMiscariSantier(nextMiscari); persist('miscariSantier', nextMiscari);
  };

  const azi = new Date();
  const extrasLa = `${String(azi.getDate()).padStart(2,'0')}/${String(azi.getMonth()+1).padStart(2,'0')}/${azi.getFullYear()}`;

  const exportCereriExcel = () => {
    const rows = cereriAici.map((c)=>({ 'Data': c.data, 'Material': c.denumire, 'Cantitate': c.cantitate, 'U.M.': c.um, 'Status': c.status }));
    const sheetRows = rows.length ? rows : [{ 'Data':'', 'Material':'Nicio cerere înregistrată.', 'Cantitate':'', 'U.M.':'', 'Status':'' }];
    const headerRows = [
      [company?.nume || 'Firma mea'],
      [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],
      [],
      [`Cerere materiale — ${santierNume}`],
      [`Extras la: ${extrasLa}`],
      [],
    ];
    const ws = XLSX.utils.aoa_to_sheet(headerRows);
    XLSX.utils.sheet_add_json(ws, sheetRows, { origin: -1 });
    ws['!cols'] = [{wch:12},{wch:35},{wch:11},{wch:8},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Cerere materiale');
    XLSX.writeFile(wb, `cerere_materiale_${santierNume.replace(/\s+/g,'_')}.xlsx`);
  };

  const exportCererePDF = () => {
    const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const rows = cereriAici.map((c,i)=>`
      <tr><td>${i+1}</td><td style="text-align:left">${esc(c.denumire)}</td><td>${esc(c.cantitate)}</td><td>${esc(c.um)}</td><td>${esc(c.data)}</td><td>${esc(c.status)}</td></tr>`).join('');
    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Cerere materiale</title><style>
      * { box-sizing:border-box; } body { margin:0; font-family:Arial, sans-serif; color:#1a1a1a; }
      .page { width:190mm; margin:0 auto; padding:14mm; }
      .header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8mm; }
      .logo { height:30px; }
      .title-block { text-align:right; }
      .title { font-size:18px; font-weight:700; }
      table { width:100%; border-collapse:collapse; font-size:11px; margin-top:6mm; }
      th { text-align:center; border:1px solid #999; padding:2mm; font-size:10px; text-transform:uppercase; background:#f2f2f2; }
      td { text-align:center; border:1px solid #ccc; padding:2mm; }
      .sign { display:flex; justify-content:space-between; margin-top:20mm; font-size:11px; }
      .sign-line { margin-top:14mm; border-top:1px solid #999; width:70%; }
    </style></head><body>${PRINT_TOOLBAR}
      <div class="page">
        <div class="header-row">
          <img class="logo" src="${window.location.origin}/logo.png" alt="Logo" />
          <div class="title-block">
            <div class="title">CERERE MATERIALE</div>
            <div style="font-size:11px;color:#555;margin-top:2mm;">Șantier: ${esc(santierNume)}</div>
            <div style="font-size:11px;color:#555;">Data: ${esc(extrasLa)}</div>
          </div>
        </div>
        <table>
          <thead><tr><th>Nr.</th><th style="text-align:left">Material</th><th>Cantitate</th><th>U.M.</th><th>Data cerere</th><th>Status</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">Nicio cerere înregistrată.</td></tr>'}</tbody>
        </table>
        <div class="sign">
          <div>Solicitat de:<div class="sign-line"></div></div>
          <div>Aprobat de (manager):<div class="sign-line"></div></div>
        </div>
      </div>
    </body></html>`;
    const w = window.open('', '_blank');
    if (!w) { window.alert('Browserul a blocat fereastra nouă. Permite pop-up-urile și încearcă din nou.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.focus();
  };

  // --- Stoc materiale la șantier (calculat din mișcări) + consum ---
  const miscariAici = miscariSantier.filter((m)=>m.santierId===santierId);
  const stocPeMaterial = {};
  miscariAici.forEach((m)=>{
    if (!stocPeMaterial[m.denumire]) stocPeMaterial[m.denumire] = { denumire:m.denumire, um:m.um, stoc:0 };
    stocPeMaterial[m.denumire].stoc += (m.tip==='intrare' ? 1 : -1) * (Number(m.cantitate)||0);
  });
  const stocList = Object.values(stocPeMaterial);
  const [stocShowAllSantier, setStocShowAllSantier] = useState(false);
  const [editStocState, setEditStocState] = useState(null);
  const [editStocValue, setEditStocValue] = useState('');
  const [consumState, setConsumState] = useState(null);
  const confirmEditStoc = (m) => {
    const nou = Number(editStocValue) || 0;
    const diff = nou - m.stoc;
    setEditStocState(null);
    if (diff === 0) return;
    const miscare = { id: uid(), santierId, denumire: m.denumire, um: m.um, tip: diff > 0 ? 'intrare' : 'iesire', cantitate: Math.abs(diff), data: new Date().toISOString().slice(0,10), nota:'Corecție manuală' };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next);
  };
  const confirmConsum = (denumire, um, cantitate) => {
    const miscare = { id: uid(), santierId, denumire, um, tip:'iesire', cantitate: Number(cantitate)||0, data: new Date().toISOString().slice(0,10), nota:'Consum șantier' };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next); setConsumState(null);
  };
  const [returnMatState, setReturnMatState] = useState(null);
  const [returnMatQty, setReturnMatQty] = useState('');
  const confirmReturnMat = (m, dest) => {
    const cant = Number(returnMatQty) || 0;
    if (cant <= 0) { setReturnMatState(null); return; }
    const miscare = { id: uid(), santierId, denumire: m.denumire, um: m.um, tip:'iesire', cantitate: cant, data: new Date().toISOString().slice(0,10), nota:`Trimis la ${dest}` };
    const next = [miscare, ...miscariSantier];
    setMiscariSantier(next); persist('miscariSantier', next); setReturnMatState(null); setReturnMatQty('');
  };

  const consumPeMaterial = {};
  miscariAici.filter((m)=>m.tip==='iesire' && !String(m.nota||'').startsWith('Trimis la')).forEach((m)=>{
    if (!consumPeMaterial[m.denumire]) consumPeMaterial[m.denumire] = { denumire:m.denumire, um:m.um, cantitate:0 };
    consumPeMaterial[m.denumire].cantitate += Number(m.cantitate)||0;
  });
  const consumList = Object.values(consumPeMaterial);
  const trimiteConsumInDeviz = () => {
    if (consumList.length === 0) return;
    onExportToDeviz(consumList, santierNume);
  };

  const cerereSearching = cerereFilter.trim() !== '' || cerereDataFiltru !== '';
  const cereriFiltrate = cereriAici.filter((c) => {
    if (cerereDataFiltru && c.data !== cerereDataFiltru) return false;
    if (cerereFilter.trim() && !normalizeSearchLocal(c.denumire).includes(normalizeSearchLocal(cerereFilter))) return false;
    return true;
  });
  const cereriPeZi = {};
  cereriFiltrate.forEach((c) => {
    if (!cereriPeZi[c.data]) cereriPeZi[c.data] = [];
    cereriPeZi[c.data].push(c);
  });
  const ziledisponibile = Object.keys(cereriPeZi).sort((a,b)=> b.localeCompare(a));
  const cereriShow = cerereSearching || cerereShowAll;

  return (
    <div className="space-y-4">
      <div className="rounded-xl p-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="flex items-center justify-between mb-2">
          <div className="text-sm font-medium" style={{ color:'#E9E7E2' }}>📥 Cerere materiale</div>
          {currentUser?.rol === 'Manager' && (
          <div className="flex gap-1.5">
            <button onClick={exportCereriExcel} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>📊 Excel</button>
            <button onClick={exportCererePDF} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>🖨 PDF</button>
          </div>
          )}
        </div>
        <div className="mb-3">
          <input list="materiale-catalog-santier" placeholder="Material (ex: Cablu CYY-F 3x2.5)" value={cerereForm.denumire} onChange={(e)=>setCerereForm({...cerereForm, denumire:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
          <datalist id="materiale-catalog-santier">{materials.filter((m)=>!m.arhivat).map((m)=><option key={m.id} value={m.denumire} />)}</datalist>
          <div className="flex gap-2">
            <input type="number" value={cerereForm.cantitate} onChange={(e)=>setCerereForm({...cerereForm, cantitate:e.target.value})} className="w-20 rounded-lg px-3 py-2 text-sm outline-none text-center" style={inputStyle} />
            <input placeholder="UM" value={cerereForm.um} onChange={(e)=>setCerereForm({...cerereForm, um:e.target.value})} className="w-20 rounded-lg px-3 py-2 text-sm outline-none text-center" style={inputStyle} />
            <button onClick={addCerere} className="flex-1 text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Cere material</button>
          </div>
        </div>

        <div className="flex items-center gap-1.5 mb-2 flex-wrap">
          <input placeholder="🔍 Caută material..." value={cerereFilter} onChange={(e)=>setCerereFilter(e.target.value)} className="rounded-lg px-2.5 py-1.5 text-xs outline-none flex-1 min-w-[100px]" style={inputStyle} />
          <RoCalendarPicker value={cerereDataFiltru} onChange={setCerereDataFiltru} />
          {!cerereSearching && (
            <button onClick={()=>setCerereShowAll(!cerereShowAll)} className="text-xs px-2.5 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>{cerereShowAll ? 'Ascunde' : 'Vezi toate materialele'}</button>
          )}
        </div>

        {cereriAici.length===0 ? (
          <div className="text-xs" style={{ color:'#5C6570' }}>Nicio cerere.</div>
        ) : !cereriShow ? (
          <div className="text-xs" style={{ color:'#5C6570' }}>Caută un material sau o dată, sau apasă „Vezi toate materialele".</div>
        ) : ziledisponibile.length === 0 ? (
          <div className="text-xs" style={{ color:'#5C6570' }}>Niciun rezultat.</div>
        ) : (
          <div className="space-y-3">
            {ziledisponibile.map((zi)=>(
              <div key={zi}>
                <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#5C6570' }}>{zi} ({cereriPeZi[zi].length})</div>
                <div className="space-y-1">
                  {cereriPeZi[zi].map((c)=>(
                    <div key={c.id} className="flex items-center justify-between text-xs px-2 py-1.5 rounded-lg" style={{ background:'#171C21' }}>
                      <span style={{ color:'#E9E7E2' }}>{c.denumire} — {c.cantitate} {c.um}</span>
                      <div className="flex items-center gap-2">
                        <span style={{ color: c.status==='Livrată'?'#4CAF7D':c.status==='Aprobată'?'#2E8BD1':c.status==='Respinsă'?'#E05252':'#E9A23B' }}>{c.status}</span>
                        {c.status==='Cerută' && currentUser?.rol === 'Manager' && (
                          <>
                            <button onClick={()=>setCerereStatus(c.id,'Aprobată')} className="px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#2E8BD1' }}>✓ Aprobă</button>
                            <button onClick={()=>setCerereStatus(c.id,'Respinsă')} className="px-2 py-0.5 rounded" style={{ color:'#E9E7E2', background:'#171C21', border:'1px solid #E0525266' }}>✕ Respinge</button>
                          </>
                        )}
                        {c.status==='Cerută' && currentUser?.rol !== 'Manager' && (
                          <span className="text-xs" style={{ color:'#5C6570' }}>Așteaptă aprobare manager</span>
                        )}
                        {c.status==='Aprobată' && <button onClick={()=>marcheazaLivrata(c)} className="px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#4CAF7D' }}>📦 Livrată</button>}
                        <button onClick={()=>delCerere(c.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-xl p-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="text-sm font-medium" style={{ color:'#E9E7E2' }}>📦 Stoc materiale la șantier</div>
          <div className="flex items-center gap-1.5">
            {currentUser?.rol === 'Manager' && consumList.length > 0 && <button onClick={trimiteConsumInDeviz} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#14181C', background:'#2E8BD1' }}>🧾 Exportă consum în Deviz</button>}
            {stocList.length > 0 && <button onClick={()=>setStocShowAllSantier(!stocShowAllSantier)} className="text-xs px-2.5 py-1 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>{stocShowAllSantier ? 'Ascunde' : '👁 Vezi tot stocul'}</button>}
          </div>
        </div>
        {stocList.length===0 ? (
          <div className="text-xs" style={{ color:'#5C6570' }}>Niciun material adus încă la șantier.</div>
        ) : !stocShowAllSantier ? (
          <div className="text-xs" style={{ color:'#5C6570' }}>Apasă „Vezi tot stocul" ca să vezi lista.</div>
        ) : (
          <div className="space-y-1">
            {stocList.map((m)=>(
              <div key={m.denumire} className="text-xs px-2 py-1.5 rounded-lg" style={{ background:'#171C21' }}>
                <div className="flex items-center justify-between gap-2">
                  <span style={{ color:'#E9E7E2' }}>{m.denumire} <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{m.stoc} {m.um}</span></span>
                  {editStocState===m.denumire ? (
                    <div className="flex items-center gap-1">
                      <input type="number" value={editStocValue} onChange={(e)=>setEditStocValue(e.target.value)} className="w-16 rounded-lg px-2 py-1 text-xs outline-none" style={inputStyle} />
                      <button onClick={()=>confirmEditStoc(m)} className="px-2 py-1 rounded-lg" style={{ color:'#14181C', background:'#4CAF7D' }}>✓</button>
                      <button onClick={()=>setEditStocState(null)} className="px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127' }}>✕</button>
                    </div>
                  ) : consumState===m.denumire ? (
                    <MoveInput tip="iesire" onConfirm={(cant)=>confirmConsum(m.denumire, m.um, cant)} onCancel={()=>setConsumState(null)} />
                  ) : returnMatState!==m.denumire ? (
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={()=>{ setEditStocState(m.denumire); setEditStocValue(m.stoc); }} className="px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127' }}>✎</button>
                      <button onClick={()=>setConsumState(m.denumire)} className="px-2 py-1 rounded-lg" style={{ color:'#E05252', background:'#1B2127' }}>− Consum</button>
                      <button onClick={()=>{ setReturnMatState(m.denumire); setReturnMatQty(m.stoc); }} className="px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127' }}>↩ Trimite</button>
                    </div>
                  ) : null}
                </div>
                {returnMatState===m.denumire && (
                  <div className="flex items-center gap-1 flex-wrap mt-2 pt-2" style={{ borderTop:'1px solid #2A323B' }}>
                    <span className="text-[10px]" style={{ color:'#8B93A0' }}>Trimite</span>
                    <input type="number" value={returnMatQty} onChange={(e)=>setReturnMatQty(e.target.value)} className="w-14 rounded-lg px-2 py-1 text-xs outline-none text-center" style={inputStyle} />
                    <span className="text-[10px]" style={{ color:'#8B93A0' }}>{m.um} la:</span>
                    <button onClick={()=>confirmReturnMat(m,'Depozit')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏠 Depozit</button>
                    <button onClick={()=>confirmReturnMat(m,'Alt șantier')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Alt șantier</button>
                    <button onClick={()=>confirmReturnMat(m,'Furnizor')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#E9A23B' }}>🏭 Furnizor</button>
                    <button onClick={()=>setReturnMatState(null)} className="px-2 py-1" style={{ color:'#8B93A0' }}>Anulează</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function PersonHoursEditor({ persoane, setPersoane, defaultInceput, defaultSfarsit, echipaPermisa }) {

  }, []);

  const update = (id, f, v) => setPersoane(persoane.map((p)=> p.id===id ? {...p, [f]:v} : p));

  const addPerson = (u) => {
    setPersoane([...persoane, { id: uid(), nume: u.nume, oraInceput: defaultInceput || '08:00', oraSfarsit: defaultSfarsit || '17:00' }]);

    <div className="space-y-2">

      <div className="space-y-1.5">
      {persoane.map((p)=>{
        const mins = personMinutes(p);
        return (
          <div key={p.id} className="rounded-lg px-2.5 py-2" style={{ background:'#171C21', border:'1px solid #2A323B' }}>

        );
      })}

      <div>
        <div className="text-xs mb-1.5" style={{ color:'#8B93A0' }}>Apasă pe nume ca să adaugi persoana la raport:</div>

          <div className="text-xs" style={{ color:'#5C6570' }}>Niciun electrician asignat la acest șantier — cere unui Manager să asigneze echipa.</div>

          <div className="text-xs" style={{ color:'#5C6570' }}>Toți cei asignați sunt deja adăugați.</div>

              <button key={u.id} onClick={()=>addPerson(u)} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ color:'#E9E7E2', background:'#171C21', border:'1px solid #2A323B' }}>
                <Icon>+</Icon> {iconFor(u.rol)} {u.nume}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// Câmp cu autocomplete: tastezi orice bucată din text și îți arată sugestii care conțin ce ai scris (nu doar început).
function AutocompleteInput({ value, onChange, onPick, options, placeholder, minWidth }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const [open, setOpen] = useState(false);
  const norm = (s)=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const q = norm(value);
  const matches = q ? (options||[]).filter((o)=>norm(o.label).includes(q)).slice(0,10) : [];
  return (
    <div style={{ position:'relative', flex:1, minWidth: minWidth||'120px' }}>
      <input value={value} onChange={(e)=>{ onChange(e.target.value); setOpen(true); }} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)} placeholder={placeholder} className="w-full rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
      {open && matches.length>0 && (
        <div style={{ position:'absolute', zIndex:60, left:0, right:0, top:'100%', marginTop:2, background:'#0f1317', border:'1px solid #2A323B', borderRadius:8, maxHeight:200, overflowY:'auto', boxShadow:'0 6px 18px rgba(0,0,0,.45)' }}>
          {matches.map((o)=>(
            <div key={o.key} onMouseDown={(e)=>{ e.preventDefault(); onPick(o); setOpen(false); }} style={{ padding:'8px 10px', fontSize:12, cursor:'pointer', color:'#E9E7E2', borderBottom:'1px solid #1a2027' }}>
              {o.label}{o.um?<span style={{ color:'#5C6570' }}> · {o.um}</span>:null}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  return (
    <div>
      <div className="text-sm font-medium mb-1.5" style={{ color:'#E9E7E2' }}>🧰 Materiale folosite</div>
      <p className="text-xs mb-2" style={{ color:'#5C6570' }}>{pretDinLista ? 'Materialul clientului — trece doar cantitatea folosită. Prețul de manoperă îl știe managerul din lista importată.' : materialClient ? (isManager ? 'Materialele clientului — trece cantitatea și prețul unitar convenit.' : 'Materialele clientului — trece doar cantitatea folosită.') : 'Tastează și alege din listă (sugestii din lista importată + gestiune).'}</p>
      {materialeFolosite.length > 0 && (
        <div className="space-y-1 mb-2">
          {materialeFolosite.map((m)=>(
            <div key={m.id} className="flex items-center gap-1.5 flex-wrap rounded-lg px-2 py-1.5" style={{ background:'#171C21' }}>
              <AutocompleteInput value={m.denumire} onChange={(v)=>update(m.id,'denumire',v)} onPick={(o)=>pick(m.id,o)} options={optiuni} placeholder="Material" minWidth="140px" />
              <input type="number" value={m.cantitate} onChange={(e)=>update(m.id,'cantitate',e.target.value)} placeholder="Cant." className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-16" style={inputStyle} />
              <input value={m.um} onChange={(e)=>update(m.id,'um',e.target.value)} placeholder="UM" className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-14" style={inputStyle} />
              {materialClient && !pretDinLista && isManager && <input type="number" value={m.pret||''} onChange={(e)=>update(m.id,'pret',e.target.value)} placeholder="Preț" className="rounded-lg px-2 py-1.5 text-xs outline-none text-center w-16" style={inputStyle} />}
              {!clientMat && (
                <button onClick={()=>update(m.id,'sursa', m.sursa==='proprie'?'client':'proprie')} className="text-[11px] px-2 py-1 rounded-lg font-medium"
                  style={{ color:'#14181C', background: m.sursa==='proprie'?'#2E8BD1':'#E9A23B' }}>
                  {m.sursa==='proprie' ? 'Proprii' : 'Client'}
                </button>
              )}
              <button onClick={()=>remove(m.id)} className="opacity-50 hover:opacity-100" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
            </div>
          ))}
        </div>
      )}
      <button onClick={add} className="flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-lg" style={{ color:'#2E8BD1', background:'#171C21' }}><Icon>+</Icon> Adaugă material folosit</button>
    </div>
  );
}

function LucrariApartamenteEditor({ lucrari, setLucrari, structura, persoane, echipaNume, pozitii, materialeLista }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const normL = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const optiuniLucrare = (()=>{
    const seen = new Set(), out = [];
    (pozitii||[]).forEach((p)=>{ const k=normL(p.denumire); if(p.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'p'+p.id, label:p.denumire, um:p.um }); } });
    (materialeLista||[]).forEach((m)=>{ const k=normL(m.denumire); if(m.denumire && !seen.has(k)){ seen.add(k); out.push({ key:'m'+m.id, label:m.denumire, um:m.um }); } });
    return out;
  })();
  const [totiElectricieni, setTotiElectricieni] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setTotiElectricieni((data.users||[]).filter((u)=>u.rol==='Electrician').map((u)=>u.nume).filter(Boolean))).catch(()=>setTotiElectricieni([]));
  }, []);
  const numDin = (s)=>{ const m=String(s||'').match(/-?\d+/); return m?parseInt(m[0],10):null; };
  const cmp = (a,b)=>{ const na=numDin(a?.nume),nb=numDin(b?.nume); if(na==null&&nb==null) return String(a?.nume||'').localeCompare(String(b?.nume||''),'ro'); if(na==null)return -1; if(nb==null)return 1; return na-nb; };
  const etaje = (structura||[]).slice().sort(cmp);
  const bazaEchipa = Array.from(new Set([ ...(echipaNume||[]), ...(persoane||[]).map((p)=>p.nume) ].filter((n)=>n&&String(n).trim())));
  // Dacă șantierul n-are echipă asignată și n-ai adăugat încă persoane la raport,
  // arătăm toți electricienii ca să poți selecta oricând cine a lucrat.
  const numePersoane = bazaEchipa.length ? bazaEchipa : totiElectricieni;
  const grupuri = (lucrari||[]).map((g)=> Array.isArray(g.lucrari) ? g : normalizeLucrariApart([g])[0]);
  const updateGrup = (id,f,v)=>setLucrari(grupuri.map((x)=>x.id===id?{...x,[f]:v}:x));
  const removeGrup = (id)=>setLucrari(grupuri.filter((x)=>x.id!==id));
  const toggleAp = (g,apId)=>{ const cur=g.apartamenteIds||[]; updateGrup(g.id,'apartamenteIds', cur.includes(apId)? cur.filter((i)=>i!==apId):[...cur,apId]); };
  const setWorks = (gid, works)=>setLucrari(grupuri.map((g)=>g.id===gid?{...g, lucrari:works}:g));
  const addWork = (g)=>setWorks(g.id, [...(g.lucrari||[]), { id:uid(), denumire:'', cantitate:'', um:'buc' }]);
  const updateWork = (g,wid,f,v)=>setWorks(g.id, (g.lucrari||[]).map((w)=>w.id===wid?{...w,[f]:v}:w));
  const pickWork = (g,wid,o)=>{
    // Nu vrem același material de două ori la aceeași persoană/apartament → oferim să completeze rândul existent.
    const dup = (g.lucrari||[]).find((w)=>w.id!==wid && normL(w.denumire)===normL(o.label));
    if (dup && window.confirm(`„${o.label}" există deja aici pentru ${g.persoanaNume||'această persoană'}. Completează cantitatea la rândul existent în loc de un rând nou?`)) {
      const rest = (g.lucrari||[]).filter((w)=>w.id!==wid);
      setWorks(g.id, rest.length?rest:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }]);
      return;
    }
    setWorks(g.id, (g.lucrari||[]).map((w)=>w.id===wid?{...w,denumire:o.label,um:o.um||w.um}:w));
  };
  const removeWork = (g,wid)=>{ const rest=(g.lucrari||[]).filter((w)=>w.id!==wid); setWorks(g.id, rest.length?rest:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }]); };
  const add = ()=>{ const ultimul = grupuri[grupuri.length-1]; setLucrari([...grupuri, { id:uid(), persoanaNume:(ultimul?.persoanaNume)||numePersoane[0]||'', etajId:(ultimul?.etajId)||etaje[0]?.id||'', apartamenteIds:[], ore:'', lucrari:[{ id:uid(), denumire:'', cantitate:'', um:'buc' }] }]); };
  return (
    <div>
      <p className="text-xs mb-2" style={{ color:'#5C6570' }}>Alegi persoana și apartamentul, apoi treci lucrările una sub alta (1, 2, 3...). Când persoana se mută în alt apartament, apeși „+ Adaugă" jos și pornești o listă nouă.</p>
      {grupuri.map((g)=>{
        const etaj = etaje.find((e)=>e.id===g.etajId);
        const aps = (etaj?.apartamente||[]).slice().sort(cmp);
        return (
          <div key={g.id} className="rounded-lg p-2 mb-1.5" style={{ background:'#171C21', border:'1px solid #2A323B' }}>
            <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
              <select value={g.persoanaNume} onChange={(e)=>updateGrup(g.id,'persoanaNume',e.target.value)} className="rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle}>
                <option value="" style={{ background:'#1B2127' }}>Persoană...</option>
                {numePersoane.map((n)=><option key={n} value={n} style={{ background:'#1B2127' }}>{n}</option>)}
              </select>
              <select value={g.etajId} onChange={(e)=>updateGrup(g.id,'etajId',e.target.value)} className="rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle}>
                <option value="" style={{ background:'#1B2127' }}>Etaj...</option>
                {etaje.map((e)=><option key={e.id} value={e.id} style={{ background:'#1B2127' }}>{e.nume}</option>)}
              </select>
              <span className="flex items-center gap-1 text-[11px]" style={{ color:'#8B93A0' }}>⏱<input type="number" inputMode="decimal" value={g.ore} onChange={(e)=>updateGrup(g.id,'ore',e.target.value)} placeholder="ore" className="w-14 rounded-lg px-1.5 py-1 text-xs outline-none text-center" style={inputStyle}/></span>
              <button onClick={()=>removeGrup(g.id)} className="ml-auto opacity-60" style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
            </div>
            {etaj && (
              <div className="flex flex-wrap gap-1 mb-1.5">
                {aps.length===0 && <span className="text-[11px]" style={{ color:'#5C6570' }}>Etajul n-are apartamente în structură.</span>}
                {aps.map((a)=>{ const on=(g.apartamenteIds||[]).includes(a.id); return (
                  <button key={a.id} onClick={()=>toggleAp(g,a.id)} className="text-[11px] px-2 py-1 rounded-lg" style={{ color:on?'#14181C':'#8B93A0', background:on?'#2E8BD1':'#1B2127', border:'1px solid #2A323B' }}>{a.nume}</button>
                ); })}
              </div>
            )}
            <div className="space-y-1">
              {(g.lucrari||[]).map((w,i)=>(
                <div key={w.id} className="flex items-center gap-1.5">
                  <span className="text-[11px] w-4 text-center shrink-0" style={{ color:'#5C6570' }}>{i+1}</span>
                  <AutocompleteInput value={w.denumire} onChange={(v)=>updateWork(g,w.id,'denumire',v)} onPick={(o)=>pickWork(g,w.id,o)} options={optiuniLucrare} placeholder="Ce a lucrat (caută în poziții/materiale sau scrie liber)" minWidth="130px" />
                  <input type="number" inputMode="decimal" value={w.cantitate||''} onChange={(e)=>updateWork(g,w.id,'cantitate',e.target.value)} placeholder="Cant." className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <input value={w.um||''} onChange={(e)=>updateWork(g,w.id,'um',e.target.value)} placeholder="UM" className="w-12 rounded-lg px-1.5 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <button onClick={()=>removeWork(g,w.id)} className="shrink-0 opacity-60" style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                </div>
              ))}
            </div>
            <button onClick={()=>addWork(g)} className="mt-1.5 text-[11px] px-2.5 py-1 rounded-lg font-medium" style={{ color:'#2E8BD1', background:'#1B2127', border:'1px solid #2E8BD166' }}>➕ Adaugă lucrare{g.persoanaNume?' pentru '+g.persoanaNume:''}</button>
          </div>
        );
      })}
      <button onClick={add} disabled={etaje.length===0} className="text-xs px-3 py-1.5 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă persoană / apartament</button>
      {etaje.length===0 && <span className="text-[11px] ml-2" style={{ color:'#5C6570' }}>Adaugă întâi etaje/apartamente la „🏢 Structură".</span>}
    </div>
  );
}

function RaportForm({ initial, etape, echipaPermisa, echipaNume, materials, materialeLista, pozitii, structura, structuraSantier, setStructuraSantier, persist, santierId, mod, isManager, onCancel, onSave }) {
  const modR = mod || 'orar';
  const arePozitii = modR==='pozitie_propriu' || modR==='pozitie_client';
  const areMateriale = modR==='pozitie_propriu' || modR==='real_executat';
  // Dacă șantierul are structură (etaje/apartamente), materialele și pozițiile se trec
  // individual la „Lucrări pe apartamente" — nu mai dublăm cu rubrici separate.
  const areStructura = !!(structura && structura.length > 0);
  const [showStructEdit, setShowStructEdit] = useState(false);
  const [data, setData] = useState(initial?.data || new Date().toISOString().slice(0,10));
  const [oraInceput, setOraInceput] = useState(initial?.oraInceput || '08:00');
  const [oraSfarsit, setOraSfarsit] = useState(initial?.oraSfarsit || '17:00');
  const [etapaId, setEtapaId] = useState(initial?.etapaId || '');
  const [persoane, setPersoane] = useState(initial?.persoane || []);
  const [explicatii, setExplicatii] = useState(initial?.explicatii || '');
  const [materialeFolosite, setMaterialeFolosite] = useState(initial?.materialeFolosite || []);
  const [pozitiiExecutate, setPozitiiExecutate] = useState(initial?.pozitiiExecutate || []);
  const [tipuriLucrari, setTipuriLucrari] = useState(initial?.tipuriLucrari || []);
  const [lucrariApartamente, setLucrariApartamente] = useState(()=>normalizeLucrariApart(initial?.lucrariApartamente || []));
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const totalOreMin = persoane.reduce((s,p)=>s+personMinutes(p),0);
  return (
    <div className="rounded-xl p-4 mb-4" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
      <div className="flex gap-3 mb-2 flex-wrap items-end">
        <div className="text-xs flex flex-col gap-1" style={{ color:'#8B93A0' }}>Data
          <RoCalendarPicker value={data} onChange={setData} />
        </div>
        <div className="text-xs flex flex-col gap-1" style={{ color:'#8B93A0' }}>Ora implicită început
          <RoTimePicker value={oraInceput} onChange={setOraInceput} />
        </div>
        <div className="text-xs flex flex-col gap-1" style={{ color:'#8B93A0' }}>Ora implicită sfârșit
          <RoTimePicker value={oraSfarsit} onChange={setOraSfarsit} />
        </div>
        {etape && etape.length > 0 && (
          <div className="text-xs flex flex-col gap-1" style={{ color:'#8B93A0' }}>Etapă
            <select value={etapaId} onChange={(e)=>setEtapaId(e.target.value)} className="rounded-lg px-3 py-2 text-sm outline-none w-40" style={inputStyle}>
              <option value="">(fără etapă)</option>
              {etape.map((e)=><option key={e.id} value={e.id} style={{ background:'#1B2127' }}>{e.nume}</option>)}
            </select>
          </div>
        )}
      </div>
      <p className="text-xs mb-2" style={{ color:'#5C6570' }}>Orele implicite se aplică persoanelor noi adăugate; fiecare persoană își poate ajusta apoi propriul interval.</p>
      <PersonHoursEditor persoane={persoane} setPersoane={setPersoane} defaultInceput={oraInceput} defaultSfarsit={oraSfarsit} echipaPermisa={echipaPermisa} />
      {arePozitii && !areStructura && pozitii && pozitii.length > 0 && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid #2A323B' }}>
          <PozitiiExecutateEditor pozitiiExecutate={pozitiiExecutate} setPozitiiExecutate={setPozitiiExecutate} pozitii={pozitii} />
        </div>
      )}
      {areMateriale && !areStructura && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid #2A323B' }}>
          <MaterialeFolositeEditor materialeFolosite={materialeFolosite} setMaterialeFolosite={setMaterialeFolosite} materials={materials} materialeLista={materialeLista} materialClient={false} pretDinLista={modR==='real_executat'} isManager={isManager} />
        </div>
      )}
      {modR==='orar_lucrari' && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid #2A323B' }}>
          <TipuriLucrariEditor tipuriLucrari={tipuriLucrari} setTipuriLucrari={setTipuriLucrari} />
        </div>
      )}
      {setStructuraSantier && (
        <div className="mt-4 pt-3" style={{ borderTop:'1px solid #2A323B' }}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="text-sm font-medium" style={{ color:'#E9E7E2' }}>🏢 Lucrări pe apartamente</div>
            <button type="button" onClick={()=>setShowStructEdit(!showStructEdit)} className="text-xs px-2.5 py-1 rounded-lg" style={{ color:'#2E8BD1', background:'#171C21', border:'1px solid #2E8BD166' }}>{showStructEdit ? 'Ascunde etaje/apart.' : '✎ Etaje / apartamente'}</button>
          </div>
          {areStructura && (areMateriale || arePozitii) && <p className="text-[11px] mb-1.5" style={{ color:'#4CAF7D' }}>ℹ️ Aici treci tot: cine, ce material/poziție, cantitatea și în care apartament. Devizul se face din aceste rânduri — nu mai e nevoie de rubrică separată de materiale/poziții.</p>}
          {showStructEdit && (
            <div className="rounded-lg p-2 mb-2" style={{ background:'#14181C', border:'1px solid #2A323B' }}>
              <SiteStructuraTab santierId={santierId} structuraSantier={structuraSantier} setStructuraSantier={setStructuraSantier} persist={persist} materials={materials} materialeLista={materialeLista} />
            </div>
          )}
          {structura && structura.length > 0 ? (
            <LucrariApartamenteEditor lucrari={lucrariApartamente} setLucrari={setLucrariApartamente} structura={structura} persoane={persoane} echipaNume={echipaNume} pozitii={pozitii} materialeLista={materialeLista} />
          ) : (
            <p className="text-xs" style={{ color:'#5C6570' }}>Adaugă etaje/apartamente cu butonul „✎ Etaje / apartamente" de sus, apoi poți nota cine a lucrat unde.</p>
          )}
        </div>
      )}
      <textarea placeholder="Alte observații (opțional)..." value={explicatii} onChange={(e)=>setExplicatii(e.target.value)} rows={2} className="w-full rounded-lg px-3 py-2 text-sm outline-none mt-3" style={inputStyle} />
      <div className="flex justify-between items-center mt-3">
        <span className="text-sm" style={{ color:'#8B93A0' }}>Total ore: <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(totalOreMin)}</span></span>
        <div className="flex gap-2">
          <button onClick={onCancel} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'#8B93A0', background:'#171C21' }}>Renunță</button>
          <button onClick={()=>onSave({ id: initial?.id || uid(), data, oraInceput, oraSfarsit, etapaId, persoane, materialeFolosite, pozitiiExecutate, tipuriLucrari, lucrariApartamente, explicatii })} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
        </div>
      </div>
    </div>
  );
}

function SiteStructuraTab({ santierId, structuraSantier, setStructuraSantier, persist, onBack, rapoarte, materials, materialeLista }) {
  const normM = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const optiuniMat = (()=>{
    const seen = new Set(), out = [];
    const push = (key, denumire, um)=>{ const k=normM(denumire); if(denumire && !seen.has(k)){ seen.add(k); out.push({ key, label:denumire, um }); } };
    (materialeLista||[]).forEach((m)=>push('l'+m.id, m.denumire, m.um));
    (materials||[]).filter((m)=>!m.arhivat).forEach((m)=>push('c'+m.id, m.denumire, m.um));
    // materiale deja introduse în structura acestui șantier → devin sugestii chiar fără import
    (structuraSantier||[]).filter((e)=>e.santierId===santierId).forEach((e)=>{
      (e.apartamente||[]).forEach((a)=>{ (a.materiale||[]).forEach((m)=>push('s'+m.id, m.denumire, m.um)); });
    });
    return out;
  })();
  const lucrariApart = (apId) => {
    const out = [];
    (rapoarte || []).filter((r)=>r.santierId===santierId).forEach((r)=>{
      (r.lucrariApartamente || []).forEach((l)=>{
        if (!(l.apartamenteIds || []).includes(apId)) return;
        const works = lucrariDinRand(l);
        if (!works.length && l.persoanaNume) { out.push({ data:r.data, persoanaNume:l.persoanaNume, tipLucrare:'', cantitate:'', um:'', ore:l.ore }); return; }
        works.forEach((w,idx)=> out.push({ data:r.data, persoanaNume:l.persoanaNume, tipLucrare:w.denumire, cantitate:w.cantitate, um:w.um, ore: idx===0?l.ore:'' }));
      });
    });
    return out.sort((a,b)=> a.data<b.data?1:-1);
  };
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  // Sortare după NUMĂRUL din nume, indiferent cum e scris prefixul ("Et.2", "Etaj 2", "et2" → toate = 2).
  // Fără număr (Parter, Subsol, Demisol) → înaintea etajelor numerotate. Ordinea iese 1,2,3...10 corect.
  const numDin = (s) => { const m = String(s||'').match(/-?\d+/); return m ? parseInt(m[0], 10) : null; };
  const cmpNume = (a, b) => {
    const na = numDin(a?.nume), nb = numDin(b?.nume);
    if (na === null && nb === null) return String(a?.nume||'').localeCompare(String(b?.nume||''), 'ro', { sensitivity:'base' });
    if (na === null) return -1;
    if (nb === null) return 1;
    if (na !== nb) return na - nb;
    return String(a?.nume||'').localeCompare(String(b?.nume||''), 'ro', { sensitivity:'base' });
  };
  const etaje = structuraSantier.filter((e)=>e.santierId===santierId).slice().sort(cmpNume);
  const [etajNou, setEtajNou] = useState('');
  const [apartNou, setApartNou] = useState({});
  const [openEtaj, setOpenEtaj] = useState({});
  const [selEtaj, setSelEtaj] = useState(null);
  const [showEtaje, setShowEtaje] = useState(false);
  const [matForm, setMatForm] = useState({});
  const [editMatId, setEditMatId] = useState({});
  const [cautare, setCautare] = useState('');
  const norm = (s) => String(s||'').toLowerCase().replace(/[\s.]/g,'');
  // Căutare deșteaptă pe tokeni: "etaj 1" → tot etajul 1; "ap1 etaj 2" → apartamentul 1 de la etajul 2; "ap1" → toate ap. 1.
  const parseCautare = (text) => {
    const floorNums = [], apNums = [], genericNums = [], textTerms = [];
    let pending = null; // ultimul cuvânt-cheie ("etaj" / "ap") așteaptă un număr
    String(text||'').toLowerCase().trim().split(/\s+/).filter(Boolean).forEach((tokRaw)=>{
      const tok = tokRaw.replace(/\./g,'');
      let m;
      if ((m = tok.match(/^(?:ap|apartament|apt)(\d+)$/))) { apNums.push(parseInt(m[1],10)); pending=null; }
      else if ((m = tok.match(/^(?:etaj|et|e)(\d+)$/))) { floorNums.push(parseInt(m[1],10)); pending=null; }
      else if (['etaj','et'].includes(tok)) { pending='floor'; }
      else if (['ap','apartament','apt'].includes(tok)) { pending='ap'; }
      else if (/^\d+$/.test(tok)) {
        const n = parseInt(tok,10);
        if (pending==='floor') floorNums.push(n);
        else if (pending==='ap') apNums.push(n);
        else genericNums.push(n); // număr liber (ex: „401") → caută peste tot, ca subșir
        pending=null;
      }
      else if (tok==='e') { pending='floor'; }
      else { textTerms.push(tok); pending=null; }
    });
    return { floorNums, apNums, genericNums, textTerms };
  };
  const cauta = parseCautare(cautare);
  const areCautare = cauta.floorNums.length>0 || cauta.apNums.length>0 || cauta.genericNums.length>0 || cauta.textTerms.length>0;
  const save = (next) => { setStructuraSantier(next); persist('structuraSantier', next); };
  const getForm = (apId) => matForm[apId] || { denumire:'', cantitate:1, um:'buc', descriere:'' };
  const setApartOre = (etajId, apId, ore) => { save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, ore} : a)} : e)); };

  const addEtaj = () => {
    if (!etajNou.trim()) return;
    save([...structuraSantier, { id: uid(), santierId, nume: etajNou.trim(), apartamente: [] }]);
    setEtajNou('');
  };
  const delEtaj = (id) => { if (!window.confirm('Ștergi acest etaj cu tot ce conține?')) return; save(structuraSantier.filter((e)=>e.id!==id)); };
  const renEtaj = (id, numeVechi) => {
    const nume = window.prompt('Redenumește etajul:', numeVechi);
    if (nume === null || !nume.trim()) return;
    save(structuraSantier.map((e)=> e.id===id ? {...e, nume: nume.trim()} : e));
  };
  const addApart = (etajId) => {
    const nume = (apartNou[etajId]||'').trim();
    if (!nume) return;
    save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:[...(e.apartamente||[]), { id: uid(), nume, materiale: [] }]} : e));
    setApartNou({...apartNou, [etajId]:''});
  };
  const delApart = (etajId, apId) => { if (!window.confirm('Ștergi acest apartament?')) return; save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).filter((a)=>a.id!==apId)} : e)); };
  const renApart = (etajId, apId, numeVechi) => {
    const nume = window.prompt('Redenumește apartamentul:', numeVechi);
    if (nume === null || !nume.trim()) return;
    save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, nume: nume.trim()} : a)} : e));
  };
  const addMat = (etajId, apId) => {
    const f = getForm(apId);
    if (!(f.denumire||'').trim()) return;
    const editing = editMatId[apId];
    if (editing) {
      save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:(a.materiale||[]).map((m)=> m.id===editing ? {...m, denumire:f.denumire.trim(), cantitate:Number(f.cantitate)||0, um:f.um||'buc', descriere:(f.descriere||'').trim()} : m)} : a)} : e));
      setEditMatId({...editMatId, [apId]: null});
    } else {
      const mat = { id: uid(), denumire: f.denumire.trim(), cantitate: Number(f.cantitate)||0, um: f.um||'buc', descriere:(f.descriere||'').trim() };
      save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:[...(a.materiale||[]), mat]} : a)} : e));
    }
    setMatForm({...matForm, [apId]: { denumire:'', cantitate:1, um:'buc', descriere:'' }});
  };
  const startEditMat = (apId, m) => { setMatForm({...matForm, [apId]: { denumire:m.denumire, cantitate:m.cantitate, um:m.um, descriere:m.descriere||'' }}); setEditMatId({...editMatId, [apId]: m.id}); };
  const cancelEditMat = (apId) => { setEditMatId({...editMatId, [apId]: null}); setMatForm({...matForm, [apId]: { denumire:'', cantitate:1, um:'buc', descriere:'' }}); };
  const delMat = (etajId, apId, matId) => { if (!window.confirm('Ștergi acest material?')) return; save(structuraSantier.map((e)=> e.id===etajId ? {...e, apartamente:(e.apartamente||[]).map((a)=> a.id===apId ? {...a, materiale:(a.materiale||[]).filter((m)=>m.id!==matId)} : a)} : e)); };

  const etajeVizibile = etaje.map((e)=>{
    const aps = (e.apartamente || []).slice().sort(cmpNume);
    if (!areCautare) return { e, aps, isOpen: !!openEtaj[e.id], show: true };
    const fnum = numDin(e.nume);
    const floorText = norm(e.nume);
    // filtru explicit pe numărul etajului ("etaj N")
    if (cauta.floorNums.length && (fnum === null || !cauta.floorNums.includes(fnum))) return { e, aps: [], isOpen: true, show: false };
    // etajul însuși se potrivește? (număr liber egal cu nr. etajului sau subșir în nume, ori text liber)
    const floorHit =
      cauta.genericNums.some((n)=> fnum===n || floorText.includes(String(n))) ||
      (cauta.textTerms.length>0 && cauta.textTerms.every((t)=>floorText.includes(t)));
    // predicat pe apartament: numărul liber („401") se potrivește dacă e egal cu nr. ap. SAU apare ca subșir în nume
    const apOut = aps.filter((a)=>{
      const anum = numDin(a.nume), at = norm(a.nume);
      if (cauta.apNums.length && (anum===null || !cauta.apNums.includes(anum))) return false;
      if (cauta.genericNums.length && !cauta.genericNums.some((n)=> anum===n || at.includes(String(n)))) return false;
      if (cauta.textTerms.length && !cauta.textTerms.every((t)=> at.includes(t) || floorText.includes(t))) return false;
      return true;
    });
    // doar „etaj N", fără altă constrângere → arată tot etajul
    if (cauta.floorNums.length && !cauta.apNums.length && !cauta.genericNums.length && !cauta.textTerms.length) return { e, aps, isOpen: true, show: true };
    // etajul se potrivește ca întreg (și nu s-a cerut un apartament anume) → arată tot etajul
    if (floorHit && !cauta.apNums.length) return { e, aps, isOpen: true, show: true };
    return { e, aps: apOut, isOpen: true, show: apOut.length > 0 };
  }).filter((x)=>x.show);

  const activeEtaj = etajeVizibile.find((x)=>x.e.id===selEtaj) || (areCautare ? etajeVizibile[0] : null);

  return (
    <div className="space-y-2">
      {onBack && <button onClick={onBack} className="text-xs" style={{ color:'#5C6570' }}>← Înapoi</button>}

      {/* Rând: căutare (stânga) · categoria „Etaje" (dreapta) */}
      <div className="flex items-center gap-2">
        <input placeholder="🔍 Caută" value={cautare} onChange={(e)=>setCautare(e.target.value)} className="rounded-lg px-2.5 py-1.5 text-sm outline-none" style={{ ...inputStyle, width:'110px' }} />
        <button onClick={()=>setShowEtaje(!showEtaje)} className="ml-auto flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#E9E7E2', background:'#1B2127', border:'1px solid #2A323B' }}>
          🏢 Etaje <span className="text-xs" style={{ color:'#5C6570' }}>({etaje.length})</span>
          <span style={{ fontSize:9, color:'#8B93A0' }}>{(showEtaje||areCautare) ? '▼' : '▶'}</span>
        </button>
      </div>

      {/* La click pe „Etaje" apar sub-taburile (etajele ca pastile) + adăugare */}
      {(showEtaje || areCautare) && (
      <div className="rounded-lg p-2 space-y-2" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="flex items-center gap-1.5 flex-wrap">
          {etaje.length === 0 && <span className="text-xs" style={{ color:'#5C6570' }}>Niciun etaj încă — adaugă mai jos.</span>}
          {areCautare && etajeVizibile.length === 0 && <span className="text-xs" style={{ color:'#8B93A0' }}>Niciun rezultat.</span>}
          {etajeVizibile.map(({ e })=>{
            const activ = activeEtaj && activeEtaj.e.id === e.id;
            return (
              <button key={e.id} onClick={()=>setSelEtaj(activ ? null : e.id)} className="text-xs px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap"
                style={{ color: activ?'#14181C':'#E9E7E2', background: activ?'#2E8BD1':'#171C21', border:'1px solid #2A323B' }}>
                🏢 {e.nume} <span style={{ color: activ?'#14181C':'#5C6570' }}>({(e.apartamente||[]).length})</span>
              </button>
            );
          })}
        </div>
        <div className="flex gap-2">
          <input placeholder="Etaj nou (ex: Parter, Etaj 1)" value={etajNou} onChange={(e)=>setEtajNou(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter') addEtaj(); }} className="flex-1 rounded-lg px-3 py-1.5 text-sm outline-none" style={inputStyle} />
          <button onClick={addEtaj} disabled={!etajNou.trim()} className="text-sm px-4 py-1.5 rounded-lg font-semibold whitespace-nowrap disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>Adaugă {etajNou.trim() || 'etaj'}</button>
        </div>
      </div>
      )}

      {/* Panoul etajului selectat — apare doar când apeși o pastilă */}
      {(showEtaje || areCautare) && activeEtaj && (()=>{
        const e = activeEtaj.e; const aps = activeEtaj.aps;
        return (
        <div className="rounded-lg p-2.5 space-y-1.5" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <div className="flex items-center justify-between">
            <span className="text-sm font-semibold" style={{ color:'#E9E7E2' }}>🏢 {e.nume} <span className="text-xs" style={{ color:'#5C6570' }}>· {(e.apartamente||[]).length} ap.</span></span>
            <div className="flex items-center gap-2.5 shrink-0">
              <button onClick={()=>renEtaj(e.id, e.nume)} title="Editează" style={{ color:'#8B93A0' }}><Icon size={13}>✎</Icon></button>
              <button onClick={()=>delEtaj(e.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={13}>🗑</Icon></button>
            </div>
          </div>
          <div className="flex gap-2">
            <input placeholder="Apartament (ex: Ap. 1)" value={apartNou[e.id]||''} onChange={(ev)=>setApartNou({...apartNou, [e.id]:ev.target.value})} onKeyDown={(ev)=>{ if(ev.key==='Enter') addApart(e.id); }} className="flex-1 rounded-lg px-3 py-1.5 text-sm outline-none" style={inputStyle} />
            <button onClick={()=>addApart(e.id)} disabled={!(apartNou[e.id]||'').trim()} className="text-sm px-3 py-1.5 rounded-lg font-semibold whitespace-nowrap disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>Adaugă {(apartNou[e.id]||'').trim() || 'apartament'}</button>
          </div>
          {aps.length === 0 && <div className="text-xs" style={{ color:'#5C6570' }}>Niciun apartament încă.</div>}
          {aps.map((a)=>{
            const f = getForm(a.id);
            return (
            <div key={a.id} className="rounded-lg p-2" style={{ background:'#171C21', border:'1px solid #2A323B' }}>
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-sm font-medium" style={{ color:'#E9E7E2' }}>🚪 {a.nume} <span className="text-xs" style={{ color:'#5C6570' }}>· {(a.materiale||[]).length} mat.</span></span>
                <div className="flex items-center gap-2.5 shrink-0">
                  <span className="flex items-center gap-1 text-[11px]" style={{ color:'#8B93A0' }}>⏱ Ore
                    <input type="number" inputMode="decimal" defaultValue={a.ore||''} onBlur={(ev)=>setApartOre(e.id, a.id, ev.target.value)} placeholder="0" className="w-12 rounded-lg px-1.5 py-1 text-xs outline-none text-center" style={inputStyle} />
                  </span>
                  <button onClick={()=>renApart(e.id, a.id, a.nume)} title="Editează" style={{ color:'#8B93A0' }}><Icon size={12}>✎</Icon></button>
                  <button onClick={()=>delApart(e.id, a.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                </div>
              </div>
              <div className="space-y-1 mb-1.5">
                {(a.materiale||[]).length === 0 && <div className="text-[11px]" style={{ color:'#5C6570' }}>Niciun material adăugat.</div>}
                {(a.materiale||[]).map((m)=>(
                  <div key={m.id} className="text-xs px-2 py-1 rounded" style={{ background: editMatId[a.id]===m.id ? '#232C34' : '#1B2127' }}>
                    <div className="flex items-center justify-between">
                      <span style={{ color:'#E9E7E2' }}>{m.denumire} <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{m.cantitate} {m.um}</span></span>
                      <div className="flex items-center gap-2 shrink-0">
                        <button onClick={()=>startEditMat(a.id, m)} title="Editează" style={{ color:'#8B93A0' }}><Icon size={11}>✎</Icon></button>
                        <button onClick={()=>delMat(e.id, a.id, m.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={11}>🗑</Icon></button>
                      </div>
                    </div>
                    {m.descriere && <div className="mt-0.5" style={{ color:'#8B93A0' }}>{m.descriere}</div>}
                  </div>
                ))}
              </div>
              <div className="space-y-1.5">
                <div className="flex gap-1.5">
                  <AutocompleteInput value={f.denumire} onChange={(v)=>setMatForm({...matForm, [a.id]:{...f, denumire:v}})} onPick={(o)=>setMatForm({...matForm, [a.id]:{...f, denumire:o.label, um:o.um||f.um}})} options={optiuniMat} placeholder="Material (caută: doze, tablou, intek...)" minWidth="110px" />
                  <input type="number" value={f.cantitate} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, cantitate:ev.target.value}})} className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                  <input placeholder="UM" value={f.um} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, um:ev.target.value}})} className="w-12 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
                </div>
                <div className="flex gap-1.5">
                  <input placeholder="Descriere (opțional, ex: montaj îngropat)" value={f.descriere} onChange={(ev)=>setMatForm({...matForm, [a.id]:{...f, descriere:ev.target.value}})} className="flex-1 rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
                  <button onClick={()=>addMat(e.id, a.id)} disabled={!(f.denumire||'').trim()} className="text-xs px-3 py-1.5 rounded-lg font-semibold whitespace-nowrap disabled:opacity-40" style={{ color:'#14181C', background: editMatId[a.id] ? '#E9A23B' : '#4CAF7D' }}>{editMatId[a.id] ? 'Salvează' : 'Adaugă'}</button>
                  {editMatId[a.id] && <button onClick={()=>cancelEditMat(a.id)} className="text-xs px-2 py-1.5 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127' }}>✕</button>}
                </div>
              </div>
              {(()=>{ const ll = lucrariApart(a.id); return ll.length > 0 ? (
                <div className="mt-2 pt-1.5" style={{ borderTop:'1px solid #232C34' }}>
                  <div className="text-[11px] mb-1" style={{ color:'#8B93A0' }}>👷 Cine a lucrat aici:</div>
                  <div className="space-y-0.5">
                    {ll.map((l,i)=>(
                      <div key={i} className="text-[11px] flex items-center justify-between gap-2">
                        <span style={{ color:'#C08CE0' }}><b style={{ color:'#E9E7E2' }}>{l.persoanaNume||'?'}</b>{l.tipLucrare?' — '+l.tipLucrare:''}{(Number(l.cantitate)||0)>0?` — ${l.cantitate} ${l.um||''}`.trimEnd():''}</span>
                        <span className="shrink-0" style={{ color:'#8B93A0' }}>{l.ore?l.ore+'h · ':''}{fmtData(l.data)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : null; })()}
            </div>
            );
          })}
        </div>
        );
      })()}
    </div>
  );
}

// Parsează rândurile dintr-un Excel de deviz (Poziții sau Listă cantități).
// Caută rândul de antet (care conține „Denumire") și mapează coloanele; ignoră rândurile TOTAL/TVA.
function parseDevizRows(rows) {
  const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/\s+/g,' ').trim();
  // Acceptă numere din Excel (deja numerice) și text cu format românesc (1.234,56) sau englez (1234.56).
  const num = (v) => {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = String(v == null ? '' : v).trim().replace(/[^\d.,-]/g, '');
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(',', '.');
    const n = Number(s);
    return isFinite(n) ? n : 0;
  };
  const round4 = (n) => Math.round((Number(n)||0) * 10000) / 10000;

  // FORMAT F3 („Listă cu cantități de lucrări"): fiecare articol are prețul pe rânduri separate
  // (material: / manopera: / utilaj:), sub coloana „Cantitatea". Luăm prețul de manoperă.
  const flatCells = rows.flat().map(norm);
  if (flatCells.includes('manopera:') && flatCells.includes('material:')) {
    const hIdx = rows.findIndex((r)=> Array.isArray(r) && r.some((c)=>norm(c).includes('cantit')) && r.some((c)=>norm(c).includes('pret')||norm(c).includes('preț')));
    const hh = hIdx >= 0 ? rows[hIdx].map(norm) : [];
    const fc = (kw) => hh.findIndex((c)=> c && kw.some((k)=>c.includes(k)));
    let umColF = fc(['u.m','u/m','unitate']); if (umColF < 0) umColF = hh.findIndex((c)=> c === 'um');
    const cantColF = fc(['cantit']);
    const pretColF = fc(['pret unitar','preț unitar','pretul unitar','pret','preț']);
    const scorText = (v)=>{ const m = String(v).match(/[a-zăâîșț]/g); return m ? m.length : 0; };
    const denOf = (r)=>{ let best='', bs=-1; const lim = umColF > 0 ? umColF : r.length; for (let c=1;c<lim;c++){ const v=r[c]; if (typeof v!=='string' || !v.trim()) continue; const sc=scorText(v); if (sc>bs || (sc===bs && v.trim().length>best.length)) { bs=sc; best=v.trim(); } } return best; };
    const items = []; let cur = null;
    rows.forEach((r,i)=>{
      if (!Array.isArray(r) || i <= hIdx) return;
      const umv = String(r[umColF]==null?'':r[umColF]).trim();
      const den = denOf(r);
      const lbl = norm(r[cantColF]);
      if (umv && den && den.length > 3) {
        if (cur) items.push(cur);
        cur = { nrCrt:String(r[0]==null?'':r[0]).trim(), denumire:den.replace(/\s+/g,' '), um:umv, cantitate:0, pretUnitar:0, valoare:0, _mat:0 };
      } else if (cur) {
        if (lbl==='manopera:' || lbl==='manopera') cur.pretUnitar = round4(num(r[pretColF]));
        else if (lbl==='material:' || lbl==='material') cur._mat = round4(num(r[pretColF]));
      }
    });
    if (cur) items.push(cur);
    items.forEach((o)=>{ if (!(o.pretUnitar>0) && o._mat>0) o.pretUnitar = o._mat; delete o._mat; });
    return items;
  }

  // 1) Găsim rândul de antet: rândul cu cel puțin 2 cuvinte-cheie de coloană
  //    (unele Excel-uri au titluri/antet firmă deasupra, iar coloana „Denumire" poate fi fără titlu).
  const headerKw = ['denumire','descriere','articol','unitate','u.m','u/m','cantit','pret','preț','p.u','valoare','total','nr.'];
  let headerIdx = rows.findIndex((r)=> Array.isArray(r) && r.filter((c)=>{ const n = norm(c); return n && headerKw.some((k)=>n.includes(k)); }).length >= 2);
  const h = headerIdx >= 0 ? rows[headerIdx].map(norm) : [];
  const findCol = (kw) => h.findIndex((c)=> c && kw.some((k)=>c.includes(k)));
  let den = findCol(['denumire','descriere','articol']);
  let um = (()=>{ let i = findCol(['unitate','u.m','u/m']); if (i < 0) i = h.findIndex((c)=> c === 'um' || c === 'u m'); return i; })();
  let pret = findCol(['pret unitar','preț unitar','pret','preț','p.u','unitar','manoper']);
  let nr = findCol(['nr']);
  const idxCant = findCol(['cantit']);
  const idxTotal = findCol(['total']);
  const idxVal = findCol(['valoare']);
  const dataStart = (headerIdx >= 0 ? headerIdx : -1) + 1;
  const sample = rows.slice(dataStart, dataStart + 15).filter(Array.isArray);
  // Dacă „Denumire" n-are titlu, o găsim ca fiind coloana cu cel mai lung text din primele rânduri.
  if (den < 0) {
    let best = -1, bestLen = 0; const ncols = Math.max(0, ...sample.map((r)=>r.length));
    for (let c = 0; c < ncols; c++) {
      if (c === um || c === pret) continue;
      let len = 0, cnt = 0;
      sample.forEach((r)=>{ const v = r[c]; if (typeof v === 'string' && v.trim()) { len += v.trim().length; cnt++; } });
      const avg = cnt ? len / cnt : 0;
      if (avg > bestLen) { bestLen = avg; best = c; }
    }
    den = best >= 0 ? best : 1;
  }
  if (um < 0) um = den + 1;
  if (nr < 0) nr = 0;
  if (pret < 0) pret = (idxVal >= 0 && idxVal !== idxTotal) ? idxVal : -1;
  // Dacă nu există coloană U.M. reală și „um" a nimerit peste coloana de preț → n-o folosim (default „buc").
  if (um >= 0 && (um === pret || um === idxCant)) um = -1;
  const cantCol = idxCant; // dacă nu există coloană „cantitate" (ex: cantități pe etaje) → 0, se completează din rapoarte
  const valCol = idxTotal >= 0 ? idxTotal : (idxVal >= 0 ? idxVal : -1);
  const out = [];
  rows.slice(dataStart).forEach((r)=>{
    if (!Array.isArray(r)) return;
    const den0 = r[den];
    if (!den0 || !String(den0).trim()) return;
    const denStr = String(den0).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
    if (/^(total|tva|subtotal|total cu tva)/i.test(denStr)) return;
    const umStr = String(r[um] == null ? '' : r[um]).trim();
    const pretV = pret >= 0 ? num(r[pret]) : 0;
    // Rând de secțiune (ex: „1.TABLOURI ELECTRICE"): fără U.M. și fără preț → îl sărim.
    if (!umStr && !(pretV > 0)) return;
    const cantV = cantCol >= 0 ? num(r[cantCol]) : 0;
    out.push({
      nrCrt: String(r[nr] == null ? '' : r[nr]).trim(),
      denumire: denStr,
      um: umStr || 'buc',
      cantitate: round4(cantV),
      pretUnitar: round4(pretV),
      valoare: round4(valCol >= 0 ? num(r[valCol]) : (cantV * pretV)),
    });
  });
  return out;
}

      const flatC = rows.flat().map((c)=>String(c==null?'':c).toLowerCase().replace(/\s+/g,' ').trim());

      if (!items.length) window.alert(info);
    } catch (err) { window.alert('Nu am putut citi foaia. Verifică formatul (.xlsx).'); }
  };
  const importExcel = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });

  };
  const startEdit = (x) => { setEditId(x.id); setEditRow({ denumire:x.denumire, um:x.um, cantitate:x.cantitate, pretUnitar:x.pretUnitar, nrCrt:x.nrCrt }); };

  const delRow = (id) => { if (!window.confirm('Ștergi acest rând?')) return; save(lista.filter((x)=>x.id!==id)); };

    if (!addRow.denumire.trim()) return;

            <div className="flex flex-wrap gap-2">
              {sheetPick.names.map((n)=>(
                <button key={n} onClick={()=>importaFoaia(sheetPick.wb, n)} className="text-xs px-3 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>📄 {n}</button>
              ))}
              <button onClick={()=>setSheetPick(null)} className="text-xs px-3 py-2 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127' }}>Renunță</button>
            </div>
          </div>
        )}
      </div>
      )}

      {items.length > 0 && (
        <div className="flex items-center gap-2 flex-wrap">
          <input value={cautaLista} onChange={(e)=>setCautaLista(e.target.value)} placeholder={`🔍 Caută în ${isPoz?'poziții':'materiale'} (ex: doze, cablu...)`} className="flex-1 min-w-[160px] rounded-lg px-2.5 py-1.5 text-sm outline-none" style={inputStyle} />
          <span className="text-[11px]" style={{ color:'#5C6570' }}>{qLista ? `${filtrate.length} din ${items.length}` : `${items.length} rânduri`}</span>
        </div>
      )}

      {items.length === 0 ? (
        <div className="text-center py-8 text-sm" style={{ color:'#8B93A0' }}>{isManager ? `Nicio ${isPoz?'poziție':'listă de materiale'} încă. Importă din Excel sau adaugă manual mai jos.` : 'Nimic adăugat încă la acest șantier.'}</div>
      ) : filtrate.length === 0 ? (
        <div className="text-center py-6 text-sm" style={{ color:'#8B93A0' }}>Niciun rezultat pentru „{cautaLista}".</div>
      ) : (
        <div className="rounded-lg overflow-hidden" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <div className="grid gap-1 px-2 py-1.5 text-[10px] uppercase tracking-wide" style={{ gridTemplateColumns:gridCols, color:'#8B93A0', background:'#20272e' }}>
            <span>Nr</span><span>Denumire</span><span>U.M.</span><span>Cant.</span>{isManager && <span>Preț</span>}{isManager && <span>Valoare</span>}<span></span>
          </div>
          {vizibile.map((x, i)=> editId===x.id ? (
            <div key={x.id} className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1px solid #2A323B', background:'#232C34' }}>
              <span className="text-[11px]" style={{ color:'#5C6570' }}>{i+1}</span>

              <input value={editRow.um} onChange={(e)=>setEditRow({...editRow, um:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />
              <input type="number" value={editRow.cantitate} onChange={(e)=>setEditRow({...editRow, cantitate:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />
              {isManager && <input type="number" value={editRow.pretUnitar} onChange={(e)=>setEditRow({...editRow, pretUnitar:e.target.value})} className="rounded px-1 py-1 text-xs outline-none text-center" style={inputStyle} />}
              {isManager && <span className="text-xs text-right" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money((Number(editRow.cantitate)||0)*(Number(editRow.pretUnitar)||0))}</span>}

              </div>
            </div>
          ) : (
            <div key={x.id} className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1px solid #2A323B' }}>
              <span className="text-[11px]" style={{ color:'#5C6570' }}>{i+1}</span>

                <button onClick={()=>delRow(x.id)} title="Șterge" style={{ color:'#E05252' }}><Icon size={11}>🗑</Icon></button>

          <div className="grid gap-1 px-2 py-1.5 items-center" style={{ gridTemplateColumns:gridCols, borderTop:'1.5px solid #2A323B', background:'#20272e' }}>

            <span className="text-xs text-right font-semibold" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(totalVal)}</span><span></span>
          </div>
          )}
          {!qLista && filtrate.length > LIM_LISTA && (
            <button onClick={()=>setShowAllLista(!showAllLista)} className="w-full text-xs py-2 font-medium" style={{ color:'#2E8BD1', background:'#20272e', borderTop:'1px solid #2A323B' }}>
              {showAllLista ? '▲ Restrânge' : `▼ Arată toate (${filtrate.length})`}
            </button>
          )}
        </div>
      )}

      <div className="rounded-lg p-2.5" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="text-xs mb-1.5" style={{ color:'#8B93A0' }}>Adaugă manual un rând:</div>
        <div className="flex gap-1.5 flex-wrap">
          <input placeholder={isPoz?'Denumire poziție':'Denumire material'} value={addRow.denumire} onChange={(e)=>setAddRow({...addRow, denumire:e.target.value})} className="flex-1 min-w-[140px] rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
          <input placeholder="U.M." value={addRow.um} onChange={(e)=>setAddRow({...addRow, um:e.target.value})} className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
          <input type="number" placeholder="Cant." value={addRow.cantitate} onChange={(e)=>setAddRow({...addRow, cantitate:e.target.value})} className="w-16 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />
          {isManager && <input type="number" placeholder="Preț" value={addRow.pretUnitar} onChange={(e)=>setAddRow({...addRow, pretUnitar:e.target.value})} className="w-16 rounded-lg px-2 py-1.5 text-xs outline-none text-center" style={inputStyle} />}
          <button onClick={addNew} disabled={!addRow.denumire.trim()} className="text-xs px-3 py-1.5 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>+ Adaugă</button>
        </div>
      </div>
    </div>
  );
}

                  const msgFor = (err)=>{
                    if (err.code === 1) return 'Accesul la locație a fost refuzat. iPhone: Setări → Confidențialitate și securitate → Servicii de localizare (pornit) → Safari → „Cât timp folosesc aplicația" + „Locație precisă" pornită. Laptop/Chrome: apasă pe iconița de locație din bara de adrese și permite.';
                    if (err.code === 2) return 'Poziția nu poate fi determinată acum (fără semnal GPS/rețea). Încearcă din nou.';
                    if (err.code === 3) return 'A durat prea mult obținerea locației. Verifică semnalul și încearcă din nou.';
                    return err.message || 'Nu am putut obține locația.';
                  };
                  const onOk = (pos, metoda)=>{ setPinLoading(false); setPinCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, method: metoda }); setPinStatus(''); };
                  setPinLoading(true); setPinStatus('Se caută locația...');

                      } else {
