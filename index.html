  const [aratGata, setAratGata] = useState(false);
  const formRef = useRef(null);
  const isManager = currentUser?.rol === 'Manager';
  const lista = mementouri || [];
  useEffect(()=>{ if (form && formRef.current) { try { formRef.current.scrollIntoView({ behavior:'smooth', block:'center' }); } catch {} } }, [form && form.id]);

  const azi = new Date().toISOString().slice(0,10);
  const maine = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const acum = new Date();

  const formNou = (preset) => ({
    id: uid(), titlu:'', tip:'intalnire', data: preset || azi, ora:'09:00', detalii:'',
    clientId:'', santierId:'', pentruUserId: currentUser?.id || '', repeta:'nu',
    gata:false, anuntat:false, creatId: currentUser?.id || '', creatNume: currentUser?.nume || '',
  });
  const salveaza = () => {
    if (!String(form.titlu).trim()) return;
    const next = lista.some((m)=>m.id===form.id) ? lista.map((m)=> m.id===form.id ? { ...form, anuntat:false } : m) : [{ ...form }, ...lista];
    setMementouri(next); persist('mementouri', next);
    // Dacă memento-ul e pentru altcineva, îl anunț acum că i s-a pus ceva în calendar.
    if (form.pentruUserId && form.pentruUserId !== currentUser?.id) {
      notifica(form.pentruUserId, { title:'🔔 Ai un memento nou', body:`${form.titlu} — ${fmtData(form.data)} la ${form.ora}.`, tag:'memento-nou' }, currentUser?.id);
    }
    setForm(null);
  };
  const sterge = (id) => {
    if (!window.confirm('Ștergi acest memento?')) return;
    const next = lista.filter((m)=>m.id!==id);
    setMementouri(next); persist('mementouri', next);
  };
  const bifeaza = (m) => {
    let next;
    const urm = m.repeta && m.repeta !== 'nu' ? memUrmatoarea(m) : null;
    if (urm) next = lista.map((x)=> x.id===m.id ? { ...x, data: urm, gata:false, anuntat:false } : x);
    else next = lista.map((x)=> x.id===m.id ? { ...x, gata: !x.gata } : x);
    setMementouri(next); persist('mementouri', next);
  };
  const amanaOra = (m, ore) => {
    const d = new Date(memMoment(m));
    d.setHours(d.getHours() + ore);
    const next = lista.map((x)=> x.id===m.id ? { ...x, data: d.toISOString().slice(0,10), ora: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, anuntat:false, gata:false } : x);
    setMementouri(next); persist('mementouri', next);
  };

  // Doar ce mă privește: puse pentru mine (sau făcute de mine fără destinatar)
  const aleMele = lista.filter((m)=> (m.pentruUserId ? m.pentruUserId === currentUser?.id : m.creatId === currentUser?.id));
  const active = aleMele.filter((m)=>!m.gata).slice().sort((a,b)=> memMoment(a).localeCompare(memMoment(b)));
  const gata = aleMele.filter((m)=>m.gata).slice().sort((a,b)=> memMoment(b).localeCompare(memMoment(a)));
  const restante = active.filter((m)=> new Date(memMoment(m)) < acum);
  const deAzi = active.filter((m)=> m.data === azi && new Date(memMoment(m)) >= acum);
  const deMaine = active.filter((m)=> m.data === maine);
  const urmeaza = active.filter((m)=> m.data > maine);
  const numeUser = (id)=> (colegi||[]).find((u)=>u.id===id)?.nume || '';

  const randMemento = (m) => {
    const t = memTip(m.tip);
    const cl = (clients||[]).find((c)=>c.id===m.clientId)?.nume || '';
    const st = (santiere||[]).find((s)=>s.id===m.santierId)?.nume || '';
    const eRestant = !m.gata && new Date(memMoment(m)) < acum;
    const pentruAltul = m.pentruUserId && m.pentruUserId !== currentUser?.id;
    return (
      <div key={m.id} className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)', borderLeft:`4px solid ${eRestant ? '#E05252' : t.culoare}`, opacity: m.gata ? 0.6 : 1 }}>
        <div className="flex items-start justify-between gap-2">
          <div className="min-w-0">
            <div className="text-sm font-semibold" style={{ color:'var(--text)', textDecoration: m.gata ? 'line-through' : 'none' }}>{m.titlu}</div>
            <div className="text-[11px] mt-0.5" style={{ color: eRestant ? '#E05252' : 'var(--muted2)' }}>
              <span style={{ color: eRestant ? '#E05252' : t.culoare }}>{t.label}</span> · 🕐 {fmtData(m.data)} {m.ora}
              {eRestant && ' · a trecut'}
              {m.repeta && m.repeta !== 'nu' && ` · 🔁 ${m.repeta}`}
              {cl && ` · 👥 ${cl}`}{st && ` · 🏗 ${st}`}
              {pentruAltul && ` · pentru ${numeUser(m.pentruUserId)}`}
            </div>
            {m.detalii && <div className="text-xs mt-1" style={{ color:'var(--muted)', whiteSpace:'pre-line', lineHeight:1.5 }}>{m.detalii}</div>}
          </div>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={()=>bifeaza(m)} title={m.gata ? 'Pune înapoi' : 'Gata'} className="px-2 py-1 rounded-lg text-xs font-semibold" style={{ color: m.gata ? 'var(--muted)' : '#14181C', background: m.gata ? 'var(--panel2)' : '#4CAF7D' }}>{m.gata ? '↩' : '✓'}</button>
            <button onClick={()=>setForm({ ...m })} className="text-[11px] px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
            <button onClick={()=>sterge(m.id)} style={{ color:'#E05252' }}>🗑</button>
          </div>
        </div>
        {!m.gata && (
          <div className="flex gap-1.5 mt-2 flex-wrap">
            <button onClick={()=>amanaOra(m, 1)} className="text-[10px] px-2 py-0.5 rounded" style={{ color:'var(--muted)', background:'var(--panel2)' }}>+1 oră</button>
            <button onClick={()=>amanaOra(m, 24)} className="text-[10px] px-2 py-0.5 rounded" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Mâine</button>
            <button onClick={()=>amanaOra(m, 24*7)} className="text-[10px] px-2 py-0.5 rounded" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Peste o săptămână</button>
          </div>
        )}
      </div>
    );
  };

  const sectiune = (titlu, arr, culoare) => arr.length === 0 ? null : (
    <div className="mb-4">
      <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color: culoare || 'var(--muted2)' }}>{titlu} ({arr.length})</div>
      <div className="space-y-2">{arr.map(randMemento)}</div>
    </div>
  );

  return (
    <div className="max-w-2xl">
      <div className="flex justify-between items-center mb-1 gap-2">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>🔔 Memento</h2>
        {!form && <button onClick={()=>setForm(formNou())} className="text-sm px-3 py-1.5 rounded-lg font-semibold whitespace-nowrap" style={{ color:'#14181C', background:'#2E8BD1' }}>➕ Memento nou</button>}
      </div>
      <p className="text-xs mb-3" style={{ color:'var(--muted2)' }}>Aplicația îți aduce aminte: ai întâlnire cu cineva, ai de sunat, de comandat, de plătit. Primești notificare pe telefon la ora pusă.</p>

      {!form && (
        <div className="flex gap-1.5 flex-wrap mb-3">
          <button onClick={()=>setForm(formNou(azi))} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>+ Azi</button>
          <button onClick={()=>setForm(formNou(maine))} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>+ Mâine</button>
          <button onClick={()=>{ const d=new Date(); d.setDate(d.getDate()+7); setForm(formNou(d.toISOString().slice(0,10))); }} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>+ Peste o săptămână</button>
        </div>
      )}

      {form && (
        <div ref={formRef} className="rounded-xl p-4 mb-4 space-y-2" style={{ background:'var(--panel)', border:'1px solid #2E8BD166' }}>
          <div className="text-sm font-semibold" style={{ color:'var(--text)' }}>{lista.some((m)=>m.id===form.id) ? '✏️ Editează memento' : '➕ Memento nou'}</div>
          <input placeholder="Ce trebuie să faci? (ex: Întâlnire cu dl. Popescu la birou)" value={form.titlu} onChange={(e)=>setForm({ ...form, titlu:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex flex-wrap gap-1.5">
            {MEMENTO_TIPURI.map((t)=>(
              <button key={t.id} onClick={()=>setForm({ ...form, tip:t.id })} className="text-[11px] px-2.5 py-1 rounded-full" style={{ color: form.tip===t.id?'#14181C':'var(--muted)', background: form.tip===t.id?t.culoare:'var(--panel2)', border:'1px solid var(--border)', fontWeight: form.tip===t.id?700:400 }}>{t.label}</button>
            ))}
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs" style={{ color:'var(--muted)' }}>Când:</span>
            <RoCalendarPicker value={form.data} onChange={(v)=>setForm({ ...form, data:v })} />
            <RoTimePicker value={form.ora} onChange={(v)=>setForm({ ...form, ora:v })} />
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs" style={{ color:'var(--muted)' }}>Se repetă:</span>
            {[['nu','O singură dată'],['zilnic','Zilnic'],['saptamanal','Săptămânal'],['lunar','Lunar']].map(([v,l])=>(
              <button key={v} onClick={()=>setForm({ ...form, repeta:v })} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color: form.repeta===v?'#14181C':'var(--muted)', background: form.repeta===v?'#2E8BD1':'var(--panel2)', border:'1px solid var(--border)' }}>{l}</button>
            ))}
          </div>
          <textarea placeholder="Detalii (opțional) — ce ai de discutat, ce să nu uiți..." value={form.detalii} onChange={(e)=>setForm({ ...form, detalii:e.target.value })} rows={3} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="grid grid-cols-2 gap-2">
            <select value={form.clientId} onChange={(e)=>setForm({ ...form, clientId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
              <option value="" style={{ background:'var(--panel)' }}>— client (opțional) —</option>
              {(clients||[]).map((c)=><option key={c.id} value={c.id} style={{ background:'var(--panel)' }}>{c.nume}</option>)}
            </select>
            <select value={form.santierId} onChange={(e)=>setForm({ ...form, santierId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
              <option value="" style={{ background:'var(--panel)' }}>— șantier (opțional) —</option>
              {(santiere||[]).map((s)=><option key={s.id} value={s.id} style={{ background:'var(--panel)' }}>{s.nume}</option>)}
            </select>
          </div>
          {isManager && (colegi||[]).length > 0 && (
            <div>
              <div className="text-[11px] mb-0.5" style={{ color:'var(--muted)' }}>Pentru cine e memento-ul</div>
              <select value={form.pentruUserId} onChange={(e)=>setForm({ ...form, pentruUserId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
                <option value={currentUser?.id} style={{ background:'var(--panel)' }}>Pentru mine</option>
                {(colegi||[]).filter((u)=>u.id!==currentUser?.id).map((u)=><option key={u.id} value={u.id} style={{ background:'var(--panel)' }}>{u.nume}</option>)}
              </select>
            </div>
          )}
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={salveaza} disabled={!String(form.titlu).trim()} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </div>
      )}

      {active.length === 0 && gata.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Niciun memento. Apasă „➕ Memento nou".</div>
      ) : (<>
        {sectiune('⛔ Au trecut', restante, '#E05252')}
        {sectiune('📅 Astăzi', deAzi, '#2E8BD1')}
        {sectiune('📅 Mâine', deMaine, '#E9A23B')}
        {sectiune('📆 Următoarele', urmeaza)}
        {gata.length > 0 && (
          <div>
            <button onClick={()=>setAratGata(!aratGata)} className="text-[11px] px-2.5 py-1 rounded-lg mb-2" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>{aratGata ? 'Ascunde rezolvate ▲' : `Arată rezolvate (${gata.length}) ▼`}</button>
            {aratGata && <div className="space-y-2">{gata.map(randMemento)}</div>}
          </div>
        )}
      </>)}
    </div>
  );
}

// 📝 Notițe (doar manager) — tot ce afli la întâlniri, necesar de materiale, idei de preț.
// Dintr-o notiță cu listă de materiale poți face direct o ofertă, fără să scrii de două ori.
const NOTE_CATEGORII = [
  { id:'intalnire', label:'🤝 Întâlnire client', culoare:'#2E8BD1' },
  { id:'materiale', label:'📦 Necesar materiale', culoare:'#E9A23B' },
  { id:'oferta', label:'💰 Ofertă / preț', culoare:'#4CAF7D' },
  { id:'comanda', label:'🛒 De comandat', culoare:'#C08CE0' },
  { id:'idee', label:'💡 Idee / de ținut minte', culoare:'#8B93A0' },
];
const noteCat = (id) => NOTE_CATEGORII.find((c)=>c.id===id) || NOTE_CATEGORII[4];

function NotiteTab({ notite, setNotite, persist, clients, santiere, currentUser, onOfertaDinNota }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [form, setForm] = useState(null);
  const [cauta, setCauta] = useState('');
  const [filtru, setFiltru] = useState('');
  const formRef = useRef(null);
  const lista = notite || [];
  const norm = (s)=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  useEffect(()=>{ if (form && formRef.current) { try { formRef.current.scrollIntoView({ behavior:'smooth', block:'center' }); } catch {} } }, [form && form.id]);

  const formNou = () => ({ id: uid(), titlu:'', categorie:'intalnire', clientId:'', santierId:'', text:'', materiale:[], fixat:false, data: new Date().toISOString().slice(0,10), autor: currentUser?.nume || '' });
  const salveaza = () => {
    if (!String(form.titlu).trim() && !String(form.text).trim()) return;
    const curat = { ...form, materiale: (form.materiale||[]).filter((m)=>String(m.denumire||'').trim()) };
    const next = lista.some((n)=>n.id===curat.id) ? lista.map((n)=> n.id===curat.id ? curat : n) : [curat, ...lista];
    setNotite(next); persist('notite', next); setForm(null);
  };
  const sterge = (id) => {
    if (!window.confirm('Ștergi definitiv această notiță?')) return;
    const next = lista.filter((n)=>n.id!==id);
    setNotite(next); persist('notite', next);
  };
  const fixeaza = (id) => {
    const next = lista.map((n)=> n.id===id ? { ...n, fixat: !n.fixat } : n);
    setNotite(next); persist('notite', next);
  };
  const copiaza = (n) => {
    const cl = (clients||[]).find((c)=>c.id===n.clientId);
    const st = (santiere||[]).find((s)=>s.id===n.santierId);
    const linii = [
      n.titlu || '(fără titlu)',
      `${noteCat(n.categorie).label} · ${fmtData(n.data)}`,
      cl ? `Client: ${cl.nume}` : '', st ? `Șantier: ${st.nume}` : '',
      '', n.text || '',
      (n.materiale||[]).length ? '\nMateriale:' : '',
      ...(n.materiale||[]).map((m)=>`• ${m.denumire} — ${m.cantitate || ''} ${m.um || ''}`.trim()),
    ].filter((x)=>x !== '');
    const txt = linii.join('\n');
    try { navigator.clipboard.writeText(txt); window.alert('Notița a fost copiată. O poți lipi în WhatsApp, e-mail etc.'); }
    catch (_) { window.prompt('Copiază textul:', txt); }
  };

  // --- Materiale în notiță ---
  const addMat = () => setForm({ ...form, materiale:[...(form.materiale||[]), { id: uid(), denumire:'', cantitate:'', um:'buc' }] });
  const updMat = (id, f, v) => setForm({ ...form, materiale:(form.materiale||[]).map((m)=> m.id===id ? { ...m, [f]:v } : m) });
  const delMat = (id) => setForm({ ...form, materiale:(form.materiale||[]).filter((m)=>m.id!==id) });

  const termeni = norm(cauta).split(/\s+/).filter((w)=>w.length>=2);
  const numeClient = (id)=> (clients||[]).find((c)=>c.id===id)?.nume || '';
  const numeSantier = (id)=> (santiere||[]).find((s)=>s.id===id)?.nume || '';
  const vizibile = lista.filter((n)=>{
    if (filtru && n.categorie !== filtru) return false;
    if (!termeni.length) return true;
    const t = norm([n.titlu, n.text, numeClient(n.clientId), numeSantier(n.santierId), noteCat(n.categorie).label, (n.materiale||[]).map((m)=>m.denumire).join(' ')].join(' '));
    return termeni.every((w)=>t.includes(w));
  }).slice().sort((a,b)=>{
    if (!!b.fixat !== !!a.fixat) return b.fixat ? 1 : -1;
    return String(b.data||'').localeCompare(String(a.data||''));
  });

  return (
    <div className="max-w-2xl">
      <div className="flex justify-between items-center mb-1 gap-2">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>📝 Notițe</h2>
        {!form && <button onClick={()=>setForm(formNou())} className="text-sm px-3 py-1.5 rounded-lg font-semibold whitespace-nowrap" style={{ color:'#14181C', background:'#2E8BD1' }}>➕ Notiță nouă</button>}
      </div>
      <p className="text-xs mb-3" style={{ color:'var(--muted2)' }}>Tot ce afli la întâlniri, ce materiale trebuie comandate, idei de preț. Le vezi doar tu. Dintr-o notiță cu materiale poți face direct o ofertă.</p>

      {form && (
        <div ref={formRef} className="rounded-xl p-4 mb-4 space-y-2" style={{ background:'var(--panel)', border:'1px solid #2E8BD166' }}>
          <div className="text-sm font-semibold" style={{ color:'var(--text)' }}>{lista.some((n)=>n.id===form.id) ? '✏️ Editează notița' : '➕ Notiță nouă'}</div>
          <input placeholder="Titlu (ex: Întâlnire Popescu — bloc Aurel Vlaicu)" value={form.titlu} onChange={(e)=>setForm({ ...form, titlu:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex flex-wrap gap-1.5">
            {NOTE_CATEGORII.map((c)=>(
              <button key={c.id} onClick={()=>setForm({ ...form, categorie:c.id })} className="text-[11px] px-2.5 py-1 rounded-full" style={{ color: form.categorie===c.id?'#14181C':'var(--muted)', background: form.categorie===c.id?c.culoare:'var(--panel2)', border:'1px solid var(--border)', fontWeight: form.categorie===c.id?700:400 }}>{c.label}</button>
            ))}
          </div>
          <div className="grid grid-cols-2 gap-2">
            <select value={form.clientId} onChange={(e)=>setForm({ ...form, clientId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
              <option value="" style={{ background:'var(--panel)' }}>— client (opțional) —</option>
              {(clients||[]).map((c)=><option key={c.id} value={c.id} style={{ background:'var(--panel)' }}>{c.nume}</option>)}
            </select>
            <select value={form.santierId} onChange={(e)=>setForm({ ...form, santierId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
              <option value="" style={{ background:'var(--panel)' }}>— șantier (opțional) —</option>
              {(santiere||[]).map((s)=><option key={s.id} value={s.id} style={{ background:'var(--panel)' }}>{s.nume}</option>)}
            </select>
          </div>
          <textarea placeholder="Ce s-a discutat, ce a cerut clientul, ce ai de făcut..." value={form.text} onChange={(e)=>setForm({ ...form, text:e.target.value })} rows={5} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />

          <div className="rounded-lg p-2.5" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
            <div className="text-[11px] mb-1.5" style={{ color:'var(--muted)' }}>📦 Materiale de care e nevoie (opțional — din ele poți face oferta)</div>
            {(form.materiale||[]).map((m)=>(
              <div key={m.id} className="flex items-center gap-1.5 mb-1.5">
                <input placeholder="Denumire" value={m.denumire} onChange={(e)=>updMat(m.id,'denumire',e.target.value)} className="flex-1 min-w-0 rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
                <input placeholder="Cant." value={m.cantitate} onChange={(e)=>updMat(m.id,'cantitate',e.target.value)} className="w-16 rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
                <input placeholder="buc" value={m.um} onChange={(e)=>updMat(m.id,'um',e.target.value)} className="w-14 rounded-lg px-2 py-1.5 text-xs outline-none" style={inputStyle} />
                <button onClick={()=>delMat(m.id)} style={{ color:'#E05252' }}>🗑</button>
              </div>
            ))}
            <button onClick={addMat} className="text-[11px] px-2 py-1 rounded" style={{ color:'#2E8BD1' }}>➕ Adaugă material</button>
          </div>

          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={salveaza} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </div>
      )}

      <input value={cauta} onChange={(e)=>setCauta(e.target.value)} placeholder="🔍 Caută în notițe..." className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
      <div className="flex flex-wrap gap-1.5 mb-3">
        <button onClick={()=>setFiltru('')} className="text-[11px] px-2.5 py-1 rounded-full" style={{ color: !filtru?'#14181C':'var(--muted)', background: !filtru?'#2E8BD1':'var(--panel2)', border:'1px solid var(--border)' }}>Toate</button>
        {NOTE_CATEGORII.map((c)=>(
          <button key={c.id} onClick={()=>setFiltru(filtru===c.id?'':c.id)} className="text-[11px] px-2.5 py-1 rounded-full" style={{ color: filtru===c.id?'#14181C':'var(--muted)', background: filtru===c.id?c.culoare:'var(--panel2)', border:'1px solid var(--border)' }}>{c.label}</button>
        ))}
      </div>

      {vizibile.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>{lista.length === 0 ? 'Nicio notiță încă. Apasă „➕ Notiță nouă".' : 'Nicio notiță găsită.'}</div>
      ) : (
        <div className="space-y-2">
          {vizibile.map((n)=>{
            const cat = noteCat(n.categorie);
            const cl = numeClient(n.clientId), st = numeSantier(n.santierId);
            return (
              <div key={n.id} className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)', borderLeft:`4px solid ${cat.culoare}` }}>
                <div className="flex items-start justify-between gap-2 mb-1">
                  <div className="min-w-0">
                    <div className="text-sm font-semibold" style={{ color:'var(--text)' }}>{n.fixat && '📌 '}{n.titlu || '(fără titlu)'}</div>
                    <div className="text-[11px]" style={{ color:'var(--muted2)' }}>
                      <span style={{ color:cat.culoare }}>{cat.label}</span> · {fmtData(n.data)}{cl && ` · 👥 ${cl}`}{st && ` · 🏗 ${st}`}
                    </div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={()=>fixeaza(n.id)} title={n.fixat?'Scoate din fixate':'Fixează sus'} className="px-1.5 py-0.5 rounded text-xs" style={{ color: n.fixat?'#E9A23B':'var(--muted2)' }}>📌</button>
                    <button onClick={()=>copiaza(n)} title="Copiază notița" className="px-1.5 py-0.5 rounded text-xs" style={{ color:'var(--muted2)' }}>📋</button>
                    <button onClick={()=>setForm({ ...n, materiale: n.materiale || [] })} className="text-[11px] px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                    <button onClick={()=>sterge(n.id)} style={{ color:'#E05252' }}>🗑</button>
                  </div>
                </div>
                {n.text && <div className="text-xs mt-1" style={{ color:'var(--muted)', lineHeight:1.6, whiteSpace:'pre-line' }}>{n.text}</div>}
                {(n.materiale||[]).length > 0 && (
                  <div className="mt-2 rounded-lg p-2" style={{ background:'var(--panel2)' }}>
                    <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color:'var(--muted2)' }}>📦 Materiale</div>
                    {(n.materiale||[]).map((m)=>(
                      <div key={m.id} className="text-[11px]" style={{ color:'var(--text)' }}>• {m.denumire} {m.cantitate ? `— ${m.cantitate} ${m.um||''}` : ''}</div>
                    ))}
                    {onOfertaDinNota && (
                      <button onClick={()=>onOfertaDinNota(n)} className="text-[11px] px-2 py-1 rounded mt-1.5 font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>💰 Fă ofertă din lista asta</button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// 📁 Proiecte — arhiva firmei, ca folderele de pe calculator.
// Fiecare client are folderul lui; înăuntru sunt ȘANTIERELE (create automat când se face un șantier nou)
// și DOSARELE de facturi (cu devizele lor). În orice folder poți adăuga documente (PDF, poze).
// Sus e o căutare care caută în TOT: nume de șantiere, lucrări din rapoarte, apartamente, devize, facturi, documente.
function ProiecteTab({ clients, invoices, setInvoices, devize, offers, santiere, rapoarte, structuraSantier, proiecteFisiere, setProiecteFisiere, persist, currentUser, goToSite, onCreeazaProiect, printFactura, printDeviz, printOferta }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [cauta, setCauta] = useState('');
  const [proiectNou, setProiectNou] = useState(null);
  const [openC, setOpenC] = useState({ __fc: true });
  const [openS, setOpenS] = useState({});
  const [openF, setOpenF] = useState({});
  const [attachFor, setAttachFor] = useState(null);
  const [upBusy, setUpBusy] = useState('');
  const [upErr, setUpErr] = useState('');
  const fileRef = useRef(null);
  const tintaUpload = useRef(null);
  const totalDoc = (d)=>calcSubtotal(d.items||[])*(1+(Number(d.tva)||0)/100);
  const norm = (s)=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const fisiere = proiecteFisiere || [];

  // ---- Documente adăugate manual în dosare ----
  const cereFisier = (scopeType, scopeId, eticheta) => {
    tintaUpload.current = { scopeType, scopeId, eticheta };
    setUpErr('');
    if (fileRef.current) fileRef.current.click();
  };
  const onFilePicked = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (e.target) e.target.value = '';
    const t = tintaUpload.current;
    if (!f || !t) return;
    setUpBusy(t.scopeType + ':' + t.scopeId); setUpErr('');
    try {
      const res = await uploadFileToBlob(f, 'proiecte');
      const rec = { id: uid(), scopeType: t.scopeType, scopeId: t.scopeId, nume: f.name, pathname: res.pathname, url: res.url,
        data: new Date().toISOString().slice(0,10), adaugatDe: currentUser?.nume || '' };
      const next = [rec, ...fisiere];
      setProiecteFisiere(next); await persist('proiecteFisiere', next);
    } catch (err) { setUpErr((err && err.message) || 'Încărcare eșuată.'); }
    setUpBusy('');
  };
  const stergeFisier = async (id) => {
    if (!window.confirm('Scoți documentul din dosar?')) return;
    const next = fisiere.filter((x)=>x.id!==id);
    setProiecteFisiere(next); await persist('proiecteFisiere', next);
  };
  const fisiereDin = (scopeType, scopeId) => fisiere.filter((x)=>x.scopeType===scopeType && x.scopeId===scopeId);

  const randFisier = (x) => (
    <div key={x.id} className="flex items-center justify-between gap-2 text-[11px] px-2 py-1.5 rounded" style={{ background:'var(--panel)' }}>
      <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>📎 {x.nume} <span style={{ color:'var(--muted2)' }}>· {fmtData(x.data)}</span></span>
      <div className="flex items-center gap-1 shrink-0">
        <a href={x.url || blobViewUrl(x.pathname)} target="_blank" rel="noopener noreferrer" className="px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#4CAF7D', textDecoration:'none' }}>👁 Deschide</a>
        <button onClick={()=>stergeFisier(x.id)} style={{ color:'#E05252' }}>✕</button>
      </div>
    </div>
  );
  const btnAdauga = (scopeType, scopeId, eticheta) => (
    <button onClick={()=>cereFisier(scopeType, scopeId, eticheta)} disabled={upBusy===scopeType+':'+scopeId} className="text-[11px] px-2 py-1 rounded" style={{ color:'#2E8BD1' }}>
      {upBusy===scopeType+':'+scopeId ? 'Se încarcă…' : '➕ Adaugă document'}
    </button>
  );

  // ---- Legarea devizelor de factura lor ----
  const ataseaza = (factId, devId) => {
    const next = invoices.map((i)=> i.id===factId ? { ...i, devizeIds: [...new Set([...(i.devizeIds||[]), devId])] } : i);
    setInvoices(next); persist('invoices', next);
  };
  const detaseaza = (factId, devId) => {
    const next = invoices.map((i)=> i.id===factId ? { ...i, devizeIds: (i.devizeIds||[]).filter((x)=>x!==devId) } : i);
    setInvoices(next); persist('invoices', next);
  };

  // ---- Numele complet al unui apartament (Corp/Scara/Etaj + apartament), pentru căutare ----
  const numeApart = (santierId, apId) => {
    const et = (structuraSantier||[]).filter((e)=>e.santierId===santierId);
    for (const e of et) {
      const a = (e.apartamente||[]).find((x)=>x.id===apId);
      if (a) return `${e.nume} ${a.nume}`;
    }
    return '';
  };

  // ---- CĂUTARE ÎN TOT ----
  const termeni = norm(cauta).split(/\s+/).filter((w)=>w.length>=2);
  const numeClient = (id)=> (clients||[]).find((c)=>c.id===id)?.nume || '—';
  const rezultate = useMemo(()=>{
    if (termeni.length === 0) return [];
    const potrivit = (txt) => { const t = norm(txt); return termeni.every((w)=>t.includes(w)); };
    const out = [];
    // Șantiere
    (santiere||[]).forEach((s)=>{
      const txt = [s.nume, s.adresa, s.descriereLucrari, s.obiectiv, s.benefNume, s.contract].join(' ');
      if (potrivit(txt)) out.push({ tip:'🏗 Șantier', titlu: s.nume, sub: [s.adresa, s.benefNume].filter(Boolean).join(' · '), santierId: s.id });
    });
    // Lucrări pe apartamente (aici intră „exituri etaj 4 scara 3 corp a")
    (rapoarte||[]).forEach((r)=>{
      const s = (santiere||[]).find((x)=>x.id===r.santierId);
      (r.lucrariApartamente||[]).forEach((l)=>{
        const ap = (l.apartamenteIds||[]).map((id)=>numeApart(r.santierId, id)).filter(Boolean).join(', ');
        lucrariDinRand(l).forEach((w)=>{
          const txt = [s?.nume, ap, w.denumire, l.persoanaNume].join(' ');
          if (potrivit(txt) && out.length < 150) {
            out.push({ tip:'🔨 Lucrare', titlu: w.denumire || '(lucrare)', sub: `${s?.nume || '—'}${ap?' · '+ap:''} · ${fmtData(r.data)}${l.persoanaNume?' · '+l.persoanaNume:''}${w.cantitate?` · ${w.cantitate} ${w.um||''}`:''}`, santierId: r.santierId });
          }
        });
      });
      // Restul raportului: tipuri de lucrări, explicații, materiale
      const txtR = [s?.nume, (r.tipuriLucrari||[]).map((t)=>t.denumire).join(' '), r.explicatii, (r.materialeFolosite||[]).map((m)=>m.denumire).join(' ')].join(' ');
      if (potrivit(txtR) && out.length < 150) {
        const ce = (r.tipuriLucrari||[]).map((t)=>t.denumire).filter(Boolean).join(', ') || (r.explicatii || '').slice(0,60) || 'raport';
        out.push({ tip:'📋 Raport', titlu: ce, sub: `${s?.nume || '—'} · ${fmtData(r.data)}`, santierId: r.santierId });
      }
    });
    // Documente: facturi, devize, oferte
    const docs = [
      ...(invoices||[]).map((d)=>({ d, tip:'🧾 Factură', pr: printFactura })),
      ...(devize||[]).map((d)=>({ d, tip:'🧮 Deviz', pr: printDeviz })),
      ...(offers||[]).map((d)=>({ d, tip:'📄 Ofertă', pr: printOferta })),
    ];
    docs.forEach(({ d, tip, pr })=>{
      const txt = [d.numar, numeClient(d.clientId), (d.items||[]).map((it)=>it.denumire).join(' ')].join(' ');
      if (potrivit(txt) && out.length < 150) out.push({ tip, titlu: `${d.numar || '(fără număr)'} · ${money(totalDoc(d))}`, sub: `${numeClient(d.clientId)} · ${fmtData(d.data)}${d.status?' · '+normStatusFactura(d.status):''}`, doc: d, pr });
    });
    // Documente atașate
    fisiere.forEach((x)=>{
      if (potrivit(x.nume) && out.length < 150) out.push({ tip:'📎 Document', titlu: x.nume, sub: fmtData(x.data), fisier: x });
    });
    return out;
  }, [cauta, santiere, rapoarte, invoices, devize, offers, structuraSantier, proiecteFisiere, clients]);

  const clientiFiltrati = (clients||[]).slice().sort((a,b)=> String(a.nume).localeCompare(String(b.nume), 'ro'));
  const santiereFaraClient = (santiere||[]).filter((s)=> !s.benefClientId);

  // ---- Un folder de ȘANTIER (creat automat pentru fiecare șantier) ----
  const randSantier = (s) => {
    const os = !!openS[s.id];
    const rapS = (rapoarte||[]).filter((r)=>r.santierId===s.id);
    const fS = fisiereDin('santier', s.id);
    return (
      <div key={s.id} className="rounded-lg" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
        <button onClick={()=>setOpenS((x)=>({ ...x, [s.id]: !x[s.id] }))} className="w-full flex items-center gap-2 px-2.5 py-2 text-left">
          <span>{os?'📂':'📁'}</span>
          <span className="text-xs font-semibold flex-1 min-w-0 truncate" style={{ color:'var(--text)' }}>{s.nume}</span>
          <span className="text-[10px] shrink-0" style={{ color: s.status==='Activ'?'#4CAF7D':s.status==='Pauză'?'#E9A23B':'var(--muted2)' }}>{s.status}</span>
        </button>
        {os && (
          <div className="px-2.5 pb-2.5 space-y-1">
            {s.adresa && <div className="text-[11px]" style={{ color:'var(--muted)' }}>📍 {s.adresa}</div>}
            {s.descriereLucrari && <div className="text-[11px]" style={{ color:'var(--muted)' }}>📝 {s.descriereLucrari}</div>}
            <div className="text-[11px]" style={{ color:'var(--muted2)' }}>📋 {rapS.length} {rapS.length===1?'raport':'rapoarte'}</div>
            {fS.map(randFisier)}
            <div className="flex items-center gap-2 flex-wrap pt-0.5">
              {btnAdauga('santier', s.id, s.nume)}
              {goToSite && <button onClick={()=>goToSite(s.id)} className="text-[11px] px-2 py-1 rounded" style={{ color:'#2E8BD1' }}>🏗 Deschide șantierul</button>}
            </div>
          </div>
        )}
      </div>
    );
  };

  // ---- Dosarul unei FACTURI (cu devizele legate de ea) ----
  const randFactura = (f, devizeClient) => {
    const of2 = !!openF[f.id];
    const devAt = (f.devizeIds||[]).map((id)=>(devize||[]).find((d)=>d.id===id)).filter(Boolean);
    const atasateTot = new Set((invoices||[]).flatMap((i)=>i.devizeIds||[]));
    const devLibere = devizeClient.filter((d)=>!atasateTot.has(d.id));
    const fF = fisiereDin('factura', f.id);
    return (
      <div key={f.id} className="rounded-lg" style={{ background:'var(--panel2)', border:'1px solid var(--border)' }}>
        <button onClick={()=>setOpenF((x)=>({ ...x, [f.id]: !x[f.id] }))} className="w-full flex items-center gap-2 px-2.5 py-2 text-left">
          <span>{of2?'📂':'📁'}</span>
          <span className="text-xs font-semibold flex-1 min-w-0 truncate" style={{ color:'var(--text)' }}>Factura {f.numar} · {fmtData(f.data)}</span>
          <span className="text-[11px] shrink-0 font-semibold" style={{ color: eIncasata(f)?'#4CAF7D':f.status==='Restantă'?'#E05252':'#E9A23B', fontFamily:"'JetBrains Mono', monospace" }}>{money(totalDoc(f))}</span>
        </button>
        {of2 && (
          <div className="px-2.5 pb-2.5 space-y-1">
            <div className="flex items-center justify-between gap-2 text-[11px] px-2 py-1.5 rounded" style={{ background:'var(--panel)' }}>
              <span style={{ color:'var(--text)' }}>🧾 Factura {f.numar} <span style={{ color: eIncasata(f)?'#4CAF7D':f.status==='Restantă'?'#E05252':'#E9A23B' }}>· {normStatusFactura(f.status)}</span></span>
              <button onClick={()=>printFactura(f)} className="shrink-0 px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF</button>
            </div>
            {devAt.map((d)=>(
              <div key={d.id} className="flex items-center justify-between gap-2 text-[11px] px-2 py-1.5 rounded" style={{ background:'var(--panel)' }}>
                <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>🧮 Deviz {d.numar} · {fmtData(d.data)} · {money(totalDoc(d))}</span>
                <div className="flex items-center gap-1 shrink-0">
                  <button onClick={()=>printDeviz(d)} className="px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF</button>
                  <button onClick={()=>detaseaza(f.id, d.id)} title="Scoate devizul din acest dosar" style={{ color:'#E05252' }}>✕</button>
                </div>
              </div>
            ))}
            {fF.map(randFisier)}
            {attachFor === f.id ? (
              devLibere.length === 0 ? <div className="text-[11px] px-2" style={{ color:'var(--muted2)' }}>Nu mai sunt devize nepuse în vreun dosar la acest client. <button onClick={()=>setAttachFor(null)} style={{ color:'#2E8BD1' }}>Închide</button></div> : (
                <div className="px-2 py-1.5 rounded" style={{ background:'var(--panel)', border:'1px dashed var(--border)' }}>
                  <div className="text-[11px] mb-1" style={{ color:'var(--muted)' }}>Alege devizul de pus în dosarul acestei facturi:</div>
                  <div className="flex flex-wrap gap-1.5">
                    {devLibere.map((d)=>(
                      <button key={d.id} onClick={()=>{ ataseaza(f.id, d.id); setAttachFor(null); }} className="text-[11px] px-2 py-1 rounded" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid var(--border)' }}>🧮 {d.numar} · {fmtData(d.data)}</button>
                    ))}
                    <button onClick={()=>setAttachFor(null)} className="text-[11px] px-2 py-1 rounded" style={{ color:'var(--muted2)' }}>Renunță</button>
                  </div>
                </div>
              )
            ) : (
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={()=>setAttachFor(f.id)} className="text-[11px] px-2 py-1 rounded" style={{ color:'#2E8BD1' }}>➕ Pune un deviz în acest dosar</button>
                {btnAdauga('factura', f.id, 'Factura ' + f.numar)}
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="max-w-2xl">
      <input ref={fileRef} type="file" onChange={onFilePicked} style={{ display:'none' }} />
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>📁 Proiecte</h2>
      <p className="text-xs mb-3" style={{ color:'var(--muted2)' }}>Arhiva firmei, ca pe calculator: folder pe client → șantierele lui (se fac singure) și dosarele de facturi cu devizele lor. Poți adăuga documente în orice dosar. Căutarea de mai jos caută în TOT: lucrări din rapoarte, apartamente, șantiere, devize, facturi, documente.</p>

      <div className="flex gap-2 mb-3">
        <input value={cauta} onChange={(e)=>setCauta(e.target.value)} placeholder="🔍 Caută orice (ex: exituri etaj 4 scara 3 corp a)" className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        {!proiectNou && <button onClick={()=>setProiectNou({ nume:'', adresa:'', clientId:'' })} className="px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap" style={{ color:'#14181C', background:'#2E8BD1' }}>➕ Adaugă proiect</button>}
      </div>

      {proiectNou && (
        <div className="rounded-xl p-4 mb-3 space-y-2" style={{ background:'var(--panel)', border:'1px solid #2E8BD166' }}>
          <div className="text-sm font-semibold" style={{ color:'var(--text)' }}>➕ Proiect nou (șantier)</div>
          <div className="text-[11px]" style={{ color:'var(--muted2)' }}>Se creează un șantier cu numele ăsta și îți apare imediat aici, în Proiecte, dar și în „🏗 Șantiere". Restul detaliilor (facturare, echipă) le pui după, din editarea șantierului.</div>
          <input placeholder="Nume proiect / șantier" value={proiectNou.nume} onChange={(e)=>setProiectNou({ ...proiectNou, nume:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Adresă" value={proiectNou.adresa} onChange={(e)=>setProiectNou({ ...proiectNou, adresa:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <select value={proiectNou.clientId} onChange={(e)=>setProiectNou({ ...proiectNou, clientId:e.target.value })} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
            <option value="" style={{ background:'var(--panel)' }}>— beneficiar (opțional, îl poți pune mai târziu) —</option>
            {(clients||[]).map((c)=><option key={c.id} value={c.id} style={{ background:'var(--panel)' }}>{c.nume}</option>)}
          </select>
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setProiectNou(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={()=>{ const id = onCreeazaProiect && onCreeazaProiect(proiectNou); setProiectNou(null); if (id) setOpenS((x)=>({ ...x, [id]: true })); }} disabled={!String(proiectNou.nume).trim()} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>Creează proiectul</button>
          </div>
        </div>
      )}
      {upErr && <div className="text-[11px] mb-2 px-3 py-2 rounded-lg" style={{ color:'#E05252', background:'#E0525215' }}>{upErr}</div>}

      {termeni.length > 0 ? (
        <div>
          <div className="text-[11px] mb-2" style={{ color:'var(--muted2)' }}>{rezultate.length === 0 ? 'Nimic găsit.' : `${rezultate.length}${rezultate.length>=150?'+':''} ${rezultate.length===1?'rezultat':'rezultate'}`}</div>
          <div className="space-y-1.5">
            {rezultate.map((r, k)=>(
              <div key={k} className="rounded-lg px-3 py-2 flex items-center justify-between gap-2" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
                <div className="min-w-0">
                  <div className="text-xs" style={{ color:'var(--text)' }}><span style={{ color:'var(--muted2)' }}>{r.tip}</span> {r.titlu}</div>
                  <div className="text-[11px]" style={{ color:'var(--muted)' }}>{r.sub}</div>
                </div>
                <div className="shrink-0">
                  {r.santierId && goToSite && <button onClick={()=>goToSite(r.santierId)} className="text-[11px] px-2 py-1 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>Deschide</button>}
                  {r.doc && r.pr && <button onClick={()=>r.pr(r.doc)} className="text-[11px] px-2 py-1 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF</button>}
                  {r.fisier && <a href={r.fisier.url || blobViewUrl(r.fisier.pathname)} target="_blank" rel="noopener noreferrer" className="text-[11px] px-2 py-1 rounded font-semibold" style={{ color:'#14181C', background:'#4CAF7D', textDecoration:'none' }}>👁 Deschide</a>}
                </div>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="space-y-2">
          {clientiFiltrati.length === 0 && santiereFaraClient.length === 0 && <div className="text-center py-10 text-sm" style={{ color:'var(--muted)' }}>Niciun client sau șantier încă.</div>}
          {santiereFaraClient.length > 0 && (
            <div className="rounded-xl" style={{ background:'var(--panel)', border:'1px dashed var(--border)' }}>
              <button onClick={()=>setOpenC((x)=>({ ...x, __fc: !x.__fc }))} className="w-full flex items-center gap-2 px-3 py-2.5 text-left">
                <span style={{ fontSize:15 }}>{openC.__fc?'📂':'📁'}</span>
                <span className="text-sm font-semibold flex-1 min-w-0 truncate" style={{ color:'var(--text)' }}>Șantiere fără client asociat</span>
                <span className="text-[10px] shrink-0" style={{ color:'var(--muted2)' }}>{santiereFaraClient.length}</span>
              </button>
              {openC.__fc && (
                <div className="px-3 pb-3 space-y-1.5">
                  <div className="text-[11px]" style={{ color:'var(--muted2)' }}>Pune beneficiarul (clientul) în editarea șantierului, ca să intre în folderul lui.</div>
                  {santiereFaraClient.map(randSantier)}
                </div>
              )}
            </div>
          )}
          {clientiFiltrati.map((c)=>{
            const factC = (invoices||[]).filter((i)=>i.clientId===c.id).slice().sort((a,b)=> (a.data>b.data?-1:1));
            const devC = (devize||[]).filter((d)=>d.clientId===c.id).slice().sort((a,b)=> (a.data>b.data?-1:1));
            const ofC = (offers||[]).filter((o)=>o.clientId===c.id).slice().sort((a,b)=> (a.data>b.data?-1:1));
            const santC = (santiere||[]).filter((s)=>s.benefClientId===c.id);
            const atasateTot = new Set((invoices||[]).flatMap((i)=>i.devizeIds||[]));
            const devLibere = devC.filter((d)=>!atasateTot.has(d.id));
            const fC = fisiereDin('client', c.id);
            const nrTot = factC.length + devC.length + ofC.length + santC.length + fC.length;
            const oc = !!openC[c.id];
            return (
              <div key={c.id} className="rounded-xl" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
                <button onClick={()=>setOpenC((x)=>({ ...x, [c.id]: !x[c.id] }))} className="w-full flex items-center gap-2 px-3 py-2.5 text-left">
                  <span style={{ fontSize:15 }}>{oc?'📂':'📁'}</span>
                  <span className="text-sm font-semibold flex-1 min-w-0 truncate" style={{ color:'var(--text)' }}>{c.nume}</span>
                  <span className="text-[10px] shrink-0" style={{ color:'var(--muted2)' }}>{nrTot} {nrTot===1?'element':'elemente'}</span>
                </button>
                {oc && (
                  <div className="px-3 pb-3 space-y-1.5">
                    {santC.length > 0 && (<>
                      <div className="text-[10px] uppercase tracking-wide" style={{ color:'var(--muted2)' }}>🏗 Șantiere</div>
                      {santC.map(randSantier)}
                    </>)}
                    <div className="text-[10px] uppercase tracking-wide pt-1" style={{ color:'var(--muted2)' }}>🧾 Facturi</div>
                    {factC.length === 0 && <div className="text-[11px]" style={{ color:'var(--muted2)' }}>Nicio factură încă.</div>}
                    {factC.map((f)=>randFactura(f, devC))}
                    {(devLibere.length > 0 || ofC.length > 0) && (
                      <div className="pt-1">
                        <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color:'var(--muted2)' }}>📂 Nepuse într-un dosar de factură</div>
                        <div className="space-y-1">
                          {devLibere.map((d)=>(
                            <div key={d.id} className="flex items-center justify-between gap-2 text-[11px] px-2 py-1.5 rounded" style={{ background:'var(--panel2)' }}>
                              <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>🧮 Deviz {d.numar} · {fmtData(d.data)} · {money(totalDoc(d))} · {d.status}</span>
                              <button onClick={()=>printDeviz(d)} className="shrink-0 px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF</button>
                            </div>
                          ))}
                          {ofC.map((o)=>(
                            <div key={o.id} className="flex items-center justify-between gap-2 text-[11px] px-2 py-1.5 rounded" style={{ background:'var(--panel2)' }}>
                              <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>📄 Ofertă {o.numar || ''} · {fmtData(o.data)} · {money(totalDoc(o))} · {o.status}</span>
                              <button onClick={()=>printOferta(o)} className="shrink-0 px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {fC.length > 0 && (<>
                      <div className="text-[10px] uppercase tracking-wide pt-1" style={{ color:'var(--muted2)' }}>📎 Documente</div>
                      {fC.map(randFisier)}
                    </>)}
                    <div className="pt-1">{btnAdauga('client', c.id, c.nume)}</div>
                  </div>
                )}
              </div>
            );
          })}

        </div>
      )}
    </div>
  );
}
function Dashboard({ company, devize, offers, invoices, santiere, materials, cereriSantier, rapoarte, concedii, cereriAlocare, clients, setTab, currentUser }) {
  const roleIcon = ROLES.find((r)=>r.id===currentUser?.rol)?.icon || '👤';
  const [cashOpen, setCashOpen] = useState(false);
  const [factOpen, setFactOpen] = useState(false);
  const [muncaOpen, setMuncaOpen] = useState(false);

  const devizeActive = devize.filter((d)=>d.status!=='Semnat').length;
  const oferteTrimise = offers.filter((o)=>o.status==='Trimisă').length;
  const facturiDeIncasat = invoices.filter((i)=>!eIncasata(i));
  const sumaDeIncasat = facturiDeIncasat.reduce((s,i)=>s+calcSubtotal(i.items)*(1+(Number(i.tva)||0)/100),0);
  const santiereActive = santiere.filter((s)=>s.status==='Activ').length;
  const azi = new Date().toISOString().slice(0,10);

  const isManager = currentUser?.rol === 'Manager';

  // --- Numar rapid "de facut", doar pentru bulina de pe teaser-ul spre Activitatea mea ---
  // Rapoartele zilei curente „conteaza" doar de la 17:01 (la fel ca in Activitatea mea si pe bulina).
  const dupa17 = (new Date().getHours()*60 + new Date().getMinutes()) >= (17*60 + 1);
  let totalDeFacut = 0;
  if (isManager) {
    totalDeFacut += materials.filter((m)=>!m.arhivat && Number(m.stoc) < Number(m.stocMinim)).length > 0 ? 1 : 0;
    totalDeFacut += new Set(cereriSantier.filter((c)=>c.status==='Cerută').map((c)=>c.santierId)).size;
    if (dupa17) totalDeFacut += santiere.filter((s)=> s.status==='Activ' && seCereRaport(s, azi) && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)).length;
    totalDeFacut += (concedii || []).filter((c)=>c.status==='Cerut').length > 0 ? 1 : 0;
    totalDeFacut += santiere.filter((s)=>s.necesitaCompletare).length; // șantiere create de colegi, de completat de tine
    totalDeFacut += (cereriAlocare||[]).filter((c)=>c.status==='Cerut').length; // cereri de alocare pe șantier, de aprobat
  } else {
    const santiereMele = santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id));
    if (dupa17) totalDeFacut += santiereMele.filter((s)=> s.status==='Activ' && seCereRaport(s, azi) && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)).length;
  }

  // --- Respinse (material/concediu) care mă privesc, neconfirmate încă — banner roșu ---
  const seenRespins = (()=>{ try{ return JSON.parse(localStorage.getItem('respinsVazut_'+(currentUser?.id||''))||'[]'); }catch{ return []; } })();
  const respinseCount =
    cereriSantier.filter((c)=>c.cerutId===currentUser?.id && c.status==='Respinsă' && !seenRespins.includes('mat-'+c.id)).length
    + (concedii||[]).filter((c)=>c.userId===currentUser?.id && (c.status==='Respins'||c.status==='Refuzat') && !seenRespins.includes('con-'+c.id)).length;

  // --- Felicitări: ziua de naștere (din CNP) și sărbători (Crăciun, Paște, Anul Nou) ---
  const [colegiUsers, setColegiUsers] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setColegiUsers(data.users || [])).catch(()=>{});
  }, []);
  const ZILE_FELICITARE = {
    '2026-01-01': '🎉 La mulți ani cu ocazia Anului Nou! Din partea Smart Electroconect, vă dorim un an plin de realizări!',
    '2026-04-12': '🐣 Hristos a Înviat! Paște fericit, din partea Smart Electroconect!',
    '2026-12-25': '🎄 Crăciun fericit! Din partea Smart Electroconect, vă dorim sărbători pline de liniște și bucurie!',
  };
  const aziDate = new Date();
  const aziISO = aziDate.toISOString().slice(0,10);
  const mesajSarbatoare = ZILE_FELICITARE[aziISO];
  const sarbatoriiZi = colegiUsers.filter((u)=>{
    const n = nasterePeDinCnp(u.cnp);
    return n && n.zi === aziDate.getDate() && n.luna === aziDate.getMonth()+1;
  });
  const esteWeekendLookahead = (aziDate.getDay() === 5 && aziDate.getHours() >= 17) || aziDate.getDay() === 6 || aziDate.getDay() === 0;

  const cards = isManager ? [
    { label:'Devize active', value: devizeActive, tab:'devize' },
    { label:'Oferte trimise', value: oferteTrimise, tab:'oferte' },
    { label:'Facturi de încasat', value: `${facturiDeIncasat.length} · ${money(sumaDeIncasat)}`, tab:'facturi' },
    { label:'Șantiere active', value: santiereActive, tab:'santiere' },
  ] : [
    { label:'Șantierele tale', value: santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id)).length, tab:'santiere' },
  ];

  return (
    <div>
      <div className="flex items-start justify-between gap-3 mb-8 flex-wrap">
        <div className="flex items-center gap-3">
          <div>
            <div className="text-base" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif", fontWeight:600 }}>{company?.nume || 'Panou intern'}</div>
            <div className="text-xs" style={{ color:'var(--muted2)' }}>
              Bun venit înapoi, {currentUser?.nume} {roleIcon}
            </div>
            <div className="text-xs mt-0.5" style={{ color:'#2E8BD1' }}>
              {(() => {
                const ZILE_SAPT = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
                const LUNI_LUNG = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
                const acum = new Date();
                return `${ZILE_SAPT[acum.getDay()]}, ${acum.getDate()} ${LUNI_LUNG[acum.getMonth()]} ${acum.getFullYear()}`;
              })()}
            </div>
          </div>
        </div>

        {(mesajSarbatoare || sarbatoriiZi.length > 0 || esteWeekendLookahead) && (
          <div className="rounded-xl px-4 py-3 max-w-xs text-right" style={{
            background: sarbatoriiZi.length > 0 ? 'linear-gradient(135deg, #E9A23B, #E05252)' : 'linear-gradient(135deg, #2E8BD1, #4CAF7D)'
          }}>
            {sarbatoriiZi.length > 0 ? (
              <>
                <div style={{ fontSize:14, fontWeight:700, color:'#fff', lineHeight:1.3 }}>🎂 La mulți ani, {sarbatoriiZi.map((u)=>u.nume).join(' și ')}!</div>
                <div style={{ fontSize:11, color:'#fff', opacity:0.9, marginTop:2 }}>Din partea echipei {company?.nume || 'Smart Electroconect'}!</div>
              </>
            ) : mesajSarbatoare ? (
              <div style={{ fontSize:13, fontWeight:600, color:'#fff', lineHeight:1.3 }}>{mesajSarbatoare}</div>
            ) : (
              <div style={{ fontSize:14, fontWeight:600, color:'#fff' }}>🎉 Weekend fain!</div>
            )}
          </div>
        )}
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        {cards.map((c)=>(
          <button key={c.label} onClick={()=>setTab(c.tab)} className="text-left rounded-xl p-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
            <div className="text-xs mb-1" style={{ color:'var(--muted)' }}>{c.label}</div>
            <div className="text-lg font-medium" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{c.value}</div>
          </button>
        ))}
      </div>

      {/* ---- 💰 Cashflow + 🧾 De facturat (doar manager) ---- */}
      {isManager && (() => {
        const lunaCur = azi.slice(0,7);
        const LUNI_L = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
        const numeLuna = LUNI_L[new Date().getMonth()] + ' ' + new Date().getFullYear();
        const totalDoc = (d)=>calcSubtotal(d.items||[])*(1+(Number(d.tva)||0)/100);
        const numeClient = (id)=> (clients||[]).find((c)=>c.id===id)?.nume || '(client șters)';
        const neplatite = invoices.filter((i)=>!eIncasata(i)).slice().sort((a,b)=> (a.data<b.data?-1:1));
        const deIncasat = neplatite.reduce((s,i)=>s+totalDoc(i),0);
        const restante = neplatite.filter((i)=>i.status==='Restantă');
        const facturatLuna = invoices.filter((i)=>String(i.data||'').startsWith(lunaCur));
        const sumFacturatLuna = facturatLuna.reduce((s,i)=>s+totalDoc(i),0);
        const incasatLuna = invoices.filter((i)=>eIncasata(i) && String(i.data||'').startsWith(lunaCur));
        const sumIncasatLuna = incasatLuna.reduce((s,i)=>s+totalDoc(i),0);
        const devizeLunaEm = devize.filter((d)=>d.status!=='Ciornă' && String(d.data||'').startsWith(lunaCur));
        const sumDevizeLuna = devizeLunaEm.reduce((s,d)=>s+totalDoc(d),0);

        // „De facturat": clienți cu deviz emis și nicio factură DUPĂ el, sau cu lucrări luna asta și fără factură luna asta.
        const deFacturat = [];
        (clients||[]).forEach((c)=>{
          const factC = invoices.filter((i)=>i.clientId===c.id);
          const ultimaF = factC.map((i)=>i.data).sort().slice(-1)[0] || null;
          const devNefact = devize.filter((d)=>d.clientId===c.id && d.status!=='Ciornă' && !factC.some((i)=> String(i.data||'') >= String(d.data||'')));
          const areFacturaLuna = factC.some((i)=>String(i.data||'').startsWith(lunaCur));
          const santC = santiere.filter((s)=>s.benefClientId===c.id);
          const lucruLuna = santC.some((s)=> rapoarte.some((r)=>r.santierId===s.id && String(r.data||'').startsWith(lunaCur)));
          if (devNefact.length) deFacturat.push({ c, motiv:`deviz emis pe ${fmtData(devNefact[0].data)}, fără factură după el`, suma: devNefact.reduce((s,d)=>s+totalDoc(d),0), ultimaF });
          else if (lucruLuna && !areFacturaLuna) deFacturat.push({ c, motiv:'lucrări luna asta, fără factură emisă', suma: null, ultimaF });
        });

        const stat = (label, val, culoare) => (
          <div className="rounded-lg px-3 py-2" style={{ background:'var(--panel2)' }}>
            <div className="text-[10px] uppercase tracking-wide" style={{ color:'var(--muted2)' }}>{label}</div>
            <div className="text-sm font-semibold" style={{ color: culoare || 'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{val}</div>
          </div>
        );

        // --- Evidența lunară: cât ai facturat vs cât ai încasat. Începe din iulie 2026 (de când ținem evidența în aplicație). ---
        const LUNI_S = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
        const acum6 = new Date();
        const luni6 = [];
        for (let k = 11; k >= 0; k--) {
          const d = new Date(acum6.getFullYear(), acum6.getMonth() - k, 1);
          const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          if (key < EVIDENTA_DE_LA) continue; // nu arătăm luni dinainte de a exista evidența
          const fact = invoices.filter((i)=>String(i.data||'').startsWith(key)).reduce((s,i)=>s+totalDoc(i),0);
          const inc = invoices.filter((i)=>eIncasata(i) && String(i.data||'').startsWith(key)).reduce((s,i)=>s+totalDoc(i),0);
          luni6.push({ eticheta: LUNI_S[d.getMonth()], fact, inc });
        }
        const maxLuna = Math.max(1, ...luni6.map((x)=>Math.max(x.fact, x.inc)));

        // --- Top datornici: clienți cu cele mai mari sume neîncasate ---
        const datorii = {};
        neplatite.forEach((i)=>{
          const k = i.clientId || '—';
          if (!datorii[k]) datorii[k] = { clientId:k, suma:0, nr:0, restante:0, ceaMaiVeche:null };
          datorii[k].suma += totalDoc(i); datorii[k].nr += 1;
          if (i.status==='Restantă') datorii[k].restante += 1;
          if (!datorii[k].ceaMaiVeche || String(i.data||'') < datorii[k].ceaMaiVeche) datorii[k].ceaMaiVeche = String(i.data||'');
        });
        const topDatornici = Object.values(datorii).sort((a,b)=>b.suma-a.suma).slice(0,5);

        // --- Valoarea muncii din rapoartele angajaților, luna curentă (manoperă + materiale consumate) ---
        // Materialele se socotesc la PREȚ DE VÂNZARE: costul de achiziție + adaosul firmei (implicit 15%).
        const adaosMat = (company && company.adaosMaterial !== undefined && company.adaosMaterial !== '') ? (Number(company.adaosMaterial) || 0) : 15;
        const pretMaterial = (den) => {
          const m = (materials||[]).find((x)=> String(x.denumire||'').toLowerCase().trim() === String(den||'').toLowerCase().trim());
          return m ? (Number(m.pret) || 0) * (1 + adaosMat / 100) : 0;
        };
        const dinRapoarte = santiere.map((s)=>{
          const rapS = rapoarte.filter((r)=> r.santierId===s.id && String(r.data||'').startsWith(lunaCur));
          const minute = rapS.reduce((acc,r)=> acc + (r.persoane||[]).filter((p)=>p.nume && String(p.nume).trim()).reduce((a,p)=> a + personMinutes(p), 0), 0);
          const ore = minute / 60;
          const tarif = Number(s.tarifOrar) || 0;
          const manopera = ore * tarif;
          const materialeVal = rapS.reduce((acc,r)=> acc + (r.materialeFolosite||[]).reduce((a,m)=> a + (Number(m.cantitate)||0) * pretMaterial(m.denumire), 0), 0);
          return { s, ore, tarif, manopera, materialeVal, nrRap: rapS.length };
        }).filter((x)=> x.ore > 0 || x.materialeVal > 0).sort((a,b)=> (b.manopera+b.materialeVal) - (a.manopera+a.materialeVal));
        const totalOreLuna = dinRapoarte.reduce((a,x)=>a+x.ore, 0);
        const totalManopera = dinRapoarte.reduce((a,x)=>a+x.manopera, 0);
        const totalMaterialeR = dinRapoarte.reduce((a,x)=>a+x.materialeVal, 0);
        const totalDinMunca = totalManopera + totalMaterialeR;
        const faraTarif = dinRapoarte.filter((x)=> x.ore > 0 && !x.tarif);

        // --- Export Excel: situația de încasat, pentru contabilă ---
        const exportaIncasat = () => {
          try {
            const azF = new Date();
            const stamp = `${String(azF.getDate()).padStart(2,'0')}/${String(azF.getMonth()+1).padStart(2,'0')}/${azF.getFullYear()}`;
            const rows = neplatite.map((i, n)=>({
              'Nr crt': n+1,
              'Client': numeClient(i.clientId),
              'Factura': i.numar || '',
              'Data emiterii': fmtData(i.data),
              'Scadenta': i.scadenta ? fmtData(i.scadenta) : '',
              'Zile intarziere': i.scadenta && i.scadenta < azi ? Math.round((new Date(azi) - new Date(i.scadenta))/86400000) : 0,
              'Status': i.status,
              'Total (lei)': Math.round(totalDoc(i)*100)/100,
            }));
            const header = [
              [company?.nume || 'Firma mea'],
              [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],
              [],
              ['Situatia facturilor de incasat'],
              [`Extras la: ${stamp}`],
              [`Total de incasat: ${Math.round(deIncasat*100)/100} lei`],
              [],
            ];
            const ws = XLSX.utils.aoa_to_sheet(header);
            XLSX.utils.sheet_add_json(ws, rows.length ? rows : [{ 'Nr crt':'', 'Client':'Nicio factura neincasata' }], { origin: -1 });
            ws['!cols'] = [{wch:7},{wch:32},{wch:14},{wch:14},{wch:12},{wch:15},{wch:12},{wch:14}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'De incasat');
            XLSX.writeFile(wb, `de_incasat_${azi}.xlsx`);
          } catch (err) { window.alert('Nu am putut face fișierul Excel. ' + (err && err.message ? err.message : '')); }
        };

        return (<>
          <div className="rounded-xl p-4 mb-3" style={{ background:'var(--panel)', border:'1px solid #4CAF7D66', borderLeft:'4px solid #4CAF7D' }}>
            <div className="flex items-center justify-between mb-2 gap-2">
              <span className="text-sm font-bold" style={{ color:'#4CAF7D' }}>💰 Cashflow — {numeLuna}</span>
              <button onClick={()=>setCashOpen(!cashOpen)} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>{cashOpen?'Ascunde detaliile ▲':'Vezi detaliat ▼'}</button>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {stat('De încasat (total)', money(deIncasat), '#E9A23B')}
              {stat('Din care restante', `${restante.length} · ${money(restante.reduce((s,i)=>s+totalDoc(i),0))}`, restante.length? '#E05252':'var(--muted2)')}
              {stat('Facturat luna asta', `${facturatLuna.length} · ${money(sumFacturatLuna)}`)}
              {stat('Încasat luna asta', money(sumIncasatLuna), '#4CAF7D')}
            </div>
            <div className="text-[11px] mt-2" style={{ color:'var(--muted2)' }}>🧮 Devize emise în {numeLuna}: {devizeLunaEm.length} · {money(sumDevizeLuna)} — bani „pe drum", de transformat în facturi.</div>

            {/* Grafic simplu pe ultimele 6 luni: facturat vs încasat */}
            <div className="mt-3 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
              <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                <span className="text-[11px] uppercase tracking-wide" style={{ color:'var(--muted2)' }}>Evidența lunară (din iulie 2026)</span>
                <span className="flex items-center gap-3 text-[10px]" style={{ color:'var(--muted)' }}>
                  <span className="flex items-center gap-1"><span style={{ width:9, height:9, borderRadius:2, background:'#2E8BD1', display:'inline-block' }} /> facturat</span>
                  <span className="flex items-center gap-1"><span style={{ width:9, height:9, borderRadius:2, background:'#4CAF7D', display:'inline-block' }} /> încasat</span>
                </span>
              </div>
              <div className="flex items-end justify-between gap-2" style={{ height: 84 }}>
                {luni6.map((L, i2)=>(
                  <div key={i2} className="flex-1 flex flex-col items-center gap-1" title={`${L.eticheta}: facturat ${money(L.fact)}, încasat ${money(L.inc)}`}>
                    <div className="w-full flex items-end justify-center gap-1" style={{ height: 62 }}>
                      <div style={{ width:'42%', height: `${Math.max(2, (L.fact/maxLuna)*100)}%`, background:'#2E8BD1', borderRadius:'3px 3px 0 0' }} />
                      <div style={{ width:'42%', height: `${Math.max(2, (L.inc/maxLuna)*100)}%`, background:'#4CAF7D', borderRadius:'3px 3px 0 0' }} />
                    </div>
                    <span className="text-[10px]" style={{ color:'var(--muted2)' }}>{L.eticheta}</span>
                  </div>
                ))}
              </div>
            </div>

            {cashOpen && (<>
              {topDatornici.length > 0 && (
                <div className="mt-3 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
                  <div className="text-[11px] uppercase tracking-wide mb-1.5" style={{ color:'var(--muted2)' }}>Top datornici</div>
                  <div className="space-y-1">
                    {topDatornici.map((d)=>(
                      <div key={d.clientId} className="flex items-center justify-between gap-2 text-xs px-2.5 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                        <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>👥 {numeClient(d.clientId)} <span style={{ color:'var(--muted2)' }}>· {d.nr} {d.nr===1?'factură':'facturi'}{d.restante?` · ${d.restante} restante`:''}</span></span>
                        <span className="shrink-0 font-semibold" style={{ color: d.restante?'#E05252':'#E9A23B', fontFamily:"'JetBrains Mono', monospace" }}>{money(d.suma)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-3 pt-3" style={{ borderTop:'1px solid var(--border)' }}>
                <div className="flex items-center justify-between mb-1.5 gap-2">
                  <span className="text-[11px] uppercase tracking-wide" style={{ color:'var(--muted2)' }}>Facturi neîncasate</span>
                  <button onClick={exportaIncasat} className="text-[11px] px-2.5 py-1 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>📊 Excel pentru contabilă</button>
                </div>
                {neplatite.length === 0 ? <div className="text-xs" style={{ color:'#4CAF7D' }}>✅ Nicio factură neîncasată.</div> : (
                  <div className="space-y-1">
                    {neplatite.map((i)=>{
                      const zileInt = i.scadenta && i.scadenta < azi ? Math.round((new Date(azi) - new Date(i.scadenta))/86400000) : 0;
                      return (
                        <button key={i.id} onClick={()=>setTab('facturi')} className="w-full text-left flex items-center justify-between gap-2 text-xs px-2.5 py-2 rounded-lg" style={{ background:'var(--panel2)' }}>
                          <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>🧾 {numeClient(i.clientId)} · {i.numar} · {fmtData(i.data)}{zileInt>0 && <span style={{ color:'#E05252' }}> · {zileInt} {zileInt===1?'zi':'zile'} întârziere</span>}</span>
                          <span className="shrink-0 font-semibold" style={{ color: i.status==='Restantă'?'#E05252':'#E9A23B', fontFamily:"'JetBrains Mono', monospace" }}>{money(totalDoc(i))}{i.status==='Restantă'?' ⚠':''}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            </>)}
          </div>

          {/* Banii produși de echipă luna asta, calculați automat din rapoartele zilnice */}
          <div className="rounded-xl p-4 mb-3" style={{ background:'var(--panel)', border:'1px solid #2E8BD166', borderLeft:'4px solid #2E8BD1' }}>
            <div className="flex items-center justify-between mb-2 gap-2">
              <span className="text-sm font-bold" style={{ color:'#2E8BD1' }}>🔨 Din munca echipei — {numeLuna}</span>
              <button onClick={()=>setMuncaOpen(!muncaOpen)} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>{muncaOpen?'Ascunde pe șantiere ▲':'Vezi pe șantiere ▼'}</button>
            </div>
            {dinRapoarte.length === 0 ? (
              <div className="text-xs" style={{ color:'var(--muted2)' }}>Încă nu s-au trimis rapoarte luna asta.</div>
            ) : (<>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {stat('Ore lucrate', `${Math.round(totalOreLuna*10)/10} h`)}
                {stat('Manoperă', money(totalManopera), '#2E8BD1')}
                {stat(`Materiale (+${adaosMat}%)`, money(totalMaterialeR))}
                {stat('Total produs', money(totalDinMunca), '#4CAF7D')}
              </div>
              <div className="text-[11px] mt-2" style={{ color:'var(--muted2)' }}>Calculat automat din rapoartele zilnice: orele scrise de băieți × tariful șantierului, plus materialele trecute de ei la preț de vânzare (costul din Gestiune + {adaosMat}% adaos, îl schimbi în „⚙ Firma mea"). Din astea ies devizele și facturile — compară cu „facturat luna asta" de mai sus ca să vezi ce n-ai facturat încă.</div>
              {faraTarif.length > 0 && (
                <div className="text-[11px] mt-1.5 px-2.5 py-1.5 rounded-lg" style={{ background:'#E9A23B15', color:'#E9A23B' }}>⚠ Fără tarif orar completat (manopera iese 0): {faraTarif.map((x)=>x.s.nume).join(', ')} — pune tariful în editarea șantierului.</div>
              )}
              {muncaOpen && (
                <div className="space-y-1 mt-2">
                  {dinRapoarte.map((x)=>(
                    <button key={x.s.id} onClick={()=>setTab('santiere')} className="w-full text-left flex items-center justify-between gap-2 text-xs px-2.5 py-2 rounded-lg" style={{ background:'var(--panel2)' }}>
                      <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>🏗 {x.s.nume} <span style={{ color:'var(--muted2)' }}>· {Math.round(x.ore*10)/10} h{x.tarif?` × ${money(x.tarif)}`:''}{x.materialeVal?` + materiale ${money(x.materialeVal)}`:''}</span></span>
                      <span className="shrink-0 font-semibold" style={{ color:'#4CAF7D', fontFamily:"'JetBrains Mono', monospace" }}>{money(x.manopera + x.materialeVal)}</span>
                    </button>
                  ))}
                </div>
              )}
            </>)}
          </div>

          {deFacturat.length > 0 && (
            <div className="rounded-xl p-4 mb-3" style={{ background:'var(--panel)', border:'1px solid #E9A23B66', borderLeft:'4px solid #E9A23B' }}>
              <div className="flex items-center justify-between mb-2 gap-2">
                <span className="text-sm font-bold" style={{ color:'#E9A23B' }}>🧾 De facturat ({deFacturat.length})</span>
                {deFacturat.length > 4 && <button onClick={()=>setFactOpen(!factOpen)} className="text-[11px] px-2.5 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>{factOpen?'Arată mai puțin ▲':'Arată tot ▼'}</button>}
              </div>
              <div className="space-y-1">
                {(factOpen ? deFacturat : deFacturat.slice(0,4)).map((x)=>(
                  <button key={x.c.id} onClick={()=>setTab('facturi')} className="w-full text-left flex items-center justify-between gap-2 text-xs px-2.5 py-2 rounded-lg" style={{ background:'var(--panel2)' }}>
                    <span className="min-w-0" style={{ color:'var(--text)' }}>👥 <b>{x.c.nume}</b> — {x.motiv}{x.suma ? ` (${money(x.suma)})` : ''}</span>
                    <span className="shrink-0 text-[10px]" style={{ color:'var(--muted2)' }}>{x.ultimaF ? `ultima factură: ${fmtData(x.ultimaF)}` : 'nicio factură încă'}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </>);
      })()}

      {respinseCount > 0 && (
        <button onClick={()=>setTab('activitate')} className="w-full text-left rounded-xl p-4 mb-3" style={{ background:'#E0525214', border:'1px solid #E0525266', borderLeft:'4px solid #E05252' }}>
          <div className="flex items-center justify-between">
            <span style={{ fontSize:15, fontWeight:700, color:'#E05252' }}>⛔ {respinseCount} {respinseCount===1?'lucru respins':'lucruri respinse'}</span>
            <span style={{ color:'#E05252' }}>→</span>
          </div>
        </button>
      )}

      <button onClick={()=>setTab('activitate')} className="w-full text-left rounded-xl p-4 mb-6" style={{ background:'var(--panel)', border:'1px solid var(--border)', borderLeft: totalDeFacut>0 ? '4px solid #E05252' : '4px solid var(--border)' }}>
        <div className="flex items-center justify-between">
          <span style={{ fontSize:15, fontWeight:700, color:'var(--text)' }}>
            {totalDeFacut > 0 ? `⚡ ${totalDeFacut} ${totalDeFacut===1?'lucru':'lucruri'} de făcut` : '✅ Nimic de făcut acum'}
          </span>
          <span style={{ color: totalDeFacut>0 ? '#E05252' : 'var(--muted2)' }}>→</span>
        </div>
      </button>

    </div>
  );
}

    text: 'Primești notificare pentru tot ce fac angajații: raport trimis/modificat, cerere de materiale, sculă adusă/mutată, planșă sau poză adăugată, checklist confirmat, șantier finalizat, cerere de concediu și întrebări Q&A de verificat.' },
