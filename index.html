<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sclipici metalic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#070C09;color:#E9E7E2;font-family:-apple-system,sans-serif;overflow-x:hidden;transition:background .4s}
body[data-theme=zi]{background:#EEF3EC;color:#1A2230}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;will-change:filter;animation:colorSweep 50s linear infinite}
.aurora .glow{position:absolute;inset:-16%;will-change:transform,opacity,filter;animation:roam 30s ease-in-out infinite, glowPulse 5s ease-in-out infinite alternate;
  background:
    radial-gradient(80% 40% at 50% 60%, rgba(30,215,120,.55) 0%, rgba(30,215,120,0) 72%),
    linear-gradient(to bottom, rgba(30,215,120,0) 30%, rgba(30,215,120,.72) 49%, rgba(70,230,130,.66) 65%, rgba(150,240,70,.6) 82%, rgba(150,240,70,0) 96%);}
body[data-theme=zi] .aurora .glow{
  background:
    radial-gradient(80% 40% at 50% 60%, rgba(120,210,140,.6) 0%, rgba(120,210,140,0) 72%),
    linear-gradient(to bottom, rgba(140,215,135,0) 30%, rgba(130,212,130,.7) 49%, rgba(160,222,120,.62) 65%, rgba(200,232,110,.56) 82%, rgba(200,232,110,0) 96%);}
.aurora .stars, .aurora .spark{position:absolute;inset:-16%;
  -webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20width%3D%2212%22%20height%3D%2212%22%3E%3Cpolygon%20points%3D%226%2C3.6%206.4%2C5.6%208.4%2C6%206.4%2C6.4%206%2C8.4%205.6%2C6.4%203.6%2C6%205.6%2C5.6%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20width%3D%2212%22%20height%3D%2212%22%3E%3Cpolygon%20points%3D%226%2C3.6%206.4%2C5.6%208.4%2C6%206.4%2C6.4%206%2C8.4%205.6%2C6.4%203.6%2C6%205.6%2C5.6%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E");
  -webkit-mask-size:12px 12px;mask-size:12px 12px;-webkit-mask-repeat:repeat;mask-repeat:repeat;}
.aurora .stars{will-change:transform,mask-position,opacity;animation:roam 30s ease-in-out infinite, starDrift 34s linear infinite, twinkle 4.5s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 1.4px rgba(180,255,110,.6)) saturate(1.5);
  background:linear-gradient(to bottom, rgba(190,255,110,0) 30%, rgba(190,255,110,.85) 50%, rgba(215,255,95,.8) 74%, rgba(215,255,95,0) 96%);}
body[data-theme=zi] .aurora .stars{filter:drop-shadow(0 0 1px rgba(170,205,70,.5)) saturate(1.3);
  background:linear-gradient(to bottom, rgba(185,215,75,0) 30%, rgba(188,214,72,.9) 50%, rgba(205,226,90,.84) 74%, rgba(205,226,90,0) 96%);}
/* UNDA de retro-iluminare — mult mai puternică */
.aurora .spark{will-change:transform,background-position;mix-blend-mode:screen;background-repeat:no-repeat;
  background:radial-gradient(46% 32% at 50% 50%, rgba(255,255,250,1) 0%, rgba(255,255,250,.5) 30%, rgba(255,255,250,0) 72%);
  animation:roam 30s ease-in-out infinite, sweep 5s ease-in-out infinite;}
body[data-theme=zi] .aurora .spark{background:radial-gradient(46% 32% at 50% 50%, rgba(255,255,240,.95) 0%, rgba(255,255,240,.45) 30%, rgba(255,255,240,0) 72%);background-repeat:no-repeat;}
@keyframes roam{0%{transform:translate3d(0,0,0) scale(1.05) rotate(0deg)}25%{transform:translate3d(2.6%,-1.8%,0) scale(1.09) rotate(.5deg)}50%{transform:translate3d(-1.6%,2.4%,0) scale(1.06) rotate(-.45deg)}75%{transform:translate3d(2%,1.6%,0) scale(1.1) rotate(.4deg)}100%{transform:translate3d(0,0,0) scale(1.05) rotate(0deg)}}
@keyframes glowPulse{0%{opacity:.6;filter:brightness(.9) saturate(1.3)}100%{opacity:1;filter:brightness(1.3) saturate(1.7)}}
@keyframes colorSweep{from{filter:hue-rotate(0deg) saturate(1.7) contrast(1.08)}to{filter:hue-rotate(360deg) saturate(1.7) contrast(1.08)}}
@keyframes twinkle{0%{opacity:.4}100%{opacity:.95}}
@keyframes starDrift{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:24px 12px;mask-position:24px 12px}}
@keyframes sweep{0%{background-position:-28% 128%}50%{background-position:128% -28%}100%{background-position:-28% 128%}}
.aurora .sheen{position:absolute;inset:-16%;pointer-events:none;mix-blend-mode:overlay;background-repeat:no-repeat;background-size:220% 100%;background-image:linear-gradient(112deg, transparent 34%, rgba(255,255,255,.55) 49%, rgba(255,255,255,.15) 56%, transparent 70%);animation:sheenMove 6s linear infinite}
@keyframes sheenMove{0%{background-position:170% 0}100%{background-position:-70% 0}}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 18px 0}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(127,127,127,.18)}
.seg button{border:none;background:transparent;color:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;opacity:.7}
.seg button.on{background:#2E8BD1;color:#fff;opacity:1}
h1{margin-top:150px;font-size:24px;font-weight:600;text-align:center}
.bar{margin-top:26px;width:100%;max-width:520px;display:flex;align-items:center;gap:10px;background:rgba(20,24,31,.6);border:1px solid rgba(255,255,255,.08);border-radius:30px;padding:12px 16px}
body[data-theme=zi] .bar{background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06)}
.bar .ph{flex:1;opacity:.6}
</style></head><body>
<div class="aurora" aria-hidden="true"><div class="glow"></div><div class="stars"></div><div class="spark"></div><div class="sheen"></div></div>
<div class="wrap"><div class="seg" id="seg"><button data-t="zi">Zi</button><button data-t="noapte" class="on">Noapte</button></div>
<h1>Bun venit inapoi</h1><div class="bar"><div class="ph">Cauta santier...</div><span>Mic</span></div></div>
<script>var s=document.getElementById('seg');s.onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(s.children,function(x){x.classList.remove('on')});b.classList.add('on');if(b.dataset.t=='zi')document.body.setAttribute('data-theme','zi');else document.body.removeAttribute('data-theme')}</script>
</body></html>
