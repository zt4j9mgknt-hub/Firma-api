// ---- Normativ I7: vizualizator o pagină pe rând (încărcare pe bucăți = rapid pe telefon) ----
function NormativViewer({ pdfUrl, downloadUrl, startPage, titlu, onClose, onFull }) {
  const [pageNum, setPageNum] = useState(startPage || 1);
  const [numPages, setNumPages] = useState(0);
  const [img, setImg] = useState('');
  const [status, setStatus] = useState('Se deschide normativul…');
  const [hd, setHd] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [pinput, setPinput] = useState(String(startPage || 1));
  // Pe iPhone browserul NU permite ecran complet real. Atunci facem „ecran curat":
  // ascundem barele din aplicație, ca pagina să ocupe tot ecranul.
  const [zen, setZen] = useState(false);
  const potFullscreen = typeof document !== 'undefined' && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const comutaEcran = () => { if (potFullscreen && onFull) onFull(); else setZen((z)=>!z); };
  const pdfRef = useRef(null);
  const clampZ = (z) => Math.min(8, Math.max(1, z));
  const zoomBy = (f) => setZoom((z) => clampZ(z * f));
  const pz = useRef({ startDist: 0, startZoom: 1 });
  const dist2 = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const onTS = (e) => { if (e.touches.length === 2) { pz.current.startDist = dist2(e.touches); pz.current.startZoom = zoom; } };
  const onTM = (e) => { if (e.touches.length === 2) { const d = dist2(e.touches); setZoom(clampZ(pz.current.startZoom * (d / (pz.current.startDist || d)))); } };

  const goPage = (n) => {
    const max = numPages || n;
    const p = Math.min(max, Math.max(1, Math.round(n) || 1));
    setPageNum(p); setPinput(String(p)); setZoom(1);
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const lib = window.pdfjsLib;
      if (!lib) { setStatus('Vizualizatorul nu s-a încărcat. Verifică internetul.'); return; }
      try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch {}
      try {
        setStatus('Se descarcă normativul (prima dată ~11MB, apoi rămâne salvat pe telefon)…');
        // Descărcăm dintr-o singură bucată (ca la planșe) — cererile „pe bucăți" prin proxy se blochează pe date mobile.
        const pdf = await lib.getDocument({ url: pdfUrl, disableRange: true, disableStream: true, withCredentials: false }).promise;
        if (cancelled) return;
        pdfRef.current = pdf; setNumPages(pdf.numPages);
      } catch (e) {
        if (!cancelled) setStatus('Nu am putut deschide normativul. ' + (e && e.message ? e.message : ''));
      }
    })();
    return () => { cancelled = true; try { if (pdfRef.current) pdfRef.current.destroy(); } catch {} };
  }, [pdfUrl]);

  useEffect(() => {
    let cancelled = false;
    const pdf = pdfRef.current;
    if (!pdf) return;
    (async () => {
      if (numPages && pageNum > numPages) {
        setImg(''); setStatus(`Pagina ${pageNum} nu există în PDF-ul încărcat (are doar ${numPages} de pagini). Probabil e încărcat normativul VECHI, fără modificările 2023. Managerul trebuie să încarce fișierul „normativ-i7.pdf" (491 pagini) primit de la asistent — din pagina Normativ I7, jos, „↻ Înlocuiește PDF-ul normativului".`);
        return;
      }
      setStatus('Se afișează pagina ' + pageNum + '…');
      try {
        const page = await pdf.getPage(pageNum);
        const base = page.getViewport({ scale: 1 });
        const targetW = hd ? 2400 : 1400;
        const maxS = hd ? 4 : 2.2;
        let s = Math.min(maxS, Math.max(1, targetW / base.width));
        const MAX_PX = hd ? 9e6 : 4e6;
        if (base.width * s * base.height * s > MAX_PX) s = Math.sqrt(MAX_PX / (base.width * base.height));
        const vp = page.getViewport({ scale: s });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        if (cancelled) return;
        setImg(canvas.toDataURL('image/jpeg', hd ? 0.92 : 0.82)); setStatus('');
      } catch (e) { if (!cancelled) setStatus('Nu am putut afișa pagina. ' + (e && e.message ? e.message : '')); }
    })();
    return () => { cancelled = true; };
  }, [pageNum, hd, numPages]);

  const barBtn = { color: '#fff', fontSize: 20, width: 40, height: 40, borderRadius: 8, background: '#2E8BD1', border: 'none' };
  return (
    <div style={{ position: 'relative', flex: 1, minHeight: 0, background: '#0c0f13' }}>
      <div onTouchStart={onTS} onTouchMove={onTM}
        style={{ position: 'absolute', inset: 0, overflow: 'auto', WebkitOverflowScrolling: 'touch', touchAction: 'pan-x pan-y', textAlign: 'center' }}>
        <div style={{ width: `${zoom * 100}%`, minWidth: '100%', margin: '0 auto', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '10px 0 90px' }}>
          {status && <div style={{ color: '#9fb0c0', padding: '24px 16px', textAlign: 'center', fontSize: 13 }}>
            <div>{status}</div>
            {!/^Se /.test(status) && (downloadUrl || pdfUrl) && (
              <a href={(downloadUrl || pdfUrl) + '#page=' + (startPage || pageNum)} target="_blank" rel="noopener noreferrer" style={{ display:'inline-block', marginTop:12, color:'#14181C', background:'#4CAF7D', padding:'10px 16px', borderRadius:8, fontWeight:700, textDecoration:'none' }}>⬇ Deschide PDF-ul direct (pag. {startPage || pageNum})</a>
            )}
          </div>}
          {img && <img src={img} draggable="false" style={{ width: '100%', display: 'block', boxShadow: '0 2px 10px rgba(0,0,0,.4)', userSelect: 'none' }} />}
        </div>
      </div>
      {!zen && <div style={{ position: 'absolute', top: 'max(14px, env(safe-area-inset-top))', left: 12, zIndex: 15, maxWidth: '40%', color: '#cdd7e2', fontSize: 12, background: 'rgba(10,14,20,.55)', padding: '5px 10px', borderRadius: 8, backdropFilter: 'blur(6px)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{titlu || 'Normativ I7'}</div>}
      {!zen && <button onClick={() => setHd(!hd)} style={{ position: 'absolute', top: 'max(14px, env(safe-area-inset-top))', left: '50%', transform: 'translateX(-50%)', zIndex: 16, color: hd ? '#14181C' : '#cdd7e2', background: hd ? '#E9A23B' : 'rgba(10,14,20,.55)', fontSize: 12, fontWeight: 700, padding: '6px 12px', borderRadius: 8, backdropFilter: 'blur(6px)', whiteSpace: 'nowrap', border: 'none' }}>{hd ? '🔍 HD pornit' : '🔍 HD (mai clar)'}</button>}
      {onClose && <CloseX onClose={onClose} onFull={comutaEcran} />}
      {/* Bară jos: zoom + navigare pagini (ascunsă în „ecran curat") */}
      <div style={{ display: zen ? 'none' : 'flex', position: 'absolute', bottom: 14, left: '50%', transform: 'translateX(-50%)', gap: 8, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', background: 'rgba(10,14,20,.72)', border: '1px solid rgba(255,255,255,.14)', borderRadius: 12, padding: '6px 8px', backdropFilter: 'blur(6px)', zIndex: 20, maxWidth: '94%' }}>
        <button onClick={() => zoomBy(1 / 1.4)} style={barBtn}>−</button>
        <button onClick={() => setZoom(1)} style={{ color: '#fff', fontSize: 12, padding: '0 8px', height: 40, borderRadius: 8, background: '#3a424c', border: 'none' }}>{Math.round(zoom * 100)}%</button>
        <button onClick={() => zoomBy(1.4)} style={barBtn}>+</button>
        <span style={{ width: 1, height: 26, background: 'rgba(255,255,255,.18)' }} />
        <button onClick={() => goPage(pageNum - 1)} disabled={pageNum <= 1} style={{ ...barBtn, background: pageNum <= 1 ? '#2a3038' : '#2E8BD1' }}>‹</button>
        <form onSubmit={(e) => { e.preventDefault(); goPage(parseInt(pinput, 10)); }} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <input value={pinput} onChange={(e) => setPinput(e.target.value.replace(/[^0-9]/g, ''))} inputMode="numeric"
            style={{ width: 46, height: 34, textAlign: 'center', borderRadius: 8, background: '#1a1f26', color: '#fff', border: '1px solid rgba(255,255,255,.18)', fontSize: 13 }} />
          <span style={{ color: '#9fb0c0', fontSize: 12 }}>/ {numPages || '…'}</span>
        </form>
        <button onClick={() => goPage(pageNum + 1)} disabled={numPages && pageNum >= numPages} style={{ ...barBtn, background: (numPages && pageNum >= numPages) ? '#2a3038' : '#2E8BD1' }}>›</button>
      </div>
    </div>
  );
}

// ---- Normativ I7 — pagina cu căutare pe cuvinte cheie ----
// Indexul de căutare (paginile + textul) stă în fișierul normativ-i7-index.json, pus lângă index.html.
// Se încarcă o singură dată, când deschizi pagina Normativ. PDF-ul îl încarcă managerul din aplicație.
let NORMATIV_INDEX_CACHE = null;
function NormativTab({ normativPdf, setNormativPdf, normativIndexFile, setNormativIndexFile, persist, isManager }) {
  const inputStyle = { background: 'var(--panel2)', color: 'var(--text)', border: '1px solid var(--border)' };
  // Indexul de căutare se ia, în ordine: din memorie → din fișierul urcat în aplicație → dintr-un fișier
  // static pus lângă index.html. Așa nu ești obligat să pui nimic pe GitHub: îl încarci direct din aplicație.
  const [idx, setIdx] = useState(NORMATIV_INDEX_CACHE);
  const [idxStare, setIdxStare] = useState(NORMATIV_INDEX_CACHE ? 'ok' : 'load');
  const [progres, setProgres] = useState(0);
  useEffect(() => {
    if (NORMATIV_INDEX_CACHE) return;
    let anulat = false;
    (async () => {
      // 1) fișier static, dacă cineva l-a pus lângă index.html
      try {
        const r = await fetch('/normativ-i7-index.json');
        if (r.ok) {
          const d = await r.json();
          if (!anulat && Array.isArray(d) && d.length) { NORMATIV_INDEX_CACHE = d; setIdx(d); setIdxStare('ok'); return; }
        }
      } catch (_) {}
      // 2) ce a pregătit deja acest telefon (rămâne salvat local)
      try {
        const local = localStorage.getItem('normativIdx_v1');
        if (local) {
          const d = JSON.parse(local);
          if (!anulat && Array.isArray(d) && d.length) { NORMATIV_INDEX_CACHE = d; setIdx(d); setIdxStare('ok'); return; }
        }
      } catch (_) {}
      if (!anulat) setIdxStare('lipsa');
    })();
    return () => { anulat = true; };
  }, []);

  // Pregătește căutarea CITIND CHIAR PDF-UL încărcat în aplicație — nu e nevoie de niciun fișier în plus.
  const pregatesteCautarea = async () => {
    if (!normativPdf || !normativPdf.pathname) { setUpErr('Întâi trebuie încărcat PDF-ul normativului.'); return; }
    const lib = window.pdfjsLib;
    if (!lib) { setUpErr('Cititorul de PDF nu s-a încărcat. Verifică internetul și reintră în pagină.'); return; }
    setIdxStare('build'); setProgres(0); setUpErr('');
    try {
      try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch {}
      const pdf = await lib.getDocument({ url: blobViewUrl(normativPdf.pathname), disableRange: true, disableStream: true }).promise;
      const n = pdf.numPages;
      const out = [];
      for (let p = 1; p <= n; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const txt = (tc.items || []).map((it)=>it.str).join(' ').replace(/\s+/g, ' ').trim();
        out.push({ p, s: p > 474 ? 2023 : 2011, t: txt });
        if (p % 5 === 0 || p === n) setProgres(Math.round((p / n) * 100));
        try { page.cleanup(); } catch {}
      }
      try { pdf.destroy(); } catch {}
      NORMATIV_INDEX_CACHE = out; setIdx(out); setIdxStare('ok');
      try { localStorage.setItem('normativIdx_v1', JSON.stringify(out)); } catch (_) { /* dacă nu încape, rămâne doar în memorie */ }
    } catch (e) {
      setIdxStare('lipsa');
      setUpErr('Nu am putut pregăti căutarea. ' + ((e && e.message) || ''));
    }
  };

  const [q, setQ] = useState('');
  const [viewPage, setViewPage] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const fsRef = useRef(null);
  const fileRef = useRef(null);
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  const onPick = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (e.target) e.target.value = '';
    if (!f) return;
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { setUpErr('Alege fișierul PDF al normativului (normativ-i7.pdf).'); return; }
    setUploading(true); setUpErr('');
    try {
      // VERIFICARE: fișierul trebuie să fie varianta COMBINATĂ (I7-2011 + modificările 2023),
      // adică exact atâtea pagini câte știe căutarea. Altfel, rezultatele din zona 2023 ar da eroare.
      const paginiAsteptate = (idx && idx.length) || 491;
      try {
        const lib = window.pdfjsLib;
        if (lib) {
          const buf = await f.arrayBuffer();
          const pdfTest = await lib.getDocument({ data: buf }).promise;
          const nPag = pdfTest.numPages;
          try { pdfTest.destroy(); } catch {}
          if (nPag !== paginiAsteptate) {
            setUpErr(`Acest PDF are ${nPag} pagini, dar căutarea e făcută pentru varianta combinată cu ${paginiAsteptate} de pagini (I7-2011 + modificările 2023 la final). Se pare că ai ales normativul vechi. Încarcă fișierul „normativ-i7.pdf" pe care ți l-am trimis.`);
            setUploading(false); return;
          }
        }
      } catch (_) { /* dacă verificarea nu merge, lăsăm încărcarea să continue */ }
      const res = await uploadFileToBlob(f, 'normativ');
      const rec = { pathname: res.pathname, url: res.url, nume: f.name };
      setNormativPdf(rec); await persist('normativPdf', rec);
    } catch (err) { setUpErr(err && err.message ? err.message : 'Încărcare eșuată.'); }
    setUploading(false);
  };

  const termeni = norm(q).split(/\s+/).filter((w) => w.length >= 2);
  const rawTermeni = q.trim().split(/\s+/).filter((w) => w.length >= 2);
  const rezultate = useMemo(() => {
    if (!idx || termeni.length === 0) return [];
    const out = [];
    for (const pg of idx) {
      const t = norm(pg.t);
      if (termeni.every((w) => t.includes(w))) {
        const pos = t.indexOf(termeni[0]);
        const start = Math.max(0, pos - 70);
        const snip = pg.t.slice(start, start + 200).replace(/\s+/g, ' ').trim();
        out.push({ p: pg.p, s: pg.s, snip: (start > 0 ? '… ' : '') + snip + ' …' });
        if (out.length >= 80) break;
      }
    }
    return out;
  }, [idx, q]);

  const evidentiaza = (text) => {
    if (!rawTermeni.length) return text;
    try {
      const re = new RegExp('(' + rawTermeni.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
      const parts = String(text).split(re);
      return parts.map((p, i) => rawTermeni.some((t) => p.toLowerCase() === t.toLowerCase())
        ? <mark key={i} style={{ background: '#E9A23B', color: '#14181C', borderRadius: 3, padding: '0 2px' }}>{p}</mark>
        : <span key={i}>{p}</span>);
    } catch (_) { return text; }
  };

  const chips = ['spital', 'medical', 'tablou', 'priză', 'legare la pământ', 'incendiu', 'iluminat', 'cablu', 'coloană', 'doze', 'descărcări', 'disjunctor'];
  const arePdf = !!(normativPdf && normativPdf.pathname);
  const deschide = (p) => { if (arePdf) setViewPage(p); };
  // Dacă scrii un număr (ex. „478" sau „pagina 478"), îți oferă săritul direct la acea pagină.
  const totalPag = idx ? idx.length : 491;
  const pagCautata = (() => {
    const m = String(q).match(/(\d{1,3})/);
    if (!m) return null;
    const n = parseInt(m[1], 10);
    return (n >= 1 && n <= totalPag) ? n : null;
  })();

  if (viewPage != null && arePdf) {
    return (
      <div ref={fsRef} style={{ position: 'fixed', inset: 0, zIndex: 200, background: '#0c0f13', display: 'flex', flexDirection: 'column' }}>
        <NormativViewer pdfUrl={blobViewUrl(normativPdf.pathname)} downloadUrl={normativPdf.url || blobViewUrl(normativPdf.pathname)} startPage={viewPage} titlu={'Normativ I7 — pag. ' + viewPage} onClose={() => setViewPage(null)} onFull={() => toggleFullscreen(fsRef.current)} />
      </div>
    );
  }

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color: 'var(--text)', fontFamily: "'Space Grotesk', sans-serif" }}>📘 Normativ I7</h2>
      <p className="text-xs mb-3" style={{ color: 'var(--muted2)' }}>Normativ I7-2011 pentru instalații electrice, cu Modificările și completările din 2023 incluse la final (paginile 475–491, marcate cu ⚠ 2023). Scrii ce cauți, îți arată paginile potrivite și le deschizi direct.</p>

      {/* Încărcarea PDF-ului: o singură dată, de către manager */}
      {!arePdf && (
        <div className="rounded-xl px-3 py-3 mb-3" style={{ background: isManager ? '#2E8BD115' : '#E9A23B15', border: '1px solid ' + (isManager ? '#2E8BD140' : '#E9A23B40'), color: 'var(--text)' }}>
          {isManager ? (
            <div>
              <div className="text-sm font-semibold mb-1">📤 Încarcă normativul (o singură dată)</div>
              <div className="text-[11px] mb-2" style={{ color: 'var(--muted)', lineHeight: 1.6 }}>Alege fișierul <b>normativ-i7.pdf</b> pe care ți l-am trimis (~11MB). Se salvează în aplicație și îl vor vedea toți angajații. Căutarea merge deja — asta e doar ca să se poată și deschide pagina.</div>
              <input ref={fileRef} type="file" accept="application/pdf,.pdf" onChange={onPick} style={{ display: 'none' }} />
              <button onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading} className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ background: uploading ? '#2a3038' : '#2E8BD1', color: '#fff' }}>{uploading ? 'Se încarcă…' : '📄 Alege PDF-ul normativului'}</button>
            </div>
          ) : (
            <div className="text-xs" style={{ lineHeight: 1.6 }}>Căutarea în normativ merge. Ca să se poată și <b>deschide</b> pagina, managerul trebuie să încarce o dată fișierul PDF (din meniul lui). Până atunci vezi mai jos unde apare fiecare cuvânt (pagina și textul).</div>
          )}
          {upErr && <div className="text-[11px] mt-2" style={{ color: '#E05252' }}>{upErr}</div>}
        </div>
      )}

      <div className="flex gap-2 mb-2">
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="🔍 Caută un cuvânt sau un număr de pagină (ex: tablou, priză, 478...)" className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        {arePdf && <button onClick={() => setViewPage(1)} className="px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap" style={{ background: '#2E8BD1', color: '#fff' }}>📖 Deschide</button>}
      </div>

      <div className="flex flex-wrap gap-1.5 mb-3">
        {chips.map((c) => (
          <button key={c} onClick={() => setQ(c)} className="text-[11px] px-2.5 py-1 rounded-full" style={{ background: 'var(--panel2)', color: 'var(--muted)', border: '1px solid var(--border)' }}>{c}</button>
        ))}
      </div>

      {idxStare === 'load' && <div className="text-xs text-center py-6" style={{ color: 'var(--muted2)' }}>Se verifică căutarea…</div>}
      {idxStare === 'build' && (
        <div className="rounded-lg px-3 py-3" style={{ background: '#2E8BD115', border: '1px solid #2E8BD140', color: 'var(--text)' }}>
          <div className="text-sm font-semibold mb-1">🔍 Se pregătește căutarea… {progres}%</div>
          <div className="text-[11px] mb-2" style={{ color: 'var(--muted)' }}>Citesc normativul pagină cu pagină. Durează un minut, o singură dată pe telefonul ăsta. Nu închide pagina.</div>
          <div style={{ height: 6, borderRadius: 6, background: 'var(--panel2)', overflow: 'hidden' }}>
            <div style={{ width: progres + '%', height: '100%', background: 'linear-gradient(90deg,#2E8BD1,#4CAF7D)', transition: 'width .3s' }} />
          </div>
        </div>
      )}
      {idxStare === 'lipsa' && (
        <div className="rounded-lg px-3 py-3" style={{ background: '#2E8BD115', border: '1px solid #2E8BD140', color: 'var(--text)', lineHeight: 1.6 }}>
          <div className="text-sm font-semibold mb-1">🔍 Pornește căutarea (o singură dată)</div>
          <div className="text-[11px] mb-2" style={{ color: 'var(--muted)' }}>
            {arePdf
              ? 'Aplicația citește singură normativul încărcat și își face căutarea. Durează cam un minut, o singură dată pe telefonul ăsta. După aceea cauți instant orice cuvânt.'
              : 'Întâi trebuie încărcat PDF-ul normativului (butonul de mai sus), apoi pornești căutarea de aici.'}
          </div>
          <button onClick={pregatesteCautarea} disabled={!arePdf} className="px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-40" style={{ background: '#2E8BD1', color: '#fff' }}>🔍 Pregătește căutarea</button>
        </div>
      )}

      {pagCautata && (
        arePdf ? (
          <button onClick={() => deschide(pagCautata)} className="w-full text-left rounded-xl px-3 py-2.5 mb-2 flex items-center justify-between gap-2" style={{ background: '#2E8BD115', border: '1px solid #2E8BD166' }}>
            <span className="text-sm font-semibold" style={{ color: '#2E8BD1' }}>📖 Mergi direct la pagina {pagCautata}</span>
            <span style={{ color: '#2E8BD1' }}>→</span>
          </button>
        ) : (
          <div className="text-[11px] rounded-lg px-3 py-2 mb-2" style={{ background: '#E9A23B15', border: '1px solid #E9A23B40', color: 'var(--text)' }}>Pagina {pagCautata}: ca s-o poți deschide, managerul trebuie să încarce o dată PDF-ul normativului.</div>
        )
      )}

      {idx && termeni.length > 0 && (
        <div className="text-[11px] mb-2" style={{ color: 'var(--muted2)' }}>{rezultate.length === 0 ? 'Niciun rezultat.' : (rezultate.length >= 80 ? 'Peste 80 de pagini' : rezultate.length + (rezultate.length === 1 ? ' pagină' : ' pagini')) + (arePdf ? ' — apeși ca să deschizi.' : ' — apar mai jos.')}</div>
      )}

      <div className="space-y-2">
        {rezultate.map((r) => (
          <button key={r.p} onClick={() => deschide(r.p)} className="w-full text-left rounded-xl px-3 py-2.5" style={{ background: 'var(--panel)', border: '1px solid var(--border)', cursor: arePdf ? 'pointer' : 'default' }}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xs font-semibold" style={{ color: '#2E8BD1' }}>📄 Pagina {r.p}</span>
              {r.s === 2023 && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: '#E9A23B', color: '#14181C', fontWeight: 700 }}>⚠ Modificare 2023</span>}
            </div>
            <div className="text-[11px]" style={{ color: 'var(--muted)', lineHeight: 1.5 }}>{evidentiaza(r.snip)}</div>
          </button>
        ))}
      </div>

      {idx && termeni.length === 0 && (
        <div className="text-xs text-center py-6" style={{ color: 'var(--muted2)' }}>Scrie un cuvânt sus sau apasă pe o etichetă ca să cauți în normativ.</div>
      )}

      {arePdf && isManager && (
        <div className="mt-4 text-center">
          <input ref={fileRef} type="file" accept="application/pdf,.pdf" onChange={onPick} style={{ display: 'none' }} />
          <button onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading} className="text-[11px]" style={{ color: 'var(--muted2)' }}>{uploading ? 'Se încarcă…' : '↻ Înlocuiește PDF-ul normativului'}</button>
          {upErr && <div className="text-[11px] mt-1" style={{ color: '#E05252' }}>{upErr}</div>}
        </div>
      )}
    </div>
  );
}

// ---- Calculator electric: căutare + acordeon. Cele mai uzuale sus, la îndemână. ----
const CALC_RHO = { cupru: 0.0175, aluminiu: 0.0286 }; // Ω·mm²/m
const CALC_SECT = [1.5, 2.5, 4, 6, 10, 16, 25, 35, 50, 70, 95, 120, 150, 185, 240];
const CALC_DISJ = [6, 10, 13, 16, 20, 25, 32, 40, 50, 63, 80, 100, 125, 160, 200, 250];
const calcFmt = (x, d = 2) => { if (!isFinite(x)) return '—'; const r = Math.round(x * Math.pow(10, d)) / Math.pow(10, d); return String(r); };
const calcNextSect = (s) => CALC_SECT.find((x) => x >= s);
const calcNextDisj = (i) => CALC_DISJ.find((x) => x >= i);

const CALCULATOARE = [
  {
    id: 'curent_putere', top: true, cat: 'Curent & putere', titlu: '⚡ Curent din putere (A)',
    cuvinte: 'amperaj a curent putere w kw consum disjunctor',
    formula: 'Monofazat: I = P / (U · cosφ)   ·   Trifazat: I = P / (√3 · U · cosφ)',
    campuri: [

      { f: 'uP', label: 'Unitate', tip: 'select', optiuni: ['kW', 'W'], def: 'kW' },
      { f: 'faze', label: 'Rețea', tip: 'select', optiuni: ['mono', 'tri'], def: 'mono' },
      { f: 'U', label: 'Tensiune (V)', tip: 'num', def: '230' },
      { f: 'cos', label: 'cosφ', tip: 'num', def: '0.9' },
    ],
    calc: (c) => {
      let P = c.n('P'); const uP = c.s('uP', 'kW'); if (uP === 'kW') P = P * 1000;
      const tri = c.s('faze', 'mono') === 'tri'; const U = c.n('U', tri ? 400 : 230); const cos = c.n('cos', 0.9);
      if (!isFinite(P) || !isFinite(U) || U <= 0) return 'Completează puterea și tensiunea.';
      const I = tri ? P / (1.732 * U * cos) : P / (U * cos);
      return `I = ${calcFmt(I, 1)} A   (${tri ? 'trifazat' : 'monofazat'})\nDisjunctor orientativ: ${calcNextDisj(I) || '>250'} A`;
    },
  },
  {
    id: 'sectiune_cablu', top: true, cat: 'Cablu', titlu: '🔌 Secțiune cablu (mm²)',
    cuvinte: 'sectiune cablu mm cadere tensiune cupru aluminiu',
    formula: 'S = (k · ρ · L · I) / ΔU   (k=2 mono, √3 tri; ρ Cu=0.0175, Al=0.0286)',
    campuri: [
      { f: 'I', label: 'Curent (A)', tip: 'num', def: '' },
      { f: 'L', label: 'Lungime dus (m)', tip: 'num', def: '' },

      { f: 'U', label: 'Tensiune (V)', tip: 'num', def: '230' },

    calc: (c) => {

      if (!isFinite(I) || !isFinite(L)) return 'Completează curentul și lungimea.';
      const dUv = U * du / 100; const k = tri ? 1.732 : 2;
      const S = (k * rho * L * I) / dUv;
      const rec = calcNextSect(S);
      return `Secțiune minimă calculată: ${calcFmt(S, 2)} mm²\n➜ Alege cablu standard: ${rec ? rec + ' mm²' : '> 240 mm²'}\n(verifică și curentul maxim admis / normativ I7)`;

    calc: (c) => {

    formula: 'ΔU = k · ρ · L · I / S ;  %ΔU = ΔU / U · 100',
    campuri: [

      { f: 'L', label: 'Lungime dus (m)', tip: 'num', def: '' },
      { f: 'S', label: 'Secțiune (mm²)', tip: 'num', def: '' },
      { f: 'faze', label: 'Rețea', tip: 'select', optiuni: ['mono', 'tri'], def: 'mono' },
      { f: 'U', label: 'Tensiune (V)', tip: 'num', def: '230' },

    calc: (c) => {

      const U = c.n('U', tri ? 400 : 230); const rho = CALC_RHO[c.s('mat', 'cupru')];
      if (!isFinite(I) || !isFinite(L) || !isFinite(S) || S <= 0) return 'Completează curentul, lungimea și secțiunea.';
      const k = tri ? 1.732 : 2; const dUv = k * rho * L * I / S; const proc = dUv / U * 100;
      return `Cădere: ${calcFmt(dUv, 2)} V  =  ${calcFmt(proc, 2)} %\n${proc > 3 ? '⚠ Peste 3% — ia cablu mai gros sau scurtează traseul.' : '✅ În limite (sub ~3%).'}`;

  {

    calc: (c) => {

    id: 'putere_curent', cat: 'Curent & putere', titlu: '🔋 Putere din curent (W)',

      if (isFinite(U) && isFinite(R)) return `I = ${calcFmt(U / R, 2)} A\nP = ${calcFmt(U * U / R, 2)} W`;
      if (isFinite(I) && isFinite(R)) return `U = ${calcFmt(I * R, 2)} V\nP = ${calcFmt(I * I * R, 2)} W`;

  {
    id: 'motor_tri', cat: 'Motoare', titlu: '⚙ Curent motor trifazat',
    cuvinte: 'motor trifazat curent randament eta putere',
    formula: 'I = P / (√3 · U · cosφ · η)',
    campuri: [
      { f: 'P', label: 'Putere mecanică (kW)', tip: 'num', def: '' },
      { f: 'U', label: 'Tensiune (V)', tip: 'num', def: '400' },
      { f: 'cos', label: 'cosφ', tip: 'num', def: '0.85' },
      { f: 'eta', label: 'Randament η (%)', tip: 'num', def: '88' },
    ],
    calc: (c) => {
      const P = c.n('P') * 1000, U = c.n('U', 400), cos = c.n('cos', 0.85), eta = c.n('eta', 88) / 100;
      if (!isFinite(P) || !isFinite(U)) return 'Completează puterea și tensiunea.';
      const I = P / (1.732 * U * cos * eta);
      return `I = ${calcFmt(I, 1)} A\nDisjunctor orientativ: ${calcNextDisj(I * 1.25) || '>250'} A (cu rezervă de pornire)`;
    },
  },
  {
    id: 'cosfi', cat: 'Motoare', titlu: '🔧 Corecție cosφ (condensator kVAR)',
    cuvinte: 'cosfi factor de putere condensator kvar compensare',
    formula: 'Qc = P · (tanφ1 − tanφ2)',
    campuri: [
      { f: 'P', label: 'Putere activă (kW)', tip: 'num', def: '' },
      { f: 'c1', label: 'cosφ actual', tip: 'num', def: '0.75' },
      { f: 'c2', label: 'cosφ dorit', tip: 'num', def: '0.95' },
    ],
    calc: (c) => {
      const P = c.n('P'), c1 = c.n('c1', 0.75), c2 = c.n('c2', 0.95);
      if (!isFinite(P) || !(c1 > 0 && c1 <= 1) || !(c2 > 0 && c2 <= 1)) return 'Completează puterea și factorii cosφ (0–1).';
      if (c2 <= c1) return 'cosφ dorit trebuie să fie mai mare decât cel actual.';
      const Qc = P * (Math.tan(Math.acos(c1)) - Math.tan(Math.acos(c2)));
      return `Baterie condensatoare: ${calcFmt(Qc, 2)} kVAR`;
    },
  },
  {
    id: 'kw_cp', cat: 'Conversii', titlu: '🐎 kW ↔ CP (cai putere)',
    cuvinte: 'kw cp cai putere hp conversie',
    formula: '1 CP ≈ 0.7355 kW',
    campuri: [
      { f: 'v', label: 'Valoare', tip: 'num', def: '' },
      { f: 'u', label: 'Unitate', tip: 'select', optiuni: ['kW', 'CP'], def: 'kW' },
    ],
    calc: (c) => {
      const v = c.n('v'); if (!isFinite(v)) return 'Introdu o valoare.';
      return c.s('u', 'kW') === 'kW' ? `${calcFmt(v, 2)} kW = ${calcFmt(v / 0.7355, 2)} CP` : `${calcFmt(v, 2)} CP = ${calcFmt(v * 0.7355, 2)} kW`;
    },
  },
  {
    id: 'rezistenta_cablu', cat: 'Cablu', titlu: '📏 Rezistența unui cablu (Ω)',
    cuvinte: 'rezistenta cablu ohm lungime sectiune',
    formula: 'R = ρ · L / S',
    campuri: [
      { f: 'L', label: 'Lungime (m)', tip: 'num', def: '' },
      { f: 'S', label: 'Secțiune (mm²)', tip: 'num', def: '' },
      { f: 'mat', label: 'Material', tip: 'select', optiuni: ['cupru', 'aluminiu'], def: 'cupru' },
    ],
    calc: (c) => {
      const L = c.n('L'), S = c.n('S'), rho = CALC_RHO[c.s('mat', 'cupru')];
      if (!isFinite(L) || !isFinite(S) || S <= 0) return 'Completează lungimea și secțiunea.';
      return `R = ${calcFmt(rho * L / S, 4)} Ω`;
    },
  },
  {
    id: 'pe', cat: 'Protecții', titlu: '🌍 Secțiune conductor de protecție (PE)',
    cuvinte: 'pe pamant protectie sectiune impamantare',
    formula: 'S≤16 → PE=S ; 16<S≤35 → PE=16 ; S>35 → PE=S/2',
    campuri: [{ f: 'S', label: 'Secțiune fază (mm²)', tip: 'num', def: '' }],
    calc: (c) => {
      const S = c.n('S'); if (!isFinite(S)) return 'Introdu secțiunea fazei.';
      let pe; if (S <= 16) pe = S; else if (S <= 35) pe = 16; else pe = S / 2;
      return `Conductor PE minim: ${calcFmt(pe, 1)} mm²`;
    },
  },
  {
    id: 'iluminat', cat: 'Iluminat', titlu: '💡 Număr corpuri de iluminat',
    cuvinte: 'iluminat lux corpuri lampi lumeni suprafata',
    formula: 'N = (lux · suprafață) / (flux_corp · factor)',
    campuri: [
      { f: 'A', label: 'Suprafață (m²)', tip: 'num', def: '' },
      { f: 'lux', label: 'Nivel dorit (lux)', tip: 'num', def: '300' },
      { f: 'flux', label: 'Flux per corp (lm)', tip: 'num', def: '3000' },
      { f: 'fu', label: 'Factor (0.4–0.8)', tip: 'num', def: '0.6' },
    ],
    calc: (c) => {
      const A = c.n('A'), lux = c.n('lux', 300), flux = c.n('flux', 3000), fu = c.n('fu', 0.6);
      if (!isFinite(A) || !isFinite(flux) || flux <= 0) return 'Completează suprafața și fluxul.';
      const N = (lux * A) / (flux * fu);
      return `Necesar: ${Math.ceil(N)} corpuri (calcul: ${calcFmt(N, 1)})`;
    },
  },
];

function CalculatorTab() {
  const inputStyle = { background: 'var(--panel2)', color: 'var(--text)', border: '1px solid var(--border)' };
  const [cauta, setCauta] = useState('');
  const [deschis, setDeschis] = useState({});
  const [vals, setVals] = useState({});
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const q = norm(cauta).trim();
  const lista = q ? CALCULATOARE.filter((c) => norm(c.titlu + ' ' + c.cuvinte + ' ' + c.cat).includes(q)) : CALCULATOARE;
  const uzuale = q ? [] : lista.filter((c) => c.top);
  const restul = q ? lista : lista.filter((c) => !c.top);

  const randCalc = (c) => {
    const open = !!deschis[c.id];
    const ctx = {
      n: (f, def) => { const raw = vals[c.id + '.' + f]; const x = parseFloat(String(raw == null ? '' : raw).replace(',', '.')); return isFinite(x) ? x : (def === undefined ? NaN : def); },
      s: (f, def) => { const raw = vals[c.id + '.' + f]; return (raw == null || raw === '') ? (def === undefined ? '' : def) : String(raw); },
    };
    const rez = open ? c.calc(ctx) : '';
    return (
      <div key={c.id} className="rounded-xl" style={{ background: 'var(--panel)', border: '1px solid var(--border)' }}>
        <button onClick={() => setDeschis((d) => ({ ...d, [c.id]: !d[c.id] }))} className="w-full flex items-center gap-2 px-3 py-2.5 text-left">
          <span style={{ fontSize: 10, color: 'var(--muted)', display: 'inline-block', transform: open ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>▶</span>
          <span className="text-sm font-semibold flex-1" style={{ color: 'var(--text)' }}>{c.titlu}</span>
          <span className="text-[10px]" style={{ color: 'var(--muted2)' }}>{c.cat}</span>
        </button>
        {open && (
          <div className="px-3 pb-3">
            <div className="text-[11px] rounded-lg px-2.5 py-1.5 mb-2" style={{ background: 'var(--panel2)', color: 'var(--muted)', fontFamily: "'JetBrains Mono', monospace" }}>{c.formula}</div>
            <div className="grid grid-cols-2 gap-2">
              {c.campuri.map((cp) => (
                <div key={cp.f}>
                  <div className="text-[11px] mb-0.5" style={{ color: 'var(--muted)' }}>{cp.label}</div>
                  {cp.tip === 'select' ? (
                    <select value={vals[c.id + '.' + cp.f] || cp.def} onChange={(e) => setVals((s) => ({ ...s, [c.id + '.' + cp.f]: e.target.value }))} className="w-full rounded-lg px-2 py-1.5 text-sm outline-none" style={inputStyle}>
                      {cp.optiuni.map((o) => <option key={o} value={o} style={{ background: 'var(--panel)' }}>{o}</option>)}
                    </select>
                  ) : (
                    <input type="text" inputMode="decimal" value={vals[c.id + '.' + cp.f] || ''} placeholder={cp.def} onChange={(e) => setVals((s) => ({ ...s, [c.id + '.' + cp.f]: e.target.value }))} className="w-full rounded-lg px-2 py-1.5 text-sm outline-none" style={inputStyle} />
                  )}
                </div>
              ))}
            </div>
            <div className="mt-2 rounded-lg px-3 py-2 text-sm whitespace-pre-line" style={{ background: '#2E8BD115', border: '1px solid #2E8BD140', color: 'var(--text)', fontWeight: 600 }}>{rez}</div>
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color: 'var(--text)', fontFamily: "'Space Grotesk', sans-serif" }}>🧮 Calculator electric</h2>
      <p className="text-xs mb-3" style={{ color: 'var(--muted2)' }}>Alege calculul, bagi datele, îți dă rezultatul. Valorile sunt orientative — cablul și protecțiile se verifică cu normativul I7.</p>
      <input value={cauta} onChange={(e) => setCauta(e.target.value)} placeholder="🔍 Caută (ex: secțiune, disjunctor, cădere, cosfi...)" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-4" style={inputStyle} />

      {uzuale.length > 0 && (
        <div className="mb-4">
          <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color: '#E9A23B' }}>⭐ Cele mai folosite</div>
          <div className="space-y-2">{uzuale.map(randCalc)}</div>
        </div>
      )}
      {restul.length > 0 ? (
        <div>
          {!q && <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color: 'var(--muted2)' }}>Toate calculele</div>}
          <div className="space-y-2">{restul.map(randCalc)}</div>
        </div>
      ) : (uzuale.length === 0 && <div className="text-xs text-center py-6" style={{ color: 'var(--muted2)' }}>Niciun calcul găsit pentru „{cauta}".</div>)}
    </div>
  );
}

// Test provizoriu: „Raport din vorbe" — băiatul dictează/scrie, AI-ul scrie raportul și cere confirmări.
function RaportAITest() {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [text, setText] = useState('');
  const [out, setOut] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [asc, setAsc] = useState(false);
  const recRef = useRef(null);
  const speechOK = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const dicteaza = () => {
    if (asc && recRef.current) { try { recRef.current.stop(); } catch {} return; }
    if (!speechOK) { setErr('Dictarea vocală nu e suportată aici. Folosește microfonul de pe tastatura telefonului (lângă bara de spațiu).'); return; }
    try {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new R();
      rec.lang = 'ro-RO'; rec.interimResults = true; rec.continuous = true;
      let baza = text ? text.trim() + ' ' : '';
      let final = baza;
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const tr = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += tr + ' '; else interim += tr;
        }
        setText((final + interim).trim());
      };
      rec.onerror = () => { setAsc(false); };
      rec.onend = () => { setAsc(false); recRef.current = null; };
      recRef.current = rec; setErr(''); setAsc(true); rec.start();
    } catch (e) { setErr('Nu am putut porni dictarea.'); setAsc(false); }
  };

  const genereaza = async () => {
    if (!text.trim()) return;
    setBusy(true); setOut(''); setErr('');
    const instr = 'Ești asistentul unei firme de instalații electrice. Transformă descrierea de mai jos (spusă de un electrician) într-un RAPORT ZILNIC DE ȘANTIER structurat și scurt, în limba română, cu secțiunile:\n• Lucrări efectuate\n• Materiale folosite (cu cantități, dacă sunt menționate)\n• Persoane și ore (dacă sunt menționate)\nDacă lipsesc informații esențiale (orele lucrate sau cine a lucrat), adaugă la final o secțiune „❓ De confirmat:" cu întrebări scurte. Nu inventa date.\n\nDescriere: ' + text.trim();
    try {
      const r = await authFetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ intrebare: instr, context: [] }) });
      let d = {}; try { d = await r.json(); } catch {}
      if (r.ok && d && d.raspuns) setOut(d.raspuns);
      else if (r.status === 404) setErr('AI-ul nu e activat (ruta /api/ai lipsește pe server).');
      else if (r.status === 500) setErr('AI-ul nu e configurat (lipsește cheia GEMINI_API_KEY pe Vercel).');
      else setErr((d && d.error) ? d.error : 'AI indisponibil momentan.');
    } catch (e) { setErr('Fără conexiune la AI.'); }
    setBusy(false);
  };

  return (
    <div className="mt-5 rounded-xl p-4 max-w-md" style={{ background:'var(--panel)', border:'1px solid #C08CE066' }}>
      <div className="text-sm font-semibold mb-1" style={{ color:'#C08CE0' }}>🎤 Raport din vorbe — AI (test)</div>
      <p className="text-xs mb-2" style={{ color:'var(--muted)' }}>Spune sau scrie ce ai făcut azi, iar AI-ul îți scrie raportul. Versiune de test.</p>
      <textarea value={text} onChange={(e)=>setText(e.target.value)} rows={3} placeholder="Ex: am tras cabluri la prize în bucătărie, cu Nicu, vreo 3 ore, am folosit 40m cablu 3x2.5" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
      <div className="flex flex-wrap gap-2">
        <button onClick={dicteaza} className="text-sm px-3 py-2 rounded-lg font-semibold" style={{ color: asc?'#14181C':'var(--text)', background: asc?'#E05252':'var(--panel2)', border:'1px solid var(--border)' }}>{asc ? '⏹ Oprește dictarea' : '🎤 Dictează'}</button>
        <button onClick={genereaza} disabled={busy || !text.trim()} className="text-sm px-3 py-2 rounded-lg font-semibold disabled:opacity-50" style={{ color:'#14181C', background:'#C08CE0' }}>{busy ? 'Se scrie…' : '✨ Generează raportul'}</button>
      </div>
      {err && <p className="text-xs mt-2" style={{ color:'#E9A23B' }}>{err}</p>}
      {out && <div className="mt-2 rounded-lg px-3 py-2 text-sm whitespace-pre-wrap" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }}>{out}</div>}
      <p className="text-[11px] mt-2" style={{ color:'var(--muted2)' }}>Dictarea merge pe Android; pe iPhone folosește microfonul de pe tastatură. Necesită AI configurat (aceeași cheie ca la Q&A).</p>
    </div>
  );
}

const codPentruTip = (tip) => CONCEDIU_TIPURI.find((t)=>t.label===tip)?.cod || 'CO';

// Extrage ziua de nastere (zi/luna, fara an) dintr-un CNP romanesc valid.
// Cifra 1 = sex+secol (1/2=1900-1999, 3/4=1800-1899, 5/6=2000-2099); 7/8/9 = cazuri speciale, ignorate.
// Formateaza minute in "X zile" sau "X zile si Y ore" (o zi = 8 ore), pentru afisarea concediului.
function minutesToZileOre(minute) {
  const totalMin = Math.max(0, Math.round(minute || 0));
  const zile = Math.floor(totalMin / 480);
  const oreRamase = totalMin % 480;
  const ziLabel = zile === 1 ? 'zi' : 'zile';
  if (oreRamase === 0) return `${zile} ${ziLabel}`;
  return `${zile} ${ziLabel} și ${minutesToHM(oreRamase)} ore`;
}

function nasterePeDinCnp(cnp) {
  if (!cnp || !/^\d{13}$/.test(cnp)) return null;
  const s = Number(cnp[0]);
  let secol;
  if (s===1 || s===2) secol=1900;
  else if (s===3 || s===4) secol=1800;
  else if (s===5 || s===6) secol=2000;
  else return null;
  const an = secol + Number(cnp.slice(1,3));
  const luna = Number(cnp.slice(3,5));
  const zi = Number(cnp.slice(5,7));
  if (luna<1 || luna>12 || zi<1 || zi>31) return null;
  return { an, luna, zi };
}

// Calculeaza, pentru o persoana si un an, ziua-cu-ziua ce s-a intamplat: lucrat, concediu aprobat,
// sau concediu AUTOMAT (zi lucrata sub 8h sau lipsa complet, fara cerere aprobata care sa explice).
// Concediul automat consuma dintr-un buget anual de 21 zile x 8h (168h) platite; peste buget devine "I" (fara plata).
// "panaLaLuna" (format YYYY-MM) opreste calculul la sfarsitul acelei luni, ca sa nu procesam degeaba tot anul.
function calculPontajAnual(nume, an, panaLaLuna, rapoarte, concedii) {
  const concediiAprobate = (concedii || []).filter((c)=>c.nume===nume && c.status==='Aprobat');
  const minuteLucratePeZi = {};
  const dateRaportate = [];
  rapoarte.forEach((r)=>{
    if (!r.data?.startsWith(String(an))) return;
    const p = (r.persoane || []).find((pp)=>pp.nume===nume);
    if (!p) return;
    minuteLucratePeZi[r.data] = (minuteLucratePeZi[r.data] || 0) + personMinutes(p);
    dateRaportate.push(r.data);
  });
  // Nu penalizam zilele dinainte de primul raport real al persoanei - de obicei inseamna
  // ca aplicatia/urmarirea nu exista inca de atunci, nu ca persoana a lipsit nemotivat.
  const primaZiCuDate = dateRaportate.length ? dateRaportate.slice().sort()[0] : null;

  const [anLimita, lunaLimita] = panaLaLuna.split('-').map(Number);
  const ultimaZiLimita = new Date(anLimita, lunaLimita, 0).getDate();
  const dataLimita = `${panaLaLuna}-${String(ultimaZiLimita).padStart(2,'0')}`;

  let bugetRamasMin = 21 * 8 * 60;
  const rezultat = {};
  for (let luna=0; luna<12; luna++) {
    const nrZileLuna = new Date(an, luna+1, 0).getDate();
    for (let zi=1; zi<=nrZileLuna; zi++) {
      const dataStr = `${an}-${String(luna+1).padStart(2,'0')}-${String(zi).padStart(2,'0')}`;
      if (dataStr > dataLimita) return rezultat;
      if (!primaZiCuDate || dataStr < primaZiCuDate) continue;
      const dow = new Date(an, luna, zi).getDay();
      if (dow===0 || dow===6) continue;

      if ((SARBATORI_LEGALE[an] || []).includes(dataStr)) { rezultat[dataStr] = { status:'sarbatoare', cod:'SL' }; continue; }

      const concAprobat = concediiAprobate.find((c)=>dataStr>=c.dataInceput && dataStr<=c.dataSfarsit);
      if (concAprobat) {
        const cod = codPentruTip(concAprobat.tip);
        if (cod === 'CO') bugetRamasMin = Math.max(0, bugetRamasMin - 480);
        rezultat[dataStr] = { status:'aprobat', cod };
        continue;
      }

      const minLucrate = minuteLucratePeZi[dataStr] || 0;
      const diferenta = 480 - minLucrate;
      if (diferenta <= 0) {
        rezultat[dataStr] = { status:'lucrat', minuteLucrate: minLucrate, suplimentar: -diferenta };
      } else {
        let codAuto;
        if (bugetRamasMin >= diferenta) { codAuto = 'CO'; bugetRamasMin -= diferenta; }
        else { codAuto = 'I'; bugetRamasMin = 0; }
        rezultat[dataStr] = { status: minLucrate > 0 ? 'partial' : 'absent', minuteLucrate: minLucrate, minuteAuto: diferenta, codAuto };
      }
    }
  }
  return rezultat;
}

const ACHIZITIE_STATUSES = ['De comandat', 'Comandat', 'Primit'];

function PontajTab({ rapoarte, santiere, currentUser, pontajCorectii, setPontajCorectii, persist, company, concedii }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [luna, setLuna] = useState(new Date().toISOString().slice(0,7));
  const isManager = currentUser?.rol === 'Manager';
  const [editState, setEditState] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [santiereExport, setSantiereExport] = useState([]);
  const [santierFiltru, setSantierFiltru] = useState('');
  const [allUsersPontaj, setAllUsersPontaj] = useState([]);
  useEffect(() => {
    if (!isManager) return;
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setAllUsersPontaj(data.users || [])).catch(()=>{});
  }, [isManager]);

  const rapoarteLuna = rapoarte.filter((r)=>r.data?.startsWith(luna) && (!santierFiltru || r.santierId===santierFiltru));
  // Zile libere (concediu aprobat) în luna selectată, pe persoană — asta interesează contabila.
  const zileLibereLuna = (nume) => {
    const aprobate = (concedii || []).filter((c)=>c.nume===nume && c.status==='Aprobat');
    let cnt = 0;
    aprobate.forEach((c)=>{
      if (!c.dataInceput || !c.dataSfarsit) return;
      let d = new Date(c.dataInceput); const end = new Date(c.dataSfarsit);
      while (d <= end) { const ds = d.toISOString().slice(0,10); if (ds.startsWith(luna)) cnt++; d.setDate(d.getDate()+1); }
    });
    return cnt;
  };
  const perPersoana = {};
  rapoarteLuna.forEach((r)=>{
    const santierNume = santiere.find((s)=>s.id===r.santierId)?.nume || '—';
    (r.persoane || []).forEach((p)=>{
      if (!p.nume?.trim()) return;
      if (!isManager && p.nume !== currentUser?.nume) return;
      if (!perPersoana[p.nume]) perPersoana[p.nume] = { nume: p.nume, totalMin: 0, peSantier: {} };
      const min = personMinutes(p);
      perPersoana[p.nume].totalMin += min;
      perPersoana[p.nume].peSantier[santierNume] = (perPersoana[p.nume].peSantier[santierNume] || 0) + min;
    });
  });
  // Toți angajații apar în pontaj, chiar dacă n-au ore luna asta sau n-au niciun șantier activ.
  if (isManager) {
    allUsersPontaj.filter((u)=>u.rol==='Electrician').forEach((u)=>{
      if (!perPersoana[u.nume]) perPersoana[u.nume] = { nume: u.nume, totalMin: 0, peSantier: {} };
    });
  }

  const corectiiLuna = (pontajCorectii || []).filter((c)=>c.luna===luna);
  const corectiePersoana = (nume) => corectiiLuna.filter((c)=>c.nume===nume).reduce((s,c)=>s+c.minuteAjustare,0);

  const lista = Object.values(perPersoana)
    .map((p)=>({ ...p, corectieMin: corectiePersoana(p.nume), totalFinal: p.totalMin + corectiePersoana(p.nume), zileLibere: zileLibereLuna(p.nume) }))
    .sort((a,b)=>b.totalFinal - a.totalFinal);
  const totalGeneral = lista.reduce((s,p)=>s+p.totalFinal,0);

  const startEdit = (p) => { setEditState(p.nume); setEditValue(minutesToHM(p.totalFinal)); };
  const confirmEdit = (p) => {
    const dorit = oreToMinutes(editValue);
    const delta = dorit - p.totalFinal;
    setEditState(null);
    if (!delta) return;
    const c = { id: uid(), nume: p.nume, luna, minuteAjustare: delta, nota:'Corecție manuală', data: new Date().toISOString().slice(0,10) };
    const next = [...(pontajCorectii || []), c];
    setPontajCorectii(next); persist('pontajCorectii', next);
  };
  const [expandedPerson, setExpandedPerson] = useState(null);
  const zileDetaliu = (nume) => rapoarteLuna
    .filter((r)=>(r.persoane||[]).some((p)=>p.nume===nume))
    .map((r)=>{
      const p = r.persoane.find((pp)=>pp.nume===nume);
      const santierNume = santiere.find((s)=>s.id===r.santierId)?.nume || '—';
      return { data: r.data, santierNume, min: personMinutes(p) };
    })
    .sort((a,b)=> a.data<b.data?-1:1);

  const [lunaNume, anNume] = (() => {
    const LUNI = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    const [y,m] = luna.split('-');
    return [LUNI[Number(m)-1], y];
  })();

  // --- Export legal "Foaie colectivă de prezență", pe șantier, zi cu zi ---
  const ZI_LITERA = ['D','L','M','M','J','V','S'];
  const zileLunaInfo = (lunaStr) => {
    const [y,m] = lunaStr.split('-').map(Number);
    const nrZile = new Date(y, m, 0).getDate();
    const zile = [];
    for (let d=1; d<=nrZile; d++) {
      const dateObj = new Date(y, m-1, d);
      const dow = dateObj.getDay();
      zile.push({ zi:d, litera: ZI_LITERA[dow], weekend: dow===0 || dow===6, dataStr: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` });
    }
    return zile;
  };
  const construiesteGrila = (santierId, lunaStr) => {
    const santier = santiere.find((s)=>s.id===santierId);
    const zile = zileLunaInfo(lunaStr);
    const an = lunaStr.split('-')[0];
    const rapoarteSantierLuna = rapoarte.filter((r)=>r.santierId===santierId && r.data?.startsWith(lunaStr));
    const numeDinEchipa = echipaNormalizata(santier?.echipa).map((e)=>allUsersPontaj.find((u)=>u.id===e.userId)?.nume).filter(Boolean);
    const numeDinRapoarte = [...new Set(rapoarteSantierLuna.flatMap((r)=>(r.persoane||[]).map((p)=>p.nume).filter((n)=>n?.trim())))];
    const numeToate = [...new Set([...numeDinEchipa, ...numeDinRapoarte])];

    const angajati = numeToate.map((nume)=>{
      const anual = calculPontajAnual(nume, an, lunaStr, rapoarte, concedii);
      const celule = zile.map((zi)=>{
        if (zi.weekend) return { start:'X', sfarsit:'X', pauza:'X', ore:'X' };
        const info = anual[zi.dataStr];
        if (info?.status === 'aprobat' || info?.status === 'sarbatoare') return { start:info.cod, sfarsit:info.cod, pauza:info.cod, ore:info.cod };
        const raport = rapoarteSantierLuna.find((r)=>r.data===zi.dataStr);
        const persoana = raport?.persoane?.find((p)=>p.nume===nume);
        if (persoana) {
          const supl = info?.suplimentar > 0 ? ` (+${minutesToHM(info.suplimentar)} supl.)` : '';
          return { start: persoana.oraInceput || '', sfarsit: persoana.oraSfarsit || '', pauza:'1:00', ore: minutesToHM(personMinutes(persoana)) + supl };
        }
        if (info?.status === 'absent') return { start: info.codAuto, sfarsit: info.codAuto, pauza: info.codAuto, ore: info.codAuto };
        return { start:'', sfarsit:'', pauza:'', ore:'' };
      });
      return { nume, celule };
    });
    return { santier, zile, angajati };
  };

  const santierFiltruNume = santiere.find((s)=>s.id===santierFiltru)?.nume;
  const exportPontajExcel = () => {
    const totalZileLibere = lista.reduce((s,p)=>s+(p.zileLibere||0),0);

    const sheetRows = rows.length ? [...rows, { 'Nume':'TOTAL', 'Total ore': minutesToHM(totalGeneral), 'Zile libere': totalZileLibere }] : [{ 'Nume':'', 'Total ore':'', 'Zile libere':'' }];
    const headerRows = [

      [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],

  const exportPontajPDF = () => {

      <div class="page">

  const exportFoaiePrezentaExcel = () => {

    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Foaie pontaj</title><style>

    </style></head><body>${PRINT_TOOLBAR}${pagini}</body></html>`;
    const w = window.open('', '_blank');
    if (!w) { window.alert('Browserul a blocat fereastra nouă. Permite pop-up-urile și încearcă din nou.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.focus();
  };

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>🕐 Pontaj</h2>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>Total de ore și zile libere pe fiecare angajat (din toate șantierele). Pentru detaliu pe un șantier anume, alege-l din listă.</p>
      <div className="flex items-center gap-2 mb-2 flex-wrap">

        {isManager && (
          <select value={santierFiltru} onChange={(e)=>setSantierFiltru(e.target.value)} className="rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>

      {lista.length === 0 ? (

                      <span className="text-sm" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(p.totalFinal)}</span>
                      <button onClick={()=>setExpandedPerson(expandedPerson===p.nume ? null : p.nume)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>{expandedPerson===p.nume ? 'Ascunde' : '👁 Zi cu zi'}</button>
                      {isManager && <button onClick={()=>startEdit(p)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>✎ Edit</button>}

                  )}

                {expandedPerson===p.nume && (
                  <div className="mt-2 pt-2 space-y-1" style={{ borderTop:'1px solid var(--border)' }}>

                    ) : zileDetaliu(p.nume).map((z)=>(
                      <div key={z.data} className="flex items-center justify-between text-xs" style={{ color:'var(--muted)' }}>

                )}
                {p.corectieMin !== 0 && (
                  <div className="mt-1.5 flex items-center justify-between text-xs" style={{ color:'#E9A23B' }}>
                    <span>✎ Corecție manuală</span>
                    <span style={{ fontFamily:"'JetBrains Mono', monospace" }}>{p.corectieMin>0?'+':'−'}{minutesToHM(Math.abs(p.corectieMin))}</span>

            ))}
          </div>
        </>
      )}
    </div>
  );
}

function ConcediiTab({ concedii, setConcedii, persist, currentUser, rapoarte, company }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [form, setForm] = useState(null);
  const isManager = currentUser?.rol === 'Manager';
  const trimiteContabila = (c) => {
    const to = company?.emailContabil || '';
    if (!to) { window.alert('Adaugă întâi e-mailul contabilei în „⚙ Firma mea", apoi revino aici.'); return; }
    const subj = `Cerere concediu — ${c.nume} (${fmtData(c.dataInceput)} – ${fmtData(c.dataSfarsit)})`;
    const body = `Bună ziua,\n\nVă transmit cererea de concediu:\n• Angajat: ${c.nume}\n• Perioada: ${fmtData(c.dataInceput)} – ${fmtData(c.dataSfarsit)}\n• Tip: ${c.tip}\n• Status: ${c.status}\n${c.motiv ? '• Motiv: ' + c.motiv + '\n' : ''}\nDocumentul PDF ștampilat îl atașez separat (l-am salvat cu butonul „📄 PDF").\n\nMulțumesc,\n${company?.nume || ''}`;
    window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  };
  const formRef = useRef(null);
  const formKey = form ? (form.id || 'nou') : 'none';
  useEffect(() => { if (form && formRef.current) { try { formRef.current.scrollIntoView({ behavior:'smooth', block:'center' }); } catch {} } }, [formKey]);
  const listaVizibila = isManager ? concedii : concedii.filter((c)=>c.userId===currentUser?.id);

  const saveCerere = () => {
    if (!form.dataInceput || !form.dataSfarsit) return;
    // Avertizare: se suprapune cu alt concediu APROBAT (al meu sau al unui coleg)?
    const overl = (concedii||[]).filter((c)=> c.status==='Aprobat' && c.id!==form.id && c.dataInceput && c.dataSfarsit && form.dataInceput <= c.dataSfarsit && c.dataInceput <= form.dataSfarsit);
    const eu = overl.filter((c)=> c.userId === currentUser?.id);
    const altii = overl.filter((c)=> c.userId !== currentUser?.id);
    if (eu.length) {
      if (!window.confirm('Ai deja un concediu APROBAT care se suprapune cu această perioadă. Trimiți totuși cererea?')) return;
    } else if (altii.length) {
      const nume = [...new Set(altii.map((c)=>c.nume).filter(Boolean))].join(', ');
      if (!window.confirm(`Atenție: în această perioadă ${altii.length===1?'mai este în concediu':'mai sunt în concediu'}: ${nume}.\nCererea se trimite spre aprobare la birou. Continui?`)) return;
    }
    if (form.id) {
      const next = concedii.map((c)=> c.id===form.id ? { ...c, dataInceput: form.dataInceput, dataSfarsit: form.dataSfarsit, tip: form.tip, motiv: form.motiv || '', status:'Cerut' } : c);
      setConcedii(next); persist('concedii', next);
    } else {
      const c = { id: uid(), userId: currentUser.id, nume: currentUser.nume, dataInceput: form.dataInceput, dataSfarsit: form.dataSfarsit, tip: form.tip, motiv: form.motiv || '', status:'Cerut' };
      const next = [c, ...concedii];
      setConcedii(next); persist('concedii', next);
      notifica('manageri', { title:'Cerere de concediu', body:`${currentUser.nume}: ${form.dataInceput} → ${form.dataSfarsit}.`, tag:'concediu' }, currentUser?.id);
    }
    setForm(null);
  };
  const setStatus = (id, status) => {
    const c = concedii.find((x)=>x.id===id);
    const next = concedii.map((x)=> x.id===id ? {...x, status} : x);
    setConcedii(next); persist('concedii', next);
    if (c && (status==='Aprobat' || status==='Respins' || status==='Refuzat')) {
      const eAprobat = status==='Aprobat';
      notifica(c.userId, { title: eAprobat ? 'Concediu aprobat ✅' : '⛔ Concediu respins', body:`${c.dataInceput} → ${c.dataSfarsit}${eAprobat ? '' : ' — respins'}.`, tag:'concediu-raspuns' }, currentUser?.id);
    }
  };
  const delCerere = (id) => {
    if (!window.confirm('Ștergi definitiv această cerere de concediu?')) return;
    const next = concedii.filter((c)=>c.id!==id);
    setConcedii(next); persist('concedii', next);
  };

  // Rezumat concediu AUTOMAT: zile lucrate sub 8h sau lipsă, calculate din pontaj,
  // consumate din bugetul anual de 21 zile (168h), pana la epuizare (apoi "fara plata").
  const azi = new Date().toISOString().slice(0,10);
  const anCurent = azi.slice(0,4);
  const lunaCurenta = azi.slice(0,7);
  const numeDeUrmarit = isManager
    ? [...new Set(rapoarte.filter((r)=>r.data?.startsWith(anCurent)).flatMap((r)=>(r.persoane||[]).map((p)=>p.nume).filter((n)=>n?.trim())))]
    : [currentUser?.nume].filter(Boolean);
  const rezumatAutomat = numeDeUrmarit.map((nume)=>{
    const anual = calculPontajAnual(nume, anCurent, lunaCurenta, rapoarte, concedii);
    let coFolositMin = 0, faraPlataMin = 0;
    Object.values(anual).forEach((info)=>{
      if (info.status==='partial' || info.status==='absent') {
        if (info.codAuto==='CO') coFolositMin += info.minuteAuto; else faraPlataMin += info.minuteAuto;
      } else if (info.status==='aprobat') {
        if (info.cod==='CO') coFolositMin += 480;
        else if (info.cod==='I') faraPlataMin += 480;
      }
    });
    const coRamasMin = Math.max(0, 21*8*60 - coFolositMin);
    return { nume, coRamasMin, faraPlataMin };
  });

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>🏖 Concedii</h2>
        {!form && <button onClick={()=>setForm({ dataInceput:'', dataSfarsit:'', tip: CONCEDIU_TIPURI[0].label, motiv:'' })} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Cerere nouă</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>{isManager ? 'Toate cererile de concediu.' : 'Cererile tale de concediu.'}</p>

      {form && (
        <div ref={formRef} className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'var(--panel)', border:'1px solid #2E8BD166' }}>
          <div className="text-sm font-semibold mb-1" style={{ color:'var(--text)' }}>{form.id ? '✏️ Editează cererea' : '➕ Cerere nouă'}</div>
          <div className="flex items-center gap-2">
            <RoCalendarPicker value={form.dataInceput} onChange={(v)=>setForm({...form, dataInceput:v})} />
            <span className="text-xs" style={{ color:'var(--muted2)' }}>—</span>
            <RoCalendarPicker value={form.dataSfarsit} onChange={(v)=>setForm({...form, dataSfarsit:v})} />
          </div>
          <select value={form.tip} onChange={(e)=>setForm({...form, tip:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
            {CONCEDIU_TIPURI.map((t)=><option key={t.label} value={t.label} style={{ background:'var(--panel)' }}>{t.label} ({t.cod})</option>)}
          </select>
          <textarea placeholder="Motiv (opțional)" value={form.motiv} onChange={(e)=>setForm({...form, motiv:e.target.value})} rows={2} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={saveCerere} disabled={!form.dataInceput || !form.dataSfarsit} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>{form.id ? 'Salvează modificările' : 'Trimite cererea'}</button>
          </div>
        </div>
      )}

      {rezumatAutomat.length > 0 && (
        <div className="rounded-xl p-3 mb-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>🏖 Concediu de odihnă rămas ({anCurent})</div>
          <div className="space-y-1">
            {rezumatAutomat.map((r)=>(
              <div key={r.nume} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
                <span style={{ color:'var(--text)' }}>{r.nume}</span>
                <span>
                  <span style={{ color:'#4CAF7D' }}>{minutesToZileOre(r.coRamasMin)}</span>
                  {r.faraPlataMin > 0 && <span style={{ color:'var(--muted2)' }}> · </span>}
                  {r.faraPlataMin > 0 && <span style={{ color:'#E05252' }}>Fără plată: {minutesToZileOre(r.faraPlataMin)}</span>}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {listaVizibila.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Nicio cerere de concediu.</div>
      ) : (
        <div className="space-y-2">
          {listaVizibila.map((c)=>(
            <div key={c.id} className="rounded-xl p-3 flex items-center justify-between gap-2" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
              <div className="min-w-0">
                {isManager && <div className="text-sm" style={{ color:'var(--text)' }}>{c.nume}</div>}
                <div className="text-sm" style={{ color: isManager?'var(--muted)':'var(--text)' }}>{fmtData(c.dataInceput)} → {fmtData(c.dataSfarsit)} · {c.tip} ({codPentruTip(c.tip)})</div>
                {c.motiv && <div className="text-xs mt-0.5" style={{ color:'var(--muted2)' }}>{c.motiv}</div>}
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <span className="text-xs" style={{ color: c.status==='Aprobat'?'#4CAF7D':c.status==='Respins'?'#E05252':'#E9A23B' }}>{c.status}</span>
                {(isManager || c.userId===currentUser?.id) && <button onClick={()=>printCerereConcediu(c, company)} className="px-2 py-1 rounded-lg text-xs" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }} title="Exportă cererea în PDF (ștampilată dacă e aprobată)">📄 PDF</button>}
                {isManager && <button onClick={()=>trimiteContabila(c)} className="px-2 py-1 rounded-lg text-xs" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }} title="Trimite pe email la contabilă">📧</button>}
                {isManager && (
                  <>
                    {c.status!=='Aprobat' && <button onClick={()=>setStatus(c.id,'Aprobat')} className="px-2 py-1 rounded-lg text-xs" style={{ color:'#14181C', background:'#4CAF7D' }} title="Aprobă">✓</button>}
                    {c.status!=='Respins' && <button onClick={()=>setStatus(c.id,'Respins')} className="px-2 py-1 rounded-lg text-xs" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid #E0525266' }} title="Respinge">✕</button>}
                    {c.status!=='Cerut' && <button onClick={()=>setStatus(c.id,'Cerut')} className="px-2 py-1 rounded-lg text-xs" style={{ color:'var(--muted)', background:'var(--panel2)' }} title="Repune în așteptare">↩</button>}
                  </>
                )}
                {(isManager || c.userId===currentUser?.id) && (
                  <button onClick={()=>setForm({ id:c.id, dataInceput:c.dataInceput, dataSfarsit:c.dataSfarsit, tip:c.tip, motiv:c.motiv||'' })} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                )}
                <button onClick={()=>delCerere(c.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AchizitiiTab({ achizitii, setAchizitii, persist }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [form, setForm] = useState(null);

  const save = () => {
    if (!form.furnizor.trim() && !form.descriere.trim()) return;
    const next = achizitii.some((x)=>x.id===form.id) ? achizitii.map((x)=>x.id===form.id?form:x) : [form, ...achizitii];
    setAchizitii(next); persist('achizitii', next);
    setForm(null);
  };
  const del = (id) => {
    if (!window.confirm('Ștergi definitiv această achiziție?')) return;
    const next = achizitii.filter((x)=>x.id!==id);
    setAchizitii(next); persist('achizitii', next);
  };
  const setStatus = (id, status) => {
    const next = achizitii.map((x)=> x.id===id ? {...x, status} : x);
    setAchizitii(next); persist('achizitii', next);
  };
  const total = achizitii.reduce((s,a)=>s+(Number(a.suma)||0),0);

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>🛒 Achiziții</h2>
        {!form && <button onClick={()=>setForm({ id: uid(), data: new Date().toISOString().slice(0,10), furnizor:'', descriere:'', suma:0, status: ACHIZITIE_STATUSES[0] })} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Achiziție nouă</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>Achiziții și comenzi ale firmei (unelte, echipamente, servicii etc.).</p>

      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <RoCalendarPicker value={form.data} onChange={(v)=>setForm({...form, data:v})} />
          <input placeholder="Furnizor" value={form.furnizor} onChange={(e)=>setForm({...form, furnizor:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Descriere" value={form.descriere} onChange={(e)=>setForm({...form, descriere:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input type="number" placeholder="Sumă (lei)" value={form.suma} onChange={(e)=>setForm({...form, suma:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={save} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </div>
      )}

      {achizitii.length > 0 && (
        <div className="flex justify-end mb-2 text-sm" style={{ color:'var(--muted)' }}>Total: <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(total)}</span></div>
      )}
      {achizitii.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Nicio achiziție înregistrată.</div>
      ) : (
        <div className="space-y-2">
          {achizitii.map((a)=>(
            <div key={a.id} className="rounded-xl p-3 flex items-center justify-between gap-2" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
              <div className="min-w-0">
                <div className="text-sm" style={{ color:'var(--text)' }}>{a.furnizor}{a.furnizor && a.descriere ? ' — ' : ''}{a.descriere}</div>
                <div className="text-xs mt-0.5" style={{ color:'var(--muted)' }}>{fmtData(a.data)} · {money(a.suma)}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <select value={a.status} onChange={(e)=>setStatus(a.id, e.target.value)} className="text-xs rounded-lg px-2 py-1 outline-none" style={inputStyle}>
                  {ACHIZITIE_STATUSES.map((s)=><option key={s} value={s} style={{ background:'var(--panel)' }}>{s}</option>)}
                </select>
                <button onClick={()=>setForm(a)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                <button onClick={()=>del(a.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function UsersTab({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(null);
  const [formStatus, setFormStatus] = useState({ loading:false, error:'' });

  const loadUsers = async () => {
    setLoading(true);
    try {
      const res = await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) });
      const data = await res.json();
      setUsers(data.users || []);
    } catch { setUsers([]); }
    setLoading(false);
  };
  useEffect(() => { loadUsers(); }, []);

  const delUser = async (id) => {
    if (id === currentUser.id) { window.alert('Nu îți poți șterge propriul cont din listă.'); return; }
    if (!window.confirm('Ștergi definitiv acest cont? Persoana nu va mai putea intra în aplicație.')) return;
    await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', id }) });
    loadUsers();
  };

  const saveUser = async () => {
    if (!form.nume.trim() || !form.username.trim() || (!form.id && !form.password)) {
      setFormStatus({ loading:false, error:'Completează toate câmpurile.' });
      return;
    }
    if (form.cnp && !/^\d{13}$/.test(form.cnp)) {
      setFormStatus({ loading:false, error:'CNP-ul trebuie să aibă exact 13 cifre.' });
      return;
    }
    setFormStatus({ loading:true, error:'' });
    try {
      const payload = form.id
        ? { action:'update', id: form.id, nume: form.nume.trim(), username: form.username.trim(), rol: form.rol, telefon: form.telefon.trim(), cnp: form.cnp.trim(), newPassword: form.password || undefined }
        : { action:'register', nume: form.nume.trim(), username: form.username.trim(), password: form.password, rol: form.rol, telefon: form.telefon.trim(), cnp: form.cnp.trim() };
      const res = await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'A eșuat.');
      setForm(null);
      setFormStatus({ loading:false, error:'' });
      loadUsers();
    } catch (e) {
      setFormStatus({ loading:false, error: e.message || 'A eșuat.' });
    }
  };

  const iconFor = (rol) => ROLES.find((r)=>r.id===rol)?.icon || '👤';
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const ZILE_SCURT = ['','ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Utilizatori</h2>
        {!form && <button onClick={()=>{ setForm({ nume:'', username:'', password:'', rol:'Electrician', telefon:'', cnp:'' }); setFormStatus({ loading:false, error:'' }); }} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Adaugă utilizator</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>Conturile care pot intra în aplicație.</p>

      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
          <input placeholder="Nume complet" value={form.nume} onChange={(e)=>setForm({...form, nume:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Username" value={form.username} onChange={(e)=>setForm({...form, username:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input type="text" placeholder={form.id ? 'Parolă nouă (lasă gol ca să nu o schimbi)' : 'Parolă standard'} value={form.password} onChange={(e)=>setForm({...form, password:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Telefon (opțional)" value={form.telefon} onChange={(e)=>setForm({...form, telefon:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="CNP (opțional, 13 cifre — pentru ziua de naștere)" value={form.cnp} onChange={(e)=>setForm({...form, cnp:e.target.value.replace(/\D/g,'').slice(0,13)})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ ...inputStyle, fontFamily:"'JetBrains Mono', monospace" }} />
          <div className="flex gap-2">
            {ROLES.map((r)=>(
              <button key={r.id} onClick={()=>setForm({...form, rol:r.id})} className="flex-1 text-sm px-3 py-2 rounded-lg font-medium flex items-center justify-center gap-1.5"
                style={{ color: form.rol===r.id?'#14181C':'var(--muted)', background: form.rol===r.id?'#2E8BD1':'var(--panel2)' }}>
                <span>{r.icon}</span> {r.id}
              </button>
            ))}
          </div>
          {formStatus.error && <p className="text-xs" style={{ color:'#E05252' }}>{formStatus.error}</p>}
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Renunță</button>
            <button onClick={saveUser} disabled={formStatus.loading} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-50" style={{ color:'#14181C', background:'#2E8BD1' }}>{formStatus.loading ? '...' : (form.id ? 'Salvează modificările' : 'Creează cont')}</button>
          </div>
        </div>
      )}

      {loading ? (
        <div className="text-sm" style={{ color:'var(--muted)' }}>Se încarcă...</div>
      ) : users.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Niciun utilizator încă.</div>
      ) : (
        <div className="space-y-2">
          {users.map((u)=>{
            const nastere = nasterePeDinCnp(u.cnp);
            return (
            <div key={u.id} className="rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
              <div className="flex items-center gap-2">
                <span>{iconFor(u.rol)}</span>
                <div>
                  <div className="text-sm" style={{ color:'var(--text)' }}>{u.nume}{u.id===currentUser.id && <span className="text-xs ml-1" style={{ color:'var(--muted2)' }}>(tu)</span>}</div>
                  <div className="text-xs" style={{ color:'var(--muted)' }}>@{u.username} · {u.rol}{u.telefon && ` · 📞 ${u.telefon}`}{nastere && ` · 🎂 ${nastere.zi} ${ZILE_SCURT[nastere.luna]}`}</div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={()=>{ setForm({ id:u.id, nume:u.nume, username:u.username, password:'', rol:u.rol, telefon:u.telefon||'', cnp:u.cnp||'' }); setFormStatus({loading:false,error:''}); }} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                <button onClick={()=>delUser(u.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// 📁 Proiecte — „dosarele" firmei, ca pe calculator: folder pe client → folder pe factură → înăuntru devizele + factura.
// 🔔 Memento — aplicația îți aduce aminte: întâlniri, de sunat, de comandat, orice.
// Managerul poate pune memento și pentru un angajat. Fiecare le vede doar pe ale lui.
const MEMENTO_TIPURI = [
  { id:'intalnire', label:'🤝 Întâlnire', culoare:'#2E8BD1' },
  { id:'telefon',   label:'📞 De sunat',  culoare:'#4CAF7D' },
  { id:'comanda',   label:'🛒 De comandat', culoare:'#E9A23B' },
  { id:'plata',     label:'💰 Plată / factură', culoare:'#C08CE0' },
  { id:'altele',    label:'📌 Altceva',   culoare:'#8B93A0' },
];
const memTip = (id) => MEMENTO_TIPURI.find((t)=>t.id===id) || MEMENTO_TIPURI[4];
const memMoment = (m) => `${m.data || ''}T${m.ora || '09:00'}`;
// Împinge un memento care se repetă la următoarea dată.
function memUrmatoarea(m) {
  try {
    const d = new Date(m.data + 'T00:00:00');
    if (m.repeta === 'zilnic') d.setDate(d.getDate() + 1);
    else if (m.repeta === 'saptamanal') d.setDate(d.getDate() + 7);
    else if (m.repeta === 'lunar') d.setMonth(d.getMonth() + 1);
    else return null;
    return d.toISOString().slice(0, 10);
  } catch (_) { return null; }
}

function MementoTab({ mementouri, setMementouri, persist, clients, santiere, currentUser, colegi }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [form, setForm] = useState(null);
