function ActivitateaMeaTab({ santiere, materials, cereriSantier, rapoarte, concedii, cereriAlocare, mementouri, problemeSantier, setTab, setPendingSiteNav, goQA, currentUser }) {
  const goToSite = (santierId, siteView) => {
    // Managerul intră cu totul închis (compact) când merge spre rapoarte; celelalte ținte rămân.
    const v = (currentUser?.rol === 'Manager' && (!siteView || siteView === 'rapoarte')) ? '__closed__' : (siteView || 'rapoarte');
    setPendingSiteNav({ santierId, siteView: v }); setTab('santiere');
  };

  const materialeSubStoc = materials.filter((m)=>!m.arhivat && Number(m.stoc) < Number(m.stocMinim));
  const cereriInAsteptare = cereriSantier.filter((c)=>c.status==='Cerută');
  const cereriInAsteptarePeSantier = Object.values(
    cereriInAsteptare.reduce((acc, c) => {
      if (!acc[c.santierId]) acc[c.santierId] = { santierId: c.santierId, count: 0 };
      acc[c.santierId].count += 1;
      return acc;
    }, {})
  );
  const azi = new Date().toISOString().slice(0,10);
  const oraAcum = new Date().getHours();
  // Alertele de raport pentru ZIUA CURENTĂ apar doar de la 17:01 (nu are sens dimineața).
  const dupa17 = (new Date().getHours()*60 + new Date().getMinutes()) >= (17*60 + 1);
  const concediiInAsteptare = concedii ? concedii.filter((c)=>c.status==='Cerut') : [];
  const alocariInAsteptare = (cereriAlocare||[]).filter((c)=>c.status==='Cerut');
  const santiereActiveFaraRaportAzi = dupa17 ? santiere.filter((s)=> s.status==='Activ' && seCereRaport(s, azi) && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)) : [];

  const isManager = currentUser?.rol === 'Manager';
  // --- Respinse: ce mi-a respins managerul (material sau concediu) — apar cu ROȘU în aplicație ---
  const respinseMele = [
    ...cereriSantier.filter((c)=>c.cerutId===currentUser?.id && c.status==='Respinsă').map((c)=>({ id:'mat-'+c.id, icon:'📦', text:`${c.denumire} — ${c.cantitate} ${c.um}`, data:c.data })),
    ...((concedii||[]).filter((c)=>c.userId===currentUser?.id && (c.status==='Respins' || c.status==='Refuzat')).map((c)=>({ id:'con-'+c.id, icon:'🏖', text:`Concediu ${c.dataInceput} → ${c.dataSfarsit}`, data:c.dataInceput }))),
  ];
  const RESP_KEY = 'respinsVazut_' + (currentUser?.id || '');
  const [respinsVazut, setRespinsVazut] = useState(()=>{ try{ return JSON.parse(localStorage.getItem(RESP_KEY)||'[]'); }catch{ return []; } });
  const marcheazaVazut = (rid) => { const next=[...new Set([...respinsVazut, rid])]; setRespinsVazut(next); try{ localStorage.setItem(RESP_KEY, JSON.stringify(next)); }catch{} };
  const respinseAfisate = respinseMele.filter((r)=>!respinsVazut.includes(r.id));
  // --- „Ce e nou": anunțuri despre funcții noi, fiecare văzut o singură dată (per utilizator, pe telefon) ---
  // Versiune: dacă o cresc (v2, v3...), lista „văzut" a TUTUROR se resetează și toți revăd toate noutățile o dată.
  const NOUT_KEY = 'noutatiVazute_v2_' + (currentUser?.id || '');
  const [noutVazute, setNoutVazute] = useState(()=>{ try{ return JSON.parse(localStorage.getItem(NOUT_KEY)||'[]'); }catch{ return []; } });
  // Fiecare vede doar noutățile care îl privesc: angajatul pe ale lui + cele comune, managerul pe ale lui + cele comune.
  // REGULĂ GENERALĂ: managerul vede TOATE noutățile; angajatul vede DOAR ce-l privește (comune + ale lui).
  const vizibilNoutate = (n) => isManager ? true : (n.aud === 'toti' || n.aud === 'angajat');
  const noutatiNoi = NOUTATI.filter((n)=> vizibilNoutate(n) && !noutVazute.includes(n.id));
  const marcheazaNoutate = (nid) => { const next=[...new Set([...noutVazute, nid])]; setNoutVazute(next); try{ localStorage.setItem(NOUT_KEY, JSON.stringify(next)); }catch{} };
  const marcheazaToateNoutatile = () => { const next=[...new Set([...noutVazute, ...noutatiNoi.map((n)=>n.id)])]; setNoutVazute(next); try{ localStorage.setItem(NOUT_KEY, JSON.stringify(next)); }catch{} };
  const [mementoOpen, setMementoOpen] = useState(false);
  const [santiereOpen, setSantiereOpen] = useState(false);
  const [cereriOpen, setCereriOpen] = useState(false);
  const [colegiUsers, setColegiUsers] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setColegiUsers(data.users || [])).catch(()=>{});
  }, []);

  // --- Felicitări (ziua de naștere din CNP + sărbători) — aduse din Dashboard, pentru angajați ---
  const ZILE_FELICITARE = {
    '2026-01-01': '🎉 La mulți ani cu ocazia Anului Nou! Din partea Smart Electroconect, vă dorim un an plin de realizări!',
    '2026-04-12': '🐣 Hristos a Înviat! Paște fericit, din partea Smart Electroconect!',
    '2026-12-25': '🎄 Crăciun fericit! Din partea Smart Electroconect, vă dorim sărbători pline de liniște și bucurie!',
  };
  const aziDate = new Date();
  const mesajSarbatoare = ZILE_FELICITARE[aziDate.toISOString().slice(0,10)];
  const sarbatoriiZi = colegiUsers.filter((u)=>{ const n = nasterePeDinCnp(u.cnp); return n && n.zi===aziDate.getDate() && n.luna===aziDate.getMonth()+1; });

  // --- Date specifice Electricianului: șantierele lui, memento raport, materiale cerute acolo ---
  const santiereMele = santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id));
  const santiereFaraRaportAzi = dupa17 ? santiereMele.filter((s)=> s.status==='Activ' && seCereRaport(s, azi) && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)) : [];
  const idSantiereMele = new Set(santiereMele.map((s)=>s.id));
  const cereriLaSantiereleMele = cereriSantier.filter((c)=>idSantiereMele.has(c.santierId)).slice().reverse().slice(0,6);

  const nimicDeFacut = isManager
    ? materialeSubStoc.length === 0 && cereriInAsteptarePeSantier.length === 0 && santiereActiveFaraRaportAzi.length === 0 && concediiInAsteptare.length === 0 && alocariInAsteptare.length === 0
    : santiereFaraRaportAzi.length === 0 && santiereMele.length === 0 && cereriLaSantiereleMele.length === 0;

  // În „Activitatea mea" apar DOAR întrebările de pe ȘANTIER, celor implicați + managerului.
  // Angajatul: doar întrebările FĂRĂ niciun răspuns încă (odată ce a răspuns cineva, dispare indicatorul).
  // Managerul: cele fără răspuns confirmat (le are de verificat).
  const qaSite = (problemeSantier||[]).filter((p)=>p.santierId);
  const qaRelevante = (isManager
    ? qaSite.filter((p)=>!raspunsCorectQA(p))
    : qaSite.filter((p)=> raspunsuriQA(p).length===0 && (p.creatId===currentUser?.id || santiereMele.some((s)=>s.id===p.santierId)))
  ).slice().reverse();

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>⚡ Activitatea mea</h2>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>Tot ce ai de rezolvat sau de urmărit, într-un singur loc.</p>

      {!isManager && (sarbatoriiZi.length > 0 || mesajSarbatoare) && (
        <div className="mb-5 rounded-xl px-4 py-3" style={{ background: sarbatoriiZi.length > 0 ? 'linear-gradient(135deg, #E9A23B, #E05252)' : 'linear-gradient(135deg, #2E8BD1, #4CAF7D)' }}>
          {sarbatoriiZi.length > 0 ? (
            <>
              <div style={{ fontSize:15, fontWeight:700, color:'#fff', lineHeight:1.3 }}>🎂 La mulți ani, {sarbatoriiZi.map((u)=>u.nume).join(' și ')}!</div>
              <div style={{ fontSize:11, color:'#fff', opacity:0.9, marginTop:2 }}>Din partea echipei Smart Electroconect!</div>
            </>
          ) : (
            <div style={{ fontSize:13, fontWeight:600, color:'#fff', lineHeight:1.3 }}>{mesajSarbatoare}</div>
          )}
        </div>
      )}

      {noutatiNoi.length > 0 && (
        <div className="mb-6 rounded-xl p-4" style={{ background:'#4CAF7D14', border:'1px solid #4CAF7D66', borderLeft:'4px solid #4CAF7D' }}>
          <div className="flex items-center justify-between mb-2 gap-2">
            <span style={{ fontSize:14, fontWeight:700, color:'#4CAF7D' }}>🚀 Noutăți · ultimul upgrade ({noutatiNoi.length})</span>
            {noutatiNoi.length > 1 && <button onClick={marcheazaToateNoutatile} className="shrink-0 text-[11px] px-2 py-1 rounded" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>Am văzut tot</button>}
          </div>
          <div className="space-y-2">
            {noutatiNoi.map((n)=>(
              <div key={n.id} className="rounded-lg px-3 py-2.5" style={{ background:'var(--panel)', border:'1px solid #4CAF7D33' }}>
                <div className="flex items-center justify-between gap-2 mb-1">
                  <span className="text-sm font-semibold" style={{ color:'var(--text)' }}>{n.titlu}</span>
                  {n.data ? <span className="shrink-0 text-[10px]" style={{ color:'var(--muted2)' }}>{n.data}</span> : null}
                </div>
                <div className="text-xs mb-2" style={{ color:'var(--muted)', lineHeight:1.6 }}>{n.text}</div>
                <button onClick={()=>marcheazaNoutate(n.id)} className="text-[11px] px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>Am înțeles ✓</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {isManager && (()=>{
        // Rapoartele primite azi — le vezi aici chiar dacă notificarea nu a ajuns pe telefon.
        const aziR = new Date().toISOString().slice(0,10);
        const rapAzi = (rapoarte||[]).filter((r)=>r.data === aziR);
        if (rapAzi.length === 0) return null;
        const VAZ_KEY = 'rapVazute_' + (currentUser?.id || '') + '_' + aziR;
        let vazute = [];
        try { vazute = JSON.parse(localStorage.getItem(VAZ_KEY) || '[]'); } catch (_) {}
        const noi = rapAzi.filter((r)=>!vazute.includes(r.id));
        return (
          <div className="mb-6 rounded-xl p-4" style={{ background:'#4CAF7D14', border:'1px solid #4CAF7D66', borderLeft:'4px solid #4CAF7D' }}>
            <div className="flex items-center justify-between mb-2 gap-2">
              <span style={{ fontSize:14, fontWeight:700, color:'#4CAF7D' }}>📋 Rapoarte primite azi ({rapAzi.length}){noi.length ? ` · ${noi.length} noi` : ''}</span>
              {noi.length > 0 && <button onClick={()=>{ try { localStorage.setItem(VAZ_KEY, JSON.stringify(rapAzi.map((r)=>r.id))); } catch(_){} setTab('activitate'); }} className="shrink-0 text-[11px] px-2 py-1 rounded" style={{ color:'var(--muted)', background:'var(--panel2)', border:'1px solid var(--border)' }}>Am văzut</button>}
            </div>
            <div className="space-y-1.5">
              {rapAzi.slice(0,6).map((r)=>{
                const s = santiere.find((x)=>x.id===r.santierId);
                const cine = (r.persoane||[]).filter((p)=>p.nume && String(p.nume).trim()).map((p)=>p.nume).join(', ');
                const ore = (r.persoane||[]).reduce((a,p)=>a+personMinutes(p),0);
                const eNou = !vazute.includes(r.id);
                return (
                  <button key={r.id} onClick={()=>goToSite(r.santierId, 'rapoarte')} className="w-full text-left flex items-center justify-between gap-2 text-xs px-2.5 py-2 rounded-lg" style={{ background:'var(--panel)', border:'1px solid #4CAF7D33' }}>
                    <span className="min-w-0 truncate" style={{ color:'var(--text)' }}>{eNou && '🟢 '}🏗 {s?.nume || 'Șantier'} <span style={{ color:'var(--muted2)' }}>· {cine || 'fără persoane'}</span></span>
                    <span className="shrink-0" style={{ color:'#4CAF7D', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(ore)} h</span>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}

      {(()=>{

      {isManager && (() => {

          .filter((s)=>s.status==='Activ' || s.status==='Pauză')

            const activ = s.status === 'Activ' && eu?.status !== 'pauza';
            return { s, suntInPauza, activ, echipaS, eu };

          .filter((x)=> x.activ || x.suntInPauza);

                    <div className="text-xs mt-2" style={{ color:'var(--muted)' }}>
                      {s.adresa && (
                        <a href={mapsUrl(s)} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()} className="inline-flex items-center gap-1" style={{ color:'#2E8BD1' }}>📍 {s.adresa}</a>

        );
      })()}

      {!isManager && (
        <div className="mb-6">
          <button onClick={()=>setSantiereOpen(!santiereOpen)} className="w-full flex items-center justify-between rounded-xl px-4 py-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>

            <span className="text-xs" style={{ color:'var(--muted)' }}>{santiereOpen ? 'Ascunde' : 'Arată tot'}</span>
          </button>
          {santiereOpen && (
            santiereMele.length === 0 ? (
              <p className="text-sm mt-2" style={{ color:'var(--muted2)' }}>Nu ești asignat la niciun șantier încă.</p>
            ) : (
              <div className="space-y-2 mt-2">
                {santiereMele.map((s)=>(
                  <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
                    <span className="text-sm" style={{ color:'var(--text)' }}>{s.nume} <span className="text-xs ml-2" style={{ color: s.status==='Activ'?'#4CAF7D':s.status==='Pauză'?'#E9A23B':'var(--muted)' }}>{s.status}</span></span>
                    <span style={{ color:'var(--muted2)' }}>→</span>
                  </button>

              </div>

      {!isManager && cereriLaSantiereleMele.length > 0 && (
        <div className="mb-6">
          <button onClick={()=>setCereriOpen(!cereriOpen)} className="w-full flex items-center justify-between rounded-xl px-4 py-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
            <span className="text-sm font-medium" style={{ color:'var(--text)' }}>📥 Materiale cerute ({cereriLaSantiereleMele.length})</span>
            <span className="text-xs" style={{ color:'var(--muted)' }}>{cereriOpen ? 'Ascunde' : 'Arată tot'}</span>
          </button>
          {cereriOpen && (
            <div className="space-y-2 mt-2">
              {cereriLaSantiereleMele.map((c)=>{
                const santierNume = santiere.find((s)=>s.id===c.santierId)?.nume || '—';

                  <button key={c.id} onClick={()=>goToSite(c.santierId, 'materiale')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>

      {isManager && (materialeSubStoc.length > 0 || cereriInAsteptarePeSantier.length > 0 || santiereActiveFaraRaportAzi.length > 0 || concediiInAsteptare.length > 0 || alocariInAsteptare.length > 0) && (

                <span style={{ color:'#E05252' }}>→</span>
              </button>

          )}

          {(cereriInAsteptarePeSantier.length > 0 || santiereActiveFaraRaportAzi.length > 0) && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E05252' }}>🏗 Șantiere</div>
              <div className="space-y-1.5">
                {cereriInAsteptarePeSantier.map((g)=>{
                  const santierNume = santiere.find((s)=>s.id===g.santierId)?.nume || '—';
                  return (
                    <button key={g.santierId} onClick={()=>goToSite(g.santierId, 'materiale')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid #E0525266' }}>

                {santiereActiveFaraRaportAzi.map((s)=>(
                  <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'var(--panel)', border:'1px solid #E0525266' }}>
                    <span className="text-sm" style={{ color:'var(--text)' }}>Niciun raport trimis azi — {s.nume}</span>
                    <span style={{ color:'#E05252' }}>→</span>

          {concediiInAsteptare.length > 0 && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E05252' }}>🏖 Concedii</div>

                <span style={{ color:'#E05252' }}>→</span>
              </button>

          {alocariInAsteptare.length > 0 && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E9A23B' }}>🏗 Alocări pe șantier</div>

function CompanyTab({ company, setCompany, persist }) {
  const [form, setForm] = useState(company);
  useEffect(()=>setForm(company), [company]);
  const save = () => { setCompany(form); persist('company', form); };
  const fields = [['nume','Denumire firmă'],['cui','CUI'],['regCom','Nr. Registrul Comerțului'],['adresa','Adresă sediu'],['iban','IBAN'],['email','E-mail'],['telefon','Telefon'],['administrator','Administrator (nume)'],['emailContabil','E-mail contabilă (pt. concedii/adeverințe)'],['adaosMaterial','Adaos la materiale % (implicit 15)']];
  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Firma mea</h2>
      <p className="text-xs mb-4" style={{ color:'var(--muted)' }}>Aceste date apar ca emitent pe fiecare document exportat în PDF.</p>
      <div className="rounded-xl p-4 space-y-2 max-w-md" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        {fields.map(([f,label])=>(
          <input key={f} placeholder={label} value={form[f]||''} onChange={(e)=>setForm({...form, [f]:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
        ))}
        <div className="flex justify-end pt-2">
          <button onClick={save} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
        </div>
      </div>
    </div>
  );
}

// --- Cerere de concediu: document A4 pentru contabilitate, cu ștampila și semnătura firmei (aceeași ca pe devize/oferte) ---
function printCerereConcediu(c, company) {
  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const azi = fmtData(new Date().toISOString().slice(0,10));
  // Numărăm zilele lucrătoare (Luni–Vineri) din interval, inclusiv, și aflăm ziua reluării activității.
  let zile = 0, reluare = '';
  try {
    let d = new Date(c.dataInceput + 'T00:00:00'); const end = new Date(c.dataSfarsit + 'T00:00:00');
    while (d <= end) { const wd = d.getDay(); if (wd !== 0 && wd !== 6) zile++; d.setDate(d.getDate() + 1); }
    let r = new Date(c.dataSfarsit + 'T00:00:00'); do { r.setDate(r.getDate() + 1); } while (r.getDay() === 0 || r.getDay() === 6);
    reluare = fmtData(r.toISOString().slice(0, 10));
  } catch (_) {}
  const eAprobat = c.status === 'Aprobat';
  const firma = company?.nume || '(numele firmei — completează în „Firma mea")';
  const admin = company?.administrator || '';
  const tip = c.tip || 'Concediu de odihnă';

  const antet = [
    company?.cui ? 'CUI: ' + esc(company.cui) : '',
    company?.regCom ? 'Reg. com.: ' + esc(company.regCom) : '',
    company?.adresa ? esc(company.adresa) : '',
    company?.telefon ? 'Tel: ' + esc(company.telefon) : '',
  ].filter(Boolean).join(' · ');

  const aprobatBloc = eAprobat ? `
    <div style="margin-top:16mm; padding-top:6mm; border-top:1px solid #ccc;">

      Această cerere NU este încă aprobată, de aceea nu poartă ștampila. Aprob-o în aplicație, apoi export-o din nou ca să apară ștampila și semnătura.
    </div>`;

  const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cerere concediu — ${esc(c.nume || '')}</title><style>${PRINT_CSS}</style></head><body>${PRINT_TOOLBAR}
    <div class="print-page">

        ${c.motiv ? `<p>Motivul solicitării: ${esc(c.motiv)}.</p>` : ''}

    .filter((r)=> (r.persoane || []).some((p)=> p.nume && String(p.nume).trim()))

  let totalOreGeneral = 0;
  // Pe fiecare zi grupăm oamenii după numărul de ore lucrate: dacă 5 au făcut 8h și 1 a făcut 6h,
  // ies două rânduri curate (5×8 și 1×6), cu total exact — nu o medie ciudată.
  const rowsArr = [];
  let idx = 0;
  zile.forEach((r)=>{
    const pv = r.persoane.filter((p)=> p.nume && String(p.nume).trim());

function devizMatPageHtml({ santier, company, rapoarte, materialeLista, materials, materialClient, realExecutat, dinLucrari, nr, data }) {
  const tva = 21;
  const norm = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const grup = {};
  if (dinLucrari) {
    // La șantierele cu structură, cantitățile vin din „Lucrări pe apartamente":
    // luăm doar rândurile care se potrivesc cu lista de materiale/operațiuni importată.
    (rapoarte || []).forEach((r)=>{
      (r.lucrariApartamente || []).forEach((l)=>{
        lucrariDinRand(l).forEach((w)=>{
          const den = String(w.denumire||'').trim(); if (!den) return;
          const fromList = (materialeLista||[]).find((x)=>norm(x.denumire)===norm(den));
          if (!fromList) return;
          const key = norm(den)+'|'+norm(w.um||fromList.um);
          if (!grup[key]) grup[key] = { denumire:den, um:w.um||fromList.um||'buc', cantitate:0, pret:0 };
          grup[key].cantitate += Number(w.cantitate)||0;
        });
      });
    });
  } else {
    (rapoarte || []).forEach((r)=>{
      (r.materialeFolosite || []).forEach((m)=>{
        if (!m.denumire || !String(m.denumire).trim()) return;
        const key = norm(m.denumire)+'|'+norm(m.um);
        if (!grup[key]) grup[key] = { denumire:String(m.denumire).trim(), um:m.um||'buc', cantitate:0, pret:0 };
        grup[key].cantitate += Number(m.cantitate)||0;
        if (materialClient) { const p = Number(m.pret)||0; if (p>0) grup[key].pret = p; }
      });
    });

  if (!materialClient) {
    Object.values(grup).forEach((g)=>{
      const fromList = (materialeLista||[]).find((x)=>norm(x.denumire)===norm(g.denumire));
      const fromCentral = (materials||[]).find((x)=>norm(x.denumire)===norm(g.denumire) && !x.arhivat);

  const dataDot = String(data).replace(/\//g,'.');
  const execCuiReg = [company?.cui ? `C.U.I ${esc(company.cui)}` : '', company?.regCom ? esc(company.regCom) : ''].filter(Boolean).join('&nbsp;&nbsp;&nbsp;&nbsp;');
  return `<div class="print-page">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6mm; margin-bottom:2mm;">
      <div style="flex:1; font-size:10px; line-height:1.55;">
        <div style="font-weight:700;">EXECUTANT:</div>
        <div style="font-weight:700;">${esc(company?.nume) || '(completează datele firmei în „Firma mea")'}</div>
        ${company?.adresa?`<div>${esc(company.adresa)}</div>`:''}
        ${execCuiReg?`<div>${execCuiReg}</div>`:''}
        ${company?.email?`<div>e-mail: ${esc(company.email)}</div>`:''}
        ${company?.telefon?`<div>Tel: ${esc(company.telefon)}</div>`:''}
      </div>
      <div style="flex:0 0 auto; text-align:center; padding:0 2mm;">
        <img src="${window.location.origin}/logo.png" alt="Logo" style="height:80px; width:auto;" />
      </div>
      <div style="flex:1; font-size:10px; line-height:1.55; text-align:right;">
        <div style="font-weight:700;">BENEFICIAR:</div>
        <div style="font-weight:700;">${esc(santier?.benefNume) || '—'}</div>
        ${benefLines}
      </div>
    </div>
    <div style="text-align:center; margin:5mm 0 2mm;">
      <div style="font-weight:700; font-size:15px;">${realExecutat ? 'Deviz real executat' : 'Deviz materiale'}</div>
      <div style="font-size:12px; margin-top:1mm;">Nr. ${esc(nr)}/${esc(dataDot)}</div>
      ${santier?.contract?`<div style="font-size:11px; margin-top:1mm;">Contract Nr. ${esc(santier.contract)}</div>`:''}${santier?.actAditional?`<div style="font-size:11px; margin-top:1mm;">Act adițional Nr. ${esc(santier.actAditional)}</div>`:''}
    </div>
    <div style="font-size:11px; line-height:1.9; margin:4mm 0; padding-bottom:3mm; border-bottom:1px solid #ccc;">
      <div><b>Obiectiv:</b> ${esc(santier?.obiectiv || '')}</div>
      <div><b>Adresa:</b> ${esc(santier?.adresa || '')}</div>
      <div><b>Lucrare:</b> ${esc(santier?.lucrare || 'Instalații electrice interioare')}</div>

    setCurrentUser(data.user);

  // Deblocare cu amprentă/FaceID: restaurează sesiunea salvată local, fără parolă.
  const handleBioUnlock = async () => {
    const { user, token } = await bioDeblocheaza();
    setAuthToken(token);

  };
  const logout = (motiv) => {
    setAuthToken(null);

  };
  // Securitate: după 5 minute fără activitate, cerem autentificarea din nou.

  useEffect(() => {

    const eventList = ['mousemove','mousedown','keydown','touchstart','touchmove','scroll','click'];
    eventList.forEach((e)=>window.addEventListener(e, reset, { capture:true, passive:true }));

  // --- "Vezi ca" — doar Managerul real poate testa ce vede fiecare rol/utilizator, fără să se deloge. ---

  // Perioadă de test: colegii (non-Manager) pot FOLOSI doar Dashboard, Activitatea mea, Șantiere și Profil.

  useEffect(() => {

    })();
  }, [dateIncarcate, currentUser, noutatiAnuntate]);

  // --- Offline: service worker + indicator „fără net / se sincronizează" ---
  const [online, setOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
  const [pendingCount, setPendingCount] = useState((typeof getPending === 'function') ? getPending().length : 0);
  useEffect(() => {
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    // Când aplicația e adusă în față, reîmprospătăm datele: bulina de pe iconiță reflectă
    // exact ce mai ai de rezolvat (scade doar când rezolvi, nu doar pentru că ai deschis-o).
    const onVis = () => { if (document.visibilityState === 'visible' && navigator.onLine) { loadAllData(false); pushQueueFlush(); } };
    document.addEventListener('visibilitychange', onVis);
    const upOnline = () => { setOnline(navigator.onLine); if (navigator.onLine) { syncQueue(); pushQueueFlush(); loadAllData(false); } };
    const upPending = () => setPendingCount(getPending().length);
    window.addEventListener('online', upOnline);
    window.addEventListener('offline', upOnline);
    window.addEventListener('offline-queue-change', upPending);
    const iv = setInterval(upPending, 4000);
    return () => { window.removeEventListener('online', upOnline); window.removeEventListener('offline', upOnline); window.removeEventListener('offline-queue-change', upPending); document.removeEventListener('visibilitychange', onVis); clearInterval(iv); };
  }, []);

  // --- Lista colegilor, o dată la logare (o folosesc memento-urile date altcuiva) ---
  useEffect(() => {

      .then((r)=>r.json()).then((d)=>setTotiUtilizatorii(d.users || [])).catch(()=>{});
  }, [currentUser]);

  // --- MEMENTO: când vine ora, primești notificare pe telefon (verific din minut în minut cât e aplicația deschisă) ---
  useEffect(() => {
    if (!currentUser) return;
    const verifica = () => {
      const acumM = new Date();
      const scadente = (mementouri||[]).filter((m)=> !m.gata && !m.anuntat
        && (m.pentruUserId ? m.pentruUserId === currentUser.id : m.creatId === currentUser.id)
        && new Date(`${m.data}T${m.ora || '09:00'}`) <= acumM);
      if (!scadente.length) return;
      scadente.forEach((m)=>{
        notifica(currentUser.id, { title:'🔔 ' + (memTip(m.tip).label.replace(/^\S+\s/, '') || 'Memento'), body: `${m.titlu}${m.detalii ? ' — ' + String(m.detalii).slice(0,80) : ''}`, tag:'memento-'+m.id });

      const ids = new Set(scadente.map((m)=>m.id));

  // --- Facturi ajunse la scadență → trec automat pe „Restantă" și managerul e anunțat (o dată pe zi). ---

    const aziF = new Date().toISOString().slice(0,10);
    const trecute = invoices.filter((i)=> i.status === 'De încasat' && i.scadenta && i.scadenta < aziF);
    if (!trecute.length) return;
    const next = invoices.map((i)=> (i.status === 'De încasat' && i.scadenta && i.scadenta < aziF) ? { ...i, status:'Restantă' } : i);

  }, [dateIncarcate, currentUser, invoices]);

  // --- Bulină cu cifre pe iconiță (ca la WhatsApp): numărul de lucruri de rezolvat.

  const badgeCount = useMemo(() => {
    const u = currentUser;
    if (!u) return 0;
    const aziB = new Date().toISOString().slice(0,10);
    const dupa17B = (new Date().getHours()*60 + new Date().getMinutes()) >= (17*60 + 1); // raportul zilei curente „contează" doar de la 17:01
    let n = 0;

      n += cereriSantier.filter((c)=>c.status==='Cerută').length;                 // materiale cerute, de aprobat/respins
      n += (concedii||[]).filter((c)=>c.status==='Cerut').length;                 // cereri de concediu, de aprobat/refuzat

  // --- Memento „raport netrimis" (push seara, o dată pe zi). Manager: cine n-a trimis.

  useEffect(() => {

    const acum = new Date();
    const zi = acum.getDay();
    if (zi === 0 || zi === 6) return;            // sâmbătă/duminică — fără memento

      if (localStorage.getItem(flag)) return;

      planseSantier: (v)=>setPlanseSantier(v ?? []),
      normativPdf: (v)=>setNormativPdf(v ?? null),
      normativIndexFile: (v)=>setNormativIndexFile(v ?? null),
      noutatiAnuntate: (v)=>setNoutatiAnuntate(v ?? []),
      mediaSantier: (v)=>setMediaSantier(v ?? []),
      structuraSantier: (v)=>setStructuraSantier(v ?? []),
      pozitiiSantier: (v)=>setPozitiiSantier(v ?? []),
      materialeListaSantier: (v)=>setMaterialeListaSantier(v ?? []),
      concedii: (v)=>setConcedii(v ?? []),
      achizitii: (v)=>setAchizitii(v ?? []),
      pontajCorectii: (v)=>setPontajCorectii(v ?? []),
    };
    channel.bind('data-changed', async (payload) => {
      const setter = setters[payload?.key];
      if (!setter) return;
      const nou = await loadKey(payload.key, payload.key === 'company' ? {} : []);
      // AL DOILEA STRAT DE SIGURANȚĂ (mai ales pentru manager): dacă apar înregistrări noi făcute de
      // altcineva, telefonul sună singur — chiar dacă notificarea trimisă de telefonul lor s-a pierdut.
      try {
        if (Array.isArray(nou) && ANUNTA_LA_SCHIMBARE[payload.key]) {
          const vechi = cacheGet('sem_' + payload.key);
          const idVechi = new Set(Array.isArray(vechi) ? vechi : []);
          const idNoi = nou.map((x)=>x && x.id).filter(Boolean);
          const adaugate = idNoi.filter((id)=>!idVechi.has(id));
          cacheSet('sem_' + payload.key, idNoi);
          const eManager = currentUser && currentUser.rol === 'Manager';
          if (adaugate.length && idVechi.size && eManager) {
            const info = ANUNTA_LA_SCHIMBARE[payload.key];
            const reg = await navigator.serviceWorker.ready;
            reg.showNotification(info.titlu, {
              body: adaugate.length === 1 ? info.unul : `${adaugate.length} ${info.multe}`,
              icon: '/logo.png', badge: '/logo.png', tag: 'sem-' + payload.key, renotify: true,
              vibrate: [80, 40, 80], data: { url: '/' },
            });
          }
        }
      } catch (_) {}
      setter(nou);
    });
    return () => { pusherClient.unsubscribe('firma-updates'); pusherClient.disconnect(); };
  }, [currentUser]);

  const persist = async (key, value, isRetry) => {
    try {
      await saveKey(key, value);
      setError(null);
    } catch (e) {
      if (!isRetry) { await new Promise(r=>setTimeout(r,800)); return persist(key, value, true); }
      setError(`Salvarea pentru „${key}" a eșuat: ${e.message}`);
    }
  };

  // Proiect nou creat din tab-ul „📁 Proiecte" — e un șantier obișnuit, apare imediat și la Șantiere.
  const creeazaProiect = ({ nume, adresa, clientId }) => {
    const den = String(nume||'').trim();
    if (!den) return null;
    const azi2 = new Date().toISOString().slice(0,10);
    const maine2 = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
    const cl = (clients||[]).find((c)=>c.id===clientId);
    const s = {
      id: uid(), nume: den, adresa: String(adresa||'').trim(), status:'Activ', echipa:[],
      modFacturare:'orar', tipFacturare:'orar', tarifOrar:75, materialeSursa:'noastre',
      benefClientId: clientId || '', benefNume: cl?.nume || '', benefInfo: cl?.adresa || '', benefSemnatar: cl?.administrator || '',
      contract:'', obiectiv:'', lucrare:'Instalații electrice interioare', descriereLucrari:'',
      dataCreare: azi2, raportDeLa: maine2,
    };
    const next = [...santiere, s];
    setSantiere(next); persist('santiere', next);
    return s.id;
  };

  const printOne = (kind) => (doc) => openPrintWindow([{ doc, kind, client: clients.find((c)=>c.id===doc.clientId), company }]);
  const sendInvoiceToSmartBill = async (invoice) => {
    const client = clients.find((c)=>c.id===invoice.clientId);
    const res = await authFetch('/api/smartbill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ invoice, client }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Trimiterea a eșuat.');
    return data;
  };
  const printAll = (docs, kind) => openPrintWindow(docs.map((doc)=>({ doc, kind, client: clients.find((c)=>c.id===doc.clientId), company })));
  const printDevizOne = (doc) => openPrintWindow([{ doc, isDeviz: true, client: clients.find((c)=>c.id===doc.clientId), company }]);
  const printDevizAll = (docs) => openPrintWindow(docs.map((doc)=>({ doc, isDeviz: true, client: clients.find((c)=>c.id===doc.clientId), company })));

  // Scade automat materialele (după denumire) din stoc, când un deviz e emis sau o factură e creată.
  const deductStock = (items, refLabel) => {
    const unmatched = [];
    let nextMaterials = materials;
    const moves = [];
    (items || []).forEach((it) => {
      const idx = nextMaterials.findIndex((m) => m.denumire === it.denumire && !m.arhivat);
      const cant = Number(it.cantitate) || 0;
      if (idx === -1 || !cant) { if (idx === -1) unmatched.push(it.denumire); return; }
      nextMaterials = nextMaterials.map((m, i) => i === idx ? { ...m, stoc: (Number(m.stoc) || 0) - cant } : m);
      moves.push({ id: uid(), materialId: nextMaterials[idx].id, tip: 'iesire', cantitate: cant, nota: refLabel, data: new Date().toISOString().slice(0,10) });
    });
    if (moves.length > 0) {
      setMaterials(nextMaterials);
      persist('materials', nextMaterials);
      const nextMoves = [...moves, ...stockMoves];
      setStockMoves(nextMoves);
      persist('stockMoves', nextMoves);
    }
    return unmatched;
  };

  // Reface stocul (mișcare de intrare) pentru articole scăzute anterior — la ștergere, revenire la ciornă, sau editare.
  const reverseStock = (items, refLabel) => {
    let nextMaterials = materials;
    const moves = [];
    (items || []).forEach((it) => {
      const idx = nextMaterials.findIndex((m) => m.denumire === it.denumire && !m.arhivat);
      const cant = Number(it.cantitate) || 0;
      if (idx === -1 || !cant) return;
      nextMaterials = nextMaterials.map((m, i) => i === idx ? { ...m, stoc: (Number(m.stoc) || 0) + cant } : m);
      moves.push({ id: uid(), materialId: nextMaterials[idx].id, tip: 'intrare', cantitate: cant, nota: refLabel, data: new Date().toISOString().slice(0,10) });
    });
    if (moves.length > 0) {
      setMaterials(nextMaterials);
      persist('materials', nextMaterials);
      const nextMoves = [...moves, ...stockMoves];
      setStockMoves(nextMoves);
      persist('stockMoves', nextMoves);
    }
  };

  const nextNumber = (prefix, list) => {
    const year = new Date().getFullYear();
    const n = list.filter((d)=>d.numar?.includes(`${prefix}-${year}`)).length + 1;
    return `${prefix}-${year}-${String(n).padStart(3,'0')}`;
  };

  const saveOffer = (o) => {
    const withNumber = { ...o, numar: o.numar || nextNumber('OF', offers) };
    const next = offers.some((x)=>x.id===o.id) ? offers.map((x)=>x.id===o.id?withNumber:x) : [...offers, withNumber];
    setOffers(next); persist('offers', next); setOfferForm(null);
  };
  const deleteOffer = (id) => { if (!window.confirm('Ștergi definitiv această ofertă?')) return; const next = offers.filter((o)=>o.id!==id); setOffers(next); persist('offers', next); };
  const offerStatus = (id, status) => {
    const next = offers.map((o)=>o.id===id?{...o,status}:o);
    setOffers(next); persist('offers', next);
    if (status === 'Acceptată') {
      const offer = next.find((o)=>o.id===id);
      setTab('devize');
      setDevizPrefill({ clientId: offer.clientId, items: offer.items.map((it)=>({...it, id: uid()})), tva: offer.tva, offerId: offer.id });
    }
  };

  const exportConsumToDeviz = (items, santierNume) => {
    const itemsWithPrice = items.map((it) => {
      const mat = materials.find((m)=>m.denumire === it.denumire && !m.arhivat);
      return { id: uid(), denumire: it.denumire, um: it.um, cantitate: it.cantitate, pretUnitar: mat?.pret || 0, adaos: 0 };
    });
    setTab('devize');
    setDevizPrefill({ clientId: clients[0]?.id || '', items: itemsWithPrice, tva: 21, lucrare: santierNume ? `Materiale consumate — ${santierNume}` : '' });
  };

  // Aduce "materialele folosite" notate la rapoartele zilnice ale unui șantier într-un Deviz nou.
  // Cele proprii primesc preț din Gestiune (și se vor scădea automat la emiterea devizului).
  // Cele ale clientului intră doar informativ, fără să afecteze stocul — prețul se completează ulterior.
  const exportMaterialeFolositeToDeviz = (rapoarteSantier, santierNume) => {
    const toate = rapoarteSantier.flatMap((r)=>r.materialeFolosite || []);
    const grupate = {};
    toate.forEach((m)=>{
      if (!m.denumire?.trim()) return;
      const cheie = `${m.sursa}::${m.denumire}::${m.um}`;
      if (!grupate[cheie]) grupate[cheie] = { denumire: m.denumire, um: m.um, sursa: m.sursa, cantitate: 0 };
      grupate[cheie].cantitate += Number(m.cantitate) || 0;
    });
    const items = Object.values(grupate).map((m) => {
      if (m.sursa === 'client') {
        return { id: uid(), denumire: `(Client) ${m.denumire}`, um: m.um, cantitate: m.cantitate, pretUnitar: 0, adaos: 0 };
      }
      const mat = materials.find((mm)=>mm.denumire === m.denumire && !mm.arhivat);
      return { id: uid(), denumire: m.denumire, um: m.um, cantitate: m.cantitate, pretUnitar: mat?.pret || 0, adaos: 0 };
    });
    setTab('devize');
    setDevizPrefill({ clientId: clients[0]?.id || '', items, tva: 21, lucrare: santierNume ? `Materiale folosite — ${santierNume}` : '' });
  };

  // La o cerere nouă de materiale dintr-un șantier: creează materialul în Gestiune dacă nu există,
  // și scade cantitatea din stocul central (ca ieșire, către șantier).
  const proceseazaCerereMaterial = (denumire, um, cantitate, santierNume) => {
    let mat = materials.find((m) => m.denumire === denumire && !m.arhivat);
    let nextMaterials;
    if (!mat) {
      mat = { id: uid(), denumire, categorie: '', um, stoc: 0, stocMinim: 0, pret: 0, arhivat: false };
      nextMaterials = [...materials, mat];
    } else {
      nextMaterials = materials.slice();
    }
    nextMaterials = nextMaterials.map((m) => m.id === mat.id ? { ...m, stoc: (Number(m.stoc) || 0) - (Number(cantitate) || 0) } : m);
    setMaterials(nextMaterials);
    persist('materials', nextMaterials);
    const move = { id: uid(), materialId: mat.id, tip: 'iesire', cantitate: Number(cantitate) || 0, nota: `Cerere șantier: ${santierNume}`, data: new Date().toISOString().slice(0,10) };
    const nextMoves = [move, ...stockMoves];
    setStockMoves(nextMoves);
    persist('stockMoves', nextMoves);
  };


  const saveInvoice = (inv) => {
    const isNew = !invoices.some((x)=>x.id===inv.id);
    const withNumber = { ...inv, numar: inv.numar || nextNumber('FA', invoices) };
    let finalDoc = withNumber;
    if (isNew) {
      const unmatched = deductStock(inv.items, `Factură ${withNumber.numar}`);
      finalDoc = { ...withNumber, stocDedus: true, stocMesaj: unmatched.length ? `Nepotrivite în stoc: ${unmatched.join(', ')}` : 'Stoc actualizat automat.' };
    }
    const next = invoices.some((x)=>x.id===inv.id) ? invoices.map((x)=>x.id===inv.id?finalDoc:x) : [...invoices, finalDoc];
    setInvoices(next); persist('invoices', next); setInvoiceForm(null);
  };
  const deleteInvoice = (id) => {
    if (!window.confirm('Ștergi definitiv această factură?')) return;
    const inv = invoices.find((i)=>i.id===id);
    if (inv && inv.stocDedus) reverseStock(inv.items, `Ștergere factură ${inv.numar}`);
    const next = invoices.filter((i)=>i.id!==id); setInvoices(next); persist('invoices', next);
  };
  const invoiceStatus = (id, status) => { const next = invoices.map((i)=>i.id===id?{...i,status}:i); setInvoices(next); persist('invoices', next); };

  const convertToInvoice = (offer) => {
    setTab('facturi');
    setInvoiceForm({ id: uid(), clientId: offer.clientId, items: offer.items.map((it)=>({...it, id: uid()})), tva: offer.tva, offerId: offer.id });
  };

  const NavItem = ({ id, label }) => (
    <button onClick={()=>{ setTab(id); setSidebarOpen(false); }} className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: tab===id?'#14181C':'var(--muted1)', background: tab===id?'#2E8BD1':'transparent', fontWeight: tab===id?600:400 }}>{label}</button>
  );

  if (!currentUser) {
    return <LoginScreen onLogin={handleAuth} onBioUnlock={handleBioUnlock} />;
  }

  return (
    <>
    <div className="aurora" aria-hidden="true"><div className="b b1" /><div className="b b2" /><div className="b b3" /><div className="b b4" /><div className="rim" /><div className="grid" /></div>
    <div className="min-h-screen w-full" style={{ background:'transparent', position:'relative', zIndex:1, fontFamily:"'Inter', sans-serif" }}>
      {(!online || pendingCount > 0) && (
        <div style={{ position:'fixed', bottom:'12px', left:'12px', right:'12px', zIndex:9998, textAlign:'center' }}>
          <span style={{ display:'inline-block', padding:'8px 14px', borderRadius:'10px', fontSize:'13px', fontWeight:600,
            background: online ? '#1d3a52' : '#3a2a14', color: online ? '#9ad' : '#E9A23B', border:'1px solid '+(online?'#2E8BD166':'#E9A23B66'), boxShadow:'0 4px 14px rgba(0,0,0,.4)' }}>
            {!online ? '📴 Fără net — lucrezi offline, se salvează local.' : `🔄 Se sincronizează… (${pendingCount} în așteptare)`}
          </span>
        </div>
      )}
      <div className="md:hidden flex items-center justify-between px-3 py-2.5" style={{ borderBottom:'1px solid var(--border)' }}>
        <button onClick={()=>setSidebarOpen(true)} className="text-xl px-1" style={{ color:'var(--text)' }}>☰</button>
        <button onClick={()=>{ setTab(effectiveUser.rol === 'Manager' ? null : 'activitate'); setSidebarOpen(false); }} title="Înapoi la Dashboard"><img src="/logo.png" alt="Logo" style={{ height:24, width:'auto', display:'block' }} /></button>
        <div style={{ width:28 }} />
      </div>

      {sidebarOpen && (
        <div onClick={()=>setSidebarOpen(false)} className="md:hidden fixed inset-0" style={{ background:'rgba(0,0,0,0.6)', zIndex:40 }} />
      )}

      <div className="w-full flex">
      <aside className={`w-64 md:w-56 shrink-0 p-4 flex flex-col gap-1 fixed md:static inset-y-0 left-0 transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`} style={{ borderRight:'1px solid var(--border)', background:'var(--panel)', zIndex:50, overflowY:'auto' }}>
        <button onClick={()=>{ setTab(effectiveUser.rol === 'Manager' ? null : 'activitate'); setSidebarOpen(false); }} className="flex items-center gap-2 px-2 mb-4">
          <img src="/logo.png" alt="Logo" style={{ height: 32, width: 'auto' }} />
        </button>
        {accesLimitat && <div className="px-3 mb-2 text-[11px]" style={{ color:'var(--muted)', background:'var(--panel)', border:'1px solid var(--border)', borderRadius:8, padding:'8px 10px' }}>🧪 Perioadă de test — poți folosi <b style={{color:'var(--text)'}}>Activitatea mea, Șantiere, Profil</b>. Restul le vezi, dar se activează după test.</div>}
        {effectiveUser.rol === 'Manager' && <NavItem id={null} label="🏠 Dashboard" />}
        <NavItem id="activitate" label={effectiveUser.rol === 'Manager' ? '⚡ Activitatea mea' : '🏠 Activitatea mea'} />
        <div style={{ height:1, background:'var(--border)', margin:'4px 4px 8px' }} />
        {effectiveUser.rol === 'Manager' && (
        <>
        <button onClick={()=>setContabOpen(!contabOpen)} className="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: CONTAB_TABS.includes(tab) ? '#2E8BD1' : 'var(--muted1)', fontWeight:600 }}>
          <span>📊 Contabilitate</span>
          <span style={{ fontSize:10, transform: contabOpen ? 'rotate(90deg)' : 'none', display:'inline-block' }}>▶</span>
        </button>
        {contabOpen && (
          <div className="flex flex-col gap-1 pl-3">
            <NavItem id="devize" label="🧮 Devize" />
            <NavItem id="oferte" label="📄 Oferte" />
            <NavItem id="facturi" label="🧾 Facturi" />
            <NavItem id="clienti" label="👥 Clienți" />
            <NavItem id="proiecte" label="📁 Proiecte" />
            <NavItem id="notite" label="📝 Notițe" />
          </div>
        )}
        </>
        )}
        <button onClick={()=>setMaterialeOpen(!materialeOpen)} className="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: MATERIALE_TABS.includes(tab) ? '#2E8BD1' : 'var(--muted1)', fontWeight:600 }}>
          <span>📦 Materiale</span>
          <span style={{ fontSize:10, transform: materialeOpen ? 'rotate(90deg)' : 'none', display:'inline-block' }}>▶</span>
        </button>
        {materialeOpen && (
          <div className="flex flex-col gap-1 pl-3">
            {effectiveUser.rol === 'Manager' && <NavItem id="gestiune" label="🗂 Gestiune" />}
            <NavItem id="stocuri" label="📈 Stocuri" />
          </div>
        )}
        <NavItem id="santiere" label="🏗 Șantiere" />
        <NavItem id="asistent" label="🤖 Asistent Q&A" />
        <NavItem id="memento" label="🔔 Memento" />
        <NavItem id="calculator" label="🧮 Calculator" />
        <NavItem id="normativ" label="📘 Normativ I7" />
        <NavItem id="pontaj" label="🕐 Pontaj" />
        <NavItem id="concedii" label="🏖 Concedii" />
        {effectiveUser.rol === 'Manager' && <NavItem id="achizitii" label="🛒 Achiziții" />}
        {effectiveUser.rol === 'Manager' && <NavItem id="adeverinte" label="📄 Adeverințe" />}
        <div style={{ height:1, background:'var(--border)', margin:'8px 4px' }} />
        {effectiveUser.rol === 'Manager' && <NavItem id="firma" label="⚙ Firma mea" />}
        <NavItem id="profil" label="👤 Profilul meu" />
        <NavItem id="ghid" label="📖 Ghid" />
        {effectiveUser.rol === 'Manager' && <NavItem id="utilizatori" label="🔑 Utilizatori" />}
        <div className="mt-auto pt-3" style={{ borderTop:'1px solid var(--border)' }}>
          {currentUser.rol === 'Manager' && (
            <div className="px-3 mb-2">
              <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color:'var(--muted2)' }}>🧪 Vezi ca (test)</div>
              <select value={viewAsUserId || ''} onChange={(e)=>{ setViewAsUserId(e.target.value || null); setTab(null); }} className="w-full text-xs rounded-lg px-2 py-1.5 outline-none" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }}>
                <option value="">— tu (cont real) —</option>
                {allAppUsers.filter((u)=>u.id!==currentUser.id).map((u)=>(
                  <option key={u.id} value={u.id} style={{ background:'var(--panel)' }}>{u.nume} ({u.rol})</option>
                ))}
              </select>
            </div>
          )}
          {viewAsUserId && (
            <div className="px-3 mb-2 text-[11px]" style={{ color:'#E9A23B' }}>
              ⚠ Vezi ca: {effectiveUser.nume} ({effectiveUser.rol})
            </div>
          )}
          <div className="flex items-center justify-between px-3 py-2 text-xs" style={{ color:'var(--muted)' }}>
            <span>{ROLES.find((r)=>r.id===currentUser.rol)?.icon} {currentUser.nume}</span>
            <button onClick={logout} style={{ color:'#E05252' }}>Ieși</button>
          </div>
          <div className="px-3 pb-1 text-[10px]" style={{ color:'#3d4650' }}>{APP_VERSION}</div>
        </div>
      </aside>
      <main className="flex-1 p-3 md:p-6 max-w-4xl w-full min-w-0">
        {loading ? (
          <EcranIncarcare />
        ) : !tab ? (
          effectiveUser.rol === 'Manager'
            ? <Dashboard company={company} devize={devize} offers={offers} invoices={invoices} santiere={santiere} materials={materials} cereriSantier={cereriSantier} rapoarte={rapoarte} concedii={concedii} cereriAlocare={cereriAlocare} clients={clients} setTab={setTab} currentUser={effectiveUser} />
            : <ActivitateaMeaTab santiere={santiere} materials={materials} cereriSantier={cereriSantier} rapoarte={rapoarte} concedii={concedii} cereriAlocare={cereriAlocare} mementouri={mementouri} problemeSantier={problemeSantier} setTab={setTab} setPendingSiteNav={setPendingSiteNav} goQA={goQA} currentUser={effectiveUser} />
        ) : tabBlocatTest ? (
          <div className="max-w-md mx-auto mt-16 text-center rounded-xl p-6" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
            <div style={{ fontSize:34 }}>🔒</div>
            <div className="text-base mt-2" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif", fontWeight:600 }}>Secțiune în pregătire</div>
            <p className="text-sm mt-2" style={{ color:'var(--muted)' }}>Această parte a aplicației se activează după perioada de test. Deocamdată poți lucra la <b style={{color:'var(--text)'}}>Activitatea mea</b>, <b style={{color:'var(--text)'}}>Șantiere</b> și <b style={{color:'var(--text)'}}>Profil</b>.</p>
            <button onClick={()=>setTab('santiere')} className="mt-4 text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Mergi la Șantiere</button>
          </div>
        ) : (
          <>
            {error && <div className="text-xs mb-4 px-3 py-2 rounded-lg" style={{ color:'#E05252', background:'rgba(224,82,82,.14)' }}>{error}</div>}

            {HELP[tab] && <HelpNote text={HELP[tab]} isManager={effectiveUser.rol === 'Manager'} />}

            {tab === 'devize' && (
              <DevizTab devize={devize} setDevize={setDevize} clients={clients} materials={materials} company={company} persist={persist} printOne={printDevizOne} printAll={printDevizAll} onEmis={(doc)=>deductStock(doc.items, `Deviz ${doc.numar}`)} onReverse={(doc)=>reverseStock(doc.items, `Anulare deviz ${doc.numar}`)} prefill={devizPrefill} onConsumePrefill={()=>setDevizPrefill(null)} />
            )}

            {tab === 'oferte' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Oferte</h2>
                  <div className="flex items-center gap-2">
                    {offers.length>0 && <button onClick={()=>printAll(offers,'Ofertă')} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)', border:'1px solid var(--border)' }}>📚 Exportă toate în PDF</button>}
                    {!offerForm && <button onClick={()=>setOfferForm({})} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă ofertă</button>}
                  </div>
                </div>
                {offerForm && <DocForm kind="Ofertă" clients={clients} materials={materials} initial={(offerForm.id || offerForm.items) ? offerForm : null} onCancel={()=>setOfferForm(null)} onSave={saveOffer} />}
                <DocTable kind="Ofertă" docs={offers} clients={clients} statuses={OFFER_STATUSES} onEdit={setOfferForm} onDelete={deleteOffer} onStatusChange={offerStatus} onConvert={convertToInvoice} onPrint={printOne('Ofertă')} />
              </div>
            )}

            {tab === 'facturi' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Facturi</h2>
                  <div className="flex items-center gap-2">
                    {invoices.length>0 && <button onClick={()=>printAll(invoices,'Factură')} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)', border:'1px solid var(--border)' }}>📚 Exportă toate în PDF</button>}
                    {!invoiceForm && <button onClick={()=>setInvoiceForm({})} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă factură</button>}
                  </div>
                </div>
                {invoiceForm && <DocForm kind="Factură" clients={clients} materials={materials} initial={invoiceForm.id?invoiceForm:null} onCancel={()=>setInvoiceForm(null)} onSave={saveInvoice} />}
                <DocTable kind="Factură" docs={invoices} clients={clients} statuses={INVOICE_STATUSES} onEdit={setInvoiceForm} onDelete={deleteInvoice} onStatusChange={invoiceStatus} onPrint={printOne('Factură')} onSmartBill={sendInvoiceToSmartBill} />
              </div>
            )}

            {tab === 'clienti' && <ClientsTab clients={clients} setClients={setClients} persist={persist} />}
            {tab === 'notite' && effectiveUser.rol === 'Manager' && <NotiteTab notite={notite} setNotite={setNotite} persist={persist} clients={clients} santiere={santiere} currentUser={effectiveUser} onOfertaDinNota={(n)=>{
              const items = (n.materiale||[]).map((m)=>({ id: uid(), denumire: m.denumire, um: m.um || 'buc', cantitate: Number(m.cantitate) || 1, pretUnitar: 0, adaos: 0 }));
              setOfferForm({ items, clientId: n.clientId || '' });
              setTab('oferte');
            }} />}
            {tab === 'proiecte' && effectiveUser.rol === 'Manager' && <ProiecteTab clients={clients} invoices={invoices} setInvoices={setInvoices} devize={devize} offers={offers} santiere={santiere} rapoarte={rapoarte} structuraSantier={structuraSantier} proiecteFisiere={proiecteFisiere} setProiecteFisiere={setProiecteFisiere} persist={persist} currentUser={effectiveUser} goToSite={(id)=>{ setPendingSiteNav({ santierId:id, siteView:'__closed__' }); setTab('santiere'); }} onCreeazaProiect={creeazaProiect} printFactura={printOne('Factură')} printDeviz={printDevizOne} printOferta={printOne('Ofertă')} />}
            {(tab === 'gestiune' || tab === 'stocuri') && <MaterialsTab materials={materials} setMaterials={setMaterials} stockMoves={stockMoves} setStockMoves={setStockMoves} persist={persist} company={company} subTab={tab} />}

            {tab === 'santiere' && <SantiereTab santiere={santiere} setSantiere={setSantiere} rapoarte={rapoarte} setRapoarte={setRapoarte} etape={etape} setEtape={setEtape} persist={persist} company={company} materials={materials} sculeSantier={sculeSantier} setSculeSantier={setSculeSantier} cereriSantier={cereriSantier} setCereriSantier={setCereriSantier} miscariSantier={miscariSantier} setMiscariSantier={setMiscariSantier} problemeSantier={problemeSantier} setProblemeSantier={setProblemeSantier} planseSantier={planseSantier} setPlanseSantier={setPlanseSantier} mediaSantier={mediaSantier} setMediaSantier={setMediaSantier} structuraSantier={structuraSantier} setStructuraSantier={setStructuraSantier} pozitiiSantier={pozitiiSantier} setPozitiiSantier={setPozitiiSantier} materialeListaSantier={materialeListaSantier} setMaterialeListaSantier={setMaterialeListaSantier} checklistSantier={checklistSantier} setChecklistSantier={setChecklistSantier} checklistConfirmari={checklistConfirmari} setChecklistConfirmari={setChecklistConfirmari} checklistSablon={checklistSablon} setChecklistSablon={setChecklistSablon} clients={clients} concedii={concedii} cereriAlocare={cereriAlocare} setCereriAlocare={setCereriAlocare} onExportToDeviz={exportConsumToDeviz} onExportMaterialeFolosite={exportMaterialeFolositeToDeviz} onCerereMaterial={proceseazaCerereMaterial} currentUser={effectiveUser} pendingSiteNav={pendingSiteNav} setPendingSiteNav={setPendingSiteNav} />}
            {tab === 'firma' && <CompanyTab company={company} setCompany={setCompany} persist={persist} />}

            {tab === 'activitate' && <ActivitateaMeaTab santiere={santiere} materials={materials} cereriSantier={cereriSantier} rapoarte={rapoarte} concedii={concedii} cereriAlocare={cereriAlocare} mementouri={mementouri} problemeSantier={problemeSantier} setTab={setTab} setPendingSiteNav={setPendingSiteNav} goQA={goQA} currentUser={effectiveUser} />}

            {tab === 'pontaj' && <PontajTab rapoarte={rapoarte} santiere={santiere} currentUser={effectiveUser} pontajCorectii={pontajCorectii} setPontajCorectii={setPontajCorectii} persist={persist} company={company} concedii={concedii} />}

            {tab === 'concedii' && <ConcediiTab concedii={concedii} setConcedii={setConcedii} persist={persist} currentUser={effectiveUser} rapoarte={rapoarte} company={company} />}

            {tab === 'achizitii' && effectiveUser.rol === 'Manager' && <AchizitiiTab achizitii={achizitii} setAchizitii={setAchizitii} persist={persist} />}
            {tab === 'adeverinte' && effectiveUser.rol === 'Manager' && <AdeverinteTab company={company} />}

            {tab === 'profil' && <ProfileTab currentUser={effectiveUser} onLogout={logout} tema={tema} setTema={setTema} />}
            {tab === 'asistent' && <AsistentTab problemeSantier={problemeSantier} setProblemeSantier={setProblemeSantier} santiere={santiere} persist={persist} currentUser={effectiveUser} qaTarget={qaTarget} clearQaTarget={()=>setQaTarget(null)} />}
            {tab === 'memento' && <MementoTab mementouri={mementouri} setMementouri={setMementouri} persist={persist} clients={clients} santiere={santiere} currentUser={effectiveUser} colegi={totiUtilizatorii} />}
            {tab === 'calculator' && <CalculatorTab />}
            {tab === 'normativ' && <NormativTab normativPdf={normativPdf} setNormativPdf={setNormativPdf} normativIndexFile={normativIndexFile} setNormativIndexFile={setNormativIndexFile} persist={persist} isManager={effectiveUser.rol === 'Manager'} />}
            {tab === 'ghid' && <GhidTab isManager={effectiveUser.rol === 'Manager'} />}

            {tab === 'utilizatori' && effectiveUser.rol === 'Manager' && <UsersTab currentUser={effectiveUser} />}
          </>
        )}
      </main>
      </div>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
