function LoginScreen({ onLogin, onBioUnlock }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [status, setStatus] = useState({ loading:false, error:'' });
  const [showPassword, setShowPassword] = useState(false);
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const areBio = bioSuportat() && bioInrolat();
  const [parolaVizibila, setParolaVizibila] = useState(!areBio);

  const bioSubmit = async () => {
    setStatus({ loading:true, error:'' });
    try { await onBioUnlock(); }
    catch (e) { setStatus({ loading:false, error: (e && e.message) ? e.message : 'Deblocarea a eșuat. Folosește parola.' }); setParolaVizibila(true); return; }
    setStatus({ loading:false, error:'' });
  };

  const submit = async () => {
    setStatus({ loading:true, error:'' });
    try {
      await onLogin({ action:'login', username: username.trim(), password: password.trim() });
    } catch (e) {
      setStatus({ loading:false, error: e.message || 'A eșuat.' });
      return;
    }
    setStatus({ loading:false, error:'' });
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center" style={{ background:'#14181C' }}>
      <div className="rounded-xl p-6 w-full max-w-sm" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="flex flex-col items-center mb-5">
          <img src="/logo.png" alt="Logo" style={{ height:40, width:'auto', marginBottom:10 }} />
        </div>

        {areBio && (
          <button onClick={bioSubmit} disabled={status.loading} className="w-full mb-3 py-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-50" style={{ color:'#14181C', background:'#4CAF7D' }}>
            <span style={{ fontSize:18 }}>🔒</span> {status.loading ? 'Se deblochează...' : 'Intră cu amprenta / FaceID'}
          </button>
        )}

        {parolaVizibila ? (
          <>
            <div className="space-y-2">
              <input placeholder="Username" value={username} onChange={(e)=>setUsername(e.target.value)} autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
              <div style={{ position:'relative' }}>
                <input type={showPassword ? 'text' : 'password'} placeholder="Parolă" value={password} onChange={(e)=>setPassword(e.target.value)} onKeyDown={(e)=>e.key==='Enter' && submit()} autoCapitalize="off" autoCorrect="off" spellCheck="false" className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ ...inputStyle, paddingRight:36 }} />
                <button type="button" onClick={()=>setShowPassword(!showPassword)} style={{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)', color:'#5C6570' }}>
                  {showPassword ? '🙈' : '👁'}
                </button>
              </div>
            </div>
            {status.error && <p className="text-xs mt-2" style={{ color:'#E05252' }}>{status.error}</p>}
            <button onClick={submit} disabled={status.loading} className="w-full mt-4 py-2 rounded-lg text-sm font-medium disabled:opacity-50" style={{ color:'#14181C', background:'#2E8BD1' }}>
              {status.loading ? '...' : 'Intră în aplicație'}
            </button>
          </>
        ) : (
          <>
            {status.error && <p className="text-xs mt-2 text-center" style={{ color:'#E05252' }}>{status.error}</p>}
            <button onClick={()=>setParolaVizibila(true)} className="w-full mt-1 py-2 text-xs" style={{ color:'#8B93A0' }}>sau intră cu parola</button>
          </>
        )}
      </div>
    </div>
  );
}

function ProfileTab({ currentUser, onLogout }) {

  const [recStatus, setRecStatus] = useState('');
  const [recLoading, setRecLoading] = useState(false);
  const [bioOn, setBioOn] = useState(bioInrolat());
  const [bioStatus, setBioStatus] = useState('');

    setBioStatus('');
    try { await bioInroleaza(currentUser, AUTH_TOKEN); setBioOn(true); setBioStatus('✅ Activată. La următoarea deschidere intri cu amprenta/FaceID.'); }
    catch (e) { setBioStatus((e && e.message) ? e.message : 'Nu s-a putut activa pe acest dispozitiv.'); }
  };
  const dezactiveazaBio = () => { bioSterge(); setBioOn(false); setBioStatus('Dezactivată pe acest dispozitiv. Intri doar cu parola.'); };
  const CHEI_RECUP = ['santiere','clients','rapoarte','etape','structuraSantier','pozitiiSantier','materialeListaSantier','materials','stockMoves','devize','offers','invoices','concedii','cereriSantier','miscariSantier','sculeSantier','planseSantier','mediaSantier','achizitii','pontajCorectii'];
  const recupereaza = async () => {

    const gasite = [];
    for (const k of CHEI_RECUP) {
      const pend = getPending().find((x)=>x.key===k);
      let local = pend !== undefined ? pend.value : cacheGet(k);
      if (!Array.isArray(local) || local.length === 0) continue;
      let server = [];
      try { const r = await authFetch(`/api/data?key=${encodeURIComponent(k)}`); const d = await r.json(); server = Array.isArray(d.value) ? d.value : []; } catch {}
      const merged = mergeById(server, local);
      try {
        const rr = await authFetch('/api/data', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key:k, value:merged }) });
        const dd = await rr.json();
        if (dd.ok) { cacheSet(k, merged); setPending(getPending().filter((x)=>x.key!==k)); gasite.push(`${k}: ${merged.length}`); }
      } catch {}
    }
    setRecLoading(false);
    if (gasite.length) { setRecStatus('✅ Recuperat: ' + gasite.join(', ') + '. Reîncarc aplicația...'); setTimeout(()=>{ try{ window.location.reload(); }catch{} }, 1500); }
    else setRecStatus('Nu am găsit date salvate local pe acest dispozitiv. Dacă le-ai creat pe alt telefon/calculator, deschide aplicația acolo și apasă tot acest buton.');
  };

  const submit = async () => {
    setStatus({ loading:true, error:'', success:'' });
    if (!oldPassword || !newPassword) { setStatus({ loading:false, error:'Completează toate câmpurile.', success:'' }); return; }
    if (newPassword !== confirmPassword) { setStatus({ loading:false, error:'Parola nouă nu se potrivește cu confirmarea.', success:'' }); return; }
    try {
      const res = await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'changePassword', id: currentUser.id, oldPassword, newPassword }) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'A eșuat.');
      setStatus({ loading:false, error:'', success:'Parola a fost schimbată.' });
      setOldPassword(''); setNewPassword(''); setConfirmPassword('');
    } catch (e) {
      setStatus({ loading:false, error: e.message || 'A eșuat.', success:'' });
    }
  };

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>Profilul meu</h2>
      <p className="text-xs mb-5" style={{ color:'#5C6570' }}>{roleIcon} {currentUser?.nume} · @{currentUser?.username} · {currentUser?.rol}</p>

      {!expandedForm ? (

            <span>🚪</span> Ieși din cont
          </button>
        </div>
      ) : (
      <div className="rounded-xl p-4 max-w-sm" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        <div className="flex items-center justify-between mb-3 pb-3" style={{ borderBottom:'1px solid #2A323B' }}>
          <div className="flex items-center gap-2">
            <span>🔒</span>
            <div className="text-sm font-medium" style={{ color:'#E9E7E2' }}>Schimbă parola</div>
          </div>
          <button onClick={()=>{ setExpandedForm(false); setOldPassword(''); setNewPassword(''); setConfirmPassword(''); setStatus({loading:false,error:'',success:''}); }} style={{ color:'#5C6570' }}><Icon size={14}>✕</Icon></button>
        </div>
        <div className="space-y-2">
        <input type={showPw?'text':'password'} placeholder="Parola actuală" value={oldPassword} onChange={(e)=>setOldPassword(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <input type={showPw?'text':'password'} placeholder="Parola nouă" value={newPassword} onChange={(e)=>setNewPassword(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <input type={showPw?'text':'password'} placeholder="Confirmă parola nouă" value={confirmPassword} onChange={(e)=>setConfirmPassword(e.target.value)} onKeyDown={(e)=>e.key==='Enter' && submit()} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <label className="flex items-center gap-1.5 text-xs" style={{ color:'#8B93A0' }}>
          <input type="checkbox" checked={showPw} onChange={(e)=>setShowPw(e.target.checked)} /> Arată parolele
        </label>
        {status.error && <p className="text-xs" style={{ color:'#E05252' }}>{status.error}</p>}
        {status.success && <p className="text-xs" style={{ color:'#4CAF7D' }}>{status.success}</p>}
        <div className="flex justify-end pt-1">

        </div>

      {bioSuportat() && (

          <p className="text-xs mb-3" style={{ color:'#8B93A0' }}>Intri rapid, fără să scrii parola. Deblocarea se face doar pe acest telefon/calculator (parola rămâne mereu disponibilă ca rezervă).</p>
          {bioOn ? (
            <button onClick={dezactiveazaBio} className="text-sm px-3 py-2 rounded-lg font-semibold" style={{ color:'#E05252', background:'#171C21', border:'1px solid #E0525266' }}>Dezactivează amprenta pe acest dispozitiv</button>
          ) : (
            <button onClick={activeazaBio} className="text-sm px-3 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>🔒 Activează amprenta / FaceID</button>
          )}
          {bioStatus && <p className="text-xs mt-2" style={{ color: bioStatus.startsWith('✅') ? '#4CAF7D' : '#E9A23B' }}>{bioStatus}</p>}
        </div>
      )}
      {currentUser?.rol === 'Manager' && (
        <div className="mt-5 rounded-xl p-4 max-w-md" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <div className="text-sm font-semibold mb-1" style={{ color:'#E9E7E2' }}>🛟 Recuperare date</div>
          <p className="text-xs mb-3" style={{ color:'#8B93A0' }}>Dacă lipsesc șantiere/clienți create recent, apasă aici <b>pe dispozitivul unde le-ai creat</b>. Caută datele salvate local și le trimite pe server (nu șterge nimic, doar adaugă).</p>
          <button onClick={recupereaza} disabled={recLoading} className="text-sm px-3 py-2 rounded-lg font-semibold disabled:opacity-50" style={{ color:'#14181C', background:'#4CAF7D' }}>{recLoading ? 'Se recuperează...' : '🛟 Recuperează datele locale'}</button>
          {recStatus && <p className="text-xs mt-2" style={{ color: recStatus.startsWith('✅') ? '#4CAF7D' : '#E9A23B' }}>{recStatus}</p>}

    </div>
  );

// Extrage ziua de nastere (zi/luna, fara an) dintr-un CNP romanesc valid.
// Cifra 1 = sex+secol (1/2=1900-1999, 3/4=1800-1899, 5/6=2000-2099); 7/8/9 = cazuri speciale, ignorate.
// Formateaza minute in "X zile" sau "X zile si Y ore" (o zi = 8 ore), pentru afisarea concediului.
function minutesToZileOre(minute) {
  const totalMin = Math.max(0, Math.round(minute || 0));
  const zile = Math.floor(totalMin / 480);
  const oreRamase = totalMin % 480;
  const ziLabel = zile === 1 ? 'zi' : 'zile';
  if (oreRamase === 0) return `${zile} ${ziLabel}`;
  return `${zile} ${ziLabel} și ${minutesToHM(oreRamase)} ore`;
}

function nasterePeDinCnp(cnp) {
  if (!cnp || !/^\d{13}$/.test(cnp)) return null;
  const s = Number(cnp[0]);
  let secol;
  if (s===1 || s===2) secol=1900;
  else if (s===3 || s===4) secol=1800;
  else if (s===5 || s===6) secol=2000;
  else return null;
  const an = secol + Number(cnp.slice(1,3));
  const luna = Number(cnp.slice(3,5));
  const zi = Number(cnp.slice(5,7));
  if (luna<1 || luna>12 || zi<1 || zi>31) return null;
  return { an, luna, zi };
}

// Calculeaza, pentru o persoana si un an, ziua-cu-ziua ce s-a intamplat: lucrat, concediu aprobat,
// sau concediu AUTOMAT (zi lucrata sub 8h sau lipsa complet, fara cerere aprobata care sa explice).
// Concediul automat consuma dintr-un buget anual de 21 zile x 8h (168h) platite; peste buget devine "I" (fara plata).
// "panaLaLuna" (format YYYY-MM) opreste calculul la sfarsitul acelei luni, ca sa nu procesam degeaba tot anul.
function calculPontajAnual(nume, an, panaLaLuna, rapoarte, concedii) {
  const concediiAprobate = (concedii || []).filter((c)=>c.nume===nume && c.status==='Aprobat');
  const minuteLucratePeZi = {};
  const dateRaportate = [];
  rapoarte.forEach((r)=>{
    if (!r.data?.startsWith(String(an))) return;
    const p = (r.persoane || []).find((pp)=>pp.nume===nume);
    if (!p) return;
    minuteLucratePeZi[r.data] = (minuteLucratePeZi[r.data] || 0) + personMinutes(p);
    dateRaportate.push(r.data);
  });
  // Nu penalizam zilele dinainte de primul raport real al persoanei - de obicei inseamna
  // ca aplicatia/urmarirea nu exista inca de atunci, nu ca persoana a lipsit nemotivat.
  const primaZiCuDate = dateRaportate.length ? dateRaportate.slice().sort()[0] : null;

  const [anLimita, lunaLimita] = panaLaLuna.split('-').map(Number);
  const ultimaZiLimita = new Date(anLimita, lunaLimita, 0).getDate();
  const dataLimita = `${panaLaLuna}-${String(ultimaZiLimita).padStart(2,'0')}`;

  let bugetRamasMin = 21 * 8 * 60;
  const rezultat = {};
  for (let luna=0; luna<12; luna++) {
    const nrZileLuna = new Date(an, luna+1, 0).getDate();
    for (let zi=1; zi<=nrZileLuna; zi++) {
      const dataStr = `${an}-${String(luna+1).padStart(2,'0')}-${String(zi).padStart(2,'0')}`;
      if (dataStr > dataLimita) return rezultat;
      if (!primaZiCuDate || dataStr < primaZiCuDate) continue;
      const dow = new Date(an, luna, zi).getDay();
      if (dow===0 || dow===6) continue;

      if ((SARBATORI_LEGALE[an] || []).includes(dataStr)) { rezultat[dataStr] = { status:'sarbatoare', cod:'SL' }; continue; }

      const concAprobat = concediiAprobate.find((c)=>dataStr>=c.dataInceput && dataStr<=c.dataSfarsit);
      if (concAprobat) {
        const cod = codPentruTip(concAprobat.tip);
        if (cod === 'CO') bugetRamasMin = Math.max(0, bugetRamasMin - 480);
        rezultat[dataStr] = { status:'aprobat', cod };
        continue;
      }

      const minLucrate = minuteLucratePeZi[dataStr] || 0;
      const diferenta = 480 - minLucrate;
      if (diferenta <= 0) {
        rezultat[dataStr] = { status:'lucrat', minuteLucrate: minLucrate, suplimentar: -diferenta };
      } else {
        let codAuto;
        if (bugetRamasMin >= diferenta) { codAuto = 'CO'; bugetRamasMin -= diferenta; }
        else { codAuto = 'I'; bugetRamasMin = 0; }
        rezultat[dataStr] = { status: minLucrate > 0 ? 'partial' : 'absent', minuteLucrate: minLucrate, minuteAuto: diferenta, codAuto };
      }
    }
  }
  return rezultat;
}

const ACHIZITIE_STATUSES = ['De comandat', 'Comandat', 'Primit'];

function PontajTab({ rapoarte, santiere, currentUser, pontajCorectii, setPontajCorectii, persist, company, concedii }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const [luna, setLuna] = useState(new Date().toISOString().slice(0,7));
  const isManager = currentUser?.rol === 'Manager';
  const [editState, setEditState] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [santiereExport, setSantiereExport] = useState([]);
  const [santierFiltru, setSantierFiltru] = useState('');
  const [allUsersPontaj, setAllUsersPontaj] = useState([]);
  useEffect(() => {
    if (!isManager) return;
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setAllUsersPontaj(data.users || [])).catch(()=>{});
  }, [isManager]);

  const rapoarteLuna = rapoarte.filter((r)=>r.data?.startsWith(luna) && (!santierFiltru || r.santierId===santierFiltru));
  // Zile libere (concediu aprobat) în luna selectată, pe persoană — asta interesează contabila.
  const zileLibereLuna = (nume) => {
    const aprobate = (concedii || []).filter((c)=>c.nume===nume && c.status==='Aprobat');
    let cnt = 0;
    aprobate.forEach((c)=>{
      if (!c.dataInceput || !c.dataSfarsit) return;
      let d = new Date(c.dataInceput); const end = new Date(c.dataSfarsit);
      while (d <= end) { const ds = d.toISOString().slice(0,10); if (ds.startsWith(luna)) cnt++; d.setDate(d.getDate()+1); }
    });
    return cnt;
  };
  const perPersoana = {};
  rapoarteLuna.forEach((r)=>{
    const santierNume = santiere.find((s)=>s.id===r.santierId)?.nume || '—';
    (r.persoane || []).forEach((p)=>{
      if (!p.nume?.trim()) return;
      if (!isManager && p.nume !== currentUser?.nume) return;
      if (!perPersoana[p.nume]) perPersoana[p.nume] = { nume: p.nume, totalMin: 0, peSantier: {} };
      const min = personMinutes(p);
      perPersoana[p.nume].totalMin += min;
      perPersoana[p.nume].peSantier[santierNume] = (perPersoana[p.nume].peSantier[santierNume] || 0) + min;
    });
  });
  // Toți angajații apar în pontaj, chiar dacă n-au ore luna asta sau n-au niciun șantier activ.
  if (isManager) {
    allUsersPontaj.filter((u)=>u.rol==='Electrician').forEach((u)=>{
      if (!perPersoana[u.nume]) perPersoana[u.nume] = { nume: u.nume, totalMin: 0, peSantier: {} };
    });
  }

  const corectiiLuna = (pontajCorectii || []).filter((c)=>c.luna===luna);
  const corectiePersoana = (nume) => corectiiLuna.filter((c)=>c.nume===nume).reduce((s,c)=>s+c.minuteAjustare,0);

  const lista = Object.values(perPersoana)
    .map((p)=>({ ...p, corectieMin: corectiePersoana(p.nume), totalFinal: p.totalMin + corectiePersoana(p.nume), zileLibere: zileLibereLuna(p.nume) }))
    .sort((a,b)=>b.totalFinal - a.totalFinal);
  const totalGeneral = lista.reduce((s,p)=>s+p.totalFinal,0);

  const startEdit = (p) => { setEditState(p.nume); setEditValue(minutesToHM(p.totalFinal)); };
  const confirmEdit = (p) => {
    const dorit = oreToMinutes(editValue);
    const delta = dorit - p.totalFinal;
    setEditState(null);
    if (!delta) return;
    const c = { id: uid(), nume: p.nume, luna, minuteAjustare: delta, nota:'Corecție manuală', data: new Date().toISOString().slice(0,10) };
    const next = [...(pontajCorectii || []), c];
    setPontajCorectii(next); persist('pontajCorectii', next);
  };
  const [expandedPerson, setExpandedPerson] = useState(null);
  const zileDetaliu = (nume) => rapoarteLuna
    .filter((r)=>(r.persoane||[]).some((p)=>p.nume===nume))
    .map((r)=>{
      const p = r.persoane.find((pp)=>pp.nume===nume);
      const santierNume = santiere.find((s)=>s.id===r.santierId)?.nume || '—';
      return { data: r.data, santierNume, min: personMinutes(p) };
    })
    .sort((a,b)=> a.data<b.data?-1:1);

  const [lunaNume, anNume] = (() => {
    const LUNI = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    const [y,m] = luna.split('-');
    return [LUNI[Number(m)-1], y];
  })();

  // --- Export legal "Foaie colectivă de prezență", pe șantier, zi cu zi ---
  const ZI_LITERA = ['D','L','M','M','J','V','S'];
  const zileLunaInfo = (lunaStr) => {
    const [y,m] = lunaStr.split('-').map(Number);
    const nrZile = new Date(y, m, 0).getDate();
    const zile = [];
    for (let d=1; d<=nrZile; d++) {
      const dateObj = new Date(y, m-1, d);
      const dow = dateObj.getDay();
      zile.push({ zi:d, litera: ZI_LITERA[dow], weekend: dow===0 || dow===6, dataStr: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` });
    }
    return zile;
  };
  const construiesteGrila = (santierId, lunaStr) => {
    const santier = santiere.find((s)=>s.id===santierId);
    const zile = zileLunaInfo(lunaStr);
    const an = lunaStr.split('-')[0];
    const rapoarteSantierLuna = rapoarte.filter((r)=>r.santierId===santierId && r.data?.startsWith(lunaStr));
    const numeDinEchipa = echipaNormalizata(santier?.echipa).map((e)=>allUsersPontaj.find((u)=>u.id===e.userId)?.nume).filter(Boolean);
    const numeDinRapoarte = [...new Set(rapoarteSantierLuna.flatMap((r)=>(r.persoane||[]).map((p)=>p.nume).filter((n)=>n?.trim())))];
    const numeToate = [...new Set([...numeDinEchipa, ...numeDinRapoarte])];

    const angajati = numeToate.map((nume)=>{
      const anual = calculPontajAnual(nume, an, lunaStr, rapoarte, concedii);
      const celule = zile.map((zi)=>{
        if (zi.weekend) return { start:'X', sfarsit:'X', pauza:'X', ore:'X' };
        const info = anual[zi.dataStr];
        if (info?.status === 'aprobat' || info?.status === 'sarbatoare') return { start:info.cod, sfarsit:info.cod, pauza:info.cod, ore:info.cod };
        const raport = rapoarteSantierLuna.find((r)=>r.data===zi.dataStr);
        const persoana = raport?.persoane?.find((p)=>p.nume===nume);
        if (persoana) {
          const supl = info?.suplimentar > 0 ? ` (+${minutesToHM(info.suplimentar)} supl.)` : '';
          return { start: persoana.oraInceput || '', sfarsit: persoana.oraSfarsit || '', pauza:'1:00', ore: minutesToHM(personMinutes(persoana)) + supl };
        }
        if (info?.status === 'absent') return { start: info.codAuto, sfarsit: info.codAuto, pauza: info.codAuto, ore: info.codAuto };
        return { start:'', sfarsit:'', pauza:'', ore:'' };
      });
      return { nume, celule };
    });
    return { santier, zile, angajati };
  };

  const santierFiltruNume = santiere.find((s)=>s.id===santierFiltru)?.nume;
  const exportPontajExcel = () => {
    const totalZileLibere = lista.reduce((s,p)=>s+(p.zileLibere||0),0);
    const rows = lista.map((p)=>({
      'Nume': p.nume,
      'Total ore': minutesToHM(p.totalFinal),
      'Zile libere': p.zileLibere || 0,
    }));
    const sheetRows = rows.length ? [...rows, { 'Nume':'TOTAL', 'Total ore': minutesToHM(totalGeneral), 'Zile libere': totalZileLibere }] : [{ 'Nume':'', 'Total ore':'', 'Zile libere':'' }];
    const headerRows = [
      [company?.nume || 'Firma mea'],
      [[company?.cui ? `CIF: ${company.cui}` : '', company?.adresa || ''].filter(Boolean).join(' | ')],
      [],
      [`Pontaj${santierFiltruNume ? ' — șantier ' + santierFiltruNume : ' — total pe angajat'} — ${lunaNume} ${anNume}`],
      [],
    ];
    const ws = XLSX.utils.aoa_to_sheet(headerRows);
    XLSX.utils.sheet_add_json(ws, sheetRows, { origin: -1 });
    ws['!cols'] = [{wch:24},{wch:12},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pontaj');
    XLSX.writeFile(wb, `pontaj_rezumat_${luna}.xlsx`);
  };

  const exportPontajPDF = () => {
    const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const totalZileLibere = lista.reduce((s,p)=>s+(p.zileLibere||0),0);

      + `<tr style="font-weight:700"><td style="text-align:left">TOTAL</td><td>${esc(minutesToHM(totalGeneral))}</td><td>${totalZileLibere}</td></tr>`;
    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Pontaj</title><style>
      * { box-sizing:border-box; } body { margin:0; font-family:Arial, sans-serif; color:#1a1a1a; }

      <div class="page">

        </table>

    </body></html>`;
    const w = window.open('', '_blank');

    w.document.open(); w.document.write(html); w.document.close();
    w.focus();
  };

  const exportFoaiePrezentaExcel = () => {
    if (santiereExport.length === 0) return;

    santiereExport.forEach((santierId)=>{

      const headerRows = [

      const headRow1 = ['Nr. crt', 'Nume și prenume', 'Program de lucru', ...zile.map((z)=>z.litera)];

      const body = [];
      angajati.forEach((a, i)=>{
        body.push([i+1, a.nume, 'Inceput', ...a.celule.map((c)=>c.start)]);

      const aoa = [...headerRows, headRow1, headRow2, ...body, ...legenda];

  const exportFoaiePrezentaPDF = () => {

    const html = `<!doctype html><html><head><meta charset="utf-8"><title>Foaie pontaj</title><style>

      .legend { display:flex; justify-content:space-between; margin-top:5mm; font-size:9px; }
      .legend-col { flex:1; line-height:1.7; }
    </style></head><body>${PRINT_TOOLBAR}${pagini}</body></html>`;
    const w = window.open('', '_blank');
    if (!w) { window.alert('Browserul a blocat fereastra nouă. Permite pop-up-urile și încearcă din nou.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.focus();
  };

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>🕐 Pontaj</h2>
      <p className="text-xs mb-4" style={{ color:'#5C6570' }}>Total de ore și zile libere pe fiecare angajat (din toate șantierele). Pentru detaliu pe un șantier anume, alege-l din listă.</p>
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <input type="month" value={luna} onChange={(e)=>setLuna(e.target.value)} className="rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        {isManager && (
          <select value={santierFiltru} onChange={(e)=>setSantierFiltru(e.target.value)} className="rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
            <option value="" style={{ background:'#1B2127' }}>Toate șantierele (total pe om)</option>

          </select>

        {isManager && lista.length > 0 && (
          <>
            <button onClick={exportPontajExcel} className="text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>📊 Excel (rezumat)</button>
            <button onClick={exportPontajPDF} className="text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🖨 PDF (rezumat)</button>

      {isManager && (
        <div className="mb-4 rounded-xl p-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>

          <div className="flex flex-wrap gap-1.5 mb-2">
            <button onClick={()=>setSantiereExport(santiere.map((s)=>s.id))} className="text-xs px-2.5 py-1 rounded-lg" style={{ color:'#2E8BD1', background:'#171C21', border:'1px solid #2E8BD166' }}>Selectează toate</button>
            {santiereExport.length > 0 && <button onClick={()=>setSantiereExport([])} className="text-xs px-2.5 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>Deselectează</button>}
            {santiere.map((s)=>{
              const activ = santiereExport.includes(s.id);
              return (
                <button key={s.id} onClick={()=>setSantiereExport(activ ? santiereExport.filter((id)=>id!==s.id) : [...santiereExport, s.id])} className="text-xs px-2.5 py-1 rounded-lg"
                  style={{ color: activ?'#14181C':'#8B93A0', background: activ?'#4CAF7D':'#171C21' }}>{s.nume}</button>

          </div>
          <div className="flex items-center gap-2">
            <button onClick={exportFoaiePrezentaExcel} disabled={santiereExport.length===0} className="text-sm px-3 py-1.5 rounded-lg font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>📊 Excel {santiereExport.length>1 && `(${santiereExport.length} foi)`}</button>
            <button onClick={exportFoaiePrezentaPDF} disabled={santiereExport.length===0} className="text-sm px-3 py-1.5 rounded-lg font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#4CAF7D' }}>🖨 PDF {santiereExport.length>1 && `(${santiereExport.length} pagini)`}</button>
          </div>
        </div>

      {lista.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'#8B93A0' }}>Nicio oră înregistrată în luna selectată.</div>
      ) : (
        <>
          {isManager && (
            <div className="flex justify-between items-center mb-2 text-sm" style={{ color:'#8B93A0' }}>
              <span>{santierFiltru ? `Rezumat: ${santiere.find((s)=>s.id===santierFiltru)?.nume || ''}` : 'Total pe fiecare angajat'}</span>
              <span>Total ore: <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(totalGeneral)}</span></span>
            </div>
          )}
          <div className="space-y-2">
            {lista.map((p)=>(
              <div key={p.nume} className="rounded-xl p-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
                <div className="flex items-center justify-between gap-2">
                  <span className="text-sm" style={{ color:'#E9E7E2' }}>{p.nume}</span>
                  {editState===p.nume ? (
                    <div className="flex items-center gap-1.5 shrink-0">
                      <input value={editValue} onChange={(e)=>setEditValue(e.target.value)} placeholder="H:MM" className="w-20 rounded-lg px-2 py-1 text-xs outline-none text-center" style={{ ...inputStyle, fontFamily:"'JetBrains Mono', monospace" }} />
                      <button onClick={()=>confirmEdit(p)} className="px-2 py-1 rounded-lg text-xs" style={{ color:'#14181C', background:'#4CAF7D' }}>✓</button>
                      <button onClick={()=>setEditState(null)} className="px-2 py-1 rounded-lg text-xs" style={{ color:'#8B93A0', background:'#171C21' }}>✕</button>

                  ) : (
                    <div className="flex items-center gap-2 shrink-0">
                      {p.zileLibere > 0 && <span className="text-xs px-2 py-0.5 rounded-lg" style={{ color:'#E9A23B', background:'#171C21' }}>{p.zileLibere} {p.zileLibere===1?'zi liberă':'zile libere'}</span>}
                      <span className="text-sm" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(p.totalFinal)}</span>
                      <button onClick={()=>setExpandedPerson(expandedPerson===p.nume ? null : p.nume)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>{expandedPerson===p.nume ? 'Ascunde' : '👁 Zi cu zi'}</button>
                      {isManager && <button onClick={()=>startEdit(p)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>✎ Edit</button>}
                    </div>
                  )}
                </div>
                {expandedPerson===p.nume && (
                  <div className="mt-2 pt-2 space-y-1" style={{ borderTop:'1px solid #2A323B' }}>
                    {zileDetaliu(p.nume).length === 0 ? (
                      <div className="text-xs" style={{ color:'#5C6570' }}>Nicio zi lucrată luna asta.</div>
                    ) : zileDetaliu(p.nume).map((z)=>(
                      <div key={z.data} className="flex items-center justify-between text-xs" style={{ color:'#8B93A0' }}>
                        <span>{fmtData(z.data)} — {z.santierNume}</span>
                        <span style={{ fontFamily:"'JetBrains Mono', monospace" }}>{minutesToHM(z.min)}</span>
                      </div>
                    ))}
                  </div>
                )}
                {p.corectieMin !== 0 && (
                  <div className="mt-1.5 flex items-center justify-between text-xs" style={{ color:'#E9A23B' }}>
                    <span>✎ Corecție manuală</span>
                    <span style={{ fontFamily:"'JetBrains Mono', monospace" }}>{p.corectieMin>0?'+':'−'}{minutesToHM(Math.abs(p.corectieMin))}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function ConcediiTab({ concedii, setConcedii, persist, currentUser, rapoarte }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const [form, setForm] = useState(null);
  const isManager = currentUser?.rol === 'Manager';
  const listaVizibila = isManager ? concedii : concedii.filter((c)=>c.userId===currentUser?.id);

  const saveCerere = () => {
    if (!form.dataInceput || !form.dataSfarsit) return;
    if (form.id) {
      const next = concedii.map((c)=> c.id===form.id ? { ...c, dataInceput: form.dataInceput, dataSfarsit: form.dataSfarsit, tip: form.tip, motiv: form.motiv || '', status:'Cerut' } : c);
      setConcedii(next); persist('concedii', next);
    } else {
      const c = { id: uid(), userId: currentUser.id, nume: currentUser.nume, dataInceput: form.dataInceput, dataSfarsit: form.dataSfarsit, tip: form.tip, motiv: form.motiv || '', status:'Cerut' };
      const next = [c, ...concedii];
      setConcedii(next); persist('concedii', next);
    }
    setForm(null);
  };
  const setStatus = (id, status) => {
    const next = concedii.map((c)=> c.id===id ? {...c, status} : c);
    setConcedii(next); persist('concedii', next);
  };
  const delCerere = (id) => {
    if (!window.confirm('Ștergi definitiv această cerere de concediu?')) return;
    const next = concedii.filter((c)=>c.id!==id);
    setConcedii(next); persist('concedii', next);
  };

  // Rezumat concediu AUTOMAT: zile lucrate sub 8h sau lipsă, calculate din pontaj,
  // consumate din bugetul anual de 21 zile (168h), pana la epuizare (apoi "fara plata").
  const azi = new Date().toISOString().slice(0,10);
  const anCurent = azi.slice(0,4);
  const lunaCurenta = azi.slice(0,7);
  const numeDeUrmarit = isManager
    ? [...new Set(rapoarte.filter((r)=>r.data?.startsWith(anCurent)).flatMap((r)=>(r.persoane||[]).map((p)=>p.nume).filter((n)=>n?.trim())))]
    : [currentUser?.nume].filter(Boolean);
  const rezumatAutomat = numeDeUrmarit.map((nume)=>{
    const anual = calculPontajAnual(nume, anCurent, lunaCurenta, rapoarte, concedii);
    let coFolositMin = 0, faraPlataMin = 0;
    Object.values(anual).forEach((info)=>{
      if (info.status==='partial' || info.status==='absent') {
        if (info.codAuto==='CO') coFolositMin += info.minuteAuto; else faraPlataMin += info.minuteAuto;
      } else if (info.status==='aprobat') {
        if (info.cod==='CO') coFolositMin += 480;
        else if (info.cod==='I') faraPlataMin += 480;
      }
    });
    const coRamasMin = Math.max(0, 21*8*60 - coFolositMin);
    return { nume, coRamasMin, faraPlataMin };
  });

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>🏖 Concedii</h2>
        {!form && <button onClick={()=>setForm({ dataInceput:'', dataSfarsit:'', tip: CONCEDIU_TIPURI[0].label, motiv:'' })} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Cerere nouă</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'#5C6570' }}>{isManager ? 'Toate cererile de concediu.' : 'Cererile tale de concediu.'}</p>

      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <div className="flex items-center gap-2">
            <RoCalendarPicker value={form.dataInceput} onChange={(v)=>setForm({...form, dataInceput:v})} />
            <span className="text-xs" style={{ color:'#5C6570' }}>—</span>
            <RoCalendarPicker value={form.dataSfarsit} onChange={(v)=>setForm({...form, dataSfarsit:v})} />
          </div>
          <select value={form.tip} onChange={(e)=>setForm({...form, tip:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle}>
            {CONCEDIU_TIPURI.map((t)=><option key={t.label} value={t.label} style={{ background:'#1B2127' }}>{t.label} ({t.cod})</option>)}
          </select>
          <textarea placeholder="Motiv (opțional)" value={form.motiv} onChange={(e)=>setForm({...form, motiv:e.target.value})} rows={2} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'#8B93A0', background:'#171C21' }}>Renunță</button>
            <button onClick={saveCerere} disabled={!form.dataInceput || !form.dataSfarsit} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ color:'#14181C', background:'#2E8BD1' }}>{form.id ? 'Salvează modificările' : 'Trimite cererea'}</button>
          </div>
        </div>
      )}

      {rezumatAutomat.length > 0 && (
        <div className="rounded-xl p-3 mb-4" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <div className="text-sm font-medium mb-2" style={{ color:'#E9E7E2' }}>🏖 Concediu de odihnă rămas ({anCurent})</div>
          <div className="space-y-1">
            {rezumatAutomat.map((r)=>(
              <div key={r.nume} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background:'#171C21' }}>
                <span style={{ color:'#E9E7E2' }}>{r.nume}</span>
                <span>
                  <span style={{ color:'#4CAF7D' }}>{minutesToZileOre(r.coRamasMin)}</span>
                  {r.faraPlataMin > 0 && <span style={{ color:'#5C6570' }}> · </span>}
                  {r.faraPlataMin > 0 && <span style={{ color:'#E05252' }}>Fără plată: {minutesToZileOre(r.faraPlataMin)}</span>}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {listaVizibila.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'#8B93A0' }}>Nicio cerere de concediu.</div>
      ) : (
        <div className="space-y-2">
          {listaVizibila.map((c)=>(
            <div key={c.id} className="rounded-xl p-3 flex items-center justify-between gap-2" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
              <div className="min-w-0">
                {isManager && <div className="text-sm" style={{ color:'#E9E7E2' }}>{c.nume}</div>}
                <div className="text-sm" style={{ color: isManager?'#8B93A0':'#E9E7E2' }}>{fmtData(c.dataInceput)} → {fmtData(c.dataSfarsit)} · {c.tip} ({codPentruTip(c.tip)})</div>
                {c.motiv && <div className="text-xs mt-0.5" style={{ color:'#5C6570' }}>{c.motiv}</div>}
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <span className="text-xs" style={{ color: c.status==='Aprobat'?'#4CAF7D':c.status==='Respins'?'#E05252':'#E9A23B' }}>{c.status}</span>
                {isManager && c.status==='Cerut' && (
                  <>
                    <button onClick={()=>setStatus(c.id,'Aprobat')} className="px-2 py-1 rounded-lg text-xs" style={{ color:'#14181C', background:'#4CAF7D' }}>✓</button>
                    <button onClick={()=>setStatus(c.id,'Respins')} className="px-2 py-1 rounded-lg text-xs" style={{ color:'#E9E7E2', background:'#171C21', border:'1px solid #E0525266' }}>✕</button>
                  </>
                )}
                {(isManager || c.userId===currentUser?.id) && (
                  <button onClick={()=>setForm({ id:c.id, dataInceput:c.dataInceput, dataSfarsit:c.dataSfarsit, tip:c.tip, motiv:c.motiv||'' })} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>Editează</button>
                )}
                <button onClick={()=>delCerere(c.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AchizitiiTab({ achizitii, setAchizitii, persist }) {
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const [form, setForm] = useState(null);

  const save = () => {
    if (!form.furnizor.trim() && !form.descriere.trim()) return;
    const next = achizitii.some((x)=>x.id===form.id) ? achizitii.map((x)=>x.id===form.id?form:x) : [form, ...achizitii];
    setAchizitii(next); persist('achizitii', next);
    setForm(null);
  };
  const del = (id) => {
    if (!window.confirm('Ștergi definitiv această achiziție?')) return;
    const next = achizitii.filter((x)=>x.id!==id);
    setAchizitii(next); persist('achizitii', next);
  };
  const setStatus = (id, status) => {
    const next = achizitii.map((x)=> x.id===id ? {...x, status} : x);
    setAchizitii(next); persist('achizitii', next);
  };
  const total = achizitii.reduce((s,a)=>s+(Number(a.suma)||0),0);

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>🛒 Achiziții</h2>
        {!form && <button onClick={()=>setForm({ id: uid(), data: new Date().toISOString().slice(0,10), furnizor:'', descriere:'', suma:0, status: ACHIZITIE_STATUSES[0] })} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Achiziție nouă</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'#5C6570' }}>Achiziții și comenzi ale firmei (unelte, echipamente, servicii etc.).</p>

      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <RoCalendarPicker value={form.data} onChange={(v)=>setForm({...form, data:v})} />
          <input placeholder="Furnizor" value={form.furnizor} onChange={(e)=>setForm({...form, furnizor:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Descriere" value={form.descriere} onChange={(e)=>setForm({...form, descriere:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input type="number" placeholder="Sumă (lei)" value={form.suma} onChange={(e)=>setForm({...form, suma:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'#8B93A0', background:'#171C21' }}>Renunță</button>
            <button onClick={save} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
          </div>
        </div>
      )}

      {achizitii.length > 0 && (
        <div className="flex justify-end mb-2 text-sm" style={{ color:'#8B93A0' }}>Total: <span style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(total)}</span></div>
      )}
      {achizitii.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'#8B93A0' }}>Nicio achiziție înregistrată.</div>
      ) : (
        <div className="space-y-2">
          {achizitii.map((a)=>(
            <div key={a.id} className="rounded-xl p-3 flex items-center justify-between gap-2" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
              <div className="min-w-0">
                <div className="text-sm" style={{ color:'#E9E7E2' }}>{a.furnizor}{a.furnizor && a.descriere ? ' — ' : ''}{a.descriere}</div>
                <div className="text-xs mt-0.5" style={{ color:'#8B93A0' }}>{fmtData(a.data)} · {money(a.suma)}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <select value={a.status} onChange={(e)=>setStatus(a.id, e.target.value)} className="text-xs rounded-lg px-2 py-1 outline-none" style={inputStyle}>
                  {ACHIZITIE_STATUSES.map((s)=><option key={s} value={s} style={{ background:'#1B2127' }}>{s}</option>)}
                </select>
                <button onClick={()=>setForm(a)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>Editează</button>
                <button onClick={()=>del(a.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function UsersTab({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(null);
  const [formStatus, setFormStatus] = useState({ loading:false, error:'' });

  const loadUsers = async () => {
    setLoading(true);
    try {
      const res = await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) });
      const data = await res.json();
      setUsers(data.users || []);
    } catch { setUsers([]); }
    setLoading(false);
  };
  useEffect(() => { loadUsers(); }, []);

  const delUser = async (id) => {
    if (id === currentUser.id) { window.alert('Nu îți poți șterge propriul cont din listă.'); return; }
    if (!window.confirm('Ștergi definitiv acest cont? Persoana nu va mai putea intra în aplicație.')) return;
    await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', id }) });
    loadUsers();
  };

  const saveUser = async () => {
    if (!form.nume.trim() || !form.username.trim() || (!form.id && !form.password)) {
      setFormStatus({ loading:false, error:'Completează toate câmpurile.' });
      return;
    }
    if (form.cnp && !/^\d{13}$/.test(form.cnp)) {
      setFormStatus({ loading:false, error:'CNP-ul trebuie să aibă exact 13 cifre.' });
      return;
    }
    setFormStatus({ loading:true, error:'' });
    try {
      const payload = form.id
        ? { action:'update', id: form.id, nume: form.nume.trim(), username: form.username.trim(), rol: form.rol, telefon: form.telefon.trim(), cnp: form.cnp.trim(), newPassword: form.password || undefined }
        : { action:'register', nume: form.nume.trim(), username: form.username.trim(), password: form.password, rol: form.rol, telefon: form.telefon.trim(), cnp: form.cnp.trim() };
      const res = await authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'A eșuat.');
      setForm(null);
      setFormStatus({ loading:false, error:'' });
      loadUsers();
    } catch (e) {
      setFormStatus({ loading:false, error: e.message || 'A eșuat.' });
    }
  };

  const iconFor = (rol) => ROLES.find((r)=>r.id===rol)?.icon || '👤';
  const inputStyle = { background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' };
  const ZILE_SCURT = ['','ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];

  return (
    <div>
      <div className="flex justify-between items-center mb-1">
        <h2 className="text-lg" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>Utilizatori</h2>
        {!form && <button onClick={()=>{ setForm({ nume:'', username:'', password:'', rol:'Electrician', telefon:'', cnp:'' }); setFormStatus({ loading:false, error:'' }); }} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}><Icon>+</Icon> Adaugă utilizator</button>}
      </div>
      <p className="text-xs mb-4" style={{ color:'#5C6570' }}>Conturile care pot intra în aplicație.</p>

      {form && (
        <div className="rounded-xl p-4 mb-4 space-y-2 max-w-sm" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
          <input placeholder="Nume complet" value={form.nume} onChange={(e)=>setForm({...form, nume:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Username" value={form.username} onChange={(e)=>setForm({...form, username:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input type="text" placeholder={form.id ? 'Parolă nouă (lasă gol ca să nu o schimbi)' : 'Parolă standard'} value={form.password} onChange={(e)=>setForm({...form, password:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="Telefon (opțional)" value={form.telefon} onChange={(e)=>setForm({...form, telefon:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
          <input placeholder="CNP (opțional, 13 cifre — pentru ziua de naștere)" value={form.cnp} onChange={(e)=>setForm({...form, cnp:e.target.value.replace(/\D/g,'').slice(0,13)})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ ...inputStyle, fontFamily:"'JetBrains Mono', monospace" }} />
          <div className="flex gap-2">
            {ROLES.map((r)=>(
              <button key={r.id} onClick={()=>setForm({...form, rol:r.id})} className="flex-1 text-sm px-3 py-2 rounded-lg font-medium flex items-center justify-center gap-1.5"
                style={{ color: form.rol===r.id?'#14181C':'#8B93A0', background: form.rol===r.id?'#2E8BD1':'#171C21' }}>
                <span>{r.icon}</span> {r.id}
              </button>
            ))}
          </div>
          {formStatus.error && <p className="text-xs" style={{ color:'#E05252' }}>{formStatus.error}</p>}
          <div className="flex justify-end gap-2 pt-1">
            <button onClick={()=>setForm(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ color:'#8B93A0', background:'#171C21' }}>Renunță</button>
            <button onClick={saveUser} disabled={formStatus.loading} className="px-3 py-1.5 rounded-lg text-sm font-medium disabled:opacity-50" style={{ color:'#14181C', background:'#2E8BD1' }}>{formStatus.loading ? '...' : (form.id ? 'Salvează modificările' : 'Creează cont')}</button>
          </div>
        </div>
      )}

      {loading ? (
        <div className="text-sm" style={{ color:'#8B93A0' }}>Se încarcă...</div>
      ) : users.length === 0 ? (
        <div className="text-center py-12 text-sm" style={{ color:'#8B93A0' }}>Niciun utilizator încă.</div>
      ) : (
        <div className="space-y-2">
          {users.map((u)=>{
            const nastere = nasterePeDinCnp(u.cnp);
            return (
            <div key={u.id} className="rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
              <div className="flex items-center gap-2">
                <span>{iconFor(u.rol)}</span>
                <div>
                  <div className="text-sm" style={{ color:'#E9E7E2' }}>{u.nume}{u.id===currentUser.id && <span className="text-xs ml-1" style={{ color:'#5C6570' }}>(tu)</span>}</div>
                  <div className="text-xs" style={{ color:'#8B93A0' }}>@{u.username} · {u.rol}{u.telefon && ` · 📞 ${u.telefon}`}{nastere && ` · 🎂 ${nastere.zi} ${ZILE_SCURT[nastere.luna]}`}</div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={()=>{ setForm({ id:u.id, nume:u.nume, username:u.username, password:'', rol:u.rol, telefon:u.telefon||'', cnp:u.cnp||'' }); setFormStatus({loading:false,error:''}); }} className="text-xs px-2 py-1 rounded-lg" style={{ color:'#8B93A0', background:'#171C21' }}>Editează</button>
                <button onClick={()=>delUser(u.id)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
              </div>
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Dashboard({ company, devize, offers, invoices, santiere, materials, cereriSantier, rapoarte, concedii, setTab, currentUser }) {
  const roleIcon = ROLES.find((r)=>r.id===currentUser?.rol)?.icon || '👤';

  const devizeActive = devize.filter((d)=>d.status!=='Semnat').length;
  const oferteTrimise = offers.filter((o)=>o.status==='Trimisă').length;
  const facturiNeplatite = invoices.filter((i)=>i.status==='Neplătită');
  const sumaNeplatita = facturiNeplatite.reduce((s,i)=>s+calcSubtotal(i.items)*(1+(Number(i.tva)||0)/100),0);
  const santiereActive = santiere.filter((s)=>s.status==='Activ').length;
  const azi = new Date().toISOString().slice(0,10);

  const isManager = currentUser?.rol === 'Manager';

  // --- Numar rapid "de facut", doar pentru bulina de pe teaser-ul spre Activitatea mea ---
  let totalDeFacut = 0;
  if (isManager) {
    totalDeFacut += materials.filter((m)=>!m.arhivat && Number(m.stoc) < Number(m.stocMinim)).length > 0 ? 1 : 0;
    totalDeFacut += new Set(cereriSantier.filter((c)=>c.status==='Cerută').map((c)=>c.santierId)).size;
    totalDeFacut += santiere.filter((s)=> s.status==='Activ' && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)).length;
    totalDeFacut += (concedii || []).filter((c)=>c.status==='Cerut').length > 0 ? 1 : 0;
  } else {
    const santiereMele = santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id));
    totalDeFacut += santiereMele.filter((s)=> s.status==='Activ' && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi)).length;
  }

  // --- Felicitări: ziua de naștere (din CNP) și sărbători (Crăciun, Paște, Anul Nou) ---
  const [colegiUsers, setColegiUsers] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setColegiUsers(data.users || [])).catch(()=>{});
  }, []);
  const ZILE_FELICITARE = {
    '2026-01-01': '🎉 La mulți ani cu ocazia Anului Nou! Din partea Smart Electroconect, vă dorim un an plin de realizări!',
    '2026-04-12': '🐣 Hristos a Înviat! Paște fericit, din partea Smart Electroconect!',
    '2026-12-25': '🎄 Crăciun fericit! Din partea Smart Electroconect, vă dorim sărbători pline de liniște și bucurie!',
  };
  const aziDate = new Date();
  const aziISO = aziDate.toISOString().slice(0,10);
  const mesajSarbatoare = ZILE_FELICITARE[aziISO];
  const sarbatoriiZi = colegiUsers.filter((u)=>{
    const n = nasterePeDinCnp(u.cnp);
    return n && n.zi === aziDate.getDate() && n.luna === aziDate.getMonth()+1;
  });
  const esteWeekendLookahead = (aziDate.getDay() === 5 && aziDate.getHours() >= 17) || aziDate.getDay() === 6 || aziDate.getDay() === 0;

  const cards = isManager ? [
    { label:'Devize active', value: devizeActive, tab:'devize' },
    { label:'Oferte trimise', value: oferteTrimise, tab:'oferte' },
    { label:'Facturi neplătite', value: `${facturiNeplatite.length} · ${money(sumaNeplatita)}`, tab:'facturi' },
    { label:'Șantiere active', value: santiereActive, tab:'santiere' },
  ] : [
    { label:'Șantierele tale', value: santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id)).length, tab:'santiere' },
  ];

  const actions = isManager ? [
    { label:'+ Deviz nou', tab:'devize' },
    { label:'+ Ofertă nouă', tab:'oferte' },
    { label:'+ Client nou', tab:'clienti' },
    { label:'+ Raport șantier', tab:'santiere' },
  ] : [
    { label:'+ Raport șantier', tab:'santiere' },
  ];

  return (
    <div>
      <div className="flex items-start justify-between gap-3 mb-8 flex-wrap">
        <div className="flex items-center gap-3">
          <div>
            <div className="text-base" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif", fontWeight:600 }}>{company?.nume || 'Panou intern'}</div>
            <div className="text-xs" style={{ color:'#5C6570' }}>
              Bun venit înapoi, {currentUser?.nume} {roleIcon}
            </div>
            <div className="text-xs mt-0.5" style={{ color:'#2E8BD1' }}>
              {(() => {
                const ZILE_SAPT = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
                const LUNI_LUNG = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
                const acum = new Date();
                return `${ZILE_SAPT[acum.getDay()]}, ${acum.getDate()} ${LUNI_LUNG[acum.getMonth()]} ${acum.getFullYear()}`;
              })()}
            </div>
          </div>
        </div>

        {(mesajSarbatoare || sarbatoriiZi.length > 0 || esteWeekendLookahead) && (
          <div className="rounded-xl px-4 py-3 max-w-xs text-right" style={{
            background: sarbatoriiZi.length > 0 ? 'linear-gradient(135deg, #E9A23B, #E05252)' : 'linear-gradient(135deg, #2E8BD1, #4CAF7D)'
          }}>
            {sarbatoriiZi.length > 0 ? (
              <>
                <div style={{ fontSize:14, fontWeight:700, color:'#fff', lineHeight:1.3 }}>🎂 La mulți ani, {sarbatoriiZi.map((u)=>u.nume).join(' și ')}!</div>
                <div style={{ fontSize:11, color:'#fff', opacity:0.9, marginTop:2 }}>Din partea echipei {company?.nume || 'Smart Electroconect'}!</div>
              </>
            ) : mesajSarbatoare ? (
              <div style={{ fontSize:13, fontWeight:600, color:'#fff', lineHeight:1.3 }}>{mesajSarbatoare}</div>
            ) : (
              <div style={{ fontSize:14, fontWeight:600, color:'#fff' }}>🎉 Weekend fain!</div>
            )}
          </div>
        )}
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        {cards.map((c)=>(
          <button key={c.label} onClick={()=>setTab(c.tab)} className="text-left rounded-xl p-4" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
            <div className="text-xs mb-1" style={{ color:'#8B93A0' }}>{c.label}</div>
            <div className="text-lg font-medium" style={{ color:'#E9E7E2', fontFamily:"'JetBrains Mono', monospace" }}>{c.value}</div>
          </button>
        ))}
      </div>

      <button onClick={()=>setTab('activitate')} className="w-full text-left rounded-xl p-4 mb-6" style={{ background:'#1B2127', border:'1px solid #2A323B', borderLeft: totalDeFacut>0 ? '4px solid #E05252' : '4px solid #2A323B' }}>
        <div className="flex items-center justify-between">
          <span style={{ fontSize:15, fontWeight:700, color:'#E9E7E2' }}>
            {totalDeFacut > 0 ? `⚡ ${totalDeFacut} ${totalDeFacut===1?'lucru':'lucruri'} de făcut` : '✅ Nimic de făcut acum'}
          </span>
          <span style={{ color: totalDeFacut>0 ? '#E05252' : '#5C6570' }}>→</span>
        </div>
      </button>

      <div className="flex gap-2 flex-wrap">
        {actions.map((a)=>(
          <button key={a.label} onClick={()=>setTab(a.tab)} className="text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>{a.label}</button>
        ))}
      </div>
    </div>
  );
}

function ActivitateaMeaTab({ santiere, materials, cereriSantier, rapoarte, concedii, setTab, setPendingSiteNav, currentUser }) {
  const goToSite = (santierId, siteView) => { setPendingSiteNav({ santierId, siteView: siteView || 'rapoarte' }); setTab('santiere'); };

  const materialeSubStoc = materials.filter((m)=>!m.arhivat && Number(m.stoc) < Number(m.stocMinim));
  const cereriInAsteptare = cereriSantier.filter((c)=>c.status==='Cerută');
  const cereriInAsteptarePeSantier = Object.values(
    cereriInAsteptare.reduce((acc, c) => {
      if (!acc[c.santierId]) acc[c.santierId] = { santierId: c.santierId, count: 0 };
      acc[c.santierId].count += 1;
      return acc;
    }, {})
  );
  const azi = new Date().toISOString().slice(0,10);
  const oraAcum = new Date().getHours();
  const concediiInAsteptare = concedii ? concedii.filter((c)=>c.status==='Cerut') : [];
  const santiereActiveFaraRaportAzi = santiere.filter((s)=> s.status==='Activ' && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi));

  const isManager = currentUser?.rol === 'Manager';
  const [mementoOpen, setMementoOpen] = useState(false);
  const [santiereOpen, setSantiereOpen] = useState(false);
  const [cereriOpen, setCereriOpen] = useState(false);
  const [colegiUsers, setColegiUsers] = useState([]);
  useEffect(() => {
    authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
      .then((r)=>r.json()).then((data)=>setColegiUsers(data.users || [])).catch(()=>{});
  }, []);

  // --- Date specifice Electricianului: șantierele lui, memento raport, materiale cerute acolo ---
  const santiereMele = santiere.filter((s)=>inEchipa(s.echipa, currentUser?.id));
  const santiereFaraRaportAzi = santiereMele.filter((s)=> s.status==='Activ' && !rapoarte.some((r)=>r.santierId===s.id && r.data===azi));
  const idSantiereMele = new Set(santiereMele.map((s)=>s.id));
  const cereriLaSantiereleMele = cereriSantier.filter((c)=>idSantiereMele.has(c.santierId)).slice().reverse().slice(0,6);

  const nimicDeFacut = isManager
    ? materialeSubStoc.length === 0 && cereriInAsteptarePeSantier.length === 0 && santiereActiveFaraRaportAzi.length === 0 && concediiInAsteptare.length === 0
    : santiereFaraRaportAzi.length === 0 && santiereMele.length === 0 && cereriLaSantiereleMele.length === 0;

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>⚡ Activitatea mea</h2>
      <p className="text-xs mb-6" style={{ color:'#5C6570' }}>Tot ce ai de rezolvat sau de urmărit, într-un singur loc.</p>

      {isManager && (() => {
        const acum = new Date();
        const zi = acum.getDay();
        const ora = acum.getHours();
        let ziuaLabel = null, targetDate = null;
        if (zi >= 1 && zi <= 4) { ziuaLabel = 'Mâine'; targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 1); }
        else if (zi === 5 && ora >= 17) { ziuaLabel = 'Luni'; targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 3); }
        else if (zi === 0) { ziuaLabel = 'Luni'; targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 1); }
        if (!ziuaLabel) return null;
        const targetStr = `${String(targetDate.getDate()).padStart(2,'0')}.${String(targetDate.getMonth()+1).padStart(2,'0')}.${targetDate.getFullYear()}`;
        const santiereMaine = santiere
          .filter((s)=> s.status === 'Activ')
          .map((s)=>({ s, membri: echipaNormalizata(s.echipa).filter((e)=>e.status==='activ').map((e)=>colegiUsers.find((u)=>u.id===e.userId)?.nume).filter(Boolean) }));
        if (santiereMaine.length === 0) return null;
        return (
          <div className="mb-6">
            <div className="flex items-center gap-2 mb-3">
              <span className="rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5" style={{ background:'#2E8BD122', border:'1px solid #2E8BD166', fontSize:13, fontWeight:700, color:'#2E8BD1' }}>📅 {ziuaLabel} pe șantiere · {targetStr}</span>
            </div>
            <div className="space-y-2">
              {santiereMaine.map(({ s, membri })=>(
                <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl p-4" style={{ background:'#1B2127', border:'1px solid #2E8BD144', borderLeft:'4px solid #2E8BD1' }}>
                  <div className="flex items-center justify-between">
                    <span style={{ fontSize:16, fontWeight:700, color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>{s.nume}</span>
                    <span style={{ color:'#2E8BD1' }}>→</span>
                  </div>
                  <div className="text-xs mt-1" style={{ color:'#8B93A0' }}>{membri.length > 0 ? `👥 ${membri.join(', ')}` : '⚠ Fără echipă asignată'}</div>
                </button>
              ))}
            </div>
          </div>
        );
      })()}

      {nimicDeFacut && (
        <div className="text-center py-12 text-sm" style={{ color:'#8B93A0' }}>✅ Nimic de făcut acum.</div>
      )}

      {!isManager && oraAcum >= 17 && santiereFaraRaportAzi.length > 0 && (
        <div className="mb-6">
          <button onClick={()=>setMementoOpen(!mementoOpen)} className="w-full flex items-center justify-between rounded-xl px-4 py-3" style={{ background:'#1B2127', border:'1px solid #E05252' }}>
            <span className="text-sm font-medium" style={{ color:'#E05252' }}>⏰ {santiereFaraRaportAzi.length} {santiereFaraRaportAzi.length===1?'raport netrimis':'rapoarte netrimise'} azi</span>
            <span className="text-xs" style={{ color:'#E05252' }}>{mementoOpen ? 'Ascunde' : 'Arată tot'}</span>
          </button>
          {mementoOpen && (
            <div className="space-y-2 mt-2">
              {santiereFaraRaportAzi.map((s)=>(
                <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #E0525266' }}>
                  <span className="text-sm" style={{ color:'#E9E7E2' }}>Nu ai trimis raportul din {azi.split('-').reverse().join('/')} pentru „{s.nume}"</span>
                  <span style={{ color:'#E05252' }}>→</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {!isManager && (() => {
        const acum = new Date();
        const zi = acum.getDay();
        const ora = acum.getHours();
        // „Unde lucrezi mâine" apare doar după ora 16:00 (în timpul săptămânii).
        let ziuaLabel = null, targetDate = null;
        if (zi >= 1 && zi <= 4 && ora >= 16) {
          ziuaLabel = 'Mâine';
          targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 1);
        } else if (zi === 5 && ora >= 16) {
          ziuaLabel = 'Luni';
          targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 3);
        } else if (zi === 0) {
          ziuaLabel = 'Luni';
          targetDate = new Date(acum); targetDate.setDate(acum.getDate() + 1);
        }
        if (!ziuaLabel) return null;
        const targetDateStr = `${String(targetDate.getDate()).padStart(2,'0')}.${String(targetDate.getMonth()+1).padStart(2,'0')}.${targetDate.getFullYear()}`;

        const maineList = santiereMele
          .filter((s)=>s.status==='Activ' || s.status==='Pauză')
          .map((s)=>{
            const echipaS = echipaNormalizata(s.echipa);
            const eu = echipaS.find((e)=>e.userId===currentUser?.id);
            const santierInPauzaAzi = s.status === 'Pauză' && s.statusSchimbatLa === azi;
            const euInPauzaAzi = s.status === 'Activ' && eu?.status === 'pauza' && eu?.dataModificare === azi;
            const suntInPauza = santierInPauzaAzi || euInPauzaAzi;
            const activ = s.status === 'Activ' && eu?.status !== 'pauza';
            return { s, suntInPauza, activ, echipaS, eu };
          })
          .filter((x)=> x.activ || x.suntInPauza);
        if (maineList.length === 0) return null;
        const numeSantiereActive = maineList.filter((x)=>x.activ).map((x)=>x.s.nume);
        return (
        <div className="mb-6">
          <div className="flex items-center gap-2 mb-3 flex-wrap">
            <div className="rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5" style={{ background:'#2E8BD122', border:'1px solid #2E8BD166' }}>
              <span style={{ fontSize:13, fontWeight:700, color:'#2E8BD1' }}>📅 {ziuaLabel}, {targetDateStr}</span>
            </div>
            {numeSantiereActive.length > 0 && (
              <span className="text-sm" style={{ color:'#E9E7E2' }}>
                Lucrezi în {numeSantiereActive.length===1 ? 'șantierul' : 'șantierele'} <b>{numeSantiereActive.join(', ')}</b>
              </span>
            )}
          </div>
          <div className="space-y-2">
            {maineList.map(({ s, suntInPauza, activ, echipaS })=>{
              const colegiActivi = activ
                ? echipaS.filter((e)=>e.status==='activ' && e.userId!==currentUser?.id).map((e)=>colegiUsers.find((u)=>u.id===e.userId)?.nume).filter(Boolean)
                : [];
              const culoare = suntInPauza ? '#E9A23B' : '#4CAF7D';
              return (
                <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl p-4" style={{ background:'#1B2127', border: `1px solid ${culoare}66`, borderLeft: `4px solid ${culoare}` }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="inline-flex items-center gap-1 text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded" style={{ color:'#14181C', background: culoare }}>
                      {suntInPauza ? '⏸ Nu lucrezi' : '✅ Lucrezi'}
                    </span>
                    <span style={{ color: culoare }}>→</span>
                  </div>
                  <div style={{ fontSize:19, fontWeight:700, color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>{s.nume}</div>
                  {activ && (s.adresa || colegiActivi.length > 0) && (
                    <div className="text-xs mt-2" style={{ color:'#8B93A0' }}>
                      {s.adresa && (
                        <a href={mapsUrl(s)} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()} className="inline-flex items-center gap-1" style={{ color:'#2E8BD1' }}>📍 {s.adresa}</a>
                      )}
                      {colegiActivi.length > 0 && <div className="mt-0.5">👥 {colegiActivi.join(', ')}</div>}
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
        );
      })()}

      {!isManager && (
        <div className="mb-6">
          <button onClick={()=>setSantiereOpen(!santiereOpen)} className="w-full flex items-center justify-between rounded-xl px-4 py-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
            <span className="text-sm font-medium" style={{ color:'#E9E7E2' }}>🏗 Șantierele tale ({santiereMele.length})</span>
            <span className="text-xs" style={{ color:'#8B93A0' }}>{santiereOpen ? 'Ascunde' : 'Arată tot'}</span>
          </button>
          {santiereOpen && (
            santiereMele.length === 0 ? (
              <p className="text-sm mt-2" style={{ color:'#5C6570' }}>Nu ești asignat la niciun șantier încă.</p>
            ) : (
              <div className="space-y-2 mt-2">
                {santiereMele.map((s)=>(
                  <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
                    <span className="text-sm" style={{ color:'#E9E7E2' }}>{s.nume} <span className="text-xs ml-2" style={{ color: s.status==='Activ'?'#4CAF7D':s.status==='Pauză'?'#E9A23B':'#8B93A0' }}>{s.status}</span></span>
                    <span style={{ color:'#5C6570' }}>→</span>
                  </button>
                ))}
              </div>
            )
          )}
        </div>
      )}

      {!isManager && cereriLaSantiereleMele.length > 0 && (
        <div className="mb-6">
          <button onClick={()=>setCereriOpen(!cereriOpen)} className="w-full flex items-center justify-between rounded-xl px-4 py-3" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
            <span className="text-sm font-medium" style={{ color:'#E9E7E2' }}>📥 Materiale cerute ({cereriLaSantiereleMele.length})</span>
            <span className="text-xs" style={{ color:'#8B93A0' }}>{cereriOpen ? 'Ascunde' : 'Arată tot'}</span>
          </button>
          {cereriOpen && (
            <div className="space-y-2 mt-2">
              {cereriLaSantiereleMele.map((c)=>{
                const santierNume = santiere.find((s)=>s.id===c.santierId)?.nume || '—';
                return (
                  <button key={c.id} onClick={()=>goToSite(c.santierId, 'materiale')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
                    <span className="text-sm" style={{ color:'#E9E7E2' }}>{c.denumire} — {c.cantitate} {c.um} <span className="text-xs ml-1" style={{ color:'#8B93A0' }}>{santierNume}</span></span>
                    <span className="text-xs" style={{ color: c.status==='Livrată'?'#4CAF7D':c.status==='Aprobată'?'#2E8BD1':c.status==='Respinsă'?'#E05252':'#E9A23B' }}>{c.status}</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      )}

      {isManager && (materialeSubStoc.length > 0 || cereriInAsteptarePeSantier.length > 0 || santiereActiveFaraRaportAzi.length > 0 || concediiInAsteptare.length > 0) && (
        <div className="mb-6">
          <div className="text-xs uppercase tracking-wider mb-2" style={{ color:'#8B93A0' }}>Atenționări</div>

          {materialeSubStoc.length > 0 && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E05252' }}>🔧 Materiale</div>
              <button onClick={()=>setTab('gestiune')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #E0525266' }}>
                <span className="text-sm" style={{ color:'#E9E7E2' }}>{materialeSubStoc.length} materiale sub stocul minim</span>
                <span style={{ color:'#E05252' }}>→</span>
              </button>
            </div>
          )}

          {(cereriInAsteptarePeSantier.length > 0 || santiereActiveFaraRaportAzi.length > 0) && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E05252' }}>🏗 Șantiere</div>
              <div className="space-y-1.5">
                {cereriInAsteptarePeSantier.map((g)=>{
                  const santierNume = santiere.find((s)=>s.id===g.santierId)?.nume || '—';
                  return (
                    <button key={g.santierId} onClick={()=>goToSite(g.santierId, 'materiale')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #E0525266' }}>
                      <span className="text-sm" style={{ color:'#E9E7E2' }}>{g.count} {g.count===1?'cerere':'cereri'} de materiale în așteptare — {santierNume}</span>
                      <span style={{ color:'#E05252' }}>→</span>
                    </button>
                  );
                })}
                {santiereActiveFaraRaportAzi.map((s)=>(
                  <button key={s.id} onClick={()=>goToSite(s.id, 'rapoarte')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #E0525266' }}>
                    <span className="text-sm" style={{ color:'#E9E7E2' }}>Niciun raport trimis azi — {s.nume}</span>
                    <span style={{ color:'#E05252' }}>→</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {concediiInAsteptare.length > 0 && (
            <div className="mb-3">
              <div className="text-[11px] uppercase tracking-wider mb-1" style={{ color:'#E05252' }}>🏖 Concedii</div>
              <button onClick={()=>setTab('concedii')} className="w-full text-left rounded-xl px-4 py-3 flex items-center justify-between" style={{ background:'#1B2127', border:'1px solid #E0525266' }}>
                <span className="text-sm" style={{ color:'#E9E7E2' }}>{concediiInAsteptare.length} {concediiInAsteptare.length===1?'cerere':'cereri'} de concediu în așteptare de aprobare</span>
                <span style={{ color:'#E05252' }}>→</span>
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CompanyTab({ company, setCompany, persist }) {
  const [form, setForm] = useState(company);
  useEffect(()=>setForm(company), [company]);
  const save = () => { setCompany(form); persist('company', form); };
  const fields = [['nume','Denumire firmă'],['cui','CUI'],['regCom','Nr. Registrul Comerțului'],['adresa','Adresă sediu'],['iban','IBAN'],['email','E-mail'],['telefon','Telefon'],['administrator','Administrator (nume)']];
  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>Firma mea</h2>
      <p className="text-xs mb-4" style={{ color:'#8B93A0' }}>Aceste date apar ca emitent pe fiecare document exportat în PDF.</p>
      <div className="rounded-xl p-4 space-y-2 max-w-md" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
        {fields.map(([f,label])=>(
          <input key={f} placeholder={label} value={form[f]||''} onChange={(e)=>setForm({...form, [f]:e.target.value})} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' }} />
        ))}
        <div className="flex justify-end pt-2">
          <button onClick={save} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>Salvează</button>
        </div>
      </div>
    </div>
  );
}
