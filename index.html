// --- Deviz pe TARIF ORAR generat din rapoartele zilnice ale unui șantier ---
// Tabel: DATA · NR PERSOANE · NR ORE/PERS · TOTAL ORE · PREȚ UNITAR · VALOARE.
// Antetul (Executant / Beneficiar / Contract / Obiectiv) vine din setările șantierului (Etapa 1).
function devizOrarPageHtml({ santier, company, rapoarte, nr, data, includeLucrari }) {
  const tarif = Number(santier?.tarifOrar) || 75;
  const tva = 21;
  const zile = (rapoarte || [])
    .filter((r)=> (r.persoane || []).some((p)=> p.nume && String(p.nume).trim()))
    .slice().sort((a,b)=> (a.data < b.data ? -1 : 1));
  let totalOreGeneral = 0;
  // Pe fiecare zi grupăm oamenii după numărul de ore lucrate: dacă 5 au făcut 8h și 1 a făcut 6h,
  // ies două rânduri curate (5×8 și 1×6), cu total exact — nu o medie ciudată.
  const rowsArr = [];
  let idx = 0;
  zile.forEach((r)=>{
    const pv = r.persoane.filter((p)=> p.nume && String(p.nume).trim());
    const lucrariZi = includeLucrari ? (r.tipuriLucrari || []).map((t)=>String(t.denumire||'').trim()).filter(Boolean).join(', ') : '';
    const grupe = {};
    pv.forEach((p)=>{ const oreP = personMinutes(p) / 60; const k = oreP.toFixed(2); grupe[k] = (grupe[k] || 0) + 1; });
    let firstOfDay = true;
    Object.keys(grupe).sort((a,b)=> Number(b) - Number(a)).forEach((k)=>{
      const ore = Number(k), nrPers = grupe[k];
      const totalOre = nrPers * ore;
      const valoare = totalOre * tarif;
      totalOreGeneral += totalOre;
      idx++;
      const lucrariCell = includeLucrari ? `<td style="text-align:left">${firstOfDay ? esc(lucrariZi) : ''}</td>` : '';
      rowsArr.push(`<tr><td>${idx}</td><td>${esc(fmtData(r.data))}</td>${lucrariCell}<td>${nrPers}</td><td>${ore.toFixed(2)}</td><td>${totalOre.toFixed(2)}</td><td>${esc(money(tarif))}</td><td>${esc(money(valoare))}</td></tr>`);
      firstOfDay = false;
    });
  });
  const rows = rowsArr.join('');
  const subtotal = totalOreGeneral * tarif;
  const tvaVal = subtotal * tva / 100;
  const total = subtotal + tvaVal;

  const benefLines = String(santier?.benefInfo || '').split('\n').map((l)=>l.trim()).filter(Boolean).map((l)=>`<div>${esc(l)}</div>`).join('');
  const dataDot = String(data).replace(/\//g,'.');
  const execCuiReg = [company?.cui ? `C.U.I ${esc(company.cui)}` : '', company?.regCom ? esc(company.regCom) : ''].filter(Boolean).join('&nbsp;&nbsp;&nbsp;&nbsp;');

  return `<div class="print-page">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6mm; margin-bottom:2mm;">
      <div style="flex:1; font-size:10px; line-height:1.55;">
        <div style="font-weight:700;">EXECUTANT:</div>
        <div style="font-weight:700;">${esc(company?.nume) || '(completează datele firmei în „Firma mea")'}</div>
        ${company?.adresa?`<div>${esc(company.adresa)}</div>`:''}
        ${execCuiReg?`<div>${execCuiReg}</div>`:''}
        ${company?.email?`<div>e-mail: ${esc(company.email)}</div>`:''}
        ${company?.telefon?`<div>Tel: ${esc(company.telefon)}</div>`:''}
      </div>
      <div style="flex:0 0 auto; text-align:center; padding:0 2mm;">
        <img src="${window.location.origin}/logo.png" alt="Logo" style="height:80px; width:auto;" />
      </div>
      <div style="flex:1; font-size:10px; line-height:1.55; text-align:right;">
        <div style="font-weight:700;">BENEFICIAR:</div>
        <div style="font-weight:700;">${esc(santier?.benefNume) || '—'}</div>
        ${benefLines}
      </div>
    </div>

    <div style="text-align:center; margin:5mm 0 2mm;">
      <div style="font-weight:700; font-size:15px;">Deviz lucrări</div>
      <div style="font-size:12px; margin-top:1mm;">Nr. ${esc(nr)}/${esc(dataDot)}</div>
      ${santier?.contract?`<div style="font-size:11px; margin-top:1mm;">Contract Nr. ${esc(santier.contract)}</div>`:''}${santier?.actAditional?`<div style="font-size:11px; margin-top:1mm;">Act adițional Nr. ${esc(santier.actAditional)}</div>`:''}
    </div>

    <div style="font-size:11px; line-height:1.9; margin:4mm 0; padding-bottom:3mm; border-bottom:1px solid #ccc;">
      <div><b>Obiectiv:</b> ${esc(santier?.obiectiv || '')}</div>

      <div><b>Lucrare:</b> ${esc(santier?.lucrare || 'Instalații electrice interioare')}</div>
    </div>

    <table class="pp-table"><thead><tr><th>Nr. crt</th><th>Data</th>${includeLucrari?'<th style="text-align:left">Lucrări efectuate</th>':''}<th>Nr. persoane</th><th>Ore / pers.</th><th>Total ore</th><th>Preț unitar</th><th>Valoare</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="${includeLucrari?8:7}">Niciun raport în perioada selectată.</td></tr>`}</tbody>
      <tfoot><tr><td colspan="${includeLucrari?5:4}"></td><td style="font-weight:700">${totalOreGeneral.toFixed(2)}</td><td></td><td style="font-weight:700">${esc(money(subtotal))}</td></tr></tfoot>
    </table>

    <div class="pp-totals">
      <div class="pp-totals-row"><span>Total</span><span>${esc(money(subtotal))}</span></div>
      <div class="pp-totals-row"><span>TVA ${tva}%</span><span>${esc(money(tvaVal))}</span></div>

    <div class="pp-signatures">

function devizPozPageHtml({ santier, company, rapoarte, pozitii, dinLucrari, nr, data }) {
  const tva = 21;
  const normP = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const exec = {};
  if (dinLucrari) {
    // La șantierele cu structură, cantitățile vin din „Lucrări pe apartamente":
    // potrivim denumirea lucrării cu pozițiile importate (după nume).
    (rapoarte || []).forEach((r)=>{
      (r.lucrariApartamente || []).forEach((l)=>{
        lucrariDinRand(l).forEach((w)=>{
          const den = normP(w.denumire); if (!den) return;
          const poz = (pozitii || []).find((p)=>normP(p.denumire)===den);
          if (!poz) return;
          exec[poz.id] = (exec[poz.id] || 0) + (Number(w.cantitate) || 0);
        });
      });
    });
  } else {
    (rapoarte || []).forEach((r)=>{

        if (!pe.pozitieId) return;

        <img src="${window.location.origin}/logo.png" alt="Logo" style="height:80px; width:auto;" />

    <div style="text-align:center; margin:5mm 0 2mm;">

function devizMatPageHtml({ santier, company, rapoarte, materialeLista, materials, materialClient, realExecutat, dinLucrari, nr, data }) {
  const tva = 21;
  const norm = (s)=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  const grup = {};
  if (dinLucrari) {
    // La șantierele cu structură, cantitățile vin din „Lucrări pe apartamente":
    // luăm doar rândurile care se potrivesc cu lista de materiale/operațiuni importată.
    (rapoarte || []).forEach((r)=>{
      (r.lucrariApartamente || []).forEach((l)=>{
        lucrariDinRand(l).forEach((w)=>{
          const den = String(w.denumire||'').trim(); if (!den) return;
          const fromList = (materialeLista||[]).find((x)=>norm(x.denumire)===norm(den));
          if (!fromList) return;
          const key = norm(den)+'|'+norm(w.um||fromList.um);
          if (!grup[key]) grup[key] = { denumire:den, um:w.um||fromList.um||'buc', cantitate:0, pret:0 };
          grup[key].cantitate += Number(w.cantitate)||0;
        });
      });
    });
  } else {
    (rapoarte || []).forEach((r)=>{
      (r.materialeFolosite || []).forEach((m)=>{
        if (!m.denumire || !String(m.denumire).trim()) return;
        const key = norm(m.denumire)+'|'+norm(m.um);
        if (!grup[key]) grup[key] = { denumire:String(m.denumire).trim(), um:m.um||'buc', cantitate:0, pret:0 };
        grup[key].cantitate += Number(m.cantitate)||0;
        if (materialClient) { const p = Number(m.pret)||0; if (p>0) grup[key].pret = p; }
      });
    });
  }
  if (!materialClient) {
    Object.values(grup).forEach((g)=>{
      const fromList = (materialeLista||[]).find((x)=>norm(x.denumire)===norm(g.denumire));
      const fromCentral = (materials||[]).find((x)=>norm(x.denumire)===norm(g.denumire) && !x.arhivat);
      g.pret = Number(fromList?.pretUnitar) || Number(fromCentral?.pret) || 0;
    });
  }
  const items = Object.values(grup).filter((g)=>g.cantitate>0);
  let subtotal = 0;
  const rows = items.map((g,i)=>{ const val = g.cantitate*g.pret; subtotal += val; return `<tr><td>${i+1}</td><td style="text-align:left">${esc(g.denumire)}</td><td>${esc(g.um)}</td><td>${g.cantitate}</td><td>${esc(money(g.pret))}</td><td>${esc(money(val))}</td></tr>`; }).join('');
  const tvaVal = subtotal*tva/100, total = subtotal+tvaVal;
  const benefLines = String(santier?.benefInfo || '').split('\n').map((l)=>l.trim()).filter(Boolean).map((l)=>`<div>${esc(l)}</div>`).join('');
  const dataDot = String(data).replace(/\//g,'.');
  const execCuiReg = [company?.cui ? `C.U.I ${esc(company.cui)}` : '', company?.regCom ? esc(company.regCom) : ''].filter(Boolean).join('&nbsp;&nbsp;&nbsp;&nbsp;');
  return `<div class="print-page">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6mm; margin-bottom:2mm;">
      <div style="flex:1; font-size:10px; line-height:1.55;">
        <div style="font-weight:700;">EXECUTANT:</div>
        <div style="font-weight:700;">${esc(company?.nume) || '(completează datele firmei în „Firma mea")'}</div>
        ${company?.adresa?`<div>${esc(company.adresa)}</div>`:''}
        ${execCuiReg?`<div>${execCuiReg}</div>`:''}
        ${company?.email?`<div>e-mail: ${esc(company.email)}</div>`:''}
        ${company?.telefon?`<div>Tel: ${esc(company.telefon)}</div>`:''}
      </div>
      <div style="flex:0 0 auto; text-align:center; padding:0 2mm;">
        <img src="${window.location.origin}/logo.png" alt="Logo" style="height:80px; width:auto;" />
      </div>
      <div style="flex:1; font-size:10px; line-height:1.55; text-align:right;">
        <div style="font-weight:700;">BENEFICIAR:</div>
        <div style="font-weight:700;">${esc(santier?.benefNume) || '—'}</div>
        ${benefLines}
      </div>
    </div>
    <div style="text-align:center; margin:5mm 0 2mm;">
      <div style="font-weight:700; font-size:15px;">${realExecutat ? 'Deviz real executat' : 'Deviz materiale'}</div>
      <div style="font-size:12px; margin-top:1mm;">Nr. ${esc(nr)}/${esc(dataDot)}</div>
      ${santier?.contract?`<div style="font-size:11px; margin-top:1mm;">Contract Nr. ${esc(santier.contract)}</div>`:''}${santier?.actAditional?`<div style="font-size:11px; margin-top:1mm;">Act adițional Nr. ${esc(santier.actAditional)}</div>`:''}
    </div>
    <div style="font-size:11px; line-height:1.9; margin:4mm 0; padding-bottom:3mm; border-bottom:1px solid #ccc;">
      <div><b>Obiectiv:</b> ${esc(santier?.obiectiv || '')}</div>
      <div><b>Adresa:</b> ${esc(santier?.adresa || '')}</div>
      <div><b>Lucrare:</b> ${esc(santier?.lucrare || 'Instalații electrice interioare')}</div>
    </div>
    <table class="pp-table"><thead><tr><th>Nr. crt</th><th style="text-align:left">${realExecutat ? 'Denumire (operațiune / material)' : 'Denumire material'}</th><th>U.M.</th><th>Cantitate</th><th>${realExecutat ? 'Preț manoperă' : 'Preț unitar'}</th><th>Valoare</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6">${realExecutat ? 'Nicio cantitate raportată în perioada selectată.' : 'Niciun material folosit raportat în perioada selectată.'}</td></tr>`}</tbody>
    </table>
    <div class="pp-totals">
      <div class="pp-totals-row"><span>Total</span><span>${esc(money(subtotal))}</span></div>
      <div class="pp-totals-row"><span>TVA ${tva}%</span><span>${esc(money(tvaVal))}</span></div>
      <div class="pp-totals-row pp-totals-final"><span>Total cu TVA</span><span>${esc(money(total))}</span></div>
    </div>
    <div class="pp-signatures">
      <div class="pp-sign-col">
        <div class="pp-sign-label">Executant</div>
        <div>${esc(company?.nume) || ''}</div>
        ${company?.administrator ? `<div>${esc(company.administrator)}</div>` : ''}
        <img src="${company?.stampila || STAMPILA_EXECUTANT}" alt="" style="height:26mm; width:auto; display:block; margin:1mm 0 0;" />
      </div>
      <div class="pp-sign-col" style="text-align:right;">
        <div class="pp-sign-label">Beneficiar</div>
        <div>${esc(santier?.benefNume) || ''}</div>
        ${santier?.benefSemnatar ? `<div>${esc(santier.benefSemnatar)}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function App() {
  const [tab, setTab] = useState(null);
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      // Dacă amprenta/FaceID e activată pe acest dispozitiv, cerem deblocare la deschidere
      // (nu intrăm automat). Altfel, restaurăm sesiunea ca înainte.
      if (bioInrolat()) return null;
      const raw = localStorage.getItem('currentUser'); return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  });
  const handleAuth = async (payload) => {
    const res = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'A eșuat.');
    setAuthToken(data.token);
    setCurrentUser(data.user);
    try { localStorage.setItem('currentUser', JSON.stringify(data.user)); } catch {}
    bioActualizeazaSesiune(data.user, data.token);
  };
  // Deblocare cu amprentă/FaceID: restaurează sesiunea salvată local, fără parolă.
  const handleBioUnlock = async () => {
    const { user, token } = await bioDeblocheaza();
    setAuthToken(token);
    setCurrentUser(user);
    try { localStorage.setItem('currentUser', JSON.stringify(user)); } catch {}
  };
  const logout = (motiv) => {
    setAuthToken(null);
    setCurrentUser(null);
    try { localStorage.removeItem('currentUser'); } catch {}
    try { if (motiv) sessionStorage.setItem('logoutMotiv', motiv); } catch {}
  };
  // Securitate: după 5 minute fără activitate, cerem autentificarea din nou.
  // Datele rămân salvate (local + server) — nu se pierde nimic la delogare.
  useEffect(() => {
    if (!currentUser) return;
    let timer;
    const reset = () => { clearTimeout(timer); timer = setTimeout(() => logout('inactivitate'), 5 * 60 * 1000); };
    const eventList = ['mousemove','mousedown','keydown','touchstart','touchmove','scroll','click'];
    eventList.forEach((e)=>window.addEventListener(e, reset, { capture:true, passive:true }));
    reset();
    return () => { clearTimeout(timer); eventList.forEach((e)=>window.removeEventListener(e, reset, { capture:true })); };
  }, [currentUser]);

  // --- "Vezi ca" — doar Managerul real poate testa ce vede fiecare rol/utilizator, fără să se deloge. ---
  const [viewAsUserId, setViewAsUserId] = useState(null);
  const [allAppUsers, setAllAppUsers] = useState([]);
  useEffect(() => {
    if (currentUser?.rol === 'Manager') {
      authFetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'list' }) })
        .then((r)=>r.json()).then((data)=>setAllAppUsers(data.users || [])).catch(()=>{});
    }
  }, [currentUser]);
  const effectiveUser = (currentUser?.rol === 'Manager' && viewAsUserId)
    ? (allAppUsers.find((u)=>u.id===viewAsUserId) || currentUser)
    : currentUser;

  // Perioadă de test: colegii (non-Manager) pot FOLOSI doar Dashboard, Activitatea mea, Șantiere și Profil.
  // Restul taburilor de electrician le VĂD în meniu, dar deschid un mesaj „disponibil după test".
  const accesLimitat = PERIOADA_TEST && effectiveUser?.rol !== 'Manager';
  const TABURI_TEST = [null, 'activitate', 'santiere', 'profil'];
  const tabBlocatTest = accesLimitat && !!tab && !TABURI_TEST.includes(tab);

  const CONTAB_TABS = ['devize', 'oferte', 'facturi', 'clienti'];
  const [contabOpen, setContabOpen] = useState(false);
  const MATERIALE_TABS = ['gestiune', 'stocuri'];
  const [materialeOpen, setMaterialeOpen] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [clients, setClients] = useState([]);
  const [offers, setOffers] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [devize, setDevize] = useState([]);
  const [company, setCompany] = useState({});
  const [materials, setMaterials] = useState([]);
  const [stockMoves, setStockMoves] = useState([]);
  const [santiere, setSantiere] = useState([]);
  const [rapoarte, setRapoarte] = useState([]);
  const [etape, setEtape] = useState([]);
  const [sculeSantier, setSculeSantier] = useState([]);
  const [cereriSantier, setCereriSantier] = useState([]);
  const [miscariSantier, setMiscariSantier] = useState([]);
  const [planseSantier, setPlanseSantier] = useState([]);
  const [pendingSiteNav, setPendingSiteNav] = useState(null);
  const [concedii, setConcedii] = useState([]);
  const [achizitii, setAchizitii] = useState([]);
  const [pontajCorectii, setPontajCorectii] = useState([]);
  const [mediaSantier, setMediaSantier] = useState([]);
  const [structuraSantier, setStructuraSantier] = useState([]);
  const [pozitiiSantier, setPozitiiSantier] = useState([]);
  const [materialeListaSantier, setMaterialeListaSantier] = useState([]);
  const [offerForm, setOfferForm] = useState(null);
  const [invoiceForm, setInvoiceForm] = useState(null);
  const [devizPrefill, setDevizPrefill] = useState(null);

  const loadAllData = async (showSpinner) => {
    if (showSpinner) setLoading(true);
    // Întâi trimitem pe server ce e nesincronizat (creat offline), apoi încărcăm — ca să nu pierdem nimic.
    try { await syncQueue(); } catch {}
    try {
      setClients(await loadKey('clients', []));
      setOffers(await loadKey('offers', []));
      setInvoices(await loadKey('invoices', []));
      setDevize(await loadKey('devize', []));
      setCompany(await loadKey('company', {}));
      setMaterials(await loadKey('materials', []));
      setStockMoves(await loadKey('stockMoves', []));
      setSantiere(await loadKey('santiere', []));
      setRapoarte(await loadKey('rapoarte', []));
      setEtape(await loadKey('etape', []));
      setSculeSantier(await loadKey('sculeSantier', []));
      setCereriSantier(await loadKey('cereriSantier', []));
      setMiscariSantier(await loadKey('miscariSantier', []));
      setPlanseSantier(await loadKey('planseSantier', []));
      setMediaSantier(await loadKey('mediaSantier', []));
      setStructuraSantier(await loadKey('structuraSantier', []));
      setPozitiiSantier(await loadKey('pozitiiSantier', []));
      setMaterialeListaSantier(await loadKey('materialeListaSantier', []));
      setConcedii(await loadKey('concedii', []));
      setAchizitii(await loadKey('achizitii', []));
      setPontajCorectii(await loadKey('pontajCorectii', []));
      setError(null);
    } catch (e) {
      if (showSpinner) setError('Nu am putut încărca datele.');
    } finally {
      if (showSpinner) setLoading(false);
    }
  };

  useEffect(() => { loadAllData(true); }, []);

  // --- Offline: service worker + indicator „fără net / se sincronizează" ---
  const [online, setOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
  const [pendingCount, setPendingCount] = useState((typeof getPending === 'function') ? getPending().length : 0);
  useEffect(() => {
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    const upOnline = () => { setOnline(navigator.onLine); if (navigator.onLine) { syncQueue(); loadAllData(false); } };
    const upPending = () => setPendingCount(getPending().length);
    window.addEventListener('online', upOnline);
    window.addEventListener('offline', upOnline);
    window.addEventListener('offline-queue-change', upPending);
    const iv = setInterval(upPending, 4000);
    return () => { window.removeEventListener('online', upOnline); window.removeEventListener('offline', upOnline); window.removeEventListener('offline-queue-change', upPending); clearInterval(iv); };
  }, []);

  // Sincronizare in timp real: cand oricine salveaza ceva, primim un semnal instant
  // (prin Pusher) si reincarcam DOAR acea bucata de date - nu verificam constant.
  useEffect(() => {
    if (!currentUser || typeof Pusher === 'undefined') return;
    // Inlocuieste cele doua valori de mai jos cu cele din contul tau Pusher
    // (Channels app -> App Keys): "key" si "cluster". Sunt valori publice, e ok sa fie in cod.
    const pusherClient = new Pusher('fca0c2f943634978aa7a', { cluster: 'eu' });
    const channel = pusherClient.subscribe('firma-updates');
    const setters = {
      clients: (v)=>setClients(v ?? []),
      offers: (v)=>setOffers(v ?? []),
      invoices: (v)=>setInvoices(v ?? []),
      devize: (v)=>setDevize(v ?? []),
      company: (v)=>setCompany(v ?? {}),
      materials: (v)=>setMaterials(v ?? []),
      stockMoves: (v)=>setStockMoves(v ?? []),
      santiere: (v)=>setSantiere(v ?? []),
      rapoarte: (v)=>setRapoarte(v ?? []),
      etape: (v)=>setEtape(v ?? []),
      sculeSantier: (v)=>setSculeSantier(v ?? []),
      cereriSantier: (v)=>setCereriSantier(v ?? []),
      miscariSantier: (v)=>setMiscariSantier(v ?? []),
      planseSantier: (v)=>setPlanseSantier(v ?? []),
      mediaSantier: (v)=>setMediaSantier(v ?? []),
      structuraSantier: (v)=>setStructuraSantier(v ?? []),
      pozitiiSantier: (v)=>setPozitiiSantier(v ?? []),
      materialeListaSantier: (v)=>setMaterialeListaSantier(v ?? []),
      concedii: (v)=>setConcedii(v ?? []),
      achizitii: (v)=>setAchizitii(v ?? []),
      pontajCorectii: (v)=>setPontajCorectii(v ?? []),
    };
    channel.bind('data-changed', async (payload) => {
      const setter = setters[payload?.key];
      if (!setter) return;
      setter(await loadKey(payload.key, payload.key === 'company' ? {} : []));
    });
    return () => { pusherClient.unsubscribe('firma-updates'); pusherClient.disconnect(); };
  }, [currentUser]);

  const persist = async (key, value, isRetry) => {
    try {
      await saveKey(key, value);
      setError(null);
    } catch (e) {
      if (!isRetry) { await new Promise(r=>setTimeout(r,800)); return persist(key, value, true); }
      setError(`Salvarea pentru „${key}" a eșuat: ${e.message}`);
    }
  };

  const printOne = (kind) => (doc) => openPrintWindow([{ doc, kind, client: clients.find((c)=>c.id===doc.clientId), company }]);
  const sendInvoiceToSmartBill = async (invoice) => {
    const client = clients.find((c)=>c.id===invoice.clientId);
    const res = await authFetch('/api/smartbill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ invoice, client }),
    });

  };
  const printAll = (docs, kind) => openPrintWindow(docs.map((doc)=>({ doc, kind, client: clients.find((c)=>c.id===doc.clientId), company })));
  const printDevizOne = (doc) => openPrintWindow([{ doc, isDeviz: true, client: clients.find((c)=>c.id===doc.clientId), company }]);
  const printDevizAll = (docs) => openPrintWindow(docs.map((doc)=>({ doc, isDeviz: true, client: clients.find((c)=>c.id===doc.clientId), company })));

  // Scade automat materialele (după denumire) din stoc, când un deviz e emis sau o factură e creată.
  const deductStock = (items, refLabel) => {
    const unmatched = [];
    let nextMaterials = materials;
    const moves = [];
    (items || []).forEach((it) => {
      const idx = nextMaterials.findIndex((m) => m.denumire === it.denumire && !m.arhivat);
      const cant = Number(it.cantitate) || 0;
      if (idx === -1 || !cant) { if (idx === -1) unmatched.push(it.denumire); return; }
      nextMaterials = nextMaterials.map((m, i) => i === idx ? { ...m, stoc: (Number(m.stoc) || 0) - cant } : m);
      moves.push({ id: uid(), materialId: nextMaterials[idx].id, tip: 'iesire', cantitate: cant, nota: refLabel, data: new Date().toISOString().slice(0,10) });
    });
    if (moves.length > 0) {
      setMaterials(nextMaterials);
      persist('materials', nextMaterials);
      const nextMoves = [...moves, ...stockMoves];
      setStockMoves(nextMoves);
      persist('stockMoves', nextMoves);
    }
    return unmatched;
  };

  // Reface stocul (mișcare de intrare) pentru articole scăzute anterior — la ștergere, revenire la ciornă, sau editare.
  const reverseStock = (items, refLabel) => {
    let nextMaterials = materials;
    const moves = [];
    (items || []).forEach((it) => {
      const idx = nextMaterials.findIndex((m) => m.denumire === it.denumire && !m.arhivat);
      const cant = Number(it.cantitate) || 0;
      if (idx === -1 || !cant) return;
      nextMaterials = nextMaterials.map((m, i) => i === idx ? { ...m, stoc: (Number(m.stoc) || 0) + cant } : m);
      moves.push({ id: uid(), materialId: nextMaterials[idx].id, tip: 'intrare', cantitate: cant, nota: refLabel, data: new Date().toISOString().slice(0,10) });
    });
    if (moves.length > 0) {
      setMaterials(nextMaterials);
      persist('materials', nextMaterials);
      const nextMoves = [...moves, ...stockMoves];
      setStockMoves(nextMoves);
      persist('stockMoves', nextMoves);
    }
  };

  const nextNumber = (prefix, list) => {
    const year = new Date().getFullYear();
    const n = list.filter((d)=>d.numar?.includes(`${prefix}-${year}`)).length + 1;
    return `${prefix}-${year}-${String(n).padStart(3,'0')}`;
  };

  const saveOffer = (o) => {
    const withNumber = { ...o, numar: o.numar || nextNumber('OF', offers) };
    const next = offers.some((x)=>x.id===o.id) ? offers.map((x)=>x.id===o.id?withNumber:x) : [...offers, withNumber];
    setOffers(next); persist('offers', next); setOfferForm(null);
  };
  const deleteOffer = (id) => { if (!window.confirm('Ștergi definitiv această ofertă?')) return; const next = offers.filter((o)=>o.id!==id); setOffers(next); persist('offers', next); };
  const offerStatus = (id, status) => {
    const next = offers.map((o)=>o.id===id?{...o,status}:o);
    setOffers(next); persist('offers', next);
    if (status === 'Acceptată') {
      const offer = next.find((o)=>o.id===id);
      setTab('devize');
      setDevizPrefill({ clientId: offer.clientId, items: offer.items.map((it)=>({...it, id: uid()})), tva: offer.tva, offerId: offer.id });
    }
  };

  const exportConsumToDeviz = (items, santierNume) => {
    const itemsWithPrice = items.map((it) => {
      const mat = materials.find((m)=>m.denumire === it.denumire && !m.arhivat);
      return { id: uid(), denumire: it.denumire, um: it.um, cantitate: it.cantitate, pretUnitar: mat?.pret || 0, adaos: 0 };
    });
    setTab('devize');
    setDevizPrefill({ clientId: clients[0]?.id || '', items: itemsWithPrice, tva: 21, lucrare: santierNume ? `Materiale consumate — ${santierNume}` : '' });
  };

  // Aduce "materialele folosite" notate la rapoartele zilnice ale unui șantier într-un Deviz nou.
  // Cele proprii primesc preț din Gestiune (și se vor scădea automat la emiterea devizului).
  // Cele ale clientului intră doar informativ, fără să afecteze stocul — prețul se completează ulterior.
  const exportMaterialeFolositeToDeviz = (rapoarteSantier, santierNume) => {
    const toate = rapoarteSantier.flatMap((r)=>r.materialeFolosite || []);
    const grupate = {};
    toate.forEach((m)=>{
      if (!m.denumire?.trim()) return;
      const cheie = `${m.sursa}::${m.denumire}::${m.um}`;
      if (!grupate[cheie]) grupate[cheie] = { denumire: m.denumire, um: m.um, sursa: m.sursa, cantitate: 0 };
      grupate[cheie].cantitate += Number(m.cantitate) || 0;
    });
    const items = Object.values(grupate).map((m) => {
      if (m.sursa === 'client') {
        return { id: uid(), denumire: `(Client) ${m.denumire}`, um: m.um, cantitate: m.cantitate, pretUnitar: 0, adaos: 0 };
      }
      const mat = materials.find((mm)=>mm.denumire === m.denumire && !mm.arhivat);
      return { id: uid(), denumire: m.denumire, um: m.um, cantitate: m.cantitate, pretUnitar: mat?.pret || 0, adaos: 0 };
    });
    setTab('devize');
    setDevizPrefill({ clientId: clients[0]?.id || '', items, tva: 21, lucrare: santierNume ? `Materiale folosite — ${santierNume}` : '' });
  };

  // La o cerere nouă de materiale dintr-un șantier: creează materialul în Gestiune dacă nu există,
  // și scade cantitatea din stocul central (ca ieșire, către șantier).
  const proceseazaCerereMaterial = (denumire, um, cantitate, santierNume) => {
    let mat = materials.find((m) => m.denumire === denumire && !m.arhivat);
    let nextMaterials;
    if (!mat) {
      mat = { id: uid(), denumire, categorie: '', um, stoc: 0, stocMinim: 0, pret: 0, arhivat: false };
      nextMaterials = [...materials, mat];
    } else {
      nextMaterials = materials.slice();
    }
    nextMaterials = nextMaterials.map((m) => m.id === mat.id ? { ...m, stoc: (Number(m.stoc) || 0) - (Number(cantitate) || 0) } : m);
    setMaterials(nextMaterials);
    persist('materials', nextMaterials);
    const move = { id: uid(), materialId: mat.id, tip: 'iesire', cantitate: Number(cantitate) || 0, nota: `Cerere șantier: ${santierNume}`, data: new Date().toISOString().slice(0,10) };
    const nextMoves = [move, ...stockMoves];
    setStockMoves(nextMoves);
    persist('stockMoves', nextMoves);
  };


  const saveInvoice = (inv) => {
    const isNew = !invoices.some((x)=>x.id===inv.id);
    const withNumber = { ...inv, numar: inv.numar || nextNumber('FA', invoices) };
    let finalDoc = withNumber;
    if (isNew) {
      const unmatched = deductStock(inv.items, `Factură ${withNumber.numar}`);
      finalDoc = { ...withNumber, stocDedus: true, stocMesaj: unmatched.length ? `Nepotrivite în stoc: ${unmatched.join(', ')}` : 'Stoc actualizat automat.' };
    }
    const next = invoices.some((x)=>x.id===inv.id) ? invoices.map((x)=>x.id===inv.id?finalDoc:x) : [...invoices, finalDoc];
    setInvoices(next); persist('invoices', next); setInvoiceForm(null);
  };
  const deleteInvoice = (id) => {
    if (!window.confirm('Ștergi definitiv această factură?')) return;
    const inv = invoices.find((i)=>i.id===id);
    if (inv && inv.stocDedus) reverseStock(inv.items, `Ștergere factură ${inv.numar}`);
    const next = invoices.filter((i)=>i.id!==id); setInvoices(next); persist('invoices', next);
  };
  const invoiceStatus = (id, status) => { const next = invoices.map((i)=>i.id===id?{...i,status}:i); setInvoices(next); persist('invoices', next); };

  const convertToInvoice = (offer) => {
    setTab('facturi');
    setInvoiceForm({ id: uid(), clientId: offer.clientId, items: offer.items.map((it)=>({...it, id: uid()})), tva: offer.tva, offerId: offer.id });
  };

  const NavItem = ({ id, label }) => (
    <button onClick={()=>{ setTab(id); setSidebarOpen(false); }} className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: tab===id?'#14181C':'#B8BFC9', background: tab===id?'#2E8BD1':'transparent', fontWeight: tab===id?600:400 }}>{label}</button>
  );

  if (!currentUser) {
    return <LoginScreen onLogin={handleAuth} onBioUnlock={handleBioUnlock} />;
  }

  return (
    <div className="min-h-screen w-full" style={{ background:'#14181C', fontFamily:"'Inter', sans-serif" }}>
      <div className="curent-antet" aria-hidden="true" />
      {(!online || pendingCount > 0) && (
        <div style={{ position:'fixed', bottom:'12px', left:'12px', right:'12px', zIndex:9998, textAlign:'center' }}>
          <span style={{ display:'inline-block', padding:'8px 14px', borderRadius:'10px', fontSize:'13px', fontWeight:600,
            background: online ? '#1d3a52' : '#3a2a14', color: online ? '#9ad' : '#E9A23B', border:'1px solid '+(online?'#2E8BD166':'#E9A23B66'), boxShadow:'0 4px 14px rgba(0,0,0,.4)' }}>
            {!online ? '📴 Fără net — lucrezi offline, se salvează local.' : `🔄 Se sincronizează… (${pendingCount} în așteptare)`}
          </span>
        </div>
      )}
      <div className="md:hidden flex items-center justify-between px-3 py-2.5" style={{ borderBottom:'1px solid #2A323B' }}>
        <button onClick={()=>setSidebarOpen(true)} className="text-xl px-1" style={{ color:'#E9E7E2' }}>☰</button>
        <button onClick={()=>{ setTab(null); setSidebarOpen(false); }} title="Dashboard"><img src="/logo.png" alt="Logo" style={{ height:24, width:'auto' }} /></button>
        <div style={{ width:28 }} />
      </div>

      {sidebarOpen && (
        <div onClick={()=>setSidebarOpen(false)} className="md:hidden fixed inset-0" style={{ background:'rgba(0,0,0,0.6)', zIndex:40 }} />
      )}

      <div className="w-full flex">
      <aside className={`w-64 md:w-56 shrink-0 p-4 flex flex-col gap-1 fixed md:static inset-y-0 left-0 transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`} style={{ borderRight:'1px solid #2A323B', background:'#14181C', zIndex:50, overflowY:'auto' }}>
        <button onClick={()=>{ setTab(null); setSidebarOpen(false); }} className="flex items-center gap-2 px-2 mb-4">
          <img src="/logo.png" alt="Logo" style={{ height: 32, width: 'auto' }} />
        </button>
        {accesLimitat && <div className="px-3 mb-2 text-[11px]" style={{ color:'#8B93A0', background:'#1B2127', border:'1px solid #2A323B', borderRadius:8, padding:'8px 10px' }}>🧪 Perioadă de test — poți folosi <b style={{color:'#E9E7E2'}}>Șantiere, Activitatea mea, Dashboard, Profil</b>. Restul le vezi, dar se activează după test.</div>}
        <NavItem id={null} label="🏠 Dashboard" />
        <NavItem id="activitate" label="⚡ Activitatea mea" />
        <div style={{ height:1, background:'#2A323B', margin:'4px 4px 8px' }} />
        {effectiveUser.rol === 'Manager' && (
        <>
        <button onClick={()=>setContabOpen(!contabOpen)} className="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: CONTAB_TABS.includes(tab) ? '#2E8BD1' : '#B8BFC9', fontWeight:600 }}>
          <span>📊 Contabilitate</span>
          <span style={{ fontSize:10, transform: contabOpen ? 'rotate(90deg)' : 'none', display:'inline-block' }}>▶</span>
        </button>
        {contabOpen && (
          <div className="flex flex-col gap-1 pl-3">
            <NavItem id="devize" label="🧮 Devize" />
            <NavItem id="oferte" label="📄 Oferte" />
            <NavItem id="facturi" label="🧾 Facturi" />
            <NavItem id="clienti" label="👥 Clienți" />
          </div>
        )}
        </>
        )}
        <button onClick={()=>setMaterialeOpen(!materialeOpen)} className="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm w-full text-left" style={{ color: MATERIALE_TABS.includes(tab) ? '#2E8BD1' : '#B8BFC9', fontWeight:600 }}>
          <span>📦 Materiale</span>
          <span style={{ fontSize:10, transform: materialeOpen ? 'rotate(90deg)' : 'none', display:'inline-block' }}>▶</span>
        </button>
        {materialeOpen && (
          <div className="flex flex-col gap-1 pl-3">
            {effectiveUser.rol === 'Manager' && <NavItem id="gestiune" label="🗂 Gestiune" />}
            <NavItem id="stocuri" label="📈 Stocuri" />
          </div>
        )}
        <NavItem id="santiere" label="🏗 Șantiere" />
        <NavItem id="pontaj" label="🕐 Pontaj" />
        <NavItem id="concedii" label="🏖 Concedii" />
        {effectiveUser.rol === 'Manager' && <NavItem id="achizitii" label="🛒 Achiziții" />}
        <div style={{ height:1, background:'#2A323B', margin:'8px 4px' }} />
        {effectiveUser.rol === 'Manager' && <NavItem id="firma" label="⚙ Firma mea" />}
        <NavItem id="profil" label="👤 Profilul meu" />
        {effectiveUser.rol === 'Manager' && <NavItem id="utilizatori" label="🔑 Utilizatori" />}
        <div className="mt-auto pt-3" style={{ borderTop:'1px solid #2A323B' }}>
          {currentUser.rol === 'Manager' && (
            <div className="px-3 mb-2">
              <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color:'#5C6570' }}>🧪 Vezi ca (test)</div>
              <select value={viewAsUserId || ''} onChange={(e)=>{ setViewAsUserId(e.target.value || null); setTab(null); }} className="w-full text-xs rounded-lg px-2 py-1.5 outline-none" style={{ background:'#171C21', color:'#E9E7E2', border:'1px solid #2A323B' }}>
                <option value="">— tu (cont real) —</option>
                {allAppUsers.filter((u)=>u.id!==currentUser.id).map((u)=>(
                  <option key={u.id} value={u.id} style={{ background:'#1B2127' }}>{u.nume} ({u.rol})</option>
                ))}
              </select>
            </div>
          )}
          {viewAsUserId && (
            <div className="px-3 mb-2 text-[11px]" style={{ color:'#E9A23B' }}>
              ⚠ Vezi ca: {effectiveUser.nume} ({effectiveUser.rol})
            </div>
          )}
          <div className="flex items-center justify-between px-3 py-2 text-xs" style={{ color:'#8B93A0' }}>
            <span>{ROLES.find((r)=>r.id===currentUser.rol)?.icon} {currentUser.nume}</span>
            <button onClick={logout} style={{ color:'#E05252' }}>Ieși</button>
          </div>
          <div className="px-3 pb-1 text-[10px]" style={{ color:'#3d4650' }}>{APP_VERSION}</div>
        </div>
      </aside>
      <main className="flex-1 p-3 md:p-6 max-w-4xl w-full min-w-0">
        {loading ? (
          <div className="text-sm mt-10" style={{ color:'#8B93A0' }}>Se încarcă...</div>
        ) : !tab ? (
          <Dashboard company={company} devize={devize} offers={offers} invoices={invoices} santiere={santiere} materials={materials} cereriSantier={cereriSantier} rapoarte={rapoarte} concedii={concedii} setTab={setTab} currentUser={effectiveUser} />
        ) : tabBlocatTest ? (
          <div className="max-w-md mx-auto mt-16 text-center rounded-xl p-6" style={{ background:'#1B2127', border:'1px solid #2A323B' }}>
            <div style={{ fontSize:34 }}>🔒</div>
            <div className="text-base mt-2" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif", fontWeight:600 }}>Secțiune în pregătire</div>
            <p className="text-sm mt-2" style={{ color:'#8B93A0' }}>Această parte a aplicației se activează după perioada de test. Deocamdată poți lucra la <b style={{color:'#E9E7E2'}}>Șantiere</b>, <b style={{color:'#E9E7E2'}}>Activitatea mea</b>, <b style={{color:'#E9E7E2'}}>Dashboard</b> și <b style={{color:'#E9E7E2'}}>Profil</b>.</p>
            <button onClick={()=>setTab('santiere')} className="mt-4 text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Mergi la Șantiere</button>
          </div>
        ) : (
          <>
            {error && <div className="text-xs mb-4 px-3 py-2 rounded-lg" style={{ color:'#E05252', background:'#2A1518' }}>{error}</div>}

            {tab === 'devize' && (
              <DevizTab devize={devize} setDevize={setDevize} clients={clients} materials={materials} company={company} persist={persist} printOne={printDevizOne} printAll={printDevizAll} onEmis={(doc)=>deductStock(doc.items, `Deviz ${doc.numar}`)} onReverse={(doc)=>reverseStock(doc.items, `Anulare deviz ${doc.numar}`)} prefill={devizPrefill} onConsumePrefill={()=>setDevizPrefill(null)} />
            )}

            {tab === 'oferte' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>Oferte</h2>
                  <div className="flex items-center gap-2">
                    {offers.length>0 && <button onClick={()=>printAll(offers,'Ofertă')} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127', border:'1px solid #2A323B' }}>📚 Exportă toate în PDF</button>}
                    {!offerForm && <button onClick={()=>setOfferForm({})} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă ofertă</button>}
                  </div>
                </div>
                {offerForm && <DocForm kind="Ofertă" clients={clients} materials={materials} initial={offerForm.id?offerForm:null} onCancel={()=>setOfferForm(null)} onSave={saveOffer} />}
                <DocTable kind="Ofertă" docs={offers} clients={clients} statuses={OFFER_STATUSES} onEdit={setOfferForm} onDelete={deleteOffer} onStatusChange={offerStatus} onConvert={convertToInvoice} onPrint={printOne('Ofertă')} />
              </div>
            )}

            {tab === 'facturi' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg" style={{ color:'#E9E7E2', fontFamily:"'Space Grotesk', sans-serif" }}>Facturi</h2>
                  <div className="flex items-center gap-2">
                    {invoices.length>0 && <button onClick={()=>printAll(invoices,'Factură')} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg" style={{ color:'#8B93A0', background:'#1B2127', border:'1px solid #2A323B' }}>📚 Exportă toate în PDF</button>}
                    {!invoiceForm && <button onClick={()=>setInvoiceForm({})} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă factură</button>}
                  </div>
                </div>
                {invoiceForm && <DocForm kind="Factură" clients={clients} materials={materials} initial={invoiceForm.id?invoiceForm:null} onCancel={()=>setInvoiceForm(null)} onSave={saveInvoice} />}
                <DocTable kind="Factură" docs={invoices} clients={clients} statuses={INVOICE_STATUSES} onEdit={setInvoiceForm} onDelete={deleteInvoice} onStatusChange={invoiceStatus} onPrint={printOne('Factură')} onSmartBill={sendInvoiceToSmartBill} />
              </div>
            )}

            {tab === 'clienti' && <ClientsTab clients={clients} setClients={setClients} persist={persist} />}
            {(tab === 'gestiune' || tab === 'stocuri') && <MaterialsTab materials={materials} setMaterials={setMaterials} stockMoves={stockMoves} setStockMoves={setStockMoves} persist={persist} company={company} subTab={tab} />}

            {tab === 'santiere' && <SantiereTab santiere={santiere} setSantiere={setSantiere} rapoarte={rapoarte} setRapoarte={setRapoarte} etape={etape} setEtape={setEtape} persist={persist} company={company} materials={materials} sculeSantier={sculeSantier} setSculeSantier={setSculeSantier} cereriSantier={cereriSantier} setCereriSantier={setCereriSantier} miscariSantier={miscariSantier} setMiscariSantier={setMiscariSantier} planseSantier={planseSantier} setPlanseSantier={setPlanseSantier} mediaSantier={mediaSantier} setMediaSantier={setMediaSantier} structuraSantier={structuraSantier} setStructuraSantier={setStructuraSantier} pozitiiSantier={pozitiiSantier} setPozitiiSantier={setPozitiiSantier} materialeListaSantier={materialeListaSantier} setMaterialeListaSantier={setMaterialeListaSantier} clients={clients} onExportToDeviz={exportConsumToDeviz} onExportMaterialeFolosite={exportMaterialeFolositeToDeviz} onCerereMaterial={proceseazaCerereMaterial} currentUser={effectiveUser} pendingSiteNav={pendingSiteNav} setPendingSiteNav={setPendingSiteNav} />}
            {tab === 'firma' && <CompanyTab company={company} setCompany={setCompany} persist={persist} />}

            {tab === 'activitate' && <ActivitateaMeaTab santiere={santiere} materials={materials} cereriSantier={cereriSantier} rapoarte={rapoarte} concedii={concedii} setTab={setTab} setPendingSiteNav={setPendingSiteNav} currentUser={effectiveUser} />}

            {tab === 'pontaj' && <PontajTab rapoarte={rapoarte} santiere={santiere} currentUser={effectiveUser} pontajCorectii={pontajCorectii} setPontajCorectii={setPontajCorectii} persist={persist} company={company} concedii={concedii} />}

            {tab === 'concedii' && <ConcediiTab concedii={concedii} setConcedii={setConcedii} persist={persist} currentUser={effectiveUser} rapoarte={rapoarte} />}

            {tab === 'achizitii' && effectiveUser.rol === 'Manager' && <AchizitiiTab achizitii={achizitii} setAchizitii={setAchizitii} persist={persist} />}

            {tab === 'profil' && <ProfileTab currentUser={effectiveUser} onLogout={logout} />}

            {tab === 'utilizatori' && effectiveUser.rol === 'Manager' && <UsersTab currentUser={effectiveUser} />}
          </>
        )}
      </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
