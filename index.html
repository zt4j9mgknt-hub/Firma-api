function DevizTab({ devize, setDevize, clients, materials, company, persist, printOne, printAll, onEmis, onReverse, prefill, onConsumePrefill }) {
  const [form, setForm] = useState(prefill || null);

  useEffect(() => {
    if (prefill) {
      setForm(prefill);
      onConsumePrefill();
    }
  }, [prefill]);

  const nextNumber = (list) => {
    const year = new Date().getFullYear();
    const n = list.filter((d)=>d.numar?.includes(`DEV-${year}`)).length + 1;
    return `DEV-${year}-${String(n).padStart(3,'0')}`;
  };

  const save = (d) => {
    const withNumber = { ...d, numar: d.numar || nextNumber(devize) };
    const original = devize.find((x)=>x.id===d.id);
    let finalDoc = withNumber;
    if (original && original.stocDedus) {
      onReverse(original);
      const unmatched = onEmis(withNumber);
      finalDoc = { ...withNumber, stocDedus: true, stocMesaj: unmatched.length ? `Nepotrivite în stoc: ${unmatched.join(', ')}` : 'Stoc actualizat automat.' };
    }
    const next = devize.some((x)=>x.id===d.id) ? devize.map((x)=>x.id===d.id?finalDoc:x) : [...devize, finalDoc];
    setDevize(next); persist('devize', next); setForm(null);
  };
  const del = (id) => {
    if (!window.confirm('Ștergi definitiv acest deviz?')) return;
    const doc = devize.find((d)=>d.id===id);
    if (doc && doc.stocDedus) onReverse(doc);
    const next = devize.filter((d)=>d.id!==id); setDevize(next); persist('devize', next);
  };
  const setStatus = (id, status) => {
    const doc = devize.find((d)=>d.id===id);
    let extra = {};
    if (status === 'Emis' && doc && !doc.stocDedus) {
      const unmatched = onEmis(doc);
      extra = { stocDedus: true, stocMesaj: unmatched.length ? `Nepotrivite în stoc: ${unmatched.join(', ')}` : 'Stoc actualizat automat.' };
    } else if (status === 'Ciornă' && doc && doc.stocDedus) {
      onReverse(doc);
      extra = { stocDedus: false, stocMesaj: 'Stoc restaurat (revenire la ciornă).' };
    }
    const next = devize.map((d)=>d.id===id?{...d,status,...extra}:d);
    setDevize(next); persist('devize', next);
  };
  const clientName = (id) => clients.find((c)=>c.id===id)?.nume || '—';

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h2 className="text-lg" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>Devize</h2>
        <div className="flex items-center gap-2">
          {devize.length>0 && <button onClick={()=>printAll(devize)} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel)', border:'1px solid var(--border)' }}>📚 Exportă toate în PDF</button>}
          {!form && <button onClick={()=>setForm({})} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Deviz nou</button>}
        </div>
      </div>

      {form && <DevizForm clients={clients} materials={materials} initial={form} onCancel={()=>setForm(null)} onSave={save} />}

      {devize.length === 0 && !form ? (
        <div className="text-center py-12 text-sm" style={{ color:'var(--muted)' }}>Niciun deviz încă. Apasă „Deviz nou" pentru a crea primul.</div>
      ) : (
        <div className="space-y-2">
          {devize.slice().sort((a,b)=>a.numar<b.numar?1:-1).map((d)=>{
            const total = calcSubtotal(d.items) * (1 + d.tva/100);
            return (
              <div key={d.id} className="rounded-xl px-4 py-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
                <div className="flex items-center justify-between gap-4">
                  <div className="flex flex-col gap-0.5 min-w-0">
                    <span className="text-sm font-medium truncate" style={{ color:'var(--text)', fontFamily:"'JetBrains Mono', monospace" }}>{d.numar}</span>
                    <span className="text-xs truncate" style={{ color:'var(--muted)' }}>{clientName(d.clientId)} · {d.data}{d.lucrare ? ` · ${d.lucrare}` : ''}</span>
                  </div>
                  <span className="text-sm shrink-0" style={{ color:'#2E8BD1', fontFamily:"'JetBrains Mono', monospace" }}>{money(total)}</span>
                  <div className="shrink-0"><StatusSwitch status={d.status} options={DEVIZ_STATUSES} onChange={(s)=>setStatus(d.id,s)} /></div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={()=>printOne(d)} className="text-xs px-2 py-1 rounded-lg flex items-center gap-1" style={{ color:'var(--muted)', background:'var(--panel2)' }}><Icon>🖨</Icon> PDF</button>
                    <button onClick={()=>setForm(d)} className="text-xs px-2 py-1 rounded-lg" style={{ color:'var(--muted)', background:'var(--panel2)' }}>Editează</button>
                    <button onClick={()=>del(d.id)} style={{ color:'#E05252' }}><Icon>🗑</Icon></button>
                  </div>
                </div>
                {d.stocMesaj && (
                  <div className="text-xs mt-2" style={{ color: d.stocMesaj.startsWith('Nepotrivite') ? '#E9A23B' : '#4CAF7D' }}>{d.stocMesaj}</div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const SANTIER_STATUSES = ['Activ', 'Pauză', 'Finalizat'];

function SiteAlertsPanel({ santierId, categorie, categorieLabel, alerte, setAlerte, persist, itemOptions }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [denumire, setDenumire] = useState('');
  const [descriere, setDescriere] = useState('');
  const alerteAici = alerte.filter((a)=>a.santierId===santierId && a.categorie===categorie);
  const alerteActive = alerteAici.filter((a)=>a.status==='Nouă');

  const addAlerta = () => {
    if (!denumire.trim() || !descriere.trim()) return;
    const next = [...alerte, { id: uid(), santierId, categorie, denumire: denumire.trim(), descriere: descriere.trim(), data: new Date().toISOString().slice(0,10), status:'Nouă' }];
    setAlerte(next); persist('alerteSantier', next); setDenumire(''); setDescriere('');
  };
  const rezolva = (id) => {
    const next = alerte.map((a)=>a.id===id?{...a, status:'Rezolvată'}:a);
    setAlerte(next); persist('alerteSantier', next);
  };
  const delAlerta = (id) => { if (!window.confirm('Ștergi această alertă?')) return; const next = alerte.filter((a)=>a.id!==id); setAlerte(next); persist('alerteSantier', next); };

  return (
    <div className="rounded-xl p-3" style={{ background: alerteActive.length ? 'rgba(224,82,82,.12)' : 'var(--panel)', border:`1px solid ${alerteActive.length?'#E0525266':'var(--border)'}` }}>
      <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>⚠ Sesizări {categorieLabel}{alerteActive.length>0 && <span style={{ color:'#E05252' }}> ({alerteActive.length} deschise)</span>}</div>
      <div className="flex gap-2 mb-2 flex-wrap">
        {itemOptions && itemOptions.length > 0 ? (
          <select value={denumire} onChange={(e)=>setDenumire(e.target.value)} className="rounded-lg px-3 py-1.5 text-sm outline-none" style={inputStyle}>
            <option value="">Alege...</option>
            {itemOptions.map((o)=><option key={o} value={o} style={{ background:'var(--panel)' }}>{o}</option>)}
          </select>
        ) : (
          <input placeholder="Denumire" value={denumire} onChange={(e)=>setDenumire(e.target.value)} className="rounded-lg px-3 py-1.5 text-sm outline-none w-40" style={inputStyle} />
        )}
        <input placeholder="Ce s-a întâmplat?" value={descriere} onChange={(e)=>setDescriere(e.target.value)} className="flex-1 rounded-lg px-3 py-1.5 text-sm outline-none min-w-[140px]" style={inputStyle} />
        <button onClick={addAlerta} className="text-xs px-3 py-1.5 rounded-lg font-medium" style={{ color:'#14181C', background:'#E05252' }}>🚨 Sesizează</button>
      </div>
      {alerteAici.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Nicio problemă raportată.</div> : (
        <div className="space-y-1">
          {alerteAici.slice().sort((a,b)=> (a.status==='Nouă'?0:1) - (b.status==='Nouă'?0:1)).map((a)=>(
            <div key={a.id} className="flex items-center justify-between text-xs px-2 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
              <span style={{ color: a.status==='Nouă' ? 'var(--text)' : 'var(--muted2)' }}>
                <b>{a.denumire}</b> — {a.descriere} <span style={{ color:'var(--muted2)' }}>({fmtData(a.data)})</span>
              </span>
              <div className="flex items-center gap-2">
                <span style={{ color: a.status==='Nouă'?'#E05252':'#4CAF7D' }}>{a.status}</span>
                {a.status==='Nouă' && <button onClick={()=>rezolva(a.id)} className="px-2 py-0.5 rounded" style={{ color:'#14181C', background:'#4CAF7D' }}>Rezolvată</button>}
                <button onClick={()=>delAlerta(a.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Fisierele merg direct din telefon catre Vercel Blob (nu mai trec prin serverul
// nostru), deci nu mai suntem limitati la ~3MB - pana la 200MB per fisier.
const MAX_UPLOAD_SIZE = 200 * 1024 * 1024; // 200MB

async function uploadFileToBlob(file, folder) {
  if (file.size > MAX_UPLOAD_SIZE) {
    throw new Error(`„${file.name}" e prea mare (${(file.size/1024/1024).toFixed(0)}MB). Limita e 200MB per fișier.`);
  }
  if (!window.__vercelBlobUpload) {
    throw new Error('Componenta de încărcare nu s-a încărcat încă — așteaptă o clipă și încearcă din nou.');
  }
  const pathname = `${folder}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
  const handleUploadUrl = `/api/blob-upload?token=${encodeURIComponent(AUTH_TOKEN || '')}`;
  try {
    const blob = await window.__vercelBlobUpload(pathname, file, {
      access: 'private',
      handleUploadUrl,
    });
    return { url: blob.url, pathname: blob.pathname };
  } catch (e) {
    // Diagnostic: întrebăm direct ruta de server ca să aflăm CAUZA reală (status + mesaj),
    // în loc de mesajul vag „Failed to retrieve the client token".
    let detaliu = '';
    try {
      const r = await fetch(handleUploadUrl, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ type: 'blob.generate-client-token', payload: { pathname, callbackUrl: (typeof location!=='undefined'? location.origin : '') + '/api/blob-upload', multipart: false, clientPayload: null } }),
      });
      const txt = await r.text();
      detaliu = ` [server /api/blob-upload → ${r.status}: ${String(txt).slice(0,200)}]`;
    } catch (e2) {
      detaliu = ' [ruta /api/blob-upload nu răspunde deloc — lipsește pe server sau altă adresă]';
    }
    throw new Error((e && e.message ? e.message : 'Încărcare eșuată') + detaliu);
  }
}

// Hook de zoom/pan robust: pinch pe telefon (cu pan simultan), rotiță pe laptop, butoane, tragere.
// Folosește numărul de degete curent ca sursă de adevăr, ca gestul să nu rămână „blocat".
function useZoomPan({ maxScale = 6, alwaysPan = false } = {}) {
  const [scale, setScale] = useState(1);
  const [tx, setTx] = useState(0);
  const [ty, setTy] = useState(0);
  const st = useRef({ active:false, lastX:0, lastY:0, startDist:0, startScale:1, mouse:false });
  const clamp = (s) => Math.min(maxScale, Math.max(1, s));
  const reset = () => { setScale(1); setTx(0); setTy(0); };
  const zoomBy = (f) => setScale((s)=>{ const ns = clamp(s*f); if (ns===1){ setTx(0); setTy(0);} return ns; });
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = (t) => ({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  const canPan = () => alwaysPan || scale > 1;
  const handlers = {
    onWheel: (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.12 : 1/1.12); },
    onTouchStart: (e) => {
      st.current.active = true;
      const t = e.touches;
      if (t.length === 2) { st.current.startDist = dist(t); st.current.startScale = scale; const m = mid(t); st.current.lastX = m.x; st.current.lastY = m.y; }
      else if (t.length === 1) { st.current.lastX = t[0].clientX; st.current.lastY = t[0].clientY; }
    },
    onTouchMove: (e) => {
      const t = e.touches;
      if (t.length === 2) {
        e.preventDefault();
        const d = dist(t);
        setScale(clamp(st.current.startScale * (d / (st.current.startDist || d))));
        const m = mid(t);
        setTx((x)=>x + (m.x - st.current.lastX)); setTy((y)=>y + (m.y - st.current.lastY));
        st.current.lastX = m.x; st.current.lastY = m.y;
      } else if (t.length === 1 && canPan()) {
        e.preventDefault();
        const x = t[0].clientX, y = t[0].clientY;
        setTx((px)=>px + (x - st.current.lastX)); setTy((py)=>py + (y - st.current.lastY));
        st.current.lastX = x; st.current.lastY = y;
      }
    },
    onTouchEnd: (e) => {
      const t = e.touches;
      if (t.length === 1) { st.current.startScale = scale; st.current.lastX = t[0].clientX; st.current.lastY = t[0].clientY; }
      else if (t.length === 0) { st.current.active = false; }
    },
    onMouseDown: (e) => { if (canPan()){ st.current.mouse=true; st.current.active=true; st.current.lastX=e.clientX; st.current.lastY=e.clientY; } },
    onMouseMove: (e) => { if (st.current.mouse){ setTx((x)=>x+(e.clientX-st.current.lastX)); setTy((y)=>y+(e.clientY-st.current.lastY)); st.current.lastX=e.clientX; st.current.lastY=e.clientY; } },
    onMouseUp: () => { st.current.mouse=false; st.current.active=false; }, onMouseLeave: () => { st.current.mouse=false; st.current.active=false; },
    onDoubleClick: () => { scale>1 ? reset() : setScale(2.5); },
  };
  return { scale, tx, ty, reset, zoomBy, handlers, moving: st };
}

function ZoomControls({ scale, zoomBy, reset }) {
  return (
    <div style={{ position:'absolute', bottom:14, left:'50%', transform:'translateX(-50%)', display:'flex', gap:8, background:'rgba(10,14,20,.72)', border:'1px solid rgba(255,255,255,.14)', borderRadius:12, padding:'6px 8px', backdropFilter:'blur(6px)', zIndex:5 }}>
      <button onClick={()=>zoomBy(1/1.4)} style={{ color:'#fff', fontSize:22, width:40, height:40, borderRadius:8, background:'#2E8BD1' }}>−</button>
      <button onClick={reset} style={{ color:'#fff', fontSize:13, padding:'0 12px', height:40, borderRadius:8, background:'#3a424c' }}>{Math.round(scale*100)}%</button>
      <button onClick={()=>zoomBy(1.4)} style={{ color:'#fff', fontSize:22, width:40, height:40, borderRadius:8, background:'#2E8BD1' }}>+</button>
    </div>
  );
}

// Ecran complet real (ascunde bara browserului). Merge pe Android/desktop; pe iPhone poate fi limitat.
function toggleFullscreen(el) {
  try {
    const d = document;
    const fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    if (fsEl) { (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); }
    else if (el) { (el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen || function(){}).call(el); }
  } catch (e) {}
}

// Butoane flotante (colț dreapta-sus): ecran complet + închide. Țin cont de „notch"/safe-area (și pe landscape).
function CloseX({ onClose, onFull }) {
  const btn = { width:44, height:44, borderRadius:'50%', background:'rgba(10,14,20,.66)', color:'#fff', fontSize:20, fontWeight:700, lineHeight:1, border:'1px solid rgba(255,255,255,.22)', backdropFilter:'blur(6px)', display:'flex', alignItems:'center', justifyContent:'center' };
  const canFs = typeof document !== 'undefined' && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const inFs = () => (typeof document !== 'undefined') && (document.fullscreenElement || document.webkitFullscreenElement);
  const exitFs = () => { try { (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); } catch (e) {} };
  const handleClose = () => { if (inFs()) exitFs(); if (onClose) onClose(); };  // X iese și din fullscreen, apoi închide
  return (
    <div style={{ position:'absolute', top:'calc(env(safe-area-inset-top, 0px) + 10px)', right:'calc(env(safe-area-inset-right, 0px) + 10px)', zIndex:30, display:'flex', gap:8 }}>
      {onFull && <button onClick={onFull} aria-label="Ecran complet" style={btn}>⛶</button>}
      <button onClick={handleClose} aria-label="Închide" style={btn}>✕</button>
    </div>
  );
}

// Vizualizator de imagine cu zoom (pinch pe telefon).
function ZoomImage({ src, alt, onClose, onFull }) {
  const zp = useZoomPan({ maxScale:6 });
  return (
    <div style={{ position:'relative', flex:1, minHeight:0, overflow:'hidden', touchAction:'none' }} {...zp.handlers}>
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <img src={src} alt={alt} draggable="false" style={{ maxWidth:'100%', maxHeight:'100%', objectFit:'contain', transform:`translate(${zp.tx}px, ${zp.ty}px) scale(${zp.scale})`, transformOrigin:'center', transition: zp.moving.current.active ? 'none' : 'transform .12s', cursor: zp.scale>1?'grab':'default', userSelect:'none' }} />
      </div>
      {onClose && <CloseX onClose={onClose} onFull={onFull} />}
      <ZoomControls scale={zp.scale} zoomBy={zp.zoomBy} reset={zp.reset} />
    </div>
  );
}

// Vizualizator PDF: randează paginile cu PDF.js, apoi le afișează într-un container cu SCROLL NATIV
// (te plimbi sus-jos-stânga-dreapta ca la orice pagină) + zoom cu două degete sau butoane.
function PdfViewer({ src, fallbackSrc, downloadUrl, nume, onClose, onFull }) {
  const dl = downloadUrl || src;
  const [zoom, setZoom] = useState(1);
  const pz = useRef({ startDist:0, startZoom:1 });
  const clampZ = (z) => Math.min(10, Math.max(1, z));
  const zoomBy = (f) => setZoom((z)=>clampZ(z*f));
  const resetZ = () => setZoom(1);
  const dist2 = (t) => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const onTS = (e) => { if (e.touches.length===2){ pz.current.startDist=dist2(e.touches); pz.current.startZoom=zoom; } };
  const onTM = (e) => { if (e.touches.length===2){ const d=dist2(e.touches); setZoom(clampZ(pz.current.startZoom*(d/(pz.current.startDist||d)))); } };
  const [pages, setPages] = useState([]);
  const [status, setStatus] = useState('Se încarcă planșa…');
  const [hd, setHd] = useState(false); // randare la calitate mare, la cerere (mai lentă)
  // Pe iPhone nu există ecran complet real → „ecran curat”: ascundem barele aplicației.
  const [zen, setZen] = useState(false);
  const potFullscreen = typeof document !== 'undefined' && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const comutaEcran = () => { if (potFullscreen && onFull) onFull(); else setZen((z)=>!z); };
  useEffect(() => {
    let cancelled = false;
    setPages([]); setStatus('Se încarcă planșa…');
    const tLent = setTimeout(()=>{ if(!cancelled) setStatus('Durează neobișnuit de mult… Verifică internetul. Dacă la fel se întâmplă la TOATE planșele/pozele, stocarea (Vercel Blob) e probabil deconectată sau la limită.'); }, 18000);
    (async () => {
      const lib = window.pdfjsLib;
      if (!lib) { clearTimeout(tLent); setStatus('Vizualizatorul nu s-a încărcat. Verifică internetul și reintră în planșă.'); return; }
      try {
        try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch {}
        // IMPORTANT: descărcăm fișierul dintr-o singură bucată (disableRange/disableStream).
        // Cererile „pe bucăți" se blochează des prin proxy/CDN pe date mobile — asta cauza „nu mai încarcă".
        const optiuni = (u) => ({ url: u, disableRange: true, disableStream: true, withCredentials: false });
        let pdf;
        try { pdf = await lib.getDocument(optiuni(src)).promise; }
        catch (e1) { if (fallbackSrc && fallbackSrc !== src) { pdf = await lib.getDocument(optiuni(fallbackSrc)).promise; } else { throw e1; } }
        clearTimeout(tLent);
        // Rapid implicit; „HD" (la cerere) randează mai fin.
        const targetW = hd ? 2600 : 1500;
        const maxS = hd ? 4 : 2;
        const jpegQ = hd ? 0.92 : 0.8;
        const MAX_PX = hd ? 9e6 : 4e6;
        const imgs = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          if (cancelled) return;
          if (pdf.numPages > 1) setStatus(`Se randează pagina ${i}/${pdf.numPages}…`);
          const page = await pdf.getPage(i);
          const base = page.getViewport({ scale: 1 });
          let s = Math.min(maxS, Math.max(1, targetW / base.width));
          if (base.width * s * base.height * s > MAX_PX) { s = Math.sqrt(MAX_PX / (base.width * base.height)); }
          const viewport = page.getViewport({ scale: s });
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width); canvas.height = Math.floor(viewport.height);
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          imgs.push(canvas.toDataURL('image/jpeg', jpegQ));
          if (!cancelled) { setPages(imgs.slice()); if (i === 1) setStatus(''); } // arată prima pagină imediat
        }
        if (!cancelled) setStatus('');
      } catch (e) {
        clearTimeout(tLent);
        if (!cancelled) setStatus('Nu am putut afișa planșa aici. ' + (e && e.message ? e.message : ''));
      }
    })();
    return () => { cancelled = true; clearTimeout(tLent); };
  }, [src, hd]);
  return (
    <div style={{ position:'relative', flex:1, minHeight:0, background:'#0c0f13' }}>
      <div onTouchStart={onTS} onTouchMove={onTM}
        style={{ position:'absolute', inset:0, overflow:'auto', WebkitOverflowScrolling:'touch', touchAction:'pan-x pan-y', textAlign:'center' }}>
        <div style={{ width:`${zoom*100}%`, minWidth:'100%', margin:'0 auto', display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'10px 0 70px' }}>
          {status && (
            <div style={{ color:'#9fb0c0', padding:'24px 16px', textAlign:'center', fontSize:13 }}>
              {status}
              {pages.length===0 && !/^Se /.test(status) && (
                <div style={{ marginTop:12 }}>
                  <a href={dl} target="_blank" rel="noopener noreferrer" style={{ color:'#14181C', background:'#4CAF7D', padding:'8px 14px', borderRadius:8, fontWeight:700, textDecoration:'none' }}>⬇ Deschide / descarcă PDF</a>
                </div>
              )}
            </div>
          )}
          {pages.map((d, i) => (
            <img key={i} src={d} draggable="false" style={{ width:'100%', display:'block', boxShadow:'0 2px 10px rgba(0,0,0,.4)', userSelect:'none' }} />
          ))}
        </div>
      </div>
      {nume && !zen && <div style={{ position:'absolute', top:'max(14px, env(safe-area-inset-top))', left:12, zIndex:15, maxWidth:'42%', color:'#cdd7e2', fontSize:12, background:'rgba(10,14,20,.55)', padding:'5px 10px', borderRadius:8, backdropFilter:'blur(6px)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{nume}</div>}
      {!zen && <button onClick={()=>setHd(!hd)} style={{ position:'absolute', top:'max(14px, env(safe-area-inset-top))', left:'50%', transform:'translateX(-50%)', zIndex:16, color: hd?'#14181C':'#cdd7e2', background: hd?'#E9A23B':'rgba(10,14,20,.55)', fontSize:12, fontWeight:700, padding:'6px 12px', borderRadius:8, backdropFilter:'blur(6px)', whiteSpace:'nowrap', border:'none' }}>{hd?'🔍 HD pornit':'🔍 HD (mai clar)'}</button>}
      {onClose && <CloseX onClose={onClose} onFull={comutaEcran} />}
      {!zen && <ZoomControls scale={zoom} zoomBy={zoomBy} reset={resetZ} />}
    </div>
  );
}

// Buton mic ℹ️ „Cum se folosește" — se desface și arată instrucțiunile tab-ului curent.
// Dacă e manager și secțiunea are un plus pentru el, i se afișează și partea „ca manager".
function HelpNote({ text, isManager }) {
  const [open, setOpen] = useState(false);
  const baza = (text && typeof text === 'object') ? (text.text || '') : (text || '');
  const extra = (text && typeof text === 'object') ? (text.mgr || '') : '';
  if (!baza && !(isManager && extra)) return null;
  const full = baza + (isManager && extra ? ('\n\n📋 În plus, ca manager:\n' + extra) : '');
  return (
    <div style={{ marginBottom: 8 }}>
      <button onClick={()=>setOpen(!open)} className="text-xs flex items-center gap-1 font-medium" style={{ color:'#2E8BD1' }}>ℹ️ Cum se folosește <span style={{ fontSize:9 }}>{open?'▲':'▼'}</span></button>
      {open && <div className="text-xs mt-1 rounded-lg px-3 py-2" style={{ background:'var(--panel2)', color:'var(--muted)', border:'1px solid var(--border)', lineHeight:1.55, whiteSpace:'pre-line' }}>{full}</div>}
    </div>
  );
}

// Pagina „Ghid" — instrucțiuni complete pentru toate secțiunile.

  const Sec = ({ icon, title, children }) => (
    <div className="rounded-xl p-4 mb-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
      <div className="text-sm font-semibold mb-1.5" style={{ color:'var(--text)' }}>{icon} {title}</div>
      <div className="text-xs" style={{ color:'var(--muted)', lineHeight:1.7, whiteSpace:'pre-line' }}>{children}</div>
    </div>
  );
  const Titlu = ({ children, sub }) => (
    <div className="mt-5 mb-2">
      <div className="text-sm font-bold uppercase tracking-wide" style={{ color:'#2E8BD1' }}>{children}</div>
      {sub && <div className="text-xs" style={{ color:'var(--muted2)' }}>{sub}</div>}
    </div>
  );
  // Aliniere garantată cu ajutorul „ℹ️ Cum se folosește": secțiunile de funcții iau EXACT textul din HELP.
  const renderSec = (icon, title, base, mgr) => (
    <Sec icon={icon} title={title}>{base + (isManager && mgr ? ('\n\n📋 În plus, ca manager:\n' + mgr) : '')}</Sec>
  );
  const fromHelp = (icon, title, key) => renderSec(icon, title, (HELP[key] && HELP[key].text) || '', (HELP[key] && HELP[key].mgr) || '');

    <div className="max-w-2xl">

      <Titlu sub="Pentru toți — citește o dată, de sus în jos">Ghid pas cu pas</Titlu>

      <Sec icon="📱" title="1. Prima dată (fă o singură dată)">{'Prima oară când folosești aplicația, urmează acești pași:\n1) Deschizi aplicația apăsând pe iconița ei de pe telefon.\n2) Scrii numele de utilizator și parola pe care ți le-a dat șeful, apoi apeși pe „Intră".\n3) Mergi în meniu la „👤 Profilul meu" și apeși pe „🔔 Activează notificările". Când telefonul te întreabă, apeși pe „Permite" (sau „Allow").\n4) Gata. De acum primești pe telefon tot ce te privește.\n\nDacă ai iPhone, prima dată deschide aplicația în Safari, apeși pe butonul „Distribuie" (pătratul cu săgeata în sus) și alegi „Adaugă pe ecranul principal". După aceea deschide-o mereu de pe ecranul principal.\n\nEste bine de știut că aplicația îți cere parola de fiecare dată când o deschizi, pentru siguranță. Ca să nu mai scrii parola, poți porni Amprenta sau FaceID din Profil.'}</Sec>

      <Sec icon="🏠" title="2. De unde începi în fiecare zi (Activitatea mea)">{'Aceasta este prima pagină pe care o vezi când deschizi aplicația, iar aici ai adunat tot ce te privește, ca să nu cauți prin meniu.\n• Sus scrie la ce șantier lucrezi astăzi. Începând cu ora 16:30, îți apare și unde vei lucra mâine.\n• Dacă nu ai trimis raportul, îți apare un rând pentru asta; apeși pe el și te duce direct să-l completezi.\n• Tot ce este scris cu ROȘU înseamnă ceva de rezolvat (de exemplu, un material pe care șeful ți l-a respins).\n• Tot aici îți apare și rubrica „🚀 Noutăți", unde îți explic pe scurt fiecare lucru nou adăugat în aplicație.\n• Regula este simplă: apeși pe orice rând de aici și te duce fix unde trebuie, fără să știi pe unde este prin aplicație.'}</Sec>

      {fromHelp('📋','3. Rapoarte zilnice (cel mai important)','rapoarte')}
      {fromHelp('📦','4. Materiale (cererile de materiale)','materiale')}

      <Sec icon="🏗" title="5. Cum intri pe un șantier">{'• În „🏗 Șantiere" vezi lista șantierelor. Poți intra doar în cele unde ești pus tu; restul au un lacăt 🔒.\n• Apeși pe un șantier ca să intri în el.\n• Sus, dacă apeși pe adresă, ți se pornește harta cu navigația. Dacă apeși pe 📞, îl suni pe responsabilul de la client.\n• Dedesubt sunt butoanele: Rapoarte, Materiale, Scule, Planșe, Foto/Video, Checklist și Echipă. Apeși pe unul ca să-l deschizi și apeși din nou ca să-l închizi.\n• Butonul „← Înapoi" te scoate din șantier, înapoi la listă.'}</Sec>

      {fromHelp('🤖','12. Asistent Q&A (din meniu)','asistent')}

      <Sec icon="🧮" title="13. Calculator (calcule electrice)">{'Calculatorul te ajută să faci pe loc calculele electrice de pe teren, cum ar fi amperajul, secțiunea de cablu sau alegerea disjunctorului.\n1) Îl deschizi din meniu, de la „🧮 Calculator".\n2) Sus ai „⭐ Cele mai folosite", sau poți căuta ce calcul vrei (de exemplu „cablu" sau „disjunctor").\n3) Apeși pe calculul dorit și îți apare formula.\n4) Completezi datele cerute, iar rezultatul apare singur.\n\nToate valorile sunt orientative, așa că verifică-le mereu cu normativul I7.'}</Sec>

      <Sec icon="📘" title="14. Normativ I7">{'Aici ai tot normativul I7 pentru instalații electrice, cu modificările din 2023 incluse.\n1) Îl deschizi din meniu, de la „📘 Normativ I7".\n2) Scrii ce cauți (de exemplu „spital" sau „legare la pământ") sau apeși pe o etichetă gata pusă. Poți scrie și un număr de pagină (de exemplu 478) ca să sari direct la ea.\n3) Aplicația îți arată paginile unde apare cuvântul căutat.\n4) Apeși pe un rezultat și se deschide fix la pagina aceea. Te muți între pagini cu săgețile ‹ ›, iar cu două degete mărești.\n\nCa să se poată deschide paginile, managerul trebuie să încarce o singură dată fișierul PDF al normativului (din pagina „📘 Normativ I7").'}</Sec>

      {fromHelp('🔔','15. Memento (sa nu uiti nimic)','memento')}
      {fromHelp('🕐','16. Pontaj (orele tale)','pontaj')}
      {fromHelp('🏖','16. Concediu','concedii')}

      <Sec icon="🔔" title="17. Notificări (înștiințările pe telefon)">{'Notificările sunt înștiințările care îți vin pe telefon.\n• Le pornești o singură dată: intri la „👤 Profilul meu", apeși pe „🔔 Activează notificările" și apoi pe „Permite".\n• Primești pe telefon, cu sunet, doar ce te privește (ai fost pus pe un șantier, ți s-a aprobat sau respins un material, ai primit răspuns la concediu sau la o întrebare).\n• Pe iconița aplicației apare o bulină cu numărul de lucruri pe care le ai de rezolvat; ea dispare când le rezolvi.\n• Când șeful îți respinge ceva, îți apare cu ROȘU în „Activitatea mea"; apeși pe „Am văzut" ca să dispară.\n• Dacă vrei să verifici că funcționează, apeși pe „📨 Trimite notificare de test" din Profil.'}</Sec>

      {fromHelp('👤','18. Profil (parolă, amprentă, aspect)','profil')}

      {isManager && (<>
        <Titlu sub="Vizibil doar pentru Manager">Ghid Manager (administrare)</Titlu>

        <Sec icon="🏗" title="Administrarea șantierului">{'Aici creezi și modifici șantierele.\n• Când faci un șantier nou, treci numele, adresa, beneficiarul (clientul), numărul de contract, eventualul act adițional și responsabilul de la client cu numărul lui de telefon.\n• La „Raport zilnic cerut începând de:" alegi Azi, De mâine sau o anumită dată. Până la data aleasă, echipa nu primește memento de raport. În mod normal este pus „de mâine", ca să nu ceri raport chiar în ziua în care ai făcut șantierul.\n• La „Descrierea lucrărilor de efectuat" scrii ce este de făcut; textul apare cu albastru, sus pe șantier, și îl vede toată echipa.\n• Alegi felul de facturare al șantierului (vezi secțiunea Devize). Pentru lucrări mărunte, fără planuri, folosești tipul „🔧 Lucrare mică (fără planuri)", care se facturează pe ore.\n• Tot de aici pui sau scoți colegi din echipă și le dai starea Activ sau Pauză; când pui un coleg pe șantier, el primește o înștiințare.\n• Șantierul îl marchezi „Finalizat" din Checklist, după ce totul este bifat și confirmat.'}</Sec>

        {fromHelp('🧾','Devize (lista devizelor)','devize')}

        <Sec icon="🏢" title="Structură etaje & Poziții / Materiale">{'Acestea sunt două unelte pentru pregătirea devizelor.\n• La „Structură — etaje" definești etajele și apartamentele clădirii; ele se folosesc apoi la „Lucrări pe apartamente" din rapoarte.\n• La „Poziții / Materiale" imporți dintr-un fișier Excel lista de poziții (manoperă) și lista de materiale cu prețuri, care se folosesc la devize. Aplicația recunoaște mai multe formate de fișier și te lasă să alegi din ce foaie să ia datele.'}</Sec>

        {fromHelp('📄','Oferte','oferte')}
        {fromHelp('🧾','Facturi','facturi')}
        {fromHelp('👥','Clienți','clienti')}
        {fromHelp('📝','Notițe (carnetul tău)','notite')}
        {fromHelp('📁','Proiecte (arhiva pe clienți)','proiecte')}
        {fromHelp('🗂','Gestiune (materialele firmei)','gestiune')}
        {fromHelp('📈','Stocuri (istoricul stocului)','stocuri')}
        {fromHelp('🛒','Achiziții','achizitii')}
        {fromHelp('📄','Adeverințe (ștampilate)','adeverinte')}
        {fromHelp('🔑','Utilizatori (angajații)','utilizatori')}
        {fromHelp('⚙','Firma mea','firma')}

        <Sec icon="💰" title="Prețuri & confidențialitate">{'• Toate prețurile (tariful pe oră, prețurile materialelor, devizele) sunt vizibile DOAR pentru manager, peste tot în aplicație.\n• Angajații văd cantitățile, orele și lucrările, dar nu văd prețurile.'}</Sec>
      </>)}

      <p className="text-xs mt-3 mb-6" style={{ color:'var(--muted2)' }}>Ghidul se completează automat pe măsură ce apar funcții noi. Dacă ceva nu e clar, spune-i managerului.</p>
    </div>
  );
}

function SitePlanseTab({ santierId, santierNume, planseSantier, setPlanseSantier, persist, currentUser }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const [viewing, setViewing] = useState(null);
  const [cauta, setCauta] = useState('');
  const [dlBusy, setDlBusy] = useState(null); // id-ul planșei care se descarcă
  const planFsRef = useRef(null);
  const openPlan = (p) => setViewing(p);
  // Download real, direct pe telefon: aducem fișierul (public = rapid din CDN; privat = prin proxy autorizat)
  // și forțăm salvarea cu <a download>. Așa apare în „Descărcări", nu se deschide inline și nu scoate din aplicație.
  const descarca = async (p) => {
    if (dlBusy) return;
    setDlBusy(p.id);
    const incearca = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error('HTTP '+r.status); return await r.blob(); };
    try {
      let b;
      try { b = await incearca(p.url); } catch { b = await incearca(blobViewUrl(p.pathname)); }
      const obj = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = obj; a.download = p.nume || 'plansa.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>{ try { URL.revokeObjectURL(obj); } catch {} }, 10000);
    } catch (e) {
      try { window.open(p.url || blobViewUrl(p.pathname), '_blank'); } catch {}
    }
    setDlBusy(null);
  };
  const normPl = (s) => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s._\-]/g,'');
  const planseAici = planseSantier.filter((p)=>p.santierId===santierId);
  const planseFiltrate = cauta.trim() ? planseAici.filter((p)=>seCauta(p.nume, cauta)) : planseAici;

  const handleFiles = async (fileList) => {
    setError('');
    const files = Array.from(fileList).filter((f)=>f.type === 'application/pdf');
    if (files.length === 0) { setError('Doar fișiere PDF sunt acceptate aici.'); return; }
    setUploading(true);
    let acc = planseSantier;
    let ok = 0;
    try {
      for (const file of files) {
        const uploaded = await uploadFileToBlob(file, `santiere/${santierId}/planse`);
        acc = [...acc, { id: uid(), santierId, nume: file.name, url: uploaded.url, pathname: uploaded.pathname, data: new Date().toISOString().slice(0,10), incarcatDe: currentUser?.nume || '' }];
        setPlanseSantier(acc); persist('planseSantier', acc); ok++;
      }
    } catch (e) {
      setError(`${ok>0 ? `S-au încărcat ${ok}. ` : ''}${e.message || 'A eșuat.'}`);
    }
    setUploading(false);
    if (ok > 0) notifica('manageri', { title: ok===1 ? 'Planșă nouă' : 'Planșe noi', body:`${currentUser?.nume || 'Un coleg'} a adăugat ${ok} ${ok===1?'planșă':'planșe'} la ${santierNume || 'șantier'}.`, tag:'planse-'+santierId }, currentUser?.id);
  };

  const remove = async (p) => {
    if (!window.confirm(`Ștergi definitiv „${p.nume}"?`)) return;
    try { await authFetch('/api/files', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', url: p.url }) }); } catch {}
    const next = planseSantier.filter((x)=>x.id!==p.id);
    setPlanseSantier(next); persist('planseSantier', next);
    if (viewing?.id === p.id) setViewing(null);
  };

  if (viewing) {
    return (
      <div ref={planFsRef} style={{ position:'fixed', inset:0, zIndex:200, background:'#0c0f13', display:'flex', flexDirection:'column' }}>
        <PdfViewer src={blobViewUrl(viewing.pathname)} fallbackSrc={viewing.url || blobViewUrl(viewing.pathname)} downloadUrl={viewing.url || blobViewUrl(viewing.pathname)} nume={viewing.nume} onClose={()=>setViewing(null)} onFull={()=>toggleFullscreen(planFsRef.current)} />
      </div>
    );
  }

  return (
    <div>
      <div className="rounded-xl p-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>📐 Planșe de execuție (PDF)</div>
        <label className="w-full flex items-center justify-center gap-2 text-sm px-4 py-2.5 rounded-lg cursor-pointer font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>
          <Icon>+</Icon> {uploading ? 'Se încarcă...' : 'Adaugă planșă PDF'}
          <input type="file" accept="application/pdf" multiple disabled={uploading} onChange={(e)=>{ handleFiles(e.target.files); e.target.value=''; }} style={{ display:'none' }} />
        </label>
        {error && <p className="text-xs mt-2" style={{ color:'#E05252' }}>{error}</p>}
        {planseAici.length > 1 && (
          <input value={cauta} onChange={(e)=>setCauta(e.target.value)} placeholder="🔍 Caută planșă (ex: prize parter, et 4)" className="w-full rounded-lg px-3 py-2 text-sm outline-none mt-3" style={{ background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' }} />
        )}
        {planseAici.length === 0 ? (
          <div className="text-xs mt-3" style={{ color:'var(--muted2)' }}>Nicio planșă încărcată încă.</div>
        ) : planseFiltrate.length === 0 ? (
          <div className="text-xs mt-3" style={{ color:'var(--muted2)' }}>Nicio planșă nu se potrivește cu „{cauta}".</div>
        ) : (
          <div className="space-y-2 mt-3">
            {planseFiltrate.map((p)=>(
              <div key={p.id} className="rounded-lg px-3 py-2" style={{ background:'var(--panel2)' }}>
                <div className="flex items-center justify-between text-sm">
                  <button onClick={()=>openPlan(p)} className="truncate text-left flex-1" style={{ color:'#2E8BD1' }}>📄 {p.nume}</button>
                  <div className="flex items-center gap-2 shrink-0 ml-2">
                    <span className="text-xs" style={{ color:'var(--muted2)' }}>{fmtData(p.data)}</span>
                    <button onClick={()=>remove(p)} style={{ color:'#E05252' }}><Icon size={14}>🗑</Icon></button>
                  </div>
                </div>
                <div className="flex gap-1.5 mt-2 flex-wrap">
                  <button onClick={()=>openPlan(p)} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>👁 Deschide planul (rămâi în aplicație)</button>
                  <button onClick={()=>descarca(p)} disabled={dlBusy===p.id} className="text-xs px-2.5 py-1.5 rounded-lg font-semibold disabled:opacity-60" style={{ color:'var(--text)', background:'var(--panel)', border:'1px solid var(--border)' }}>{dlBusy===p.id ? '⏳ Se salvează…' : '⬇ Salvează în telefon'}</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function SiteMediaTab({ santierId, santierNume, mediaSantier, setMediaSantier, persist, currentUser }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const [viewing, setViewing] = useState(null);
  const mediaAici = mediaSantier.filter((m)=>m.santierId===santierId);
  const mediaFsRef = useRef(null);

  const handleFiles = async (fileList) => {
    setError('');
    const files = Array.from(fileList).filter((f)=>f.type.startsWith('image/') || f.type.startsWith('video/'));
    if (files.length === 0) { setError('Doar poze sau video sunt acceptate aici.'); return; }
    setUploading(true);
    let acc = mediaSantier;
    let ok = 0;
    try {
      for (const file of files) {
        const uploaded = await uploadFileToBlob(file, `santiere/${santierId}/media`);
        acc = [...acc, { id: uid(), santierId, nume: file.name, url: uploaded.url, pathname: uploaded.pathname, tip: file.type.startsWith('video/') ? 'video' : 'foto', data: new Date().toISOString().slice(0,10), incarcatDe: currentUser?.nume || '' }];
        setMediaSantier(acc); persist('mediaSantier', acc); ok++;
      }
    } catch (e) {
      setError(`${ok>0 ? `S-au încărcat ${ok}. ` : ''}${e.message || 'A eșuat.'}`);
    }
    setUploading(false);
    if (ok > 0) notifica('manageri', { title: ok===1 ? 'Poză/video nou' : 'Poze/video noi', body:`${currentUser?.nume || 'Un coleg'} a adăugat ${ok} ${ok===1?'fișier':'fișiere'} la ${santierNume || 'șantier'}.`, tag:'media-'+santierId }, currentUser?.id);
  };

  const remove = async (m) => {
    if (!window.confirm(`Ștergi definitiv „${m.nume}"?`)) return;
    try { await authFetch('/api/files', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', url: m.url }) }); } catch {}
    const next = mediaSantier.filter((x)=>x.id!==m.id);
    setMediaSantier(next); persist('mediaSantier', next);
    if (viewing?.id === m.id) setViewing(null);
  };

  if (viewing) {
    return (
      <div ref={mediaFsRef} style={{ position:'fixed', inset:0, zIndex:200, background:'#0c0f13', display:'flex', flexDirection:'column' }}>
        {viewing.tip === 'video' ? (
          <div style={{ position:'relative', flex:1, minHeight:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <video src={blobViewUrl(viewing.pathname)} controls autoPlay playsInline style={{ maxWidth:'100%', maxHeight:'100%' }} />
            <CloseX onClose={()=>setViewing(null)} onFull={()=>toggleFullscreen(mediaFsRef.current)} />
          </div>
        ) : (
          <ZoomImage src={blobViewUrl(viewing.pathname)} alt={viewing.nume} onClose={()=>setViewing(null)} onFull={()=>toggleFullscreen(mediaFsRef.current)} />
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="rounded-xl p-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>📷 Foto / Video</div>
        <label className="w-full flex items-center justify-center gap-2 text-sm px-4 py-2.5 rounded-lg cursor-pointer font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>
          <Icon>+</Icon> {uploading ? 'Se încarcă...' : 'Adaugă foto / video'}
          <input type="file" accept="image/*,video/*" multiple disabled={uploading} onChange={(e)=>{ handleFiles(e.target.files); e.target.value=''; }} style={{ display:'none' }} />
        </label>
        <p className="text-[11px] mt-1.5" style={{ color:'var(--muted2)' }}>Fișiere de până la 200MB.</p>
        {error && <p className="text-xs mt-2" style={{ color:'#E05252' }}>{error}</p>}
        {mediaAici.length === 0 ? (
          <div className="text-xs mt-3" style={{ color:'var(--muted2)' }}>Nimic încărcat încă.</div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3">
            {mediaAici.map((m)=>(
              <div key={m.id} className="rounded-lg overflow-hidden relative" style={{ background:'var(--panel2)' }}>
                {m.tip === 'video' ? (
                  <video src={blobViewUrl(m.pathname)} controls className="w-full" style={{ maxHeight:140, objectFit:'cover' }} />
                ) : (
                  <button onClick={()=>setViewing(m)} className="block w-full">
                    <img src={blobViewUrl(m.pathname)} alt={m.nume} className="w-full" style={{ height:140, objectFit:'cover' }} />
                  </button>
                )}
                <div className="flex items-center justify-between px-2 py-1">
                  <span className="text-[11px] truncate" style={{ color:'var(--muted)' }}>{m.data}</span>
                  <button onClick={()=>remove(m)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function SiteToolsTab({ santierId, santierNume, sculeSantier, setSculeSantier, persist, currentUser }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const [sculaNoua, setSculaNoua] = useState('');
  const [sculaAdusaDe, setSculaAdusaDe] = useState('');
  const [cautaScula, setCautaScula] = useState('');
  const sculeToate = sculeSantier.filter((s)=>s.santierId===santierId);
  const sculeAici = cautaScula.trim() ? sculeToate.filter((s)=> seCauta(`${s.denumire||''} ${s.adusaDe||''}`, cautaScula)) : sculeToate;
  const addScula = () => {
    if (!sculaNoua.trim()) return;
    const den = sculaNoua.trim();
    const next = [...sculeSantier, { id: uid(), santierId, denumire: den, adusaDe: sculaAdusaDe.trim(), data: new Date().toISOString().slice(0,10) }];
    setSculeSantier(next); persist('sculeSantier', next); setSculaNoua(''); setSculaAdusaDe('');
    notifica('manageri', { title:'Sculă adăugată', body:`${currentUser?.nume || 'Un coleg'} a adus „${den}" la ${santierNume || 'șantier'}.`, tag:'scula-'+santierId }, currentUser?.id);
  };
  const delScula = (id) => { if (!window.confirm('Ștergi această sculă din lista șantierului?')) return; const next = sculeSantier.filter((s)=>s.id!==id); setSculeSantier(next); persist('sculeSantier', next); };
  const [trimiteSculaId, setTrimiteSculaId] = useState(null);
  const trimiteScula = (s, dest) => {
    if (!window.confirm(`Trimiți „${s.denumire}" la ${dest}? Va fi scoasă din lista șantierului.`)) return;
    const next = sculeSantier.filter((x)=>x.id!==s.id);
    setSculeSantier(next); persist('sculeSantier', next); setTrimiteSculaId(null);
    notifica('manageri', { title:'Sculă mutată', body:`${currentUser?.nume || 'Un coleg'} a trimis „${s.denumire}" la ${dest} (de la ${santierNume || 'șantier'}).`, tag:'scula-'+santierId }, currentUser?.id);
  };

  return (
    <div className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
      <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>🔧 Scule la șantier</div>
      <div className="flex flex-col sm:flex-row gap-2 mb-3">
        <input placeholder="Sculă (ex: Bormașină Bosch)" value={sculaNoua} onChange={(e)=>setSculaNoua(e.target.value)} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <input placeholder="Adusă de" value={sculaAdusaDe} onChange={(e)=>setSculaAdusaDe(e.target.value)} className="sm:w-40 rounded-lg px-3 py-2 text-sm outline-none" style={inputStyle} />
        <button onClick={addScula} className="text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>+ Adaugă</button>
      </div>
      {sculeToate.length > 4 && (
        <input value={cautaScula} onChange={(e)=>setCautaScula(e.target.value)} placeholder="🔍 Caută sculă (ex: bormasina bosch)" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
      )}
      {sculeToate.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Nicio sculă adăugată.</div> : sculeAici.length===0 ? <div className="text-xs" style={{ color:'var(--muted2)' }}>Nicio sculă găsită pentru „{cautaScula}".</div> : (
        <div className="space-y-1">
          {sculeAici.map((s)=>(
            <div key={s.id} className="text-xs px-2 py-1.5 rounded-lg" style={{ background:'var(--panel2)' }}>
              <div className="flex items-center justify-between gap-2">
                <span style={{ color:'var(--text)' }}>{s.denumire}{s.adusaDe && <span style={{ color:'var(--muted)' }}> · {s.adusaDe}</span>}</span>
                {trimiteSculaId!==s.id && (
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={()=>setTrimiteSculaId(s.id)} className="px-2 py-0.5 rounded" style={{ color:'var(--muted)', background:'var(--panel)' }}>↩ Trimite</button>
                    <button onClick={()=>delScula(s.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>
                  </div>
                )}
              </div>
              {trimiteSculaId===s.id && (
                <div className="flex items-center gap-1 flex-wrap mt-2 pt-2" style={{ borderTop:'1px solid var(--border)' }}>
                  <span className="text-[10px]" style={{ color:'var(--muted)' }}>Trimite la:</span>
                  <button onClick={()=>trimiteScula(s,'Depozit')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏠 Depozit</button>
                  <button onClick={()=>trimiteScula(s,'Alt șantier')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#2E8BD1' }}>🏗 Alt șantier</button>
                  <button onClick={()=>trimiteScula(s,'Service')} className="px-2 py-1 rounded font-medium" style={{ color:'#14181C', background:'#E9A23B' }}>🔧 Service</button>
                  <button onClick={()=>setTrimiteSculaId(null)} className="px-2 py-1" style={{ color:'var(--muted)' }}>Anulează</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Probleme & rezolvări (Q&A) pe șantier. Managerul răspunde; răspunsurile devin o bază de cunoștințe.
// La întrebări noi similare, aplicația îi PROPUNE managerului răspunsul cunoscut — el îl aprobă.
function SiteProblemeTab({ santierId, santierNume, echipaIds, problemeSantier, setProblemeSantier, persist, currentUser }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const isManager = currentUser?.rol === 'Manager';
  const [intrebareNoua, setIntrebareNoua] = useState('');
  const [raspunsForm, setRaspunsForm] = useState({}); // id -> text în curs de scriere

  const aici = problemeSantier.filter((p)=>p.santierId===santierId);
  const baza = bazaCunostinteQA(problemeSantier); // doar răspunsuri marcate corecte (de pe toate șantierele)
  const rezolvateAici = aici.filter((q)=>raspunsCorectQA(q)).slice().reverse();
  const deschise = aici.filter((q)=>!raspunsCorectQA(q)).slice().reverse();
  const toateAici = aici.slice().reverse(); // pentru angajați: totul într-o singură listă (ca un chat)
  const setPersist = (next) => { setProblemeSantier(next); persist('problemeSantier', next); };

  const adaugaIntrebare = () => {
    if (!intrebareNoua.trim()) return;
    const q = { id: uid(), santierId, intrebare: intrebareNoua.trim(), raspunsuri:[], status:'deschis', creatDe: currentUser?.nume || '', creatId: currentUser?.id || '', data: new Date().toISOString().slice(0,10) };
    setPersist([...problemeSantier, q]); setIntrebareNoua('');
    notifica('manageri', { title:'Întrebare / problemă nouă', body:`${currentUser?.nume || 'Un coleg'}: „${q.intrebare}" — ${santierNume || 'șantier'}.`, tag:'qa-'+santierId, url:'/?qa='+q.id }, currentUser?.id);
    // Anunță și colegii de pe șantier (persoanele implicate)
    const echipa = (echipaIds||[]).filter((id)=> id && id!==currentUser?.id);
    if (echipa.length) notifica(echipa, { title:'Întrebare pe șantier', body:`${currentUser?.nume || 'Un coleg'}: „${q.intrebare}" — ${santierNume || 'șantier'}.`, tag:'qa-'+santierId, url:'/?qa='+q.id }, currentUser?.id);
  };
  const adaugaRaspuns = (q, text, corect) => {
    const t = String(text||'').trim(); if (!t) return;
    const r = { id: uid(), text:t, autorNume: currentUser?.nume||'', autorId: currentUser?.id||'', data: new Date().toISOString().slice(0,10), corect: !!corect };
    const next = problemeSantier.map((p)=> p.id===q.id ? {...p, raspunsuri: corect ? [...raspunsuriQA(p).map((x)=>({...x,corect:false})), r] : [...raspunsuriQA(p), r], status: (corect || raspunsCorectQA(p)) ? 'rezolvat' : 'raspuns'} : p);
    setPersist(next);
    setRaspunsForm((f)=>{ const c={...f}; delete c[q.id]; return c; });
    if (!isManager) notifica('manageri', { title:'Răspuns de verificat', body:`${currentUser?.nume||'Un coleg'} a răspuns la „${q.intrebare}".`, tag:'qa-verif', url:'/?qa='+q.id }, currentUser?.id);
    if (q.creatId && q.creatId !== currentUser?.id) notifica(q.creatId, { title: corect?'Răspuns confirmat ✅':'Un răspuns la întrebarea ta', body:`„${q.intrebare}" → ${t}`, tag:'qa-raspuns', url:'/?qa='+q.id }, currentUser?.id);
    // Notifică individual restul colegilor implicați pe șantier (chat de grup) — mai puțin autorul și cel deja anunțat.
    const echipa = (echipaIds||[]).filter((id)=> id && id!==currentUser?.id && id!==q.creatId);
    if (echipa.length) notifica(echipa, { title:'Răspuns nou pe șantier', body:`${currentUser?.nume||'Un coleg'}: „${t}"`, tag:'qa-'+santierId, url:'/?qa='+q.id }, currentUser?.id);
  };
  const marcheazaCorect = (q, raspunsId) => {
    const next = problemeSantier.map((p)=> p.id!==q.id ? p : {...p, raspunsuri: raspunsuriQA(p).map((x)=>({...x, corect: x.id===raspunsId})), status:'rezolvat'});
    setPersist(next);
    const r = raspunsuriQA(q).find((x)=>x.id===raspunsId);
    if (q.creatId && q.creatId!==currentUser?.id && r) notifica(q.creatId, { title:'Răspuns confirmat ✅', body:`„${q.intrebare}" → ${r.text}`, tag:'qa-raspuns', url:'/?qa='+q.id }, currentUser?.id);
  };
  const anuleazaCorect = (q) => setPersist(problemeSantier.map((p)=> p.id===q.id ? {...p, raspunsuri: raspunsuriQA(p).map((x)=>({...x, corect:false})), status:'raspuns'} : p));
  const stergeRaspuns = (q, raspunsId) => setPersist(problemeSantier.map((p)=> p.id===q.id ? {...p, raspunsuri: raspunsuriQA(p).filter((x)=>x.id!==raspunsId)} : p));
  const stergeQ = (id) => { if(!window.confirm('Ștergi această întrebare?')) return; setPersist(problemeSantier.filter((p)=>p.id!==id)); };

  // IMPORTANT: acestea sunt FUNCȚII care întorc JSX (nu sub-componente), ca să nu se piardă focusul câmpului la tastare.
  // „Corect" se vede DOAR de manager. Angajații văd răspunsurile ca într-un chat, fără marcaj.
  const renderRaspuns = (q, r) => {
    const aratCorect = isManager && r.corect;
    return (
      <div key={r.id} className="flex items-start justify-between gap-2 text-xs px-2.5 py-1.5 rounded-lg" style={{ background: aratCorect?'#4CAF7D18':'var(--panel2)', border: aratCorect?'1px solid #4CAF7D66':'1px solid transparent' }}>
        <div className="min-w-0">
          <div style={{ color:'var(--text)' }}>{aratCorect && <span style={{ color:'#4CAF7D', fontWeight:700 }}>✅ Corect · </span>}{r.text}</div>
          <div className="text-[10px] mt-0.5" style={{ color:'var(--muted2)' }}>{r.autorNume || 'coleg'} · {r.data}</div>
        </div>
        {isManager && (
          <div className="flex items-center gap-1 shrink-0">
            {r.corect
              ? <button onClick={()=>anuleazaCorect(q)} className="text-[10px] px-1.5 py-0.5 rounded" style={{ color:'var(--muted)', background:'var(--panel)' }}>anulează</button>
              : <button onClick={()=>marcheazaCorect(q, r.id)} className="text-[10px] px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✓ Corect</button>}
            <button onClick={()=>stergeRaspuns(q, r.id)} style={{ color:'#E05252' }}>🗑</button>
          </div>
        )}
      </div>
    );
  };

  const renderCard = (q, rezolvat) => {
    const raspunsuri = raspunsuriQA(q);
    const sug = isManager && !rezolvat ? gasesteRaspunsCunoscut(q.intrebare, baza.filter((x)=>x.id!==q.id), 0.5) : null;
    // Angajații văd un card neutru (chat). Managerul vede verde=rezolvat / galben=de răspuns.
    const brdr = isManager ? (rezolvat ? 'var(--border)' : '#E9A23B66') : 'var(--border)';
    const brdrL = isManager ? (rezolvat ? '#4CAF7D' : '#E9A23B') : '#2E8BD1';
    return (
      <div key={q.id} className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid '+brdr, borderLeft:'4px solid '+brdrL }}>
        <div className="flex items-start justify-between gap-2">
          <div className="text-sm" style={{ color:'var(--text)' }}>❓ {q.intrebare}</div>
          {(isManager || q.creatId===currentUser?.id) && <button onClick={()=>stergeQ(q.id)} style={{ color:'#E05252' }}><Icon size={12}>🗑</Icon></button>}
        </div>
        <div className="text-[11px] mt-0.5 mb-1.5" style={{ color:'var(--muted2)' }}>{q.creatDe || 'coleg'} · {q.data}</div>
        {raspunsuri.length > 0 && <div className="space-y-1 mb-2">{raspunsuri.map((r)=>renderRaspuns(q, r))}</div>}
        {sug && (
          <div className="rounded-lg px-3 py-2 mb-2" style={{ background:'#C08CE018', border:'1px solid #C08CE066' }}>
            <div className="text-[11px]" style={{ color:'#C08CE0', fontWeight:700 }}>💡 Răspuns cunoscut (potrivire {Math.round(sug.scor*100)}%): {sug.sursa.raspuns}</div>
            <button onClick={()=>adaugaRaspuns(q, sug.sursa.raspuns, true)} className="mt-1.5 text-xs px-3 py-1 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✓ Folosește-l ca răspuns corect</button>
          </div>
        )}
        <div className="flex gap-1">
          <input value={raspunsForm[q.id]||''} onChange={(e)=>setRaspunsForm((f)=>({...f, [q.id]: e.target.value}))} onKeyDown={(e)=>{ if(e.key==='Enter'){ adaugaRaspuns(q, raspunsForm[q.id], isManager); } }} placeholder={isManager ? 'Scrie răspunsul corect...' : 'Scrie un răspuns...'} className="flex-1 rounded-lg px-3 py-1.5 text-xs outline-none" style={inputStyle} />
          <button onClick={()=>adaugaRaspuns(q, raspunsForm[q.id], isManager)} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>{isManager ? '✓ Răspuns corect' : 'Răspunde'}</button>
        </div>
        {isManager && <div className="text-[10px] mt-1" style={{ color:'var(--muted2)' }}>Ce scrii tu se salvează direct ca răspuns corect. Răspunsurile colegilor le confirmi cu „✓ Corect".</div>}
      </div>
    );
  };

  return (
    <div className="space-y-4">
      <div className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <div className="text-sm font-medium mb-2" style={{ color:'var(--text)' }}>❓ Pune o întrebare / semnalează o problemă</div>
        <textarea value={intrebareNoua} onChange={(e)=>setIntrebareNoua(e.target.value)} rows={2} placeholder="Ex: Ce secțiune de cablu folosim la circuitul de prize din bucătărie?" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
        {(() => {
          const sug = intrebareNoua.trim().length >= 5 ? gasesteRaspunsCunoscut(intrebareNoua, baza, 0.5) : null;
          if (!sug) return null;
          return (
            <div className="rounded-lg px-3 py-2 mb-2 text-xs" style={{ background:'#4CAF7D18', border:'1px solid #4CAF7D66' }}>
              <div style={{ color:'#4CAF7D', fontWeight:700 }}>💡 Există deja un răspuns pentru o întrebare similară:</div>
              <div className="mt-1" style={{ color:'var(--muted)' }}>Întrebare: „{sug.sursa.intrebare}"</div>
              <div style={{ color:'var(--text)' }}>Răspuns: {sug.sursa.raspuns}</div>
            </div>
          );
        })()}
        <button onClick={adaugaIntrebare} className="w-full text-sm px-4 py-2 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>Trimite întrebarea</button>
      </div>

      {isManager ? (
        <>
          {deschise.length > 0 && (
            <div>
              <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'#E9A23B' }}>Fără răspuns confirmat ({deschise.length})</div>
              <div className="space-y-2">{deschise.map((q)=>renderCard(q, false))}</div>
            </div>
          )}
          {rezolvateAici.length > 0 && (
            <div>
              <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'var(--muted2)' }}>Rezolvate ({rezolvateAici.length})</div>
              <div className="space-y-2">{rezolvateAici.map((q)=>renderCard(q, true))}</div>
            </div>
          )}
        </>
      ) : (
        toateAici.length > 0 && (
          <div>
            <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'var(--muted2)' }}>💬 Discuție ({toateAici.length})</div>
            <div className="space-y-2">{toateAici.map((q)=>renderCard(q, false))}</div>
          </div>
        )
      )}

      {aici.length === 0 && <div className="text-xs text-center py-6" style={{ color:'var(--muted2)' }}>Nicio întrebare încă. Pune prima întrebare mai sus.</div>}
    </div>
  );
}

// Asistent Q&A pe firmă: adună toate întrebările/răspunsurile din TOATE șantierele.
// Cauți/întrebi orice → primești cel mai bun răspuns din baza de cunoștințe. Managerul răspunde aici la orice.
function AsistentTab({ problemeSantier, setProblemeSantier, santiere, persist, currentUser, qaTarget, clearQaTarget }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const isManager = currentUser?.rol === 'Manager';
  const targetRef = useRef(null);
  useEffect(() => {
    if (qaTarget && targetRef.current) {
      const t = setTimeout(()=>{ try { targetRef.current.scrollIntoView({ behavior:'smooth', block:'center' }); } catch {} }, 150);
      return () => clearTimeout(t);
    }
  }, [qaTarget, problemeSantier]);
  const [q, setQ] = useState('');
  const [aiRasp, setAiRasp] = useState(null);   // { text, sursa } — răspuns generat de AI (dacă e configurat)
  const [aiLoading, setAiLoading] = useState(false);
  const [aiEroare, setAiEroare] = useState('');
  const [raspunsForm, setRaspunsForm] = useState({});
  const numeSantier = (id) => id ? (santiere.find((s)=>s.id===id)?.nume || 'Șantier') : 'General';

  // Confidențialitate: managerul vede tot; angajatul vede DOAR general + șantierele pe care e asignat.
  const idSantiereMele = new Set((santiere||[]).filter((s)=>inEchipa(s.echipa, currentUser?.id)).map((s)=>s.id));
  const potVedea = (sid) => isManager || !sid || idSantiereMele.has(sid);
  const rezolvate = bazaCunostinteQA(problemeSantier).filter((x)=>potVedea(x.santierId)); // răspunsuri confirmate, doar cele permise
  // În pagina generală apar DOAR întrebările generale (fără șantier). Cele de pe șantiere se gestionează în șantier.
  const deschiseToate = problemeSantier.filter((p)=>!raspunsCorectQA(p) && !p.santierId).slice().reverse();
  const rezultate = q.trim().length>=3
    ? rezolvate.map((p)=>({ p, scor: similaritateQA(q, p.intrebare) })).filter((x)=>x.scor>=0.3).sort((a,b)=>b.scor-a.scor).slice(0,5)
    : [];

  const intreaba = () => {
    if (!q.trim()) return;
    const item = { id: uid(), santierId:'', intrebare:q.trim(), raspunsuri:[], status:'deschis', creatDe:currentUser?.nume||'', creatId:currentUser?.id||'', data: new Date().toISOString().slice(0,10) };
    const next = [...problemeSantier, item];
    setProblemeSantier(next); persist('problemeSantier', next);
    notifica('manageri', { title:'Întrebare nouă (Asistent)', body:`${currentUser?.nume||'Un coleg'}: „${item.intrebare}".`, tag:'qa-general', url:'/?qa='+item.id }, currentUser?.id);
    setQ(''); setAiRasp(null); setAiEroare('');
  };

  // Întreabă AI-ul (dacă ruta /api/ai e configurată pe server). Îi dăm întrebarea + răspunsurile cunoscute ca context.
  const intreabaAI = async () => {
    if (!q.trim()) return;
    setAiLoading(true); setAiRasp(null); setAiEroare('');
    const context = rezolvate
      .map((p)=>({ p, scor: similaritateQA(q, p.intrebare) }))
      .sort((a,b)=>b.scor-a.scor).slice(0,12)
      .map((x)=>`Î: ${x.p.intrebare}\nR: ${x.p.raspuns}`);
    try {
      const r = await authFetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ intrebare:q.trim(), context }) });
      let d={}; try{ d=await r.json(); }catch{}
      if (r.ok && d && d.raspuns) setAiRasp({ text:d.raspuns });
      else if (r.status===404) setAiEroare('AI-ul nu e încă activat pe server (ruta /api/ai lipsește). Merge căutarea în răspunsurile de mai jos.');
      else if (r.status===500) setAiEroare('AI-ul nu e configurat (lipsește cheia). Vezi mai jos răspunsurile din baza de cunoștințe.');
      else setAiEroare((d && d.error) ? d.error : 'AI indisponibil momentan. Vezi răspunsurile de mai jos.');
    } catch(e){ setAiEroare('Fără conexiune la AI. Vezi răspunsurile de mai jos.'); }
    setAiLoading(false);
  };

  const setPersist = (next) => { setProblemeSantier(next); persist('problemeSantier', next); };
  const adaugaRaspuns = (item, text, corect) => {
    const t = String(text||'').trim(); if (!t) return;
    const r = { id: uid(), text:t, autorNume: currentUser?.nume||'', autorId: currentUser?.id||'', data: new Date().toISOString().slice(0,10), corect: !!corect };
    const next = problemeSantier.map((p)=> p.id===item.id ? {...p, raspunsuri: corect ? [...raspunsuriQA(p).map((x)=>({...x,corect:false})), r] : [...raspunsuriQA(p), r], status: (corect||raspunsCorectQA(p))?'rezolvat':'raspuns'} : p);
    setPersist(next);
    setRaspunsForm((f)=>{ const c={...f}; delete c[item.id]; return c; });
    if (!isManager) notifica('manageri', { title:'Răspuns de verificat', body:`${currentUser?.nume||'Un coleg'} a răspuns la „${item.intrebare}".`, tag:'qa-verif', url:'/?qa='+item.id }, currentUser?.id);
    if (item.creatId && item.creatId!==currentUser?.id) notifica(item.creatId, { title: corect?'Răspuns confirmat ✅':'Un răspuns la întrebarea ta', body:`„${item.intrebare}" → ${t}`, tag:'qa-raspuns', url:'/?qa='+item.id }, currentUser?.id);
  };
  const marcheazaCorect = (item, raspunsId) => {
    setPersist(problemeSantier.map((p)=> p.id!==item.id ? p : {...p, raspunsuri: raspunsuriQA(p).map((x)=>({...x, corect: x.id===raspunsId})), status:'rezolvat'}));
    const r = raspunsuriQA(item).find((x)=>x.id===raspunsId);
    if (item.creatId && item.creatId!==currentUser?.id && r) notifica(item.creatId, { title:'Răspuns confirmat ✅', body:`„${item.intrebare}" → ${r.text}`, tag:'qa-raspuns', url:'/?qa='+item.id }, currentUser?.id);
  };
  const stergeRaspuns = (item, raspunsId) => setPersist(problemeSantier.map((p)=> p.id===item.id ? {...p, raspunsuri: raspunsuriQA(p).filter((x)=>x.id!==raspunsId)} : p));

  return (
    <div>
      <h2 className="text-lg mb-1" style={{ color:'var(--text)', fontFamily:"'Space Grotesk', sans-serif" }}>🤖 Asistent Q&A</h2>
      <p className="text-xs mb-4" style={{ color:'var(--muted2)' }}>Întreabă orice — răspunde din tot ce s-a întrebat și rezolvat pe toate șantierele.</p>

      <div className="rounded-xl p-3 mb-4" style={{ background:'var(--panel)', border:'1px solid var(--border)' }}>
        <textarea value={q} onChange={(e)=>setQ(e.target.value)} rows={2} placeholder="Ex: Ce disjunctor pun pe circuitul de aer condiționat?" className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2" style={inputStyle} />
        <div className="flex gap-2 flex-wrap">
          <button onClick={intreabaAI} disabled={aiLoading || q.trim().length<3} className="text-sm px-4 py-2 rounded-lg font-semibold disabled:opacity-40" style={{ color:'#14181C', background:'#C08CE0' }}>{aiLoading ? 'Se gândește…' : '✨ Întreabă AI'}</button>
          <button onClick={intreaba} disabled={!q.trim()} className="text-sm px-4 py-2 rounded-lg font-semibold disabled:opacity-40" style={{ color:'var(--text)', background:'var(--panel2)', border:'1px solid var(--border)' }}>📨 Trimite ca întrebare nouă</button>
        </div>
        {aiRasp && (
          <div className="rounded-lg px-3 py-2 mt-2" style={{ background:'#C08CE018', border:'1px solid #C08CE066' }}>
            <div className="text-[11px] font-bold" style={{ color:'#C08CE0' }}>✨ Răspuns AI (pe baza răspunsurilor voastre)</div>
            <div className="text-sm mt-1 whitespace-pre-wrap" style={{ color:'var(--text)' }}>{aiRasp.text}</div>
            <div className="text-[11px] mt-1" style={{ color:'var(--muted2)' }}>Verifică-l înainte să-l aplici — e orientativ.</div>
          </div>
        )}
        {aiEroare && <p className="text-xs mt-2" style={{ color:'#E9A23B' }}>{aiEroare}</p>}
      </div>

      {q.trim().length>=3 && (
        <div className="mb-5">
          <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'var(--muted2)' }}>Din răspunsurile de până acum {rezultate.length ? `(${rezultate.length})` : ''}</div>
          {rezultate.length === 0 ? (
            <div className="text-xs rounded-lg px-3 py-3" style={{ color:'var(--muted2)', background:'var(--panel)', border:'1px solid var(--border)' }}>Nu am găsit un răspuns similar. Apasă „📨 Trimite ca întrebare nouă" și managerul îți răspunde.</div>
          ) : (
            <div className="space-y-2">
              {rezultate.map(({p,scor})=>(
                <div key={p.id} className="rounded-xl p-3" style={{ background:'var(--panel)', border:'1px solid var(--border)', borderLeft:'4px solid #4CAF7D' }}>
                  <div className="text-sm" style={{ color:'var(--text)' }}>❓ {p.intrebare}</div>
                  <div className="text-sm mt-1" style={{ color:'#4CAF7D' }}>✅ {p.raspuns}</div>
                  <div className="text-[11px] mt-1" style={{ color:'var(--muted2)' }}>{numeSantier(p.santierId)} · potrivire {Math.round(scor*100)}% · răspuns de {p.raspunsDe||'manager'}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {deschiseToate.length > 0 && (
        <div>
          <div className="text-[11px] uppercase tracking-wider mb-1.5" style={{ color:'#E9A23B' }}>{isManager ? 'De verificat / de răspuns' : 'Întrebări deschise'} — toate șantierele ({deschiseToate.length})</div>
          <div className="space-y-2">
            {deschiseToate.map((item)=>{
              const raspunsuri = raspunsuriQA(item);
              const sug = isManager ? gasesteRaspunsCunoscut(item.intrebare, rezolvate.filter((x)=>x.id!==item.id), 0.5) : null;
              const eTinta = item.id === qaTarget;
              return (
                <div key={item.id} ref={eTinta ? targetRef : null} className="rounded-xl p-3" style={{ background:'var(--panel)', border: eTinta ? '2px solid #C08CE0' : '1px solid #E9A23B66', borderLeft:'4px solid #E9A23B', boxShadow: eTinta ? '0 0 0 3px #C08CE033' : 'none' }}>
                  <div className="text-sm" style={{ color:'var(--text)' }}>❓ {item.intrebare}</div>
                  <div className="text-[11px] mt-0.5 mb-1.5" style={{ color:'var(--muted2)' }}>{numeSantier(item.santierId)} · {item.creatDe||'coleg'} · {item.data}</div>
                  {raspunsuri.length>0 && (
                    <div className="space-y-1 mb-2">
                      {raspunsuri.map((r)=>(
                        <div key={r.id} className="flex items-start justify-between gap-2 text-xs px-2.5 py-1.5 rounded-lg" style={{ background: (isManager&&r.corect)?'#4CAF7D18':'var(--panel2)', border: (isManager&&r.corect)?'1px solid #4CAF7D66':'1px solid transparent' }}>
                          <div className="min-w-0">
                            <div style={{ color:'var(--text)' }}>{isManager && r.corect && <span style={{ color:'#4CAF7D', fontWeight:700 }}>✅ Corect · </span>}{r.text}</div>
                            <div className="text-[10px] mt-0.5" style={{ color:'var(--muted2)' }}>{r.autorNume||'coleg'} · {r.data}</div>
                          </div>
                          {isManager && (
                            <div className="flex items-center gap-1 shrink-0">
                              {!r.corect && <button onClick={()=>marcheazaCorect(item, r.id)} className="text-[10px] px-2 py-0.5 rounded font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✓ Corect</button>}
                              <button onClick={()=>stergeRaspuns(item, r.id)} style={{ color:'#E05252' }}>🗑</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  {sug && (
                    <div className="rounded-lg px-3 py-2 mb-2" style={{ background:'#C08CE018', border:'1px solid #C08CE066' }}>
                      <div className="text-[11px]" style={{ color:'#C08CE0', fontWeight:700 }}>💡 Răspuns cunoscut (potrivire {Math.round(sug.scor*100)}%): {sug.sursa.raspuns}</div>
                      <button onClick={()=>adaugaRaspuns(item, sug.sursa.raspuns, true)} className="mt-1.5 text-xs px-3 py-1 rounded-lg font-semibold" style={{ color:'#14181C', background:'#4CAF7D' }}>✓ Folosește-l ca răspuns corect</button>
                    </div>
                  )}
                  <div className="flex gap-1">
                    <input value={raspunsForm[item.id]||''} onChange={(e)=>setRaspunsForm((f)=>({...f, [item.id]: e.target.value}))} onKeyDown={(e)=>{ if(e.key==='Enter'){ adaugaRaspuns(item, raspunsForm[item.id], isManager); } }} placeholder={isManager?'Scrie răspunsul corect...':'Scrie un răspuns...'} className="flex-1 rounded-lg px-3 py-1.5 text-xs outline-none" style={inputStyle} />
                    <button onClick={()=>adaugaRaspuns(item, raspunsForm[item.id], isManager)} className="text-xs px-3 py-1.5 rounded-lg font-semibold" style={{ color:'#14181C', background:'#2E8BD1' }}>{isManager?'✓ Răspuns corect':'Răspunde'}</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// Șablon standard de checklist (editabil de Manager). Scule/acces = liste de text; verificări = {text, obligatoriu}.
const CHECKLIST_SABLON_DEFAULT = {
  scule: ['Rotopercutor + burghie', 'Multimetru / tester tensiune', 'Trusă șurubelnițe + clești', 'Scară', 'Prelungitor', 'Bandă izolatoare / conectori', 'Aparat măsură priză de pământ'],
  acces: ['Chei / acces la locație', 'Echipament de protecție (cască, mănuși, ochelari)', 'Planșe / schițe la zi'],
  verificari: [
    { text: 'Tablou etichetat corect', obligatoriu: true },
    { text: 'Siguranțe și diferențiale (RCD) testate', obligatoriu: true },
    { text: 'Priză de pământ măsurată', obligatoriu: true },
    { text: 'Continuitate / izolație verificată', obligatoriu: true },
    { text: 'Toate prizele și întrerupătoarele funcționale', obligatoriu: true },
    { text: 'Strângeri conexiuni verificate', obligatoriu: true },
    { text: 'S-a executat tot ce e în deviz', obligatoriu: true },
    { text: 'Capace / rame / doze montate', obligatoriu: false },
    { text: 'Curățenie la finalul lucrării', obligatoriu: false },
    { text: 'Poze finale făcute', obligatoriu: false },
  ],
};

function ChecklistTab({ santier, checklistSantier, setChecklistSantier, checklistConfirmari, setChecklistConfirmari, checklistSablon, setChecklistSablon, materialeLista, pozitii, cereri, materials, sculeSantier, rapoarte, allUsers, currentUser, isManager, persist, onFinalizeSantier }) {
  const inputStyle = { background:'var(--panel2)', color:'var(--text)', border:'1px solid var(--border)' };
  const santierId = santier?.id;
  const azi = () => new Date().toISOString().slice(0,10);
  const sablon = checklistSablon || CHECKLIST_SABLON_DEFAULT;

  const [sablonOpen, setSablonOpen] = useState(false);
  const [openStart, setOpenStart] = useState(false);
  const [openFinal, setOpenFinal] = useState(false);
  const [manualStart, setManualStart] = useState('');
  const [manualFinal, setManualFinal] = useState('');
  const [pickerSculeOpen, setPickerSculeOpen] = useState(false);
  const [pickerMatOpen, setPickerMatOpen] = useState(false);
  const [filtruScule, setFiltruScule] = useState('');
  const [filtruMat, setFiltruMat] = useState('');
  const [manualScula, setManualScula] = useState('');
  const [manualMat, setManualMat] = useState('');
  const [nouScula, setNouScula] = useState('');
  const [nouAcces, setNouAcces] = useState('');
  const [nouVerif, setNouVerif] = useState('');

  const items = (checklistSantier || []).filter((i)=>i.santierId===santierId);
  const startItems = items.filter((i)=>i.faza==='start');
  const finalItems = items.filter((i)=>i.faza==='final');
  const confirmari = (checklistConfirmari || []).filter((c)=>c.santierId===santierId);

  const echipaActivi = echipaNormalizata(santier?.echipa).filter((e)=>e.status==='activ');
  const numeUser = (uid) => allUsers.find((u)=>u.id===uid)?.nume || (uid===currentUser?.id ? currentUser?.nume : '') || 'coleg';

  const saveItems = (next) => { setChecklistSantier(next); persist('checklistSantier', next); };
  const saveConfirmari = (next) => { setChecklistConfirmari(next); persist('checklistConfirmari', next); };
  const saveSablon = (next) => { setChecklistSablon(next); persist('checklistSablon', next); };

  const existaText = (faza, text) => items.some((i)=>i.faza===faza && i.text.trim().toLowerCase()===text.trim().toLowerCase());
  const addItem = (faza, tip, text, obligatoriu) => {
    if (!text || !text.trim() || existaText(faza, text)) return;
    saveItems([...(checklistSantier||[]), { id: uid(), santierId, faza, tip, text: text.trim(), obligatoriu: !!obligatoriu, bifat:false, bifatDe:'', bifatData:'' }]);
  };
  const addMulte = (faza, tip, lista) => {
    let next = [...(checklistSantier||[])];
    lista.forEach((el)=>{
      const text = (typeof el === 'string') ? el : el.text;
      const obl = (typeof el === 'string') ? false : !!el.obligatoriu;
      if (text && text.trim() && !next.some((i)=>i.santierId===santierId && i.faza===faza && i.text.trim().toLowerCase()===text.trim().toLowerCase())) {
        next.push({ id: uid(), santierId, faza, tip, text: text.trim(), obligatoriu: obl, bifat:false, bifatDe:'', bifatData:'' });
      }
    });
    saveItems(next);
  };
  const toggleBifat = (id) => {
    saveItems((checklistSantier||[]).map((i)=> i.id===id ? { ...i, bifat: !i.bifat, lipsa:false, bifatDe: !i.bifat ? (currentUser?.id||'') : '', bifatNume: !i.bifat ? (currentUser?.nume||'') : '', bifatData: !i.bifat ? azi() : '' } : i));
  };
  // Pentru elementele de la ÎNCEPUT: stare clară „am" / „lipsă" / neatins.
  const setStareItem = (id, stare) => {
    saveItems((checklistSantier||[]).map((i)=> i.id===id ? {
      ...i,
      bifat: stare==='am',
      lipsa: stare==='lipsa',
      bifatDe: stare==='am' ? (currentUser?.id||'') : '',
      bifatNume: stare==='am' ? (currentUser?.nume||'') : '',
      bifatData: stare==='am' ? azi() : '',
    } : i));
  };
  const startScule = startItems.filter((i)=>i.tip==='scula');
  const startMateriale = startItems.filter((i)=>i.tip==='material' || i.tip==='manual');
  const peLista = (text, tip) => startItems.some((i)=> i.tip===tip && i.text.trim().toLowerCase()===String(text||'').trim().toLowerCase());
  const toggleItem = (text, tip) => {
    const ex = startItems.find((i)=> i.tip===tip && i.text.trim().toLowerCase()===String(text||'').trim().toLowerCase());
    if (ex) delItem(ex.id); else addItem('start', tip, text);
  };
