<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/olimp/manifest.webmanifest">
<link rel="icon" href="/olimp/icon-192.png">
<link rel="apple-touch-icon" href="/olimp/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olimpul">
<meta name="theme-color" content="#030814">
<meta name="robots" content="noindex">
<title>Olimp · Centru de comandă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Olimp v3 (18.11.2026): centru de comandă. Zeus e nucleul, ceilalți agenți sunt noduri pe un inel de date.
   Fundal navy cu grilă fină și particule; carduri de sticlă; accent cyan #02A3E4 (brandul).
   HTML + SVG + CSS (+ un canvas mic pentru particule). Fără biblioteci. Datele: /olimp/stari.json, neschimbat.
   prefers-reduced-motion: fără animații (particulele rămân fixe, impulsurile nu circulă). */
:root{
  color-scheme:dark;
  --bg:#030814;
  --navy:#0a1a33;
  --cyan:#02A3E4;
  --cyan2:#5fd4ff;
  --ink:#e8f1fb;
  --mute:#8396b3;
  --line:rgba(2,163,228,.22);
  --glass:rgba(9,22,44,.55);
  --act:#02A3E4;
  --wait:#ffb547;
  --idle:#5b6b85;
  --off:#36435a;
  --f:"Inter",system-ui,"Segoe UI",sans-serif;
  --m:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;min-height:100svh;color:var(--ink);font-family:var(--f);font-size:14px;overflow-x:hidden;
  background:
    radial-gradient(60% 50% at 50% 45%,rgba(2,163,228,.13),transparent 70%),
    radial-gradient(40% 40% at 85% 10%,rgba(40,70,160,.18),transparent 70%),
    linear-gradient(rgba(2,163,228,.055) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(2,163,228,.055) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.65))}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- antet ---------- */
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(3,8,20,.92),rgba(3,8,20,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(2,163,228,.5);
  background:linear-gradient(145deg,rgba(2,163,228,.25),rgba(2,163,228,.04));box-shadow:0 0 18px -4px var(--cyan),inset 0 1px 0 rgba(255,255,255,.15)}
.brand h1{margin:0;font-weight:800;font-size:17px;letter-spacing:.32em}
.brand small{display:block;font-family:var(--m);font-size:10px;letter-spacing:.22em;color:var(--cyan2);text-transform:uppercase;opacity:.85}
.right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--m);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.live{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:7px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--off)}
.live.on{color:var(--cyan2)}
.live.on i{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:clipeste 1.6s ease-in-out infinite}
.btn{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(2,163,228,.08);
  border:1px solid rgba(2,163,228,.4);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:rgba(2,163,228,.16)}
.btn .badge{background:var(--wait);color:#1c1204;border-radius:5px;padding:0 6px;font-weight:600}
.btn .badge[hidden]{display:none}
@keyframes clipeste{50%{opacity:.35}}

/* ---------- bara de indicatori ---------- */
.kpis{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1320px;margin:16px auto 0;padding:0 20px}
.kpi{all:unset;box-sizing:border-box;position:relative;overflow:hidden;padding:12px 14px 11px;border-radius:12px;background:var(--glass);
  border:1px solid rgba(120,170,230,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -18px #000;display:flex;flex-direction:column;gap:3px;min-width:0}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:rgba(2,163,228,.45)}
.kpi[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 24px -8px var(--cyan)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--k,var(--cyan));opacity:.9;box-shadow:0 0 12px var(--k,var(--cyan))}
.kpi .l{font-family:var(--m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--m);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.kpi .v small{font-size:14px;color:var(--mute);font-weight:500}
.kpi .s{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- scena: nucleul + inelul de noduri ---------- */
.stage{position:relative;z-index:1;max-width:1400px;margin:14px auto 0;overflow-x:clip;height:var(--sh,720px)}
.floor{position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;pointer-events:none;
  transform:perspective(900px) rotateX(72deg) translateZ(-120px);
  background:linear-gradient(rgba(2,163,228,.16) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,rgba(2,163,228,.16) 1px,transparent 1px) 0 0/60px 60px;
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 30%,transparent 62%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 30%,transparent 62%);opacity:.55}
.hud{position:absolute;inset:0;pointer-events:none;overflow:visible}
.hud .ring{fill:none;stroke:rgba(2,163,228,.28);stroke-width:1}
.hud .ring2{fill:none;stroke:rgba(2,163,228,.12);stroke-width:1;stroke-dasharray:2 6}
.hud .tick{stroke:rgba(2,163,228,.35);stroke-width:1}
.sweepW{position:absolute;left:50%;top:50%;pointer-events:none}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(2,163,228,.0) 0deg,rgba(2,163,228,.0) 300deg,rgba(2,163,228,.16) 355deg,rgba(95,212,255,.35) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 18%,#000 19%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 18%,#000 19%,#000 70%,transparent 71%);animation:roteste 7s linear infinite}
.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.links .base{fill:none;stroke-width:1;stroke-opacity:.18}
.links .base.s-lucreaza{stroke-opacity:.5;stroke-width:1.3}
.links .base.s-asteapta{stroke-opacity:.45;stroke-width:1.2}
.links .base.s-standby,.links .base.s-offline{stroke-dasharray:3 6}
.links .flow{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 70;animation:curge 1.6s linear infinite}
.links .flow.s-asteapta{stroke-dasharray:6 60;animation-duration:3s}
.links .dim{opacity:.12}
@keyframes curge{to{stroke-dashoffset:-80}}
@keyframes roteste{to{transform:rotate(360deg)}}

/* nucleul: Zeus */
.core{all:unset;box-sizing:border-box;position:absolute;z-index:4;width:236px;height:236px;transform:translate(-50%,-50%);cursor:pointer;display:grid;place-items:center}
.core .r{position:absolute;border-radius:50%;pointer-events:none}
.core .r1{inset:0;border:1px solid rgba(2,163,228,.35);box-shadow:0 0 50px -10px rgba(2,163,228,.6),inset 0 0 40px -12px rgba(2,163,228,.55)}
.core .r2{inset:12px;border:2px solid transparent;border-top-color:var(--cyan);border-right-color:rgba(2,163,228,.35);animation:roteste 6s linear infinite}
.core .r3{inset:26px;border:1px dashed rgba(95,212,255,.45);animation:roteste 24s linear infinite reverse}
.core .r4{inset:36px;background:radial-gradient(circle at 50% 35%,rgba(2,163,228,.30),rgba(6,18,40,.92) 62%);border:1px solid rgba(2,163,228,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px -20px #000;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.core .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;width:150px}
.core .tag{font-family:var(--m);font-size:9.5px;letter-spacing:.24em;color:var(--cyan2)}
.core .nm{font-weight:800;font-size:25px;letter-spacing:.3em;margin-right:-.3em;text-shadow:0 0 22px rgba(2,163,228,.8)}
.core .rl{font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.core .tk{font-size:11px;line-height:1.35;color:#cfe3f5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.core .wh{font-family:var(--m);font-size:9.5px;color:var(--mute);margin-top:1px}

/* nodurile (agenții) */
.node{all:unset;box-sizing:border-box;position:absolute;z-index:3;width:248px;transform:translate(-50%,-50%);cursor:pointer;
  display:grid;grid-template-columns:48px 1fr;gap:0 12px;padding:12px 14px 11px 12px;border-radius:14px;
  background:linear-gradient(155deg,rgba(18,40,74,.62),rgba(6,16,34,.72));border:1px solid rgba(120,170,230,.16);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -22px #000;transition:border-color .25s,box-shadow .25s,opacity .3s,filter .3s,transform .25s}
.node::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--sc),transparent);opacity:.7}
.node:hover,.node:focus-visible{border-color:rgba(2,163,228,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(2,163,228,.25),0 20px 44px -18px rgba(2,163,228,.45)}
.st{position:relative;width:48px;height:48px;align-self:center}
.st svg{position:absolute;inset:0;overflow:visible}
.st .bg{fill:none;stroke:rgba(140,170,210,.18);stroke-width:2}
.st .arc{fill:none;stroke:var(--sc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:38 113;transform-origin:24px 24px}
.st .pl{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--sc);opacity:0}
.st .cd{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-weight:600;font-size:12.5px;letter-spacing:.06em;
  color:var(--ink);background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.10),rgba(4,12,28,.9) 70%);border:1px solid rgba(140,170,210,.22)}
.hd{min-width:0;align-self:center;display:flex;flex-direction:column;gap:2px}
.hd .nm{display:block;font-weight:700;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rl{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{grid-column:1/-1;margin-top:8px;display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--m);font-size:9.5px;letter-spacing:0;color:var(--mute);white-space:nowrap}
.mt .sl{color:var(--sc);text-transform:uppercase;letter-spacing:.1em;display:inline-flex;align-items:center;gap:5px}
.mt .sl i{width:6px;height:6px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.mt .wh{overflow:hidden;text-overflow:ellipsis}
.tk{grid-column:1/-1;margin-top:6px;padding-top:7px;border-top:1px solid rgba(140,170,210,.12);font-size:12px;line-height:1.4;color:#c4d4ea;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk.gol{color:var(--mute);font-style:italic}

/* stările */
.s-lucreaza{--sc:var(--act)}
.s-asteapta{--sc:var(--wait)}
.s-standby{--sc:var(--idle)}
.s-offline{--sc:var(--off)}
.node.s-lucreaza{border-color:rgba(2,163,228,.5);background:linear-gradient(155deg,rgba(6,70,110,.55),rgba(5,18,38,.78));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(2,163,228,.12),0 0 34px -10px rgba(2,163,228,.6),0 18px 40px -22px #000}
.s-lucreaza .st .arc{animation:roteste 1.8s linear infinite}
.s-lucreaza .st .pl{animation:puls 2s ease-out infinite}
.node.s-asteapta{border-color:rgba(255,181,71,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 30px -12px rgba(255,181,71,.6),0 18px 40px -22px #000}
.s-asteapta .st .arc{stroke-dasharray:151 0;animation:respira 1.6s ease-in-out infinite}
.s-asteapta .st .pl{animation:puls 1.6s ease-out infinite}
.s-standby .st .arc,.s-offline .st .arc{stroke-dasharray:0 151}
.node.s-standby .hd .nm,.node.s-offline .hd .nm{color:#b5c2d6}
.node.s-standby .st .cd,.node.s-offline .st .cd{color:#8796ad}
.node.s-offline{opacity:.6}
.node.dim{opacity:.18;filter:grayscale(1)}
@keyframes puls{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes respira{50%{opacity:.35}}

.foot{position:relative;z-index:2;text-align:center;font-family:var(--m);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);padding:6px 16px 28px}

/* ---------- mod listă (ecran îngust): nucleul sus, magistrala de date în stânga ---------- */
.stage.lista{height:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:12px}
.stage.lista .floor,.stage.lista .hud,.stage.lista .sweepW,.stage.lista .links{display:none}
.stage.lista .core{position:relative;transform:none;align-self:center;width:210px;height:210px}
.stage.lista .bus{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.stage.lista .node{position:relative;transform:none;width:auto;left:auto!important;top:auto!important}
@media (max-width:640px){
  .stage.lista .bus{grid-template-columns:1fr;padding-left:20px}
  .stage.lista .bus::before{content:"";position:absolute;left:6px;top:-12px;bottom:24px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,rgba(2,163,228,.65),rgba(2,163,228,.12))}
  .stage.lista .bus::after{content:"";position:absolute;left:4px;top:-12px;width:6px;height:44px;border-radius:3px;
    background:linear-gradient(180deg,transparent,var(--cyan2),transparent);box-shadow:0 0 12px var(--cyan);animation:coboara 3.2s linear infinite}
  .stage.lista .node::after{content:"";position:absolute;left:-15px;top:50%;width:15px;height:1px;background:var(--sc);opacity:.45}
  .stage.lista .node.s-lucreaza::after,.stage.lista .node.s-asteapta::after{height:2px;opacity:1;box-shadow:0 0 8px var(--sc)}
}
@keyframes coboara{from{transform:translateY(0)}to{transform:translateY(var(--busH,1200px))}}

/* ---------- fișa agentului ---------- */
.card{position:fixed;left:16px;bottom:16px;width:min(380px,calc(100% - 32px));max-height:calc(100svh - 120px);overflow:auto;z-index:8;
  background:rgba(6,16,34,.9);border:1px solid rgba(2,163,228,.35);border-radius:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 0 40px -14px rgba(2,163,228,.5),0 30px 60px -30px #000;padding:16px;display:flex;flex-direction:column;gap:10px}
.card[hidden]{display:none}
.card .hd2{display:flex;align-items:center;gap:12px}
.card .orb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-weight:600;font-size:14px;flex:none;
  border:1.5px solid currentColor;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.1),rgba(4,12,28,.9) 70%)}
.card h3{margin:0;font-size:18px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.card .role{font-size:12.5px;color:var(--mute)}
.card .mit{margin:0;font-size:12px;line-height:1.45;color:#9fb0c8}
.card .x{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
.card .pill2{font-family:var(--m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:6px;border:1px solid currentColor;align-self:flex-start}
.card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.card .now{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:9px;line-height:1.45}
.card .now b{color:var(--ink);font-weight:600}

/* ---------- panoul ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);z-index:9;background:rgba(4,11,26,.95);border-left:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer .top{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.drawer .top h2{margin:0;font-family:var(--m);font-size:13px;letter-spacing:.24em;color:var(--cyan2)}
.drawer .top button{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer}
.drawer .body{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;display:flex;flex-direction:column;gap:16px}
.sec h4{margin:0 4px 8px;font-family:var(--m);font-size:10.5px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between}
.item{padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.03);border-left:2px solid var(--off);display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.item .t{display:flex;justify-content:space-between;gap:8px;font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.item .t time{color:var(--mute);text-transform:none;letter-spacing:0}
.item p{margin:0;font-size:13px;line-height:1.4}
.empty{padding:4px;color:var(--mute);font-size:12.5px}
.roster{display:grid;gap:2px}
.roster button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;min-width:0}
.roster button>span{font-family:var(--m);font-size:11px;font-weight:600;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(140,170,210,.3)}
.roster button>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.roster small{font-size:11.5px;line-height:1.35;color:var(--mute)}
.roster button:hover{background:rgba(2,163,228,.08)}
.roster b{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster i{width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none}

/* ---------- telefon ---------- */
@media (max-width:900px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .kpi.k4,.kpi.k5{grid-column:span 1} }
@media (max-width:640px){
  header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand h1{font-size:15px;letter-spacing:.26em}
  .clock{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px;margin-top:12px}
  .kpi{padding:10px 12px 9px}.kpi .v{font-size:21px}.kpi .l{font-size:9px;letter-spacing:.14em}
  .kpi.k5{grid-column:1/-1}
  .stage.lista{padding:16px 14px 8px}
  .node{grid-template-columns:44px 1fr;padding:11px 12px 10px 11px}
  .st{width:44px;height:44px}.st .cd{inset:6px;font-size:11.5px}
  .card{left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:62svh}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage.lista .bus::after,.sweepW{display:none}
  .s-lucreaza .st .pl{opacity:.5;transform:scale(1.15)}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z" fill="none" stroke="#5fd4ff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    <div><h1>OLIMP</h1><small>Centru de comandă</small></div>
  </div>
  <div class="right">
    <div class="clock" id="clock">--:--:--</div>
    <div class="live" id="live"><i></i><span>…</span></div>
    <button class="btn" id="openDrawer" type="button" aria-expanded="false" aria-controls="drawer">Panou <span class="badge" id="badge" hidden>0</span></button>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Indicatori live">
  <button class="kpi k1" type="button" data-f="lucreaza" style="--k:var(--act)"><span class="l">Agenți activi</span><span class="v" id="kAct">0</span><span class="s" id="kActS">lucrează acum</span></button>
  <button class="kpi k2" type="button" data-f="asteapta" style="--k:var(--wait)"><span class="l">Așteaptă input</span><span class="v" id="kWait">0</span><span class="s">de la Sebastian</span></button>
  <button class="kpi k3" type="button" data-f="standby" style="--k:var(--idle)"><span class="l">Standby</span><span class="v" id="kIdle">0</span><span class="s">disponibili</span></button>
  <div class="kpi k4" style="--k:#7cc8ff"><span class="l">Sarcini azi</span><span class="v" id="kAzi">0</span><span class="s">agenți cu activitate azi</span></div>
  <div class="kpi k5" style="--k:#7cc8ff"><span class="l">Ultima actualizare</span><span class="v" id="kUlt">--:--</span><span class="s" id="kUltS">—</span></div>
</section>

<main class="stage" id="stage">
  <div class="floor" aria-hidden="true"></div>
  <svg class="hud" id="hud" aria-hidden="true"></svg>
  <div class="sweepW" id="sweepW" aria-hidden="true"><div class="sweep"></div></div>
  <svg class="links" id="links" aria-hidden="true"></svg>
  <button class="core" id="core" type="button" aria-label="Zeus, nucleul. Deschide fișa.">
    <span class="r r1"></span><span class="r r2"></span><span class="r r3"></span><span class="r r4"></span>
    <span class="in"><span class="tag">NUCLEU · 00</span><span class="nm">ZEUS</span><span class="rl">Coordonare · tu vorbești doar cu el</span><span class="tk" id="zTk"></span><span class="wh" id="zWh"></span></span>
  </button>
  <div class="bus" id="bus"></div>
</main>
<div class="foot">Toți agenții raportează doar lui Zeus · date live din stari.json</div>

<div class="card" id="card" hidden></div>
<aside class="drawer" id="drawer" aria-label="Panou">
  <div class="top"><h2>PANOU</h2><button type="button" id="closeDrawer" aria-label="Închide panoul">×</button></div>
  <div class="body">
    <div class="sec"><h4>Atenție <span id="attCount">0</span></h4><div id="attention"></div></div>
    <div class="sec"><h4>Coada lui Zeus <span id="qCount">0</span></h4><div id="queue"></div></div>
    <div class="sec"><h4>Agenții <span id="nZei">12</span></h4><div class="roster" id="roster"></div></div>
  </div>
</aside>

<script>
/* cod = indicativul nodului (2 litere); ordinea de mai jos = ordinea pe inel, în sensul acelor de ceasornic, de sus */
const ZEI = [
  {id:"zeus",nume:"Zeus",cod:"ZS",grup:"centru",rol:"Coordonatorul Olimpului",mit:"Regele zeilor, stăpânul Olimpului și al fulgerului.",face:["Primește cererile tale și le împarte zeilor","Cere aprobarea ta pentru orice pas ireversibil","Adună rapoartele și îți răspunde"]},
  {id:"argus",nume:"Argus",cod:"AR",grup:"control",rol:"Controlul calității",mit:"Uriașul cu o sută de ochi (Argus Panoptes), paznicul pus de Hera, căruia nu-i scapă nimic.",face:["Verifică orice lucrare a zeilor înainte să ajungă la tine","Cifre, prețuri, numerotare, surse, reguli, date personale, cod","Registrul de greșeli și reguli noi"]},
  {id:"hefaistos",nume:"Hefaistos",cod:"HF",grup:"birou",rol:"Oferte și devize",mit:"Zeul fierarilor și al meșteșugurilor, care făurea totul în forja lui.",face:["Oferte și devize în EUR și LEI, Excel + PDF","Oferte în 3 variante și pachete pentru persoane fizice","Propunerea financiară la licitații; Excel și Word"]},
  {id:"plutos",nume:"Plutos",cod:"PL",grup:"birou",rol:"Bani și SmartBill",mit:"Zeul bogăției și al belșugului.",face:["SmartBill: facturi furnizori, NIR, stocuri, ciorne de facturi","Încasări, restanțe, datorii la furnizori","Contractat vs facturat; profit, marje, cash-flow"]},
  {id:"kronos",nume:"Kronos",cod:"KR",grup:"lucru",rol:"Șantiere și echipă",mit:"Titanul timpului, tatăl lui Zeus.",face:["Planul echipelor, rapoarte zilnice, pontaj, KPI de luni","Termene, situații de lucrări, facturat în 48 h după PV","Predări, garanții, mentenanță; angajări și instruire"]},
  {id:"brontes",nume:"Brontes",cod:"BR",grup:"lucru",rol:"Tehnic și proiectare",mit:"Ciclopul tunetului, care a făurit fulgerele lui Zeus.",face:["Calcule, protecții, tablouri, PLC, KNX, fotovoltaic","Proiecte și planuri electrice (inclusiv Casa Tuduce)","Configuratorul de tablouri; întreabă-l din aplicație"]},
  {id:"iris",nume:"Iris",cod:"IR",grup:"comunicare",rol:"WhatsApp și e-mail",mit:"Zeița curcubeului și mesagera zeilor între cer și pământ.",face:["Caută și citește conversații, extrage atașamentele","Ciorne de mesaje și pachete în „de trimis”","Nimic nu pleacă fără „trimite” de la tine"]},
  {id:"astreea",nume:"Astreea",cod:"AS",grup:"sfat",rol:"Contabil",mit:"Fecioara stelelor cu balanța în mână, simbolul dreptății și al echilibrului.",face:["TVA (și taxare inversă), impozite, salarii","Calendarul declarațiilor ANAF, e-Factura","Verifică cifrele, materiale pentru contabil"]},
  {id:"dike",nume:"Dike",cod:"DK",grup:"sfat",rol:"Avocat și licitații",mit:"Zeița justiției, fiica Themisei; veghează să se facă dreptate.",face:["Avocat: verifică orice act, spețe, termene, riscuri","Contracte și conformitate (ONRC, ANAF, ITM, ANRE, GDPR)","Licitații: GO/NO-GO, dosar de calificare, CNSC"]},
  {id:"tyche",nume:"Tyche",cod:"TY",grup:"sfat",rol:"Coach și creștere",mit:"Zeița norocului și a prosperității cetăților.",face:["Strategie și priorități, coach la 07:30","Radar de inovații și lucrări noi (SEAP, autorizații)","Marketing: Google Business, recenzii, portofoliu"]},
  {id:"hestia",nume:"Hestia",cod:"HS",grup:"aplicatii",rol:"Aplicația firmei",mit:"Zeița vetrei și a casei, focul care ține familia unită.",face:["Rapoarte zilnice, șantiere, clienți, dosare","Funcții noi, PR-uri, deploy și verificare live","GitHub + Vercel pentru firma-api.vercel.app"]},
  {id:"demeter",nume:"Demeter",cod:"DM",grup:"aplicatii",rol:"Rețete, salon, frizerie",mit:"Zeița recoltei, a grânelor și a hranei.",face:["Ce mâncăm azi? — rețete după ingrediente","Style by VAJ — programări, fișe, stoc, mirese","Barber Station — barber-station-rho.vercel.app"]},
];
/* zeii de dinainte de consolidarea din 26.10.2026 -> cine le-a preluat munca (stari.json îi păstrează; harta nu-i mai arată,
   iar ce au lăsat în coada lui Zeus apare la zeul care i-a preluat; un zeu necunoscut apare cu numele lui, ca înainte) */
const PRELUAT = {athena:"plutos",metis:"plutos",themis:"dike",eunomia:"dike",nike:"dike",angelia:"iris",hermes:"iris",mnemosyne:"hefaistos",
  kratos:"kronos",hebe:"kronos",asklepios:"kronos",artemis:"tyche",eos:"tyche",peitho:"tyche",apollo:"brontes",prometheus:"brontes",hera:"brontes",
  atlas:"hestia",afrodita:"demeter",dionysos:"demeter",ananke:"zeus"};
const STARI = {
  lucreaza:{label:"Activ",col:"#02A3E4"},
  asteapta:{label:"Așteaptă input",col:"#ffb547"},
  standby:{label:"Standby",col:"#5b6b85"},
  offline:{label:"Offline",col:"#36435a"},
};
let stare={}, coada=[], filtru=null, selectat=null;
const $=s=>document.querySelector(s);
const st=id=>(stare[id]&&STARI[stare[id].stare])?stare[id].stare:(id==="zeus"?"lucreaza":"standby");
const zeu=id=>ZEI.find(z=>z.id===id);
const AG=ZEI.filter(z=>z.id!=="zeus");
const cand=iso=>{if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const m=Math.round((Date.now()-d)/60000);
  if(m<1)return"acum";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";return Math.round(h/24)+" z";};
/* ultima activitate: „acum 12 min · 14:32” (azi) sau „acum 3 zile · 15.11 14:32” */
function cand2(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const m=Math.round((Date.now()-d)/60000);
  const hm=d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"}),ora=esteAzi(iso)?hm:d.toLocaleDateString("ro-RO",{day:"2-digit",month:"2-digit"})+" "+hm;
  let r;if(m<1)r="chiar acum";else if(m<60)r="acum "+m+" min";else{const h=Math.round(m/60);if(h<24)r="acum "+h+" h";else{const z=Math.round(h/24);r="acum "+z+(z===1?" zi":" zile");}}
  return r+" · "+ora;}
const esteAzi=iso=>{const d=new Date(iso);return !isNaN(d)&&d.toDateString()===new Date().toDateString();};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const NS="http://www.w3.org/2000/svg";
const sv=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e;};

/* ---------- particule (canvas mic, ~1 particulă la 22 000 px²) ---------- */
(function(){const c=$("#fx"),x=c.getContext("2d");let W,H,P=[];
  function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    const n=Math.min(90,Math.round(W*H/22000));P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,v:.08+Math.random()*.25,r:Math.random()*1.3+.3,a:Math.random()*.5+.15});desen();}
  function desen(){x.clearRect(0,0,W,H);for(const p of P){x.fillStyle=`rgba(95,212,255,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();}}
  function pas(){if(!document.hidden){for(const p of P){p.y-=p.v;p.x+=Math.sin(p.y*.01)*.1;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}}desen();}requestAnimationFrame(pas);}
  addEventListener("resize",rs);rs();if(!reduce)requestAnimationFrame(pas);})();

/* ---------- ceasul ---------- */
setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString("ro-RO");},1000);

/* ---------- nodurile ---------- */
const NOD={};
function construieste(){const B=$("#bus");B.textContent="";
  AG.forEach((z,i)=>{const b=el("button","node");b.type="button";b.dataset.id=z.id;
    const s=el("span","st");s.innerHTML='<svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="22"/><circle class="arc" cx="24" cy="24" r="22"/></svg>';
    s.append(el("span","pl"),el("span","cd",z.cod));
    const hd=el("span","hd");hd.append(el("span","nm",z.nume),el("span","rl",z.rol));
    const mt=el("span","mt");
    b.append(s,hd,mt,el("span","tk"));b.onclick=()=>{selectat=z.id;fisa();};B.appendChild(b);NOD[z.id]=b;});
  $("#core").onclick=()=>{selectat="zeus";fisa();};
}
function actualizeaza(){
  for(const z of AG){const b=NOD[z.id],s=st(z.id),info=stare[z.id]||{};
    b.className="node s-"+s+(filtru&&filtru!==s?" dim":"");
    const mt=b.querySelector(".mt");mt.textContent="";const sl=el("span","sl");sl.append(el("i"),document.createTextNode(STARI[s].label));mt.appendChild(sl);
    const w=cand2(info.actualizat);if(w)mt.appendChild(el("span","wh",w));
    const tk=b.querySelector(".tk");tk.textContent=info.sarcina||"Fără sarcină în lucru.";tk.classList.toggle("gol",!info.sarcina);
    b.title=z.nume+" · "+STARI[s].label+(info.sarcina?" — "+info.sarcina:"");
    b.setAttribute("aria-label",z.nume+", "+z.rol+", "+STARI[s].label+(w?", "+w:"")+(info.sarcina?". "+info.sarcina:""));}
  const zi=stare.zeus||{};$("#zTk").textContent=zi.sarcina||"Primește cererile tale și le împarte agenților.";$("#zWh").textContent=cand2(zi.actualizat);
  // indicatorii
  const n=k=>AG.filter(z=>st(z.id)===k).length;
  $("#kAct").innerHTML="";$("#kAct").append(document.createTextNode(n("lucreaza")),el("small",null," / "+AG.length));
  $("#kWait").textContent=n("asteapta");$("#kIdle").textContent=n("standby")+n("offline");
  $("#kAzi").textContent=ZEI.filter(z=>stare[z.id]&&esteAzi(stare[z.id].actualizat)).length;
  let ult=null;for(const z of ZEI){const a=stare[z.id]&&stare[z.id].actualizat;const d=a?new Date(a):null;if(d&&!isNaN(d)&&(!ult||d>ult.d))ult={d,z};}
  if(ult){$("#kUlt").textContent=ult.d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});$("#kUltS").textContent=ult.z.nume+" · "+cand2(ult.d.toISOString()).split(" · ")[0]+(esteAzi(ult.d.toISOString())?"":" · "+ult.d.toLocaleDateString("ro-RO"));}
  document.querySelectorAll(".kpi[data-f]").forEach(k=>k.setAttribute("aria-pressed",filtru===k.dataset.f?"true":"false"));
  aseaza();
}
document.querySelectorAll(".kpi[data-f]").forEach(k=>k.onclick=()=>{filtru=filtru===k.dataset.f?null:k.dataset.f;actualizeaza();});

/* ---------- geometria: inel (ecran lat) sau listă (ecran îngust) ---------- */
let semn="";
function aseaza(){
  const S=$("#stage"),W=S.clientWidth,inel=innerWidth>=1180&&innerHeight>=620;
  S.classList.toggle("lista",!inel);
  const L=$("#links"),Hd=$("#hud");
  if(!inel){S.style.removeProperty("--sh");for(const z of AG){NOD[z.id].style.left=NOD[z.id].style.top="";}L.textContent="";Hd.textContent="";semn="";
    const bus=$("#bus");bus.style.setProperty("--busH",bus.offsetHeight+"px");return;}
  const top=S.getBoundingClientRect().top+scrollY,H=Math.max(660,Math.min(820,innerHeight-top-34));S.style.setProperty("--sh",H+"px");
  const cx=W/2,cy=H/2,cw=248,ch=NOD[AG[0].id].offsetHeight||104;
  const rx=Math.min(590,cx-cw/2-14),ry=cy-ch/2-8;
  const poz={};AG.forEach((z,i)=>{const a=-Math.PI/2+i*2*Math.PI/AG.length;poz[z.id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,a};
    NOD[z.id].style.left=poz[z.id].x+"px";NOD[z.id].style.top=poz[z.id].y+"px";});
  const C=$("#core");C.style.left=cx+"px";C.style.top=cy+"px";
  const sw=$("#sweepW"),R=Math.min(rx,ry)*1.0;sw.style.width=sw.style.height=2*rx+"px";sw.style.transform=`translate(-50%,-50%) scaleY(${(ry/rx).toFixed(3)})`;
  const nou=JSON.stringify([W,H,AG.map(z=>st(z.id)),filtru]);if(nou===semn)return;semn=nou;
  // inelele HUD + gradațiile
  Hd.setAttribute("viewBox",`0 0 ${W} ${H}`);Hd.textContent="";
  Hd.append(sv("ellipse",{class:"ring",cx,cy,rx,ry}),sv("ellipse",{class:"ring2",cx,cy,rx:rx*.62,ry:ry*.62}),sv("ellipse",{class:"ring2",cx,cy,rx:rx*1.06,ry:ry*1.06}));
  for(let k=0;k<72;k++){const a=k*Math.PI/36,l=k%6?5:11;Hd.appendChild(sv("line",{class:"tick",x1:cx+Math.cos(a)*rx*1.06,y1:cy+Math.sin(a)*ry*1.06,x2:cx+Math.cos(a)*(rx*1.06+l),y2:cy+Math.sin(a)*(ry*1.06+l*ry/rx)}));}
  // liniile de date
  L.setAttribute("viewBox",`0 0 ${W} ${H}`);L.textContent="";
  for(const z of AG){const p=poz[z.id],s=st(z.id),col=STARI[s].col,dim=filtru&&filtru!==s?" dim":"";
    const d=`M${cx.toFixed(1)},${cy.toFixed(1)} L${p.x.toFixed(1)},${p.y.toFixed(1)}`;
    L.appendChild(sv("path",{d,class:"base s-"+s+dim,stroke:col}));
    if(s==="lucreaza"||s==="asteapta"){L.appendChild(sv("path",{d,class:"flow s-"+s+dim,stroke:col}));
      if(!reduce&&!dim&&s==="lucreaza"){for(let k=0;k<2;k++){const c=sv("circle",{r:"2.6",fill:"#bff0ff"});c.style.filter="drop-shadow(0 0 6px #02A3E4)";
        c.appendChild(sv("animateMotion",{dur:"2.2s",begin:(k*1.1)+"s",repeatCount:"indefinite",path:d}));L.appendChild(c);}}}}
}
let rq=0;const programeaza=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{semn="";aseaza();});};
addEventListener("resize",programeaza);addEventListener("orientationchange",()=>setTimeout(programeaza,300));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(programeaza);

/* ---------- fișa, panoul ---------- */
function fisa(){const C=$("#card");if(!selectat){C.hidden=true;return;}
  const z=zeu(selectat),s=st(z.id),info=stare[z.id]||{},col=STARI[s].col;C.hidden=false;C.textContent="";
  const hd=el("div","hd2");const orb=el("div","orb",z.cod);orb.style.color=col;const tx=el("div");tx.append(el("h3",null,z.nume),el("div","role",z.rol));
  const x=el("button","x","×");x.type="button";x.setAttribute("aria-label","Închide");x.onclick=()=>{selectat=null;fisa();};hd.append(orb,tx,x);
  const pill=el("span","pill2",STARI[s].label+(info.actualizat?" · "+cand2(info.actualizat):""));pill.style.color=col;
  const ul=el("ul");z.face.forEach(t=>ul.appendChild(el("li",null,t)));
  const now=el("div","now");
  if(info.sarcina){now.append(el("b",null,"Acum: "),el("span",null,info.sarcina));}
  else now.textContent=z.id==="zeus"?"Tu vorbești doar cu Zeus. Toți ceilalți agenți raportează doar lui.":"Nicio sarcină în lucru. Raportează doar lui Zeus.";
  C.append(hd,pill,now,ul,el("p","mit","În mitologie: "+z.mit));x.focus({preventScroll:true});}
function item(col,titlu,timp,text){const d=el("div","item");d.style.borderLeftColor=col;
  const t=el("div","t");const b=el("b",null,titlu);b.style.color=col;t.append(b,el("time",null,timp));d.append(t,el("p",null,text));return d;}
function sertar(){
  const att=ZEI.filter(z=>st(z.id)==="asteapta");$("#attCount").textContent=att.length;const A=$("#attention");A.textContent="";
  if(!att.length)A.appendChild(el("div","empty","Niciun agent nu așteaptă răspunsul tău."));
  att.forEach(z=>A.appendChild(item(STARI.asteapta.col,z.cod+" "+z.nume,cand(stare[z.id]?.actualizat),stare[z.id]?.sarcina||"Are o întrebare pentru tine.")));
  const Q=$("#queue");Q.textContent="";$("#qCount").textContent=coada.length;
  if(!coada.length)Q.appendChild(el("div","empty","Coada e goală."));
  coada.forEach(q=>{const z=zeu(q.zeu)||{nume:q.zeu||"?",cod:"··"};const col=q.tip==="APROBARE"?"#5fd4ff":q.tip==="ÎNTREBARE"?"#ffb547":"#5b6b85";const fost=q.fost?` (de la ${q.fost[0].toUpperCase()+q.fost.slice(1)})`:"";Q.appendChild(item(col,`${z.cod} ${z.nume}${fost} · ${q.tip||"NOTĂ"}`,cand(q.creat),q.text||""));});
  const R2=$("#roster");R2.textContent="";ZEI.forEach(z=>{const b=el("button");b.type="button";b.title=z.rol;
    const d=el("div");d.append(el("b",null,z.nume),el("small",null,z.rol));const i=el("i");i.style.background=STARI[st(z.id)].col;b.append(el("span",null,z.cod),d,i);
    b.onclick=()=>{selectat=z.id;fisa();inchide();};R2.appendChild(b);});
  $("#nZei").textContent=ZEI.length;
  const n=att.length+coada.length,bd=$("#badge");bd.textContent=n;bd.hidden=!n;
}
const dr=$("#drawer"),ob=$("#openDrawer");
function deschide(){dr.classList.add("open");ob.setAttribute("aria-expanded","true");}
function inchide(){dr.classList.remove("open");ob.setAttribute("aria-expanded","false");}
ob.onclick=()=>dr.classList.contains("open")?inchide():deschide();$("#closeDrawer").onclick=inchide;
addEventListener("keydown",e=>{if(e.key==="Escape"){inchide();selectat=null;fisa();}});
function totul(){sertar();actualizeaza();if(selectat)fisa();}
construieste();totul();setInterval(totul,60000);

/* date live: stările zeilor din /olimp/stari.json (le scrie Zeus), reîmprospătate la 20 de secunde */
(function(){const live=$("#live");
  async function ia(){try{const r=await fetch("/olimp/stari.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    stare=d.zei||{};coada=(d.coada||[]).map(q=>!zeu(q.zeu)&&PRELUAT[q.zeu]?{...q,zeu:PRELUAT[q.zeu],fost:q.zeu}:q).sort((a,b)=>String(b.creat).localeCompare(String(a.creat)));
    live.classList.add("on");live.querySelector("span").textContent="live";totul();}
  catch(e){live.classList.remove("on");live.querySelector("span").textContent="fără conexiune";}}
  ia();setInterval(ia,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ia()});
})();
</script>
