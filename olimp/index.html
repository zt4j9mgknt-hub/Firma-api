<body><title>Olimpul · Consola zeilor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cosmos pe tot ecranul. Zeus în centru, 6 zei (control, oferte și bani, șantiere și tehnic, comunicare) pe inelul interior, 5 (sfat + aplicații) pe inelul exterior, distanțe egale. 11 zei activi după consolidarea din 26.10.2026.
   Panoul e un sertar închis implicit; fișa zeului apare jos-stânga doar când alegi pe cineva. */
:root{
  color-scheme:dark;
  --void:#04070f;
  --glass:rgba(10,18,40,.78);
  --edge:rgba(120,150,220,.2);
  --marble:#eef2fb;
  --mist:#9aa8c9;
  --gold:#f3c56b;
  --ok:#43e0b8;
  --wait:#ffad3b;
  --idle:#6f8ae0;
  --off:#4a5677;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--marble);font-family:var(--f-body);font-size:14px;overflow:hidden}
.stage{position:relative;height:100%;min-height:540px}
canvas#cosmos{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,7,15,.9),rgba(4,7,15,0));z-index:3}
header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.22em;
  background:linear-gradient(90deg,#fff3cf,var(--gold) 45%,#b9862e);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--mist);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip,.btn{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--edge);padding:6px 10px;border-radius:999px;
  display:inline-flex;gap:7px;align-items:center;background:var(--glass);color:var(--mist);cursor:pointer;backdrop-filter:blur(8px)}
.chip b,.btn b{font-weight:500;color:var(--marble);font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"],.btn[aria-expanded="true"]{border-color:var(--gold);color:var(--marble)}
.btn .badge{background:var(--wait);color:#1b1206;border-radius:999px;padding:0 6px;font-weight:600}
.btn .badge[hidden]{display:none}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.live{font-family:var(--f-mono);font-size:11px;color:var(--mist);display:flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.live.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* fișa zeului selectat */
.card{position:absolute;left:16px;bottom:16px;width:min(340px,calc(100% - 32px));background:var(--glass);border:1px solid var(--edge);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;display:flex;flex-direction:column;gap:10px;z-index:3}
.card[hidden]{display:none}
.card .hd{display:flex;align-items:center;gap:12px}
.card .orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;flex:none;border:1.5px solid currentColor;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.02) 60%)}
.card h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:.12em}
.card .role{font-size:13px;color:var(--mist)}
.card .mit{margin:-2px 0 0;font-size:12.5px;font-style:italic;line-height:1.45;color:#c9d3ea}
.card .x{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--mist);font-size:20px;cursor:pointer;line-height:1}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid currentColor;align-self:flex-start}
.card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.card .now{font-size:13px;color:var(--mist);border-top:1px solid var(--edge);padding-top:9px;line-height:1.45}
.card .now b{color:var(--marble);font-weight:500}

/* sertarul */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(360px,100%);background:rgba(7,12,28,.92);border-left:1px solid var(--edge);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:4;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .top{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--edge)}
.drawer .top h2{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.22em;color:var(--gold)}
.drawer .top button{background:none;border:0;color:var(--mist);font-size:22px;cursor:pointer}
.drawer .body{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;display:flex;flex-direction:column;gap:16px}
.sec h4{margin:0 4px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--mist);text-transform:uppercase;display:flex;justify-content:space-between}
.item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.035);border-left:3px solid var(--off);display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.item .t{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.item .t time{color:var(--mist);text-transform:none;letter-spacing:0}
.item p{margin:0;font-size:13px;line-height:1.4}
.empty{padding:4px;color:var(--mist);font-size:12.5px}
.roster{display:grid;grid-template-columns:1fr;gap:2px}
.roster button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;min-width:0}
.roster button>span{font-size:18px;flex:none;width:24px;text-align:center}
.roster button>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.roster small{font-size:11.5px;line-height:1.35;color:var(--mist)}
.roster button:hover{background:rgba(243,197,107,.08)}
.roster b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster i{width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:8px 11px;font-size:12.5px;max-width:260px;
  transform:translate(-50%,calc(-100% - 22px));opacity:0;transition:opacity .15s;z-index:3}
.tip b{font-family:var(--f-display);letter-spacing:.1em;display:block;font-size:14px}
.tip span{color:var(--mist)}
@media (max-width:700px){ .brand h1{font-size:19px} .legend{order:3;width:100%} }
/* ---- telefon (portret sau culcat): harta + listă, pagina se derulează ---- */
.mob{display:none}.mobhint{display:none}
@media (max-width:700px), (orientation:landscape) and (max-height:500px){
  body{overflow:auto;overflow-x:hidden}
  .drawer{position:fixed;z-index:7;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .stage{height:auto;min-height:100%}
  .tip,.legend{display:none}
  canvas#cosmos{position:relative;display:block;width:100%;height:calc(100svh - 70px);min-height:560px}
  #glyphs{top:var(--ghtop,0px)!important;bottom:auto!important;height:calc(100svh - 70px);min-height:560px}
  .card{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:55vh;overflow:auto;z-index:6}
  .mobhint{display:block;text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--mist);text-transform:uppercase;margin:-4px 0 4px}
  header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(4,7,15,.95);backdrop-filter:blur(10px)}
  .mob{display:flex;flex-direction:column;gap:14px;padding:8px 16px 32px}
  .zhero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid rgba(243,197,107,.45);
    background:radial-gradient(circle at 15% 30%,rgba(243,197,107,.22),rgba(10,18,40,.8) 70%)}
  .zhero .sun{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff6dc,#f3c56b 45%,#7a5418);box-shadow:0 0 28px rgba(243,197,107,.55)}
  .zhero b{font-family:var(--f-display);font-size:20px;letter-spacing:.14em;color:var(--gold);display:block}
  .zhero span{font-size:12.5px;color:var(--mist)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stats div{background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:8px 4px;text-align:center}
  .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stats small{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;color:var(--mist);text-transform:uppercase}
  .grp h4{margin:4px 2px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .gl{display:flex;flex-direction:column;gap:8px}
  .gc{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--glass);
    border:1px solid var(--edge);border-left:4px solid var(--off)}
  .gc .o{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;border:1.5px solid currentColor;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),rgba(10,19,48,.9) 65%)}
  .gc .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gc .n b{font-family:var(--f-display);font-size:16px;letter-spacing:.1em}
  .gc .n em{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .gc .r{font-size:12.5px;color:var(--mist)}
  .gc .a{font-size:13px;margin-top:4px;line-height:1.35}
  .gc.wait{box-shadow:0 0 0 1px rgba(255,173,59,.35),0 0 18px -6px rgba(255,173,59,.7)}
}
/* telefon în picioare: 11 zei pe 375px -> harta e mai înaltă decât ecranul (se derulează), ca etichetele să nu se suprapună */
@media (max-width:700px){ canvas#cosmos,#glyphs{height:max(calc(100svh - 70px),760px)} }
/* telefon culcat: ecran scund -> harta are înălțime minimă și pagina se derulează; respectă decupajul (notch) din stânga/dreapta */
@media (orientation:landscape) and (max-height:500px){
  /* bara de jos rămâne mereu vizibilă (lipită jos cât derulezi harta, sus când ajungi la listă) */
  header{top:0;bottom:0;padding:8px calc(16px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
  .brand h1{font-size:19px}
  canvas#cosmos,#glyphs{height:max(860px,calc(100svh - 56px));min-height:0}
  .card{left:calc(10px + env(safe-area-inset-left,0px));right:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));
    width:min(380px,calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
    max-height:calc(100svh - 74px - env(safe-area-inset-bottom,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .mob{padding:8px calc(16px + env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
  .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}</style>

<div class="stage">
  <canvas id="cosmos" aria-label="Harta Olimpului: Zeus în centru, zeii în jurul lui. Lista completă e în panou."></canvas>
  <div id="glyphs" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
  <div class="tip" id="tip"></div>
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset="1" stop-color="#c8922f"/></linearGradient></defs><circle cx="17" cy="17" r="15.5" fill="none" stroke="url(#lg)" stroke-width="1.2"/><path d="M19 5 L11 19 H17 L14 29 L24 13 H18 Z" fill="url(#lg)"/></svg>
      <div><h1>OLIMPUL</h1><small>Consola zeilor</small></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="right">
      <div class="live" id="live"><i></i><span>…</span></div>
      <button class="btn" id="openDrawer" type="button" aria-expanded="false" aria-controls="drawer">Panou <span class="badge" id="badge" hidden>0</span></button>
    </div>
  </header>
  <div class="card" id="card" hidden></div>
  <section class="mob" id="mob" aria-label="Zeii, ca listă"></section>
  <aside class="drawer" id="drawer" aria-label="Panou">
    <div class="top"><h2>PANOU</h2><button type="button" id="closeDrawer" aria-label="Închide panoul">×</button></div>
    <div class="body">
      <div class="sec"><h4>Atenție <span id="attCount">0</span></h4><div id="attention"></div></div>
      <div class="sec"><h4>Coada lui Zeus <span id="qCount">0</span></h4><div id="queue"></div></div>
      <div class="sec"><h4>Panteonul <span id="nZei">12 zei</span></h4><div class="roster" id="roster"></div></div>
    </div>
  </aside>
</div>

<script>
const ZEI = [
  {id:"zeus",nume:"Zeus",g:"⚡",grup:"centru",rol:"Coordonatorul Olimpului",mit:"Regele zeilor, stăpânul Olimpului și al fulgerului.",face:["Primește cererile tale și le împarte zeilor","Cere aprobarea ta pentru orice pas ireversibil","Adună rapoartele și îți răspunde"]},
  {id:"argus",nume:"Argus",g:"👁️",grup:"control",rol:"Controlul calității",mit:"Uriașul cu o sută de ochi (Argus Panoptes), paznicul pus de Hera, căruia nu-i scapă nimic.",face:["Verifică orice lucrare a zeilor înainte să ajungă la tine","Cifre, prețuri, numerotare, surse, reguli, date personale, cod","Registrul de greșeli și reguli noi"]},
  {id:"hefaistos",nume:"Hefaistos",g:"🔨",grup:"birou",rol:"Oferte și devize",mit:"Zeul fierarilor și al meșteșugurilor, care făurea totul în forja lui.",face:["Oferte și devize în EUR și LEI, Excel + PDF","Oferte în 3 variante și pachete pentru persoane fizice","Propunerea financiară la licitații; Excel și Word"]},
  {id:"plutos",nume:"Plutos",g:"💰",grup:"birou",rol:"Bani și SmartBill",mit:"Zeul bogăției și al belșugului.",face:["SmartBill: facturi furnizori, NIR, stocuri, ciorne de facturi","Încasări, restanțe, datorii la furnizori","Contractat vs facturat; profit, marje, cash-flow"]},
  {id:"kronos",nume:"Kronos",g:"⏳",grup:"lucru",rol:"Șantiere și echipă",mit:"Titanul timpului, tatăl lui Zeus.",face:["Planul echipelor, rapoarte zilnice, pontaj, KPI de luni","Termene, situații de lucrări, facturat în 48 h după PV","Predări, garanții, mentenanță; angajări și instruire"]},
  {id:"brontes",nume:"Brontes",g:"🔌",grup:"lucru",rol:"Tehnic și proiectare",mit:"Ciclopul tunetului, care a făurit fulgerele lui Zeus.",face:["Calcule, protecții, tablouri, PLC, KNX, fotovoltaic","Proiecte și planuri electrice (inclusiv Casa Tuduce)","Configuratorul de tablouri; întreabă-l din aplicație"]},
  {id:"iris",nume:"Iris",g:"🌈",grup:"comunicare",rol:"WhatsApp și e-mail",mit:"Zeița curcubeului și mesagera zeilor între cer și pământ.",face:["Caută și citește conversații, extrage atașamentele","Ciorne de mesaje și pachete în „de trimis”","Nimic nu pleacă fără „trimite” de la tine"]},
  {id:"astreea",nume:"Astreea",g:"🧮",grup:"sfat",rol:"Contabil",mit:"Fecioara stelelor cu balanța în mână, simbolul dreptății și al echilibrului.",face:["TVA (și taxare inversă), impozite, salarii","Calendarul declarațiilor ANAF, e-Factura","Verifică cifrele, materiale pentru contabil"]},
  {id:"dike",nume:"Dike",g:"⚖️",grup:"sfat",rol:"Avocat și licitații",mit:"Zeița justiției, fiica Themisei; veghează să se facă dreptate.",face:["Avocat: verifică orice act, spețe, termene, riscuri","Contracte și conformitate (ONRC, ANAF, ITM, ANRE, GDPR)","Licitații: GO/NO-GO, dosar de calificare, CNSC"]},
  {id:"tyche",nume:"Tyche",g:"🍀",grup:"sfat",rol:"Coach și creștere",mit:"Zeița norocului și a prosperității cetăților.",face:["Strategie și priorități, coach la 07:30","Radar de inovații și lucrări noi (SEAP, autorizații)","Marketing: Google Business, recenzii, portofoliu"]},
  {id:"hestia",nume:"Hestia",g:"🏛️",grup:"aplicatii",rol:"Aplicația firmei",mit:"Zeița vetrei și a casei, focul care ține familia unită.",face:["Rapoarte zilnice, șantiere, clienți, dosare","Funcții noi, PR-uri, deploy și verificare live","GitHub + Vercel pentru firma-api.vercel.app"]},
  {id:"demeter",nume:"Demeter",g:"🌾",grup:"aplicatii",rol:"Rețete, salon, frizerie",mit:"Zeița recoltei, a grânelor și a hranei.",face:["Ce mâncăm azi? — rețete după ingrediente","Style by VAJ — programări, fișe, stoc, mirese","Barber Station — barber-station-rho.vercel.app"]},
];
/* zeii de dinainte de consolidarea din 26.10.2026 -> cine le-a preluat munca (stari.json îi păstrează; harta nu-i mai arată,
   iar ce au lăsat în coada lui Zeus apare la zeul care i-a preluat; un zeu necunoscut apare cu numele lui, ca înainte) */
const PRELUAT = {athena:"plutos",metis:"plutos",themis:"dike",eunomia:"dike",nike:"dike",angelia:"iris",hermes:"iris",mnemosyne:"hefaistos",
  kratos:"kronos",hebe:"kronos",asklepios:"kronos",artemis:"tyche",eos:"tyche",peitho:"tyche",apollo:"brontes",prometheus:"brontes",hera:"brontes",
  atlas:"hestia",afrodita:"demeter",dionysos:"demeter",ananke:"zeus"};
const GRUPURI = {
  control:{label:"CONTROL",hue:"#e8ecf5",inel:0},
  birou:{label:"OFERTE ȘI BANI",hue:"#8fb3ff",inel:0},
  lucru:{label:"ȘANTIERE ȘI TEHNIC",hue:"#7fe3d0",inel:0},
  comunicare:{label:"COMUNICARE",hue:"#d9a6ff",inel:0},
  sfat:{label:"SFATUL ÎNȚELEPȚILOR",hue:"#ff8fa3",inel:1},
  aplicatii:{label:"APLICAȚIILE TALE",hue:"#f3c56b",inel:1},
};
const STARI = {
  lucreaza:{label:"Lucrează",col:"#43e0b8"},
  asteapta:{label:"Așteaptă input",col:"#ffad3b"},
  standby:{label:"Standby",col:"#6f8ae0"},
  offline:{label:"Offline",col:"#4a5677"},
};
let stare={}, coada=[], filtru=null, selectat=null, hover=null;
const $=s=>document.querySelector(s);
const st=id=>(stare[id]&&STARI[stare[id].stare])?stare[id].stare:(id==="zeus"?"lucreaza":"standby");
const zeu=id=>ZEI.find(z=>z.id===id);
const cand=iso=>{if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const m=Math.round((Date.now()-d)/60000);
  if(m<1)return"acum";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";return Math.round(h/24)+" z";};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

cv.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;const id=hitAt(mx,my);hover=id;cv.style.cursor=id?"pointer":"default";
  const tip=$("#tip");if(id){const z=zeu(id),s=st(id),info=stare[id]||{};tip.innerHTML="<b></b><span></span>";tip.querySelector("b").textContent=z.nume+" · "+STARI[s].label;
    tip.querySelector("span").textContent=info.sarcina||z.rol;tip.style.left=mx+"px";tip.style.top=my+"px";tip.style.opacity=1;}else tip.style.opacity=0;});
cv.addEventListener("mouseleave",()=>{hover=null;mx=my=-1;$("#tip").style.opacity=0;});
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect();const id=hitAt(e.clientX-r.left,e.clientY-r.top);selectat=id;fisa();});

/* ---------- UI ---------- */
function legenda(){const L=$("#legend");L.textContent="";
  for(const k of Object.keys(STARI)){const n=ZEI.filter(z=>z.id!=="zeus"&&st(z.id)===k).length;const b=document.createElement("button");b.className="chip";b.type="button";
    b.setAttribute("aria-pressed",filtru===k?"true":"false");b.innerHTML="<i></i><span></span><b></b>";b.querySelector("i").style.background=STARI[k].col;
    b.querySelector("span").textContent=STARI[k].label;b.querySelector("b").textContent=n;b.onclick=()=>{filtru=filtru===k?null:k;legenda();};L.appendChild(b);}}
function fisa(){const C=$("#card");if(!selectat){C.hidden=true;return;}
  const z=zeu(selectat),s=st(z.id),info=stare[z.id]||{},col=z.id==="zeus"?"#f3c56b":STARI[s].col;C.hidden=false;C.textContent="";
  const hd=document.createElement("div");hd.className="hd";hd.innerHTML='<div class="orb"></div><div><h3></h3><div class="role"></div></div><button class="x" type="button" aria-label="Închide">×</button>';
  const mit=document.createElement("p");mit.className="mit";mit.textContent="În mitologie: "+z.mit;
  hd.querySelector(".orb").textContent=z.g;hd.querySelector(".orb").style.color=col;hd.querySelector("h3").textContent=z.nume;hd.querySelector(".role").textContent=z.rol;
  hd.querySelector(".x").onclick=()=>{selectat=null;fisa();};
  const pill=document.createElement("span");pill.className="pill";pill.style.color=STARI[s].col;pill.textContent=STARI[s].label+(info.actualizat?" · "+cand(info.actualizat):"");
  const ul=document.createElement("ul");z.face.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.appendChild(li);});
  const now=document.createElement("div");now.className="now";
  if(info.sarcina){now.innerHTML="<b>Acum:</b> <span></span>";now.querySelector("span").textContent=info.sarcina;}
  else now.textContent=z.id==="zeus"?"Tu vorbești doar cu Zeus. Toți ceilalți zei raportează doar lui.":"Nicio sarcină în lucru. Raportează doar lui Zeus.";
  C.append(hd,mit,pill,ul,now);}
function item(col,titlu,timp,text){const d=document.createElement("div");d.className="item";d.style.borderLeftColor=col;
  d.innerHTML='<div class="t"><b></b><time></time></div><p></p>';const b=d.querySelector("b");b.style.color=col;b.textContent=titlu;d.querySelector("time").textContent=timp;d.querySelector("p").textContent=text;return d;}
function sertar(){
  const att=ZEI.filter(z=>st(z.id)==="asteapta");$("#attCount").textContent=att.length;const A=$("#attention");A.textContent="";
  if(!att.length)A.innerHTML='<div class="empty">Niciun zeu nu așteaptă răspunsul tău.</div>';
  att.forEach(z=>A.appendChild(item(STARI.asteapta.col,z.g+" "+z.nume,cand(stare[z.id]?.actualizat),stare[z.id]?.sarcina||"Are o întrebare pentru tine.")));
  const Q=$("#queue");Q.textContent="";$("#qCount").textContent=coada.length;
  if(!coada.length)Q.innerHTML='<div class="empty">Coada e goală.</div>';
  coada.forEach(q=>{const z=zeu(q.zeu)||{nume:q.zeu||"?",g:"·"};const col=q.tip==="APROBARE"?"#f3c56b":q.tip==="ÎNTREBARE"?"#ffad3b":"#6f8ae0";const fost=q.fost?` (de la ${q.fost[0].toUpperCase()+q.fost.slice(1)})`:"";Q.appendChild(item(col,`${z.g} ${z.nume}${fost} · ${q.tip||"NOTĂ"}`,cand(q.creat),q.text||""));});
  const R2=$("#roster");R2.textContent="";ZEI.forEach(z=>{const b=document.createElement("button");b.type="button";b.title=z.rol;b.innerHTML='<span></span><div><b></b><small></small></div><i></i>';
    b.querySelector("span").textContent=z.g;b.querySelector("b").textContent=z.nume;b.querySelector("small").textContent=z.mit;b.querySelector("i").style.background=STARI[st(z.id)].col;
    b.onclick=()=>{selectat=z.id;fisa();inchide();};R2.appendChild(b);});
  const nz=$("#nZei");if(nz)nz.textContent=ZEI.length+" zei";
  const n=att.length+coada.length,bd=$("#badge");bd.textContent=n;bd.hidden=!n;
}
const dr=$("#drawer"),ob=$("#openDrawer");
function deschide(){dr.classList.add("open");ob.setAttribute("aria-expanded","true");}
function inchide(){dr.classList.remove("open");ob.setAttribute("aria-expanded","false");}
ob.onclick=()=>dr.classList.contains("open")?inchide():deschide();$("#closeDrawer").onclick=inchide;
addEventListener("keydown",e=>{if(e.key==="Escape"){inchide();selectat=null;fisa();}});
/* ---------- vizualizarea pentru telefon ---------- */
function mobil(){
  const M=$("#mob"); if(!M) return; M.textContent="";
  const z0=stare.zeus||{};
  const hero=document.createElement("div"); hero.className="zhero";
  hero.innerHTML='<div class="sun">⚡</div><div><b>ZEUS</b><span></span></div>';
  hero.querySelector("span").textContent=z0.sarcina||"Coordonatorul. Tu vorbești doar cu el.";
  M.appendChild(hero);
  const st4=document.createElement("div"); st4.className="stats";
  for(const k of Object.keys(STARI)){const n=ZEI.filter(z=>z.id!=="zeus"&&st(z.id)===k).length;const d=document.createElement("div");
    d.innerHTML="<b></b><small></small>";d.querySelector("b").textContent=n;d.querySelector("b").style.color=STARI[k].col;d.querySelector("small").textContent=STARI[k].label;st4.appendChild(d);}
  M.appendChild(st4);
  const ordine={asteapta:0,lucreaza:1,standby:2,offline:3};
  for(const k of Object.keys(GRUPURI)){
    if(!ZEI.some(z=>z.grup===k))continue;
    const g=document.createElement("div");g.className="grp";
    const h=document.createElement("h4");h.textContent=GRUPURI[k].label;h.style.color=GRUPURI[k].hue;g.appendChild(h);
    const l=document.createElement("div");l.className="gl";
    ZEI.filter(z=>z.grup===k).sort((a,b)=>ordine[st(a.id)]-ordine[st(b.id)]).forEach(z=>{
      const s=st(z.id),col=STARI[s].col,info=stare[z.id]||{};
      const c=document.createElement("div");c.className="gc"+(s==="asteapta"?" wait":"");c.style.borderLeftColor=col;
      c.innerHTML='<div class="o"></div><div><div class="n"><b></b><em></em></div><div class="r"></div><div class="a"></div></div>';
      c.querySelector(".o").textContent=z.g;c.querySelector(".o").style.color=col;
      c.querySelector("b").textContent=z.nume;const em=c.querySelector("em");em.textContent=STARI[s].label+(info.actualizat?" · "+cand(info.actualizat):"");em.style.color=col;
      c.querySelector(".r").textContent=z.rol;
      const a=c.querySelector(".a");if(info.sarcina)a.textContent=info.sarcina;else a.remove();
      l.appendChild(c);});
    g.appendChild(l);M.appendChild(g);}
}function totul(){legenda();sertar();fisa();mobil();}
resize();totul();requestAnimationFrame(frame);setInterval(totul,60000);

/* date live: stările zeilor din /olimp/stari.json (le scrie Zeus), reîmprospătate la 20 de secunde */
(function(){const live=$("#live");
  async function ia(){try{const r=await fetch("/olimp/stari.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    stare=d.zei||{};coada=(d.coada||[]).map(q=>!zeu(q.zeu)&&PRELUAT[q.zeu]?{...q,zeu:PRELUAT[q.zeu],fost:q.zeu}:q).sort((a,b)=>String(b.creat).localeCompare(String(a.creat)));
    live.classList.add("on");live.querySelector("span").textContent="live";totul();}
  catch(e){live.classList.remove("on");live.querySelector("span").textContent="fără conexiune";}}
  ia();setInterval(ia,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ia()});
})();
</script>
