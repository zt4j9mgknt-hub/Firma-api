<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/olimp/manifest.webmanifest">
<link rel="icon" href="/olimp/icon-192.png">
<link rel="apple-touch-icon" href="/olimp/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olimpul">
<meta name="theme-color" content="#04070f">
<meta name="robots" content="noindex">
<title>Olimpul · Consola zeilor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Harta Olimpului (v2, 18.11.2026): muntele Olimp cu Zeus pe vârf și zeii pe trei terase.
   Totul e HTML + SVG + animații CSS (fără canvas, fără biblioteci). Datele: /olimp/stari.json, la fel ca înainte.
   Cine lucrează are aură care se rotește și puls; cine așteaptă are inel portocaliu; standby e atenuat.
   Legăturile Zeus -> zeii activi curg animat. prefers-reduced-motion oprește toate animațiile. */
:root{
  color-scheme:dark;
  --void:#04070f;
  --glass:rgba(10,18,40,.78);
  --edge:rgba(120,150,220,.2);
  --marble:#eef2fb;
  --mist:#9aa8c9;
  --gold:#f3c56b;
  --ok:#43e0b8;
  --wait:#ffad3b;
  --idle:#6f8ae0;
  --off:#4a5677;
  --rock:#070d1f;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;min-height:100svh;background:radial-gradient(120% 70% at 50% 0%,#14224a 0%,#0a1230 45%,var(--void) 100%) fixed;color:var(--marble);
  font-family:var(--f-body);font-size:14px;overflow-x:hidden}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- cerul: stele, stea căzătoare, lună ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .st{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent}
.sky .st.a{animation:clipi 5s ease-in-out infinite}
.sky .st.b{animation:clipi 7s ease-in-out infinite 1.5s}
.sky .st.c{width:2px;height:2px;animation:clipi 9s ease-in-out infinite 3s}
.sky .moon{position:absolute;left:7%;top:90px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fffaf0,#dfe6f5 45%,#a9b5d6 70%);box-shadow:0 0 60px 18px rgba(200,215,255,.16),0 0 160px 60px rgba(120,150,230,.10);opacity:.85}
.sky .shoot{position:absolute;top:12%;left:70%;width:130px;height:1.5px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform:rotate(-24deg);animation:cade 11s ease-in infinite 4s}
@keyframes clipi{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes cade{0%,88%{opacity:0;transform:translate(0,0) rotate(-24deg)}90%{opacity:1}100%{opacity:0;transform:translate(-340px,150px) rotate(-24deg)}}

/* ---------- antet ---------- */
header{position:sticky;top:0;z-index:5;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  background:linear-gradient(180deg,rgba(4,7,15,.92),rgba(4,7,15,.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(243,197,107,.10)}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.22em;
  background:linear-gradient(90deg,#fff3cf,var(--gold) 45%,#b9862e);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--mist);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip,.btn{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--edge);padding:6px 10px;border-radius:999px;
  display:inline-flex;gap:7px;align-items:center;background:var(--glass);color:var(--mist);cursor:pointer}
.chip b,.btn b{font-weight:500;color:var(--marble);font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"],.btn[aria-expanded="true"]{border-color:var(--gold);color:var(--marble)}
.btn .badge{background:var(--wait);color:#1b1206;border-radius:999px;padding:0 6px;font-weight:600}
.btn .badge[hidden]{display:none}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.live{font-family:var(--f-mono);font-size:11px;color:var(--mist);display:flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.live.on i{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:bate 2s ease-in-out infinite}
@keyframes bate{50%{opacity:.4}}

/* ---------- scena: muntele + legăturile + terasele ---------- */
.scene{position:relative;z-index:1;overflow:hidden;min-height:calc(100svh - 64px)}
.mountain{position:absolute;left:50%;top:0;width:max(100%,980px);height:auto;transform:translateX(-50%);z-index:0;pointer-events:none}
.rock{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--rock),#050912);z-index:0;pointer-events:none}
.cloud{position:absolute;z-index:0;pointer-events:none;width:520px;height:120px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(170,190,240,.13),rgba(170,190,240,0));filter:blur(6px);animation:nori 46s ease-in-out infinite alternate}
.cloud.c2{width:640px;height:150px;animation-duration:60s;animation-delay:-20s}
.cloud.c3{width:420px;height:100px;animation-duration:38s;animation-delay:-9s;opacity:.8}
@keyframes nori{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.links{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.links path{fill:none;stroke-linecap:round}
.links .base{stroke-width:1;stroke-opacity:.10}
.links .base.s-lucreaza{stroke-width:1.6;stroke-opacity:.38}
.links .base.s-asteapta{stroke-width:1.3;stroke-opacity:.30}
.links .flow{stroke-width:2.2;stroke-dasharray:2 14;animation:curge 1.1s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.links .flow.s-asteapta{stroke-dasharray:2 18;animation-duration:2.4s}
.links .dim{opacity:.15}
@keyframes curge{to{stroke-dashoffset:-16}}

.olymp{position:relative;z-index:2;max-width:1260px;margin:0 auto;padding:26px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:24px}

/* vârful: Zeus */
.summit{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(400px,100%)}
.zorb{all:unset;box-sizing:border-box;position:relative;flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff6dc,#f3c56b 45%,#7a5418);box-shadow:0 0 34px rgba(243,197,107,.65),0 0 120px 30px rgba(243,197,107,.22)}
.zorb .ico{font-size:42px;line-height:1;font-family:var(--f-emoji);position:relative;z-index:1;filter:drop-shadow(0 2px 6px rgba(80,40,0,.5))}
.zorb::before{content:"";position:absolute;inset:-40px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(243,197,107,.30) 0 3deg,transparent 3deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 50%,#000 52%,#000 64%,transparent 74%);mask:radial-gradient(circle,transparent 50%,#000 52%,#000 64%,transparent 74%);
  animation:roteste 50s linear infinite}
.zorb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px dashed rgba(255,236,170,.55);animation:roteste 22s linear infinite reverse}
.zinfo{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 18px 13px;border-radius:16px;width:100%;
  background:linear-gradient(180deg,rgba(40,30,8,.72),rgba(10,16,36,.86));border:1px solid rgba(243,197,107,.45);box-shadow:0 14px 50px -18px rgba(243,197,107,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.zinfo .nm{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.26em;color:var(--gold);text-shadow:0 0 18px rgba(243,197,107,.45)}
.zinfo .rol{font-size:12.5px;color:var(--mist);margin-top:-4px}
.zinfo .task{font-size:13.5px;line-height:1.4;color:#f3e6c4}

/* terasele */
.tier{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.tier h2{margin:0;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);
  display:flex;align-items:center;gap:12px;text-align:center}
.tier h2::before,.tier h2::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(243,197,107,.5))}
.tier h2::after{transform:scaleX(-1)}
.tier h2 span+span::before{content:"·";margin:0 8px;color:rgba(243,197,107,.6)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}

/* cardul unui zeu */
.god{all:unset;box-sizing:border-box;position:relative;cursor:pointer;width:226px;display:grid;grid-template-columns:auto 1fr;gap:9px 11px;
  padding:13px 13px 12px;border-radius:16px;text-align:left;
  background:linear-gradient(160deg,rgba(28,40,78,.86),rgba(8,13,30,.9) 70%);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,rgba(14,22,48,.9)),rgba(8,13,30,.9) 70%);
  border:1px solid rgba(120,150,220,.22);border-color:color-mix(in srgb,var(--c) 28%,transparent);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .25s ease,opacity .3s ease,filter .3s ease,box-shadow .3s ease}
.god::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.god:hover,.god:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px -14px rgba(0,0,0,.9),0 0 0 1px var(--c)}
.emb{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),radial-gradient(circle,#24345f,#0a1330 75%);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),radial-gradient(circle,color-mix(in srgb,var(--c) 40%,#0a1330),#0a1330 78%);
  border:1.5px solid var(--c);box-shadow:0 0 16px -3px var(--c)}
.emb .ico{position:relative;z-index:1;font-size:25px;line-height:1;font-family:var(--f-emoji)}
.emb .aura{position:absolute;inset:-7px;border-radius:50%;opacity:0}
.emb::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--s);opacity:0}
.hd{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.hd .nm{font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:.11em;color:var(--marble);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rol{font-size:12px;color:var(--mist);line-height:1.3}
.meta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--s);color:var(--s);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--s)}
.when{font-family:var(--f-mono);font-size:10.5px;color:var(--mist);white-space:nowrap}
.task{grid-column:1/-1;font-size:12.5px;line-height:1.4;color:#cfd8ee;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.4em}
.task.gol{color:var(--mist);font-style:italic}

/* stările */
.s-lucreaza{--s:var(--ok)}
.s-asteapta{--s:var(--wait)}
.s-standby{--s:var(--idle)}
.s-offline{--s:var(--off)}
.god.s-lucreaza{border-color:rgba(67,224,184,.55);box-shadow:0 0 0 1px rgba(67,224,184,.18),0 12px 44px -14px rgba(67,224,184,.65)}
.god.s-lucreaza::after{content:"";position:absolute;inset:-1px;border-radius:16px;pointer-events:none;box-shadow:0 0 26px -4px rgba(67,224,184,.55);animation:respira 3s ease-in-out infinite}
.s-lucreaza .emb .aura{opacity:1;background:conic-gradient(from 0deg,var(--ok),transparent 28%,transparent 48%,var(--c) 60%,transparent 82%,var(--ok));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 61%);mask:radial-gradient(circle,transparent 58%,#000 61%);animation:roteste 3.2s linear infinite}
.s-lucreaza .emb::after{animation:puls 2.2s ease-out infinite}
.god.s-asteapta{border-color:rgba(255,173,59,.6);box-shadow:0 0 0 1px rgba(255,173,59,.25),0 12px 40px -14px rgba(255,173,59,.7)}
.s-asteapta .emb::after{animation:puls 1.4s ease-out infinite}
.god.s-standby{opacity:.62;filter:saturate(.55)}
.god.s-offline{opacity:.42;filter:grayscale(.85)}
.god.s-standby:hover,.god.s-standby:focus-visible,.god.s-offline:hover,.god.s-offline:focus-visible{opacity:1;filter:none}
.god.dim,.god.s-standby.dim{opacity:.16;filter:grayscale(1)}
.zinfo .pill{margin-top:2px}
@keyframes roteste{to{transform:rotate(360deg)}}
@keyframes puls{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.75);opacity:0}}
@keyframes respira{0%,100%{opacity:.35}50%{opacity:1}}

.foot{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);text-align:center;opacity:.85}

/* ---------- fișa zeului selectat ---------- */
.card{position:fixed;left:16px;bottom:16px;width:min(360px,calc(100% - 32px));max-height:calc(100svh - 110px);overflow:auto;background:rgba(9,15,34,.94);border:1px solid var(--edge);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;display:flex;flex-direction:column;gap:10px;z-index:6;box-shadow:0 20px 60px -20px #000}
.card[hidden]{display:none}
.card .hd2{display:flex;align-items:center;gap:12px}
.card .orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;flex:none;border:1.5px solid currentColor;font-family:var(--f-emoji);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.02) 60%)}
.card h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:.12em}
.card .role{font-size:13px;color:var(--mist)}
.card .mit{margin:-2px 0 0;font-size:12.5px;font-style:italic;line-height:1.45;color:#c9d3ea}
.card .x{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--mist);font-size:22px;cursor:pointer;line-height:1}
.card .pill2{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid currentColor;align-self:flex-start}
.card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.card .now{font-size:13px;color:var(--mist);border-top:1px solid var(--edge);padding-top:9px;line-height:1.45}
.card .now b{color:var(--marble);font-weight:500}

/* ---------- sertarul ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:rgba(7,12,28,.95);border-left:1px solid var(--edge);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:7;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer .top{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--edge)}
.drawer .top h2{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.22em;color:var(--gold)}
.drawer .top button{background:none;border:0;color:var(--mist);font-size:22px;cursor:pointer}
.drawer .body{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;display:flex;flex-direction:column;gap:16px}
.sec h4{margin:0 4px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--mist);text-transform:uppercase;display:flex;justify-content:space-between}
.item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.035);border-left:3px solid var(--off);display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.item .t{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.item .t time{color:var(--mist);text-transform:none;letter-spacing:0}
.item p{margin:0;font-size:13px;line-height:1.4}
.empty{padding:4px;color:var(--mist);font-size:12.5px}
.roster{display:grid;grid-template-columns:1fr;gap:2px}
.roster button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;min-width:0}
.roster button>span{font-size:18px;flex:none;width:24px;text-align:center;font-family:var(--f-emoji)}
.roster button>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.roster small{font-size:11.5px;line-height:1.35;color:var(--mist)}
.roster button:hover{background:rgba(243,197,107,.08)}
.roster b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster i{width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none}

/* ---------- ecran mediu ---------- */
@media (max-width:1180px){ .god{width:212px} }
/* ---------- telefon ---------- */
@media (max-width:700px){
  header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:8px 10px}
  .brand h1{font-size:19px}
  .brand svg{width:28px;height:28px}
  .legend{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .legend::-webkit-scrollbar{display:none}
  .chip{font-size:10px;padding:5px 8px;flex:none}
  .sky .moon{width:44px;height:44px;left:auto;right:8%;top:150px}
  .olymp{padding:22px 10px 44px;gap:24px}
  .zorb{width:76px;height:76px}.zorb .ico{font-size:36px}.zorb::before{inset:-30px}
  .zinfo{padding:10px 14px 11px}.zinfo .nm{font-size:21px}
  .tier h2{font-size:9.5px;letter-spacing:.16em;gap:8px;flex-wrap:wrap;justify-content:center}
  .tier h2::before,.tier h2::after{width:18px}
  .row{gap:10px}
  .god{width:calc(50% - 5px);padding:11px 10px 10px;gap:8px 9px;grid-template-columns:auto 1fr}
  .emb{width:40px;height:40px}.emb .ico{font-size:20px}
  .hd .nm{font-size:13px;letter-spacing:.07em}
  .hd .rol{font-size:11px}
  .pill{font-size:9px;letter-spacing:.08em;padding:2px 7px}
  .when{font-size:9.5px}
  .task{font-size:11.5px;-webkit-line-clamp:4}
  .when.vechi .rel,.when.vechi .sep{display:none}
  .card{left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:60svh}
}
@media (max-width:360px){ .god{width:100%} }

/* ---------- fără animații, la cerere ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .sky .shoot{display:none}
  .s-lucreaza .emb::after,.s-asteapta .emb::after{opacity:.9}
  .god.s-lucreaza::after{opacity:.7}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="st a" id="stA"></div><div class="st b" id="stB"></div><div class="st c" id="stC"></div><div class="moon"></div><div class="shoot"></div></div>

<header>
  <div class="brand">

    <path fill="url(#mSnow)" d="M600,62 L645,160 L628,150 L614,176 L598,156 L582,182 L568,166 L556,178 L560,170Z"/>
    <path fill="none" stroke="#f3c56b" stroke-opacity=".35" stroke-width="1.4" d="M430,480 L520,250 L560,170 L600,62 L645,160 L690,270 L760,430"/>

<script>
/* c = culoarea zeului (emblema și cardul); starea are culoarea ei (verde / portocaliu / albastru) */
const ZEI = [
  {id:"zeus",nume:"Zeus",g:"⚡",c:"#f3c56b",grup:"centru",rol:"Coordonatorul Olimpului",mit:"Regele zeilor, stăpânul Olimpului și al fulgerului.",face:["Primește cererile tale și le împarte zeilor","Cere aprobarea ta pentru orice pas ireversibil","Adună rapoartele și îți răspunde"]},
  {id:"argus",nume:"Argus",g:"👁️",c:"#dfe6f5",grup:"control",rol:"Controlul calității",mit:"Uriașul cu o sută de ochi (Argus Panoptes), paznicul pus de Hera, căruia nu-i scapă nimic.",face:["Verifică orice lucrare a zeilor înainte să ajungă la tine","Cifre, prețuri, numerotare, surse, reguli, date personale, cod","Registrul de greșeli și reguli noi"]},
  {id:"hefaistos",nume:"Hefaistos",g:"🔨",c:"#ff8a4c",grup:"birou",rol:"Oferte și devize",mit:"Zeul fierarilor și al meșteșugurilor, care făurea totul în forja lui.",face:["Oferte și devize în EUR și LEI, Excel + PDF","Oferte în 3 variante și pachete pentru persoane fizice","Propunerea financiară la licitații; Excel și Word"]},
  {id:"plutos",nume:"Plutos",g:"💰",c:"#ffd45e",grup:"birou",rol:"Bani și SmartBill",mit:"Zeul bogăției și al belșugului.",face:["SmartBill: facturi furnizori, NIR, stocuri, ciorne de facturi","Încasări, restanțe, datorii la furnizori","Contractat vs facturat; profit, marje, cash-flow"]},
  {id:"kronos",nume:"Kronos",g:"⏳",c:"#7fe3d0",grup:"lucru",rol:"Șantiere și echipă",mit:"Titanul timpului, tatăl lui Zeus.",face:["Planul echipelor, rapoarte zilnice, pontaj, KPI de luni","Termene, situații de lucrări, facturat în 48 h după PV","Predări, garanții, mentenanță; angajări și instruire"]},
  {id:"brontes",nume:"Brontes",g:"🔌",c:"#5cc8ff",grup:"lucru",rol:"Tehnic și proiectare",mit:"Ciclopul tunetului, care a făurit fulgerele lui Zeus.",face:["Calcule, protecții, tablouri, PLC, KNX, fotovoltaic","Proiecte și planuri electrice (inclusiv Casa Tuduce)","Configuratorul de tablouri; întreabă-l din aplicație"]},
  {id:"iris",nume:"Iris",g:"🌈",c:"#d9a6ff",grup:"comunicare",rol:"WhatsApp și e-mail",mit:"Zeița curcubeului și mesagera zeilor între cer și pământ.",face:["Caută și citește conversații, extrage atașamentele","Ciorne de mesaje și pachete în „de trimis”","Nimic nu pleacă fără „trimite” de la tine"]},
  {id:"astreea",nume:"Astreea",g:"🧮",c:"#a9b8ff",grup:"sfat",rol:"Contabil",mit:"Fecioara stelelor cu balanța în mână, simbolul dreptății și al echilibrului.",face:["TVA (și taxare inversă), impozite, salarii","Calendarul declarațiilor ANAF, e-Factura","Verifică cifrele, materiale pentru contabil"]},
  {id:"dike",nume:"Dike",g:"⚖️",c:"#ff8fa3",grup:"sfat",rol:"Avocat și licitații",mit:"Zeița justiției, fiica Themisei; veghează să se facă dreptate.",face:["Avocat: verifică orice act, spețe, termene, riscuri","Contracte și conformitate (ONRC, ANAF, ITM, ANRE, GDPR)","Licitații: GO/NO-GO, dosar de calificare, CNSC"]},
  {id:"tyche",nume:"Tyche",g:"🍀",c:"#8fe36b",grup:"sfat",rol:"Coach și creștere",mit:"Zeița norocului și a prosperității cetăților.",face:["Strategie și priorități, coach la 07:30","Radar de inovații și lucrări noi (SEAP, autorizații)","Marketing: Google Business, recenzii, portofoliu"]},
  {id:"hestia",nume:"Hestia",g:"🔥",c:"#ff9e5e",grup:"aplicatii",rol:"Aplicația firmei",mit:"Zeița vetrei și a casei, focul care ține familia unită.",face:["Rapoarte zilnice, șantiere, clienți, dosare","Funcții noi, PR-uri, deploy și verificare live","GitHub + Vercel pentru firma-api.vercel.app"]},
  {id:"demeter",nume:"Demeter",g:"🌾",c:"#e9cf7a",grup:"aplicatii",rol:"Rețete, salon, frizerie",mit:"Zeița recoltei, a grânelor și a hranei.",face:["Ce mâncăm azi? — rețete după ingrediente","Style by VAJ — programări, fișe, stoc, mirese","Barber Station — barber-station-rho.vercel.app"]},
];
/* zeii de dinainte de consolidarea din 26.10.2026 -> cine le-a preluat munca (stari.json îi păstrează; harta nu-i mai arată,
   iar ce au lăsat în coada lui Zeus apare la zeul care i-a preluat; un zeu necunoscut apare cu numele lui, ca înainte) */
const PRELUAT = {athena:"plutos",metis:"plutos",themis:"dike",eunomia:"dike",nike:"dike",angelia:"iris",hermes:"iris",mnemosyne:"hefaistos",
  kratos:"kronos",hebe:"kronos",asklepios:"kronos",artemis:"tyche",eos:"tyche",peitho:"tyche",apollo:"brontes",prometheus:"brontes",hera:"brontes",
  atlas:"hestia",afrodita:"demeter",dionysos:"demeter",ananke:"zeus"};
const GRUPURI = {
  control:{label:"Control",hue:"#e8ecf5",teresa:0},
  comunicare:{label:"Comunicare",hue:"#d9a6ff",teresa:0},
  birou:{label:"Oferte și bani",hue:"#8fb3ff",teresa:1},
  lucru:{label:"Șantiere și tehnic",hue:"#7fe3d0",teresa:1},
  sfat:{label:"Sfatul înțelepților",hue:"#ff8fa3",teresa:2},
  aplicatii:{label:"Aplicațiile tale",hue:"#f3c56b",teresa:2},
};
const STARI = {
  lucreaza:{label:"Lucrează",col:"#43e0b8"},
  asteapta:{label:"Așteaptă input",col:"#ffad3b"},
  standby:{label:"Standby",col:"#6f8ae0"},
  offline:{label:"Offline",col:"#4a5677"},
};
let stare={}, coada=[], filtru=null, selectat=null;
const $=s=>document.querySelector(s);
const st=id=>(stare[id]&&STARI[stare[id].stare])?stare[id].stare:(id==="zeus"?"lucreaza":"standby");
const zeu=id=>ZEI.find(z=>z.id===id);
const cand=iso=>{if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const m=Math.round((Date.now()-d)/60000);
  if(m<1)return"acum";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";return Math.round(h/24)+" z";};
/* ultima activitate: „acum 12 min · 14:32” (azi) sau „acum 3 zile · 15.11 14:32” */
function cand2(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const m=Math.round((Date.now()-d)/60000);
  const hm=d.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"}),azi=d.toDateString()===new Date().toDateString();
  const ora=azi?hm:d.toLocaleDateString("ro-RO",{day:"2-digit",month:"2-digit"})+" "+hm;
  let r;if(m<1)r="chiar acum";else if(m<60)r="acum "+m+" min";else{const h=Math.round(m/60);if(h<24)r="acum "+h+" h";else{const z=Math.round(h/24);r="acum "+z+(z===1?" zi":" zile");}}
  return r+" · "+ora;}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};

/* ---------- cerul: stelele sunt 3 straturi de box-shadow (3 elemente, oricât de multe stele) ---------- */
(function(){let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const strat=(n,a)=>{const o=[];for(let i=0;i<n;i++)o.push(`${Math.round(r()*2400)}px ${Math.round(r()*1600)}px rgba(210,222,255,${(a*(.5+r()*.5)).toFixed(2)})`);return o.join(",");};
  $("#stA").style.boxShadow=strat(260,.8);$("#stB").style.boxShadow=strat(200,.7);$("#stC").style.boxShadow=strat(60,.9);})();

/* ---------- muntele: Zeus pe vârf, trei terase ---------- */
const TERASE=[[],[],[]];
ZEI.forEach(z=>{if(z.id==="zeus")return;const g=GRUPURI[z.grup];TERASE[g?g.teresa:2].push(z);});
const CARD={};   // id -> elementul cardului
function construieste(){
  const S=$("#summit");S.textContent="";
  const zo=el("button","zorb");zo.type="button";zo.setAttribute("aria-label","Zeus, coordonatorul. Deschide fișa.");zo.appendChild(el("span","ico","⚡"));
  const zi=el("button","zinfo");zi.type="button";
  zi.append(el("span","nm","ZEUS"),el("span","rol","Coordonatorul Olimpului · tu vorbești doar cu el"),el("span","task"),el("span","meta"));
  zo.onclick=zi.onclick=()=>{selectat="zeus";fisa();};
  S.append(zo,zi);CARD.zeus=zi;CARD.zeusOrb=zo;
  const T=$("#tiers");T.textContent="";
  TERASE.forEach((lista,i)=>{if(!lista.length)return;
    const t=el("section","tier");t.dataset.t=i;
    const h=el("h2");[...new Set(lista.map(z=>z.grup))].forEach(g=>{const sp=el("span",null,GRUPURI[g]?GRUPURI[g].label:"Alți zei");if(GRUPURI[g])sp.style.color=GRUPURI[g].hue;h.appendChild(sp);});
    const row=el("div","row");
    lista.forEach(z=>{const b=el("button","god");b.type="button";b.style.setProperty("--c",z.c);
      const e=el("span","emb");e.append(el("span","aura"),el("span","ico",z.g));
      const hd=el("span","hd");hd.append(el("span","nm",z.nume.toUpperCase()),el("span","rol",z.rol));
      const meta=el("span","meta");
      b.append(e,hd,meta,el("span","task"));
      b.onclick=()=>{selectat=z.id;fisa();};
      row.appendChild(b);CARD[z.id]=b;});
    t.append(h,row);T.appendChild(t);});
}
function actualizeaza(){
  for(const z of ZEI){const b=CARD[z.id];if(!b)continue;const s=st(z.id),info=stare[z.id]||{};
    b.classList.remove("s-lucreaza","s-asteapta","s-standby","s-offline");b.classList.add("s-"+s);
    b.classList.toggle("dim",!!(filtru&&z.id!=="zeus"&&filtru!==s));
    const meta=b.querySelector(".meta");meta.textContent="";const p=el("span","pill");p.append(el("i"),document.createTextNode(STARI[s].label));meta.appendChild(p);
    const w=cand2(info.actualizat);
    if(w){const [rel,ora]=w.split(" · "),vechi=ora.indexOf(".")>=0;   // pe telefon, la cele mai vechi de azi rămâne doar data și ora
      const sp=el("span","when"+(vechi?" vechi":""),"🕒 ");sp.append(el("span","rel",rel),el("span","sep"," · "),el("span","ora",ora));meta.appendChild(sp);}
    const tk=b.querySelector(".task");tk.textContent=info.sarcina||(z.id==="zeus"?"Primește cererile tale și le împarte zeilor.":"Fără sarcină în lucru.");tk.classList.toggle("gol",!info.sarcina);
    b.title=z.nume+" · "+STARI[s].label+(info.sarcina?" — "+info.sarcina:"");
    if(z.id!=="zeus")b.setAttribute("aria-label",z.nume+", "+z.rol+", "+STARI[s].label+(w?", "+w:"")+(info.sarcina?". "+info.sarcina:""));}
  CARD.zeusOrb.classList.add("s-"+st("zeus"));
  traseaza();
}

/* ---------- legăturile Zeus -> zei (SVG peste munte, sub carduri) ---------- */
const NS="http://www.w3.org/2000/svg";let semn="";
function traseaza(){
  const sc=$("#scene"),R=sc.getBoundingClientRect(),L=$("#links"),M=$("#mountain");
  const ctr=e=>{const r=e.getBoundingClientRect();return{x:r.left-R.left+r.width/2,y:r.top-R.top+r.height/2};};
  const z=ctr(CARD.zeusOrb);
  // vârful muntelui (y=62 din 1200 lățime) stă sub globul lui Zeus; sub munte continuă roca
  const k=M.clientWidth/1200;M.style.top=(z.y-70*k)+"px";$("#rock").style.top=(z.y-70*k+800*k-2)+"px";
  L.setAttribute("width",R.width);L.setAttribute("height",R.height);L.setAttribute("viewBox",`0 0 ${R.width} ${R.height}`);
  const linii=ZEI.filter(x=>x.id!=="zeus"&&CARD[x.id]).map(x=>{const e=CARD[x.id].querySelector(".emb"),p=ctr(e),dy=p.y-z.y;
    return{id:x.id,s:st(x.id),d:`M${z.x.toFixed(1)},${z.y.toFixed(1)} C${z.x.toFixed(1)},${(z.y+dy*.55).toFixed(1)} ${p.x.toFixed(1)},${(p.y-dy*.45).toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`};});
  const nou=JSON.stringify([linii,filtru]);if(nou===semn)return;semn=nou;
  L.textContent="";
  for(const l of linii){const col=STARI[l.s].col,dim=filtru&&filtru!==l.s?" dim":"";
    const b=document.createElementNS(NS,"path");b.setAttribute("d",l.d);b.setAttribute("class","base s-"+l.s+dim);b.setAttribute("stroke",col);L.appendChild(b);
    if(l.s==="lucreaza"||l.s==="asteapta"){
      const f=document.createElementNS(NS,"path");f.setAttribute("d",l.d);f.setAttribute("class","flow s-"+l.s+dim);f.setAttribute("stroke",col);f.style.color=col;L.appendChild(f);
      if(!reduce&&l.s==="lucreaza"&&!dim){   // scânteia care urcă de la Zeus la zeu
        const c=document.createElementNS(NS,"circle");c.setAttribute("r","3.2");c.setAttribute("fill","#eafff8");c.style.filter="drop-shadow(0 0 5px "+col+")";
        const a=document.createElementNS(NS,"animateMotion");a.setAttribute("dur",(2.2+Math.random()*.8).toFixed(2)+"s");a.setAttribute("repeatCount","indefinite");a.setAttribute("path",l.d);
        a.setAttribute("keyPoints","0;1");a.setAttribute("keyTimes","0;1");a.setAttribute("calcMode","linear");c.appendChild(a);L.appendChild(c);}}}
}
let rq=0;const programeaza=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{semn="";traseaza();});};
addEventListener("resize",programeaza);addEventListener("orientationchange",()=>setTimeout(programeaza,300));
if(window.ResizeObserver)new ResizeObserver(programeaza).observe($("#olymp"));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(programeaza);

/* ---------- UI ---------- */
function legenda(){const L=$("#legend");L.textContent="";
  for(const k of Object.keys(STARI)){const n=ZEI.filter(z=>z.id!=="zeus"&&st(z.id)===k).length;const b=el("button","chip");b.type="button";
    b.setAttribute("aria-pressed",filtru===k?"true":"false");const i=el("i");i.style.background=STARI[k].col;b.append(i,el("span",null,STARI[k].label),el("b",null,n));
    b.onclick=()=>{filtru=filtru===k?null:k;legenda();actualizeaza();};L.appendChild(b);}}
function fisa(){const C=$("#card");if(!selectat){C.hidden=true;return;}
  const z=zeu(selectat),s=st(z.id),info=stare[z.id]||{},col=z.c||STARI[s].col;C.hidden=false;C.textContent="";
  const hd=el("div","hd2");const orb=el("div","orb",z.g);orb.style.color=col;const tx=el("div");tx.append(el("h3",null,z.nume),el("div","role",z.rol));
  const x=el("button","x","×");x.type="button";x.setAttribute("aria-label","Închide");x.onclick=()=>{selectat=null;fisa();};hd.append(orb,tx,x);
  const mit=el("p","mit","În mitologie: "+z.mit);
  const pill=el("span","pill2",STARI[s].label+(info.actualizat?" · "+cand2(info.actualizat):""));pill.style.color=STARI[s].col;
  const ul=el("ul");z.face.forEach(t=>ul.appendChild(el("li",null,t)));
  const now=el("div","now");
  if(info.sarcina){now.append(el("b",null,"Acum: "),el("span",null,info.sarcina));}
  else now.textContent=z.id==="zeus"?"Tu vorbești doar cu Zeus. Toți ceilalți zei raportează doar lui.":"Nicio sarcină în lucru. Raportează doar lui Zeus.";
  C.append(hd,mit,pill,ul,now);x.focus({preventScroll:true});}
function item(col,titlu,timp,text){const d=el("div","item");d.style.borderLeftColor=col;
  const t=el("div","t");const b=el("b",null,titlu);b.style.color=col;t.append(b,el("time",null,timp));d.append(t,el("p",null,text));return d;}
function sertar(){
  const att=ZEI.filter(z=>st(z.id)==="asteapta");$("#attCount").textContent=att.length;const A=$("#attention");A.textContent="";
  if(!att.length)A.appendChild(el("div","empty","Niciun zeu nu așteaptă răspunsul tău."));
  att.forEach(z=>A.appendChild(item(STARI.asteapta.col,z.g+" "+z.nume,cand(stare[z.id]?.actualizat),stare[z.id]?.sarcina||"Are o întrebare pentru tine.")));
  const Q=$("#queue");Q.textContent="";$("#qCount").textContent=coada.length;
  if(!coada.length)Q.appendChild(el("div","empty","Coada e goală."));
  coada.forEach(q=>{const z=zeu(q.zeu)||{nume:q.zeu||"?",g:"·"};const col=q.tip==="APROBARE"?"#f3c56b":q.tip==="ÎNTREBARE"?"#ffad3b":"#6f8ae0";const fost=q.fost?` (de la ${q.fost[0].toUpperCase()+q.fost.slice(1)})`:"";Q.appendChild(item(col,`${z.g} ${z.nume}${fost} · ${q.tip||"NOTĂ"}`,cand(q.creat),q.text||""));});
  const R2=$("#roster");R2.textContent="";ZEI.forEach(z=>{const b=el("button");b.type="button";b.title=z.rol;
    const d=el("div");d.append(el("b",null,z.nume),el("small",null,z.mit));const i=el("i");i.style.background=STARI[st(z.id)].col;b.append(el("span",null,z.g),d,i);
    b.onclick=()=>{selectat=z.id;fisa();inchide();};R2.appendChild(b);});
  const nz=$("#nZei");if(nz)nz.textContent=ZEI.length+" zei";
  const n=att.length+coada.length,bd=$("#badge");bd.textContent=n;bd.hidden=!n;
}
const dr=$("#drawer"),ob=$("#openDrawer");
function deschide(){dr.classList.add("open");ob.setAttribute("aria-expanded","true");}
function inchide(){dr.classList.remove("open");ob.setAttribute("aria-expanded","false");}
ob.onclick=()=>dr.classList.contains("open")?inchide():deschide();$("#closeDrawer").onclick=inchide;
addEventListener("keydown",e=>{if(e.key==="Escape"){inchide();selectat=null;fisa();}});
function totul(){legenda();sertar();actualizeaza();if(selectat)fisa();}
construieste();totul();setInterval(totul,60000);

/* date live: stările zeilor din /olimp/stari.json (le scrie Zeus), reîmprospătate la 20 de secunde */
(function(){const live=$("#live");
  async function ia(){try{const r=await fetch("/olimp/stari.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    stare=d.zei||{};coada=(d.coada||[]).map(q=>!zeu(q.zeu)&&PRELUAT[q.zeu]?{...q,zeu:PRELUAT[q.zeu],fost:q.zeu}:q).sort((a,b)=>String(b.creat).localeCompare(String(a.creat)));
    live.classList.add("on");live.querySelector("span").textContent="live";totul();}
  catch(e){live.classList.remove("on");live.querySelector("span").textContent="fără conexiune";}}
  ia();setInterval(ia,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ia()});
})();
</script>
